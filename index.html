iptase"],"answer":0,"explanation":"Hepatitis D virus is a defective circular RNA virus that uses HBsAg as its envelope, so it can infect only people who also have hepatitis B. Coinfection occurs at the same time as acute HBV, while superinfection of a chronic HBV carrier is more severe and more likely to cause fulminant hepatitis or rapid cirrhosis. HBV vaccination prevents HDV infection.","ko":"HDV는 HBsAg를 외피로 써야 복제. 만성 HBV 보유자 중복감염이 더 심함."},{"id":"mb27","steps":["1"],"system":"Microbiology","discipline":"Microbiology","topic":"Rotavirus","stem":"An unvaccinated 10-month-old boy in daycare has had vomiting and profuse watery diarrhea without blood for 3 days during the winter. He is moderately dehydrated. Electron microscopy of the stool shows wheel-shaped viral particles.\n\nThe genome of this virus is best described as which of the following?","options":["Circular double-stranded DNA","Segmented double-stranded RNA","Single-stranded positive-sense RNA","Single-stranded DNA","Single-stranded negative-sense RNA"],"answer":1,"explanation":"Rotavirus, a reovirus with a segmented dsRNA genome and a nonenveloped wheel-shaped capsid, is a leading cause of severe watery diarrhea in infants and young children, especially in daycare and in winter. It damages villous tips and reduces absorption. An oral live vaccine is given in infancy; it carries a small risk of intussusception. Norovirus, a positive-sense ssRNA calicivirus, causes outbreaks in older children and adults.","ko":"Rotavirus: 분절 dsRNA(reovirus), 영아 수양성 설사, 경구 생백신(장중첩 위험)."},{"id":"mb28","steps":["1"],"system":"Microbiology","discipline":"Microbiology","topic":"SSPE","stem":"A 12-year-old boy who was not vaccinated has declining school performance, personality changes, and sudden jerking movements of his limbs. EEG shows periodic high-voltage complexes, and CSF shows markedly elevated antibody titers against a virus. At age 1 he had a febrile illness with cough, conjunctivitis, and a rash that started on his face.\n\nWhich of the following is the most likely diagnosis?","options":["Herpes simplex encephalitis","Rabies","Progressive multifocal leukoencephalopathy","Creutzfeldt-Jakob disease","Subacute sclerosing panencephalitis"],"answer":4,"explanation":"Measles (rubeola) is a paramyxovirus that causes cough, coryza, conjunctivitis, Koplik spots, and a rash spreading from the head downward. Years later, persistent defective virus in the brain can cause subacute sclerosing panencephalitis, a progressive and fatal disease with dementia, myoclonus, and high CSF anti-measles antibodies. Other complications include pneumonia (the most common cause of death) and encephalitis. Vitamin A reduces severity. The MMR vaccine prevents measles.","ko":"홍역 수년 후 SSPE: 인지저하·근간대경련, CSF 항홍역 항체↑. 비타민 A 투여."},{"id":"mb29","steps":["1"],"system":"Microbiology","discipline":"Microbiology","topic":"Rabies transmission","stem":"A 30-year-old man is bitten on the hand by a raccoon. Six weeks later he develops agitation, fever, difficulty swallowing, and spasms of his throat when he tries to drink water. Postmortem examination of his brain shows eosinophilic cytoplasmic inclusions in Purkinje cells and hippocampal neurons.\n\nHow did the virus reach the central nervous system?","options":["Hematogenous spread after replication in the liver","Lymphatic spread to the meninges","Anterograde transport using kinesin","Direct spread through the cribriform plate","Retrograde axonal transport along peripheral nerves using dynein"],"answer":4,"explanation":"Rabies virus, a bullet-shaped negative-sense RNA rhabdovirus, binds the nicotinic acetylcholine receptor at the bite site, then travels retrograde along peripheral nerves to the CNS by dynein-mediated transport. Longer distances from the brain mean longer incubation. It causes encephalitis with hydrophobia, agitation, and paralysis, and Negri bodies. Postexposure prophylaxis with wound cleaning, rabies immune globulin, and vaccine is effective if given before symptoms; bats are the most common source in the US.","ko":"광견병: 니코틴 수용체 결합 → dynein 역행 축삭수송 → CNS. Negri 소체. 노출 후 백신 + 면역글로불린."},{"id":"mb30","steps":["1"],"system":"Microbiology","discipline":"Diagnosis","topic":"HIV early detection","stem":"A 26-year-old man has fever, sore throat, a diffuse rash, and lymphadenopathy 3 weeks after unprotected sex with a new partner who has HIV. A fourth-generation HIV screening test is positive, while an antibody-differentiation assay is negative.\n\nWhich component detected by the screening test explains these results?","options":["Reverse transcriptase activity","gp120 antibodies","CD4 receptor binding","p24 capsid antigen","gp41 antibodies"],"answer":3,"explanation":"In acute HIV infection, a mononucleosis-like illness occurs 2 to 4 weeks after exposure, before antibodies are produced. Fourth-generation tests detect both HIV antibodies and p24 capsid antigen, which appears earlier than antibodies, so they detect infection sooner. A positive screen with a negative antibody-differentiation assay suggests acute infection and is confirmed with HIV RNA testing. Viral load is very high and infectivity is greatest at this stage.","ko":"급성 HIV: 항체 생기기 전 p24 항원(4세대 검사)으로 검출 → HIV RNA로 확인."},{"id":"mb31","steps":["1"],"system":"Microbiology","discipline":"Pharmacology","topic":"Abacavir hypersensitivity","stem":"A 32-year-old man with newly diagnosed HIV is being considered for a regimen containing abacavir.\n\nWhich test must be performed before starting this drug?","options":["HLA-B27 typing","Thiopurine methyltransferase activity","CYP2C19 genotyping","G6PD activity","HLA-B*57:01 genotyping"],"answer":4,"explanation":"Abacavir is a nucleoside reverse transcriptase inhibitor that can cause a severe, potentially fatal hypersensitivity reaction with fever, rash, GI and respiratory symptoms in people carrying HLA-B*57:01; patients are screened and carriers do not receive it. NRTIs lack a 3′-OH group and terminate the growing DNA chain. Other HLA associations include carbamazepine with HLA-B*15:02 (SJS) and allopurinol with HLA-B*58:01.","ko":"Abacavir 투여 전 HLA-B*57:01 검사 (과민반응)."},{"id":"mb32","steps":["1"],"system":"Microbiology","discipline":"Pharmacology","topic":"Ritonavir boosting","stem":"A patient's HIV regimen includes darunavir together with a low dose of ritonavir. The low ritonavir dose has little antiviral activity on its own.\n\nWhy is ritonavir included in this regimen?","options":["It inhibits integrase","It prevents lipodystrophy caused by darunavir","It increases renal excretion of uric acid","It inhibits CYP3A4, raising levels of the other protease inhibitor","It blocks viral entry through CCR5"],"answer":3,"explanation":"Ritonavir is a protease inhibitor and a strong CYP3A4 inhibitor. In low doses it boosts blood levels of other protease inhibitors such as darunavir and lopinavir, allowing less frequent dosing (cobicistat is used similarly). HIV protease cleaves the gag-pol polyprotein into functional proteins, and inhibiting it produces immature noninfectious virions. Protease inhibitors can cause hyperglycemia, lipodystrophy, and many drug interactions.","ko":"저용량 ritonavir = CYP3A4 억제 → 다른 PI 농도 상승(boosting)."},{"id":"mb33","steps":["1"],"system":"Microbiology","discipline":"Microbiology","topic":"Cryptococcal meningitis","stem":"A 38-year-old man with AIDS and a CD4+ count of 40/mm³ has 2 weeks of headache, fever, and mild confusion. Lumbar puncture shows an opening pressure of 34 cm H2O, mild lymphocytic pleocytosis, and low glucose. India ink stain of the CSF shows round yeasts surrounded by clear halos.\n\nWhich of the following is the most appropriate initial treatment?","options":["Amphotericin B plus flucytosine","Fluconazole alone","Trimethoprim-sulfamethoxazole","Caspofungin","Sulfadiazine plus pyrimethamine"],"answer":0,"explanation":"Cryptococcus neoformans is an encapsulated yeast found in pigeon droppings that causes meningitis in people with CD4+ counts below 100/mm³. The thick polysaccharide capsule appears as a halo on India ink and stains with mucicarmine; CSF cryptococcal antigen testing is sensitive. Opening pressure is often high and is managed with serial lumbar punctures. Induction therapy is amphotericin B plus flucytosine, followed by fluconazole for consolidation and maintenance. Echinocandins do not work against Cryptococcus.","ko":"크립토코쿠스 수막염: India ink 무리, 높은 개방압 → amphotericin B + flucytosine → fluconazole."},{"id":"mb34","steps":["1"],"system":"Microbiology","discipline":"Pharmacology","topic":"Amphotericin B toxicity","stem":"A 50-year-old woman with leukemia and neutropenic fever is treated with IV amphotericin B for invasive fungal infection. During infusions she has fever and rigors. After a week, her creatinine has doubled, and her serum potassium and magnesium are low.\n\nAmphotericin B kills fungi by which of the following mechanisms?","options":["Inhibiting ergosterol synthesis by blocking 14α-demethylase","Inhibiting β-glucan synthesis in the cell wall","Binding ergosterol and forming pores in the fungal membrane","Disrupting fungal microtubules","Inhibiting fungal thymidylate synthase"],"answer":2,"explanation":"Amphotericin B binds ergosterol in the fungal cell membrane and forms pores that leak ions. It also binds cholesterol in human cells, causing nephrotoxicity (reduced by saline loading and lipid formulations), hypokalemia and hypomagnesemia from tubular damage, infusion reactions, and anemia. Azoles inhibit 14α-demethylase, echinocandins inhibit β-glucan synthesis, flucytosine is converted to 5-FU, and griseofulvin disrupts microtubules.","ko":"Amphotericin B: 에르고스테롤 결합 → 막 구멍. 신독성·저K·저Mg·주입반응."},{"id":"mb35","steps":["1"],"system":"Microbiology","discipline":"Pharmacology","topic":"Azole mechanism and interactions","stem":"A 45-year-old man taking simvastatin and warfarin is prescribed oral fluconazole for esophageal candidiasis. Two weeks later his INR has risen to 5.2, and he has muscle aches.\n\nWhich of the following describes the antifungal mechanism of this drug?","options":["Inhibition of fungal cytochrome P450 14α-demethylase","Inhibition of fungal mitosis","Inhibition of β-glucan synthase","Inhibition of squalene epoxidase","Formation of pores by binding ergosterol"],"answer":0,"explanation":"Azoles (fluconazole, itraconazole, voriconazole) inhibit fungal CYP450 14α-demethylase, which converts lanosterol to ergosterol. They also inhibit human CYP450 enzymes, raising levels of warfarin, statins, and many other drugs. Ketoconazole also inhibits steroid synthesis, causing gynecomastia. Terbinafine inhibits squalene epoxidase and is used for onychomycosis.","ko":"Azole: 14α-demethylase 억제 → 에르고스테롤 합성 차단. 인체 CYP도 억제(와파린·스타틴↑)."},{"id":"mb36","steps":["1"],"system":"Microbiology","discipline":"Microbiology","topic":"Mucormycosis","stem":"A 52-year-old woman with poorly controlled diabetes is admitted with diabetic ketoacidosis. Two days later she has facial pain, swelling around her right eye, and bloody nasal discharge. Examination shows a black necrotic eschar on the nasal turbinate and palate. Biopsy shows broad, ribbon-like hyphae without septa that branch at right angles and invade blood vessels.\n\nWhich of the following is the most appropriate management?","options":["Topical nystatin","Observation and insulin alone","Surgical debridement and IV amphotericin B","Oral fluconazole","IV caspofungin alone"],"answer":2,"explanation":"Mucormycosis (Rhizopus, Mucor) causes rhinocerebral infection in patients with diabetic ketoacidosis, neutropenia, or iron overload treated with deferoxamine. The fungi thrive in acidic, high-glucose, iron-rich environments, invade blood vessels, and cause necrosis that can spread to the orbit and brain. They have broad, irregular, nonseptate hyphae branching at wide angles. Treatment is urgent surgical debridement plus amphotericin B and correction of the underlying condition.","ko":"털곰팡이증: DKA, 코·구개 흑색 괴사, 격벽 없는 넓은 균사(직각 분지) → 절제 + amphotericin B."},{"id":"mb37","steps":["1"],"system":"Microbiology","discipline":"Microbiology","topic":"Coccidioidomycosis","stem":"A 30-year-old construction worker in Arizona develops fever, cough, pleuritic chest pain, and tender red nodules on his shins 2 weeks after a dust storm. Chest x-ray shows hilar adenopathy and a small infiltrate. A biopsy of lung tissue would most likely show which of the following?","options":["Small intracellular yeasts within macrophages","Large spherules containing endospores","Septate hyphae branching at acute angles","Broad-based budding yeasts","Yeasts with multiple buds in a ship's wheel pattern"],"answer":1,"explanation":"Coccidioides immitis is endemic to the southwestern US and northern Mexico (San Joaquin Valley fever). Spores in dust are inhaled, especially after dust storms or earthquakes. Infection often causes a flulike illness with erythema nodosum and arthralgias (desert rheumatism). In tissue it forms spherules filled with endospores. Dissemination to skin, bone, and meninges is more common in immunocompromised patients, pregnant women, and some ethnic groups.","ko":"Coccidioides: 미 남서부 사막 먼지, 결절성 홍반, 조직 내 내생포자 가득한 spherule."},{"id":"mb38","steps":["1"],"system":"Microbiology","discipline":"Microbiology","topic":"Sporotrichosis","stem":"A 45-year-old gardener pricked her finger on a rose thorn 3 weeks ago. She now has a painless ulcerated nodule at the site and a chain of similar nodules extending up her forearm along the lymphatics. Biopsy shows cigar-shaped yeasts.\n\nWhich of the following is the most likely organism?","options":["Nocardia asteroides","Mycobacterium marinum","Staphylococcus aureus","Sporothrix schenckii","Blastomyces dermatitidis"],"answer":3,"explanation":"Sporothrix schenckii is a dimorphic fungus found on plants and in soil. It is introduced by thorns or splinters and causes a nodule at the inoculation site followed by ascending lymphangitic nodules (sporotrichoid spread). It appears as cigar-shaped budding yeast in tissue. Treatment is itraconazole. Mycobacterium marinum causes a similar pattern after exposure to fish tanks.","ko":"Sporothrix: 장미 가시, 림프관 따라 올라가는 결절, 시가 모양 효모 → itraconazole."},{"id":"mb39","steps":["1"],"system":"Microbiology","discipline":"Microbiology","topic":"Amebic liver abscess","stem":"A 35-year-old man who returned from Mexico 2 months ago has fever and right upper quadrant pain. Several weeks ago he had bloody diarrhea that resolved. CT shows a single large cyst in the right lobe of the liver. Aspiration yields brown, odorless fluid resembling anchovy paste.\n\nWhich of the following findings would most likely be seen on microscopy of stool from his earlier illness?","options":["Rhabditiform larvae","Operculated eggs","Acid-fast oocysts","Pear-shaped binucleate flagellated trophozoites","Trophozoites containing ingested red blood cells"],"answer":4,"explanation":"Entamoeba histolytica is transmitted through cysts in contaminated water and food. It causes amebic dysentery with flask-shaped colonic ulcers and can spread through the portal vein to cause a liver abscess filled with anchovy paste fluid. Trophozoites that have ingested red cells are characteristic. Serology helps diagnose liver abscess. Treatment is metronidazole followed by a luminal agent such as paromomycin or iodoquinol to clear cysts.","ko":"아메바: 혈성 설사 후 간농양(앤초비 페이스트), 적혈구 먹은 영양체 → metronidazole + paromomycin."},{"id":"mb40","steps":["1"],"system":"Microbiology","discipline":"Microbiology","topic":"Cerebral toxoplasmosis","stem":"A 38-year-old woman with AIDS and a CD4+ count of 60/mm³ has headache, confusion, and left arm weakness. She has two cats. MRI shows multiple ring-enhancing lesions at the gray-white junction and in the basal ganglia. Serum anti-Toxoplasma IgG is positive.\n\nWhich of the following treatments is most appropriate?","options":["Albendazole","Whole-brain radiation","Amphotericin B and flucytosine","High-dose methotrexate","Sulfadiazine and pyrimethamine with leucovorin"],"answer":4,"explanation":"Toxoplasma gondii is acquired from cat feces or undercooked meat and reactivates in people with CD4+ counts below 100/mm³, causing multiple ring-enhancing brain lesions. Treatment is sulfadiazine plus pyrimethamine, with leucovorin to prevent bone marrow suppression. Patients with CD4+ counts below 100 and positive IgG receive TMP-SMX prophylaxis. Primary CNS lymphoma (EBV-associated) usually causes a single periventricular lesion. Congenital infection causes chorioretinitis, hydrocephalus, and intracranial calcifications.","ko":"톡소포자충 뇌병변(CD4 \u003c100): 다발성 고리 조영 → sulfadiazine + pyrimethamine. 예방 TMP-SMX."},{"id":"mb41","steps":["1"],"system":"Microbiology","discipline":"Microbiology","topic":"Neurocysticercosis","stem":"A 28-year-old man who emigrated from Guatemala has a first generalized seizure. CT shows multiple small cystic brain lesions, some calcified, and one containing an eccentric dot. He does not eat pork, but a household member has intestinal tapeworm infection.\n\nHow did this patient most likely acquire his infection?","options":["Eating undercooked pork containing larval cysts","Ingestion of tapeworm eggs from human feces","Skin penetration by larvae in soil","Bite of an infected mosquito","Eating undercooked freshwater fish"],"answer":1,"explanation":"Taenia solium has two forms of disease. Eating undercooked pork containing larvae (cysticerci) causes intestinal tapeworm infection. Ingesting eggs shed in human feces (fecal-oral) causes cysticercosis, in which larvae encyst in tissues including the brain. Neurocysticercosis is a leading cause of acquired epilepsy worldwide. Treatment is albendazole (with steroids) for active cysts and antiepileptics; praziquantel treats the intestinal tapeworm.","ko":"유구조충: 돼지고기 낭미충 → 장내 조충, 사람 분변 속 알 → 낭미충증(뇌). Albendazole."},{"id":"mb42","steps":["1"],"system":"Microbiology","discipline":"Microbiology","topic":"Schistosoma haematobium","stem":"A 40-year-old man who grew up near the Nile River in Egypt has painless hematuria. Cystoscopy shows a bladder mass, and biopsy shows invasive squamous cell carcinoma with calcified eggs that have a terminal spine in the bladder wall.\n\nHow did he acquire the infection associated with this cancer?","options":["Bite of a sandfly","Ingestion of eggs in contaminated food","Skin penetration by cercariae in fresh water","Ingestion of undercooked fish","Inhalation of eggs in dust"],"answer":2,"explanation":"Schistosoma haematobium is acquired when cercariae released by freshwater snails penetrate the skin. Adult worms live in the venous plexus of the bladder, and eggs with a terminal spine cause granulomatous inflammation, fibrosis, hematuria, and squamous cell carcinoma of the bladder. S. mansoni and S. japonicum cause portal hypertension through granulomas in the liver. Treatment is praziquantel.","ko":"S. haematobium: 담수에서 피부 침투, 방광 편평세포암, 끝 가시 알 → praziquantel."},{"id":"mb43","steps":["1"],"system":"Microbiology","discipline":"Microbiology","topic":"Chagas disease","stem":"A 45-year-old woman from rural Bolivia has progressive dyspnea and palpitations. Echocardiography shows four-chamber dilation with an apical aneurysm. She also has difficulty swallowing and severe constipation, and barium studies show a dilated esophagus and colon.\n\nWhich of the following transmitted this infection?","options":["Tsetse fly","Sandfly","Anopheles mosquito","Ixodes tick","Reduviid (kissing) bug"],"answer":4,"explanation":"Trypanosoma cruzi is transmitted when the feces of a reduviid bug are rubbed into the bite or the eye (causing Romaña sign, unilateral eyelid swelling). Chronic Chagas disease destroys cardiac muscle and enteric nerve plexuses, causing dilated cardiomyopathy with apical aneurysm, megaesophagus (secondary achalasia), and megacolon. Treatment is benznidazole or nifurtimox. Tsetse flies transmit African sleeping sickness, and sandflies transmit leishmaniasis.","ko":"Chagas(T. cruzi): 침노린재, 확장성 심근병증·거대식도·거대결장 → benznidazole."},{"id":"mb44","steps":["1"],"system":"Microbiology","discipline":"Microbiology","topic":"Babesiosis","stem":"A 66-year-old man who had a splenectomy after a car crash develops fever, fatigue, and dark urine 2 weeks after hiking on Nantucket Island in summer. He has hemolytic anemia. The blood smear shows small intraerythrocytic ring forms and a few tetrads arranged in a cross pattern.\n\nWhich of the following is the most likely organism?","options":["Anaplasma phagocytophilum","Borrelia burgdorferi","Plasmodium falciparum","Babesia microti","Ehrlichia chaffeensis"],"answer":3,"explanation":"Babesia microti, transmitted by Ixodes ticks in the northeastern US, infects red cells and causes hemolytic anemia and fever. It is most severe in asplenic, older, and immunocompromised patients. The smear shows ring forms and Maltese cross tetrads, without the gametocytes and pigment seen in malaria. Treatment is atovaquone plus azithromycin. Ixodes ticks can transmit Lyme disease and anaplasmosis at the same time.","ko":"Babesia: Ixodes 진드기, 무비장 환자 중증 용혈, Maltese cross → atovaquone + azithromycin."},{"id":"mb45","steps":["1"],"system":"Microbiology","discipline":"Microbiology","topic":"MRSA resistance","stem":"A 30-year-old man has a large abscess on his thigh. Culture grows Staphylococcus aureus that is resistant to oxacillin, nafcillin, and cephalexin.\n\nWhich of the following best explains this resistance?","options":["Altered penicillin-binding protein with low affinity for β-lactams","Efflux pump that removes β-lactams","Production of a β-lactamase that is inhibited by clavulanate","Decreased porin channels in the outer membrane","Modification of the D-Ala-D-Ala terminus"],"answer":0,"explanation":"Methicillin-resistant S. aureus carries the mecA gene, which encodes PBP2a, a penicillin-binding protein with low affinity for nearly all β-lactams, so penicillinase-resistant penicillins and most cephalosporins do not work. Ceftaroline is an exception. MRSA is treated with vancomycin, daptomycin, linezolid, or, for skin infections, TMP-SMX, doxycycline, or clindamycin. Penicillinase production is overcome by nafcillin or β-lactamase inhibitors.","ko":"MRSA = mecA → PBP2a(β-lactam 친화도↓). 치료: vancomycin, daptomycin, linezolid, ceftaroline."},{"id":"mb46","steps":["1"],"system":"Microbiology","discipline":"Pharmacology","topic":"TMP-SMX hyperkalemia","stem":"A 72-year-old man with chronic kidney disease taking lisinopril is started on high-dose trimethoprim-sulfamethoxazole for Pneumocystis pneumonia. Four days later, his serum potassium is 6.4 mEq/L.\n\nTrimethoprim causes hyperkalemia by a mechanism similar to which of the following drugs?","options":["Hydrochlorothiazide","Amiloride","Acetazolamide","Furosemide","Mannitol"],"answer":1,"explanation":"Trimethoprim blocks the epithelial sodium channel in the collecting duct, as amiloride does. Less sodium reabsorption reduces the negative luminal charge that drives potassium secretion, so potassium rises, especially with high doses, kidney disease, or ACE inhibitors. Trimethoprim also competes with creatinine secretion, raising creatinine without lowering GFR. TMP-SMX inhibits sequential steps of folate synthesis (dihydropteroate synthase and dihydrofolate reductase).","ko":"Trimethoprim = ENaC 차단(amiloride 유사) → 고칼륨. 크레아티닌 분비도 억제."},{"id":"mb47","steps":["1"],"system":"Microbiology","discipline":"Pharmacology","topic":"Linezolid","stem":"A 60-year-old woman with vancomycin-resistant Enterococcus faecium bacteremia is treated with an oral antibiotic. She also takes sertraline. Three days later she is agitated and tremulous, with fever, diarrhea, and clonus.\n\nWhich of the following best describes the antibiotic's mechanism of action?","options":["Binding the 23S rRNA of the 50S subunit and preventing formation of the initiation complex","Binding the 30S subunit and blocking aminoacyl-tRNA attachment","Inhibiting DNA gyrase","Binding D-Ala-D-Ala","Disrupting the cell membrane by inserting a lipopeptide"],"answer":0,"explanation":"Linezolid binds the 23S rRNA of the 50S ribosomal subunit and prevents formation of the 70S initiation complex. It treats gram-positive infections including MRSA and VRE. It weakly inhibits monoamine oxidase, so it can cause serotonin syndrome with SSRIs, and prolonged use causes thrombocytopenia and optic or peripheral neuropathy. Daptomycin is a lipopeptide that depolarizes the membrane, and tetracyclines block aminoacyl-tRNA attachment at the 30S subunit.","ko":"Linezolid: 50S 23S rRNA, 개시복합체 형성 억제, VRE·MRSA. MAO 억제 → SSRI와 세로토닌 증후군."},{"id":"mb48","steps":["1"],"system":"Microbiology","discipline":"Microbiology","topic":"Rocky Mountain spotted fever","stem":"An 8-year-old boy from North Carolina has fever, severe headache, and muscle aches 5 days after a camping trip in June. Two days later, a maculopapular rash appears on his wrists and ankles and spreads to his trunk, palms, and soles. Platelet count is 82,000/mm³ and sodium is 129 mEq/L.\n\nWhich of the following is the most appropriate treatment?","options":["Supportive care only because he is a child","Azithromycin","Amoxicillin","Doxycycline","Ceftriaxone"],"answer":3,"explanation":"Rocky Mountain spotted fever is caused by Rickettsia rickettsii, transmitted by Dermacentor ticks, most often in the southeastern and south-central US. Rickettsiae infect endothelial cells, causing vasculitis with a rash that starts on wrists and ankles and spreads centrally to include the palms and soles, along with thrombocytopenia and hyponatremia. Doxycycline is the treatment for all ages, including children, because the benefit outweighs the risk of tooth staining and untreated disease can be fatal.","ko":"RMSF: 손목·발목에서 시작해 중심부·손발바닥으로 퍼지는 발진 → 소아도 doxycycline."},{"id":"mb49","steps":["1"],"system":"Microbiology","discipline":"Pharmacology","topic":"Rifampin mechanism","stem":"A 40-year-old woman beginning treatment for active tuberculosis notices that her urine, sweat, and tears have turned orange-red. She is advised that one of her drugs will reduce the effectiveness of her oral contraceptive.\n\nThis drug inhibits which of the following?","options":["Arabinosyl transferase","The 30S ribosomal subunit","DNA gyrase","Bacterial DNA-dependent RNA polymerase","Mycolic acid synthesis"],"answer":3,"explanation":"Rifampin inhibits bacterial DNA-dependent RNA polymerase (the β subunit), blocking transcription. Resistance develops quickly from mutations in rpoB when it is used alone, except for short-term prophylaxis. It colors body fluids orange-red, causes hepatotoxicity, and strongly induces CYP450 enzymes, reducing levels of drugs such as warfarin, oral contraceptives, and HIV protease inhibitors. It is also used for meningococcal prophylaxis.","ko":"Rifampin: RNA 중합효소 억제, 주황색 체액, 강력한 CYP 유도(피임약·와파린 효과↓)."},{"id":"mb50","steps":["1"],"system":"Microbiology","discipline":"Pharmacology","topic":"Isoniazid resistance","stem":"A Mycobacterium tuberculosis isolate is resistant to isoniazid. Sequencing shows that the gene encoding the bacterial catalase-peroxidase enzyme is mutated.\n\nWhy does this mutation cause resistance?","options":["The enzyme synthesizes the cell wall component that isoniazid blocks","The enzyme is needed to convert isoniazid into its active form","The enzyme is the target that isoniazid binds","The enzyme degrades isoniazid","The enzyme pumps isoniazid out of the cell"],"answer":1,"explanation":"Isoniazid is a prodrug activated by the mycobacterial catalase-peroxidase KatG. The active form inhibits InhA and blocks mycolic acid synthesis. Mutations in katG prevent activation, and mutations in inhA alter the target. Isoniazid causes hepatotoxicity, peripheral neuropathy and sideroblastic anemia from vitamin B6 deficiency (prevented with pyridoxine), and drug-induced lupus, especially in slow acetylators.","ko":"Isoniazid는 KatG가 활성화하는 전구약물 → mycolic acid 합성 억제. katG 변이 = 내성."},{"id":"mb51","steps":["1"],"system":"Microbiology","discipline":"Pharmacology","topic":"Ethambutol","stem":"A 50-year-old man has been on four-drug therapy for pulmonary tuberculosis for 2 months. He now has blurred vision in both eyes and cannot distinguish red from green on color plates.\n\nThe drug responsible inhibits which of the following?","options":["Arabinosyl transferase","Topoisomerase IV","DNA-dependent RNA polymerase","Mycolic acid synthesis","Pyrazinamidase"],"answer":0,"explanation":"Ethambutol inhibits arabinosyl transferase, decreasing arabinogalactan in the mycobacterial cell wall. Its main adverse effect is dose-related optic neuritis, with decreased visual acuity and red-green color blindness, so vision is monitored. Pyrazinamide causes hyperuricemia and hepatotoxicity, rifampin colors fluids orange, and isoniazid causes neuropathy and hepatitis.","ko":"Ethambutol: arabinosyl transferase 억제, 시신경염(적록색맹)."},{"id":"mb52","steps":["1"],"system":"Microbiology","discipline":"Microbiology","topic":"Gonococcal reinfection","stem":"A 24-year-old man is treated for gonococcal urethritis for the third time in 2 years. He asks why he does not become immune after repeated infections.\n\nWhich of the following best explains the lack of lasting immunity?","options":["Absence of a cell wall","Antigenic variation of pilus proteins","Intracellular survival in macrophages","Production of a polysaccharide capsule","Secretion of a superantigen"],"answer":1,"explanation":"Neisseria gonorrhoeae changes the sequences of its pilus (pilin) and Opa proteins through gene recombination, so antibodies from earlier infections do not recognize new variants. This allows repeated infections and has prevented development of a vaccine. Unlike N. meningitidis, it has no polysaccharide capsule and does not ferment maltose. Treatment is ceftriaxone, plus treatment for chlamydia if it has not been excluded.","ko":"임균 재감염 반복 = 선모(pili) 항원 변이. 백신 없음. 치료 ceftriaxone."},{"id":"mb53","steps":["1"],"system":"Microbiology","discipline":"Microbiology","topic":"Anthrax","stem":"A 45-year-old man who works with imported goat hides develops a painless papule on his forearm that becomes an ulcer with a black necrotic center and surrounding edema. Culture grows large gram-positive rods in long chains that form spores.\n\nWhich feature of this organism is unique among bacteria?","options":["A toxin that ADP-ribosylates Gs","A cell wall containing mycolic acids","A capsule made of D-glutamic acid polypeptide instead of polysaccharide","Absence of peptidoglycan","An outer membrane with lipopolysaccharide"],"answer":2,"explanation":"Bacillus anthracis is the only bacterium with a polypeptide capsule (poly-D-glutamate), which resists phagocytosis. Its toxins include edema factor, an adenylyl cyclase that raises cAMP and causes edema, and lethal factor, a protease that inactivates MAP kinase kinase. Cutaneous anthrax causes a painless black eschar, and inhalational anthrax causes hemorrhagic mediastinitis with a widened mediastinum. Treatment is ciprofloxacin or doxycycline.","ko":"탄저균: 유일한 폴리펩타이드(D-글루탐산) 피막, 무통성 검은 가피, edema factor = adenylyl cyclase."},{"id":"mb54","steps":["1"],"system":"Microbiology","discipline":"Microbiology","topic":"Pertussis toxin","stem":"An unvaccinated 4-month-old girl has paroxysms of coughing followed by a high-pitched inspiratory whoop and vomiting for 2 weeks. Leukocyte count is 42,000/mm³ with 80% small mature lymphocytes.\n\nThe toxin of the causative organism acts by which of the following mechanisms?","options":["Inhibition of elongation factor 2","Cleavage of SNARE proteins","ADP-ribosylation of Gi, preventing inhibition of adenylyl cyclase","ADP-ribosylation of Gs, permanently activating it","Inactivation of the 60S ribosomal subunit"],"answer":2,"explanation":"Bordetella pertussis toxin ADP-ribosylates Gi, so Gi can no longer inhibit adenylyl cyclase, and cAMP rises. This impairs phagocyte function and blocks lymphocytes from leaving the blood, causing marked lymphocytosis. Pertussis has catarrhal, paroxysmal (whooping), and convalescent stages and is most dangerous in young infants. Treatment is a macrolide, and prevention is acellular vaccination, including during each pregnancy.","ko":"백일해 독소: Gi ADP-ribosylation → 아데닐산고리화효소 억제 해제 → cAMP↑, 림프구증가."},{"id":"mb55","steps":["1"],"system":"Microbiology","discipline":"Microbiology","topic":"Pneumococcus identification","stem":"Blood cultures from a 70-year-old man with lobar pneumonia grow gram-positive lancet-shaped diplococci that are α-hemolytic on blood agar.\n\nWhich of the following laboratory findings would distinguish this organism from viridans group streptococci?","options":["Catalase positivity","Resistance to optochin","Sensitivity to optochin and solubility in bile","Positive CAMP test","Growth in 6.5% sodium chloride"],"answer":2,"explanation":"Streptococcus pneumoniae and viridans streptococci are both α-hemolytic and catalase-negative. S. pneumoniae is optochin-sensitive and bile-soluble, while viridans streptococci are optochin-resistant and bile-insoluble. Pneumococcus has a polysaccharide capsule (the main virulence factor and vaccine target) and IgA protease. It is the most common cause of community-acquired pneumonia, meningitis in adults, and otitis media.","ko":"폐렴구균: α용혈, optochin 감수성·담즙 용해 (viridans는 내성·불용)."},{"id":"mb56","steps":["1"],"system":"Microbiology","discipline":"Microbiology","topic":"Typhoid fever","stem":"A 25-year-old woman returns from Bangladesh with 10 days of rising fever, abdominal pain, and constipation. Her pulse is 72/min despite a temperature of 39.8°C (103.6°F). She has a few faint salmon-colored macules on her abdomen and an enlarged spleen. Blood culture grows a gram-negative rod that does not ferment lactose and produces hydrogen sulfide.\n\nAfter recovery, where is this organism most likely to persist in a chronic carrier?","options":["Kidney","Gallbladder","Bone marrow only","Lungs","Lymph nodes of the neck"],"answer":1,"explanation":"Salmonella Typhi causes typhoid fever, with gradually rising fever, relative bradycardia, rose spots, abdominal pain, and hepatosplenomegaly. It invades through Peyer patches and survives in macrophages. Chronic carriers harbor it in the gallbladder, especially when gallstones are present, and shed it in stool. Typhi is spread only by humans, has a Vi capsule, and is treated with ceftriaxone, azithromycin, or fluoroquinolones depending on resistance.","ko":"장티푸스: 상대적 서맥·장미진, H2S(+) 비유당발효, 만성 보균은 담낭."},{"id":"mb57","steps":["1"],"system":"Microbiology","discipline":"Microbiology","topic":"Vibrio vulnificus","stem":"A 58-year-old man with alcoholic cirrhosis develops fever, hypotension, and large hemorrhagic bullae on his legs 1 day after eating raw oysters at a Gulf Coast restaurant.\n\nWhich of the following is the most likely organism?","options":["Pseudomonas aeruginosa","Vibrio cholerae","Vibrio vulnificus","Staphylococcus aureus","Streptococcus pyogenes"],"answer":2,"explanation":"Vibrio vulnificus is a curved gram-negative rod in warm seawater and shellfish. In people with liver disease or iron overload (such as hemochromatosis), it can cause rapidly fatal sepsis with hemorrhagic bullae after eating raw oysters, or necrotizing wound infection after seawater exposure. Treatment is doxycycline plus a third-generation cephalosporin with surgical debridement when needed.","ko":"간경변·철과잉 + 생굴 → V. vulnificus 패혈증·출혈성 수포."},{"id":"mb58","steps":["1"],"system":"Microbiology","discipline":"Pathology","topic":"Creutzfeldt-Jakob disease","stem":"A 62-year-old woman has rapidly progressive memory loss and confusion over 4 months, along with sudden jerking movements of her limbs triggered by noise. EEG shows periodic sharp-wave complexes, and CSF 14-3-3 protein is elevated. She dies 2 months later.\n\nWhich of the following would most likely be seen in her brain at autopsy?","options":["Lewy bodies in the substantia nigra","Spongiform vacuolization of the cortex without inflammation","Neurofibrillary tangles and amyloid plaques","Perivascular lymphocytic cuffing with Negri bodies","Demyelinating plaques in periventricular white matter"],"answer":1,"explanation":"Creutzfeldt-Jakob disease is a prion disease in which normal prion protein (PrPc, mostly α-helical) is converted to a misfolded β-pleated sheet form (PrPSc) that resists proteases. It causes rapidly progressive dementia with startle myoclonus, periodic sharp waves on EEG, elevated 14-3-3 protein, and spongiform encephalopathy without inflammation. Most cases are sporadic, and prions are not destroyed by standard sterilization.","ko":"CJD: 급속 진행 치매 + 놀람 근간대경련, 14-3-3, 해면상 변화(염증 없음), β병풍 PrPSc."},{"id":"mb59","steps":["1"],"system":"Microbiology","discipline":"Microbiology","topic":"Nocardia vs Actinomyces","stem":"A 55-year-old kidney transplant recipient has fever, cough, and a cavitary lung lesion, and a week later develops a brain abscess. Sputum shows branching, beaded, gram-positive filaments that are weakly acid-fast. The organism grows aerobically.\n\nWhich of the following is the most appropriate treatment?","options":["Fluconazole","Isoniazid, rifampin, pyrazinamide, and ethambutol","Metronidazole","Trimethoprim-sulfamethoxazole","Penicillin G"],"answer":3,"explanation":"Nocardia is an aerobic, weakly acid-fast, branching gram-positive bacterium found in soil. It causes pulmonary infection in immunocompromised patients that can spread to the brain and skin. Treatment is TMP-SMX (Nocardia: Sulfonamides). Actinomyces is an anaerobic, non-acid-fast branching organism of oral flora that causes cervicofacial abscesses with sinus tracts and sulfur granules after dental work and is treated with penicillin (Actinomyces: Penicillin).","ko":"Nocardia: 호기성·약한 항산성, 폐→뇌 → TMP-SMX. Actinomyces: 혐기성·황과립 → 페니실린."},{"id":"mk01","steps":["1"],"system":"MSK & Skin","discipline":"Anatomy","topic":"Radial nerve injury","stem":"A 30-year-old man falls from a ladder and fractures the shaft of his right humerus. Afterward, he cannot extend his wrist or fingers, and he has decreased sensation over the dorsum of his hand near the base of the thumb. Elbow extension is preserved.\n\nWhich nerve is most likely injured?","options":["Musculocutaneous nerve","Median nerve","Ulnar nerve","Radial nerve","Axillary nerve"],"answer":3,"explanation":"The radial nerve runs in the radial (spiral) groove of the humerus, where midshaft fractures can injure it, causing wrist drop and loss of sensation over the dorsal hand at the base of the thumb. Triceps function is usually preserved because its branches leave the nerve proximal to the groove. Radial nerve compression in the axilla (crutches) or arm (Saturday night palsy) causes similar findings.","ko":"상완골 간부 골절 → 요골신경(나선고랑) → wrist drop. 삼두근은 보존."},{"id":"mk02","steps":["1"],"system":"MSK & Skin","discipline":"Anatomy","topic":"Axillary nerve injury","stem":"A 72-year-old woman falls on her outstretched hand and fractures the surgical neck of her left humerus. After healing, she has weakness when abducting her arm beyond 15 degrees and a patch of numbness over the lateral shoulder.\n\nWhich of the following nerves was most likely injured?","options":["Radial nerve","Axillary nerve","Long thoracic nerve","Musculocutaneous nerve","Suprascapular nerve"],"answer":1,"explanation":"The axillary nerve (C5 to C6) wraps around the surgical neck of the humerus with the posterior circumflex humeral artery and can be injured by surgical neck fractures or anterior shoulder dislocations. It supplies the deltoid (abduction from 15 to 90 degrees) and teres minor, and provides sensation over the lateral shoulder (regimental badge area). The supraspinatus initiates abduction from 0 to 15 degrees.","ko":"상완골 외과경 골절·전방 탈구 → 액와신경 → 삼각근 약화 + 어깨 외측 감각 소실."},{"id":"mk03","steps":["1"],"system":"MSK & Skin","discipline":"Anatomy","topic":"Ulnar nerve injury","stem":"A 40-year-old man has numbness of his little finger and the medial half of his ring finger after leaning on his elbows at a desk for months. He has weakness spreading his fingers and wasting between the metacarpals. When he tries to extend his fingers, the fourth and fifth fingers stay flexed at the interphalangeal joints.\n\nWhich nerve is most likely compressed?","options":["Radial nerve in the spiral groove","Ulnar nerve at the medial epicondyle","Median nerve in the carpal tunnel","Musculocutaneous nerve","Anterior interosseous nerve"],"answer":1,"explanation":"The ulnar nerve passes behind the medial epicondyle, where it can be injured by fracture or chronic pressure. It supplies most intrinsic hand muscles (interossei and the medial lumbricals) and sensation to the medial one and a half fingers. Loss of the medial lumbricals causes claw hand of the fourth and fifth digits when the fingers are extended. A proximal lesion produces less clawing than a distal lesion at the wrist (ulnar paradox).","ko":"척골신경(내측상과): 4·5지 감각 소실, 골간근 위축, 4·5지 갈퀴손."},{"id":"mk04","steps":["1"],"system":"MSK & Skin","discipline":"Anatomy","topic":"Carpal tunnel syndrome","stem":"A 34-year-old pregnant woman has numbness and tingling of her thumb, index, and middle fingers that wakes her at night and improves when she shakes her hand. Tapping over the volar wrist reproduces the tingling. There is mild wasting of the thenar eminence, and sensation over the thenar eminence itself is normal.\n\nWhich of the following best explains why the thenar skin is spared?","options":["The recurrent branch of the median nerve supplies the skin","The thenar skin is supplied by the radial nerve","The thenar skin has dual innervation from C8 and T1","The palmar cutaneous branch of the median nerve passes superficial to the carpal tunnel","The ulnar nerve supplies the thenar skin"],"answer":3,"explanation":"Carpal tunnel syndrome is compression of the median nerve under the flexor retinaculum, associated with pregnancy, hypothyroidism, rheumatoid arthritis, diabetes, and repetitive use. It causes paresthesias in the lateral three and a half fingers and weakness of the thenar muscles supplied by the recurrent branch. The palmar cutaneous branch leaves the nerve proximal to the wrist and runs over the retinaculum, so sensation over the thenar eminence is preserved. Tinel and Phalen signs are positive.","ko":"수근관증후군: 정중신경, 손바닥 피부가지는 수근관 위로 지나 무지구 감각 보존."},{"id":"mk05","steps":["1"],"system":"MSK & Skin","discipline":"Anatomy","topic":"Long thoracic nerve","stem":"A 50-year-old woman undergoes a right mastectomy with axillary lymph node dissection. Afterward, her right scapula protrudes from her back when she pushes against a wall, and she cannot raise her arm above her head.\n\nWhich of the following nerves was most likely injured?","options":["Dorsal scapular nerve","Spinal accessory nerve","Thoracodorsal nerve","Axillary nerve","Long thoracic nerve"],"answer":4,"explanation":"The long thoracic nerve (C5 to C7) runs on the surface of the serratus anterior and is at risk during axillary dissection, mastectomy, or penetrating injury. The serratus anterior holds the scapula against the chest wall and rotates it upward, so injury causes winging of the scapula and inability to abduct the arm above the horizontal. The thoracodorsal nerve supplies the latissimus dorsi.","ko":"장흉신경 손상(유방절제·액와 박리) → 전거근 마비 → 익상견갑."},{"id":"mk06","steps":["1"],"system":"MSK & Skin","discipline":"Anatomy","topic":"Erb palsy","stem":"A newborn is delivered after a difficult vaginal delivery complicated by shoulder dystocia. His right arm hangs at his side, adducted and internally rotated, with the elbow extended and the forearm pronated. His grasp reflex is intact.\n\nWhich of the following is most likely injured?","options":["Long thoracic nerve","Lower trunk of the brachial plexus (C8 to T1)","Radial nerve","Posterior cord of the brachial plexus","Upper trunk of the brachial plexus (C5 to C6)"],"answer":4,"explanation":"Erb palsy results from excessive lateral traction of the neck that injures the upper trunk (C5 and C6). Weakness of the deltoid and supraspinatus (abduction), infraspinatus (lateral rotation), and biceps (flexion and supination) produces the waiter's tip posture. Klumpke palsy injures the lower trunk (C8 and T1) when the arm is pulled up, causing claw hand and sometimes Horner syndrome.","ko":"Erb 마비(C5-6, 견갑난산) = waiter's tip. Klumpke(C8-T1) = 갈퀴손."},{"id":"mk07","steps":["1"],"system":"MSK & Skin","discipline":"Anatomy","topic":"Common fibular nerve","stem":"A 25-year-old soccer player is kicked on the lateral side of his left knee and fractures the neck of the fibula. Afterward, he cannot dorsiflex or evert his foot, and he drags his toes when walking. Sensation is decreased over the dorsum of the foot.\n\nWhich nerve is most likely injured?","options":["Obturator nerve","Tibial nerve","Common fibular (peroneal) nerve","Superior gluteal nerve","Femoral nerve"],"answer":2,"explanation":"The common fibular nerve wraps around the neck of the fibula, where it is vulnerable to fracture, direct trauma, casts, and leg crossing. The deep branch supplies the dorsiflexors and the superficial branch supplies the evertors, so injury causes foot drop, a steppage gait, and loss of sensation over the dorsum of the foot. Tibial nerve injury causes inability to plantarflex and invert the foot.","ko":"비골두/경 손상 → 총비골신경 → foot drop(배굴·외번 불가)."},{"id":"mk08","steps":["1"],"system":"MSK & Skin","discipline":"Anatomy","topic":"Supraspinatus tear","stem":"A 58-year-old house painter has pain in his right shoulder that worsens when he reaches overhead. He has difficulty initiating abduction of his arm. Pain and weakness occur when he resists downward pressure with his arm abducted to 90 degrees, angled forward, and internally rotated with the thumb pointing down.\n\nWhich muscle is most likely injured?","options":["Supraspinatus","Infraspinatus","Teres minor","Deltoid","Subscapularis"],"answer":0,"explanation":"The supraspinatus is the most commonly injured rotator cuff muscle, often impinged under the acromion. It initiates abduction (0 to 15 degrees) and is tested with the empty can test. The infraspinatus and teres minor externally rotate the arm, and the subscapularis internally rotates it. The supraspinatus and infraspinatus are innervated by the suprascapular nerve, the teres minor by the axillary nerve, and the subscapularis by the subscapular nerves.","ko":"극상근: 외전 시작(0~15°), empty can test, 회전근개 손상 최다."},{"id":"mk09","steps":["1"],"system":"MSK & Skin","discipline":"Pathology","topic":"Rheumatoid arthritis","stem":"A 45-year-old woman has had pain and swelling of both wrists and the MCP and PIP joints of both hands for 4 months. She has morning stiffness lasting over an hour. The DIP joints are spared. Anti-cyclic citrullinated peptide antibodies are positive.\n\nWhich of the following is the first-line disease-modifying drug for her condition?","options":["Allopurinol","Methotrexate","Prednisone alone","Indomethacin alone","Colchicine"],"answer":1,"explanation":"Rheumatoid arthritis is an autoimmune symmetric inflammatory polyarthritis of the MCP, PIP, and wrist joints, typically sparing the DIP joints. Synovial inflammation forms a pannus that erodes cartilage and bone. Anti-CCP is the most specific antibody, and the disease is associated with HLA-DR4. Methotrexate, a dihydrofolate reductase inhibitor, is the first-line DMARD; TNF-α inhibitors and other biologics are added when needed. Steroids and NSAIDs relieve symptoms but do not prevent joint damage.","ko":"류마티스 관절염: MCP·PIP 대칭, DIP 보존, anti-CCP, HLA-DR4 → methotrexate."},{"id":"mk10","steps":["1"],"system":"MSK & Skin","discipline":"Pathology","topic":"Osteoarthritis","stem":"A 68-year-old woman has pain in her knees and hands that worsens with use and improves with rest. Morning stiffness lasts 10 minutes. She has bony enlargement of the DIP and PIP joints. Knee x-rays show joint space narrowing, osteophytes, and subchondral sclerosis.\n\nWhich of the following is the primary underlying process?","options":["Mechanical wear of articular cartilage with failed repair","Immune complex deposition in the synovium","Autoimmune synovial inflammation forming a pannus","Deposition of monosodium urate crystals","Infection of the joint space"],"answer":0,"explanation":"Osteoarthritis is degeneration of articular cartilage from mechanical stress, aging, obesity, and joint injury, with chondrocytes failing to repair the matrix. It affects weight-bearing joints and the DIP (Heberden nodes) and PIP (Bouchard nodes) joints, with pain that worsens with activity and brief morning stiffness. X-rays show joint space narrowing, osteophytes, subchondral sclerosis, and cysts. Rheumatoid arthritis spares the DIP joints and causes long morning stiffness.","ko":"골관절염: 연골 퇴행, 사용 시 통증, 아침강직 짧음, Heberden(DIP)·Bouchard(PIP)."},{"id":"mk11","steps":["1"],"system":"MSK & Skin","discipline":"Pharmacology","topic":"Gout and colchicine","stem":"A 56-year-old man who drinks beer daily wakes with severe pain, redness, and swelling of his right big toe. Joint aspiration shows needle-shaped crystals that are negatively birefringent under polarized light. He cannot take NSAIDs because of chronic kidney disease, so colchicine is prescribed.\n\nColchicine acts by which of the following mechanisms?","options":["Converting uric acid to allantoin","Inhibiting cyclooxygenase","Increasing renal uric acid excretion","Inhibiting microtubule polymerization in neutrophils","Inhibiting xanthine oxidase"],"answer":3,"explanation":"Gout is caused by deposition of monosodium urate crystals, which are needle-shaped and negatively birefringent (yellow when parallel to the axis of the compensator). Risk factors include alcohol, red meat, thiazides, kidney disease, and cell turnover. Colchicine binds tubulin and inhibits microtubule polymerization, blocking neutrophil migration and degranulation; it causes diarrhea. Allopurinol and febuxostat inhibit xanthine oxidase for long-term prevention but are not started during an acute flare without anti-inflammatory coverage.","ko":"통풍: 바늘 모양 음성 복굴절 결정. Colchicine = 호중구 미세소관 중합 억제."},{"id":"mk12","steps":["1"],"system":"MSK & Skin","discipline":"Pathology","topic":"Pseudogout","stem":"A 74-year-old woman has acute pain and swelling of her right knee. X-ray shows linear calcification of the meniscal cartilage. Joint fluid analysis shows rhomboid-shaped crystals that are weakly positively birefringent.\n\nThis condition is associated with which of the following?","options":["Chlamydia infection","Thiazide diuretic use and high purine diet","HLA-B27","Anti-CCP antibodies","Hemochromatosis and hyperparathyroidism"],"answer":4,"explanation":"Pseudogout is caused by calcium pyrophosphate dihydrate crystals, which are rhomboid and weakly positively birefringent (blue when parallel). It typically affects the knee in older adults, and x-rays show chondrocalcinosis. It is associated with hemochromatosis, hyperparathyroidism, hypomagnesemia, and hypophosphatasia. Gout is associated with thiazides and purines, and HLA-B27 with seronegative spondyloarthropathies.","ko":"가성통풍: 사각형 약양성 복굴절(CPPD), 연골석회화, 혈색소증·부갑상선항진증."},{"id":"mk13","steps":["1"],"system":"MSK & Skin","discipline":"Immunology","topic":"Ankylosing spondylitis","stem":"A 24-year-old man has had low back pain and stiffness for a year. It is worst in the morning, improves with exercise, and wakes him in the second half of the night. He had a painful red eye with photophobia last year. Lumbar flexion is limited, and x-ray shows bilateral sacroiliitis.\n\nWhich of the following is most strongly associated with this condition?","options":["HLA-DQ2","HLA-DR4","HLA-DR3","HLA-B51","HLA-B27"],"answer":4,"explanation":"Ankylosing spondylitis is a seronegative spondyloarthropathy in young men with inflammatory back pain (better with exercise, worse with rest), sacroiliitis, enthesitis, anterior uveitis, and aortic regurgitation. Fusion of the vertebrae produces a bamboo spine. It is strongly associated with HLA-B27, as are psoriatic arthritis, reactive arthritis, and IBD-associated arthritis. HLA-DR4 is associated with rheumatoid arthritis, and DQ2 with celiac disease.","ko":"강직성 척추염: 젊은 남성, 운동 시 호전되는 요통, 천장관절염, 포도막염, HLA-B27."},{"id":"mk14","steps":["1"],"system":"MSK & Skin","discipline":"Immunology","topic":"Reactive arthritis","stem":"A 26-year-old man has pain and swelling in his left knee and right ankle and a sausage-shaped swelling of his second toe. Three weeks ago he had burning with urination after unprotected sex. He also has bilateral red eyes. Joint aspiration shows no organisms.\n\nWhich of the following is the most likely diagnosis?","options":["Septic arthritis","Gout","Reactive arthritis","Psoriatic arthritis","Rheumatoid arthritis"],"answer":2,"explanation":"Reactive arthritis is an HLA-B27-associated spondyloarthropathy that develops after infection with Chlamydia trachomatis or enteric organisms such as Shigella, Salmonella, Yersinia, and Campylobacter. It causes the triad of conjunctivitis, urethritis, and asymmetric arthritis of large joints, along with dactylitis and enthesitis. Joint fluid is sterile. Disseminated gonococcal infection, in contrast, causes septic arthritis, tenosynovitis, and pustular skin lesions.","ko":"반응성 관절염: 클라미디아·장염 후, 결막염 + 요도염 + 관절염, HLA-B27, 무균."},{"id":"mk15","steps":["1"],"system":"MSK & Skin","discipline":"Pharmacology","topic":"Bisphosphonates","stem":"A 67-year-old woman has osteoporosis with a T-score of −2.9 at the hip. She is prescribed alendronate and told to take it on an empty stomach with a full glass of water and to stay upright for 30 minutes afterward.\n\nWhich of the following is the mechanism of action of this drug?","options":["Stimulating osteoblast activity through PTH receptors","Binding RANKL and preventing osteoclast activation","Increasing intestinal calcium absorption","Acting as an estrogen agonist in bone","Binding to hydroxyapatite and inhibiting osteoclast activity"],"answer":4,"explanation":"Bisphosphonates are pyrophosphate analogs that bind hydroxyapatite in bone and are taken up by osteoclasts, inhibiting their function and inducing apoptosis. They are first-line for osteoporosis, Paget disease, and hypercalcemia of malignancy. Oral forms cause pill esophagitis, which is reduced by taking them with water and staying upright. Rare adverse effects include osteonecrosis of the jaw and atypical femoral fractures. Teriparatide is a PTH analog, denosumab binds RANKL, and raloxifene is a SERM.","ko":"Bisphosphonate: 하이드록시아파타이트 결합 → 파골세포 억제. 식도염, 턱뼈 괴사."},{"id":"mk16","steps":["1"],"system":"MSK & Skin","discipline":"Pathology","topic":"Paget disease of bone","stem":"A 70-year-old man has aching pain in his right thigh and has noticed that his hats no longer fit. He has some hearing loss. Serum alkaline phosphatase is 680 U/L, while calcium, phosphate, and PTH are normal. X-ray shows thickened cortex and coarse trabeculae in the femur and skull.\n\nThis condition increases his risk for which of the following?","options":["Avascular necrosis of the femoral head only","Hypercalcemia and kidney stones","Osteomalacia and hypocalcemia","Multiple myeloma and renal failure","Osteosarcoma and high-output heart failure"],"answer":4,"explanation":"Paget disease of bone is localized disordered bone remodeling: excessive osteoclast activity followed by disorganized osteoblast activity, forming thick but weak bone with a mosaic pattern of lamellar bone. It causes bone pain, enlarged skull, hearing loss from compression of the auditory nerve or ossicles, and fractures. Isolated elevated alkaline phosphatase is characteristic, with normal calcium, phosphate, and PTH. Complications include high-output heart failure from arteriovenous shunting and osteosarcoma. Bisphosphonates are used to treat it.","ko":"Paget 골병: ALP 단독 상승, 모자 크기 증가, 난청, 고박출 심부전·골육종."},{"id":"mk17","steps":["1"],"system":"MSK & Skin","discipline":"Pathology","topic":"Osteosarcoma","stem":"A 15-year-old boy has had pain and swelling above his left knee for 2 months. X-ray shows a destructive lesion of the distal femoral metaphysis with periosteal elevation forming a triangle and a sunburst pattern of new bone. Biopsy shows pleomorphic cells producing osteoid.\n\nWhich of the following conditions increases the risk of this tumor?","options":["Hereditary spherocytosis","Hereditary retinoblastoma","Down syndrome","Neurofibromatosis type 2","Turner syndrome"],"answer":1,"explanation":"Osteosarcoma is the most common primary malignant bone tumor in children and adolescents, typically in the metaphysis of long bones around the knee. X-rays show a Codman triangle (periosteal elevation) and a sunburst pattern. Malignant cells produce osteoid. Risk factors include hereditary retinoblastoma (RB1), Li-Fraumeni syndrome (TP53), Paget disease, and prior radiation. Ewing sarcoma arises in the diaphysis with an onion-skin periosteal reaction.","ko":"골육종: 무릎 주변 골간단, Codman 삼각·sunburst, 유전성 망막모세포종·Li-Fraumeni."},{"id":"mk18","steps":["1"],"system":"MSK & Skin","discipline":"Pathology","topic":"Ewing sarcoma","stem":"A 12-year-old boy has a painful swelling of his right thigh, fever, and an elevated ESR. X-ray shows a lytic lesion in the diaphysis of the femur with layers of periosteal new bone. Biopsy shows sheets of small, round, blue cells that are CD99-positive.\n\nWhich of the following genetic abnormalities is most likely present?","options":["t(9;22)","t(14;18)","t(8;14)","t(11;22)","t(X;18)"],"answer":3,"explanation":"Ewing sarcoma is a malignant small round blue cell tumor of children, more common in boys, typically in the diaphysis of long bones and the pelvis. It can mimic osteomyelitis with fever and an elevated ESR. X-rays show an onion-skin periosteal reaction, and it is CD99-positive with t(11;22) forming the EWSR1-FLI1 fusion. It is sensitive to chemotherapy. t(X;18) occurs in synovial sarcoma.","ko":"Ewing 육종: 골간(diaphysis), 양파껍질 골막반응, 소원형청색세포, t(11;22), CD99."},{"id":"mk19","steps":["1"],"system":"MSK & Skin","discipline":"Biochemistry","topic":"Duchenne muscular dystrophy","stem":"A 4-year-old boy has trouble climbing stairs and running. To stand up from the floor, he pushes on his thighs with his hands. His calves are enlarged and firm. Serum creatine kinase is 30 times normal. His maternal uncle used a wheelchair by age 12.\n\nWhich of the following is the most likely genetic mechanism?","options":["In-frame deletion in the dystrophin gene","Mutation in the ryanodine receptor","CTG trinucleotide repeat expansion","Frameshift deletion in the dystrophin gene","Deletion of the SMN1 gene"],"answer":3,"explanation":"Duchenne muscular dystrophy is an X-linked recessive disorder, usually caused by frameshift deletions in the dystrophin gene that truncate the protein. Dystrophin anchors the muscle cytoskeleton to the extracellular matrix; without it, muscle fibers degenerate and are replaced by fat and fibrous tissue (pseudohypertrophy of the calves). Boys have proximal weakness with a Gowers sign by age 5 and die of dilated cardiomyopathy or respiratory failure. Becker muscular dystrophy results from in-frame deletions and is milder. Myotonic dystrophy is a CTG repeat expansion.","ko":"Duchenne: dystrophin frameshift 결실, Gowers 징후, 종아리 가성비대. Becker는 in-frame."},{"id":"mk20","steps":["1"],"system":"MSK & Skin","discipline":"Pathology","topic":"Dermatomyositis","stem":"A 55-year-old woman has had progressive difficulty rising from a chair and lifting her arms over her head for 2 months. She has a violet rash on her upper eyelids and scaly red papules over the knuckles. Creatine kinase is elevated, and anti-Mi-2 antibodies are positive.\n\nThis patient should be evaluated for which of the following?","options":["Hepatitis C infection","Hereditary complement deficiency","Lyme disease","An underlying malignancy","Hypothyroidism caused by amiodarone"],"answer":3,"explanation":"Dermatomyositis is an autoimmune inflammatory myopathy with symmetric proximal weakness and characteristic skin findings: a heliotrope rash on the eyelids, Gottron papules on the knuckles, and a shawl sign. Biopsy shows perimysial inflammation and perifascicular atrophy (complement-mediated injury of capillaries). Antibodies include anti-Mi-2 and anti-Jo-1 (associated with interstitial lung disease). It is associated with malignancies, especially ovarian, lung, and gastrointestinal cancers, so cancer screening is recommended. Polymyositis involves endomysial CD8+ T-cell inflammation without rash.","ko":"피부근염: heliotrope·Gottron 구진, 근위 근력약화, anti-Mi-2, 악성종양 검사 필요."},{"id":"mk21","steps":["1"],"system":"MSK & Skin","discipline":"Immunology","topic":"Pemphigus vulgaris","stem":"A 52-year-old woman has painful oral erosions for 2 months and now has flaccid blisters on her trunk that rupture easily, leaving raw areas. Gentle pressure on normal-appearing skin causes the epidermis to separate. Biopsy shows separation just above the basal layer with rounded, detached keratinocytes. Direct immunofluorescence shows IgG in a net-like pattern around keratinocytes.\n\nThe autoantibodies in this condition target which of the following?","options":["BP180 in hemidesmosomes","Desmoglein in desmosomes","Type VII collagen","Tissue transglutaminase","Keratin"],"answer":1,"explanation":"Pemphigus vulgaris is a type II hypersensitivity reaction with IgG antibodies against desmogleins 1 and 3 in desmosomes, which hold keratinocytes together. Loss of adhesion (acantholysis) causes intraepidermal blisters that are flaccid and rupture easily, with oral involvement and a positive Nikolsky sign. Bullous pemphigoid targets hemidesmosomes (BP180, BP230), causing tense subepidermal blisters with linear immunofluorescence, a negative Nikolsky sign, and usually no oral lesions.","ko":"심상성 천포창: desmoglein 항체, 이완성 수포·구강, Nikolsky(+), 그물 모양 IF."},{"id":"mk22","steps":["1"],"system":"MSK & Skin","discipline":"Immunology","topic":"Psoriasis","stem":"A 30-year-old man has well-demarcated, salmon-colored plaques with silvery scales on his elbows, knees, and scalp. Removing a scale causes pinpoint bleeding. His fingernails have small pits. Biopsy shows marked epidermal thickening, retention of nuclei in the stratum corneum, and collections of neutrophils in the stratum corneum.\n\nWhich of the following pathways is a major target of biologic therapy for this condition?","options":["IL-5","IL-17 and IL-23","CD20 on B cells","IgE","Complement C5"],"answer":1,"explanation":"Psoriasis is a chronic immune-mediated disease driven by Th17 cells and the IL-23/IL-17 axis, which causes keratinocyte hyperproliferation. Features include acanthosis, parakeratosis, Munro microabscesses (neutrophils in the stratum corneum), Auspitz sign, nail pitting, and the Koebner phenomenon. Biologics target IL-17 (secukinumab), IL-23 (guselkumab), IL-12/23 (ustekinumab), and TNF-α. Psoriatic arthritis is associated with HLA-B27.","ko":"건선: Th17/IL-23·IL-17, 착각화증·Munro 미세농양·손발톱 함몰. 생물학제제 표적."},{"id":"mk23","steps":["1"],"system":"MSK & Skin","discipline":"Pathology","topic":"Basal cell carcinoma","stem":"A 70-year-old fair-skinned man who worked outdoors for many years has a slowly growing lesion on the side of his nose. It is a pearly papule with rolled borders and fine overlying blood vessels and a central ulcer. Biopsy shows nests of basaloid cells with peripheral nuclei aligned in a row.\n\nWhich of the following is the most likely diagnosis?","options":["Seborrheic keratosis","Melanoma","Actinic keratosis","Basal cell carcinoma","Squamous cell carcinoma"],"answer":3,"explanation":"Basal cell carcinoma is the most common skin cancer. It occurs on sun-exposed skin, usually the upper face, as a pearly papule with telangiectasias and rolled borders that may ulcerate (rodent ulcer). Histology shows nests of basaloid cells with peripheral palisading. It is locally invasive but rarely metastasizes. Squamous cell carcinoma tends to occur on the lower face and lips, forms keratin pearls, and arises from actinic keratosis.","ko":"기저세포암: 진주양 구진 + 모세혈관확장, 주변부 울타리 배열, 전이 드묾."},{"id":"mk24","steps":["1"],"system":"MSK & Skin","discipline":"Pathology","topic":"Leser-Trélat sign","stem":"A 66-year-old man notices dozens of new, brown, waxy, 'stuck-on' plaques appearing on his back over 3 months. He has also lost 7 kg (15 lb) without trying and has early satiety.\n\nThe sudden appearance of these lesions should raise concern for which of the following?","options":["Systemic lupus erythematosus","Hepatitis C infection","Gastrointestinal adenocarcinoma","Melanoma","HIV infection"],"answer":2,"explanation":"Seborrheic keratoses are benign proliferations of immature keratinocytes that look waxy and stuck-on and contain keratin-filled cysts (horn cysts). They are very common in older adults. However, the sudden appearance of many seborrheic keratoses (Leser-Trélat sign) is a paraneoplastic sign, most often of gastric or other gastrointestinal adenocarcinomas. Acanthosis nigricans is also associated with gastric cancer and with insulin resistance.","ko":"Leser-Trélat 징후: 지루각화증 갑자기 다발 → 위장관 선암 의심."},{"id":"mk25","steps":["1"],"system":"MSK & Skin","discipline":"Immunology","topic":"Limited systemic sclerosis","stem":"A 48-year-old woman has had her fingers turn white, then blue, then red in cold weather for years. She now has difficulty swallowing and has thickened skin on her fingers and face, small dilated blood vessels on her lips, and small hard nodules on her fingertips. The skin of her trunk is normal.\n\nWhich of the following antibodies is most likely to be positive?","options":["Anti-dsDNA","Anti-Jo-1","Anti-Scl-70 (anti-topoisomerase I)","Anti-histone","Anticentromere"],"answer":4,"explanation":"Limited cutaneous systemic sclerosis (CREST: calcinosis, Raynaud phenomenon, esophageal dysmotility, sclerodactyly, and telangiectasia) involves skin of the fingers, forearms, and face and is associated with anticentromere antibodies. It has a relatively better prognosis but can cause pulmonary arterial hypertension. Diffuse systemic sclerosis causes widespread skin thickening and early organ involvement, including interstitial lung disease and scleroderma renal crisis, and is associated with anti-Scl-70 and anti-RNA polymerase III.","ko":"제한형 전신경화증(CREST) = anticentromere. 미만형 = anti-Scl-70."},{"id":"mk26","steps":["1"],"system":"MSK & Skin","discipline":"Immunology","topic":"Sjögren syndrome","stem":"A 50-year-old woman has dry eyes that feel gritty and a dry mouth that makes it hard to swallow crackers. She has had several dental cavities this year. Both parotid glands are enlarged. Anti-Ro/SSA and anti-La/SSB antibodies are positive.\n\nThis patient is at increased risk of which of the following?","options":["Squamous cell carcinoma of the esophagus","Colorectal carcinoma","Acute myeloid leukemia","B-cell lymphoma","Hepatocellular carcinoma"],"answer":3,"explanation":"Sjögren syndrome is an autoimmune destruction of the lacrimal and salivary glands by lymphocytes, causing dry eyes (keratoconjunctivitis sicca), dry mouth with dental caries, and parotid enlargement. It may be primary or secondary to RA or SLE. Anti-Ro/SSA and anti-La/SSB are associated; anti-Ro in pregnant women can cause neonatal lupus with congenital heart block. Chronic B-cell stimulation increases the risk of B-cell lymphoma, often marginal zone lymphoma of the parotid.","ko":"쇼그렌: 안구·구강 건조, 이하선 비대, anti-Ro/La, B세포 림프종 위험."},{"id":"mk27","steps":["1"],"system":"MSK & Skin","discipline":"Biochemistry","topic":"Osteogenesis imperfecta","stem":"A 6-year-old boy has had five fractures from minor falls. He has blue sclerae, small, discolored, translucent teeth, and short stature. His father, who also has blue sclerae, became hard of hearing in his 30s.\n\nThis condition is most often caused by a defect in the synthesis of which of the following?","options":["Type I collagen","Type II collagen","Type III collagen","Type IV collagen","Fibrillin"],"answer":0,"explanation":"Osteogenesis imperfecta is most often an autosomal dominant mutation in COL1A1 or COL1A2 that reduces or alters type I collagen in bone, sclera, dentin, ligaments, and skin. It causes multiple fractures with minimal trauma, blue sclerae (the thin collagen lets the choroid show through), dentinogenesis imperfecta, and hearing loss from abnormal ossicles. It must be distinguished from child abuse. Type IV collagen defects cause Alport syndrome, and type III defects cause vascular Ehlers-Danlos syndrome.","ko":"골형성부전증: 1형 콜라겐(COL1A1/2), 다발 골절·청색 공막·난청·치아 이상."},{"id":"mk28","steps":["1"],"system":"MSK & Skin","discipline":"Anatomy","topic":"Superior gluteal nerve","stem":"A 40-year-old man receives an intramuscular injection in the upper medial part of his right buttock. Afterward, when he stands on his right leg, his left hip drops, and he walks with a lurching gait.\n\nWhich nerve was most likely injured?","options":["Right inferior gluteal nerve","Right sciatic nerve","Right superior gluteal nerve","Right obturator nerve","Left superior gluteal nerve"],"answer":2,"explanation":"The superior gluteal nerve (L4 to S1) supplies the gluteus medius and minimus, which abduct the hip and keep the pelvis level during single-leg stance. Injury causes a positive Trendelenburg sign: when standing on the affected side, the pelvis drops on the opposite side. Intramuscular injections are given in the upper outer quadrant of the buttock to avoid this nerve and the sciatic nerve. The inferior gluteal nerve supplies the gluteus maximus (difficulty climbing stairs or rising from a chair).","ko":"상둔신경 손상 → 중둔근 약화 → 환측으로 설 때 반대쪽 골반 하강(Trendelenburg)."},{"id":"mk29","steps":["1"],"system":"MSK & Skin","discipline":"Anatomy","topic":"ACL tear","stem":"A 22-year-old basketball player lands from a jump, twists his knee, hears a pop, and develops rapid swelling. With the knee flexed to 90 degrees, the tibia can be pulled forward excessively compared with the other side.\n\nWhich structure is most likely torn?","options":["Medial collateral ligament","Patellar tendon","Anterior cruciate ligament","Lateral collateral ligament","Posterior cruciate ligament"],"answer":2,"explanation":"The anterior cruciate ligament prevents anterior displacement of the tibia on the femur and is torn by pivoting, twisting injuries, often with a pop and rapid hemarthrosis. The anterior drawer and Lachman tests show increased anterior translation. The unhappy triad (ACL, MCL, and medial meniscus) results from a lateral blow to the knee. The PCL is tested with the posterior drawer test, and collateral ligaments with valgus and varus stress.","ko":"ACL 파열: 회전 손상 + 'pop' + 급속 혈관절증, 전방 전위(Lachman·전방 drawer)."},{"id":"mk30","steps":["1"],"system":"MSK & Skin","discipline":"Anatomy","topic":"Scaphoid fracture","stem":"A 19-year-old woman falls on her outstretched hand. She has tenderness in the anatomic snuffbox, but x-rays of the wrist taken the same day are normal.\n\nWhy should this injury be immobilized and reimaged even though the initial x-ray is normal?","options":["The hamate fracture is usually missed and affects the radial nerve","The radial artery is often lacerated","Fractures of the trapezium cause carpal tunnel syndrome","The lunate commonly dislocates and compresses the ulnar nerve","The scaphoid has a retrograde blood supply and is prone to avascular necrosis and nonunion"],"answer":4,"explanation":"The scaphoid is the most commonly fractured carpal bone, usually from a fall on an outstretched hand, and causes snuffbox tenderness. Fractures may not appear on initial x-rays. Blood enters the scaphoid distally and flows retrograde, so a fracture through the waist can cut off supply to the proximal pole, causing avascular necrosis and nonunion. Patients are immobilized in a thumb spica splint and reimaged or evaluated with MRI. Lunate dislocation can cause acute carpal tunnel syndrome.","ko":"주상골 골절: 해부학적 코담배갑 압통, 초기 X선 정상 가능, 역행성 혈류 → 무혈성 괴사·불유합."},{"id":"mk31","steps":["1"],"system":"MSK & Skin","discipline":"Physiology","topic":"Osteoporosis labs","stem":"A 72-year-old woman has a vertebral compression fracture after lifting a bag of groceries. DEXA shows a T-score of −3.1 at the lumbar spine.\n\nWhich of the following sets of laboratory findings is most likely?","options":["Calcium ↓, phosphate ↑, PTH ↑","Calcium ↑, phosphate ↓, PTH ↑","Calcium normal, alkaline phosphatase markedly ↑ only","Calcium ↓, phosphate ↓, PTH ↑, alkaline phosphatase ↑","Calcium, phosphate, PTH, and alkaline phosphatase all normal"],"answer":4,"explanation":"Primary osteoporosis is a loss of bone mass with normal mineralization, caused mainly by estrogen loss after menopause (which increases RANKL and osteoclast activity) and aging. Serum calcium, phosphate, PTH, and alkaline phosphatase are normal; abnormal labs suggest a secondary cause or another disease. Osteomalacia (vitamin D deficiency) has low phosphate, high PTH, and high ALP. Paget disease has isolated high ALP.","ko":"원발성 골다공증: 혈액검사 모두 정상. 비정상이면 골연화증·Paget·부갑상선 질환 감별."},{"id":"mk32","steps":["1"],"system":"MSK & Skin","discipline":"Genetics","topic":"Osteopetrosis","stem":"A 2-year-old boy has frequent fractures, anemia, thrombocytopenia, hepatosplenomegaly, and progressive vision and hearing loss. X-rays show diffusely dense bones with a bone-in-bone appearance.\n\nWhich of the following is the underlying defect?","options":["Defective cartilage proliferation at the growth plate","Defective type I collagen synthesis","Defective osteoclast bone resorption","Defective mineralization of osteoid","Excessive osteoclast activity"],"answer":2,"explanation":"Osteopetrosis is a group of disorders with defective osteoclast resorption, often from mutations in carbonic anhydrase II or proton pumps that osteoclasts need to acidify the bone surface. Bones become dense but brittle. Marrow space is filled, causing pancytopenia and extramedullary hematopoiesis, and narrowed foramina compress cranial nerves. Severe forms are treated with hematopoietic stem cell transplant, because osteoclasts come from monocytes.","ko":"골화석증: 파골세포 흡수 장애(탄산탈수효소 II), 치밀하지만 약한 뼈, 범혈구감소·뇌신경 압박."},{"id":"mk33","steps":["1"],"system":"MSK & Skin","discipline":"Genetics","topic":"Achondroplasia","stem":"A newborn has short arms and legs, a large head with frontal bossing, and a normal-length trunk. His parents are both of average height. His father is 52 years old.\n\nWhich of the following is the most likely genetic mechanism?","options":["Mutation of fibrillin-1","Activating mutation of FGFR3","Deletion of the SHOX gene","Mutation of type II collagen","Loss-of-function mutation of FGFR3"],"answer":1,"explanation":"Achondroplasia is the most common cause of dwarfism. It is autosomal dominant, but about 80% of cases are new mutations, associated with advanced paternal age. A gain-of-function mutation of FGFR3 inhibits chondrocyte proliferation in growth plates, impairing endochondral ossification of long bones, while intramembranous ossification (skull, face) is normal. Intelligence and lifespan are typically normal. SHOX deficiency causes short stature in Turner syndrome.","ko":"연골무형성증: FGFR3 기능 획득, 대부분 신생 변이(고령 부성), 연골내 골화 장애, 지능 정상."},{"id":"mk34","steps":["1"],"system":"MSK & Skin","discipline":"Pathology","topic":"Slipped capital femoral epiphysis","stem":"A 13-year-old obese boy has had a limp and vague left knee pain for 3 weeks. When his left hip is flexed, it rotates outward. Internal rotation of the hip is limited and painful. A frog-leg x-ray of the hip is obtained.\n\nWhich of the following is the most likely diagnosis?","options":["Transient synovitis","Osgood-Schlatter disease","Developmental dysplasia of the hip","Legg-Calvé-Perthes disease","Slipped capital femoral epiphysis"],"answer":4,"explanation":"Slipped capital femoral epiphysis is displacement of the femoral head (epiphysis) relative to the neck through the growth plate, typically in obese adolescents during the growth spurt; it can be associated with hypothyroidism. Hip pathology can present as knee pain. Treatment is surgical pinning to prevent further slipping and avascular necrosis. Legg-Calvé-Perthes disease is idiopathic avascular necrosis of the femoral head in boys aged 4 to 10.","ko":"SCFE: 비만 청소년, 무릎 통증 호소 가능, 고관절 내회전 제한 → 수술 고정. Perthes는 4~10세 무혈성 괴사."},{"id":"mk35","steps":["1"],"system":"MSK & Skin","discipline":"Pathology","topic":"Giant cell tumor of bone","stem":"A 30-year-old woman has pain and swelling around her right knee. X-ray shows an expansile, lytic lesion in the epiphysis of the distal femur extending to the joint surface with a soap-bubble appearance. Biopsy shows many multinucleated osteoclast-like giant cells among ovoid stromal cells.\n\nThe stromal cells promote formation of the giant cells by secreting which of the following?","options":["Osteoprotegerin","Sclerostin","Fibroblast growth factor 23","PTH-related peptide","RANKL"],"answer":4,"explanation":"Giant cell tumor of bone occurs in young adults at the epiphysis of long bones, most often around the knee, as a locally aggressive lytic tumor with a soap-bubble appearance. Neoplastic stromal cells express RANKL, which recruits and activates osteoclast-like giant cells. Denosumab, a RANKL antibody, is used for unresectable tumors. Osteoprotegerin is a decoy receptor that blocks RANKL.","ko":"거대세포종: 젊은 성인 골단(무릎), 비누거품 모양, 기질세포 RANKL → 파골세포 유사 거대세포. Denosumab."},{"id":"mk36","steps":["1"],"system":"MSK & Skin","discipline":"Pathology","topic":"Osteochondroma","stem":"A 15-year-old boy has a painless, hard lump near his right knee that has grown slowly. X-ray shows a bony projection from the metaphysis of the distal femur, pointing away from the joint, with a cortex and marrow continuous with the underlying bone.\n\nWhich of the following is true of this lesion?","options":["It commonly metastasizes to the lungs","It is the most common benign bone tumor and has a cartilage cap","It arises in the epiphysis and is RANKL-driven","It is associated with t(11;22)","It is a malignant tumor that produces osteoid"],"answer":1,"explanation":"Osteochondroma is the most common benign bone tumor, usually in adolescents at the metaphysis of long bones. It is a bony outgrowth covered by a cartilage cap whose cortex and medullary cavity are continuous with the parent bone. Multiple hereditary exostoses are caused by EXT1 or EXT2 mutations. Rarely, the cartilage cap transforms into chondrosarcoma, suggested by growth or pain after skeletal maturity.","ko":"골연골종: 가장 흔한 양성 골종양, 골간단, 연골 모자, 모골과 피질·수질 연속. 드물게 연골육종."},{"id":"mk37","steps":["1"],"system":"MSK & Skin","discipline":"Microbiology","topic":"Gonococcal arthritis","stem":"A 22-year-old sexually active woman has migratory joint pain followed by a hot, swollen left knee. She also has pain along the tendons on the back of her wrists and a few small pustules on a red base on her hands. Joint fluid shows 45,000 white cells/mm³, mostly neutrophils, but Gram stain is negative.\n\nWhich of the following is the most likely organism?","options":["Staphylococcus aureus","Streptococcus pyogenes","Chlamydia trachomatis","Neisseria gonorrhoeae","Borrelia burgdorferi"],"answer":3,"explanation":"Disseminated gonococcal infection causes the triad of polyarthralgia, tenosynovitis (often of the wrists and hands), and pustular skin lesions, or a purulent septic monoarthritis, typically in young sexually active people. Joint cultures are often negative, so mucosal nucleic acid testing is done. Treatment is ceftriaxone. S. aureus is the most common cause of septic arthritis overall. Chlamydia causes reactive arthritis with a sterile joint.","ko":"파종성 임균 감염: 다발 관절통 + 건초염 + 농포성 피부병변, 관절액 배양 음성 흔함 → ceftriaxone."},{"id":"mk38","steps":["1"],"system":"MSK & S
