ter drinking milk. The stool osmotic gap is elevated, and stool pH is low. A breath test after lactose ingestion shows a rise in exhaled hydrogen.\n\nWhich of the following would most likely be seen on small bowel biopsy?","options":["Villous atrophy with crypt hyperplasia","Absence of plasma cells","Normal villi and mucosa","PAS-positive macrophages","Trophozoites on the surface"],"answer":2,"explanation":"Primary lactase deficiency is the most common form and develops with age, especially in people of Asian, African, and Native American descent. Undigested lactose draws water into the bowel (osmotic diarrhea with a high stool osmotic gap) and is fermented by colonic bacteria to acids and hydrogen gas. The mucosa is histologically normal. Secondary lactase deficiency occurs after viral gastroenteritis or celiac disease, which damage the brush border.","ko":"유당불내증: 삼투성 설사(삼투압 차이↑), 수소 호기검사, 점막 정상."},{"id":"gi42","steps":["1"],"system":"Gastrointestinal","discipline":"Pathology","topic":"Diverticulosis","stem":"A 68-year-old woman with chronic constipation has many small outpouchings of the sigmoid colon on colonoscopy. A biopsy of one outpouching shows mucosa and submucosa, without a muscular layer.\n\nWhich of the following best explains why these structures form?","options":["High intraluminal pressure pushes mucosa through weak points where vasa recta penetrate the muscle","Immune-mediated destruction of the muscularis propria","A congenital persistence of the vitelline duct","Ischemia of the bowel wall at watershed areas","Infection of lymphoid tissue in the bowel wall"],"answer":0,"explanation":"Colonic diverticula are false (pulsion) diverticula containing only mucosa and submucosa. They form where vasa recta penetrate the muscularis externa, in response to high intraluminal pressure from a low-fiber diet and constipation, and are most common in the sigmoid colon. Complications include painless bleeding and diverticulitis (LLQ pain, fever), which can lead to abscess, fistula (often colovesical), and perforation. Meckel diverticulum is a true diverticulum.","ko":"게실증: 가성 게실(점막+점막하), 직혈관 관통 부위, 저섬유 식이, S상결장, 무통성 출혈."},{"id":"gi43","steps":["1"],"system":"Gastrointestinal","discipline":"Pathology","topic":"Angiodysplasia and aortic stenosis","stem":"An 80-year-old man with severe aortic stenosis has recurrent episodes of painless bright red rectal bleeding and iron deficiency anemia. Colonoscopy shows small, flat, cherry-red vascular lesions in the cecum.\n\nWhich mechanism links his heart disease to these bleeding lesions?","options":["Anticoagulants used for aortic stenosis","Embolization of valve calcium to the colon","Endocarditis seeding the bowel","Shear stress across the stenotic valve degrades von Willebrand factor multimers","Low cardiac output causing ischemic colitis"],"answer":3,"explanation":"Angiodysplasia consists of dilated, tortuous submucosal vessels, most often in the cecum and right colon of older adults, causing painless bleeding. Heyde syndrome is the association of aortic stenosis with bleeding from angiodysplasia: high shear stress across the narrowed valve breaks down large von Willebrand factor multimers (acquired von Willebrand syndrome), impairing hemostasis. Bleeding often improves after valve replacement.","ko":"Heyde 증후군: 대동맥판 협착 + 맹장 혈관이형성 출혈 (vWF 다량체 파괴)."},{"id":"gi44","steps":["1"],"system":"Gastrointestinal","discipline":"Pathology","topic":"Intussusception","stem":"A 10-month-old boy has episodes of severe crying with drawing up of his knees every 15 to 20 minutes, with lethargy in between. He vomits and passes a stool that looks like red currant jelly. A sausage-shaped mass is palpable in the right upper quadrant.\n\nWhich of the following is the most common lead point in children of this age?","options":["Duplication cyst","Colon polyp","Meckel diverticulum","Hypertrophied Peyer patches after a viral infection","Intestinal lymphoma"],"answer":3,"explanation":"Intussusception is the telescoping of one segment of bowel into the next, most often ileocolic, and is the most common cause of bowel obstruction between 6 months and 3 years. In infants, the lead point is usually lymphoid hyperplasia (Peyer patches) after a viral infection or, rarely, rotavirus vaccination. Pathologic lead points such as Meckel diverticulum, polyps, and lymphoma are more common in older children and adults. Ultrasound shows a target sign, and an air or contrast enema both diagnoses and reduces it.","ko":"장중첩증: 6개월~3세, 회결장형, 건포도젤리 변·소시지 종괴, 선두점 = 바이러스 후 Peyer patch."},{"id":"gi45","steps":["1"],"system":"Gastrointestinal","discipline":"Genetics","topic":"Adenoma-carcinoma sequence","stem":"Molecular analysis of a series of colon lesions in a 62-year-old man shows that a small tubular adenoma has lost both copies of a gene that regulates β-catenin, a larger adenoma also has an activating point mutation in a GTPase, and an invasive carcinoma additionally has lost a gene that arrests the cell cycle in response to DNA damage.\n\nWhich of the following is the correct order of these genetic events?","options":["APC loss, then KRAS mutation, then TP53 loss","TP53 loss, then APC loss, then KRAS mutation","APC loss, then TP53 loss, then KRAS mutation","Mismatch repair loss, then BRAF mutation, then CIMP","KRAS mutation, then APC loss, then TP53 loss"],"answer":0,"explanation":"In the chromosomal instability pathway of colorectal cancer, loss of APC begins adenoma formation by stabilizing β-catenin. Activating KRAS mutations promote adenoma growth. Loss of TP53 (along with others such as SMAD4) leads to carcinoma. The microsatellite instability pathway involves mismatch repair defects (Lynch syndrome or MLH1 methylation), and the serrated pathway involves BRAF mutations and CpG island methylation.","ko":"선종-암 순서: APC 소실 → KRAS 활성화 → TP53 소실."},{"id":"gi46","steps":["1"],"system":"Gastrointestinal","discipline":"Physiology","topic":"Cholecystokinin","stem":"After a fatty meal, a hormone released from the duodenum causes the gallbladder to contract, relaxes the sphincter of Oddi, and stimulates pancreatic enzyme secretion.\n\nWhich cells secrete this hormone?","options":["K cells of the duodenum","D cells of the pancreatic islets","I cells of the duodenum and jejunum","G cells of the gastric antrum","S cells of the duodenum"],"answer":2,"explanation":"Cholecystokinin is secreted by I cells in response to fatty acids and amino acids. It contracts the gallbladder, relaxes the sphincter of Oddi, stimulates pancreatic acinar enzyme secretion, and slows gastric emptying. Secretin from S cells responds to acid and stimulates pancreatic bicarbonate secretion. Gastrin comes from G cells, GIP from K cells, and somatostatin from D cells. Biliary colic often follows fatty meals because of CCK.","ko":"CCK = I세포(지방·아미노산) → 담낭 수축·췌장 효소. Secretin = S세포(산) → HCO3."},{"id":"gi47","steps":["1"],"system":"Gastrointestinal","discipline":"Pathology","topic":"Pleomorphic adenoma","stem":"A 45-year-old woman has a painless, mobile mass in front of her left ear that has slowly grown over 3 years. Facial nerve function is normal. Biopsy shows epithelial and myoepithelial cells in a chondromyxoid stroma.\n\nWhich of the following is true of this tumor?","options":["It consists of lymphoid stroma with cystic spaces","It is the most common salivary gland tumor and tends to recur if incompletely removed","It is most common in the sublingual gland","It is malignant and spreads along the facial nerve","It is associated with smoking and is often bilateral"],"answer":1,"explanation":"Pleomorphic adenoma is the most common salivary gland tumor and usually arises in the parotid. It is benign, composed of epithelial and myoepithelial cells in a chondromyxoid stroma. Small projections beyond its capsule cause recurrence after incomplete excision, and rarely it becomes malignant. Warthin tumor (papillary cystadenoma lymphomatosum) is associated with smoking and can be bilateral. Mucoepidermoid carcinoma is the most common malignant salivary tumor and can involve the facial nerve.","ko":"다형선종: 가장 흔한 침샘 종양(이하선), 연골점액성 기질, 불완전 절제 시 재발. Warthin = 흡연."},{"id":"gp01","steps":["1"],"system":"General Principles","discipline":"Biochemistry","topic":"Phenylketonuria","stem":"A 7-month-old boy born abroad without newborn screening has developmental delay, eczema, and a musty body odor. He has lighter skin and hair than his siblings. Serum phenylalanine is markedly elevated, and tetrahydrobiopterin levels are normal.\n\nWhich of the following becomes an essential amino acid in this patient?","options":["Phenylalanine","Methionine","Tyrosine","Leucine","Tryptophan"],"answer":2,"explanation":"Phenylketonuria is an autosomal recessive deficiency of phenylalanine hydroxylase, which converts phenylalanine to tyrosine using tetrahydrobiopterin. Phenylalanine and its ketones accumulate, causing intellectual disability, seizures, eczema, and a musty odor, and low tyrosine reduces melanin (fair skin). Treatment is a diet low in phenylalanine and supplemented with tyrosine, and avoidance of aspartame. Women with PKU must control their levels before pregnancy to prevent fetal harm.","ko":"PKU: phenylalanine hydroxylase 결핍, 곰팡이 냄새, 티로신이 필수아미노산이 됨."},{"id":"gp02","steps":["1"],"system":"General Principles","discipline":"Biochemistry","topic":"Alkaptonuria","stem":"A 50-year-old man has back and knee pain. His sclerae and ear cartilage have bluish-black pigmentation. His parents recall that his diapers turned black when left standing. X-rays show calcification of the intervertebral discs.\n\nDeficiency of which of the following enzymes is most likely?","options":["Cystathionine β-synthase","Homogentisate oxidase","Tyrosinase","Fumarylacetoacetate hydrolase","Phenylalanine hydroxylase"],"answer":1,"explanation":"Alkaptonuria is an autosomal recessive deficiency of homogentisate oxidase in tyrosine degradation. Homogentisic acid builds up and turns urine black when exposed to air, and it deposits in connective tissue as a dark pigment (ochronosis), causing early, debilitating arthritis of the spine and large joints. Tyrosinase deficiency causes albinism, and fumarylacetoacetate hydrolase deficiency causes tyrosinemia type I.","ko":"Alkaptonuria: homogentisate oxidase 결핍, 공기 노출 시 검은 소변, 갈색증(ochronosis)·관절염."},{"id":"gp03","steps":["1"],"system":"General Principles","discipline":"Biochemistry","topic":"Homocystinuria","stem":"A 14-year-old boy who is tall and thin with long limbs has intellectual disability and recently had a deep vein thrombosis. His lenses are displaced downward and inward. Serum homocysteine and methionine are elevated.\n\nDeficiency of which of the following enzymes is most likely?","options":["Branched-chain α-ketoacid dehydrogenase","Homogentisate oxidase","Cystathionine β-synthase","Methylmalonyl-CoA mutase","Fibrillin-1"],"answer":2,"explanation":"Homocystinuria is most often an autosomal recessive deficiency of cystathionine β-synthase, which converts homocysteine to cystathionine using vitamin B6. Homocysteine and methionine accumulate, causing a marfanoid habitus, downward lens dislocation, intellectual disability, osteoporosis, and arterial and venous thrombosis. Treatment includes high-dose B6, B12, folate, betaine, and a methionine-restricted diet with cysteine supplementation. Marfan syndrome causes upward lens dislocation and normal intelligence.","ko":"Homocystinuria: cystathionine β-synthase 결핍, 수정체 하방 탈구, 혈전, Marfan 유사 체형."},{"id":"gp04","steps":["1"],"system":"General Principles","discipline":"Biochemistry","topic":"Maple syrup urine disease","stem":"A 5-day-old boy is lethargic, feeds poorly, and has alternating hypertonia and hypotonia. His urine and earwax have a sweet, burnt-sugar odor. Plasma leucine, isoleucine, and valine are elevated.\n\nWhich cofactor is part of the deficient enzyme complex?","options":["Vitamin B12","Biotin","Thiamine","Pyridoxine","Folate"],"answer":2,"explanation":"Maple syrup urine disease is an autosomal recessive deficiency of branched-chain α-ketoacid dehydrogenase, which needs thiamine (B1), lipoic acid, CoA, FAD, and NAD. Branched-chain amino acids (isoleucine, leucine, valine) and their α-ketoacids accumulate, causing severe neurologic damage and a burnt-sugar odor. Treatment is restriction of these amino acids and thiamine supplementation.","ko":"단풍당뇨병: 분지쇄 α-ketoacid dehydrogenase 결핍, 이·류·발린↑, 티아민 보조인자."},{"id":"gp05","steps":["1"],"system":"General Principles","discipline":"Biochemistry","topic":"OTC deficiency","stem":"A 3-day-old boy becomes lethargic and vomits after starting formula. He is tachypneic. Plasma ammonia is 380 μmol/L (markedly elevated), BUN is low, and urinary orotic acid is elevated. Blood glucose and red cell indices are normal.\n\nDeficiency of which of the following enzymes is most likely?","options":["Carbamoyl phosphate synthetase I","Argininosuccinate lyase","Ornithine transcarbamylase","UMP synthase","Arginase"],"answer":2,"explanation":"Ornithine transcarbamylase deficiency is the most common urea cycle disorder and is X-linked recessive. Carbamoyl phosphate that cannot enter the urea cycle is diverted to pyrimidine synthesis, increasing orotic acid. Ammonia accumulates, causing vomiting, lethargy, tachypnea from respiratory alkalosis, cerebral edema, and death. Carbamoyl phosphate synthetase I deficiency causes hyperammonemia without orotic aciduria. Hereditary orotic aciduria (UMP synthase deficiency) causes megaloblastic anemia without hyperammonemia.","ko":"OTC 결핍(X연관): 고암모니아혈증 + 오로트산뇨, BUN↓. UMP synthase 결핍은 거대적아구빈혈."},{"id":"gp06","steps":["1"],"system":"General Principles","discipline":"Biochemistry","topic":"Niemann-Pick disease","stem":"A 6-month-old Ashkenazi Jewish girl has progressive loss of motor milestones, feeding problems, and an enlarged liver and spleen. Funduscopic examination shows a cherry-red spot at the macula. Bone marrow aspirate shows foamy macrophages.\n\nDeficiency of which of the following enzymes is most likely?","options":["Sphingomyelinase","Galactocerebrosidase","Hexosaminidase A","Glucocerebrosidase","α-Galactosidase A"],"answer":0,"explanation":"Niemann-Pick disease type A is an autosomal recessive deficiency of sphingomyelinase. Sphingomyelin accumulates in macrophages (foam cells), causing hepatosplenomegaly and progressive neurodegeneration with a cherry-red spot and death in early childhood. Tay-Sachs disease (hexosaminidase A) also has a cherry-red spot and neurodegeneration but no hepatosplenomegaly, with onion-skin lysosomes. Gaucher disease has hepatosplenomegaly without a cherry-red spot.","ko":"Niemann-Pick: sphingomyelinase 결핍, 앵두빛 반점 + 간비종대, 거품세포. Tay-Sachs는 간비종대 없음."},{"id":"gp07","steps":["1"],"system":"General Principles","discipline":"Biochemistry","topic":"Gaucher disease","stem":"A 25-year-old Ashkenazi Jewish man has bone pain, easy bruising, and an enlarged spleen. X-ray of the femur shows an Erlenmeyer flask deformity of the distal end. Bone marrow biopsy shows macrophages with cytoplasm that looks like crumpled tissue paper.\n\nDeficiency of which of the following enzymes is most likely?","options":["Arylsulfatase A","α-L-Iduronidase","Sphingomyelinase","Glucocerebrosidase","Hexosaminidase A"],"answer":3,"explanation":"Gaucher disease is the most common lysosomal storage disease, an autosomal recessive deficiency of glucocerebrosidase (β-glucosidase). Glucocerebroside accumulates in macrophages (Gaucher cells with crumpled tissue paper cytoplasm), causing hepatosplenomegaly, pancytopenia, bone pain and crises, osteoporosis, and avascular necrosis of the femur. Type 1 does not involve the CNS. Treatment is recombinant enzyme replacement (imiglucerase).","ko":"Gaucher: glucocerebrosidase 결핍, 구겨진 화장지 대식세포, 뼈 통증·비장비대, 효소대체."},{"id":"gp08","steps":["1"],"system":"General Principles","discipline":"Biochemistry","topic":"Fabry disease","stem":"A 22-year-old man has had episodes of burning pain in his hands and feet since childhood, triggered by exercise or fever. He sweats very little. He has small dark red papules in a bathing suit distribution and protein in his urine. His mother's brother died of kidney failure at age 45.\n\nDeficiency of which of the following enzymes is most likely?","options":["Glucocerebrosidase","Galactocerebrosidase","Hexosaminidase A","α-Galactosidase A","Sphingomyelinase"],"answer":3,"explanation":"Fabry disease is an X-linked recessive deficiency of α-galactosidase A, causing accumulation of ceramide trihexoside (globotriaosylceramide) in vessels, nerves, kidneys, and heart. Early features include episodic neuropathic pain in the extremities, angiokeratomas, and hypohidrosis; later features include kidney failure, cardiomyopathy and arrhythmias, and strokes. Enzyme replacement is available. Most other sphingolipidoses are autosomal recessive; Fabry and Hunter syndrome are X-linked.","ko":"Fabry(X연관): α-galactosidase A 결핍, 사지 작열통·혈관각화종·무한증, 신부전·심근병증."},{"id":"gp09","steps":["1"],"system":"General Principles","discipline":"Biochemistry","topic":"I-cell disease","stem":"A 1-year-old girl has coarse facial features, restricted joint movement, gum hypertrophy, and developmental delay. Her plasma lysosomal enzyme levels are markedly elevated, while her fibroblasts are deficient in these enzymes.\n\nWhich of the following processes is defective?","options":["Signal sequence recognition on ribosomes","Phosphorylation of mannose residues targeting enzymes to lysosomes","Ubiquitination of misfolded proteins","Glycosylation of proteins in the endoplasmic reticulum","Transport of proteins into mitochondria"],"answer":1,"explanation":"I-cell disease (inclusion cell disease, mucolipidosis type II) is an autosomal recessive deficiency of N-acetylglucosamine-1-phosphotransferase in the Golgi. Without it, mannose residues on lysosomal enzymes are not phosphorylated to mannose-6-phosphate, so the enzymes are secreted outside the cell instead of going to lysosomes. Plasma enzyme levels are high, and cells fill with inclusions. Patients have coarse facial features, clouded corneas, and restricted joints, and they often die in childhood.","ko":"I-cell 병: mannose-6-phosphate 표지 실패 → 리소좀 효소가 세포 밖으로 분비 (혈장↑)."},{"id":"gp10","steps":["1"],"system":"General Principles","discipline":"Biochemistry","topic":"Hereditary fructose intolerance","stem":"An 8-month-old girl has vomiting, sweating, and lethargy shortly after eating pureed fruit for the first time. She is jaundiced and has hepatomegaly. Blood glucose during an episode is 38 mg/dL. Urine dipstick for glucose is negative, but a test for reducing sugars is positive.\n\nDeficiency of which of the following enzymes is most likely?","options":["Galactose-1-phosphate uridyltransferase","Fructokinase","Aldolase B","Galactokinase","Glucose-6-phosphatase"],"answer":2,"explanation":"Hereditary fructose intolerance is an autosomal recessive deficiency of aldolase B. Fructose-1-phosphate accumulates and traps phosphate, depleting ATP and inhibiting glycogenolysis and gluconeogenesis, so hypoglycemia, vomiting, jaundice, and liver failure follow ingestion of fructose or sucrose. Treatment is avoiding fructose, sucrose, and sorbitol. Essential fructosuria (fructokinase deficiency) is benign.","ko":"유전성 과당불내증: aldolase B 결핍, 과일 섭취 후 저혈당·구토·간손상. Fructokinase 결핍은 양성."},{"id":"gp11","steps":["1"],"system":"General Principles","discipline":"Biochemistry","topic":"Classic galactosemia","stem":"A 1-week-old breastfed boy has vomiting, jaundice, hepatomegaly, and poor weight gain. Blood culture grows Escherichia coli. Ophthalmologic examination shows bilateral cataracts.\n\nDeficiency of which of the following enzymes is most likely?","options":["Galactose-1-phosphate uridyltransferase","Galactokinase","Lactase","Aldolase B","Glucose-6-phosphate dehydrogenase"],"answer":0,"explanation":"Classic galactosemia is an autosomal recessive deficiency of galactose-1-phosphate uridyltransferase. Galactose-1-phosphate accumulates and is toxic, and galactose is converted to galactitol by aldose reductase in the lens, causing cataracts. Infants develop jaundice, hepatomegaly, vomiting, failure to thrive, intellectual disability, and E. coli sepsis after starting breast milk or formula containing lactose. Treatment is eliminating galactose and lactose. Galactokinase deficiency is milder, causing mainly cataracts.","ko":"고전적 갈락토스혈증: GALT 결핍, 백내장·황달·간비대, 대장균 패혈증. 유당 제거."},{"id":"gp12","steps":["1"],"system":"General Principles","discipline":"Biochemistry","topic":"Pyruvate dehydrogenase deficiency","stem":"A 6-month-old boy has developmental delay, hypotonia, and episodes of rapid breathing. Serum lactate, pyruvate, and alanine are elevated, especially after carbohydrate-rich meals.\n\nWhich of the following dietary changes is most appropriate?","options":["Restriction of phenylalanine","Restriction of branched-chain amino acids","A high-carbohydrate, low-fat diet","Frequent feedings of cornstarch","A high-fat, low-carbohydrate diet with lysine and leucine"],"answer":4,"explanation":"Pyruvate dehydrogenase deficiency, often X-linked, prevents pyruvate from entering the TCA cycle, so pyruvate is converted to lactate and alanine, causing lactic acidosis and neurologic damage. A ketogenic diet high in fat and in the purely ketogenic amino acids lysine and leucine provides energy through acetyl-CoA without passing through PDH. Arsenic poisoning inhibits lipoic acid and causes a similar picture. Cornstarch is used for glycogen storage disease type I.","ko":"PDH 결핍: 젖산·알라닌↑ → 케톤생성 식이(지방 + 라이신·류신)."},{"id":"gp13","steps":["1"],"system":"General Principles","discipline":"Biochemistry","topic":"McArdle disease","stem":"A 20-year-old man has painful muscle cramps and weakness soon after starting strenuous exercise, which improve if he rests briefly and then continue at a slower pace. After a hard workout, his urine turned dark red-brown. Serum lactate does not rise during an ischemic forearm exercise test.\n\nDeficiency of which of the following enzymes is most likely?","options":["Glucose-6-phosphatase","Skeletal muscle glycogen phosphorylase","Glycogen debranching enzyme","Lysosomal acid α-glucosidase","Hepatic glycogen phosphorylase"],"answer":1,"explanation":"McArdle disease (glycogen storage disease type V) is an autosomal recessive deficiency of muscle glycogen phosphorylase (myophosphorylase). Muscle cannot break down glycogen for energy during exercise, causing cramps, myoglobinuria, and a flat lactate response. A second wind occurs as blood glucose and fatty acids become available. Blood glucose is normal because liver glycogen breakdown is intact.","ko":"McArdle: 근육 glycogen phosphorylase 결핍, 운동 시 경련·근색소뇨, second wind, 젖산 상승 없음."},{"id":"gp14","steps":["1"],"system":"General Principles","discipline":"Biochemistry","topic":"Hartnup disease","stem":"A 10-year-old boy has a scaly red rash on his sun-exposed skin, episodes of unsteady gait, and diarrhea. Urinalysis shows large amounts of neutral amino acids, including tryptophan. Plasma niacin is low.\n\nWhich of the following is the underlying defect?","options":["Deficiency of tryptophan hydroxylase","Excess conversion of tryptophan to serotonin by a tumor","Inability to absorb vitamin B12","Defective transport of neutral amino acids in the kidney and intestine","Deficiency of thiamine"],"answer":3,"explanation":"Hartnup disease is an autosomal recessive defect of the neutral amino acid transporter in the proximal tubule and small intestine. Tryptophan is lost in urine and poorly absorbed, reducing synthesis of niacin, causing pellagra: dermatitis, diarrhea, and dementia (with ataxia). It is treated with a high-protein diet and nicotinic acid. Pellagra also occurs with carcinoid syndrome (tryptophan diverted to serotonin) and isoniazid therapy (decreased B6).","ko":"Hartnup: 중성 아미노산 수송체 결함 → 트립토판 소실 → 니아신 결핍(펠라그라)."},{"id":"gp15","steps":["1"],"system":"General Principles","discipline":"Biochemistry","topic":"Scurvy","stem":"A 72-year-old man who lives alone and eats mostly tea and toast has swollen, bleeding gums, bruising, corkscrew-shaped hairs, and bleeding around hair follicles on his legs. A wound on his shin has not healed in months.\n\nDeficiency of this vitamin impairs which step in collagen synthesis?","options":["Glycosylation of hydroxylysine","Hydroxylation of proline and lysine residues","Cleavage of procollagen peptides","Cross-linking by lysyl oxidase","Formation of the triple helix from α chains with glycine"],"answer":1,"explanation":"Vitamin C is a cofactor for prolyl and lysyl hydroxylases, which hydroxylate proline and lysine in procollagen in the rough ER. Hydroxylation is needed for stable triple helix formation and later cross-linking. Deficiency (scurvy) causes fragile vessels, gum disease, perifollicular hemorrhage, corkscrew hairs, poor wound healing, and anemia. Lysyl oxidase, which forms cross-links, requires copper; its impairment occurs in Menkes disease.","ko":"괴혈병: 비타민 C → 프롤린·라이신 수산화 장애, 잇몸 출혈·나선형 털·상처 치유 지연."},{"id":"gp16","steps":["1"],"system":"General Principles","discipline":"Biochemistry","topic":"Vitamin K deficiency bleeding","stem":"A 5-week-old exclusively breastfed boy, born at home and not given any medications at birth, has bleeding from his umbilical stump and a bruise on his scalp. PT is markedly prolonged, PTT is prolonged, and the platelet count is normal.\n\nWhich of the following best explains his bleeding?","options":["Immune destruction of platelets","Deficiency of a vitamin needed for γ-carboxylation of clotting factors","Vitamin C deficiency","Deficiency of von Willebrand factor","Inherited deficiency of factor VIII"],"answer":1,"explanation":"Vitamin K is a cofactor for γ-glutamyl carboxylase, which carboxylates factors II, VII, IX, and X and proteins C and S so they can bind calcium and phospholipid. Newborns have little vitamin K because it crosses the placenta poorly, breast milk contains little, the liver is immature, and the gut is not yet colonized by bacteria that produce it. All newborns receive intramuscular vitamin K at birth to prevent vitamin K deficiency bleeding. The PT is prolonged first because factor VII has the shortest half-life.","ko":"신생아 비타민 K 결핍: II·VII·IX·X γ-카르복실화 장애, PT 연장 → 출생 시 근주 예방."},{"id":"gp17","steps":["1"],"system":"General Principles","discipline":"Genetics","topic":"Mitochondrial inheritance","stem":"A 30-year-old woman has short stature, hearing loss, and recurrent stroke-like episodes. Muscle biopsy shows ragged red fibers. In her family, her mother and all of her mother's children are affected to varying degrees, while none of the children of her affected brother are affected.\n\nWhich of the following best explains the variable severity among affected family members?","options":["Heteroplasmy","Incomplete penetrance from imprinting","Anticipation","Uniparental disomy","Germline mosaicism in the father"],"answer":0,"explanation":"Mitochondrial DNA is inherited only from the mother, so affected women pass the disorder to all their children, and affected men pass it to none. Cells contain many mitochondria, some with mutant DNA and some normal (heteroplasmy), and the proportion varies among tissues and individuals, causing variable expression. Mitochondrial diseases such as MELAS (myopathy, encephalopathy, lactic acidosis, and stroke-like episodes) and Leber hereditary optic neuropathy show ragged red fibers on biopsy.","ko":"미토콘드리아 유전: 모계 → 모든 자녀, 이형세포질(heteroplasmy)로 증상 다양, ragged red fiber."},{"id":"gp18","steps":["1"],"system":"General Principles","discipline":"Genetics","topic":"Prader-Willi syndrome","stem":"A 5-year-old boy has severe obesity, constant hunger, short stature, small hands and feet, hypogonadism, and mild intellectual disability. As an infant he was very floppy and fed poorly. Genetic testing shows a deletion on chromosome 15q11-13.\n\nFrom which parent was the deleted chromosome most likely inherited?","options":["Neither; it is mitochondrial","Either parent equally","Neither; both copies came from the father","Father","Mother"],"answer":3,"explanation":"Prader-Willi syndrome results from loss of the paternally expressed genes at 15q11-13, because the maternal copies are normally silenced by imprinting. This occurs through a deletion on the paternal chromosome or maternal uniparental disomy (two maternal copies). Angelman syndrome results from loss of the maternally expressed UBE3A gene at the same locus, through a maternal deletion or paternal uniparental disomy, causing severe intellectual disability, seizures, ataxia, and inappropriate laughter.","ko":"Prader-Willi = 부계 15q11-13 결실(또는 모계 UPD). Angelman = 모계 UBE3A 소실."},{"id":"gp19","steps":["1"],"system":"General Principles","discipline":"Genetics","topic":"Fragile X syndrome","stem":"A 12-year-old boy has intellectual disability, a long narrow face with a large jaw, large ears, and enlarged testes. He has poor eye contact and hand-flapping behavior. His maternal uncle has a similar condition.\n\nWhich of the following is the underlying genetic mechanism?","options":["CGG trinucleotide repeat expansion causing hypermethylation of FMR1","Deletion at 22q11","Nondisjunction of chromosome 21","CTG repeat expansion in DMPK","CAG repeat expansion in the huntingtin gene"],"answer":0,"explanation":"Fragile X syndrome is an X-linked dominant disorder caused by expansion of CGG repeats in FMR1 (more than 200). The expansion causes hypermethylation and silencing of the gene. It is the most common inherited cause of intellectual disability and the second most common genetic cause after Down syndrome. Features include a long face, large jaw and ears, macroorchidism, mitral valve prolapse, and autism. Repeats expand when passed through the mother, so it shows anticipation.","ko":"취약 X: FMR1 CGG 반복 → 과메틸화, 긴 얼굴·큰 귀·거대고환, 모계 전달 시 확장."},{"id":"gp20","steps":["1"],"system":"General Principles","discipline":"Genetics","topic":"Hardy-Weinberg carrier frequency","stem":"In a population in Hardy-Weinberg equilibrium, an autosomal recessive disease affects 1 in 2,500 newborns.\n\nWhich of the following is closest to the frequency of heterozygous carriers in this population?","options":["1 in 25","1 in 50","1 in 100","1 in 1,250","1 in 2,500"],"answer":0,"explanation":"Under Hardy-Weinberg equilibrium, p² + 2pq + q² = 1. The affected frequency q² = 1/2,500, so q = 1/50. Because q is small, p is about 1, and the carrier frequency 2pq is about 2 × 1/50 = 1/25. This matches cystic fibrosis in people of Northern European descent. For X-linked recessive diseases, the frequency of affected males equals q.","ko":"Hardy-Weinberg: q² = 유병률 → q = √유병률, 보인자 ≈ 2q. 1/2500 → 1/25."},{"id":"gp21","steps":["1"],"system":"General Principles","discipline":"Genetics","topic":"Down syndrome screening","stem":"A 41-year-old woman at 16 weeks' gestation has a quadruple screen. Results show low α-fetoprotein, high β-hCG, low unconjugated estriol, and high inhibin A.\n\nWhich of the following is the most likely mechanism of the fetal abnormality suggested by these results?","options":["Mitotic nondisjunction after fertilization in most cases","Robertsonian translocation inherited from the father","Meiotic nondisjunction in the mother","Uniparental disomy","Deletion of part of chromosome 5"],"answer":2,"explanation":"The quadruple screen pattern of low AFP, high hCG, low estriol, and high inhibin A suggests trisomy 21. About 95% of cases result from meiotic nondisjunction, usually in maternal meiosis I, and the risk rises with maternal age. About 4% result from an unbalanced Robertsonian translocation (often familial), and about 1% are mosaic from mitotic errors. Trisomy 18 lowers all four markers except inhibin, which is normal.","ko":"쿼드 스크린 AFP↓·hCG↑·estriol↓·inhibin A↑ = 다운증후군, 대부분 모체 감수분열 I 비분리."},{"id":"gp22","steps":["1"],"system":"General Principles","discipline":"Genetics","topic":"Xeroderma pigmentosum","stem":"A 7-year-old girl has had severe sunburn after minimal sun exposure since infancy. She now has many freckles, dry skin, and several basal cell and squamous cell carcinomas on her face. Her cells cannot repair thymine dimers after UV exposure.\n\nWhich DNA repair pathway is defective?","options":["Nonhomologous end joining","Homologous recombination","Mismatch repair","Base excision repair","Nucleotide excision repair"],"answer":4,"explanation":"Xeroderma pigmentosum is an autosomal recessive defect in nucleotide excision repair, which removes bulky lesions such as UV-induced pyrimidine (thymine) dimers through endonucleases that cut out the damaged segment. Patients have extreme photosensitivity and develop skin cancers, including melanoma, at a young age. Mismatch repair is defective in Lynch syndrome, and homologous recombination in BRCA1/2, Fanconi anemia, and Bloom syndrome.","ko":"색소성 건피증: 뉴클레오티드 절제 복구 결함 → 자외선 티민 이량체 → 소아 피부암."},{"id":"gp23","steps":["1"],"system":"General Principles","discipline":"Genetics","topic":"Li-Fraumeni syndrome","stem":"A 30-year-old woman develops breast cancer. She had osteosarcoma as a teenager. Her brother had a brain tumor in childhood, and her mother had an adrenocortical carcinoma at age 35.\n\nA germline mutation in which of the following genes is most likely?","options":["VHL","RB1","APC","BRCA1","TP53"],"answer":4,"explanation":"Li-Fraumeni syndrome is an autosomal dominant germline mutation of TP53 that predisposes to many cancers at young ages: sarcomas, breast cancer, brain tumors, adrenocortical carcinoma, and leukemia. p53 normally arrests the cell cycle at G1/S in response to DNA damage by increasing p21, and triggers apoptosis if damage cannot be repaired. Patients need intensive cancer screening and avoidance of radiation when possible.","ko":"Li-Fraumeni = 생식세포 TP53, 젊은 나이 육종·유방암·뇌종양·부신피질암."},{"id":"gp24","steps":["1"],"system":"General Principles","discipline":"Pharmacology","topic":"Time to steady state","stem":"A drug with first-order elimination and a half-life of 6 hours is started as a continuous IV infusion at a constant rate without a loading dose.\n\nApproximately how long will it take to reach steady-state plasma concentration?","options":["6 hours","12 hours","48 hours","72 hours","24 to 30 hours"],"answer":4,"explanation":"For a drug with first-order kinetics, steady state is reached after about 4 to 5 half-lives, regardless of dose or infusion rate: 4 to 5 × 6 hours = 24 to 30 hours. After 1 half-life the concentration is 50% of steady state, after 2 it is 75%, after 3 it is 87.5%, and after 4 it is 93.75%. A loading dose reaches the target concentration faster. The infusion rate determines the level of the steady state, not the time to reach it.","ko":"정상상태 도달 = 반감기 4~5배 (용량과 무관). 부하용량으로 빠르게 도달."},{"id":"gp25","steps":["1"],"system":"General Principles","discipline":"Pharmacology","topic":"Competitive vs noncompetitive antagonist","stem":"A researcher generates dose-response curves for an agonist alone and in the presence of drug X. With drug X, the curve shifts to the right in parallel, and the maximal response is still reached at very high agonist concentrations.\n\nWhich of the following best describes drug X?","options":["Competitive antagonist","Irreversible antagonist","Noncompetitive antagonist","Partial agonist","Inverse agonist"],"answer":0,"explanation":"A competitive antagonist binds reversibly to the same site as the agonist, so enough agonist can overcome it: the curve shifts right (potency decreases) while efficacy (maximal effect) is unchanged. A noncompetitive or irreversible antagonist lowers the maximal effect, which cannot be overcome by more agonist. A partial agonist produces a lower maximal effect than a full agonist even at full receptor occupancy.","ko":"경쟁적 길항제: 곡선 우측 평행 이동, 최대효과 동일. 비경쟁적: 최대효과↓."},{"id":"gp26","steps":["1"],"system":"General Principles","discipline":"Pharmacology","topic":"Drug-induced lupus","stem":"A 60-year-old man has had joint pain, fever, and pleuritic chest pain for a month. He has taken a medication for several months. Antinuclear antibodies and antihistone antibodies are positive; anti-dsDNA is negative. Kidney function is normal. His symptoms resolve after the drug is stopped.\n\nWhich of the following drugs most likely caused this reaction?","options":["Metoprolol","Amlodipine","Procainamide","Lisinopril","Atorvastatin"],"answer":2,"explanation":"Drug-induced lupus is associated with antihistone antibodies and rarely involves the kidneys or CNS. Classic causes include procainamide, hydralazine, and isoniazid, which are metabolized by N-acetylation; slow acetylators have a higher risk. Other causes include TNF-α inhibitors, minocycline, and methyldopa. It resolves when the drug is stopped.","ko":"약물유발 루푸스: 항히스톤 항체, procainamide·hydralazine·isoniazid (느린 아세틸화)."},{"id":"gp27","steps":["1"],"system":"General Principles","discipline":"Pharmacology","topic":"Anticholinergic toxicity","stem":"A 3-year-old boy is brought in after eating berries from a jimsonweed plant. He is agitated and hallucinating, his skin is hot, dry, and flushed, his pupils are dilated, his bowel sounds are absent, and his bladder is distended. Pulse is 160/min.\n\nWhich of the following drugs reverses both the central and peripheral effects of this poisoning?","options":["Flumazenil","Physostigmine","Pralidoxime","Atropine","Neostigmine"],"answer":1,"explanation":"Anticholinergic toxicity (from jimsonweed, atropine, antihistamines, TCAs, and antipsychotics) causes hyperthermia, dry flushed skin, mydriasis, delirium, tachycardia, urinary retention, and ileus: hot as a hare, dry as a bone, red as a beet, blind as a bat, and mad as a hatter. Physostigmine is a tertiary amine acetylcholinesterase inhibitor that crosses the blood-brain barrier and reverses central and peripheral effects. Neostigmine is a quaternary amine that does not cross into the brain.","ko":"항콜린 중독(덥고·건조·붉고·산동·섬망) → physostigmine (BBB 통과)."},{"id":"gp28","steps":["1"],"system":"General Principles","discipline":"Pharmacology","topic":"Organophosphate poisoning","stem":"A 40-year-old farmer is brought in after spraying insecticide without protection. He is drooling and sweating, has watery diarrhea, urinary incontinence, wheezing with copious bronchial secretions, pinpoint pupils, a heart rate of 44/min, and muscle twitching.\n\nIn addition to atropine, which of the following drugs should be given to regenerate acetylcholinesterase?","options":["Edrophonium","Bethanechol","Neostigmine","Physostigmine","Pralidoxime"],"answer":4,"explanation":"Organophosphates irreversibly inhibit acetylcholinesterase, causing excess acetylcholine at muscarinic receptors (diarrhea, urination, miosis, bronchospasm, bradycardia, emesis, lacrimation, and salivation, plus sweating) and nicotinic receptors (fasciculations and paralysis). Atropine blocks muscarinic effects but not nicotinic ones. Pralidoxime reactivates acetylcholinesterase if given before the enzyme ages, reversing nicotinic and muscarinic effects.","ko":"유기인 중독: 무스카린(DUMBBELS) + 니코틴(근섬유속연축) → atropine + pralidoxime."},{"id":"gp29","steps":["1"],"system":"General Principles","discipline":"Pharmacology","topic":"Epinephrine reversal","stem":"In an experiment, a moderate dose of epinephrine raises a subject's mean arterial pressure. After pretreatment with phenoxybenzamine, the same dose of epinephrine lowers the mean arterial pressure.\n\nWhich of the following receptors mediates the fall in blood pressure after pretreatment?","options":["M3 muscarinic receptors","β1-adrenergic receptors","β2-adrenergic receptors","α1-adrenergic receptors","α2-adrenergic receptors"],"answer":2,"explanation":"Epinephrine acts on α1 receptors (vasoconstriction), β1 receptors (increased heart rate and contractility), and β2 receptors (vasodilation in skeletal muscle). Normally the α1 vasoconstriction dominates at moderate to high doses. When α receptors are blocked by phenoxybenzamine, the β2-mediated vasodilation is unopposed, so blood pressure falls (epinephrine reversal). Norepinephrine, which has little β2 activity, does not cause this reversal.","ko":"α차단 후 에피네프린 → β2 혈관확장 노출 → 혈압↓ (epinephrine reversal)."},{"id":"gp30","steps":["1"],"system":"General Principles","discipline":"Pharmacology","topic":"First-order vs zero-order kinetics","stem":"A 45-year-old man drinks heavily. Regardless of how high his blood alcohol concentration is, his body eliminates a fixed amount of ethanol per hour.\n\nWhich of the following drugs follows the same type of elimination kinetics at high doses?","options":["Lithium","Phenytoin","Penicillin","Metformin","Gentamicin"],"answer":1,"explanation":"In zero-order kinetics, a constant amount of drug is eliminated per unit time because the enzymes are saturated, so the half-life is not constant and levels can rise disproportionately with small dose increases. Examples are phenytoin, ethanol, and aspirin at high doses. Most drugs follow first-order kinetics, in which a constant fraction is eliminated per unit time and the half-life is constant.","ko":"0차 동역학(일정량 제거): phenytoin, 에탄올, 고용량 아스피린."},{"id":"hm01","steps":["1"],"system":"Hematology & Oncology","discipline":"Physiology","topic":"Anemia of chronic disease","stem":"A 58-year-old woman with long-standing rheumatoid arthritis has fatigue. Hemoglobin is 10.1 g/dL with an MCV of 82 fL. Serum iron is low, total iron-binding capacity is low, and ferritin is elevated.\n\nWhich of the following best explains her anemia?","options":["Deficiency of vitamin B12","Chronic gastrointestinal blood loss","Lead inhibition of heme synthesis","Defective globin chain synthesis","Increased hepcidin trapping iron in macrophages and limiting absorption"],"answer":4,"explanation":"In anemia of chronic disease, inflammatory cytokines (especially IL-6) increase hepatic hepcidin. Hepcidin degrades ferroportin, trapping iron in macrophages and reducing intestinal absorption, so iron is unavailable for erythropoiesis. Ferritin, an acute-phase reactant and storage protein, is normal or high, and TIBC is low. In iron deficiency, ferritin is low and TIBC is high.","ko":"만성질환 빈혈: IL-6 → hepcidin↑ → 철 격리. Ferritin↑, TIBC↓ (철결핍은 반대)."},{"id":"hm02","steps":["1"],"system":"Hematology & Oncology","discipline":"Biochemistry","topic":"Lead poisoning","stem":"A 3-year-old boy living in an old house with peeling paint has abdominal pain, constipation, irritability, and developmental regression. Hemoglobin is 8.9 g/dL with an MCV of 70 fL. A blood smear shows red cells with coarse blue granules. X-rays show dense lines at the metaphyses of the long bones.\n\nLead inhibits which of the following enzymes in heme synthesis?","options":["δ-Aminolevulinic acid dehydratase and ferrochelatase","δ-Aminolevulinic acid synthase","Uroporphyrinogen decarboxylase","Glucose-6-phosphate dehydrogenase","Porphobilinogen deaminase"],"answer":0,"explanation":"Lead inhibits ALA dehydratase and ferrochelatase, causing accumulation of ALA and protoporphyrin and a microcytic, sideroblastic anemia with basophilic stippling (aggregated ribosomes). It also causes encephalopathy, neuropathy (wrist and foot drop in adults), abdominal colic, lead lines on gums and metaphyses, and renal injury. Chelation uses succimer in children, or EDTA and dimercaprol in severe cases. Porphobilinogen deaminase deficiency causes acute intermittent porphyria.","ko":"납 중독: ALA dehydratase·ferrochelatase 억제, 호염기성 반점, 소구성 빈혈."},{"id":"hm03","steps":["1"],"system":"Hematology & Oncology","discipline":"Pharmacology","topic":"Isoniazid sideroblastic anemia","stem":"A 45-year-old man is treated for latent tuberculosis with isoniazid. Four months later he has fatigue and numbness in his feet. Hemoglobin is 9.2 g/dL with an MCV of 74 fL. Bone marrow aspirate shows red cell precursors with iron-laden mitochondria forming a ring around the nucleus.\n\nWhich of the following would most likely have prevented this complication?","options":["Pyridoxine supplementation","Vitamin C supplementation","Folic acid supplementation","Vitamin B12 injections","Iron supplementation"],"answer":0,"explanation":"Isoniazid interferes with vitamin B6 (pyridoxine), which is the cofactor for δ-ALA synthase, the rate-limiting enzyme of heme synthesis. Without B6, iron cannot be incorporated into heme and accumulates in mitochondria, forming ringed sideroblasts. B6 deficiency also causes peripheral neuropathy. Pyridoxine is given with isoniazid to prevent both. Other causes of sideroblastic anemia include alcohol, lead, copper deficiency, and X-linked ALA synthase mutations.","ko":"Isoniazid → B6 결핍 → ALA synthase 장애 → 환상 철적모구 + 신경병증. 예방 B6."},{"id":"hm04","steps":["1"],"system":"Hematology & Oncology","discipline":"Pathology","topic":"Beta-thalassemia major","stem":"A 2-year-old boy of Greek descent has pallor, poor growth, and an enlarged spleen and liver. His cheekbones and forehead are prominent. Hemoglobin is 5.8 g/dL, MCV is 58 fL, and a smear shows target cells and nucleated red cells. Skull x-ray shows a hair-on-end pattern.\n\nHemoglobin electrophoresis would most likely show which of the following?","options":["Increased HbS","HbH (β4 tetramers)","Increased HbA2 with normal HbF only","Hb Barts (γ4 tetramers)","Absent or markedly reduced HbA with increased HbF"],"answer":4,"explanation":"β-Thalassemia major (homozygous) results in little or no β-globin production, so HbA (α2β2) is absent or very low and HbF (α2γ2) is increased. Excess α chains precipitate in red cell precursors, causing ineffective erythropoiesis, marrow expansion (crew-cut skull, chipmunk facies), extramedullary hematopoiesis, and hepatosplenomegaly. Patients need lifelong transfusions with iron chelation. HbH and Hb Barts occur in α-thalassemia.","ko":"β지중해빈혈 major: HbA 없음, HbF↑, 골수 팽창(hair-on-end), 수혈 + 철킬레이트."},{"id":"hm05","steps":["1"],"system":"Hematology & Oncology","discipline":"Pharmacology","topic":"Hydroxyurea in sickle cell","stem":"A 16-year-old boy with sickle cell disease has had four painful crises requiring hospitalization in the past year and one episode of acute chest syndrome. He is started on a daily oral medication that reduces the frequency of these episodes.\n\nWhich of the following best explains the beneficial effect of this drug?","options":["Increased oxygen affinity of HbS by binding at the β6 position","Correction of the point mutation in the β-globin gene","Increased production of fetal hemoglobin","Prevention of red cell dehydration by blocking potassium channels","Inhibition of platelet aggregation"],"answer":2,"explanation":"Sickle cell disease is caused by a point mutation replacing glutamic acid with valine at position 6 of β-globin. Deoxygenated HbS polymerizes, deforming red cells and causing hemolysis and vaso-occlusion. Hydroxyurea, a ribonucleotide reductase inhibitor, increases HbF, which does not polymerize with HbS, reducing painful crises and acute chest syndrome. Complications include autosplenectomy with infections by encapsulated organisms and Salmonella osteomyelitis.","ko":"겸상적혈구(Glu6Val): hydroxyurea → HbF↑ → 위기 감소. 피막균·Salmonella 골수염."},{"id":"hm06","steps":["1"],"system":"Hematology & Oncology","discipline":"Pathology","topic":"Hereditary spherocytosis","stem":"A 10-year-old girl of Northern European descent has intermittent jaundice and an enlarged spleen. Her father had his spleen removed as a young man. Hemoglobin is 10.4 g/dL, reticulocyte count is 9%, and MCHC is increased. The smear shows small, round red cells without central pallor. The direct Coombs test is negative.\n\nThis condition most commonly results from a defect in which of the following?","options":["Glucose-6-phosphate dehydrogenase","β-Globin chain synthesis","CD55 and CD59 on the red cell surface","Ankyrin or spectrin in the red cell membrane skeleton","Pyruvate kinase"],"answer":3,"explanation":"Hereditary spherocytosis is usually autosomal dominant and involves defects in membrane skeleton proteins such as ankyrin, band 3, spectrin, or protein 4.2. Red cells lose membrane, become spherical and rigid, and are destroyed in the spleen, causing extravascular hemolysis, splenomegaly, pigment gallstones, and aplastic crisis with parvovirus B19. MCHC is increased. Diagnosis uses the EMA binding test or osmotic fragility, and splenectomy is curative for the anemia.","ko":"유전성 구형적혈구증: ankyrin·spectrin 결함, MCHC↑, Coombs(−), 비장절제."},{"id":"hm07","steps":["1"],"system":"Hematology & Oncology","discipline":"Pathology","topic":"Paroxysmal nocturnal hemoglobinuria","stem":"A 34-year-old man notices dark urine in the morning and has fatigue. He recently had a hepatic vein thrombosis. Hemoglobin is 8.6 g/dL with elevated LDH and low haptoglobin, and the direct Coombs test is negative. Flow cytometry shows that his red cells lack CD55 and CD59.\n\nWhich of the following is the underlying defect?","options":["Inherited deficiency of complement factor H","Autoantibodies against red cell antigens","Defect in the red cell membrane skeleton","Deficiency of ADAMTS13","Acquired mutation in PIGA impairing GPI anchor synthesis"],"answer":4,"explanation":"Paroxysmal nocturnal hemoglobinuria is caused by an acquired mutation in PIGA in a hematopoietic stem cell, preventing synthesis of the GPI anchor that holds complement inhibitors CD55 (DAF) and CD59 (MIRL) on the cell surface. Red cells, platelets, and white cells become susceptible to complement-mediated lysis, causing intravascular hemolysis, thrombosis (especially hepatic and abdominal veins), and pancytopenia. Eculizumab, a C5 inhibitor, blocks complement-mediated lysis.","ko":"PNH: PIGA 변이 → GPI 앵커 결손 → CD55/59 소실 → 혈관내 용혈 + 혈전. Eculizumab."},{"id":"hm08","steps":["1"],"system":"Hematology & Oncology","discipline":"Immunology","topic":"Cold agglutinin disease","stem":"A 22-year-old student has fever and a dry cough for 10 days and now has fatigue and dark urine. His fingers turn blue when he is outside in cold weather. Hemoglobin is 8.8 g/dL with elevated indirect bilirubin. The direct Coombs test is positive for C3 but negative for IgG, and the blood clumps on the slide at room temperature.\n\nWhich of the following is the most likely cause of his anemia?","options":["Defective red cell membrane skeleton","Mechanical destruction by fibrin strands","IgM autoantibodies that bind red cells at cold temperatures","IgG autoantibodies that bind red cells at body temperature","Deficiency of glucose-6-phosphate dehydrogenase"],"answer":2,"explanation":"Cold agglutinin disease is caused by IgM antibodies that bind red cells in cooler parts of the body and fix complement, causing hemolysis and acrocyanosis; the direct Coombs test is positive for C3. It occurs after Mycoplasma pneumoniae or EBV infection and with lymphoproliferative disorders. Warm autoimmune hemolytic anemia is caused by IgG and is associated with SLE, CLL, and drugs such as α-methyldopa.","ko":"한랭응집소: IgM, 보체(C3)+, Mycoplasma·EBV. 온난형은 IgG(SLE·CLL)."},{"id":"hm09","steps":["1"],"system":"Hematology & Oncology","discipline":"Biochemistry","topic":"B12 versus folate deficiency","stem":"A 66-year-old woman has fatigue and macrocytic anemia with hypersegmented neutrophils. Her neurologic examination is normal.\n\nWhich of the following laboratory findings would distinguish vitamin B12 deficiency from folate deficiency in this patient?","options":["Elevated LDH","Elevated MCV","Elevated serum homocysteine","Low reticulocyte count","Elevated serum methylmalonic acid"],"answer":4,"explanation":"Both folate and vitamin B12 are needed to convert homocysteine to methionine, so homocysteine rises in both. B12 is also the cofactor for methylmalonyl-CoA mutase, so methylmalonic acid rises only in B12 deficiency. Both cause megaloblastic anemia with hypersegmented neutrophils, but only B12 deficiency causes neurologic disease. Giving folate to a B12-deficient patient can correct the anemia while the neurologic damage progresses.","ko":"B12 결핍만 메틸말론산↑ (호모시스테인은 둘 다↑). 신경증상도 B12만."},{"id":"hm10","steps":["1"],"system":"Hematology & Oncology","discipline":"Pathology","topic":"Hemophilia A","stem":"A 2-year-old boy has a swollen, painful knee after a minor fall. His maternal uncle had similar episodes of joint bleeding. Platelet count and PT are normal, while the PTT is prolonged and corrects when mixed with normal plasma.\n\nWhich of the following is most likely deficient?","options":["Fibrinogen","Von Willebrand factor","Factor VII","Platelet glycoprotein Ib","Factor VIII"],"answer":4,"explanation":"Hemophilia A is an X-linked recessive deficiency of factor VIII in the intrinsic pathway, causing a prolonged PTT with normal PT and platelet count. Bleeding is deep: into joints (hemarthrosis), muscles, and after procedures. Hemophilia B involves factor IX. A mixing study that corrects indicates a factor deficiency rather than an inhibitor. Treatment includes factor VIII replacement, emicizumab, and desmopressin in mild cases. Factor VII deficiency prolongs the PT.","ko":"혈우병 A: 제8인자, X연관, 관절 출혈, PTT만 연장, 혼합검사 교정."},{"id":"hm11","steps":["1"],"system":"Hematology & Oncology","discipline":"Pharmacology","topic":"Von Willebrand disease and desmopressin","stem":"A 16-year-old girl has heavy menstrual periods since menarche, frequent nosebleeds, and prolonged bleeding after a tooth extraction. Her mother has similar symptoms. Platelet count and PT are normal, and PTT is mildly prolonged. Ristocetin-induced platelet aggregation is reduced.\n\nDesmopressin is effective in this condition by which of the following mechanisms?","options":["Stimulating thrombopoietin production","Inhibiting plasmin","Activating platelet ADP receptors","Increasing hepatic synthesis of clotting factors","Releasing von Willebrand factor from endothelial Weibel-Palade bodies"],"answer":4,"explanation":"Von Willebrand disease is the most common inherited bleeding disorder and is usually autosomal dominant. Von Willebrand factor mediates platelet adhesion to collagen through glycoprotein Ib and stabilizes factor VIII, so patients have mucocutaneous bleeding, sometimes with a mildly prolonged PTT. Ristocetin cofactor activity is reduced. Desmopressin, a V2 agonist, releases stored vWF from Weibel-Palade bodies in endothelial cells. Tranexamic acid, an antifibrinolytic, is also used.","ko":"vWD: 점막 출혈, 리스토세틴 응집↓, desmopressin → Weibel-Palade body에서 vWF 방출."},{"id":"hm12","steps":["1"],"system":"Hematology & Oncology","discipline":"Pathology","topic":"Thrombotic thrombocytopenic purpura","stem":"A 34-year-old woman is brought to the emergency department because of confusion and fever. Platelet count is 18,000/mm³, hemoglobin is 7.9 g/dL, LDH is markedly elevated, and creatinine is 1.9 mg/dL. The blood smear shows many schistocytes. PT and PTT are normal.\n\nDeficient activity of which of the following is the most likely cause?","options":["Antithrombin III","Von Willebrand factor","Protein C","Factor VIII","ADAMTS13"],"answer":4,"explanation":"Thrombotic thrombocytopenic purpura is usually caused by autoantibodies against ADAMTS13, the protease that cleaves large von Willebrand factor multimers. Unusually large multimers form platelet microthrombi, causing thrombocytopenia, microangiopathic hemolytic anemia with schistocytes, and organ ischemia, especially neurologic and renal. Because the clotting cascade is not activated, PT and PTT are normal, unlike DIC. Treatment is urgent plasma exchange, steroids, and caplacizumab. Platelet transfusion is avoided.","ko":"TTP: ADAMTS13 결핍, 혈소판↓ + 분열적혈구 + 신경·신장, PT/PTT 정상 → 혈장교환."},{"id":"hm13","steps":["1"],"system":"Hematology & Oncology","discipline":"Pathology","topic":"Disseminated intravascular coagulation","stem":"A 30-year-old woman develops bleeding from her IV sites and gums after delivery complicated by placental abruption. Platelet count is 42,000/mm³, PT and PTT are prolonged, fibrinogen is 80 mg/dL, and D-dimer is markedly elevated. The smear shows schistocytes.\n\nWhich of the following best explains these findings?","options":["Autoantibodies against platelet glycoprotein IIb/IIIa","Autoantibodies against ADAMTS13","Deficiency of vitamin K-dependent factors","Widespread activation of coagulation consuming platelets and clotting factors","Inherited deficiency of factor VIII"],"answer":3,"explanation":"Disseminated intravascular coagulation is widespread activation of coagulation, often by tissue factor released in obstetric complications, sepsis, trauma, acute promyelocytic leukemia, or pancreatitis. Clotting factors and platelets are consumed, causing bleeding, while microthrombi cause organ damage and microangiopathic hemolysis. PT and PTT are prolonged, fibrinogen is low, and fibrin degradation products such as D-dimer are high. Treatment addresses the cause, with replacement of blood products.","ko":"DIC: PT·PTT↑, 섬유소원↓, D-dimer↑, 혈소판↓. 원인: 산과·패혈증·APL."},{"id":"hm14","steps":["1"],"system":"Hematology & Oncology","discipline":"Immunology","topic":"Heparin-induced thrombocytopenia","stem":"A 66-year-old man receives unfractionated heparin after knee replacement. On postoperative day 7 his platelet count falls from 260,000 to 90,000/mm³, and he develops a swollen, painful left leg from a deep vein thrombosis.\n\nWhich of the following is the most appropriate next step?","options":["Stop heparin and start a direct thrombin inhibitor such as argatroban","Transfuse platelets","Switch to low-molecular-weight heparin","Continue heparin and add warfarin","Give protamine sulfate"],"answer":0,"explanation":"Heparin-induced thrombocytopenia type 2 is caused by IgG antibodies against complexes of heparin and platelet factor 4. These activate platelets, causing thrombocytopenia and paradoxical arterial and venous thrombosis, typically 5 to 10 days after heparin is started. All heparin, including LMWH (which cross-reacts), must be stopped and a nonheparin anticoagulant such as argatroban, bivalirudin, or fondaparinux started. Warfarin alone is avoided initially because it can cause venous limb gangrene.","ko":"HIT: 헤파린-PF4 항체, 5~10일, 혈소판↓ + 혈전 → 헤파린(LMWH 포함) 중단, argatroban."},{"id":"hm15","steps":["1"],"system":"Hematology & Oncology","discipline":"Pharmacology","topic":"Warfarin skin necrosis","stem":"A 44-year-old woman with a new deep vein thrombosis is started on warfarin without a bridging anticoagulant. On the fourth day, she develops painful, dark purple, necrotic patches on her thighs and breasts. She is later found to have a hereditary deficiency of a natural anticoagulant.\n\nWhich of the following best explains this reaction?","options":["Allergic vasculitis caused by warfarin","Antibodies against heparin-platelet factor 4 complexes","Excess anticoagulation causing bleeding into the skin","Early fall in protein C causing a transient hypercoagulable state","Deficiency of vitamin C impairing collagen"],"answer":3,"explanation":"Warfarin inhibits vitamin K epoxide reductase, reducing synthesis of factors II, VII, IX, and X and proteins C and S. Protein C has a short half-life, like factor VII, so it falls first while the long-lived procoagulant factors remain, causing a transient hypercoagulable state. In patients with protein C deficiency this can cause thrombosis of dermal vessels and skin necrosis. Bridging with heparin until the INR is therapeutic prevents it.","ko":"와파린 피부괴사: 단백질 C 반감기 짧음 → 초기 과응고. 헤파린 브리징으로 예방."},{"id":"hm16","steps":["1"],"system":"Hematology & Oncology","discipline":"Biochemistry","topic":"Factor V Leiden","stem":"A 28-year-old woman who recently started oral contraceptives develops a deep vein thrombosis in her calf. Her father had a pulmonary embolism at age 40. Genetic testing shows a point mutation substituting glutamine for arginine at position 506 in a clotting factor.\n\nWhich of the following best explains her increased risk of thrombosis?","options":["Defective fibrinolysis by plasmin","Antibodies against phospholipids","Deficiency of antithrombin III","The mutated factor resists inactivation by activated protein C","Increased prothrombin synthesis from a 3′ untranslated region mutation"],"answer":3,"explanation":"Factor V Leiden is the most common inherited thrombophilia in people of European descent. The mutation removes a cleavage site for activated protein C, so factor Va stays active longer and promotes thrombosis. Estrogen increases the risk further. The prothrombin G20210A mutation increases prothrombin levels, and antithrombin deficiency causes resistance to heparin.","ko":"Factor V Leiden: 활성 단백질 C 저항성 → 혈전. 에스트로겐이 위험 증가."},{"id":"hm17","steps":["1"],"system":"Hematology & Oncology","discipline":"Pharmacology","topic":"Heparin reversal","stem":"A 70-year-old man receiving an IV unfractionated heparin infusion for a pulmonary embolism develops bleeding from his gastrointestinal tract. His PTT is markedly prolonged.\n\nWhich of the following drugs rapidly reverses the effect of heparin?","options":["Andexanet alfa","Tranexamic acid","Idarucizumab","Protamine sulfate","Vitamin K"],"answer":3,"explanation":"Unfractionated heparin activates antithrombin, which inactivates thrombin (IIa) and factor Xa; its effect is monitored with the PTT. Protamine sulfate is a positively charged protein that binds negatively charged heparin and reverses it quickly; it only partly reverses LMWH. Vitamin K and prothrombin complex concentrate reverse warfarin, idarucizumab reverses dabigatran, and andexanet alfa reverses factor Xa inhibitors.","ko":"헤파린 해독 = protamine. 와파린 = 비타민 K·PCC, 다비가트란 = idarucizumab."},{"id":"hm18","steps":["1"],"system":"Hematology & Oncology","discipline":"Pharmacology","topic":"Direct oral anticoagulants","stem":"A 72-year-old woman with nonvalvular atrial fibrillation is started on an oral anticoagulant that directly inhibits thrombin and does not require INR monitoring.\n\nWhich of the following drugs was prescribed?","options":["Warfarin","Dabigatran","Rivaroxaban","Enoxaparin","Apixaban"],"answer":1,"explanation":"Dabigatran is an oral direct thrombin (factor IIa) inhibitor reversed by idarucizumab. Rivaroxaban and apixaban directly inhibit factor Xa and are reversed by andexanet alfa. These direct oral anticoagulants do not need routine monitoring and have fewer interactions than warfarin. Enoxaparin is an injected low-molecular-weight heparin that acts mainly on factor Xa through antithrombin.","ko":"Dabigatran = 직접 트롬빈 억제. Rivaroxaban·apixaban = Xa 억제 (-xaban)."},{"id":"hm19","steps":["1"],"system":"Hematology & Oncology","discipline":"Pathology","topic":"Chronic myeloid leukemia","stem":"A 52-year-old man has fatigue, night sweats, and fullness in his left upper abdomen. The spleen is palpable 10 cm below the costal margin. Leukocyte count is 168,000/mm³ with neutrophils, myelocytes, metamyelocytes, and increased basophils. Leukocyte alkaline phosphatase is low.\n\nWhich of the following drugs targets the molecular defect in this disease?","options":["Cladribine","Rituximab","Hydroxyurea","Imatinib","All-trans retinoic acid"],"answer":3,"explanation":"Chronic myeloid leukemia is a myeloproliferative neoplasm caused by the Philadelphia chromosome, t(9;22), which fuses BCR and ABL to form a constitutively active tyrosine kinase. It causes marked leukocytosis with myeloid cells at all stages of maturation, basophilia, and splenomegaly. Low leukocyte alkaline phosphatase distinguishes it from a leukemoid reaction. Imatinib and other tyrosine kinase inhibitors block BCR-ABL. Untreated, it can progress to blast crisis.","ko":"CML: t(9;22) BCR-ABL, 호염기구↑, LAP↓ → imatinib."},{"id":"hm20","steps":["1"],"system":"Hematology & Oncology","discipline":"Pathology","topic":"Acute promyelocytic leukemia","stem":"A 38-year-old woman has gum bleeding and bruising. Platelet count is 22,000/mm³, fibrinogen is low, and D-dimer is elevated. The blood smear shows abnormal promyelocytes with many rod-shaped cytoplasmic inclusions. Cytogenetic analysis shows t(15;17).\n\nWhich of the following treatments induces differentiation of the malignant cells?","options":["Cytarabine alone","Rituximab","Methotrexate","Imatinib","All-trans retinoic acid"],"answer":4,"explanation":"Acute promyelocytic leukemia (AML M3) is caused by t(15;17), which fuses PML with the retinoic acid receptor α gene, blocking maturation at the promyelocyte stage. Promyelocytes contain many Auer rods, and their granules release procoagulants that cause DIC, a medical emergency. All-trans retinoic acid (a vitamin A derivative) and arsenic trioxide force the promyelocytes to differentiate, and the prognosis is excellent with treatment. Differentiation syndrome is a complication.","ko":"APL: t(15;17) PML-RARA, Auer rod, DIC → ATRA(비타민 A)·비소."},{"id":"hm21","steps":["1"],"system":"Hematology & Oncology","discipline":"Pathology","topic":"Acute lymphoblastic leukemia","stem":"A 4-year-old boy with Down syndrome has fever, pallor, bruising, and bone pain. Leukocyte count is 48,000/mm³ with many blasts, hemoglobin is 7.2 g/dL, and platelets are 31,000/mm³. Flow cytometry shows the blasts are positive for CD10, CD19, and terminal deoxynucleotidyl transferase.\n\nWhich of the following is the most likely diagnosis?","options":["Burkitt lymphoma","Chronic lymphocytic leukemia","Acute myeloid leukemia","B-cell acute lymphoblastic leukemia","Hairy cell leukemia"],"answer":3,"explanation":"Acute lymphoblastic leukemia is the most common cancer in children, and Down syndrome increases the risk. Lymphoblasts are TdT-positive; B-ALL expresses CD10, CD19, and CD20, while T-ALL expresses CD2 to CD8 and may present as a mediastinal mass. Bone marrow failure causes anemia, bleeding, and infection. ALL responds well to chemotherapy; t(12;21) has a good prognosis and t(9;22) a poor one. CNS and testes are sanctuary sites.","ko":"ALL: 소아 최다 암, TdT(+), Down 연관. t(12;21) 예후 좋음."},{"id":"hm22","steps":["1"],"system":"Hematology & Oncology","discipline":"Pathology","topic":"Chronic lymphocytic leukemia","stem":"A 71-year-old man has painless lymphadenopathy and fatigue. Leukocyte count is 64,000/mm³, mostly small mature-appearing lymphocytes, and the smear shows many fragile, smudged cells. Flow cytometry shows B cells that express CD5 and CD23. Hemoglobin is 9.8 g/dL, and the direct Coombs test is positive for IgG.\n\nWhich of the following is the most likely diagnosis?","options":["Chronic lymphocytic leukemia","Mantle cell lymphoma","Multiple myeloma","Acute lymphoblastic leukemia","Hairy cell leukemia"],"answer":0,"explanation":"Chronic lymphocytic leukemia (small lymphocytic lymphoma when it is mainly in nodes) is the most common leukemia in adults over 60. Neoplastic B cells express CD5 and CD23, and smudge cells are seen on the smear. It often causes warm autoimmune hemolytic anemia and hypogammaglobulinemia, and it can transform into diffuse large B-cell lymphoma (Richter transformation). Mantle cell lymphoma is also CD5-positive but CD23-negative, with t(11;14) and cyclin D1 overexpression.","ko":"CLL: 고령, smudge cell, CD5+/CD23+, 온난 자가면역 용혈. 외투세포는 CD23(−)·t(11;14)."},{"id":"hm23","steps":["1"],"system":"Hematology & Oncology","discipline":"Pathology","topic":"Hairy cell leukemia","stem":"A 54-year-old man has fatigue and early satiety. He has massive splenomegaly without lymphadenopathy. CBC shows pancytopenia. Bone marrow aspiration yields no material. Peripheral blood shows B cells with fine cytoplasmic projections that stain positive for tartrate-resistant acid phosphatase. A BRAF V600E mutation is present.\n\nWhich of the following is the most appropriate treatment?","options":["Cladribine","Imatinib","Ibrutinib as first-line in all patients","All-trans retinoic acid","Splenic irradiation only"],"answer":0,"explanation":"Hairy cell leukemia is a B-cell neoplasm in middle-aged men with massive splenomegaly, pancytopenia, and marrow fibrosis causing a dry tap. Cells have hairlike projections, are TRAP-positive and CD11c- and CD103-positive, and carry BRAF V600E. Purine analogs such as cladribine are highly effective and often induce long remissions.","ko":"털세포백혈병: 거대 비장, 범혈구감소, dry tap, TRAP(+), BRAF V600E → cladribine."},{"id":"hm24","steps":["1"],"system":"Hematology & Oncology","discipline":"Pathology","topic":"Hodgkin lymphoma","stem":"A 24-year-old woman has a painless, rubbery lymph node above her left clavicle, night sweats, and fever. Chest x-ray shows a mediastinal mass. Lymph node biopsy shows large binucleate cells with prominent eosinophilic nucleoli in a background of lymphocytes and eosinophils, separated by bands of collagen. The large cells are CD15- and CD30-positive.\n\nWhich of the following is the most likely diagnosis?","options":["Primary mediastinal T-lymphoblastic lymphoma","Follicular lymphoma","Burkitt lymphoma","Nodular sclerosis Hodgkin lymphoma","Diffuse large B-cell lymphoma"],"answer":3,"explanation":"Hodgkin lymphoma contains Reed-Sternberg cells, large binucleate owl's-eye cells that are CD15- and CD30-positive, in a background of reactive cells. Nodular sclerosis is the most common type, typically in young women with mediastinal involvement and collagen bands. Mixed cellularity is associated with EBV. Hodgkin lymphoma spreads to contiguous nodes, and B symptoms (fever, night sweats, weight loss) worsen the stage.","ko":"호지킨: Reed-Sternberg 세포(CD15/CD30+), 결절경화형(젊은 여성·종격동) 최다."},{"id":"hm25","steps":["1"],"system":"Hematology & Oncology","discipline":"Pathology","topic":"Burkitt lymphoma","stem":"A 9-year-old boy from Ghana has a rapidly enlarging mass in his jaw. Biopsy shows sheets of intermediate-sized lymphocytes with a very high mitotic rate and scattered pale macrophages containing debris, producing a starry-sky pattern.\n\nWhich of the following genetic abnormalities is most likely present?","options":["t(11;14) involving cyclin D1","t(15;17) involving PML-RARA","t(8;14) involving c-MYC","t(14;18) involving BCL2","t(9;22) involving BCR-ABL"],"answer":2,"explanation":"Burkitt lymphoma is a very aggressive B-cell lymphoma caused by translocation of c-MYC on chromosome 8 next to the immunoglobulin heavy chain locus on chromosome 14. The endemic African form involves the jaw and is associated with EBV; the sporadic form involves the abdomen (ileocecal region). The starry-sky pattern reflects a high rate of cell turnover with tingible body macrophages. Chemotherapy can cause tumor lysis syndrome.","ko":"Burkitt: t(8;14) c-MYC, 별이 빛나는 하늘, 아프리카형 턱·EBV."},{"id":"hm26","steps":["1"],"system":"Hematology & Oncology","discipline":"Pathology","topic":"Follicular lymphoma","stem":"A 61-year-old woman has had painless, fluctuating enlargement of lymph nodes in her neck and groin for 2 years. Lymph node biopsy shows effacement by closely packed follicles of small cleaved cells. The tumor cells overexpress an antiapoptotic protein.\n\nWhich of the following translocations is most likely present?","options":["t(8;14)","t(14;18)","t(11;14)","t(12;21)","t(9;22)"],"answer":1,"explanation":"Follicular lymphoma is an indolent B-cell lymphoma of older adults with painless, waxing and waning lymphadenopathy. t(14;18) places BCL2 next to the immunoglobulin heavy chain promoter, overexpressing BCL2, which prevents apoptosis by blocking release of cytochrome c. It can transform into diffuse large B-cell lymphoma. Mantle cell lymphoma has t(11;14), and Burkitt lymphoma has t(8;14).","ko":"여포성 림프종: t(14;18) BCL2 과발현(세포자멸 억제), 무통성·변동성 림프절."},{"id":"hm27","steps":["1"],"system":"Hematology & Oncology","discipline":"Pathology","topic":"Langerhans cell histiocytosis","stem":"A 4-year-old boy has a painful swelling on his skull. X-ray shows a sharply punched-out lytic lesion. Biopsy shows sheets of large cells with grooved, coffee bean-shaped nuclei mixed with eosinophils. The cells are positive for CD1a and S-100, and electron microscopy shows tennis racket-shaped cytoplasmic granules.\n\nWhich of the following is the most likely diagnosis?","options":["Langerhans cell histiocytosis","Multiple myeloma","Osteosarcoma","Ewing sarcoma","Metastatic neuroblastoma"],"answer":0,"explanation":"Langerhans cell histiocytosis is a clonal proliferation of Langerhans-type dendritic cells, which are functionally immature and cannot stimulate T cells. It causes lytic bone lesions (often in the skull), skin rashes, diabetes insipidus, and organ involvement in children. The cells are CD1a- and S-100-positive and contain Birbeck granules (tennis racket-shaped). Many cases carry BRAF V600E.","ko":"LCH: 소아 용해성 두개골 병변, CD1a·S-100(+), Birbeck 과립(테니스 라켓)."},{"id":"hm28","steps":["1"],"system":"Hematology & Oncology","discipline":"Pharmacology","topic":"Cyclophosphamide and mesna","stem":"A 30-year-old woman with lupus nephritis is treated with IV cyclophosphamide. After her second dose she develops dysuria and gross hematuria. Urine culture is negative.\n\nWhich of the following drugs could have prevented this complication?","options":["Mesna","Leucovorin","Dexrazoxane","Allopurinol","Amifostine"],"answer":0,"explanation":"Cyclophosphamide is an alkylating agent that requires activation by hepatic CYP450. Its metabolite acrolein is excreted in the urine and damages the bladder, causing hemorrhagic cystitis and later bladder cancer. Mesna binds acrolein in the urine, and hydration helps. Leucovorin rescues normal cells from methotrexate, dexrazoxane prevents anthracycline cardiotoxicity, and amifostine protects against cisplatin nephrotoxicity.","ko":"Cyclophosphamide → acrolein → 출혈성 방광염 → mesna로 예방."},{"id":"hm29","steps":["1"],"system":"Hematology & Oncology","discipline":"Pharmacology","topic":"Vincristine neuropathy","stem":"A 6-year-old boy with acute lymphoblastic leukemia receives induction chemotherapy. A few weeks later he has tingling in his hands and feet, constipation, and absent ankle reflexes.\n\nThe drug responsible most likely acts by which of the following mechanisms?","options":["Cross-linking DNA strands","Stabilizing microtubules and preventing depolymerization","Binding tubulin and preventing microtubule polymerization","Inhibiting dihydrofolate reductase","Inhibiting topoisomerase II"],"answer":2,"explanation":"Vincristine and vinblastine bind β-tubulin and prevent microtubule polymerization, arresting cells in M phase. Vincristine causes dose-limiting peripheral neuropathy and autonomic neuropathy (constipation, paralytic ileus) because axonal transport depends on microtubules. Vinblastine mainly causes myelosuppression. Taxanes such as paclitaxel stabilize microtubules and also cause neuropathy.","ko":"Vincristine: 미세소관 중합 억제, 말초·자율신경병증(변비). Taxane은 안정화."},{"id":"hm30","steps":["1"],"system":"Hematology & Oncology","discipline":"Management","topic":"Tumor lysis syndrome","stem":"A 14-year-old boy with Burkitt lymphoma starts chemotherapy. Two days later his urine output falls. Laboratory studies show potassium 6.8 mEq/L, phosphate 9.4 mg/dL, calcium 6.5 mg/dL, uric acid 16 mg/dL, and creatinine 3.1 mg/dL.\n\nWhich of the following drugs reduces uric acid by converting it to a more soluble compound?","options":["Febuxostat","Probenecid","Allopurinol","Rasburicase","Colchicine"],"answer":3,"explanation":"Tumor lysis syndrome occurs when rapid destruction of tumor cells, especially in fast-growing tumors such as Burkitt lymphoma and acute leukemias, releases potassium, phosphate, and nucleic acids. This causes hyperkalemia, hyperphosphatemia, secondary hypocalcemia (calcium binds phosphate), and hyperuricemia, which can cause acute kidney injury from crystal deposition. Prevention includes IV fluids and allopurinol, which blocks xanthine oxidase. Rasburicase, a recombinant urate oxidase, breaks down existing uric acid into soluble allantoin and is contraindicated in G6PD deficiency.","ko":"종양용해증후군: 고K·고P·저Ca·고요산. Rasburicase = 요산 → allantoin (G6PD 결핍 금기)."},{"id":"hm31","steps":["1"],"system":"Hematology & Oncology","discipline":"Physiology","topic":"Iron deficiency progression","stem":"A 68-year-old man has mild fatigue. His hemoglobin and MCV are still normal, but colonoscopy is being planned because of occult blood in his stool.\n\nWhich laboratory finding is usually the first to become abnormal as iron deficiency develops?","options":["Decreased serum iron with low TIBC","Increased red cell distribution width with hypochromia on smear","Decreased hemoglobin","Decreased MCV","Decreased serum ferritin"],"answer":4,"explanation":"Iron deficiency develops in stages: storage iron is depleted first (low ferritin), then serum iron falls and TIBC and transferrin rise, then iron-deficient erythropoiesis develops, and finally microcytic, hypochromic anemia appears with increased RDW. In older adults and postmenopausal women, iron deficiency anemia without another explanation calls for evaluation of the GI tract for bleeding, including colorectal cancer. Ferritin is an acute-phase reactant and can be falsely normal with inflammation.","ko":"철결핍: ferritin이 가장 먼저 감소 → 혈청 철↓·TIBC↑ → 소구성 빈혈. 고령은 대장 검사."},{"id":"hm32","steps":["1"],"system":"Hematology & Oncology","discipline":"Microbiology","topic":"Parvovirus aplastic crisis","stem":"A 9-year-old boy with sickle cell disease has fatigue and pallor. His sister recently had a fever and red cheeks. Hemoglobin is 4.2 g/dL (baseline 8.0 g/dL), and the reticulocyte count is 0.2%.\n\nThe virus responsible infects erythroid precursors by binding which of the following?","options":["P antigen (globoside)","CD21","ICAM-1","CD4","Sialic acid"],"answer":0,"explanation":"Parvovirus B19 is a small single-stranded DNA virus that binds the P antigen on erythroid progenitors and halts red cell production for about a week. In healthy people this is unnoticed, but in patients with shortened red cell survival (sickle cell disease, hereditary spherocytosis), it causes aplastic crisis with severe anemia and very low reticulocytes. It also causes erythema infectiosum (slapped cheek), arthritis in adults, and hydrops fetalis. EBV binds CD21, and rhinovirus binds ICAM-1.","ko":"Parvovirus B19: P 항원 결합 → 적혈구 생성 중단 → 용혈성 빈혈 환자 무형성 위기(망상적혈구↓)."},{"id":"hm33","steps":["1"],"system":"Hematology & Oncology","discipline":"Pathology","topic":"Intravascular hemolysis labs","stem":"A 45-year-old man with a mechanical aortic valve has fatigue and dark urine. Hemoglobin is 9.0 g/dL, LDH is elevated, and the smear shows fragmented red cells.\n\nWhich set of findings is most characteristic of intravascular hemolysis?","options":["Normal haptoglobin with low reticulocytes","High haptoglobin and splenomegaly","Low haptoglobin with spherocytes and splenomegaly only","Low haptoglobin, hemoglobinuria, and hemosiderinuria","High ferritin with low TIBC"],"answer":3,"explanation":"In intravascular hemolysis, free hemoglobin released into the plasma binds haptoglobin, which is cleared, so haptoglobin falls. When haptoglobin is saturated, hemoglobin is filtered by the kidney (hemoglobinuria) and stored in tubular cells as hemosiderin, which appears in the urine later. LDH and indirect bilirubin rise in both intravascular and extravascular hemolysis. Causes include mechanical valves, TTP and HUS, PNH, G6PD deficiency, and ABO transfusion reactions.","ko":"혈관내 용혈: 합토글로빈↓, 혈색소뇨, 혈철소뇨. 원인: 기계판막·TTP/HUS·PNH·G6PD."},{"id":"hm34","steps":["1"],"system":"Hematology & Oncology","discipline":"Pathology","topic":"Polycythemia vera","stem":"A 60-year-old man has headaches, dizziness, and intense itching after hot showers. He has a ruddy complexion and splenomegaly. Hemoglobin is 19.5 g/dL, leukocytes and platelets are elevated, and serum erythropoietin is low.\n\nWhich mutation is most likely present?","options":["FLT3 internal tandem duplication","MPL W515L","BCR-ABL fusion","BRAF V600E","JAK2 V617F"],"answer":4,"explanation":"Polycythemia vera is a myeloproliferative neoplasm caused in about 95% of cases by the JAK2 V617F mutation, which activates signali
