변이 → TKI."},{"id":"rs14","steps":["1"],"system":"Respiratory","discipline":"Pathology","topic":"Asbestos-related cancer risk","stem":"A 70-year-old man who worked in a shipyard for 30 years and has smoked one pack of cigarettes daily for 40 years comes for a routine examination. Chest x-ray shows calcified plaques on the diaphragmatic pleura and mild lower-lobe interstitial markings.\n\nThis patient is at greatest risk of developing which of the following?","options":["Pulmonary alveolar proteinosis","Bronchogenic carcinoma","Tuberculosis","Hypersensitivity pneumonitis","Malignant pleural mesothelioma"],"answer":1,"explanation":"Asbestos exposure causes pleural plaques (a marker of exposure), lower-lobe interstitial fibrosis with ferruginous bodies, mesothelioma, and bronchogenic carcinoma. Although mesothelioma is the cancer most specific to asbestos, bronchogenic carcinoma is far more common, and asbestos and smoking multiply each other's risk. Silicosis, not asbestosis, increases susceptibility to tuberculosis.","ko":"석면: 가장 흔한 암은 기관지암(흡연과 상승작용), 가장 특이적인 암은 중피종."},{"id":"rs15","steps":["1"],"system":"Respiratory","discipline":"Pathology","topic":"Silicosis and tuberculosis","stem":"A 55-year-old man who worked as a sandblaster for 25 years has progressive dyspnea. Chest x-ray shows multiple nodules in the upper lobes and eggshell calcification of the hilar lymph nodes.\n\nThis patient is at increased risk for which of the following infections?","options":["Aspergillosis","Histoplasmosis","Tuberculosis","Legionnaires disease","Pneumocystis pneumonia"],"answer":2,"explanation":"Silicosis results from inhaled crystalline silica in sandblasting, mining, and stone work. Silica particles are taken up by alveolar macrophages, which release fibrogenic cytokines and are damaged by the silica, impairing phagolysosome function. This increases susceptibility to tuberculosis. Silicosis causes upper-lobe nodules and eggshell calcification of hilar nodes.","ko":"규폐증: 상엽 결절·달걀껍질 석회화, 대식세포 손상 → 결핵 위험↑."},{"id":"rs16","steps":["1"],"system":"Respiratory","discipline":"Microbiology","topic":"Klebsiella pneumonia","stem":"A 58-year-old man with alcohol use disorder is brought to the emergency department because of fever and cough productive of thick, dark-red, jelly-like sputum. He had an episode of heavy drinking with vomiting 4 days ago. Chest x-ray shows consolidation of the right upper lobe with a bulging fissure. Sputum Gram stain shows encapsulated gram-negative rods.\n\nWhich of the following is the most likely causative organism?","options":["Klebsiella pneumoniae","Pseudomonas aeruginosa","Haemophilus influenzae","Legionella pneumophila","Streptococcus pneumoniae"],"answer":0,"explanation":"Klebsiella pneumoniae is an encapsulated, lactose-fermenting gram-negative rod that causes pneumonia in patients with alcohol use disorder or diabetes, often after aspiration. Its thick polysaccharide capsule produces mucoid, currant-jelly sputum, and it tends to cause necrosis and abscesses in the upper lobes. Streptococcus pneumoniae is a gram-positive diplococcus that produces rusty sputum.","ko":"알코올·흡인 + currant-jelly 객담 = Klebsiella."},{"id":"rs17","steps":["1"],"system":"Respiratory","discipline":"Microbiology","topic":"Legionella","stem":"A 64-year-old man who smokes is admitted with high fever, dry cough, confusion, and watery diarrhea 4 days after staying in a hotel with a large air-conditioning system. Serum sodium is 126 mEq/L. Chest x-ray shows patchy bilateral consolidation. Sputum Gram stain shows many neutrophils but few organisms.\n\nThe causative organism grows best on which of the following culture media?","options":["Eosin-methylene blue agar","Buffered charcoal yeast extract agar with cysteine and iron","Bordet-Gengou agar","Löwenstein-Jensen agar","Thayer-Martin agar"],"answer":1,"explanation":"Legionella pneumophila is a gram-negative rod that stains poorly on Gram stain (silver stain is used) and is spread by aerosols from water sources such as cooling towers, not person to person. It causes pneumonia with high fever, GI symptoms, confusion, and hyponatremia. It grows on buffered charcoal yeast extract with iron and cysteine, and the urine antigen test is the fastest diagnostic test. It is treated with a macrolide or fluoroquinolone.","ko":"Legionella: 냉각탑, 저나트륨·설사, BCYE 배지, 소변 항원."},{"id":"rs18","steps":["1"],"system":"Respiratory","discipline":"Microbiology","topic":"Mycoplasma pneumonia","stem":"A 19-year-old college student has had low-grade fever, headache, sore throat, and a persistent dry cough for 10 days. Chest x-ray shows patchy bilateral interstitial infiltrates that look worse than his symptoms. Cold agglutinin titers are elevated. Amoxicillin prescribed at an urgent care clinic has not helped.\n\nThe failure of amoxicillin is best explained by which of the following characteristics of the most likely organism?","options":["It is an obligate intracellular organism","It forms a polysaccharide capsule","It has altered penicillin-binding proteins","It lacks a peptidoglycan cell wall","It produces a β-lactamase"],"answer":3,"explanation":"Mycoplasma pneumoniae causes atypical (walking) pneumonia in young adults living in close quarters. It has no cell wall, so β-lactams do not work, and it does not Gram stain; its membrane contains sterols. IgM cold agglutinins can cause hemolysis. Treatment is a macrolide, doxycycline, or a fluoroquinolone.","ko":"Mycoplasma: 세포벽 없음 → β-lactam 무효, 한랭응집소, macrolide."},{"id":"rs19","steps":["1"],"system":"Respiratory","discipline":"Immunology","topic":"Anti-TNF and tuberculosis","stem":"A 48-year-old woman with rheumatoid arthritis starts infliximab. Four months later she has fever, night sweats, weight loss, and a cough. Chest x-ray shows a right upper lobe cavitary lesion, and sputum acid-fast staining is positive. A tuberculin skin test before treatment had been positive, but she did not take prophylaxis.\n\nWhich of the following best explains why this infection developed?","options":["Decreased IL-2 production by T cells","Impaired neutrophil oxidative burst","Inhibition of IL-6 signaling","Loss of TNF-α needed to maintain granulomas","Depletion of B lymphocytes"],"answer":3,"explanation":"Macrophages infected with Mycobacterium tuberculosis present antigen to CD4+ Th1 cells, which secrete IFN-γ to activate macrophages and form granulomas that contain the infection. TNF-α is required to form and maintain these granulomas. TNF-α inhibitors such as infliximab, adalimumab, and etanercept can cause reactivation of latent TB, so patients are screened before treatment and latent infection is treated.","ko":"TNF-α 억제제 → 육아종 유지 실패 → 잠복결핵 재활성화. 투약 전 선별."},{"id":"rs20","steps":["1"],"system":"Respiratory","discipline":"Microbiology","topic":"Allergic bronchopulmonary aspergillosis","stem":"A 26-year-old woman with asthma has had worsening wheezing over 6 months and coughs up brown mucus plugs. Blood eosinophil count and total serum IgE are markedly elevated. Chest CT shows central bronchiectasis. Microscopy of the mucus plugs shows narrow hyphae with regular septa that branch at acute angles.\n\nWhich of the following organisms is most likely responsible?","options":["Candida albicans","Histoplasma capsulatum","Aspergillus fumigatus","Cryptococcus neoformans","Rhizopus species"],"answer":2,"explanation":"Allergic bronchopulmonary aspergillosis is a hypersensitivity reaction to Aspergillus colonizing the airways of patients with asthma or cystic fibrosis, causing eosinophilia, high IgE, mucus plugs, and central bronchiectasis. Aspergillus has septate hyphae branching at acute (about 45°) angles. Mucor and Rhizopus have broad, nonseptate hyphae branching at right angles. Aspergillus also causes aspergillomas in preexisting cavities and invasive disease in neutropenic patients.","ko":"Aspergillus: 격벽 있는 균사, 45° 분지. ABPA = 천식·CF + IgE↑ + 중심성 기관지확장."},{"id":"rs21","steps":["1"],"system":"Respiratory","discipline":"Microbiology","topic":"Histoplasmosis","stem":"A 40-year-old man from Ohio comes to the physician because of fever, cough, and fatigue 2 weeks after cleaning out an old chicken coop and exploring a bat-filled cave. Chest x-ray shows hilar lymphadenopathy and patchy infiltrates. Bronchoalveolar lavage shows small oval yeasts inside macrophages.\n\nWhich of the following is the most likely causative organism?","options":["Coccidioides immitis","Blastomyces dermatitidis","Cryptococcus neoformans","Paracoccidioides brasiliensis","Histoplasma capsulatum"],"answer":4,"explanation":"Histoplasma capsulatum is endemic to the Ohio and Mississippi River valleys and is found in soil contaminated with bird or bat droppings. It is a small yeast that lives inside macrophages. Blastomyces (Great Lakes and Ohio and Mississippi valleys) forms large yeasts with broad-based budding, Coccidioides (southwestern US) forms spherules filled with endospores, and Paracoccidioides (Latin America) shows a captain's wheel pattern of budding.","ko":"Histoplasma: 오하이오·미시시피 강 유역, 새·박쥐 배설물, 대식세포 내 작은 효모."},{"id":"rs22","steps":["1"],"system":"Respiratory","discipline":"Pathology","topic":"Source of pulmonary embolism","stem":"A 64-year-old woman develops sudden dyspnea and pleuritic chest pain 6 days after a total hip replacement. CT pulmonary angiography shows a large embolus in the right main pulmonary artery.\n\nThe embolus most likely originated in which of the following locations?","options":["Left atrial appendage","Deep veins of the thigh and pelvis","Portal vein","Right internal jugular vein","Superficial veins of the calf"],"answer":1,"explanation":"Most clinically significant pulmonary emboli arise from deep vein thrombi in the proximal leg veins (popliteal, femoral, and iliac). Orthopedic surgery of the hip or knee combines all three parts of Virchow's triad: stasis from immobility, endothelial injury, and hypercoagulability. Superficial vein thrombi rarely embolize, and thrombi from the left atrium travel into the systemic circulation, not the lungs.","ko":"PE 기원 = 근위부 심부정맥(오금·대퇴·장골). Virchow 3요소."},{"id":"rs23","steps":["1"],"system":"Respiratory","discipline":"Pathology","topic":"Primary spontaneous pneumothorax","stem":"A 19-year-old man who is tall and thin develops sudden right-sided chest pain and shortness of breath while sitting in class. Breath sounds are decreased over the right hemithorax, which is hyperresonant to percussion. The trachea is midline, and vital signs are stable.\n\nWhich of the following is the most likely cause?","options":["Rupture of an infected lung cavity","Chest wall trauma","Rupture of apical subpleural blebs","Necrotizing pneumonia","Destruction of alveolar walls by α1-antitrypsin deficiency"],"answer":2,"explanation":"Primary spontaneous pneumothorax typically occurs in tall, thin young men, often smokers, from rupture of small apical subpleural blebs. Air in the pleural space causes decreased breath sounds and hyperresonance on the affected side. In tension pneumothorax, air builds up under pressure and shifts the trachea and mediastinum away from the affected side, causing hypotension and requiring immediate needle decompression.","ko":"키 크고 마른 젊은 남성 기흉 = 첨부 bleb 파열. 긴장성은 기관이 반대쪽으로."},{"id":"rs24","steps":["1"],"system":"Respiratory","discipline":"Physiology","topic":"Exudative effusion","stem":"A pleural fluid sample is analyzed from a patient with a large unilateral effusion. The pleural fluid-to-serum protein ratio is 0.7 and the pleural fluid-to-serum LDH ratio is 0.8.\n\nWhich of the following is the most likely cause of this effusion?","options":["Left ventricular heart failure","Hypoalbuminemia from malnutrition","Nephrotic syndrome","Bacterial pneumonia","Cirrhosis"],"answer":3,"explanation":"By Light's criteria, an effusion is an exudate if the protein ratio is above 0.5, the LDH ratio is above 0.6, or pleural LDH is above two-thirds of the upper limit of normal for serum. Exudates result from increased capillary permeability or impaired lymphatic drainage, as in pneumonia, malignancy, tuberculosis, and pulmonary embolism. Transudates result from increased hydrostatic pressure (heart failure) or decreased oncotic pressure (cirrhosis, nephrotic syndrome).","ko":"Light 기준: 단백비 >0.5 또는 LDH비 >0.6 → 삼출액 (폐렴·암·결핵)."},{"id":"rs25","steps":["1"],"system":"Respiratory","discipline":"Physiology","topic":"Oxygen dissociation curve shift","stem":"During strenuous exercise, oxygen delivery to the quadriceps muscle increases more than can be explained by increased blood flow alone.\n\nWhich of the following changes in the exercising muscle best explains the greater release of oxygen from hemoglobin?","options":["Increased temperature, PCO2, and H+ shifting the curve to the right","Respiratory alkalosis shifting the curve to the right","Increased carbon monoxide binding to hemoglobin","Increased fetal hemoglobin shifting the curve to the left","Decreased 2,3-bisphosphoglycerate shifting the curve to the left"],"answer":0,"explanation":"Exercising muscle produces CO2, acid, and heat, and red cells produce more 2,3-BPG. These shift the oxyhemoglobin dissociation curve to the right, lowering hemoglobin's affinity for oxygen and releasing more oxygen to tissue (Bohr effect). Fetal hemoglobin, alkalosis, low 2,3-BPG, low temperature, and carbon monoxide shift the curve to the left.","ko":"우측 이동(O2 방출↑): CO2·산·2,3-BPG·운동·온도↑. 좌측: HbF, CO, 알칼리증."},{"id":"rs26","steps":["1"],"system":"Respiratory","discipline":"Physiology","topic":"Carbon monoxide poisoning","stem":"A family is brought to the emergency department in winter because of headache, nausea, and confusion after running a gas heater in a closed room overnight. One patient's pulse oximetry reading is 99% on room air, and arterial PaO2 is 98 mm Hg.\n\nWhich of the following is most likely decreased in this patient?","options":["Arterial oxygen content","Dissolved oxygen in plasma","Hemoglobin concentration","Arterial PaO2","Pulse oximetry reading"],"answer":0,"explanation":"Carbon monoxide binds hemoglobin with about 200 times the affinity of oxygen, decreasing the oxygen-carrying capacity and the oxygen content of arterial blood, and it shifts the dissociation curve to the left, impairing oxygen release. PaO2 reflects dissolved oxygen and stays normal. Standard pulse oximetry cannot distinguish carboxyhemoglobin from oxyhemoglobin and gives a falsely normal reading, so co-oximetry is needed. Treatment is 100% oxygen or hyperbaric oxygen.","ko":"CO 중독: PaO2·맥박산소 정상, 실제 O2 함량↓. 100% O2/고압산소."},{"id":"rs27","steps":["1"],"system":"Respiratory","discipline":"Pharmacology","topic":"Drug-induced pulmonary fibrosis","stem":"A 74-year-old woman has taken a daily antibiotic for 3 years to prevent recurrent urinary tract infections. She now has a dry cough and progressive dyspnea. Chest CT shows bilateral basilar reticular opacities, and pulmonary function tests show a restrictive pattern with reduced DLCO.\n\nWhich antibiotic is most likely responsible?","options":["Nitrofurantoin","Trimethoprim","Cephalexin","Amoxicillin","Fosfomycin"],"answer":0,"explanation":"Long-term nitrofurantoin can cause chronic interstitial pneumonitis and fibrosis, as well as hepatotoxicity and neuropathy; acute hypersensitivity pneumonitis can also occur. Other drugs that cause pulmonary fibrosis include bleomycin, busulfan, amiodarone, and methotrexate. Restrictive disease with low DLCO indicates interstitial disease.","ko":"폐섬유화 유발 약물: nitrofurantoin(장기), bleomycin, busulfan, amiodarone, methotrexate."},{"id":"rs28","steps":["1"],"system":"Respiratory","discipline":"Immunology","topic":"Hypersensitivity pneumonitis","stem":"A 45-year-old dairy farmer has recurrent episodes of fever, chills, cough, and dyspnea that begin 4 to 6 hours after he works with moldy hay and resolve over a day or two when he stays away. Chest CT shows centrilobular ground-glass nodules. Biopsy shows loosely formed noncaseating granulomas around bronchioles.\n\nWhich of the following is the most effective long-term management?","options":["Avoiding exposure to the antigen","Long-term antibiotics","Bronchodilators only","Antifungal therapy","Inhaled corticosteroids alone"],"answer":0,"explanation":"Hypersensitivity pneumonitis is a mixed type III and type IV hypersensitivity reaction to inhaled organic antigens, such as thermophilic actinomycetes in moldy hay (farmer's lung) or bird proteins (bird fancier's lung). Symptoms begin hours after exposure. Chronic exposure can cause fibrosis. Removing the antigen is the key treatment; corticosteroids help in severe cases.","ko":"과민성 폐렴: 유기 항원(곰팡이 건초·새), 노출 수시간 후 증상, 3·4형 → 항원 회피."},{"id":"rs29","steps":["1"],"system":"Respiratory","discipline":"Physiology","topic":"Cor pulmonale in COPD","stem":"A 68-year-old man with severe COPD has worsening leg edema, an elevated JVP, and hepatomegaly. Echocardiography shows right ventricular hypertrophy and dilation with a normal left ventricle. PaO2 is 52 mm Hg on room air.\n\nWhich of the following is the main mechanism of his pulmonary hypertension?","options":["Fibrillin defect in pulmonary arteries","Hypoxic vasoconstriction of pulmonary arterioles","Left-to-right intracardiac shunting","Recurrent pulmonary emboli","Left ventricular failure raising pulmonary venous pressure"],"answer":1,"explanation":"In the lung, unlike other tissues, hypoxia causes arteriolar vasoconstriction, which normally diverts blood to well-ventilated areas. Chronic diffuse hypoxia from COPD or sleep apnea causes widespread vasoconstriction and vascular remodeling, leading to pulmonary hypertension and right heart failure (cor pulmonale). Long-term supplemental oxygen in hypoxemic COPD reduces this and improves survival.","ko":"COPD 폐고혈압 = 저산소성 폐혈관 수축 → 폐성심. 장기 산소요법이 생존율↑."},{"id":"rs30","steps":["1"],"system":"Respiratory","discipline":"Pathology","topic":"Asthma histology","stem":"A 19-year-old woman dies of status asthmaticus. At autopsy, the bronchi contain thick mucus plugs.\n\nWhich of the following findings would most likely be seen on examination of her airways and sputum?","options":["Caseating granulomas in the upper lobes","Ferruginous bodies in the alveoli","Noncaseating granulomas along lymphatics","Curschmann spirals, Charcot-Leyden crystals, and smooth muscle hypertrophy","Hyaline membranes lining the alveoli"],"answer":3,"explanation":"Asthma is driven by Th2 inflammation with IL-4, IL-5, and IL-13 and IgE-mediated mast cell activation. Airway changes include smooth muscle hypertrophy, goblet cell hyperplasia, thickened basement membrane, and eosinophils. Sputum contains Curschmann spirals (shed epithelium in mucus plugs) and Charcot-Leyden crystals (crystallized eosinophil proteins). Ferruginous bodies indicate asbestos exposure.","ko":"천식: Curschmann 나선(점액 마개), Charcot-Leyden 결정(호산구), 평활근 비대."},{"id":"rs31","steps":["1"],"system":"Respiratory","discipline":"Pathology","topic":"Chronic bronchitis","stem":"A 58-year-old woman who smokes has had a productive cough for at least 3 months each year for the past 4 years. She is cyanotic and has peripheral edema. Lung biopsy shows enlarged submucosal mucous glands.\n\nWhich measure best quantifies this histologic change?","options":["DLCO greater than 120% of predicted","Lecithin-to-sphingomyelin ratio below 1.5","Reid index greater than 50%","A-a gradient of zero","FEV1/FVC greater than 0.8"],"answer":2,"explanation":"Chronic bronchitis is a productive cough for at least 3 months in each of 2 consecutive years. Hypertrophy and hyperplasia of submucosal mucous glands increase the Reid index (gland thickness divided by bronchial wall thickness) above 50%. Patients are often hypoxemic and hypercapnic with cor pulmonale (blue bloaters). DLCO is usually normal, unlike in emphysema.","ko":"만성 기관지염: 2년 연속 3개월 이상 기침, Reid index >50%, DLCO 정상."},{"id":"rs32","steps":["1"],"system":"Respiratory","discipline":"Pathology","topic":"Coal workers' pneumoconiosis","stem":"A 60-year-old retired coal miner with rheumatoid arthritis has progressive dyspnea. Chest x-ray shows multiple rounded nodules, 1 to 5 cm, in the periphery of both lungs, along with small nodules in the upper lobes.\n\nWhich of the following is the most likely diagnosis?","options":["Caplan syndrome","Asbestosis","Sarcoidosis","Berylliosis","Silicosis with tuberculosis"],"answer":0,"explanation":"Coal workers' pneumoconiosis is caused by inhaled carbon dust taken up by macrophages (anthracosis), forming upper-lobe nodules that can progress to massive fibrosis. Caplan syndrome is the combination of pneumoconiosis (coal, silica, or asbestos) with rheumatoid arthritis, producing large rheumatoid nodules in the lung periphery. Asbestosis affects the lower lobes.","ko":"Caplan 증후군 = 진폐증(석탄·규소·석면) + 류마티스 관절염 → 폐 류마티스 결절."},{"id":"rs33","steps":["1"],"system":"Respiratory","discipline":"Pathology","topic":"Berylliosis","stem":"A 45-year-old aerospace engineer who machines metal alloys has dyspnea and a dry cough. Chest x-ray shows bilateral hilar lymphadenopathy and upper-lobe reticular opacities. Biopsy shows noncaseating granulomas. A lymphocyte proliferation test with a metal is positive.\n\nWhich of the following exposures is most likely responsible?","options":["Iron oxide","Coal dust","Asbestos","Silica","Beryllium"],"answer":4,"explanation":"Chronic beryllium disease occurs in aerospace, electronics, and nuclear workers. It is a cell-mediated (type IV) hypersensitivity reaction that forms noncaseating granulomas in the lungs and hilar nodes, making it clinically similar to sarcoidosis. The beryllium lymphocyte proliferation test distinguishes them. Treatment includes stopping exposure and corticosteroids.","ko":"베릴륨증: 항공우주 산업, 비건락성 육아종(사르코이드 유사), 림프구 증식 검사로 감별."},{"id":"rs34","steps":["1"],"system":"Respiratory","discipline":"Pathology","topic":"Bronchial carcinoid","stem":"A 35-year-old woman who has never smoked has recurrent pneumonia in the right lower lobe and occasional hemoptysis. Bronchoscopy shows a smooth, red, polypoid mass in the right main bronchus. Biopsy shows nests of uniform cells with salt-and-pepper chromatin that stain for chromogranin.\n\nWhich of the following is the most likely diagnosis?","options":["Adenocarcinoma in situ","Squamous cell carcinoma","Small cell carcinoma","Bronchial carcinoid tumor","Hamartoma"],"answer":3,"explanation":"Bronchial carcinoid tumors are low-grade neuroendocrine tumors of younger, often nonsmoking patients. They grow as polypoid masses in major bronchi, causing obstruction, postobstructive pneumonia, and bleeding. They stain for chromogranin and synaptophysin. Carcinoid syndrome is rare without metastasis. Small cell carcinoma is also neuroendocrine but is highly aggressive and smoking-related.","ko":"기관지 카르시노이드: 젊은 비흡연자, 기관지 내 폴립성 종괴, chromogranin(+), 저등급."},{"id":"rs35","steps":["1"],"system":"Respiratory","discipline":"Physiology","topic":"DLCO measurement","stem":"Diffusing capacity of the lung is measured by having a patient inhale a low concentration of carbon monoxide.\n\nWhy is carbon monoxide used for this measurement?","options":["It does not bind hemoglobin","It has the same partial pressure gradient as oxygen at rest","Its uptake is perfusion-limited","Its uptake is diffusion-limited because hemoglobin binds it so avidly","It is exhaled unchanged"],"answer":3,"explanation":"Carbon monoxide binds hemoglobin so tightly that its partial pressure in capillary blood stays near zero, so its uptake is limited only by diffusion across the alveolar-capillary membrane. This makes it ideal for measuring diffusing capacity. Nitrous oxide is perfusion-limited, equilibrating quickly. Oxygen is normally perfusion-limited but becomes diffusion-limited in fibrosis and during exercise at altitude.","ko":"CO는 확산 제한 기체 → DLCO 측정. N2O는 관류 제한. O2는 정상에서 관류 제한."},{"id":"rs36","steps":["1"],"system":"Respiratory","discipline":"Physiology","topic":"Dead space calculation","stem":"A mechanically ventilated patient has an arterial PaCO2 of 40 mm Hg and a mixed expired PCO2 of 30 mm Hg. Tidal volume is 500 mL.\n\nWhat is the physiologic dead space volume?","options":["50 mL","125 mL","150 mL","250 mL","375 mL"],"answer":1,"explanation":"The Bohr equation calculates the dead space fraction: VD/VT = (PaCO2 − PECO2) / PaCO2 = (40 − 30)/40 = 0.25. Dead space = 0.25 × 500 mL = 125 mL. Physiologic dead space is anatomic dead space plus alveolar dead space (ventilated but unperfused alveoli). It increases in pulmonary embolism and emphysema.","ko":"Bohr: VD/VT = (PaCO2 − PECO2)/PaCO2."},{"id":"rs37","steps":["1"],"system":"Respiratory","discipline":"Physiology","topic":"Regional V/Q and TB","stem":"In an upright person, both ventilation and perfusion are greater at the lung base than at the apex, but perfusion changes more.\n\nWhich of the following best explains why reactivation tuberculosis favors the lung apex?","options":["The apex has the highest blood flow","The apex has the lowest V/Q ratio","The apex has fewer macrophages","The apex has a high V/Q ratio and therefore a high PO2","The apex has the most lymphatic drainage"],"answer":3,"explanation":"Gravity causes perfusion to fall more than ventilation from base to apex, so V/Q is highest (about 3) at the apex, where alveolar PO2 is highest and PCO2 is lowest. Mycobacterium tuberculosis is an obligate aerobe and thrives in this oxygen-rich environment, so reactivation TB favors the apices. At the base, V/Q is lower (about 0.6).","ko":"폐첨부 V/Q 최고 → PO2 최고 → 결핵 재활성화 호발(호기성)."},{"id":"rs38","steps":["1"],"system":"Respiratory","discipline":"Physiology","topic":"Oxygen-induced hypercapnia","stem":"A 70-year-old man with severe COPD and a baseline PaCO2 of 55 mm Hg is admitted with an exacerbation. He is given oxygen through a non-rebreather mask at 15 L/min. Two hours later he is drowsy, and PaCO2 has risen to 82 mm Hg.\n\nWhich of the following mainly explains the rise in PaCO2?","options":["Oxygen binding to carbonic anhydrase","Oxygen toxicity damaging alveoli","Release of hypoxic vasoconstriction worsening V/Q mismatch, plus the Haldane effect","Increased carbon dioxide production from oxygen metabolism","Decreased tidal volume from oxygen-induced bronchodilation"],"answer":2,"explanation":"In some COPD patients with chronic hypercapnia, high-flow oxygen worsens hypercapnia. The main mechanisms are reversal of hypoxic vasoconstriction, which increases perfusion to poorly ventilated areas and worsens V/Q mismatch, and the Haldane effect, in which oxygenated hemoglobin binds less CO2. Loss of hypoxic respiratory drive contributes less than once thought. Oxygen is titrated to a saturation of 88 to 92%.","ko":"COPD 고농도 O2 → 저산소 혈관수축 해제(V/Q 악화) + Haldane 효과 → CO2↑. 목표 SpO2 88~92%."},{"id":"rs39","steps":["1"],"system":"Respiratory","discipline":"Microbiology","topic":"Post-influenza staphylococcal pneumonia","stem":"A 30-year-old previously healthy man recovering from influenza develops high fever, hemoptysis, and septic shock. Chest CT shows multiple cavitating lesions. Sputum Gram stain shows gram-positive cocci in clusters.\n\nWhich virulence factor is most associated with the necrotizing nature of this pneumonia?","options":["IgA protease","M protein","Panton-Valentine leukocidin","Pneumolysin","Lipooligosaccharide"],"answer":2,"explanation":"Staphylococcus aureus is a common cause of secondary bacterial pneumonia after influenza. Community-acquired MRSA strains often produce Panton-Valentine leukocidin, a pore-forming toxin that destroys leukocytes and causes necrotizing pneumonia and skin abscesses. Pneumolysin is a pneumococcal toxin, and M protein is a group A streptococcal virulence factor.","ko":"인플루엔자 후 괴사성 폐렴 = S. aureus(MRSA), Panton-Valentine leukocidin."},{"id":"rs40","steps":["1"],"system":"Respiratory","discipline":"Microbiology","topic":"Q fever","stem":"A 34-year-old sheep farmer develops high fever, severe headache, myalgias, and a dry cough 3 weeks after assisting with lambing season. Chest x-ray shows patchy infiltrates, and aminotransferases are mildly elevated. He has no rash, and he does not recall a tick bite.\n\nWhich of the following is the most likely organism?","options":["Francisella tularensis","Brucella species","Rickettsia rickettsii","Chlamydia psittaci","Coxiella burnetii"],"answer":4,"explanation":"Coxiella burnetii causes Q fever and is transmitted by inhaling aerosols from the placenta and birth products of infected cattle, sheep, and goats. It causes fever, pneumonia, and hepatitis, and chronic infection can cause culture-negative endocarditis. Unlike most rickettsiae, it causes no rash, needs no arthropod vector, and forms a spore-like resistant form. Treatment is doxycycline. Chlamydia psittaci is transmitted by birds.","ko":"Q열(Coxiella): 가축 출산물 에어로졸, 폐렴·간염, 발진 없음, 배양음성 심내막염 → doxycycline."},{"id":"rs41","steps":["1"],"system":"Respiratory","discipline":"Pharmacology","topic":"RSV prophylaxis","stem":"A 3-month-old boy born at 29 weeks' gestation with bronchopulmonary dysplasia is approaching his first winter. His physician recommends a monthly or single-dose injection to prevent a virus that causes bronchiolitis.\n\nThe monoclonal antibody used targets which viral component?","options":["Reverse transcriptase","Hemagglutinin","The fusion (F) protein","Neuraminidase","The nucleocapsid protein"],"answer":2,"explanation":"Respiratory syncytial virus is a paramyxovirus and the most common cause of bronchiolitis and pneumonia in infants. Its fusion (F) protein causes infected cells to fuse into syncytia. Palivizumab and nirsevimab are monoclonal antibodies against the F protein that prevent severe disease in high-risk infants. Neuraminidase inhibitors such as oseltamivir treat influenza.","ko":"RSV: 영아 세기관지염, F 단백(합포체) → palivizumab/nirsevimab 예방."},{"id":"rs42","steps":["1"],"system":"Respiratory","discipline":"Pharmacology","topic":"Oseltamivir","stem":"A 70-year-old woman with COPD develops sudden fever, myalgias, and cough during an influenza outbreak in her nursing home. A rapid test is positive for influenza A, and she is started on oseltamivir.\n\nHow does this drug act?","options":["It blocks the M2 ion channel, preventing uncoating","It blocks hemagglutinin binding to sialic acid","It inhibits neuraminidase, preventing release of new virions","It inhibits viral RNA polymerase","It inhibits viral reverse transcriptase"],"answer":2,"explanation":"Oseltamivir and zanamivir inhibit influenza A and B neuraminidase, which cleaves sialic acid so new virions can be released from infected cells. They reduce symptom duration when started within 48 hours and are recommended for high-risk or hospitalized patients regardless of timing. Baloxavir inhibits viral cap-dependent endonuclease. Amantadine blocks M2 but is no longer used because of resistance.","ko":"Oseltamivir = 뉴라미니다아제 억제(바이러스 방출 차단), 48시간 내 효과 최대."},{"id":"rs43","steps":["1"],"system":"Respiratory","discipline":"Pathology","topic":"Obstructive sleep apnea","stem":"A 50-year-old man with a BMI of 41 kg/m² has loud snoring, witnessed pauses in breathing during sleep, and daytime sleepiness. His blood pressure is 158/98 mm Hg, and hemoglobin is 18.2 g/dL.\n\nWhich of the following best explains his elevated hemoglobin?","options":["Increased red cell lifespan","A JAK2 mutation","Nocturnal hypoxemia stimulating renal erythropoietin release","Dehydration from nocturnal diuresis","Testosterone excess from obesity"],"answer":2,"explanation":"In obstructive sleep apnea, the upper airway collapses during sleep, causing repeated episodes of hypoxemia and hypercapnia with arousals. Chronic hypoxemia stimulates renal erythropoietin, causing secondary polycythemia. Surges in sympathetic tone cause systemic hypertension, and chronic hypoxic vasoconstriction can cause pulmonary hypertension. Treatment includes weight loss and CPAP.","ko":"폐쇄성 수면무호흡: 야간 저산소 → EPO↑ → 2차 적혈구증가증, 고혈압·폐고혈압 → CPAP."},{"id":"s01","steps":["1"],"system":"Cardiovascular","discipline":"Pathology","topic":"Hypertrophic cardiomyopathy","stem":"A 19-year-old college basketball player collapses during practice and cannot be resuscitated. He had no known medical history, but his father died suddenly at age 34. Autopsy shows a heart weighing 520 g with marked asymmetric thickening of the interventricular septum. Microscopy shows disorganized, branching myocytes with interstitial fibrosis.\n\nA mutation in which of the following genes is most likely responsible?","options":["β-Myosin heavy chain","Plakophilin-2","Dystrophin","Fibrillin-1","Lamin A/C"],"answer":0,"explanation":"Sudden death in a young athlete with asymmetric septal hypertrophy and myocyte disarray is hypertrophic cardiomyopathy. It is usually autosomal dominant and caused by sarcomere gene mutations, most often β-myosin heavy chain (MYH7) or myosin-binding protein C (MYBPC3). Dystrophin mutations cause dilated cardiomyopathy in muscular dystrophy; fibrillin-1 causes Marfan syndrome; plakophilin-2 is classic for arrhythmogenic right ventricular cardiomyopathy (fibrofatty RV replacement).","ko":"젊은 운동선수 급사 + 비대칭 중격 비후 + myocyte disarray → HCM, 주로 MYH7/MYBPC3 (AD)."},{"id":"s02","steps":["1","2CK"],"system":"Cardiovascular","discipline":"Pharmacology","topic":"ACE inhibitor angioedema","stem":"A 56-year-old Black man with hypertension comes to the emergency department because of swelling of his lips and tongue that began 3 hours ago. He has no hives or itching. Three weeks ago, he was started on a new antihypertensive medication. Pulse is 92/min and blood pressure is 138/86 mm Hg. Examination shows nonpitting edema of the lips and tongue without wheezing.\n\nWhich of the following best explains this patient's condition?","options":["IgE-mediated mast cell degranulation","Inherited deficiency of C1 esterase inhibitor","Increased aldosterone secretion","Immune complex deposition in small vessels","Decreased degradation of bradykinin"],"answer":4,"explanation":"ACE (kininase II) normally breaks down bradykinin. ACE inhibitors raise bradykinin levels, causing vasodilation and increased vascular permeability that produce angioedema without urticaria; risk is higher in Black patients. Hereditary angioedema also involves bradykinin but results from inherited C1 esterase inhibitor deficiency and presents with recurrent episodes, usually from childhood. IgE-mediated reactions typically cause urticaria and itching. ACE inhibitors decrease, not increase, aldosterone.","ko":"ACE 억제제 혈관부종 = bradykinin 분해 감소 (두드러기 없음)."},{"id":"s03","steps":["1"],"system":"Endocrine","discipline":"Immunology","topic":"Graves disease","stem":"A 32-year-old woman comes to the physician because of a 3-month history of palpitations, heat intolerance, and a 5-kg (11-lb) weight loss despite an increased appetite. Pulse is 112/min. Examination shows bilateral proptosis, a diffusely enlarged nontender thyroid gland with a bruit, and raised, nonpitting plaques over both shins. Serum TSH is undetectable and free T4 is elevated.\n\nWhich of the following is the most likely cause of this patient's condition?","options":["Autonomously functioning thyroid nodule","TSH-secreting pituitary adenoma","Antibodies against thyroid peroxidase causing gland destruction","Granulomatous inflammation following a viral infection","Antibodies that stimulate the TSH receptor"],"answer":4,"explanation":"Hyperthyroidism with ophthalmopathy, pretibial myxedema, and a diffuse goiter with a bruit is Graves disease, caused by IgG antibodies that stimulate the TSH receptor (type II hypersensitivity). The same antibodies activate orbital and dermal fibroblasts, which explains the eye and skin findings that other causes of hyperthyroidism lack. A TSH-secreting adenoma would raise TSH, not suppress it. Subacute granulomatous (de Quervain) thyroiditis causes a tender gland. Anti-TPO antibodies are typical of Hashimoto thyroiditis.","ko":"안구돌출 + pretibial myxedema = Graves (TSH 수용체 자극 항체)."},{"id":"s04","steps":["1","2CK"],"system":"Hematology & Oncology","discipline":"Diagnosis","topic":"Multiple myeloma workup","stem":"A 68-year-old man comes to the physician because of a 2-month history of fatigue and low back pain. Laboratory studies show:\nHemoglobin 9.4 g/dL\nSerum calcium 11.9 mg/dL\nSerum creatinine 2.1 mg/dL\nTotal protein 9.2 g/dL\nAlbumin 3.3 g/dL\nA peripheral blood smear shows red blood cells stacked like coins. X-ray of the spine shows several punched-out lytic lesions.\n\nWhich of the following is the most appropriate next step in diagnosis?","options":["Serum parathyroid hormone level","Technetium-99m bone scan","Serum protein electrophoresis with free light chain assay","Flow cytometry of peripheral blood","CT of the abdomen and pelvis"],"answer":2,"explanation":"Hypercalcemia, renal insufficiency, anemia, and bone lesions (CRAB) with a high protein gap and rouleaux suggest multiple myeloma. The initial test is serum protein electrophoresis with immunofixation and serum free light chains to identify an M protein; bone marrow biopsy then confirms clonal plasma cells. A bone scan is often falsely negative because myeloma lesions are purely lytic with little osteoblastic activity. PTH would be appropriately suppressed in malignancy-related hypercalcemia.","ko":"CRAB + 단백 gap + rouleaux → 다발골수종, 첫 검사 SPEP + free light chain. Bone scan은 위음성."},{"id":"s05","steps":["1","2CK"],"system":"Respiratory","discipline":"Microbiology","topic":"Pneumocystis pneumonia","stem":"A 34-year-old man with HIV infection who has not taken antiretroviral therapy for 2 years comes to the emergency department because of 3 weeks of progressive shortness of breath, dry cough, and fever. Temperature is 38.3°C (100.9°F), respirations are 24/min, and oxygen saturation is 89% on room air. CD4+ count is 85/mm³ and serum LDH is elevated. Chest x-ray shows bilateral diffuse interstitial infiltrates. Arterial PaO2 is 62 mm Hg.\n\nIn addition to trimethoprim-sulfamethoxazole, which of the following is the most appropriate pharmacotherapy?","options":["Isoniazid","Fluconazole","Prednisone","Azithromycin","Ganciclovir"],"answer":2,"explanation":"Subacute dyspnea, dry cough, bilateral interstitial infiltrates, and high LDH with a CD4 count below 200/mm³ indicate Pneumocystis jirovecii pneumonia. TMP-SMX is first-line. Adjunctive corticosteroids are added when PaO2 is below 70 mm Hg or the A-a gradient is 35 mm Hg or more, because they blunt the inflammatory response that follows organism death and lower mortality. Fluconazole does not treat Pneumocystis, and ganciclovir treats CMV.","ko":"PCP: TMP-SMX + (PaO2 \u003c70 또는 A-a ≥35면) 스테로이드 추가."},{"id":"s06","steps":["1","2CK"],"system":"Nervous System","discipline":"Anatomy","topic":"Left MCA stroke","stem":"A 71-year-old right-handed woman is brought to the emergency department 1 hour after the sudden onset of weakness and difficulty speaking. She has atrial fibrillation and does not take an anticoagulant. Examination shows weakness of the right lower face and right arm; the right leg is minimally affected. Her speech is slow, effortful, and nonfluent, but she follows commands correctly.\n\nOcclusion of which of the following arteries is the most likely cause?","options":["Left anterior cerebral artery","Basilar artery","Left middle cerebral artery","Right middle cerebral artery","Left posterior cerebral artery"],"answer":2,"explanation":"Contralateral weakness of the face and arm more than the leg localizes to the middle cerebral artery territory, which supplies the lateral motor cortex. Nonfluent (Broca) aphasia with intact comprehension places the lesion in the dominant (left) inferior frontal lobe, supplied by the superior division of the left MCA. ACA strokes affect the leg more than the arm. PCA strokes cause contralateral homonymous hemianopia with macular sparing.","ko":"얼굴·팔 > 다리 + 비유창성 실어증 → 좌측(우세반구) MCA."},{"id":"s07","steps":["2CK"],"system":"Gastrointestinal","discipline":"Management","topic":"Acute cholangitis","stem":"A 63-year-old woman is brought to the emergency department because of fever, chills, and right upper quadrant pain for 1 day. Temperature is 39.2°C (102.6°F), pulse is 114/min, and blood pressure is 96/60 mm Hg. She has scleral icterus and right upper quadrant tenderness. Leukocyte count is 18,500/mm³, total bilirubin is 5.2 mg/dL, and alkaline phosphatase is 410 U/L. Ultrasonography shows gallstones and a dilated common bile duct. IV fluids and piperacillin-tazobactam are started.\n\nWhich of the following is the most appropriate next step in management?","options":["Percutaneous liver biopsy","Emergency open cholecystectomy","Hepatobiliary iminodiacetic acid (HIDA) scan","Continue antibiotics and reassess in 1 week","Endoscopic retrograde cholangiopancreatography"],"answer":4,"explanation":"Fever, jaundice, and right upper quadrant pain (Charcot triad) with a dilated common bile duct indicate acute cholangitis from an obstructing stone; hypotension makes it severe. After fluids and broad-spectrum antibiotics, the definitive step is biliary drainage, usually ERCP with sphincterotomy and stone extraction, urgently when the patient is unstable. A HIDA scan evaluates acute cholecystitis and adds nothing once obstruction is evident. Cholecystectomy is done later, after recovery.","ko":"Charcot triad + CBD 확장 → 수액·항생제 후 ERCP 감압. 담낭절제는 나중."},{"id":"s08","steps":["1"],"system":"General Principles","discipline":"Biochemistry","topic":"Von Gierke disease","stem":"A 4-month-old girl is brought to the physician because she becomes sweaty and irritable a few hours after feedings. She has a round face and a protuberant abdomen. The liver is palpable 6 cm below the right costal margin; the spleen is not enlarged. Laboratory studies after a 4-hour fast show:\nGlucose 38 mg/dL\nLactate elevated\nUric acid elevated\nTriglycerides elevated\nGlucagon administration does not raise her blood glucose.\n\nDeficiency of which of the following enzymes is most likely?","options":["Glucose-6-phosphatase","Glycogen debranching enzyme","Lysosomal acid α-glucosidase","Liver glycogen phosphorylase","Muscle glycogen phosphorylase"],"answer":0,"explanation":"Severe fasting hypoglycemia with hepatomegaly, lactic acidosis, hyperuricemia, and hypertriglyceridemia is von Gierke disease (type I glycogen storage disease), caused by glucose-6-phosphatase deficiency. The liver cannot release free glucose from glycogenolysis or gluconeogenesis, so glucagon fails to raise glucose, and glucose-6-phosphate is shunted into lactate, triglyceride, and uric acid production. Cori disease (debranching enzyme) is milder with normal lactate. Pompe disease (acid α-glucosidase) causes cardiomegaly; McArdle disease affects muscle only.","ko":"공복 저혈당 + 간비대 + 젖산·요산·TG 상승 → von Gierke (G6Pase 결핍)."},{"id":"s09","steps":["1"],"system":"General Principles","discipline":"Pharmacology","topic":"Rifampin and warfarin","stem":"A 61-year-old man with a mechanical aortic valve has taken warfarin for 5 years with a stable INR between 2.5 and 3.5. Three weeks ago he was diagnosed with active pulmonary tuberculosis and started a four-drug regimen. Today his INR is 1.3. He takes all medications as directed and has not changed his diet.\n\nWhich of the following best explains this change in INR?","options":["Induction of hepatic cytochrome P450 enzymes","Inhibition of hepatic cytochrome P450 enzymes","Increased vitamin K production by intestinal bacteria","Decreased gastrointestinal absorption of warfarin","Displacement of warfarin from plasma albumin"],"answer":0,"explanation":"Rifampin is a potent inducer of hepatic CYP450 enzymes, including CYP2C9, which metabolizes the more active S-enantiomer of warfarin. Faster clearance lowers warfarin levels and the INR, putting this patient at risk of valve thrombosis; the warfarin dose must be raised with close INR monitoring, then lowered again when rifampin stops. CYP inhibitors (for example, fluconazole and amiodarone) raise the INR. Broad-spectrum antibiotics that kill gut flora reduce, not increase, vitamin K production.","ko":"Rifampin = 강력한 CYP 유도제 → warfarin 대사 증가 → INR 감소."},{"id":"s10","steps":["2CK"],"system":"Reproductive","discipline":"Management","topic":"Preeclampsia with severe features","stem":"A 28-year-old primigravida at 35 weeks' gestation comes to the labor and delivery unit because of a severe headache and blurred vision for 6 hours. Her pregnancy had been uncomplicated. Blood pressure is 168/112 mm Hg on two readings 15 minutes apart. Urine dipstick shows 3+ protein. Platelet count is 88,000/mm³, AST is 145 U/L, and ALT is 160 U/L. The fetal heart rate tracing is category I.\n\nWhich of the following is the most appropriate management?","options":["Bed rest and repeat laboratory studies in 48 hours","Low-dose aspirin and oral nifedipine","Magnesium sulfate, IV labetalol, and delivery","Outpatient monitoring with twice-weekly nonstress tests","Betamethasone and expectant management until 37 weeks"],"answer":2,"explanation":"Severe-range blood pressure with headache, visual symptoms, thrombocytopenia, and elevated transaminases indicates preeclampsia with severe features. At 34 weeks or later, management is maternal stabilization and delivery: magnesium sulfate for seizure prophylaxis, an antihypertensive such as IV labetalol or hydralazine for severe-range pressure, then delivery. Expectant management is reserved for stable patients before 34 weeks, so delaying delivery to 37 weeks is inappropriate. Low-dose aspirin is used for prevention, starting at 12 to 16 weeks.","ko":"34주 이후 중증 전자간증 → MgSO4 + 강압제 + 분만."},{"id":"s11","steps":["1","2CK"],"system":"Psychiatry","discipline":"Pharmacology","topic":"Lithium toxicity from thiazide","stem":"A 45-year-old woman with bipolar I disorder that has been stable on lithium for 6 years comes to the emergency department because of 4 days of nausea, diarrhea, and worsening hand tremor. One month ago, her primary care physician started a new medication for hypertension. She is confused and has a coarse tremor and hyperreflexia. Serum lithium level is 2.4 mEq/L (therapeutic 0.6–1.2).\n\nWhich of the following medications was most likely started?","options":["Metoprolol","Doxazosin","Hydrochlorothiazide","Hydralazine","Amlodipine"],"answer":2,"explanation":"Thiazide diuretics cause mild volume depletion, which increases proximal tubular reabsorption of sodium and lithium and raises lithium levels. ACE inhibitors, ARBs, and NSAIDs have the same effect. Coarse tremor, GI symptoms, confusion, and hyperreflexia indicate lithium toxicity; treatment is stopping lithium, IV fluids, and hemodialysis in severe cases. Amlodipine, metoprolol, hydralazine, and doxazosin do not meaningfully change lithium clearance.","ko":"Lithium 농도 ↑ 약물: thiazide, ACEi/ARB, NSAID."},{"id":"s12","steps":["1"],"system":"General Principles","discipline":"Immunology","topic":"X-linked agammaglobulinemia","stem":"A 14-month-old boy is brought to the physician because of his third episode of pneumonia in 6 months; he has also had recurrent otitis media and one episode of Haemophilus influenzae meningitis. He was well until 7 months of age. His maternal uncle died of infection in childhood. Examination shows very small tonsils and no palpable lymph nodes. Serum IgG, IgA, and IgM are markedly decreased, and flow cytometry shows almost no CD19+ cells. T-cell counts are normal.\n\nA defect in which of the following is most likely?","options":["Adenosine deaminase","WAS protein","CD40 ligand","Bruton tyrosine kinase","Common γ chain of the IL-2 receptor"],"answer":3,"explanation":"X-linked agammaglobulinemia results from mutations in Bruton tyrosine kinase, which stops pre-B cells from maturing. Boys present after maternal IgG wanes at about 6 months with recurrent infections by encapsulated bacteria, absent B cells, low levels of all immunoglobulin classes, and scant lymphoid tissue. CD40 ligand deficiency (hyper-IgM syndrome) has normal B-cell counts with high IgM. ADA and common γ-chain defects cause SCID with absent or nonfunctional T cells.","ko":"남아 6개월 이후 세균감염 반복 + B세포 없음 + 편도 작음 → XLA (BTK)."},{"id":"s13","steps":["2CK"],"system":"Endocrine","discipline":"Management","topic":"Diabetic ketoacidosis","stem":"A 19-year-old woman with type 1 diabetes mellitus is brought to the emergency department because of vomiting, abdominal pain, and lethargy for 1 day. She ran out of insulin 3 days ago. Pulse is 124/min, blood pressure is 94/58 mm Hg, and respirations are 30/min and deep. Laboratory studies show:\nGlucose 540 mg/dL\nNa+ 133 mEq/L\nK+ 5.1 mEq/L\nCl− 98 mEq/L\nHCO3− 8 mEq/L\nArterial pH 7.08\nSerum β-hydroxybutyrate elevated\n\nWhich of the following is the most appropriate initial step in management?","options":["Subcutaneous insulin glargine","IV regular insulin bolus before any fluids","IV 0.9% saline","IV potassium chloride","IV sodium bicarbonate"],"answer":2,"explanation":"This patient has diabetic ketoacidosis with an anion gap of 27 (133 − [98 + 8]) and marked volume depletion. The first step is aggressive IV isotonic fluid, which restores perfusion and itself lowers glucose. A continuous IV insulin infusion follows once potassium is confirmed to be at least 3.3 mEq/L; total-body potassium is depleted and will fall with insulin, so it must be replaced as levels drop. Bicarbonate is reserved for pH below 6.9. Subcutaneous long-acting insulin starts when the anion gap closes and the patient can eat.","ko":"DKA 첫 단계 = 생리식염수. K ≥3.3 확인 후 인슐린 정주, 중탄산은 pH \u003c6.9."},{"id":"s14","steps":["1"],"system":"MSK & Skin","discipline":"Immunology","topic":"SLE antibodies","stem":"A 27-year-old woman comes to the physician because of pain in her hands and wrists and a facial rash that worsens with sun exposure. She has had two painless oral ulcers in the past month. Examination shows an erythematous rash over the cheeks and nasal bridge that spares the nasolabial folds. Urinalysis shows 2+ protein and red blood cell casts.\n\nWhich of the following serum antibodies is most specific for this patient's condition?","options":["Antihistone antibody","Anti-Smith antibody","Anticentromere antibody","Anti-Ro/SSA antibody","Antinuclear antibody"],"answer":1,"explanation":"Malar rash, photosensitivity, oral ulcers, arthritis, and nephritis in a young woman indicate systemic lupus erythematosus. Anti-Smith and anti-dsDNA antibodies are highly specific for SLE; anti-dsDNA levels also track disease activity and lupus nephritis. ANA is the most sensitive screening test but is not specific. Antihistone antibodies suggest drug-induced lupus, anticentromere antibodies suggest limited systemic sclerosis (CREST), and anti-Ro/SSA is associated with Sjögren syndrome and neonatal lupus.","ko":"SLE: 민감도 = ANA, 특이도 = anti-Smith·anti-dsDNA."},{"id":"s15","steps":["1"],"system":"Respiratory","discipline":"Physiology","topic":"Emphysema PFTs","stem":"A 64-year-old man with a 50-pack-year smoking history comes to the physician because of progressive shortness of breath over 2 years. He has minimal sputum production. He is thin and breathes through pursed lips. The chest is barrel-shaped, and breath sounds are diminished. Chest x-ray shows hyperinflated lungs with flattened diaphragms.\n\nWhich of the following sets of pulmonary function findings is most likely?","options":["FEV1/FVC ↓, TLC ↑, DLCO normal","FEV1/FVC normal or ↑, TLC ↓, DLCO ↓","FEV1/FVC normal or ↑, TLC ↓, DLCO normal","FEV1/FVC ↓, TLC ↑, DLCO ↓","FEV1/FVC normal, TLC normal, DLCO ↑"],"answer":3,"explanation":"Emphysema is obstructive: loss of elastic recoil lets airways collapse during expiration, lowering FEV1/FVC and trapping air, which raises TLC and residual volume. Destruction of alveolar walls and their capillaries reduces the gas-exchange surface, so DLCO falls. Chronic bronchitis and asthma are also obstructive but usually have normal DLCO (asthma may be increased). Restrictive patterns (low TLC, normal or high FEV1/FVC) occur in interstitial lung disease with low DLCO, or in extrapulmonary causes such as obesity or neuromuscular disease with normal DLCO.","ko":"폐기종: FEV1/FVC↓ + TLC↑ + DLCO↓ (폐포·모세혈관 파괴)."},{"id":"s16","steps":["1","2CK"],"system":"MSK & Skin","discipline":"Pathology","topic":"Melanoma prognosis","stem":"A 52-year-old man has an irregular, multicolored pigmented lesion on his upper back that his wife noticed has grown over the past 6 months. Excisional biopsy confirms cutaneous melanoma.\n\nWhich of the following features of the excised lesion is the most important predictor of prognosis?","options":["Depth of invasion (Breslow thickness)","Degree of color variegation","Presence of a precursor nevus","Irregularity of the border","Diameter of the lesion"],"answer":0,"explanation":"Breslow thickness, the depth of invasion in millimeters, is the most important prognostic factor for localized melanoma because it reflects vertical growth and the risk of metastasis. It sets the T stage, the excision margins, and whether sentinel lymph node biopsy is offered. Diameter, color, and border (the ABCDE criteria) help identify suspicious lesions but do not predict outcome after diagnosis. Ulceration is the other key histologic prognostic feature.","ko":"흑색종 예후 최대 인자 = Breslow 두께. ABCDE는 진단용."},{"id":"s17","steps":["2CK"],"system":"Cardiovascular","discipline":"Management","topic":"Right ventricular infarction","stem":"A 59-year-old man is brought to the emergency department 40 minutes after the onset of crushing substernal chest pain. Pulse is 54/min and blood pressure is 82/50 mm Hg. Jugular venous pressure is elevated, and the lungs are clear. ECG shows ST-segment elevation in leads II, III, and aVF and in right-sided lead V4R. Aspirin has been given and the catheterization laboratory is being activated.\n\nWhich of the following is the most appropriate next step to treat his hypotension?","options":["IV 0.9% saline bolus","IV metoprolol","IV morphine","IV furosemide","Sublingual nitroglycerin"],"answer":0,"explanation":"Inferior ST elevation with hypotension, elevated JVP, clear lungs, and ST elevation in V4R indicates right ventricular infarction, usually from proximal right coronary artery occlusion. The right ventricle depends on preload, so hypotension is treated with an IV fluid bolus while reperfusion is arranged. Nitrates, diuretics, and morphine reduce preload and can cause profound hypotension. β-Blockers are contraindicated with hypotension and bradycardia.","ko":"하벽 STEMI + 저혈압 + JVP↑ + 폐 깨끗 → 우심실 경색: 수액, 질산염 금지."},{"id":"s18","steps":["1","2CK"],"system":"Gastrointestinal","discipline":"Microbiology","topic":"C. difficile infection","stem":"A 72-year-old woman develops watery diarrhea with 8 bowel movements daily and crampy abdominal pain 6 days after starting clindamycin for a dental infection. Temperature is 38.0°C (100.4°F). Leukocyte count is 14,000/mm³ and serum creatinine is at her baseline of 0.9 mg/dL. Stool testing is positive for Clostridioides difficile toxin.\n\nIn addition to stopping clindamycin, which of the following is the most appropriate treatment?","options":["Oral ciprofloxacin","Fecal microbiota transplantation","IV vancomycin","Loperamide","Oral vancomycin"],"answer":4,"explanation":"This is an initial, non-severe episode of C. difficile infection (leukocyte count ≤15,000/mm³ and creatinine \u003c1.5 mg/dL). First-line treatment is oral fidaxomicin or oral vancomycin for 10 days. IV vancomycin is not excreted into the colon and does not work; IV metronidazole is added only for fulminant disease. Antimotility agents can precipitate toxic megacolon. Fecal microbiota transplantation is reserved for multiple recurrences.","ko":"C. diff 첫 발병: 경구 vancomycin 또는 fidaxomicin. IV vanco는 장으로 안 감."},{"id":"s19","steps":["1","2CK"],"system":"General Principles","discipline":"Biostatistics","topic":"Positive predictive value","stem":"A new screening test for a disease has a sensitivity of 90% and a specificity of 80%. The test is applied to a population of 1000 people in which the prevalence of the disease is 10%.\n\nWhat is the probability that a person with a positive test result actually has the disease?","options":["10%","33%","50%","82%","90%"],"answer":1,"explanation":"Of 1000 people, 100 have the disease and 900 do not. True positives = 0.90 × 100 = 90. False positives = (1 − 0.80) × 900 = 180. Positive predictive value = 90 / (90 + 180) = 33%. PPV depends on prevalence: at low prevalence, even a fairly specific test produces many false positives. 90% is the sensitivity, which answers a different question: the chance of a positive result in someone who has the disease.","ko":"PPV = TP/(TP+FP). 유병률이 낮으면 PPV↓. 2×2 표를 직접 그리기."},{"id":"s20","steps":["2CK"],"system":"General Principles","discipline":"Ethics","topic":"Minor consent for contraception","stem":"A 16-year-old girl comes to the physician requesting oral contraception. She has been sexually active with one partner for 3 months and uses condoms inconsistently. She asks that her parents not be told because they would disapprove. She is healthy, and examination shows no abnormalities.\n\nWhich of the following is the most appropriate response?","options":["Prescribe contraception and encourage, but do not require, communication with her parents","Tell her that a parent must sign a consent form first","Call her parents to discuss the request before prescribing","Prescribe contraception only if she brings her partner to the next visit","Decline to prescribe and refer her to a gynecologist"],"answer":0,"explanation":"In most US states, minors may consent on their own to contraception, prenatal care, and testing and treatment for sexually transmitted infections, and this care is confidential. The physician should provide contraception, counsel on condom use for STI prevention, and encourage, but not require, involvement of a parent or another trusted adult. Requiring parental consent or informing the parents would breach confidentiality and could discourage her from seeking care.","ko":"미성년자도 피임·산전관리·STI 진료는 단독 동의 + 비밀보장. 부모 대화는 권유만."},{"id":"s21","steps":["1","2CK"],"system":"Endocrine","discipline":"Pharmacology","topic":"SGLT2 inhibitors","stem":"A 58-year-old man with type 2 diabetes mellitus and heart failure with reduced ejection fraction is started on a new medication in addition to metformin. Three months later, his HbA1c has decreased from 8.2% to 7.4%, and he has lost 2 kg (4.4 lb). He now reports genital itching and a white discharge beneath his foreskin. Urinalysis shows 4+ glucose; serum glucose is 142 mg/dL.\n\nWhich of the following drugs was most likely added?","options":["Sitagliptin","Pioglitazone","Glipizide","Insulin glargine","Empagliflozin"],"answer":4,"explanation":"Empagliflozin inhibits the sodium-glucose cotransporter 2 in the proximal tubule, causing glucosuria despite near-normal serum glucose. Glucosuria predisposes to genital mycotic infections and urinary tract infections, along with modest weight loss and osmotic diuresis. SGLT2 inhibitors also reduce heart failure hospitalizations and slow chronic kidney disease. Pioglitazone causes fluid retention and worsens heart failure; glipizide and insulin cause weight gain and hypoglycemia.","ko":"SGLT2 억제제: 요당 → 생식기 진균감염·UTI, 체중↓, HFrEF·CKD 이점."},{"id":"s22","steps":["1"],"system":"Hematology & Oncology","discipline":"Biochemistry","topic":"G6PD deficiency","stem":"A 6-year-old boy of Mediterranean descent is brought to the emergency department because of fatigue and dark urine for 2 days. Three days ago, he ate a large meal that included fava beans. He has pallor and scleral icterus. Hemoglobin is 7.8 g/dL, reticulocyte count is 6%, and serum indirect bilirubin and LDH are elevated. A smear stained with crystal violet shows red cell inclusions, and a Wright-stained smear shows red cells with semicircular bites removed.\n\nWhich of the following is most likely decreased in this patient's red blood cells?","options":["Spectrin","Hemoglobin β-chain synthesis","CD55 and CD59 expression","ATP production by glycolysis","NADPH production"],"answer":4,"explanation":"Hemolysis after fava beans (or oxidant drugs such as primaquine, dapsone, or sulfonamides, or infection) with Heinz bodies and bite cells is G6PD deficiency, which is X-linked. G6PD is the rate-limiting enzyme of the pentose phosphate pathway, which produces the NADPH needed to keep glutathione reduced. Without it, oxidized hemoglobin precipitates as Heinz bodies, which splenic macrophages remove, leaving bite cells. Spectrin defects cause hereditary spherocytosis, pyruvate kinase deficiency reduces ATP, and loss of CD55/CD59 causes paroxysmal nocturnal hemoglobinuria.","ko":"잠두·산화제 후 용혈 + Heinz body + bite cell → G6PD 결핍 (NADPH↓)."},{"id":"s23","steps":["1"],"system":"Renal","discipline":"Pathology","topic":"Minimal change disease","stem":"A 5-year-old boy is brought to the physician because of puffiness around his eyes for 1 week and swelling of his legs for 3 days. He had an upper respiratory infection 2 weeks ago. Blood pressure is normal for age. Urinalysis shows 4+ protein and no blood. Serum albumin is 1.9 g/dL and serum cholesterol is elevated. Serum complement levels are normal.\n\nWhich of the following is the most likely finding on electron microscopy of a kidney biopsy specimen?","options":["Subepithelial immune complex humps","Splitting of the glomerular basement membrane","Subendothelial deposits with a tram-track appearance","Effacement of podocyte foot processes","Subepithelial deposits with a spike-and-dome pattern"],"answer":3,"explanation":"Nephrotic syndrome in a young child with normal blood pressure, no hematuria, and normal complement is most likely minimal change disease. Light microscopy is normal, and electron microscopy shows effacement of podocyte foot processes; the disease usually responds to corticosteroids, so biopsy is generally reserved for children who do not respond. Subepithelial humps occur in poststreptococcal glomerulonephritis, spike-and-dome deposits in membranous nephropathy, GBM splitting in Alport syndrome, and tram-track subendothelial deposits in membranoproliferative glomerulonephritis.","ko":"소아 신증후군 + 혈뇨·저보체 없음 → 미세변화병: EM 족세포 발돌기 소실."}];

// ---------- State & storage ----------
const LS_P="usmle.progress.v1", LS_Q="usmle.aiq.v1", LS_S="usmle.session.v1", INT=[1,2,4,8,16,32];
const blank=()=>({v:1,settings:{step:"1",goal:20,exam:""},rec:{},days:{},flags:{}});
function lsGet(k){try{const s=localStorage.getItem(k);return s?JSON.parse(s):null}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
function norm(p){const b=blank();if(!p||typeof p!=="object")return b;return{v:1,settings:Object.assign(b.settings,p.settings||{}),rec:p.rec||{},days:p.days||{},flags:p.flags||{}}}

let P=norm(lsGet(LS_P));
let AIQ=Array.isArray(lsGet(LS_Q))?lsGet(LS_Q):[];
let DB=null, UID=null, SYNC="local";
let PID=null, USERNS=null; // PID: this viewer's key in shared docs (their user id, or a per-device fallback)
let saving=false, again=false;
function localPid(){
  let p=null;try{p=localStorage.getItem("usmle.pid")}catch(e){}
  if(!p){p="g_"+Date.now().toString(36)+Math.random().toString(36).slice(2,8);try{localStorage.setItem("usmle.pid",p)}catch(e){}}
  return p;
}

function progRef(){return DB.doc("data/users/"+UID+"/progress")}
function qCol(){return DB.doc("data/users/"+UID+"/profile").collection("questions")}

async function persist(){
  lsSet(LS_P,P);
  schedulePush();
  if(!DB||!UID)return;
  if(saving){again=true;return}
  saving=true;
  try{await progRef().set(JSON.parse(JSON.stringify(P)))}catch(e){console.warn("save failed",e)}
  saving=false;
  if(again){again=false;persist()}
}
async function saveAIQ(list){
  AIQ=AIQ.concat(list);lsSet(LS_Q,AIQ);
  if(DB&&UID){for(const q of list){try{await qCol().doc(q.id).set(q)}catch(e){console.warn(e)}}}
}
async function deleteAIQ(id){
  AIQ=AIQ.filter(q=>q.id!==id);lsSet(LS_Q,AIQ);
  delete P.rec[id];delete P.flags[id];persist();
  if(DB&&UID){try{await qCol().doc(id).delete()}catch(e){console.warn(e)}}
}
async function loadCloud(){
  const snap=await progRef().get();
  if(snap.exists)P=norm(JSON.parse(JSON.stringify(snap.data())));
  else if(Object.keys(P.rec).length)await persist();
  lsSet(LS_P,P);
  const qs=await qCol().get();
  const cloudQ=qs.docs.map(d=>Object.assign({},JSON.parse(JSON.stringify(d.data())),{id:d.id}));
  const missing=AIQ.filter(q=>!cloudQ.some(c=>c.id===q.id));
  AIQ=cloudQ.concat(missing);lsSet(LS_Q,AIQ);
  for(const q of missing){try{await qCol().doc(q.id).set(q)}catch(e){}}
}
async function initCloud(){
  if(!window.claude||!window.claude.use)return;
  try{
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db)return;
    DB=db;USERNS=user;
    const uid=user?await user.id():null;
    if(user){const cw=await user.can("data.write");if(cw===false)S.canWrite=false}
    PID=uid||localPid();
    if(uid){UID=uid;try{await loadCloud();SYNC="cloud"}catch(e){console.warn("private store unavailable",e);UID=null}}
    subscribeShared();
    schedulePush();
    if(S.view!=="quiz")render();
  }catch(e){console.warn("cloud unavailable",e);DB=null}
}
document.addEventListener("visibilitychange",async()=>{
  if(document.visibilityState==="visible"&&DB&&UID&&S.view!=="quiz"){try{await loadCloud();render()}catch(e){}}
});

// ---------- Shared (friends) data ----------
// players/<pid>: weekly totals for the leaderboard
// challenges/<cid>: a fixed set of question ids everyone takes
// results/<cid>__<pid>: one person's score on a challenge
function weekKey(s){const [y,m,d]=s.split("-").map(Number);const dt=new Date(y,m-1,d);dt.setDate(dt.getDate()-(dt.getDay()+6)%7);return ds(dt)}
function playerDoc(){
  const t=today(),wk=weekKey(t);let wn=0,wc=0;
  for(const [d,v] of Object.entries(P.days))if(d>=wk&&d<=t){wn+=v.n;wc+=v.c}
  const recs=Object.values(P.rec);
  return{nick:String(P.settings.nick||window.__fbName||"").slice(0,20),total:recs.length,attempts:recs.reduce((s,r)=>s+r.n,0),correct:recs.reduce((s,r)=>s+r.c,0),
    wk,wn,wc,td:t,tn:(P.days[t]||{}).n||0,streak:streak(),updated:new Date().toISOString()};
}
let pushTimer=null,pushing=false,pushAgain=false;
function schedulePush(){if(!DB||!PID||S.canWrite===false)return;clearTimeout(pushTimer);pushTimer=setTimeout(pushPlayer,2500)}
async function pushPlayer(){
  if(pushing){pushAgain=true;return}
  pushing=true;
  try{await DB.collection("players").doc(PID).set(playerDoc())}catch(e){writeErr(e)}
  pushing=false;
  if(pushAgain){pushAgain=false;pushPlayer()}
}
function writeErr(e){
  console.warn("shared write failed",e);
  const c=e&&e.code;
  if(c==="invalid_argument"){S.canWrite=false;S.friendErr="이 화면에서는 친구 기록을 올릴 수 없어요. 앱 주인에게 편집자로 초대해 달라고 하세요."}
  else if(c==="quota_exceeded")S.friendErr="공유 저장 공간이 가득 찼어요.";
  else S.friendErr="저장에 실패했어요. 잠시 후 다시 시도해 주세요.";
  if(S.view!=="quiz")render();
}
function rerenderShared(){
  resolveNames();
  const a=document.activeElement;
  if(a&&a.id==="nick")return;
  if(S.view==="friends"||S.view==="chal"||S.view==="home")render();
}
function subscribeShared(){
  const err=e=>console.warn("subscription",e);
  DB.collection("players").onSnapshot(s=>{S.players=s.docs.map(d=>Object.assign({id:d.id},d.data()));rerenderShared()},err);
  DB.collection("challenges").orderBy("created","desc").limit(30).onSnapshot(s=>{S.chals=s.docs.map(d=>Object.assign({id:d.id},d.data()));rerenderShared()},err);
  DB.collection("results").orderBy("at","desc").limit(500).onSnapshot(s=>{
    const m={};for(const d of s.docs){const r=d.data();(m[r.cid]||(m[r.cid]=[])).push(r)}
    S.resByCid=m;rerenderShared();
  },err);
}
let namesBusy=false;
async function resolveNames(){
  if(!USERNS||namesBusy)return;
  const ids=new Set();
  for(const p of S.players)ids.add(p.id);
  for(const c of S.chals)ids.add(c.by);
  for(const k in S.resByCid)for(const r of S.resByCid[k])ids.add(r.pid);
  const list=[...ids].filter(id=>id&&!id.startsWith("g_"));
  if(!list.length)return;
  namesBusy=true;
  try{
    const ps=await USERNS.profiles(list);let changed=false;
    for(const id of list){const n=(ps[id]&&ps[id].name)||"";if(S.names[id]!==n){S.names[id]=n;changed=true}}
    const a=document.activeElement;
    if(changed&&S.view!=="quiz"&&!(a&&a.id==="nick"))render();
  }catch(e){}
  namesBusy=false;
}
function pname(pid){
  if(pid===PID)return P.settings.nick||S.names[pid]||"나";
  const p=S.players.find(x=>x.id===pid);
  return (p&&p.nick)||S.names[pid]||"친구";
}
function boardRows(){
  const t=today(),wk=weekKey(t),y=addDays(t,-1);

function myResult(cid){return (S.resByCid[cid]||[]).find(r=>r.pid===PID)}
function pickChallengeIds(n){
  const groups={};
  for(const q of shuffle(BANK.filter(stepOk)))(groups[q.system]||(groups[q.system]=[])).push(q.id);
  const out=[];
  while(out.length<n){
    const keys=Object.keys(groups).filter(k=>groups[k].length);if(!keys.length)break;
    const w=keys.map(k=>WEIGHT[k]||6);let r=Math.random()*w.reduce((a,b)=>a+b,0),i=0;
    while(r>w[i]&&i<keys.length-1){r-=w[i];i++}
    out.push(groups[keys[i]].shift());
  }
  return out;
}

// ---------- Helpers ----------
function ds(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),dd=String(d.getDate()).padStart(2,"0");return y+"-"+m+"-"+dd}
function today(){return ds(new Date())}
function addDays(s,n){const [y,m,d]=s.split("-").map(Number);return ds(new Date(y,m-1,d+n))}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function h(tag,attrs,...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(k==="class")e.className=v;
    else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);
    else if(v===true)e.setAttribute(k,"");
    else if(v!==false&&v!=null)e.setAttribute(k,v);
  }
  for(const k of kids.flat()){if(k==null||k===false)continue;e.append(k.nodeType?k:String(k))}
  return e;
}
const QMAP=new Map();
function allQ(){return BANK.concat(AIQ)}
function qById(id){if(!QMAP.size||QMAP.size!==BANK.length+AIQ.length){QMAP.clear();for(const q of allQ())QMAP.set(q.id,q)}return QMAP.get(id)}
function stepOk(q){return (q.steps||["1"]).includes(P.settings.step)}
function dueList(){const t=today();return allQ().filter(q=>P.rec[q.id]&&P.rec[q.id].due<=t)}
function bySystem(){
  const m={};
  for(const [id,r] of Object.entries(P.rec)){const q=qById(id);if(!q)continue;const s=m[q.system]||(m[q.system]={n:0,c:0,seen:0});s.n+=r.n;s.c+=r.c;s.seen++}
  return m;
}
function byDiscipline(){
  const m={};
  for(const [id,r] of Object.entries(P.rec)){const q=qById(id);if(!q)continue;const s=m[q.discipline]||(m[q.discipline]={n:0,c:0});s.n+=r.n;s.c+=r.c}
  return m;
}
function weakness(sys,m){const v=m[sys];if(!v||v.n<3)return .5;return 1-v.c/v.n}
// Weighted draw of unseen questions across systems: blueprint weight × (1 + weakness)
function pickFresh(n,systems){
  const m=bySystem();
  const groups={};
  for(const q of allQ()){
    if(P.rec[q.id])continue;
    if(systems&&!systems.includes(q.system))continue;
    (groups[q.system]||(groups[q.system]=[])).push(q);
  }
  for(const k in groups){const g=groups[k];groups[k]=shuffle(g.filter(stepOk)).concat(shuffle(g.filter(q=>!stepOk(q))))}
  const out=[];
  while(out.length<n){
    const keys=Object.keys(groups).filter(k=>groups[k].length);
    if(!keys.length)break;
    const w=keys.map(k=>(WEIGHT[k]||6)*(1+weakness(k,m)));
    let r=Math.random()*w.reduce((a,b)=>a+b,0),i=0;
    while(r>w[i]&&i<keys.length-1){r-=w[i];i++}
    out.push(groups[keys[i]].shift());
  }
  return out;
}
function freshCount(systems){return allQ().filter(q=>!P.rec[q.id]&&(!systems||systems.includes(q.system))).length}
function streak(){
  const d=new Date();let s=0;
  if(!(P.days[ds(d)]||{}).n)d.setDate(d.getDate()-1);
  while((P.days[ds(d)]||{}).n){s++;d.setDate(d.getDate()-1)}
  return s;
}
function weakest(){
  const m=bySystem();
  const rated=Object.entries(m).filter(([,v])=>v.n>0).sort((a,b)=>a[1].c/a[1].n-b[1].c/b[1].n);
  return rated.length?rated[0][0]:SYSTEMS[Math.floor(Math.random()*SYSTEMS.length)];
}
function dday(){
  const e=P.settings.exam;if(!e)return null;
  const [y,m,d]=e.split("-").map(Number);const n=Math.round((new Date(y,m-1,d)-new Date(new Date().toDateString()))/864e5);
  return n>0?"D-"+n:n===0?"D-day":"D+"+(-n);
}
function fmtTime(s){s=Math.max(0,Math.round(s));const m=Math.floor(s/60),r=s%60;return m+":"+String(r).padStart(2,"0")}

function startDaily(){
  const goal=Number(P.settings.goal)||20;
  const due=shuffle(dueList()).map(q=>q.id).slice(0,goal);
  const fresh=pickFresh(goal-due.length).map(q=>q.id);
  startBlock(shuffle(due.concat(fresh)),"tutor","오늘의 문제");
}
function buildBlockIds(){
  const b=S.block,sys=b.systems.length?b.systems:SYSTEMS,n=b.count;
  const inSys=q=>sys.includes(q.system);
  if(b.pool==="new")return pickFresh(n,sys).map(q=>q.id);
  if(b.pool==="missed")return shuffle(allQ().filter(q=>inSys(q)&&P.rec[q.id]&&P.rec[q.id].lastOk===false)).slice(0,n).map(q=>q.id);
  if(b.pool==="flagged")return shuffle(allQ().filter(q=>inSys(q)&&P.flags[q.id])).slice(0,n).map(q=>q.id);
  return shuffle(allQ().filter(inSys)).slice(0,n).map(q=>q.id);
}
function poolSize(){
  const b=S.block,sys=b.systems.length?b.systems:SYSTEMS;
  const inSys=q=>sys.includes(q.system);
  if(b.pool==="new")return freshCount(sys);
  if(b.pool==="missed")return allQ().filter(q=>inSys(q)&&P.rec[q.id]&&P.rec[q.id].lastOk===false).length;
  if(b.pool==="flagged")return allQ().filter(q=>inSys(q)&&P.flags[q.id]).length;
  return allQ().filter(inSys).length;
}

function record(q,ok){
  const t=today();
  const r=P.rec[q.id]||{b:0,n:0,c:0};
  r.n++;
  if(ok){r.c++;r.b=Math.min(r.b+1,INT.length-1)}else r.b=0;
  r.due=addDays(t,ok?INT[r.b]:1);r.last=t;r.lastOk=ok;
  P.rec[q.id]=r;
  const d=P.days[t]||{n:0,c:0};d.n++;if(ok)d.c++;P.days[t]=d;
}
function pick(q,idx){
  if(S.mode==="tutor"){
    if(S.picked[q.id]!=null)return;
    S.picked[q.id]=idx;
    const ok=idx===q.answer;
    S.results.push({id:q.id,ok});
    record(q,ok);persist();
  }else{
    if(S.finished)return;
    S.picked[q.id]=idx;
  }
  saveSession();render();
}
function go(i){
  S.i=Math.max(0,Math.min(S.queue.length-1,i));S.confirmEnd=false;S.showNav=false;
  saveSession();render();window.scrollTo(0,0);
}
function finishBlock(){
  if(S.mode==="timed"&&!S.finished){
    S.results=S.queue.map(id=>{const q=qById(id);const p=S.picked[id];const ok=p===q.answer;record(q,ok);return{id,ok,skip:p==null}});
    persist();
    if(S.chal&&DB&&PID){
      const res={cid:S.chal,pid:PID,score:S.results.filter(r=>r.ok).length,n:S.queue.length,time:S.total-Math.max(0,S.left),
        picks:S.queue.map(id=>S.picked[id]==null?-1:S.picked[id]),at:new Date().toISOString()};
      DB.collection("results").doc(S.chal+"__"+PID).set(res).catch(writeErr);
    }
  }
  S.finished=true;S.view="done";S.confirmEnd=false;clearSession();render();window.scrollTo(0,0);
}
function nextTutor(){
  if(S.i<S.queue.length-1)go(S.i+1);
  else{S.finished=true;S.view="done";clearSession();render();window.scrollTo(0,0)}
}
function toggleFlag(id){if(P.flags[id])delete P.flags[id];else P.flags[id]=1;persist();render()}

// Timed-mode clock only runs while the block is on screen
setInterval(()=>{
