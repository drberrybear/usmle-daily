<html lang="ko">
<head>

<title>USMLE 데일리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: single phone-width column; exam-interface bar during blocks, bottom tab bar elsewhere */
:root{
  --bg:#EEF2F5; --surface:#FFFFFF; --ink:#16222E; --muted:#5A6977; --line:#D5DDE4;
  --accent:#2B6C8C; --accent-soft:#DCEBF2; --on-accent:#FFFFFF;
  --exam:#1E3A55; --on-exam:#EAF2F8;
  --ok:#2C7A4E; --ok-bg:#E2F2E8; --bad:#B23B3B; --bad-bg:#F8E3E3; --warn:#9A6A12; --warn-bg:#FBF0D9; --flag:#C9821B;
  --sans:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E141A; --surface:#17212B; --ink:#E3EAF0; --muted:#94A3B1; --line:#2A3743;
  --accent:#6DB2D3; --accent-soft:#1D3442; --on-accent:#0B1620;
  --exam:#1B3247; --on-exam:#DCE9F3;
  --ok:#5FC78C; --ok-bg:#16301F; --bad:#E77B7B; --bad-bg:#3A1C1C; --warn:#E2B457; --warn-bg:#352A12; --flag:#E9A84A;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E141A; --surface:#17212B; --ink:#E3EAF0; --muted:#94A3B1; --line:#2A3743;
  --accent:#6DB2D3; --accent-soft:#1D3442; --on-accent:#0B1620;
  --exam:#1B3247; --on-exam:#DCE9F3;
  --ok:#5FC78C; --ok-bg:#16301F; --bad:#E77B7B; --bad-bg:#3A1C1C; --warn:#E2B457; --warn-bg:#352A12; --flag:#E9A84A;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
main{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:20px 104px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.25}
h1{font-size:22px;font-weight:700}
h2{font-size:17px;font-weight:700}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
button,select,input{font:inherit;color:inherit}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 14px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.btn.big{width:100%;padding:14px 16px;font-size:16px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select,input[type=date]{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.dday{font-family:var(--mono);font-weight:500;color:var(--accent);font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0}
.kpi b{display:block;font-family:var(--mono);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}
.meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.meter>i{display:block;height:100%;background:var(--accent)}
.days{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.days span{aspect-ratio:1;border-radius:3px;background:var(--line);max-width:100%}
.days span.l1{background:color-mix(in srgb,var(--accent) 45%,var(--line))}
.days span.l2{background:var(--accent)}
.days span.today{outline:1.5px solid var(--ink);outline-offset:1px}
.sysrow{display:grid;grid-template-columns:minmax(0,1fr) 80px 64px;gap:10px;align-items:center;font-size:14px}
.sysrow .meter>i.lo{background:var(--bad)}
.sysrow .meter>i.mid{background:var(--warn)}
.sysrow .meter>i.hi{background:var(--ok)}
.sysrow .meter>i.cov{background:var(--muted)}
.chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--ink);white-space:nowrap}
.chip.ai{background:var(--warn-bg);color:var(--warn);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.pick{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.pick[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.pick .n{font-family:var(--mono);opacity:.75;margin-left:4px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;appearance:none;border:0;background:var(--surface);padding:9px 8px;cursor:pointer;font-size:14px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:700}
.banner{background:var(--accent-soft);border-radius:10px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
/* exam bar */
.exam{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--exam);color:var(--on-exam);margin-inline:-16px;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.exam .item{font-family:var(--mono);font-size:14px}
.exam .timer{font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums}
.exam .timer.low{color:var(--flag)}
.exam button{background:transparent;border:1px solid color-mix(in srgb,var(--on-exam) 40%,transparent);color:var(--on-exam);border-radius:6px;padding:5px 10px;font-size:13px;cursor:pointer}
.exam button[aria-pressed="true"]{background:var(--flag);border-color:var(--flag);color:#1A1205}
.nav-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.nav-grid button{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 0;font-family:var(--mono);font-size:13px;cursor:pointer;position:relative}
.nav-grid button.ans{background:var(--accent-soft)}
.nav-grid button.cur{outline:2px solid var(--accent)}
.nav-grid button.ok{background:var(--ok-bg);border-color:var(--ok)}
.nav-grid button.bad{background:var(--bad-bg);border-color:var(--bad)}
.nav-grid button.flag::after{content:"";position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--flag)}
.stem{white-space:pre-line;font-size:16px;line-height:1.65}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;align-items:start;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;cursor:pointer;font-size:15px}
.opt .let{font-family:var(--mono);font-weight:500;color:var(--muted)}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .let{color:var(--accent)}
.opt.right{background:var(--ok-bg);border-color:var(--ok)}
.opt.right .let{color:var(--ok)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.opt.wrong .let{color:var(--bad)}
.verdict{font-weight:700}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)} .verdict.skip{color:var(--warn)}
.keypt{border-left:3px solid var(--accent);padding:4px 0 4px 12px;font-weight:500}
.ask{white-space:pre-wrap;font-size:14px;background:var(--bg);border-radius:8px;padding:12px}
.labs{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;font-size:13px}
.labs dt{color:var(--muted)} .labs dd{margin:0;font-family:var(--mono);text-align:right}
.labs h3{grid-column:1/-1;font-size:12px;margin-top:8px;font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.qnav{display:grid;grid-template-columns:1fr 1fr;gap:8px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav.tabs button{flex:1;max-width:160px;background:none;border:0;padding:12px 4px;cursor:pointer;color:var(--muted);font-weight:500}
nav.tabs button[aria-current="true"]{color:var(--accent);box-shadow:inset 0 2px 0 var(--accent)}
.rlist{display:flex;flex-direction:column}
.rlist button{appearance:none;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 0;text-align:left;cursor:pointer;display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:8px;align-items:center}
.rlist .mk{font-family:var(--mono);font-weight:500}
.rlist .mk.ok{color:var(--ok)} .rlist .mk.bad{color:var(--bad)} .rlist .mk.skip{color:var(--warn)}
.status{font-size:13px;min-height:1.4em}
.lb{display:flex;flex-direction:column}
.lb .r{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.lb .r:last-child{border-bottom:0}
.lb .rk{font-family:var(--mono);font-weight:500;color:var(--muted);text-align:center}
.lb .r.top .rk{color:var(--flag)}
.lb .r.me{background:var(--accent-soft);margin-inline:-8px;padding-inline:8px;border-radius:8px}
.lb .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb .sub{font-size:12px;color:var(--muted)}
.lb .val{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.clist button{appearance:none;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 0;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.clist button:last-child{border-bottom:0}
.badge{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--warn-bg);color:var(--warn);font-weight:500;white-space:nowrap}
.badge.done{background:var(--ok-bg);color:var(--ok)}
.marks{display:flex;gap:4px;flex-wrap:wrap}
.marks span{font-family:var(--mono);font-size:12px;padding:1px 6px;border-radius:4px}
.marks .ok{background:var(--ok-bg);color:var(--ok)} .marks .bad{background:var(--bad-bg);color:var(--bad)}
input[type=text]{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0}
.field{display:flex;flex-direction:column;gap:6px}
@media (prefers-reduced-motion:no-preference){.opt,.btn,.pick{transition:border-color .15s,background .15s}}
</style>

<script>
// Standalone (GitHub Pages) only: Google sign-in + Firestore, exposed through the same
// claude.use("db"/"user") interface the app uses inside claude.ai.
(function(){
  if(!window.firebase)return;
  try{
    firebase.initializeApp({
      apiKey:"AIzaSyBjmMwS5hX2orDzlTScL39WqTwaGH2C4Kk",
      authDomain:"usmle-daily.firebaseapp.com",
      projectId:"usmle-daily",
      storageBucket:"usmle-daily.firebasestorage.app",
      messagingSenderId:"1008079184207",
      appId:"1:1008079184207:web:f74b6e53ddaa388fb3e53a"
    });
  }catch(e){console.warn("firebase init failed",e);return}
  const auth=firebase.auth(), fs=firebase.firestore();

  let first=true, resolveReady;
  const ready=new Promise(r=>{resolveReady=r});
  const A=window.__auth={user:null,error:"",
    async signIn(){
      A.error="";
      const p=new firebase.auth.GoogleAuthProvider();
      try{await auth.signInWithPopup(p)}
      catch(e){
        if(e&&(e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment")){await auth.signInWithRedirect(p);return}
        if(e&&e.code==="auth/popup-closed-by-user")return;
        A.error=e&&e.code==="auth/unauthorized-domain"?"이 주소가 Firebase 승인된 도메인에 없어요.":"로그인에 실패했어요. 다시 시도해 주세요.";
        if(window.render)window.render();
      }
    },
    signOut(){auth.signOut()}
  };
  auth.onAuthStateChanged(u=>{
    if(!first){location.reload();return}
    first=false;
    A.user=u?{uid:u.uid,name:u.displayName||""}:null;
    window.__fbName=u&&u.displayName?u.displayName.split(" ")[0]:"";
    resolveReady(u);
  });

  // data/users/<uid>/... (claude.ai layout) -> users/<uid>/data/... (Firestore rules layout)
  const mapPath=p=>p.replace(/^data\/users\/([^/]+)\//,"users/$1/data/");
  const convE=e=>({code:e&&e.code==="permission-denied"?"invalid_argument":e&&e.code==="resource-exhausted"?"quota_exceeded":"unavailable",message:String((e&&e.message)||e)});
  const rethrow=e=>{throw convE(e)};
  const wDoc=s=>({id:s.id,exists:s.exists,data:()=>s.data(),metadata:s.metadata});
  const wQuery=q=>({docs:q.docs.map(wDoc),size:q.size,empty:q.empty,docChanges:()=>[],metadata:q.metadata});
  function docRef(r){return{id:r.id,path:r.path,
    get:()=>r.get().then(wDoc,rethrow),set:d=>r.set(d).catch(rethrow),update:d=>r.update(d).catch(rethrow),delete:()=>r.delete().catch(rethrow),
    onSnapshot:(n,e)=>r.onSnapshot(s=>n(wDoc(s)),x=>e&&e(convE(x))),collection:c=>collRef(r.collection(c))}}
  function queryRef(q){return{
    where:(f,o,v)=>queryRef(q.where(f,o,v)),orderBy:(f,d)=>queryRef(q.orderBy(f,d||"asc")),limit:n=>queryRef(q.limit(n)),
    get:()=>q.get().then(wQuery,rethrow),onSnapshot:(n,e)=>q.onSnapshot(s=>n(wQuery(s)),x=>e&&e(convE(x)))}}
  function collRef(c){const b=queryRef(c);b.path=c.path;b.doc=id=>docRef(id?c.doc(id):c.doc());b.add=d=>c.add(d).then(docRef,rethrow);return b}
  const dbApi={doc:p=>docRef(fs.doc(mapPath(p))),collection:p=>collRef(fs.collection(mapPath(p)))};

  window.claude={use:async name=>{
    const u=await ready;
    if(!u)return null;
    if(name==="db")return dbApi;
    if(name==="user")return{
      id:async()=>u.uid,can:async()=>true,isOwner:async()=>false,canEdit:async()=>false,
      me:async()=>({id:u.uid,name:u.displayName||""}),
      profiles:async ids=>Object.fromEntries([].concat(ids).map(i=>[i,{id:i,name:i===u.uid?(u.displayName||""):"",isMe:i===u.uid}]))
    };
    return null;
  }};
})();
</script>

<script>
// ---------- Content ----------
const BANK=[{"id":"bs01","steps":["1"],"system":"Biostatistics & Ethics","discipline":"Biostatistics","topic":"Negative predictive value","stem":"A rapid test for a respiratory virus is evaluated in 500 patients. Of 100 patients who have the infection, 80 test positive. Of 400 patients without the infection, 360 test negative.\n\nWhat is the negative predictive value of this test?","options":["67%","72%","80%","90%","95%"],"answer":4,"explanation":"Build the 2×2 table: true positives 80, false negatives 20, true negatives 360, false positives 40. Negative predictive value = TN / (TN + FN) = 360 / (360 + 20) = 360/380 ≈ 95%. Sensitivity is 80/100 = 80%, specificity is 360/400 = 90%, and positive predictive value is 80/120 ≈ 67%. NPV rises as prevalence falls.","ko":"NPV = TN/(TN+FN). 2×2 표: 행 = 검사결과, 열 = 질병 유무."},{"id":"bs02","steps":["1"],"system":"Biostatistics & Ethics","discipline":"Biostatistics","topic":"Number needed to treat","stem":"In a randomized trial, 20% of patients in the placebo group and 15% of patients in the treatment group have a stroke within 5 years.\n\nHow many patients must be treated for 5 years to prevent one stroke?","options":["5","15","20","25","33"],"answer":2,"explanation":"Absolute risk reduction = control event rate − treatment event rate = 20% − 15% = 5% (0.05). Number needed to treat = 1 / ARR = 1/0.05 = 20. Relative risk reduction = ARR / control rate = 0.05/0.20 = 25%. The number needed to harm is 1 / attributable risk of an adverse effect.","ko":"NNT = 1/ARR. ARR = 대조군 위험 − 치료군 위험. RRR = ARR/대조군 위험."},{"id":"bs03","steps":["1"],"system":"Biostatistics & Ethics","discipline":"Biostatistics","topic":"Relative risk","stem":"A cohort of 2,000 workers is followed for 10 years. Of 500 workers exposed to a solvent, 50 develop leukemia. Of 1,500 unexposed workers, 30 develop leukemia.\n\nWhat is the relative risk of leukemia associated with the solvent?","options":["0.2","1.67","2.5","5","10"],"answer":3,"explanation":"Relative risk = incidence in the exposed / incidence in the unexposed = (50/500) / (30/1,500) = 0.10 / 0.02 = 5. Relative risk is calculated in cohort studies, which follow exposed and unexposed groups forward. Attributable risk = 0.10 − 0.02 = 0.08, meaning 8 cases per 100 exposed workers are due to the solvent.","ko":"RR = 노출군 발생률 / 비노출군 발생률 (코호트 연구)."},{"id":"bs04","steps":["1"],"system":"Biostatistics & Ethics","discipline":"Biostatistics","topic":"Odds ratio","stem":"In a case-control study of a rare cancer, 60 of 100 patients with the cancer report using a certain herbal supplement, compared with 30 of 100 controls without the cancer.\n\nWhat is the odds ratio for the association between the supplement and the cancer?","options":["0.29","1.5","2.0","3.5","6.0"],"answer":3,"explanation":"Odds ratio = (a × d) / (b × c), where a = exposed cases (60), b = exposed controls (30), c = unexposed cases (40), d = unexposed controls (70). OR = (60 × 70) / (30 × 40) = 4,200 / 1,200 = 3.5. Case-control studies start with outcome status and look back at exposure, so they report odds ratios. For rare diseases, the odds ratio approximates the relative risk.","ko":"OR = ad/bc (환자-대조군 연구). 희귀질환에서 OR ≈ RR."},{"id":"bs05","steps":["1"],"system":"Biostatistics & Ethics","discipline":"Biostatistics","topic":"Choosing a study design","stem":"Investigators want to determine whether childhood exposure to a pesticide is associated with a rare form of brain cancer that affects about 1 in 100,000 people.\n\nWhich of the following study designs is most practical?","options":["Crossover trial","Case-control study","Prospective cohort study","Randomized controlled trial","Cross-sectional survey"],"answer":1,"explanation":"A case-control study starts with people who have the disease and compares their past exposures with those of matched controls. It is efficient for rare diseases and diseases with long latency because it does not require following huge numbers of people. A prospective cohort study would need to follow an enormous population to observe enough cases. Randomizing children to a harmful exposure would be unethical. A cross-sectional study measures exposure and disease at one point and gives prevalence.","ko":"희귀질환 위험요인 = 환자-대조군 연구. 희귀 노출 = 코호트 연구."},{"id":"bs06","steps":["1"],"system":"Biostatistics & Ethics","discipline":"Biostatistics","topic":"Lead-time bias","stem":"A new screening program detects lung cancer an average of 2 years earlier than diagnosis based on symptoms. Patients diagnosed by screening survive an average of 2 years longer after diagnosis, but the age at death is the same in both groups.\n\nWhich of the following best explains this finding?","options":["Observer bias","Lead-time bias","Selection bias","Length-time bias","Recall bias"],"answer":1,"explanation":"Lead-time bias occurs when earlier detection makes survival from the time of diagnosis appear longer, even though the course of the disease and the time of death are unchanged. Using mortality rates instead of survival time from diagnosis avoids it. Length-time bias occurs because screening preferentially detects slowly progressive disease with a better prognosis.","ko":"Lead-time bias: 조기 발견으로 진단 후 생존기간만 늘어 보임. 사망률로 평가."},{"id":"bs07","steps":["1"],"system":"Biostatistics & Ethics","discipline":"Biostatistics","topic":"Confounding","stem":"A study finds that people who carry lighters have a much higher rate of lung cancer than people who do not. After the data are stratified by smoking status, the association between carrying lighters and lung cancer disappears.\n\nWhich of the following best explains the original association?","options":["Recall bias","Measurement bias","Confounding","Lead-time bias","Effect modification"],"answer":2,"explanation":"A confounder is a third variable associated with both the exposure and the outcome that distorts their apparent relationship. Here smoking is associated with carrying lighters and causes lung cancer. Confounding is reduced by randomization, matching, stratification, and multivariable analysis; stratifying by the confounder makes the false association disappear. In effect modification, the effect of the exposure truly differs between strata of a third variable.","ko":"교란: 제3변수가 노출·결과 모두와 관련. 층화하면 연관성 사라짐. 효과수정은 층별로 다름."},{"id":"bs08","steps":["1"],"system":"Biostatistics & Ethics","discipline":"Biostatistics","topic":"Type I error","stem":"A trial concludes that a new drug lowers mortality compared with placebo (p = 0.03). A later, much larger trial shows that the drug has no effect on mortality.\n\nThe first trial most likely made which of the following errors?","options":["Selection bias","Type II error","Low statistical power","Confounding by indication","Type I error"],"answer":4,"explanation":"A type I error (α) is rejecting a null hypothesis that is actually true, concluding there is an effect when there is none (a false positive). Alpha is usually set at 0.05. A type II error (β) is failing to reject a false null hypothesis, missing a real effect (a false negative). Power (1 − β) increases with sample size, effect size, and a higher α.","ko":"1종 오류(α) = 효과 없는데 있다고 결론(위양성). 2종 오류(β) = 효과를 놓침."},{"id":"bs09","steps":["1"],"system":"Biostatistics & Ethics","discipline":"Biostatistics","topic":"Statistical power","stem":"A pilot trial of 40 patients finds no statistically significant difference in blood pressure between a new drug and placebo, although the drug group's mean was lower. The investigators plan a second trial.\n\nWhich change would most increase the power of the next trial?","options":["Studying a lower dose of the drug","Using a two-tailed instead of a one-tailed test","Lowering α from 0.05 to 0.01","Using a less precise blood pressure measurement","Increasing the sample size"],"answer":4,"explanation":"Power is the probability of detecting a real effect (1 − β). It increases with larger sample size, larger effect size, less variability (more precise measurements), and a higher α. Lowering α, using noisier measurements, and reducing the expected effect all lower power. A small sample is the most common cause of a type II error.","ko":"검정력↑: 표본 크기↑, 효과 크기↑, 변동성↓, α↑."},{"id":"bs10","steps":["1"],"system":"Biostatistics & Ethics","discipline":"Biostatistics","topic":"Confidence intervals","stem":"A cohort study reports that the relative risk of colon cancer in people who eat red meat daily is 1.30, with a 95% confidence interval of 0.92 to 1.84.\n\nWhich of the following is the most appropriate interpretation?","options":["Daily red meat consumption increases colon cancer risk by 30% with significance","The study proves no association exists","The p-value is less than 0.05","The association is not statistically significant at the 0.05 level","The confidence interval is invalid because it is not symmetric"],"answer":3,"explanation":"For ratios such as relative risk and odds ratio, the null value is 1. If the 95% confidence interval includes 1, the result is not statistically significant at p \u003c 0.05. Lack of significance does not prove there is no association; the study may lack power. For differences between means, the null value is 0. Intervals for ratios are often asymmetric because they are calculated on a log scale.","ko":"RR·OR의 95% CI가 1을 포함하면 유의하지 않음 (평균차는 0)."},{"id":"bs11","steps":["1"],"system":"Biostatistics & Ethics","discipline":"Biostatistics","topic":"Prevalence and duration","stem":"A new drug for a chronic, incurable disease prolongs survival but does not cure anyone. The incidence of the disease does not change after the drug is introduced.\n\nWhat happens to the prevalence of the disease?","options":["It first increases, then returns to baseline immediately","It increases","It stays the same","It cannot change unless incidence changes","It decreases"],"answer":1,"explanation":"In a steady state, prevalence ≈ incidence × average duration of disease. A treatment that prolongs survival without curing increases the duration of the disease, so prevalence rises even though incidence is unchanged. Treatments that cure the disease or diseases that cause rapid death lower prevalence. Incidence counts new cases, and prevalence counts all existing cases.","ko":"유병률 ≈ 발생률 × 유병기간. 생존 연장(완치 X) 치료 → 유병률↑."},{"id":"bs12","steps":["1"],"system":"Biostatistics & Ethics","discipline":"Biostatistics","topic":"Changing a test cutoff","stem":"A laboratory lowers the cutoff value of serum troponin used to diagnose myocardial infarction, so that smaller elevations are considered positive.\n\nWhich of the following changes is most likely?","options":["Sensitivity decreases and specificity increases","Positive predictive value increases","Both sensitivity and specificity increase","Sensitivity increases and specificity decreases","Number of false negatives increases"],"answer":3,"explanation":"Lowering the cutoff for a test where high values indicate disease classifies more people as positive. More true cases are detected (fewer false negatives, higher sensitivity), but more people without disease are also called positive (more false positives, lower specificity and lower PPV), while NPV increases. A highly sensitive test is good for ruling out disease (SnNout), and a highly specific test is good for ruling it in (SpPin).","ko":"양성 기준(cutoff)↓ → 민감도↑ 특이도↓, 위음성↓ 위양성↑, NPV↑ PPV↓."},{"id":"bs13","steps":["1"],"system":"Biostatistics & Ethics","discipline":"Biostatistics","topic":"Normal distribution","stem":"In a large population, serum sodium levels are normally distributed with a mean of 140 mEq/L and a standard deviation of 2 mEq/L.\n\nApproximately what percentage of the population has a sodium level above 144 mEq/L?","options":["0.15%","2.5%","5%","16%","32%"],"answer":1,"explanation":"In a normal distribution, about 68% of values fall within 1 SD of the mean, 95% within 2 SD, and 99.7% within 3 SD. A value of 144 is 2 SD above the mean, so about 5% of values lie beyond 2 SD in both tails, and half of those, 2.5%, lie above 144. About 16% lie above 1 SD (142).","ko":"정규분포: ±1SD 68%, ±2SD 95%, ±3SD 99.7%. +2SD 초과 = 2.5%."},{"id":"bs14","steps":["1"],"system":"Biostatistics & Ethics","discipline":"Biostatistics","topic":"Intention-to-treat analysis","stem":"In a randomized trial comparing surgery with medical therapy, 15% of patients assigned to surgery decline the operation and receive medical therapy instead. The investigators analyze all patients in the groups to which they were originally randomized.\n\nWhich of the following is the main advantage of this approach?","options":["It excludes patients who did not comply","It preserves the benefits of randomization and reduces bias","It allows the use of a smaller sample size","It maximizes the estimated effect of the treatment","It eliminates the need for blinding"],"answer":1,"explanation":"Intention-to-treat analysis keeps all participants in their assigned groups regardless of what treatment they actually received. It preserves the balance created by randomization, avoids selection bias from patients who drop out or cross over for reasons related to prognosis, and reflects real-world effectiveness. It tends to underestimate the treatment effect. As-treated and per-protocol analyses may overestimate effects because they break randomization.","ko":"ITT 분석: 배정군 그대로 분석 → 무작위화 유지, 선택 편향↓ (효과는 과소추정 경향)."},{"id":"bs15","steps":["1"],"system":"Biostatistics & Ethics","discipline":"Biostatistics","topic":"Clinical trial phases","stem":"A new drug for heart failure has been shown to be safe in a small number of healthy volunteers. Investigators now plan to give it to about 200 patients with heart failure to evaluate its efficacy and optimal dosing and to monitor adverse effects.\n\nWhich phase of clinical trials is this?","options":["Phase IV","Phase I","Phase III","Preclinical","Phase II"],"answer":4,"explanation":"Phase I tests safety, toxicity, and pharmacokinetics in a small number of healthy volunteers (or patients for toxic drugs). Phase II tests efficacy, dosing, and adverse effects in a modest number of patients with the disease. Phase III compares the drug with the current standard or placebo in a large randomized trial. Phase IV is postmarketing surveillance to detect rare or long-term adverse effects.","ko":"1상 안전성(건강인), 2상 유효성·용량(소수 환자), 3상 대규모 비교, 4상 시판 후."},{"id":"bs16","steps":["1"],"system":"Biostatistics & Ethics","discipline":"Biostatistics","topic":"Hawthorne effect","stem":"In a study of hand hygiene, nurses wash their hands much more often during the weeks when they know observers are recording their behavior on the ward, and less often afterward.\n\nWhich of the following best explains this pattern?","options":["Lead-time bias","Recall bias","Hawthorne effect","Pygmalion effect","Berkson bias"],"answer":2,"explanation":"The Hawthorne effect (observer effect) is a change in behavior because participants know they are being studied. It is reduced by blinding or not informing subjects of exactly what is being measured. The Pygmalion effect is when a researcher's belief in a treatment affects the results. Recall bias occurs when people with an outcome remember exposures differently, which is common in case-control studies. Berkson bias is selection bias from studying hospitalized patients.","ko":"Hawthorne 효과: 관찰받는다는 사실을 알아서 행동이 변함."},{"id":"bs17","steps":["1"],"system":"Biostatistics & Ethics","discipline":"Ethics","topic":"Decision-making capacity","stem":"A 78-year-old man with mild dementia is advised to have surgery for a bowel obstruction. He declines. He accurately describes his condition, explains that surgery could save his life and that without it he will likely die, and says that he has lived a full life and does not want more operations. His daughter insists that the surgery be done.\n\nWhich of the following is the most appropriate next step?","options":["Respect the patient's decision to decline surgery","Declare him incompetent because of his dementia","Obtain a court order for surgery","Delay the decision until a psychiatrist evaluates him in 2 weeks","Proceed with surgery based on the daughter's consent"],"answer":0,"explanation":"Decision-making capacity is specific to the decision and is assessed by the physician. A patient has capacity if he can communicate a choice, understand the relevant information, appreciate how it applies to him, and reason about the options in line with his values. A diagnosis of dementia does not by itself remove capacity. A patient with capacity may refuse even life-saving treatment, and family members cannot override that decision. Competence is a legal determination made by a court.","ko":"의사결정능력: 선택 표현·이해·인식·추론 → 있으면 생명구제 치료 거부도 존중. 가족이 대신 결정 불가."},{"id":"bs18","steps":["1"],"system":"Biostatistics & Ethics","discipline":"Ethics","topic":"Minor of Jehovah's Witness parents","stem":"An 8-year-old girl is brought to the emergency department after a car crash with a ruptured spleen and a hemoglobin of 5.8 g/dL. She is hypotensive and needs an immediate blood transfusion. Her parents, who are Jehovah's Witnesses, refuse to allow a transfusion.\n\nWhich of the following is the most appropriate next step?","options":["Transfer her to another hospital","Transfuse the blood needed to save her life","Respect the parents' refusal and give only crystalloid","Wait for a court order before any transfusion","Ask the child whether she wants a transfusion and follow her answer"],"answer":1,"explanation":"Parents may refuse treatment for their children, but not treatment that is necessary to prevent death or serious harm. In an emergency, the physician should provide life-saving treatment such as a transfusion, and courts can be involved afterward or when time allows for nonemergency care. An adult Jehovah's Witness with decision-making capacity may refuse transfusion for themselves, even if it leads to death.","ko":"미성년자 응급 생명구조 치료는 부모 거부와 무관하게 시행. 성인 환자는 거부 가능."},{"id":"bs19","steps":["1"],"system":"Biostatistics & Ethics","discipline":"Ethics","topic":"Duty to warn","stem":"During a therapy session, a 32-year-old man tells his psychiatrist that he plans to kill his former business partner this weekend with a gun he has bought, and he names the partner. He refuses voluntary admission.\n\nWhich of the following is the most appropriate action?","options":["Document the statement and discuss it at the next session","Discharge the patient from care","Maintain confidentiality because the information came from a therapy session","Ask the patient for permission to inform the partner","Take steps to protect the identified person, including warning them and notifying police"],"answer":4,"explanation":"Confidentiality is a core duty, but it has exceptions when there is a serious threat to others. Under the Tarasoff principle, when a patient makes a credible threat of serious harm against an identifiable person, the clinician has a duty to protect that person, which can include warning them, notifying police, and seeking involuntary hospitalization. Other exceptions include reportable infectious diseases, suspected child or elder abuse, gunshot wounds in some jurisdictions, and patients who are unsafe to drive.","ko":"Tarasoff: 특정인에 대한 신뢰할 만한 위협 → 보호 의무(당사자 경고·경찰 통보). 비밀유지 예외."},{"id":"bs20","steps":["1"],"system":"Biostatistics & Ethics","discipline":"Ethics","topic":"Disclosing a medical error","stem":"A resident realizes that a patient received a double dose of enoxaparin last night because of an order entry error. The patient has a small bruise but no other harm. The resident's attending says it is not necessary to mention the error because there was no lasting harm.\n\nWhich of the following is the most appropriate action?","options":["Report the attending to the state medical board immediately","Change the medical record to show the correct dose","Do not tell the patient because no significant harm occurred","Disclose the error to the patient, apologize, and report it through the hospital's safety system","Tell the patient only if the patient asks about the bruise"],"answer":3,"explanation":"Physicians should disclose medical errors to patients honestly, even when no harm results, explaining what happened, apologizing, and describing the steps being taken to prevent recurrence. Errors are also reported through the institution's patient safety system so that systems can be improved. Medical records must never be altered. The disagreement with the attending should be addressed directly first, but it does not change the obligation to disclose.","ko":"의료 오류: 해가 없어도 환자에게 공개·사과 + 안전보고 시스템 보고. 기록 수정 금지."},{"id":"bs21","steps":["1"],"system":"Biostatistics & Ethics","discipline":"Ethics","topic":"Professional interpreter","stem":"A 60-year-old woman who speaks only Vietnamese comes to the clinic with her 14-year-old grandson, who speaks English fluently. She needs to discuss a new diagnosis of breast cancer and treatment options.\n\nWhich of the following is the most appropriate way to communicate with her?","options":["Use an online translation app for the conversation","Postpone the discussion until an adult family member can interpret","Have the grandson interpret because he is fluent","Use a professional medical interpreter, in person or by phone or video","Communicate with gestures and written English materials"],"answer":3,"explanation":"Patients with limited English proficiency should be offered a trained medical interpreter. Family members, especially children, should not interpret because of risks of errors, omissions, filtering of bad news, emotional burden, and breach of privacy. A professional interpreter can be used in person, by phone, or by video, and is especially important for discussing serious diagnoses and obtaining informed consent.","ko":"언어 장벽: 전문 의료통역사 사용. 가족(특히 아이)은 통역으로 쓰지 않음."},{"id":"bs22","steps":["1"],"system":"Biostatistics & Ethics","discipline":"Ethics","topic":"Surrogate decision-making","stem":"A 74-year-old man has a massive stroke and is unresponsive. He has no advance directive and no healthcare proxy. He is divorced and has two adult sons and a sister who lives with him. A decision must be made about placement of a feeding tube.\n\nWho should be the primary surrogate decision-maker?","options":["The attending physician","His sister, because she lives with him","His two adult sons together","A hospital ethics committee","His former wife"],"answer":2,"explanation":"When a patient lacks capacity, decisions follow an advance directive or a designated healthcare proxy if one exists. Without these, most states use a hierarchy of surrogates: spouse, then adult children, then parents, then adult siblings, then other relatives. Surrogates should use substituted judgment, deciding as the patient would have wanted, rather than their own preferences. Ethics committees help when surrogates disagree.","ko":"대리결정자 순서: 사전지시/대리인 → 배우자 → 성인 자녀 → 부모 → 형제자매. 대리판단 원칙."},{"id":"bs23","steps":["1"],"system":"Biostatistics & Ethics","discipline":"Ethics","topic":"Elder abuse","stem":"An 82-year-old woman with dementia is brought in by her son for a fall. She has bruises of different ages on her upper arms in a fingertip pattern, poor hygiene, and weight loss. When asked about the bruises, the son answers for her and becomes angry.\n\nWhich of the following is the most appropriate next step?","options":["Accept the son's explanation and discharge the patient","Interview the patient alone and report suspected abuse to adult protective services","Ask the son for permission to report","Confront the son and tell him to stop","Discuss the case only with the patient's primary care physician"],"answer":1,"explanation":"Suspected elder abuse should be investigated by interviewing the patient alone when possible and documenting findings carefully. Physicians are required to report suspected abuse of older adults to adult protective services in most states; this does not require proof or the patient's or caregiver's consent. Warning signs include unexplained injuries, bruises in various stages of healing, poor hygiene, malnutrition, and caregivers who answer for the patient.","ko":"노인 학대 의심: 환자 단독 면담 + 성인보호기관 신고 (증거·동의 불필요)."},{"id":"bs24","steps":["1"],"system":"Biostatistics & Ethics","discipline":"Ethics","topic":"Gifts from industry","stem":"A pharmaceutical representative offers a family physician tickets to a professional basketball game and dinner if she attends a talk about a new medication.\n\nWhich of the following is the most appropriate response?","options":["Decline the tickets and dinner","Accept only the dinner because it is educational","Accept the tickets and donate them to her staff","Accept and disclose the gift to her patients","Accept the tickets because she is not obligated to prescribe the drug"],"answer":0,"explanation":"Physicians should avoid gifts from industry that are not primarily for patient benefit or education, because they create conflicts of interest and influence prescribing even when physicians believe they are unaffected. Entertainment such as sports tickets is not acceptable. Modest educational materials or meals at legitimate educational events may be acceptable within institutional policies. Small gifts from patients, such as homemade food, can usually be accepted.","ko":"제약사 오락성 선물(티켓 등)은 거절 — 이해충돌. 환자의 소소한 선물은 대체로 수용 가능."},{"id":"bs25","steps":["1"],"system":"Biostatistics & Ethics","discipline":"Ethics","topic":"Informed consent exceptions","stem":"A 35-year-old man is brought to the emergency department unconscious after a motorcycle crash. He has an epidural hematoma with signs of herniation and needs emergency surgery. No family can be reached, and he has no advance directive in his records.\n\nWhich of the following is the most appropriate action?","options":["Proceed with emergency surgery under implied consent","Have two physicians sign consent on his behalf as surrogates","Obtain a court order before surgery","Treat medically until he can consent","Wait until a family member can be contacted"],"answer":0,"explanation":"Informed consent requires disclosure of the diagnosis, the proposed treatment, its risks and benefits, alternatives (including no treatment), and the patient's voluntary agreement with capacity. Exceptions include emergencies in which delay would cause serious harm and no surrogate is available (implied consent), patients who waive their right to information, and therapeutic privilege, which is rarely justified. Emergency treatment should not be delayed to locate family.","ko":"동의 예외: 응급(대리인 없음, 지연 시 중대한 해) → 묵시적 동의로 시행."},{"id":"bs26","steps":["1"],"system":"Biostatistics & Ethics","discipline":"Biostatistics","topic":"Attributable risk percent","stem":"The incidence of lung cancer is 2.0 per 1,000 per year among smokers and 0.2 per 1,000 per year among nonsmokers.\n\nWhat percentage of lung cancers among smokers is attributable to smoking?","options":["10%","50%","90%","99%","180%"],"answer":2,"explanation":"Attributable risk = incidence in exposed − incidence in unexposed = 2.0 − 0.2 = 1.8 per 1,000 per year. Attributable risk percent = AR / incidence in exposed = 1.8/2.0 = 90%, which can also be calculated as (RR − 1)/RR = (10 − 1)/10 = 90%. This is the proportion of disease among the exposed that would be prevented by removing the exposure.","ko":"기여위험% = (RR−1)/RR = (노출군 − 비노출군)/노출군."},{"id":"bs27","steps":["1"],"system":"Biostatistics & Ethics","discipline":"Biostatistics","topic":"Selection bias in hospital controls","stem":"In a case-control study of coffee and pancreatic cancer, cases are hospitalized patients with pancreatic cancer and controls are hospitalized patients on the gastroenterology service, many of whom had been advised to stop drinking coffee because of their GI conditions. The study finds a strong association between coffee and pancreatic cancer.\n\nWhich of the following most likely distorted these results?","options":["Length-time bias","Lead-time bias","Hawthorne effect","Effect modification","Selection bias in the choice of controls"],"answer":4,"explanation":"Selection bias occurs when the study groups do not represent the population of interest. Here the hospitalized controls drank less coffee than the general population because of their GI illnesses, which exaggerated the apparent association. Choosing controls from the same population as cases, or using several control groups, reduces this. Berkson bias is a type of selection bias that results from using hospitalized patients.","ko":"선택 편향: 대조군이 모집단을 대표하지 않음 (입원환자 대조군 = Berkson 편향)."},{"id":"bs28","steps":["1"],"system":"Biostatistics & Ethics","discipline":"Biostatistics","topic":"Likelihood ratio","stem":"A test for deep vein thrombosis has a sensitivity of 90% and a specificity of 90%.\n\nWhat is the positive likelihood ratio of this test?","options":["0.11","1","9","10","81"],"answer":2,"explanation":"The positive likelihood ratio = sensitivity / (1 − specificity) = 0.90 / 0.10 = 9. It tells how much a positive result increases the odds of disease. The negative likelihood ratio = (1 − sensitivity) / specificity = 0.10 / 0.90 ≈ 0.11. Likelihood ratios do not depend on prevalence. Post-test odds equal pretest odds times the likelihood ratio; LR+ above 10 or LR− below 0.1 strongly changes the probability.","ko":"LR+ = 민감도/(1−특이도), LR− = (1−민감도)/특이도. 사후 오즈 = 사전 오즈 × LR."},{"id":"bs29","steps":["1"],"system":"Biostatistics & Ethics","discipline":"Biostatistics","topic":"Precision vs accuracy","stem":"A new home blood pressure monitor gives readings of 151, 150, 152, and 151 mm Hg for a patient whose true intra-arterial systolic pressure is 130 mm Hg during all measurements.\n\nWhich of the following best describes this device?","options":["Low precision, low accuracy","High accuracy, low precision","High precision, high accuracy","High precision, low accuracy","High validity, high reliability"],"answer":3,"explanation":"Precision (reliability) is the consistency of repeated measurements and is reduced by random error. Accuracy (validity) is how close measurements are to the true value and is reduced by systematic error (bias). These readings are consistent but all about 20 mm Hg too high, so the device is precise but inaccurate, which indicates systematic error that calibration could fix. Increasing precision narrows the standard deviation and confidence intervals.","ko":"정밀도(신뢰도) = 반복 일관성(무작위 오차). 정확도(타당도) = 참값 근접(계통 오차)."},{"id":"bs30","steps":["1"],"system":"Biostatistics & Ethics","discipline":"Biostatistics","topic":"Choosing a statistical test","stem":"Researchers compare the mean LDL cholesterol levels among three groups of patients taking three different statins.\n\nWhich statistical test is most appropriate?","options":["Pearson correlation","Analysis of variance (ANOVA)","Two-sample t-test","Fisher exact test","Chi-square test"],"answer":1,"explanation":"A t-test compares means of two groups (paired if the same subjects are measured twice). ANOVA compares means of three or more groups. A chi-square test compares proportions of categorical variables, and the Fisher exact test is used for small samples. Pearson correlation measures the linear relationship between two continuous variables.","ko":"평균 2군 = t검정, 3군 이상 = ANOVA, 범주형 비율 = 카이제곱(소표본 Fisher)."},{"id":"bs31","steps":["1"],"system":"Biostatistics & Ethics","discipline":"Biostatistics","topic":"Correlation coefficient","stem":"In a study of adults, the correlation coefficient between daily sodium intake and systolic blood pressure is r = 0.6.\n\nWhich of the following is the best interpretation?","options":["The relationship is negative","High sodium intake causes 60% of hypertension","About 36% of the variation in systolic pressure is explained by sodium intake","Sodium intake explains 60% of the variation in blood pressure","60% of people with high sodium intake have hypertension"],"answer":2,"explanation":"The Pearson correlation coefficient (r) ranges from −1 to +1 and measures the strength and direction of a linear relationship. The coefficient of determination (r²) gives the proportion of variance in one variable explained by the other: 0.6² = 0.36, or 36%. Correlation does not establish causation.","ko":"r² = 설명되는 분산 비율 (r 0.6 → 36%). 상관 ≠ 인과."},{"id":"bs32","steps":["1"],"system":"Biostatistics & Ethics","discipline":"Biostatistics","topic":"Levels of prevention","stem":"A 50-year-old woman has a screening colonoscopy, and a small adenomatous polyp is removed before it becomes cancerous.\n\nWhich level of prevention does this represent?","options":["Primordial prevention","Secondary prevention","Quaternary prevention","Primary prevention","Tertiary prevention"],"answer":1,"explanation":"Primary prevention stops disease from occurring (vaccination, smoking cessation). Secondary prevention detects disease early, before symptoms, to limit its effects (screening such as colonoscopy, mammography, and Pap smears). Tertiary prevention reduces complications of established disease (cardiac rehabilitation, diabetic foot care). Quaternary prevention protects patients from unnecessary medical interventions.","ko":"1차 = 발생 예방(백신), 2차 = 조기 발견(선별검사), 3차 = 합병증 감소(재활)."},{"id":"bs33","steps":["1"],"system":"Biostatistics & Ethics","discipline":"Biostatistics","topic":"Incidence calculation","stem":"A town of 1,000 people is studied for a chronic disease. At the start of the year, 100 people already have it. During the year, 45 new cases are diagnosed.\n\nWhat is the incidence of the disease for that year?","options":["4.5%","5%","10%","14.5%","45%"],"answer":1,"explanation":"Incidence is the number of new cases divided by the population at risk during that period. People who already have the disease are not at risk, so the denominator is 1,000 − 100 = 900. Incidence = 45/900 = 5%. Prevalence at the end of the year would be (100 + 45)/1,000 = 14.5%, if no one died or recovered.","ko":"발생률 = 신환 / 위험 인구(기존 환자 제외). 유병률 = 전체 환자 / 전체 인구."},{"id":"bs34","steps":["1"],"system":"Biostatistics & Ethics","discipline":"Biostatistics","topic":"Recall bias","stem":"In a case-control study, mothers of children born with birth defects and mothers of healthy children are asked to recall all medications they took during pregnancy. Mothers of affected children report more medication use.\n\nWhich bias is the main concern in this study?","options":["Length-time bias","Hawthorne effect","Lead-time bias","Attrition bias","Recall bias"],"answer":4,"explanation":"Recall bias occurs when people with an outcome remember and report past exposures differently from those without it, typically in case-control studies. Mothers of affected children may search their memories more thoroughly. It is reduced by using objective records (such as pharmacy records) collected before the outcome. Attrition bias occurs when participants drop out unevenly in prospective studies.","ko":"회상 편향: 환자군이 노출을 더 잘 기억(환자-대조군 연구) → 객관적 기록 사용."},{"id":"bs35","steps":["1"],"system":"Biostatistics & Ethics","discipline":"Biostatistics","topic":"Observer bias and blinding","stem":"In a trial of a new drug for psoriasis, the dermatologists who rate the severity of skin lesions know which patients are receiving the drug. They rate more improvement in the treatment group.\n\nWhich method best reduces this source of bias?","options":["Increasing the sample size","Matching patients by age","Using a crossover design","Using intention-to-treat analysis","Blinding the assessors to treatment assignment"],"answer":4,"explanation":"Observer (measurement) bias occurs when knowledge of the exposure or treatment influences how outcomes are measured. Blinding patients and assessors (double-blind) reduces it, as do objective outcome measures. Increasing sample size reduces random error but not bias. Randomization reduces selection bias and confounding.","ko":"관찰자 편향 → 맹검(평가자 눈가림). 표본 크기 증가는 편향을 줄이지 못함."},{"id":"bs36","steps":["1"],"system":"Biostatistics & Ethics","discipline":"Ethics","topic":"Emancipated minor","stem":"A 16-year-old girl who is married and lives with her husband comes to the clinic for evaluation of a breast lump and requests a biopsy. Her parents do not know about the visit.\n\nWhich of the following is the most appropriate action regarding consent for the biopsy?","options":["Obtain consent from her parents","Obtain a court order","Obtain consent from the patient herself","Wait until she turns 18","Obtain consent from her husband"],"answer":2,"explanation":"Minors generally need parental consent, but emancipated minors can consent to all their own care. Emancipation typically includes being married, serving in the military, being financially independent and living apart from parents, or being a parent. Separately, minors can consent without being emancipated to specific services such as contraception, STI care, prenatal care, and substance use treatment in most states.","ko":"해방된 미성년자(기혼·군복무·독립·부모) = 스스로 모든 의료 동의 가능."},{"id":"bs37","steps":["1"],"system":"Biostatistics & Ethics","discipline":"Ethics","topic":"Principle of double effect","stem":"A 78-year-old man with metastatic pancreatic cancer in hospice has severe pain despite current doses of morphine. His family worries that increasing the dose could hasten his death.\n\nWhich of the following is the most appropriate response?","options":["Stop opioids and use sedation alone","Refuse to adjust the dose without a court order","Keep the current dose to avoid any risk of hastening death","Increase the morphine dose as needed to relieve pain, because the intent is comfort","Switch to acetaminophen only"],"answer":3,"explanation":"Under the principle of double effect, an action with a good intended effect (relieving suffering) is ethically acceptable even if it has a foreseeable but unintended bad effect (possible hastening of death), as long as the bad effect is not the means of achieving the good one and the benefit is proportionate. Titrating opioids to relieve pain at the end of life is appropriate. In practice, carefully titrated opioids rarely shorten life. This differs from euthanasia, in which death is the intent.","ko":"이중효과 원칙: 통증 완화가 목적이면 사망을 앞당길 가능성이 있어도 opioid 증량 정당."},{"id":"bs38","steps":["1"],"system":"Biostatistics & Ethics","discipline":"Ethics","topic":"Requests for inappropriate treatment","stem":"A 30-year-old man has 3 days of nasal congestion, sore throat, and cough without fever. Examination is consistent with a viral upper respiratory infection. He insists on antibiotics because he has an important presentation next week.\n\nWhich of the following is the most appropriate response?","options":["Order a chest CT to reassure him","Prescribe antibiotics to maintain the relationship","Explain why antibiotics will not help, and recommend symptomatic treatment","Prescribe antibiotics but tell him not to take them","Refer him to another physician"],"answer":2,"explanation":"Physicians are not obligated to provide treatments that are not medically indicated or would cause harm. The appropriate approach is to acknowledge the patient's concerns, explain why antibiotics will not help a viral infection and can cause side effects and resistance, and offer effective symptomatic care. Respecting autonomy does not require providing any treatment a patient demands.","ko":"의학적으로 부적절한 요구(바이러스 감염 항생제)는 이유를 설명하고 거절, 대증치료 제안."},{"id":"bs39","steps":["1"],"system":"Biostatistics & Ethics","discipline":"Ethics","topic":"Impaired colleague","stem":"A surgical resident notices that an attending surgeon smells strongly of alcohol, has slurred speech, and is unsteady just before starting an operation.\n\nWhich of the following is the most appropriate action?","options":["Do nothing because the attending is senior","Prevent the attending from operating and notify the appropriate supervisor immediately","Report the attending to the state medical board next month","Assist in the surgery and monitor closely","Talk to the attending privately after the surgery"],"answer":1,"explanation":"Patient safety comes first. When a colleague appears impaired and about to care for patients, the physician must act immediately to prevent harm, such as stopping the procedure and notifying the chief of surgery or another supervisor. Physicians also have an obligation to report impaired colleagues through institutional channels and physician health programs, which aim to get them treatment.","ko":"동료 의사 음주·약물 의심 → 즉시 환자 진료 중단시키고 상급자에게 보고. 환자 안전 최우선."},{"id":"bs40","steps":["1"],"system":"Biostatistics & Ethics","discipline":"Ethics","topic":"Delivering bad news","stem":"A physician is about to tell a 55-year-old woman that her biopsy shows metastatic lung cancer. They are in a private room, and her husband is with her at her request.\n\nWhich of the following is the most appropriate first step in the conversation?","options":["Reassure her that everything will be fine","Describe the treatment options first","Immediately state the diagnosis and prognosis in detail","Ask what she understands about why the biopsy was done and her condition so far","Tell her husband first and let him decide what to tell her"],"answer":3,"explanation":"The SPIKES approach for breaking bad news includes Setting up (private space, support people), Perception (ask what the patient already understands), Invitation (ask how much information she wants), Knowledge (give a warning shot, then share the news clearly in plain language), Emotions (respond with empathy and allow silence), and Strategy and Summary (plan next steps). Information is not withheld from a capable patient at a family member's request unless the patient chooses this.","ko":"나쁜 소식 전달(SPIKES): 먼저 환자가 무엇을 알고 있는지 물어봄 → 원하는 정보량 확인 → 전달 → 공감."},{"id":"bs41","steps":["1"],"system":"Biostatistics & Ethics","discipline":"Ethics","topic":"Confidentiality with family","stem":"A 40-year-old man is hospitalized with a new diagnosis of HIV. His adult daughter calls the nurses' station and asks why her father is in the hospital. The patient has asked that his diagnosis not be shared with anyone in his family.\n\nWhich of the following is the most appropriate response?","options":["Tell her that information can be shared only with her father's permission","Tell her only that he has an infection","Tell her the diagnosis because she is next of kin","Transfer the call to the infectious disease consultant","Tell her the diagnosis because HIV is a reportable disease"],"answer":0,"explanation":"Patient information cannot be shared with family members without the patient's permission. HIV is reportable to the public health department (which handles partner notification), but this does not permit disclosure to family. The physician should encourage the patient to inform sexual partners and can use public health partner notification services. Breaking confidentiality is reserved for specific situations such as a serious threat to identifiable others.","ko":"가족이라도 환자 동의 없이 정보 공개 불가. 보고 대상 질환 = 보건당국 보고(가족 공개 아님)."},{"id":"bs42","steps":["1"],"system":"Biostatistics & Ethics","discipline":"Ethics","topic":"DNR scope","stem":"A 80-year-old woman with a do-not-resuscitate order is admitted with pneumonia and sepsis. A resident asks whether she should receive IV antibiotics and fluids, since she has a DNR order.\n\nWhich of the following is correct?","options":["She should not receive antibiotics, only fluids","She should receive antibiotics and fluids; a DNR order applies only to resuscitation after cardiac arrest","The DNR order must be reversed before any treatment","She should not be admitted to the hospital","She should receive comfort care only"],"answer":1,"explanation":"A do-not-resuscitate order means no CPR, defibrillation, or intubation for cardiopulmonary arrest. It does not mean withholding other treatment such as antibiotics, fluids, transfusions, or ICU care, unless the patient chooses to limit those as well. Goals of care should be discussed directly with the patient or surrogate rather than inferred from code status.","ko":"DNR = 심정지 시 CPR·삽관 안 함. 항생제·수액 등 다른 치료 보류 의미 아님."},{"id":"bs43","steps":["1"],"system":"Biostatistics & Ethics","discipline":"Biostatistics","topic":"Meta-analysis","stem":"Investigators pool the data from 12 small randomized trials, none of which alone showed a significant effect of a drug on mortality, and find a statistically significant 15% reduction in mortality.\n\nWhich of the following is the main limitation of this type of study?","options":["It cannot be used for randomized trials","It is limited by the quality and heterogeneity of the included studies and by publication bias","It always overestimates sample size","It cannot increase statistical power","It eliminates all bias in the original studies"],"answer":1,"explanation":"A meta-analysis combines results from multiple studies, increasing statistical power and precision, and sits near the top of the evidence hierarchy. Its conclusions depend on the quality and similarity of the included studies, and it is vulnerable to publication bias, because studies with negative results are less likely to be published. Funnel plots help detect publication bias.","ko":"메타분석: 검정력↑, 그러나 포함 연구의 질·이질성·출판 편향에 제한(깔때기 그림)."},{"id":"cb01","steps":["1"],"system":"General Principles","discipline":"Biochemistry","topic":"Menkes disease","stem":"A 3-month-old boy has seizures, hypotonia, and failure to thrive. His hair is sparse, brittle, and twisted. X-rays show wormian bones and metaphyseal spurs. Serum copper and ceruloplasmin are low.\n\nReduced activity of which of the following enzymes contributes to his connective tissue abnormalities?","options":["Elastase","Procollagen peptidase","Lysyl oxidase","Prolyl hydroxylase","Glycosyltransferase"],"answer":2,"explanation":"Menkes disease is an X-linked recessive defect in ATP7A, a copper transporter needed for intestinal copper absorption and delivery to enzymes. Lysyl oxidase, a copper-dependent enzyme that cross-links collagen and elastin, is impaired, causing brittle kinky hair, connective tissue abnormalities, and vascular tortuosity, along with neurodegeneration. Prolyl hydroxylase requires vitamin C, and procollagen peptidase defects cause some types of Ehlers-Danlos syndrome.","ko":"Menkes: ATP7A, 구리 흡수 장애 → lysyl oxidase↓, 꼬인 머리카락, 신경퇴행."},{"id":"cb02","steps":["1"],"system":"General Principles","discipline":"Anatomy","topic":"Primary ciliary dyskinesia","stem":"A 28-year-old man is evaluated for infertility. He has had chronic sinusitis and recurrent pneumonia since childhood. Chest x-ray shows bronchiectasis and a heart on the right side. Semen analysis shows a normal sperm count with immotile sperm.\n\nA defect in which of the following is most likely?","options":["CFTR chloride channel","Actin microfilaments","Dynein arms of microtubules","Kinesin motor proteins in neurons","Intermediate filaments"],"answer":2,"explanation":"Primary ciliary dyskinesia (Kartagener syndrome when situs inversus is present) is an autosomal recessive defect in the dynein arms of the 9+2 microtubule structure of cilia and flagella. Impaired mucociliary clearance causes sinusitis, otitis, and bronchiectasis; immotile sperm cause male infertility; and abnormal ciliary function during embryogenesis causes situs inversus in about half of patients. Nasal nitric oxide is low.","ko":"Kartagener: dynein arm 결함, 내장역위 + 기관지확장 + 부동 정자 불임."},{"id":"cb03","steps":["1"],"system":"General Principles","discipline":"Pathology","topic":"Intermediate filament stains","stem":"A 4-year-old boy has a rapidly growing mass in his orbit. Biopsy shows small round blue cells, some with eosinophilic cytoplasm and cross-striations. Immunohistochemistry is strongly positive for an intermediate filament and for myogenin.\n\nWhich intermediate filament was most likely detected?","options":["Lamin","Desmin","Neurofilament","Glial fibrillary acidic protein","Cytokeratin"],"answer":1,"explanation":"Rhabdomyosarcoma is the most common soft tissue sarcoma in children, often in the head and neck (including the orbit) and genitourinary tract. It is a skeletal muscle tumor positive for desmin and myogenin. Intermediate filament stains help identify tumor origin: vimentin (mesenchymal), desmin (muscle), cytokeratin (epithelial), GFAP (astrocytes), and neurofilaments (neurons). Lamins are nuclear envelope filaments.","ko":"중간섬유: desmin 근육, cytokeratin 상피, vimentin 중간엽, GFAP 신경교, neurofilament 뉴런."},{"id":"cb04","steps":["1"],"system":"General Principles","discipline":"Biochemistry","topic":"Rb and the cell cycle","stem":"A researcher studies cells that are stimulated by growth factors to enter the cell cycle. Cyclin D-CDK4 complexes phosphorylate a tumor suppressor protein, allowing the cell to pass from G1 into S phase.\n\nWhat happens when this tumor suppressor is phosphorylated?","options":["It triggers apoptosis by releasing cytochrome c","It binds and stabilizes p53","It induces p21, which inhibits CDKs","It is degraded by MDM2","It releases E2F transcription factors that activate S-phase genes"],"answer":4,"explanation":"In G1, hypophosphorylated Rb binds E2F and blocks transcription of genes needed for S phase. Cyclin D-CDK4/6 (and later cyclin E-CDK2) phosphorylate Rb, releasing E2F so the cell can enter S phase. p53 responds to DNA damage by inducing p21, a CDK inhibitor that keeps Rb unphosphorylated. Loss of Rb (retinoblastoma, osteosarcoma) or inactivation by HPV E7 removes this brake. CDK4/6 inhibitors such as palbociclib are used in breast cancer.","ko":"Cyclin D-CDK4 → Rb 인산화 → E2F 방출 → G1→S 진행. p53 → p21 → CDK 억제."},{"id":"cb05","steps":["1"],"system":"General Principles","discipline":"Immunology","topic":"Fas pathway defect","stem":"A 6-year-old boy has chronic, massive lymphadenopathy and splenomegaly without infection, along with autoimmune hemolytic anemia and thrombocytopenia. Flow cytometry shows an increase in T cells that are CD3+ but lack both CD4 and CD8.\n\nA defect in which process is most likely?","options":["Fas-mediated apoptosis of lymphocytes","Positive selection in the thymic cortex","Class switching in germinal centers","Complement-mediated cell lysis","Cytochrome c release from mitochondria"],"answer":0,"explanation":"Autoimmune lymphoproliferative syndrome is usually caused by mutations in Fas (CD95) or Fas ligand, components of the extrinsic apoptosis pathway. Fas-FasL binding activates caspase 8 to remove activated and self-reactive lymphocytes. Without it, lymphocytes accumulate, causing lymphadenopathy, splenomegaly, autoimmune cytopenias, increased double-negative T cells, and higher lymphoma risk. The intrinsic pathway involves BCL-2 family proteins and cytochrome c release.","ko":"ALPS = Fas/FasL 결함(외인성 세포자멸사), 림프절병증 + 자가면역 + CD4−CD8− T세포↑."},{"id":"cb06","steps":["1"],"system":"General Principles","discipline":"Pathology","topic":"Liquefactive necrosis in brain","stem":"A 70-year-old man dies 3 weeks after a large ischemic stroke in the territory of the left middle cerebral artery. At autopsy, the infarcted area is soft and partly cystic, with a cavity filled with macrophages.\n\nWhich type of necrosis is characteristic of infarcts in this organ?","options":["Fibrinoid necrosis","Coagulative necrosis","Liquefactive necrosis","Fat necrosis","Caseous necrosis"],"answer":2,"explanation":"Ischemic infarction of the brain causes liquefactive necrosis because the brain has abundant lysosomal enzymes and little connective tissue, so tissue is digested and replaced by a cystic cavity. Liquefactive necrosis also occurs in abscesses. Ischemic infarcts of other solid organs (heart, kidney, spleen) cause coagulative necrosis that preserves tissue architecture. Caseous necrosis occurs in tuberculosis and fungi, fat necrosis in pancreatitis and breast trauma, and fibrinoid necrosis in vasculitis and malignant hypertension.","ko":"뇌경색 = 액화괴사. 다른 고형장기 경색 = 응고괴사."},{"id":"cb07","steps":["1"],"system":"General Principles","discipline":"Pathology","topic":"Leukocyte extravasation","stem":"Neutrophils move from the blood into an area of bacterial infection in the skin. First they roll along the endothelium, then adhere firmly, then migrate between endothelial cells.\n\nWhich interaction mediates the firm adhesion step?","options":["C5a binding its receptor on neutrophils","IgG on bacteria binding Fc receptors","PECAM-1 on neutrophils binding PECAM-1 on endothelium","LFA-1 (CD18 integrin) on neutrophils binding ICAM-1 on endothelium","Sialyl Lewis X on neutrophils binding E-selectin"],"answer":3,"explanation":"Leukocyte extravasation has four steps. In margination and rolling, sialyl Lewis X on neutrophils binds E-selectin and P-selectin on endothelium. In tight binding, integrins such as LFA-1 (CD11a/CD18) bind ICAM-1, and defects cause leukocyte adhesion deficiency. In diapedesis, PECAM-1 mediates movement between endothelial cells. Then neutrophils migrate toward chemokines such as IL-8, C5a, LTB4, and bacterial products.","ko":"백혈구 혈관외유출: 구르기(selectin–sialyl Lewis X) → 단단한 부착(LFA-1/CD18–ICAM-1) → 통과(PECAM-1)."},{"id":"cb08","steps":["1"],"system":"General Principles","discipline":"Pathology","topic":"Collagen in wound healing","stem":"Six weeks after a surgical incision, a biopsy of the scar shows that one type of collagen, deposited early in granulation tissue, has been largely replaced by another type that gives the scar most of its tensile strength.\n\nWhich of the following best describes this change?","options":["Type III collagen is replaced by type I collagen","Type I collagen is replaced by type III collagen","Type II collagen is replaced by type I collagen","Type IV collagen is replaced by type II collagen","Type I collagen is replaced by elastin"],"answer":0,"explanation":"Granulation tissue initially contains type III collagen, which is flexible. During remodeling, matrix metalloproteinases (which require zinc) degrade it and fibroblasts replace it with stronger type I collagen; scar tensile strength reaches about 70 to 80% of normal by 3 months. Type II collagen is in cartilage and type IV in basement membranes. Keloids have excessive disorganized type I and III collagen.","ko":"상처 치유: 초기 3형 콜라겐 → 재형성 시 1형으로 교체 (MMP, 아연 필요)."},{"id":"cb09","steps":["1"],"system":"General Principles","discipline":"Pathology","topic":"AA amyloidosis","stem":"A 64-year-old woman with rheumatoid arthritis for 25 years develops nephrotic syndrome. A kidney biopsy shows amorphous pink deposits in the glomeruli that show apple-green birefringence under polarized light after Congo red staining.\n\nThe deposited protein is most likely derived from which of the following?","options":["Serum amyloid A, an acute-phase reactant","Transthyretin","β2-Microglobulin","Amyloid precursor protein","Immunoglobulin light chains"],"answer":0,"explanation":"Amyloid is misfolded protein in β-pleated sheets that shows apple-green birefringence with Congo red. AA amyloidosis follows chronic inflammation (rheumatoid arthritis, IBD, chronic infection, familial Mediterranean fever) and is derived from serum amyloid A, an acute-phase reactant; it often affects the kidneys. AL amyloidosis comes from immunoglobulin light chains in plasma cell disorders. Transthyretin causes senile cardiac and familial amyloidosis, and β2-microglobulin causes dialysis-related amyloidosis.","ko":"만성 염증(RA 등) → AA 아밀로이드(SAA). 형질세포 질환 → AL(경쇄). Congo red 사과녹색."},{"id":"cb10","steps":["1"],"system":"General Principles","discipline":"Pathology","topic":"Dystrophic calcification","stem":"A 78-year-old man with aortic stenosis has a calcified aortic valve. His serum calcium and phosphate levels are normal.\n\nWhich of the following best describes this type of calcification?","options":["Dystrophic calcification in damaged tissue with normal serum calcium","Ossification of the valve","Metastatic calcification caused by hypercalcemia","Calcification caused by vitamin D excess","Metastatic calcification caused by hyperphosphatemia"],"answer":0,"explanation":"Dystrophic calcification occurs in injured or necrotic tissue despite normal serum calcium, as in atherosclerotic plaques, damaged heart valves, caseous necrosis, fat necrosis, and psammoma bodies. Metastatic calcification occurs in normal tissue when calcium-phosphate product is high, as in hyperparathyroidism, vitamin D excess, or chronic kidney disease, and it favors interstitial tissue of the kidneys, lungs, and gastric mucosa.","ko":"이영양성 석회화 = 손상 조직 + 정상 Ca. 전이성 = 정상 조직 + 고Ca/고P."},{"id":"cb11","steps":["1"],"system":"General Principles","discipline":"Anatomy","topic":"First pharyngeal arch","stem":"A newborn has a small mandible, underdeveloped cheekbones, downward-slanting eyes, malformed ears with conductive hearing loss, and difficulty feeding. Intelligence is expected to be normal.\n\nAbnormal development of neural crest cells in which pharyngeal arch is primarily responsible?","options":["Third arch","Sixth arch","Fourth arch","First arch","Second arch"],"answer":3,"explanation":"Treacher Collins syndrome results from abnormal neural crest migration into the first pharyngeal arch, causing mandibular and zygomatic hypoplasia and ear anomalies (Pierre Robin sequence is related). The first arch forms the maxilla, mandible, malleus, incus, and muscles of mastication and is innervated by CN V2 and V3. The second arch forms the stapes and styloid process and the muscles of facial expression (CN VII). The third arch forms the stylopharyngeus (CN IX), and the fourth and sixth arches form the larynx and pharynx (CN X).","ko":"Treacher Collins = 1인두궁 신경능선 이상(하악·광대 형성저하, 귀 기형). 1궁 = CN V."},{"id":"cb12","steps":["1"],"system":"General Principles","discipline":"Pharmacology","topic":"Closing a PDA","stem":"A male infant born at 27 weeks' gestation develops a continuous machine-like murmur, bounding pulses, and worsening respiratory status on day 4. Echocardiography shows a large patent ductus arteriosus with left-to-right flow.\n\nWhich drug is used to close the ductus, and how does it work?","options":["Alprostadil, which mimics prostaglandin E1","Digoxin, which increases contractility","Furosemide, which reduces preload","Sildenafil, which inhibits PDE5","Indomethacin, which inhibits prostaglandin E2 synthesis"],"answer":4,"explanation":"In fetal life, high prostaglandin E2 and low oxygen keep the ductus arteriosus open. After birth, rising oxygen and falling prostaglandins close it. In premature infants it often stays open, and NSAIDs such as indomethacin or ibuprofen (or acetaminophen) close it by inhibiting COX and prostaglandin synthesis. Prostaglandin E1 (alprostadil) is given to keep the ductus open in duct-dependent heart lesions. PDA is associated with congenital rubella.","ko":"PDA 폐쇄: indomethacin(PGE2 합성 억제). 개존 유지: alprostadil(PGE1)."},{"id":"cb13","steps":["1"],"system":"General Principles","discipline":"Anatomy","topic":"Fetal alcohol syndrome","stem":"A 4-year-old girl has developmental delay, hyperactivity, and poor growth. She has a small head, short palpebral fissures, a smooth philtrum, and a thin upper lip. Echocardiography shows a ventricular septal defect.\n\nWhich of the following prenatal exposures is the most likely cause?","options":["Phenytoin","Isotretinoin","Warfarin","Alcohol","Lithium"],"answer":3,"explanation":"Fetal alcohol syndrome is the leading preventable cause of intellectual disability. Features include growth restriction, microcephaly, a smooth philtrum, thin upper lip, short palpebral fissures, heart defects, and behavioral problems; impaired migration of neurons and neural crest cells contributes. Isotretinoin causes craniofacial, cardiac, and CNS defects; phenytoin causes fetal hydantoin syndrome with nail hypoplasia; lithium causes Ebstein anomaly; and warfarin causes nasal hypoplasia and stippled epiphyses.","ko":"태아알코올증후군: 매끈한 인중, 얇은 윗입술, 짧은 안검열, 소두증, 심장 결손."},{"id":"cb14","steps":["1"],"system":"General Principles","discipline":"Anatomy","topic":"Monozygotic twinning","stem":"Ultrasonography of a 30-year-old woman pregnant with twins shows a single placenta with a thin dividing membrane between two amniotic sacs. The twins are the same sex.\n\nThe zygote most likely split at which time?","options":["Days 8 to 12 after fertilization","After day 13","The twins are dizygotic","Days 4 to 8 after fertilization","Days 0 to 4 after fertilization"],"answer":3,"explanation":"In monozygotic twins, the timing of splitting determines the placenta and membranes. Splitting at days 0 to 4 (before the morula forms the chorion) gives dichorionic diamniotic twins; days 4 to 8 (blastocyst) gives monochorionic diamniotic twins, the most common type; days 8 to 12 gives monochorionic monoamniotic twins; and after day 13 gives conjoined twins. Monochorionic twins are at risk of twin-twin transfusion syndrome. Dizygotic twins are always dichorionic diamniotic.","ko":"단일융모막 이양막 쌍둥이 = 수정 4~8일 분리(가장 흔함). 쌍태간 수혈 위험."},{"id":"cb15","steps":["1"],"system":"General Principles","discipline":"Pathology","topic":"Neuroblastoma origin","stem":"A 2-year-old boy has a firm abdominal mass that crosses the midline, periorbital bruising, and rapid, chaotic eye movements with jerking of his limbs. Urine homovanillic acid and vanillylmandelic acid are elevated. Biopsy shows small round blue cells forming Homer Wright rosettes.\n\nThese tumor cells are derived from which embryologic tissue?","options":["Neuroectoderm of the neural tube","Mesoderm of the urogenital ridge","Neural crest","Surface ectoderm","Endoderm"],"answer":2,"explanation":"Neuroblastoma is the most common extracranial solid tumor in children and arises from neural crest cells, most often in the adrenal medulla or sympathetic chain. It crosses the midline (unlike Wilms tumor), secretes catecholamine metabolites (HVA and VMA), and can cause opsoclonus-myoclonus syndrome and periorbital metastases (raccoon eyes). N-myc amplification indicates a poor prognosis. Other neural crest derivatives include melanocytes, Schwann cells, the aorticopulmonary septum, odontoblasts, and parafollicular C cells.","ko":"신경모세포종 = 신경능선 기원(부신수질), 정중선 넘음, HVA·VMA↑, N-myc."},{"id":"cb16","steps":["1"],"system":"General Principles","discipline":"Physiology","topic":"Brunner glands","stem":"A histology slide shows a section of small intestine with villi, Paneth cells at the base of crypts, and mucus-secreting glands in the submucosa that open into the crypts.\n\nWhich segment of the small intestine is this, and what do the submucosal glands secrete?","options":["Duodenum; gastrin","Jejunum; digestive enzymes","Duodenum; alkaline mucus that neutralizes gastric acid","Ileum; bile acid binding protein","Ileum; intrinsic factor"],"answer":2,"explanation":"Brunner glands are submucosal glands found only in the duodenum. They secrete alkaline, bicarbonate-rich mucus that protects against acid from the stomach and they hypertrophy in peptic ulcer disease. The jejunum has prominent plicae circulares (feathery appearance on imaging), and the ileum has Peyer patches in the lamina propria and submucosa. Intrinsic factor is made by gastric parietal cells.","ko":"Brunner샘 = 십이지장 점막하층, 알칼리성 점액. 회장 = Peyer patch."},{"id":"cb17","steps":["1"],"system":"General Principles","discipline":"Biochemistry","topic":"X-linked adrenoleukodystrophy","stem":"An 8-year-old boy who had been developing normally has declining school performance, behavioral changes, and difficulty with vision and walking. He also has fatigue and skin darkening, and morning cortisol is low. MRI shows symmetric demyelination of the posterior white matter. Plasma very-long-chain fatty acids are elevated.\n\nWhich organelle function is impaired?","options":["Synthesis of steroid hormones in the smooth ER","β-Oxidation of very-long-chain fatty acids in peroxisomes","β-Oxidation of medium-chain fatty acids in mitochondria","Lysosomal de
