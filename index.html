on, hypokalemia, and metabolic alkalosis. Both plasma renin and aldosterone are suppressed. His father had hypertension from his teens. Spironolactone does not lower his blood pressure.\n\nWhich drug is most appropriate?","options":["Hydrochlorothiazide","Furosemide","Lisinopril","Amiloride","Spironolactone"],"answer":3,"explanation":"Liddle syndrome is an autosomal dominant gain-of-function mutation of the epithelial sodium channel (ENaC) in the collecting duct, which reduces its degradation. Excess sodium reabsorption causes hypertension, hypokalemia, and metabolic alkalosis, while renin and aldosterone are suppressed. Because the channel is overactive independently of aldosterone, spironolactone does not work, while ENaC blockers such as amiloride and triamterene do.","ko":"Liddle = ENaC 기능 획득, 고혈압·저칼륨, 레닌·알도스테론↓ → amiloride(spironolactone 무효)."},{"id":"rn29","steps":["1"],"system":"Renal","discipline":"Pharmacology","topic":"Drug-induced SIADH","stem":"A 70-year-old woman started on a medication for trigeminal neuralgia 3 weeks ago is brought in because of confusion. Serum sodium is 122 mEq/L and serum osmolality is 255 mOsm/kg. Urine osmolality is 480 mOsm/kg, and urine sodium is 60 mEq/L. She is euvolemic, and thyroid and adrenal function are normal.\n\nWhich of the following drugs is most likely responsible?","options":["Baclofen","Amitriptyline","Carbamazepine","Gabapentin","Acetaminophen"],"answer":2,"explanation":"SIADH causes euvolemic hyponatremia with inappropriately concentrated urine (osmolality greater than serum) and high urine sodium because of mild volume expansion and natriuresis. Common drug causes include carbamazepine and oxcarbazepine, SSRIs, cyclophosphamide, vincristine, and opioids; other causes are small cell lung cancer, CNS disorders, and lung infections. Treatment includes fluid restriction, salt tablets, and vasopressin receptor antagonists.","ko":"SIADH: 정상용적 저나트륨, 소변 삼투압 > 혈청, 소변 Na↑. 약물: carbamazepine, SSRI, cyclophosphamide."},{"id":"rn30","steps":["1"],"system":"Renal","discipline":"Physiology","topic":"Winter's formula","stem":"A 60-year-old man with COPD and diabetic ketoacidosis has the following arterial blood gas: pH 7.10, PaCO2 38 mm Hg, HCO3− 12 mEq/L. His anion gap is elevated.\n\nWhich of the following best describes his acid-base status?","options":["Anion gap metabolic acidosis with a concurrent respiratory alkalosis","Anion gap metabolic acidosis with appropriate respiratory compensation","Anion gap metabolic acidosis with a concurrent respiratory acidosis","Primary respiratory acidosis with metabolic compensation","Non-anion gap metabolic acidosis"],"answer":2,"explanation":"For a metabolic acidosis, Winter's formula predicts the expected PaCO2: 1.5 × HCO3− + 8 ± 2 = 1.5 × 12 + 8 = 26 ± 2 mm Hg. His PaCO2 of 38 is much higher than expected, so he cannot hyperventilate adequately, which indicates a concurrent respiratory acidosis (here from COPD). A PaCO2 below the expected range would indicate a concurrent respiratory alkalosis.","ko":"Winter 공식: 예상 PaCO2 = 1.5×HCO3 + 8 ± 2. 실제가 더 높으면 호흡성 산증 동반."},{"id":"rn31","steps":["1"],"system":"Renal","discipline":"Pathology","topic":"Ethylene glycol poisoning","stem":"A 30-year-old man is brought in confused after drinking a sweet-tasting liquid from his garage. He has an anion gap of 28, an osmolal gap of 35, and a rising creatinine. Urinalysis shows many envelope-shaped and needle-shaped crystals.\n\nWhich toxic metabolite forms these crystals?","options":["Formic acid","Hippuric acid","Uric acid","Oxalic acid","Cystine"],"answer":3,"explanation":"Ethylene glycol (antifreeze) is metabolized by alcohol dehydrogenase to glycolic acid and oxalic acid. Oxalate binds calcium to form calcium oxalate crystals that cause acute kidney injury, along with hypocalcemia. An elevated osmolal gap appears early, before metabolism to acids. Treatment is fomepizole and hemodialysis. Methanol produces formic acid, which damages the optic nerve.","ko":"에틸렌글리콜: 옥살산 → 수산칼슘 결정 → AKI, 삼투압 차이↑ → fomepizole."},{"id":"rn32","steps":["1"],"system":"Renal","discipline":"Physiology","topic":"Type 4 RTA","stem":"A 64-year-old man with long-standing diabetic nephropathy has a non-anion gap metabolic acidosis with a serum potassium of 6.0 mEq/L. Urine pH is 5.1. Plasma renin and aldosterone are both low.\n\nWhich of the following is the most likely diagnosis?","options":["Type 1 (distal) renal tubular acidosis","Type 2 (proximal) renal tubular acidosis","Diabetic ketoacidosis","Type 4 renal tubular acidosis","Primary hyperaldosteronism"],"answer":3,"explanation":"Type 4 RTA results from hypoaldosteronism or aldosterone resistance. In diabetes, damage to the juxtaglomerular apparatus causes hyporeninemic hypoaldosteronism. Without aldosterone, potassium excretion falls, and hyperkalemia suppresses ammonia production in the proximal tubule, reducing acid excretion. Urine can still be acidified (pH below 5.5). Drugs such as ACE inhibitors, ARBs, spironolactone, NSAIDs, and trimethoprim can cause or worsen it.","ko":"4형 RTA: 저알도스테론(당뇨 저레닌), 고칼륨, 소변 pH \u003c5.5 가능."},{"id":"rn33","steps":["1"],"system":"Renal","discipline":"Pathology","topic":"Fibromuscular dysplasia","stem":"A 28-year-old woman has new hypertension of 168/104 mm Hg that is resistant to two drugs. A bruit is heard in the right flank. Serum potassium is 3.3 mEq/L, and plasma renin is elevated. Angiography shows alternating stenosis and dilation of the middle portion of the right renal artery.\n\nWhich of the following is the most likely diagnosis?","options":["Pheochromocytoma","Takayasu arteritis","Fibromuscular dysplasia","Atherosclerotic renal artery stenosis","Primary hyperaldosteronism"],"answer":2,"explanation":"Fibromuscular dysplasia is a noninflammatory, nonatherosclerotic disease of medium arteries that causes a string-of-beads appearance, usually in the mid to distal renal arteries and the internal carotids, mainly in young women. Renal artery stenosis reduces perfusion, activating the renin-angiotensin system and causing hypertension and hypokalemia (secondary hyperaldosteronism). Atherosclerotic stenosis occurs at the ostium in older patients. Angioplasty is effective.","ko":"섬유근육형성이상: 젊은 여성, 신동맥 '염주 모양', 레닌↑ 고혈압 → 혈관성형술."},{"id":"rn34","steps":["1"],"system":"Renal","discipline":"Pathology","topic":"Renal papillary necrosis","stem":"A 25-year-old Black man with sickle cell trait has sudden painless gross hematuria. Imaging shows a ring-shaped filling defect in a renal calyx. He later passes a small piece of tissue in his urine.\n\nWhich of the following best explains this condition?","options":["A transitional cell carcinoma of the renal pelvis","Ischemic necrosis of the renal papillae, which have a low oxygen tension","Bacterial infection ascending from the bladder","Crystals precipitating in the collecting ducts","Immune complex deposition in the glomeruli"],"answer":1,"explanation":"Renal papillary necrosis is ischemic necrosis of the renal papillae, which receive blood through the vasa recta at low oxygen tension and are especially vulnerable to sickling. Causes include sickle cell disease and trait, chronic analgesic (NSAID) use, diabetes, acute pyelonephritis, and urinary obstruction. Sloughed papillae cause hematuria and can obstruct the ureter.","ko":"신유두괴사: 겸상적혈구(형질 포함), NSAID 남용, 당뇨, 신우신염 — 수질 저산소."},{"id":"rn35","steps":["1"],"system":"Renal","discipline":"Microbiology","topic":"Pyelonephritis virulence","stem":"A 26-year-old woman has fever, chills, flank pain, and costovertebral angle tenderness. Urinalysis shows white blood cell casts, and urine culture grows Escherichia coli.\n\nWhich virulence factor most enables this organism to ascend and attach to the uroepithelium of the upper urinary tract?","options":["P fimbriae","Shiga-like toxin","K1 capsule","Heat-stable enterotoxin","Lipooligosaccharide"],"answer":0,"explanation":"Uropathogenic E. coli use P fimbriae (pyelonephritis-associated pili) to bind glycolipid receptors on uroepithelial cells, allowing ascent to the kidney. White cell casts localize infection to the kidney, distinguishing pyelonephritis from cystitis. The K1 capsule is associated with neonatal meningitis, Shiga-like toxin with EHEC and HUS, and heat-stable toxin with traveler's diarrhea.","ko":"요로병원성 대장균: P fimbriae → 상부 요로 부착. WBC cast = 신우신염. K1 = 신생아 수막염."},{"id":"rn36","steps":["1"],"system":"Renal","discipline":"Pathology","topic":"Lupus nephritis","stem":"A 26-year-old woman with SLE has new hypertension, edema, hematuria with red cell casts, and proteinuria of 3 g/day. Serum C3 and C4 are low, and anti-dsDNA titers are high. Kidney biopsy shows proliferation in more than half of the glomeruli with thickened capillary loops that look like wire loops.\n\nWhere are the immune complexes mainly deposited?","options":["Along the basement membrane in a linear pattern","No immune deposits are present","Mesangium only","Subendothelial space","Subepithelial space only"],"answer":3,"explanation":"Diffuse proliferative lupus nephritis (class IV) is the most common and severe form of renal involvement in SLE. Subendothelial immune complex deposits thicken capillary walls into wire loops and cause nephritic syndrome, often with nephrotic-range proteinuria. Immunofluorescence shows full-house staining (IgG, IgA, IgM, C3, C1q). Membranous lupus nephritis (class V) has subepithelial deposits and nephrotic syndrome. Treatment involves corticosteroids with mycophenolate or cyclophosphamide.","ko":"루푸스 신염 IV형(미만성 증식): 내피하 침착, wire loop, full-house IF."},{"id":"rn37","steps":["1"],"system":"Renal","discipline":"Genetics","topic":"Alport syndrome","stem":"A 12-year-old boy has persistent microscopic hematuria and mild proteinuria. He has bilateral sensorineural hearing loss and a cone-shaped lens. His maternal uncle needed dialysis at age 30. Electron microscopy of a kidney biopsy shows thinning and splitting of the glomerular basement membrane.\n\nA defect in which protein is most likely?","options":["Type I collagen","Nephrin","Polycystin-1","Fibrillin","Type IV collagen"],"answer":4,"explanation":"Alport syndrome is most often X-linked and is caused by mutations in the α5 chain of type IV collagen (COL4A5), a key component of basement membranes in the kidney, cochlea, and eye. It causes hematuria progressing to kidney failure, sensorineural hearing loss, and eye abnormalities such as anterior lenticonus. The GBM shows splitting with a basket-weave appearance. Nephrin defects cause congenital nephrotic syndrome.","ko":"Alport: 4형 콜라겐 α5(X연관), 혈뇨 + 감각신경성 난청 + 원추수정체, GBM 분열."},{"id":"rn38","steps":["1"],"system":"Renal","discipline":"Pathology","topic":"MPGN with hepatitis C","stem":"A 55-year-old man with chronic hepatitis C has edema, hematuria, and proteinuria of 4 g/day. He also has palpable purpura and joint pain. Serum C3 and C4 are low, and cryoglobulins are present. Kidney biopsy shows thickened capillary walls with a double-contoured (tram-track) appearance on silver stain.\n\nWhich of the following is the most likely diagnosis?","options":["IgA nephropathy","Membranous nephropathy","Membranoproliferative glomerulonephritis","Anti-GBM disease","Minimal change disease"],"answer":2,"explanation":"Membranoproliferative glomerulonephritis (type I) is caused by subendothelial immune complex deposits. Mesangial cells extend into the capillary wall and lay down new basement membrane, creating a tram-track appearance. It is associated with hepatitis C (often with mixed cryoglobulinemia) and hepatitis B, and it presents with nephritic, nephrotic, or mixed features and low complement. C3 glomerulopathy, related to complement dysregulation, is a variant.","ko":"MPGN: 내피하 침착, tram-track, C형간염·한랭글로불린, 보체↓."},{"id":"rn39","steps":["1"],"system":"Renal","discipline":"Immunology","topic":"Microscopic polyangiitis","stem":"A 60-year-old woman has fatigue, palpable purpura, and hemoptysis. Serum creatinine has risen from 0.9 to 3.6 mg/dL over 3 weeks, and urinalysis shows red cell casts. Kidney biopsy shows crescentic glomerulonephritis with little immunoglobulin or complement staining. Lung and skin biopsies show no granulomas. MPO-ANCA is positive.\n\nWhich of the following is the most likely diagnosis?","options":["Anti-GBM disease","Granulomatosis with polyangiitis","IgA vasculitis","Microscopic polyangiitis","Poststreptococcal glomerulonephritis"],"answer":3,"explanation":"Rapidly progressive (crescentic) glomerulonephritis is classified by immunofluorescence: linear (anti-GBM disease), granular (immune complex disease such as PSGN, lupus, or IgA), and pauci-immune (ANCA-associated vasculitis). Microscopic polyangiitis is a necrotizing small-vessel vasculitis of the kidneys, lungs, and skin without granulomas and is associated with MPO-ANCA (p-ANCA). Granulomatosis with polyangiitis has granulomas and upper airway involvement with PR3-ANCA.","ko":"현미경적 다발혈관염: 폐·신장·피부, 육아종 없음, MPO-ANCA, 소량면역(pauci-immune) 반월체."},{"id":"rn40","steps":["1"],"system":"Renal","discipline":"Pathology","topic":"Urothelial carcinoma risk","stem":"A 66-year-old man who worked for 30 years in a factory producing textile dyes has painless gross hematuria. He also smoked for 40 years. Cystoscopy shows a papillary bladder tumor.\n\nWhich of the following is the most important risk factor for this tumor in the general population?","options":["Cyclophosphamide therapy","Cigarette smoking","Chronic indwelling catheter","Phenacetin use","Schistosoma haematobium infection"],"answer":1,"explanation":"Urothelial (transitional cell) carcinoma is the most common bladder cancer, typically presenting with painless hematuria. Smoking is the most important risk factor; others include aromatic amines in dye, rubber, and leather industries (aniline dyes), cyclophosphamide, and phenacetin. Tumors are often multifocal and recur. Squamous cell carcinoma of the bladder is associated with Schistosoma haematobium and chronic irritation.","ko":"요로상피암: 무통성 혈뇨, 최대 위험인자 흡연, 아닐린 염료·cyclophosphamide."},{"id":"rn41","steps":["1"],"system":"Renal","discipline":"Anatomy","topic":"Posterior urethral valves","stem":"Prenatal ultrasonography of a male fetus at 22 weeks shows bilateral hydronephrosis, a thick-walled distended bladder, a dilated proximal urethra (keyhole sign), and low amniotic fluid.\n\nWhich of the following is the most likely diagnosis?","options":["Bilateral renal agenesis","Autosomal recessive polycystic kidney disease","Ureteropelvic junction obstruction","Vesicoureteral reflux alone","Posterior urethral valves"],"answer":4,"explanation":"Posterior urethral valves are membranes in the posterior urethra of boys that obstruct bladder outflow, causing bladder distension, bilateral hydroureteronephrosis, and oligohydramnios, which can lead to pulmonary hypoplasia. They are the most common cause of urinary obstruction in male infants. Ureteropelvic junction obstruction, the most common cause of hydronephrosis in fetuses, is usually unilateral and does not distend the bladder.","ko":"후부요도판막: 남아, 양측 수신증 + 방광 팽창 + 양수과소(keyhole sign)."},{"id":"rn42","steps":["1"],"system":"Renal","discipline":"Physiology","topic":"Potassium shifts in DKA","stem":"A 16-year-old girl with type 1 diabetes is admitted with diabetic ketoacidosis. Her serum potassium is 5.7 mEq/L, although she has a total-body potassium deficit.\n\nWhich of the following best explains the elevated serum potassium?","options":["Rhabdomyolysis","Decreased renal potassium excretion from acute kidney failure","Aldosterone deficiency","Insulin deficiency and hyperosmolality shift potassium out of cells","Increased dietary potassium intake"],"answer":3,"explanation":"Insulin normally drives potassium into cells by stimulating the Na+/K+-ATPase. In DKA, insulin deficiency, hyperosmolality (solvent drag), and acidosis shift potassium out of cells, so serum potassium can be normal or high despite large urinary losses from osmotic diuresis. Insulin treatment rapidly shifts potassium back into cells, causing hypokalemia, so potassium is replaced. Other causes of shift out of cells include digoxin, β-blockers, and cell lysis; insulin, β-agonists, and alkalosis shift it into cells.","ko":"DKA: 인슐린 결핍·고삼투압·산증 → K 세포 밖 이동(혈청 K↑, 총체내 K↓). 인슐린 투여 시 저칼륨."},{"id":"rp01","steps":["1"],"system":"Reproductive","discipline":"Pathology","topic":"Turner syndrome","stem":"A 15-year-old girl is evaluated for primary amenorrhea and short stature. She has a broad chest with widely spaced nipples, a low posterior hairline, and a webbed neck. Breast development is absent. Serum FSH is markedly elevated.\n\nWhich of the following is the most likely karyotype?","options":["47,XXX","46,XY","46,XX with a 21-hydroxylase mutation","47,XXY","45,X"],"answer":4,"explanation":"Turner syndrome (45,X, often from loss of the paternal X) causes short stature, ovarian dysgenesis with streak ovaries, and primary amenorrhea. Because the ovaries produce no estrogen or inhibin, FSH and LH are high (hypergonadotropic hypogonadism). Other features include webbed neck from fetal cystic hygroma, lymphedema of the hands and feet at birth, bicuspid aortic valve, coarctation of the aorta, and horseshoe kidney. Intelligence is usually normal.","ko":"Turner(45,X): 저신장·익상경·원발성 무월경, FSH↑, 이엽 대동맥판·축착·말굽신."},{"id":"rp02","steps":["1"],"system":"Reproductive","discipline":"Physiology","topic":"Klinefelter syndrome","stem":"A 28-year-old man is evaluated for infertility. He is 191 cm (6 ft 3 in) tall with long arms and legs, sparse body hair, and gynecomastia. His testes are small and firm. Semen analysis shows no sperm.\n\nWhich of the following sets of hormone levels is most likely?","options":["Testosterone ↓, LH ↓, FSH ↓","Testosterone ↓, LH ↑, FSH ↑","Testosterone normal, LH normal, FSH ↓","Testosterone ↑, LH ↓, FSH ↓","Testosterone ↑, LH ↑, FSH normal"],"answer":1,"explanation":"Klinefelter syndrome (47,XXY) causes testicular dysgenesis with hyalinized seminiferous tubules. Damaged Sertoli cells produce less inhibin, so FSH rises, and damaged Leydig cells produce less testosterone, so LH rises (hypergonadotropic hypogonadism). Low testosterone with relatively higher estrogen causes gynecomastia, a eunuchoid body habitus, and infertility. A Barr body is present in cells.","ko":"Klinefelter(47,XXY): 테스토스테론↓, LH·FSH↑, 작고 단단한 고환, 여성형 유방."},{"id":"rp03","steps":["1"],"system":"Reproductive","discipline":"Physiology","topic":"Androgen insensitivity","stem":"A 17-year-old girl is evaluated for primary amenorrhea. She has normal breast development, but scant pubic and axillary hair. The vagina is short and ends blindly, and no uterus is seen on ultrasonography. Bilateral inguinal masses are present. Karyotype is 46,XY, and serum testosterone is in the high-normal male range.\n\nWhich of the following is the most likely diagnosis?","options":["Androgen insensitivity syndrome","Kallmann syndrome","Müllerian agenesis","5α-Reductase deficiency","Turner syndrome"],"answer":0,"explanation":"In complete androgen insensitivity syndrome, a defective androgen receptor makes tissues unresponsive to testosterone. The testes develop and secrete anti-Müllerian hormone, so the uterus and upper vagina are absent, but the external genitalia develop as female. Testosterone is converted to estrogen, so breasts develop, while pubic and axillary hair are sparse. The testes are removed after puberty because of cancer risk. Müllerian agenesis occurs in 46,XX women with normal hair.","ko":"AIS(46,XY): 여성 외형·유방 발달, 자궁 없음, 체모 적음, 테스토스테론 정상~높음."},{"id":"rp04","steps":["1"],"system":"Reproductive","discipline":"Biochemistry","topic":"5-alpha reductase deficiency","stem":"A child raised as a girl has ambiguous genitalia at birth. At puberty, she develops a deeper voice, increased muscle mass, growth of the phallus, and descent of testes into the labioscrotal folds. Karyotype is 46,XY. Serum testosterone is normal and the testosterone-to-dihydrotestosterone ratio is elevated.\n\nDeficiency of which of the following enzymes is most likely?","options":["17α-Hydroxylase","Aromatase","5α-Reductase","Androgen receptor function","21-Hydroxylase"],"answer":2,"explanation":"5α-Reductase converts testosterone to dihydrotestosterone, which is needed for development of the external male genitalia and prostate in the fetus. Affected 46,XY infants have ambiguous or female-appearing external genitalia but normal internal male structures (Wolffian derivatives depend on testosterone). At puberty, high testosterone causes virilization. Finasteride inhibits this enzyme.","ko":"5α-reductase 결핍: 출생 시 모호 외부생식기, 사춘기에 남성화. T/DHT 비율↑."},{"id":"rp05","steps":["1"],"system":"Reproductive","discipline":"Anatomy","topic":"Kallmann syndrome","stem":"A 17-year-old boy has not started puberty. He has a small penis and testes and cannot smell coffee or perfume. Serum LH, FSH, and testosterone are low. MRI shows absent olfactory bulbs.\n\nWhich of the following is the most likely cause?","options":["Testicular dysgenesis from an extra X chromosome","Infarction of the anterior pituitary","Failed migration of GnRH neurons from the olfactory placode","Prolactin-secreting pituitary adenoma","Defective androgen receptor"],"answer":2,"explanation":"Kallmann syndrome is congenital hypogonadotropic hypogonadism with anosmia. GnRH neurons and olfactory neurons originate in the olfactory placode, and in Kallmann syndrome they fail to migrate to the hypothalamus (e.g., KAL1/ANOS1 mutations). Low GnRH leads to low LH, FSH, and sex steroids and delayed puberty. Pulsatile GnRH or gonadotropins can induce puberty and fertility.","ko":"Kallmann = GnRH 뉴런 이동 실패 + 무후각, LH·FSH↓."},{"id":"rp06","steps":["1"],"system":"Reproductive","discipline":"Pathology","topic":"PCOS endometrial risk","stem":"A 26-year-old woman has irregular menstrual periods every 2 to 4 months, acne, and excess hair on her chin and abdomen. Her BMI is 33 kg/m², and she has dark velvety skin on the back of her neck. Ultrasonography shows enlarged ovaries with many peripheral follicles.\n\nWithout treatment, this patient is at increased risk for which of the following?","options":["Osteoporosis","Breast fibroadenoma","Cervical squamous cell carcinoma","Endometrial carcinoma","Ovarian granulosa cell tumor"],"answer":3,"explanation":"Polycystic ovary syndrome involves insulin resistance and an increased LH-to-FSH ratio, which drives ovarian androgen production and anovulation. Without ovulation there is no corpus luteum or progesterone, so the endometrium is exposed to unopposed estrogen, increasing the risk of endometrial hyperplasia and carcinoma. PCOS also increases the risk of type 2 diabetes, dyslipidemia, and infertility. Treatment includes weight loss, combined oral contraceptives, metformin, and letrozole or clomiphene for fertility.","ko":"PCOS: 무배란 → 프로게스테론 없는 에스트로겐 → 자궁내막암 위험. 인슐린 저항성."},{"id":"rp07","steps":["1"],"system":"Reproductive","discipline":"Pathology","topic":"Granulosa cell tumor","stem":"A 58-year-old postmenopausal woman has vaginal bleeding. Ultrasonography shows a 10-cm solid ovarian mass and a thickened endometrial stripe. Endometrial biopsy shows hyperplasia. Histology of the ovarian mass shows small cuboidal cells around small spaces filled with eosinophilic fluid. Serum inhibin is elevated.\n\nWhich of the following is the most likely diagnosis?","options":["Granulosa cell tumor","Krukenberg tumor","Dysgerminoma","Mature cystic teratoma","Serous cystadenocarcinoma"],"answer":0,"explanation":"Granulosa cell tumor is the most common malignant sex cord-stromal tumor of the ovary. It secretes estrogen, causing precocious puberty in girls and endometrial hyperplasia, abnormal bleeding, or endometrial carcinoma in adult women. Histology shows Call-Exner bodies (small follicle-like spaces with eosinophilic material), and inhibin is a tumor marker. Krukenberg tumors are metastatic gastric adenocarcinomas with signet ring cells.","ko":"과립막세포종: 에스트로겐 분비 → 자궁내막 증식, Call-Exner body, inhibin."},{"id":"rp08","steps":["1"],"system":"Reproductive","discipline":"Pathology","topic":"Meigs syndrome","stem":"A 62-year-old woman has progressive abdominal distension and shortness of breath. Examination shows ascites and a right pleural effusion. Imaging shows a solid ovarian mass. After the mass is removed, the ascites and effusion resolve. Histology shows bundles of spindle-shaped fibroblasts.\n\nWhich of the following is the most likely diagnosis?","options":["Mucinous cystadenoma","Ovarian fibroma","Serous cystadenocarcinoma with peritoneal metastases","Brenner tumor","Sertoli-Leydig cell tumor"],"answer":1,"explanation":"Meigs syndrome is the triad of an ovarian fibroma, ascites, and a right pleural effusion, which resolve after the tumor is removed. Fibromas are benign tumors of spindle-shaped fibroblasts. Ascites with an ovarian mass more often indicates metastatic serous carcinoma, so pathology confirms the benign diagnosis. Sertoli-Leydig cell tumors secrete androgens and cause virilization.","ko":"Meigs = 난소 섬유종 + 복수 + 우측 흉수, 절제 후 소실."},{"id":"rp09","steps":["1"],"system":"Reproductive","discipline":"Pathology","topic":"Seminoma","stem":"A 32-year-old man notices a painless, firm enlargement of his left testis. Ultrasonography shows a homogeneous solid intratesticular mass. Serum α-fetoprotein is normal. After orchiectomy, histology shows sheets of large cells with clear cytoplasm and central nuclei separated by fibrous septa with lymphocytes.\n\nWhich of the following is the most likely diagnosis?","options":["Choriocarcinoma","Seminoma","Leydig cell tumor","Embryonal carcinoma","Yolk sac tumor"],"answer":1,"explanation":"Seminoma is the most common testicular germ cell tumor, typically in men aged 15 to 35. It shows large cells with clear, glycogen-rich cytoplasm (fried-egg cells) and lymphocytes in fibrous septa, and it can elevate placental alkaline phosphatase. AFP is never elevated in a pure seminoma. It is very sensitive to radiation and chemotherapy and has an excellent prognosis. Testicular tumors are biopsied by orchiectomy, not transscrotally, to avoid seeding.","ko":"고환 정상피종: fried-egg cell, PLAP, AFP 정상, 방사선 감수성↑."},{"id":"rp10","steps":["1"],"system":"Reproductive","discipline":"Pathology","topic":"Yolk sac tumor","stem":"A 2-year-old boy has a painless scrotal mass. Serum α-fetoprotein is markedly elevated. Orchiectomy is performed, and histology shows glomerulus-like structures with a central blood vessel surrounded by germ cells.\n\nWhich of the following is the most likely diagnosis?","options":["Teratoma","Seminoma","Choriocarcinoma","Yolk sac tumor","Embryonal carcinoma"],"answer":3,"explanation":"Yolk sac (endodermal sinus) tumor is the most common testicular tumor in boys under 3 years old. It produces α-fetoprotein, and its hallmark is the Schiller-Duval body, a glomerulus-like structure. Choriocarcinoma produces very high hCG and spreads hematogenously. Teratomas in prepubertal boys are usually benign, while in adult men they are malignant.","ko":"난황낭종양: 3세 미만 남아, AFP↑, Schiller-Duval body."},{"id":"rp11","steps":["1"],"system":"Reproductive","discipline":"Biochemistry","topic":"Complete hydatidiform mole","stem":"A 24-year-old woman at 11 weeks' gestation has vaginal bleeding and severe nausea and vomiting. Her uterus is larger than expected for gestational age. Serum β-hCG is 280,000 mIU/mL. Ultrasonography shows a snowstorm pattern with no fetal parts. Tissue removed by suction curettage shows swollen chorionic villi with diffuse trophoblastic proliferation.\n\nWhich of the following is the most likely karyotype of the tissue?","options":["46,XX, with one maternal and one paternal set","69,XXY, with two paternal sets","46,XX, all chromosomes paternal","45,X","47,XX,+21"],"answer":2,"explanation":"A complete mole results from fertilization of an egg that has lost its nucleus by one sperm that duplicates (46,XX) or, less often, by two sperm (46,XY), so all chromosomes are paternal. There is no fetal tissue, hCG is very high, and the uterus is enlarged. A partial mole is triploid (69,XXY) with some fetal parts. Complete moles carry a higher risk of choriocarcinoma, so hCG is monitored until undetectable after evacuation. Very high hCG can cause hyperemesis, hyperthyroidism, and early preeclampsia.","ko":"완전 포상기태 = 46,XX(모두 부계), 태아 없음, hCG 매우↑, 융모암 위험."},{"id":"rp12","steps":["1"],"system":"Reproductive","discipline":"Pathology","topic":"Preeclampsia pathogenesis","stem":"A 31-year-old primigravida at 33 weeks' gestation has new-onset hypertension of 154/102 mm Hg and proteinuria. Her prior blood pressures were normal.\n\nWhich of the following best describes the underlying pathogenesis of her condition?","options":["Immune complex deposition in the glomeruli","Autoantibodies against the TSH receptor","Volume overload from increased plasma volume","Pregnancy-induced insulin resistance","Abnormal remodeling of the maternal spiral arteries by trophoblasts"],"answer":4,"explanation":"In preeclampsia, trophoblasts fail to fully invade and remodel the maternal spiral arteries, which stay narrow and high-resistance. The ischemic placenta releases antiangiogenic factors (such as soluble fms-like tyrosine kinase-1) that cause widespread maternal endothelial dysfunction, leading to hypertension, proteinuria, and organ injury. Renal glomeruli show glomerular endotheliosis. Delivery of the placenta is the definitive treatment.","ko":"전자간증 = 나선동맥 리모델링 실패 → 태반 허혈 → 내피기능장애. 치료: 분만."},{"id":"rp13","steps":["1"],"system":"Reproductive","discipline":"Pathology","topic":"Ectopic pregnancy risk","stem":"A 28-year-old woman has sudden lower abdominal pain and light vaginal bleeding 7 weeks after her last menstrual period. Serum β-hCG is 2800 mIU/mL, and transvaginal ultrasonography shows no intrauterine pregnancy but a complex mass next to the left ovary with free fluid in the pelvis.\n\nWhich of the following is the most important risk factor for this condition?","options":["Use of combined oral contraceptives","Previous Chlamydia trachomatis salpingitis","Previous cesarean delivery","Uterine leiomyomas","Nulliparity"],"answer":1,"explanation":"Ectopic pregnancy most often implants in the ampulla of the fallopian tube. Its major risk factors damage the tube or slow transport of the embryo: prior pelvic inflammatory disease (especially chlamydia), previous ectopic pregnancy, tubal surgery, smoking, and pregnancy with an intrauterine device in place. Combined oral contraceptives prevent ovulation and lower the risk. Rupture causes hemorrhage and is a surgical emergency.","ko":"자궁외 임신: 난관 팽대부, 최대 위험인자 = 이전 PID(클라미디아)."},{"id":"rp14","steps":["1"],"system":"Reproductive","discipline":"Pathology","topic":"Invasive lobular carcinoma","stem":"A 58-year-old woman has a poorly defined thickening in her left breast. Biopsy shows small, uniform cells infiltrating the stroma in single-file lines. Immunohistochemistry shows loss of E-cadherin. Imaging shows similar lesions in the right breast.\n\nWhich of the following is the most likely diagnosis?","options":["Mucinous carcinoma","Invasive lobular carcinoma","Medullary carcinoma","Phyllodes tumor","Invasive ductal carcinoma"],"answer":1,"explanation":"Invasive lobular carcinoma is characterized by loss of E-cadherin, a cell adhesion molecule, so tumor cells grow in single files rather than cohesive glands. It is often bilateral and multifocal and may be hard to detect on mammography. Invasive ductal carcinoma, the most common breast cancer, forms a firm, stellate mass. Inherited CDH1 (E-cadherin) mutations also cause hereditary diffuse gastric cancer with signet ring cells.","ko":"침윤성 소엽암 = E-cadherin 소실, 일렬 배열(single file), 양측·다발성."},{"id":"rp15","steps":["1"],"system":"Reproductive","discipline":"Pharmacology","topic":"Trastuzumab","stem":"A 49-year-old woman with invasive ductal carcinoma of the breast is found to have amplification of a gene encoding a receptor tyrosine kinase. She is treated with a monoclonal antibody against this receptor.\n\nWhich of the following adverse effects requires regular monitoring during this treatment?","options":["Decline in left ventricular ejection fraction","Hemorrhagic cystitis","Peripheral neuropathy","Ototoxicity","Pulmonary fibrosis"],"answer":0,"explanation":"HER2 (ERBB2) amplification occurs in about 20% of breast cancers. Trastuzumab is a monoclonal antibody against HER2 that blocks signaling and triggers antibody-dependent cytotoxicity. Its main adverse effect is cardiotoxicity, a usually reversible decline in ejection fraction, so echocardiography is monitored, especially when it is combined with anthracyclines. Hemorrhagic cystitis is caused by cyclophosphamide, pulmonary fibrosis by bleomycin, and neuropathy by taxanes and vincristine.","ko":"Trastuzumab(HER2 항체): 심독성(가역적 EF 저하) → 심초음파 추적."},{"id":"rp16","steps":["1"],"system":"Reproductive","discipline":"Pathology","topic":"Fibroadenoma","stem":"A 22-year-old woman finds a 2-cm, firm, rubbery, mobile, painless mass in her right breast. It becomes slightly larger and tender before her menstrual periods. Ultrasonography shows a well-circumscribed, oval solid mass.\n\nWhich of the following is the most likely diagnosis?","options":["Invasive ductal carcinoma","Fat necrosis","Phyllodes tumor","Fibroadenoma","Intraductal papilloma"],"answer":3,"explanation":"Fibroadenoma is the most common breast tumor in women under 35. It is a benign, well-circumscribed, mobile mass composed of fibrous stroma and glands, and it is hormone-sensitive, enlarging with pregnancy and before menses. It carries little or no risk of cancer. Intraductal papilloma causes bloody nipple discharge, and phyllodes tumor is a large, rapidly growing leaf-like fibroepithelial tumor in older women.","ko":"섬유선종: 35세 미만, 단단하고 잘 움직이는 무통성 종괴, 호르몬 민감, 양성."},{"id":"rp17","steps":["1"],"system":"Reproductive","discipline":"Pathology","topic":"Endometriosis","stem":"A 29-year-old woman has had severe painful periods and pain with intercourse for 3 years, and she has been unable to conceive for 2 years. Pelvic examination shows tenderness and nodularity of the uterosacral ligaments. Laparoscopy shows dark brown cysts on both ovaries and small bluish-black spots on the peritoneum.\n\nWhich of the following is the most likely diagnosis?","options":["Endometriosis","Mature cystic teratoma","Leiomyoma","Adenomyosis","Pelvic inflammatory disease"],"answer":0,"explanation":"Endometriosis is endometrial glands and stroma outside the uterus, thought to arise mainly from retrograde menstruation. Ectopic tissue bleeds cyclically, causing dysmenorrhea, dyspareunia, dyschezia, and infertility. Ovarian implants form endometriomas (chocolate cysts), and peritoneal implants appear as powder-burn lesions. Adenomyosis is endometrial tissue within the myometrium, causing a uniformly enlarged, boggy uterus.","ko":"자궁내막증: 월경역류, chocolate cyst, 월경통·성교통·불임. 자궁선근증은 근층 내."},{"id":"rp18","steps":["1"],"system":"Reproductive","discipline":"Pathology","topic":"Leiomyoma","stem":"A 40-year-old Black woman has heavy menstrual bleeding and pelvic pressure. Examination shows an irregularly enlarged, firm uterus. After hysterectomy, the uterus contains multiple well-circumscribed, rubbery white masses with a whorled cut surface. Histology shows bundles of smooth muscle cells without atypia or necrosis.\n\nWhich of the following is true of this condition?","options":["The masses often grow during pregnancy and shrink after menopause","They are most common in postmenopausal women","They are caused by human papillomavirus","They arise from endometrial glands","The masses commonly progress to leiomyosarcoma"],"answer":0,"explanation":"Leiomyomas (fibroids) are the most common uterine tumors and are especially common in Black women. They are benign smooth muscle tumors that are estrogen-sensitive, so they grow during pregnancy and shrink after menopause. They cause heavy menstrual bleeding, pelvic pressure, and infertility, but rarely, if ever, transform into leiomyosarcoma, which usually arises de novo in postmenopausal women as a single mass with necrosis and atypia.","ko":"자궁근종: 에스트로겐 민감(임신 시 커지고 폐경 후 작아짐), 육종 전환 드묾."},{"id":"rp19","steps":["1"],"system":"Reproductive","discipline":"Microbiology","topic":"HPV oncoproteins","stem":"A 34-year-old woman has a cervical biopsy that shows high-grade squamous intraepithelial lesion. PCR detects HPV type 16.\n\nThe HPV E6 protein contributes to malignant transformation by which of the following mechanisms?","options":["Blocking MHC class I expression","Activating the KRAS GTPase","Inserting viral DNA that activates c-myc","Inactivating the retinoblastoma protein","Promoting degradation of p53"],"answer":4,"explanation":"High-risk HPV types (16 and 18) produce oncoproteins E6 and E7. E6 promotes ubiquitin-mediated degradation of p53, removing the G1 checkpoint and apoptosis in response to DNA damage. E7 binds and inactivates Rb, releasing E2F to drive the cell cycle. Persistent infection progresses through dysplasia to cervical squamous cell carcinoma, which is prevented by vaccination and screening.","ko":"HPV: E6 → p53 분해, E7 → Rb 불활성화. (6은 53, 7은 Rb)"},{"id":"rp20","steps":["1"],"system":"Reproductive","discipline":"Pharmacology","topic":"Finasteride for BPH","stem":"A 68-year-old man has urinary frequency, nocturia, and a weak stream. Digital rectal examination shows a smooth, symmetrically enlarged prostate. His physician wants a drug that will shrink the gland over months and reduce the risk of urinary retention.\n\nWhich of the following drugs is most appropriate?","options":["Leuprolide","Tamsulosin","Finasteride","Flutamide","Oxybutynin"],"answer":2,"explanation":"Benign prostatic hyperplasia is nodular hyperplasia of the transition (periurethral) zone driven by dihydrotestosterone. Finasteride inhibits 5α-reductase type 2, lowering DHT, and shrinks the prostate over 6 to 12 months; it lowers PSA by about half. Tamsulosin blocks α1A receptors in prostatic smooth muscle and relieves symptoms quickly but does not shrink the gland. Prostate cancer usually arises in the peripheral zone.","ko":"BPH: finasteride(5α-reductase 억제)가 크기 축소, tamsulosin(α1A)은 증상만 빠르게."},{"id":"rp21","steps":["1"],"system":"Reproductive","discipline":"Pharmacology","topic":"GnRH agonist flare","stem":"A 72-year-old man with metastatic prostate cancer to the spine is started on continuous leuprolide. His oncologist also prescribes flutamide for the first few weeks.\n\nWhich of the following is the main reason for adding flutamide?","options":["To prevent hot flashes","To block the effects of the initial surge in testosterone","To reduce the risk of osteoporosis","To inhibit adrenal androgen synthesis","To increase the rate of LH suppression"],"answer":1,"explanation":"Leuprolide is a GnRH analog. Given in pulses it stimulates gonadotropins, but given continuously it downregulates GnRH receptors and suppresses LH and testosterone after an initial surge. The temporary rise in testosterone can worsen bone pain or cause spinal cord compression in metastatic disease, so an androgen receptor blocker such as flutamide or bicalutamide is given at the start. Abiraterone inhibits 17α-hydroxylase to block adrenal androgen synthesis.","ko":"지속 GnRH 작용제 → 초기 테스토스테론 flare → 처음에 flutamide 병용."},{"id":"rp22","steps":["1"],"system":"Reproductive","discipline":"Pharmacology","topic":"Combined oral contraceptive mechanism","stem":"A 22-year-old woman starts a combined estrogen-progestin oral contraceptive.\n\nWhich of the following is the main mechanism by which this medication prevents pregnancy?","options":["Direct toxicity to sperm in the vagina","Induction of a sterile inflammatory reaction in the endometrium","Suppression of the midcycle LH surge, preventing ovulation","Stimulation of corpus luteum regression","Blockade of progesterone receptors in the endometrium"],"answer":2,"explanation":"Combined oral contraceptives provide negative feedback on the hypothalamus and pituitary. The progestin mainly prevents the midcycle LH surge and thus ovulation, and the estrogen suppresses FSH and follicle development. Progestins also thicken cervical mucus and make the endometrium unfavorable for implantation. Copper IUDs work through a sterile inflammatory reaction, and mifepristone blocks progesterone receptors.","ko":"복합 경구피임약: 프로게스틴이 LH surge 억제 → 무배란. 자궁경부 점액 끈적."},{"id":"rp23","steps":["1"],"system":"Reproductive","discipline":"Physiology","topic":"hCG maintains corpus luteum","stem":"A 30-year-old woman becomes pregnant. Progesterone from the corpus luteum is essential to maintain the pregnancy for the first several weeks until the placenta takes over.\n\nWhich of the following hormones maintains the corpus luteum during this period?","options":["Luteinizing hormone from the anterior pituitary","Estriol from the placenta","Human chorionic gonadotropin from the syncytiotrophoblast","Prolactin from the anterior pituitary","Human placental lactogen"],"answer":2,"explanation":"Without pregnancy, the corpus luteum regresses after about 14 days as LH falls. After implantation, the syncytiotrophoblast secretes hCG, which is structurally similar to LH and acts on LH receptors to maintain the corpus luteum and its progesterone production during the first trimester. By about 8 to 10 weeks the placenta produces enough progesterone on its own. hCG is the basis of pregnancy tests.","ko":"hCG(합포체영양막) → LH 수용체 → 황체 유지(1삼분기 프로게스테론)."},{"id":"rp24","steps":["1"],"system":"Reproductive","discipline":"Pharmacology","topic":"Tamoxifen","stem":"A 52-year-old postmenopausal woman with estrogen receptor-positive breast cancer has taken an adjuvant oral medication for 3 years. She now has postmenopausal vaginal bleeding, and endometrial biopsy shows endometrial hyperplasia. Last year she had a deep vein thrombosis.\n\nWhich of the following drugs is she most likely taking?","options":["Anastrozole","Trastuzumab","Fulvestrant","Tamoxifen","Raloxifene"],"answer":3,"explanation":"Tamoxifen is a selective estrogen receptor modulator that blocks estrogen receptors in breast tissue but acts as a partial agonist in the endometrium and bone. It increases the risk of endometrial hyperplasia and carcinoma, venous thromboembolism, and hot flashes. Raloxifene is an antagonist in the endometrium, so it does not raise endometrial cancer risk, but it still increases thrombosis. Aromatase inhibitors such as anastrozole cause bone loss but not endometrial cancer.","ko":"Tamoxifen: 유방 길항, 자궁내막 작용 → 자궁내막암·혈전. Raloxifene은 자궁내막 길항."},{"id":"rp25","steps":["1"],"system":"Reproductive","discipline":"Physiology","topic":"Sexual differentiation","stem":"During normal male fetal development, a hormone secreted by Sertoli cells causes the paramesonephric (Müllerian) ducts to regress.\n\nWhich of the following hormones is responsible?","options":["Anti-Müllerian hormone","Inhibin B","Testosterone","Dihydrotestosterone","Estradiol"],"answer":0,"explanation":"The SRY gene on the Y chromosome directs the gonad to become a testis. Sertoli cells secrete anti-Müllerian hormone, which causes the Müllerian ducts (which would form the fallopian tubes, uterus, and upper vagina) to regress. Leydig cells secrete testosterone, which develops the Wolffian ducts into the epididymis, vas deferens, and seminal vesicles. DHT, made from testosterone by 5α-reductase, forms the external genitalia and prostate.","ko":"Sertoli → AMH(뮐러관 퇴화). Leydig → 테스토스테론(울프관). DHT → 외부생식기·전립선."},{"id":"rp26","steps":["1"],"system":"Reproductive","discipline":"Physiology","topic":"LH surge","stem":"A 28-year-old woman tracking her ovulation notices that her basal body temperature rises by about 0.5°C on day 15 of her 28-day cycle and stays elevated until menstruation.\n\nWhich of the following triggers the LH surge that precedes ovulation?","options":["Rising prolactin","A drop in GnRH pulse frequency","Falling inhibin B","Rising progesterone from the corpus luteum","Sustained high estrogen switching from negative to positive feedback"],"answer":4,"explanation":"In the follicular phase, the dominant follicle secretes increasing estradiol. When estrogen stays high for about 2 days, its feedback on the hypothalamus and pituitary switches from negative to positive, triggering the LH surge, which causes ovulation about 36 hours later. After ovulation, the corpus luteum secretes progesterone, which raises basal body temperature and prepares the endometrium (secretory phase). The luteal phase is fixed at about 14 days.","ko":"지속적 고에스트로겐 → 양성 되먹임 → LH surge → 36시간 후 배란. 프로게스테론 → 체온↑."},{"id":"rp27","steps":["1"],"system":"Reproductive","discipline":"Physiology","topic":"Menopause hormones","stem":"A 51-year-old woman has had no menstrual periods for 10 months, with hot flashes, night sweats, and vaginal dryness.\n\nWhich of the following hormone levels is most markedly elevated?","options":["Estradiol","Inhibin B","Anti-Müllerian hormone","FSH","Progesterone"],"answer":3,"explanation":"In menopause, the ovaries run out of responsive follicles, so estradiol and inhibin fall and negative feedback is lost; FSH rises markedly (more than LH) and is the best marker. Anti-Müllerian hormone, made by granulosa cells of small follicles, falls with declining ovarian reserve. Estrogen loss causes vasomotor symptoms, genitourinary atrophy, bone loss, and increased cardiovascular risk. Menopause before 40 is primary ovarian insufficiency.","ko":"폐경: FSH 가장 상승(> LH), 에스트로겐·인히빈·AMH↓."},{"id":"rp28","steps":["1"],"system":"Reproductive","discipline":"Physiology","topic":"Human placental lactogen","stem":"A 32-year-old woman develops gestational diabetes at 26 weeks of pregnancy. Her glucose tolerance was normal before pregnancy.\n\nWhich placental hormone contributes most to the insulin resistance of late pregnancy?","options":["Human chorionic gonadotropin","Human placental lactogen","Estriol","Relaxin","Oxytocin"],"answer":1,"explanation":"Human placental lactogen (human chorionic somatomammotropin) is secreted by the syncytiotrophoblast in increasing amounts during pregnancy. It antagonizes insulin and promotes lipolysis, increasing glucose and fatty acids available to the fetus. Progesterone, cortisol, and prolactin also contribute. When β cells cannot compensate, gestational diabetes results, increasing the risk of macrosomia, neonatal hypoglycemia, and later type 2 diabetes in the mother.","ko":"hPL(태반 락토겐) → 인슐린 길항 → 임신성 당뇨. 신생아 저혈당·거대아."},{"id":"rp29","steps":["1"],"system":"Reproductive","discipline":"Immunology","topic":"Rh immune globulin","stem":"A 27-year-old woman with blood type O negative is pregnant with her first child. The father is Rh-positive. Her antibody screen is negative. At 28 weeks, she receives an intramuscular injection that she will receive again after delivery if the baby is Rh-positive.\n\nWhich of the following best explains how this injection works?","options":["It suppresses maternal T cells","It clears fetal Rh-positive red cells from her circulation before she can make her own anti-D antibodies","It neutralizes anti-D IgM already in her circulation","It blocks transfer of maternal IgG across the placenta","It coats fetal red cells to prevent their destruction"],"answer":1,"explanation":"Rh immune globulin (anti-D IgG) is given to Rh-negative mothers at 28 weeks and within 72 hours of delivery of an Rh-positive infant, as well as after bleeding, miscarriage, or procedures. It binds and removes fetal Rh-positive cells that enter the maternal circulation, preventing sensitization. Without it, the mother can form anti-D IgG, which crosses the placenta in later pregnancies and causes hemolytic disease of the fetus and newborn (hydrops fetalis).","ko":"RhoGAM: 태아 Rh(+) 적혈구를 제거해 모체 감작 방지. 28주 + 분만 72시간 내."},{"id":"rp30","steps":["1"],"system":"Reproductive","discipline":"Pathology","topic":"Placenta accreta","stem":"A 36-year-old woman who has had three previous cesarean deliveries delivers vaginally at term. The placenta does not separate, and attempts at manual removal cause massive hemorrhage requiring hysterectomy. Pathology shows placental villi attached directly to the myometrium.\n\nWhich of the following is the underlying defect?","options":["Premature separation of a normally implanted placenta","Inadequate trophoblast invasion of spiral arteries","Infection of the chorion and amnion","Absent or deficient decidua basalis","Abnormally low implantation over the cervical os"],"answer":3,"explanation":"Placenta accreta spectrum occurs when the decidua basalis is defective, so villi attach to (accreta), invade (increta), or penetrate through (percreta) the myometrium. The major risk factors are prior cesarean delivery and placenta previa. It causes life-threatening hemorrhage at delivery. Placenta previa is implantation over the cervical os and causes painless bleeding; placental abruption is premature separation and causes painful bleeding.","ko":"유착태반: 탈락막 기저층 결손 → 융모가 자궁근층에 부착. 위험인자: 이전 제왕절개 + 전치태반."},{"id":"rp31","steps":["1"],"system":"Reproductive","discipline":"Pathology","topic":"Placental abruption","stem":"A 30-year-old woman at 34 weeks' gestation is brought in after using cocaine. She has sudden severe abdominal pain, dark vaginal bleeding, and a rigid, tender uterus with frequent contractions. The fetal heart rate shows late decelerations.\n\nWhich of the following is the most likely diagnosis?","options":["Placental abruption","Uterine rupture","Vasa previa","Preterm labor without complication","Placenta previa"],"answer":0,"explanation":"Placental abruption is premature separation of the placenta from the uterine wall, causing painful bleeding, a tender, hypertonic uterus, and fetal distress. Bleeding may be concealed behind the placenta. Risk factors include hypertension, preeclampsia, cocaine use, smoking, trauma, and prior abruption. It can cause DIC from release of tissue factor. Placenta previa causes painless bleeding, and vasa previa causes bleeding with rupture of membranes and rapid fetal distress.","ko":"태반조기박리: 통증 + 질출혈 + 단단한 자궁, 코카인·고혈압, DIC 위험. 전치태반은 무통성."},{"id":"rp32","steps":["1"],"system":"Reproductive","discipline":"Genetics","topic":"BRCA1 and ovarian cancer","stem":"A 44-year-old woman whose mother had breast cancer at 40 and whose sister had ovarian cancer at 46 tests positive for a germline BRCA1 mutation. She asks about her cancer risks.\n\nWhich type of ovarian tumor is she at greatest risk of developing?","options":["Dysgerminoma","High-grade serous carcinoma","Granulosa cell tumor","Mature cystic teratoma","Mucinous cystadenoma"],"answer":1,"explanation":"BRCA1 and BRCA2 encode proteins in homologous recombination DNA repair. Carriers have greatly increased risks of breast cancer and high-grade serous carcinoma of the ovary and fallopian tube, which often arises from the fimbriae. Serous carcinomas are often bilateral, have psammoma bodies, and raise CA-125. Risk-reducing salpingo-oophorectomy is recommended after childbearing. PARP inhibitors exploit the repair defect.","ko":"BRCA1/2: 상동재조합 결함 → 고등급 장액성 난소암(난관 기원), CA-125. PARP 억제제."},{"id":"rp33","steps":["1"],"system":"Reproductive","discipline":"Pathology","topic":"Struma ovarii","stem":"A 30-year-old woman has palpitations, weight loss, and tremor. TSH is suppressed, and free T4 is elevated, but her thyroid is not enlarged and radioactive iodine uptake in the neck is low. Pelvic imaging shows an ovarian mass containing fat, calcification, and teeth.\n\nWhich of the following best explains her hyperthyroidism?","options":["hCG stimulating the TSH receptor","Exogenous thyroid hormone use","Thyroiditis releasing stored hormone","Functional thyroid tissue within an ovarian teratoma","Ectopic TSH secretion by the tumor"],"answer":3,"explanation":"Mature cystic teratoma (dermoid cyst) is the most common ovarian germ cell tumor and contains tissues from all three germ layers, such as hair, teeth, and sebaceous material. Rarely, thyroid tissue predominates (struma ovarii) and produces thyroid hormone, causing hyperthyroidism with low neck uptake. Teratomas can cause ovarian torsion. Malignant transformation, usually to squamous cell carcinoma, is rare.","ko":"성숙 낭성 기형종: 3배엽(머리카락·치아), 염전 위험. 난소갑상선종 → 갑상선항진증(경부 섭취↓)."},{"id":"rp34","steps":["1"],"system":"Reproductive","discipline":"Pathology","topic":"Dysgerminoma","stem":"A 17-year-old girl has abdominal swelling and a palpable pelvic mass. Imaging shows a solid ovarian tumor. Serum LDH and β-hCG are mildly elevated, while AFP is normal. Histology shows sheets of large cells with clear cytoplasm and central nuclei, separated by fibrous septa with lymphocytes.\n\nWhich of the following is the most likely diagnosis?","options":["Granulosa cell tumor","Krukenberg tumor","Serous cystadenoma","Dysgerminoma","Yolk sac tumor"],"answer":3,"explanation":"Dysgerminoma is the ovarian counterpart of testicular seminoma and is the most common malignant germ cell tumor in adolescent girls and young women. It has fried-egg cells and can raise LDH and hCG, but not AFP. It is associated with Turner syndrome and gonadal dysgenesis. It is very sensitive to chemotherapy and radiation with a good prognosis. Yolk sac tumor raises AFP.","ko":"미분화세포종 = 난소 정상피종, fried egg cell, LDH·hCG↑(AFP 정상), Turner 연관."},{"id":"rp35","steps":["1"],"system":"Reproductive","discipline":"Pathology","topic":"Sertoli-Leydig cell tumor","stem":"A 28-year-old woman has stopped menstruating and developed a deeper voice, acne, hair growth on her face and chest, and clitoral enlargement over 6 months. Serum testosterone is markedly elevated, while DHEA-S is normal. Ultrasonography shows a solid ovarian mass.\n\nWhich of the following is the most likely diagnosis?","options":["Late-onset congenital adrenal hyperplasia","Sertoli-Leydig cell tumor","Polycystic ovary syndrome","Granulosa cell tumor","Adrenocortical carcinoma"],"answer":1,"explanation":"Sertoli-Leydig cell tumor is a sex cord-stromal tumor that secretes androgens and causes rapid virilization; Leydig cells may contain Reinke crystals. Rapid onset with very high testosterone and normal DHEA-S indicates an ovarian rather than adrenal source. PCOS causes gradual hirsutism without frank virilization, and adrenal tumors raise DHEA-S. Granulosa cell tumors secrete estrogen.","ko":"Sertoli-Leydig 세포종: 빠른 남성화, 테스토스테론↑(DHEA-S 정상 = 난소 기원). Reinke 결정."},{"id":"rp36","steps":["1"],"system":"Reproductive","discipline":"Pathology","topic":"Type II endometrial carcinoma","stem":"A 70-year-old thin woman has postmenopausal bleeding. She has no history of obesity, diabetes, or hormone therapy. Endometrial biopsy shows complex papillary structures with highly atypical cells and psammoma bodies. Immunohistochemistry shows strong, diffuse p53 staining. The surrounding endometrium is atrophic.\n\nWhich of the following is the most likely diagnosis?","options":["Choriocarcinoma","Endometrial polyp","Leiomyosarcoma","Serous endometrial carcinoma","Endometrioid adenocarcinoma arising from hyperplasia"],"answer":3,"explanation":"Endometrial carcinoma has two main types. Endometrioid (type I) carcinoma is the most common, arises from endometrial hyperplasia driven by unopposed estrogen (obesity, PCOS, tamoxifen), occurs around menopause, and has PTEN mutations and a good prognosis. Serous (type II) carcinoma occurs in older, thin women with atrophic endometrium, is not estrogen-related, has TP53 mutations and psammoma bodies, and is aggressive.","ko":"자궁내막암: I형(유사내막형) 에스트로겐·PTEN·양호. II형(장액성) 고령·위축 내막·p53·불량."},{"id":"rp37","steps":["1"],"system":"Reproductive","discipline":"Pathology","topic":"Lichen sclerosus","stem":"A 62-year-old woman has intense vulvar itching for 2 years. Examination shows thin, white, parchment-like skin of the vulva with loss of the labia minora. Biopsy shows a thinned epidermis with a band of dermal fibrosis and lymphocytes beneath it.\n\nThis condition slightly increases her risk of which of the following?","options":["Endometrial carcinoma","Vulvar melanoma","Ovarian carcinoma","Bartholin gland abscess","Vulvar squamous cell carcinoma"],"answer":4,"explanation":"Lichen sclerosus causes thin, white, parchment-like vulvar skin with itching, often in postmenopausal women, and may be autoimmune. It slightly increases the risk of HPV-negative vulvar squamous cell carcinoma in older women. Treatment is high-potency topical corticosteroids. Lichen simplex chronicus causes thickened, leathery skin from scratching and does not increase cancer risk. HPV-related vulvar cancer occurs in younger women.","ko":"경화태선: 양피지 같은 흰 외음부, 가려움, 비HPV 외음부 편평세포암 위험 약간↑."},{"id":"rp38","steps":["1"],"system":"Reproductive","discipline":"Pathology","topic":"Paget disease of the nipple","stem":"A 58-year-old woman has a red, scaly, crusted rash on her right nipple and areola that has not improved with topical steroids for 3 months. Biopsy shows large cells with clear cytoplasm within the epidermis.\n\nWhich of the following is most likely present?","options":["Fibrocystic change","Psoriasis of the nipple","Fat necrosis","An underlying ductal carcinoma in situ or invasive carcinoma","Eczema with secondary infection"],"answer":3,"explanation":"Paget disease of the nipple is caused by malignant cells from an underlying ductal carcinoma (in situ or invasive) that extend through the ducts into the nipple epidermis. It presents as an eczematous, scaly, or ulcerated nipple that does not respond to treatment. Biopsy shows Paget cells, and the patient needs mammography and evaluation for the underlying cancer. Extramammary Paget disease of the vulva is usually not associated with an underlying tumor.","ko":"유방 Paget병: 습진 같은 유두 병변 → 하부 DCIS·침윤성 유관암 거의 항상 동반."},{"id":"rp39","steps":["1"],"system":"Reproductive","discipline":"Pathology","topic":"Inflammatory breast carcinoma","stem":"A 50-year-old woman has a red, warm, swollen left breast that developed over 4 weeks. The skin is thickened with an orange-peel appearance and dimpling. She has no fever, and antibiotics have not helped. No discrete mass is felt.\n\nWhich of the following explains the skin findings?","options":["Duct ectasia with periductal inflammation","Fibrosis from prior radiation","Tumor cells blocking dermal lymphatics","Fat necrosis after trauma","Bacterial infection of the lactiferous ducts"],"answer":2,"explanation":"Inflammatory breast carcinoma is an aggressive cancer in which tumor emboli block dermal lymphatics, causing edema, redness, warmth, and peau d'orange skin, often without a discrete mass. It mimics mastitis but does not respond to antibiotics and has a poor prognosis. Skin dimpling and nipple retraction can also occur when tumor involves Cooper ligaments. Biopsy of the skin shows tumor in dermal lymphatics.","ko":"염증성 유방암: 진피 림프관 종양 색전 → 발적·부종·귤껍질 피부, 항생제 무반응, 예후 불량."},{"id":"rp40","steps":["1"],"system":"Reproductive","discipline":"Anatomy","topic":"Testicular torsion","stem":"A 14-year-old boy wakes with sudden severe pain in his left testis and vomiting. The left testis is high-riding and lies horizontally. The cremasteric reflex is absent on the left. Doppler ultrasonography shows absent blood flow to the left testis.\n\nWhich anatomic abnormality predisposes to this condition?","options":["Undescended testis in the inguinal canal","Failure of the tunica vaginalis to attach the testis posteriorly (bell clapper deformity)","Absence of the gubernaculum","Dilation of the pampiniform plexus","Patent processus vaginalis"],"answer":1,"explanation":"Testicular torsion is twisting of the spermatic cord, usually in adolescents, often because of a bell clapper deformity in which the testis lacks normal posterior fixation within the tunica vaginalis. Venous then arterial obstruction causes ischemia; the testis can usually be saved within about 6 hours. Findings include a high, horizontal testis and absent cremasteric reflex. Treatment is emergency surgical detorsion with fixation of both testes.","ko":"고환 염전: bell clapper 기형, 고환거근반사 소실, 높고 수평인 고환 → 6시간 내 수술."},{"id":"rp41","steps":["1"],"system":"Reproductive","discipline":"Pharmacology","topic":"PDE5 inhibitors","stem":"A 58-year-old man with erectile dysfunction is prescribed sildenafil. He reports that after taking it, objects sometimes look blue-tinted. His physician reminds him never to take it with nitroglycerin.\n\nWhich of the following explains the visual side effect?","options":["Increased intraocular pressure","Inhibition of PDE6 in the retina","Stimulation of muscarinic receptors in the iris","Blockade of α1 receptors in the eye","Inhibition of PDE3 in the heart"],"answer":1,"explanation":"PDE5 inhibitors (sildenafil, tadalafil) block breakdown of cGMP in the corpus cavernosum, enhancing nitric oxide-mediated smooth muscle relaxation and erection. Sildenafil also weakly inhibits PDE6 in retinal photoreceptors, causing blue-tinged vision. Other adverse effects are headache, flushing, and dyspepsia. Combining PDE5 inhibitors with nitrates causes severe hypotension because both raise cGMP. They are also used for pulmonary hypertension and BPH (tadalafil).","ko":"Sildenafil: PDE5 억제(cGMP↑), PDE6 억제 → 청시증. 질산염 병용 금기."},{"id":"rp42","steps":["1"],"system":"Reproductive","discipline":"Physiology","topic":"Anabolic steroid use","stem":"A 26-year-old competitive bodybuilder has acne, gynecomastia, and small, soft testes. His partner has been unable to conceive, and semen analysis shows a very low sperm count. Serum LH and FSH are suppressed, and HDL cholesterol is low.\n\nWhich of the following best explains his low sperm count?","options":["Androgens directly destroy Sertoli cells","Androgens cause obstruction of the vas deferens","Elevated estrogen blocks sperm motility","Elevated prolactin suppresses spermatogenesis","Exogenous androgens suppress LH and FSH, reducing intratesticular testosterone"],"answer":4,"explanation":"Exogenous anabolic steroids provide negative feedback to the hypothalamus and pituitary, suppressing GnRH, LH, and FSH. Without LH, Leydig cells make little testosterone, so intratesticular testosterone (which is much higher than serum levels and needed for spermatogenesis) falls, and without FSH, Sertoli cells cannot support sperm development. The result is testicular atrophy and infertility. Aromatization of excess androgen to estrogen causes gynecomastia.","ko":"외인성 안드로겐 → LH·FSH↓ → 고환 내 테스토스테론↓ → 정자 감소·고환 위축, 여성형 유방."},{"id":"rp43","steps":["1"],"system":"Reproductive","discipline":"Pharmacology","topic":"Clomiphene","stem":"A 29-year-old woman with polycystic ovary syndrome wants to become pregnant. She is started on a medication taken on days 3 through 7 of her cycle to induce ovulation.\n\nClomiphene induces ovulation by which of the following mechanisms?","options":["Blocking progesterone receptors in the endometrium","Directly stimulating FSH receptors on granulosa cells","Acting as a continuous GnRH agonist","Blocking estrogen receptors in the hypothalamus, increasing GnRH and gonadotropin release","Inhibiting aromatase in the ovary"],"answer":3,"explanation":"Clomiphene is a selective estrogen receptor modulator that blocks estrogen receptors in the hypothalamus, preventing negative feedback. GnRH, FSH, and LH increase, stimulating follicle development and ovulation. Adverse effects include hot flashes, visual disturbances, multiple pregnancy, and ovarian hyperstimulation. Letrozole, an aromatase inhibitor, is now often preferred in PCOS and works by lowering estrogen feedback.","ko":"Clomiphene: 시상하부 에스트로겐 수용체 차단 → 음성 되먹임 해제 → FSH·LH↑ → 배란."},{"id":"rp44","steps":["1"],"system":"Reproductive","discipline":"Pharmacology","topic":"Mifepristone","stem":"A 24-year-old woman at 7 weeks' gestation chooses medication abortion. She takes one drug in the clinic and a second drug 24 to 48 hours later at home, which causes uterine contractions.\n\nThe first drug acts by which of the following mechanisms?","options":["Inhibiting dihydrofolate reductase","Stimulating oxytocin receptors","Blocking progesterone receptors","Blocking estrogen receptors","Stimulating prostaglandin E1 receptors"],"answer":2,"explanation":"Mifepristone is a progesterone (and glucocorticoid) receptor antagonist. Blocking progesterone causes decidual breakdown, cervical softening, and increased uterine sensitivity to prostaglandins. Misoprostol, a PGE1 analog, is then given to cause uterine contractions and expulsion. Misoprostol is also used to prevent NSAID-induced ulcers and is contraindicated in pregnancy for that use. Methotrexate is used for ectopic pregnancy.","ko":"약물 유산: mifepristone(프로게스테론 수용체 길항) → misoprostol(PGE1 유사체, 자궁수축)."},{"id":"rs01","steps":["1"],"system":"Respiratory","discipline":"Pharmacology","topic":"Acetazolamide for altitude","stem":"A 30-year-old woman plans to hike to a summit at 4300 m (14,100 ft). On a previous trip she developed headache, nausea, and insomnia on her first night at altitude. She is given a medication to start the day before her ascent.\n\nThis drug helps her acclimatize mainly by which of the following effects?","options":["Inducing a metabolic acidosis that stimulates ventilation","Increasing hemoglobin affinity for oxygen","Decreasing cerebral blood flow","Increasing erythropoietin secretion","Dilating the pulmonary arteries"],"answer":0,"explanation":"At high altitude, low PaO2 stimulates peripheral chemoreceptors and causes hyperventilation, but the resulting respiratory alkalosis limits further ventilation. Acetazolamide inhibits carbonic anhydrase in the proximal tubule, causing bicarbonate diuresis and a mild metabolic acidosis that allows ventilation to increase further. Chronic acclimatization also includes increased erythropoietin, increased 2,3-BPG, and hypoxic pulmonary vasoconstriction.","ko":"고산병 예방 acetazolamide: HCO3 배설 → 대사성 산증 → 환기↑."},{"id":"rs02","steps":["1"],"system":"Respiratory","discipline":"Physiology","topic":"Normal A-a gradient hypoxemia","stem":"Arterial blood gas analysis is obtained in five hypoxemic patients breathing room air.\n\nIn which of the following patients is the alveolar-arterial (A-a) oxygen gradient most likely to be normal?","options":["A 70-year-old man with idiopathic pulmonary fibrosis","A 45-year-old man with pulmonary embolism","A 60-year-old woman with lobar pneumonia","A 35-year-old woman with acute respiratory distress syndrome","A 22-year-old man with heroin overdose"],"answer":4,"explanation":"Hypoxemia with a normal A-a gradient occurs when alveolar PO2 itself is low: hypoventilation (opioid overdose, neuromuscular weakness, obesity hypoventilation) or high altitude. In hypoventilation, rising PaCO2 lowers alveolar PO2 according to the alveolar gas equation. V/Q mismatch (pneumonia, pulmonary embolism), shunt (ARDS), and diffusion limitation (fibrosis) all widen the A-a gradient.","ko":"A-a gradient 정상 저산소증 = 저환기, 고지대. 나머지(V/Q, 션트, 확산)는 증가."},{"id":"rs03","steps":["1"],"system":"Respiratory","discipline":"Physiology","topic":"Shunt physiology","stem":"A 58-year-old woman develops hypoxemia on the second day after abdominal surgery. Chest x-ray shows complete collapse of the left lower lobe. Increasing her inspired oxygen from 21% to 100% raises her PaO2 only slightly.\n\nWhich of the following best explains the poor response to supplemental oxygen?","options":["Decreased respiratory drive","Decreased hemoglobin affinity for oxygen","Ventilation of alveoli that receive no perfusion","Blood perfusing alveoli that receive no ventilation","Thickening of the alveolar-capillary membrane"],"answer":3,"explanation":"Atelectasis creates a right-to-left intrapulmonary shunt (V/Q = 0): blood passes through alveoli that are not ventilated and returns to the left heart deoxygenated. Supplemental oxygen cannot reach these alveoli, so PaO2 improves little. Hypoxemia from V/Q mismatch, hypoventilation, or diffusion limitation improves with 100% oxygen. Dead space (V/Q → ∞), as in pulmonary embolism, wastes ventilation.","ko":"100% O2에 반응 없는 저산소증 = 션트 (V/Q = 0, 무기폐·ARDS)."},{"id":"rs04","steps":["1"],"system":"Respiratory","discipline":"Pathology","topic":"ARDS","stem":"A 47-year-old man is admitted with severe acute pancreatitis. Two days later he becomes severely dyspneic. PaO2 is 58 mm Hg on 60% oxygen. Chest x-ray shows bilateral diffuse alveolar opacities. Echocardiography shows normal left ventricular function, and pulmonary capillary wedge pressure is 10 mm Hg.\n\nLung tissue from this patient would most likely show which of the following?","options":["Heart failure cells in the alveoli","Dilated airways with mucus plugging","Hyaline membranes lining the alveoli","Noncaseating granulomas","Alveoli filled with neutrophils confined to one lobe"],"answer":2,"explanation":"Acute respiratory distress syndrome is acute bilateral lung injury with hypoxemia not explained by heart failure. Triggers include sepsis, pancreatitis, aspiration, trauma, and transfusion. Neutrophils and cytokines damage the alveolar-capillary membrane, and leaked protein-rich fluid forms hyaline membranes (diffuse alveolar damage). Heart failure cells (hemosiderin-laden macrophages) indicate chronic pulmonary congestion, which is excluded here by the normal wedge pressure.","ko":"ARDS = 미만성 폐포 손상, hyaline membrane, PCWP 정상."},{"id":"rs05","steps":["1"],"system":"Respiratory","discipline":"Physiology","topic":"Neonatal respiratory distress","stem":"A male newborn is delivered by cesarean section at 30 weeks' gestation to a mother with poorly controlled gestational diabetes. Within an hour he has grunting, nasal flaring, and intercostal retractions. Chest x-ray shows diffuse ground-glass opacities with air bronchograms.\n\nDeficient function of which of the following cells is the most likely cause?","options":["Type II pneumocytes","Goblet cells","Alveolar macrophages","Club (Clara) cells","Type I pneumocytes"],"answer":0,"explanation":"Neonatal respiratory distress syndrome results from deficiency of surfactant, mainly dipalmitoylphosphatidylcholine, made by type II pneumocytes. Surfactant lowers alveolar surface tension and prevents collapse of small alveoli (law of Laplace). Risks include prematurity, maternal diabetes (fetal insulin inhibits surfactant synthesis), and cesarean delivery without labor (less fetal cortisol). A lecithin-to-sphingomyelin ratio below 1.5 predicts it, and maternal corticosteroids before delivery reduce it.","ko":"신생아 RDS = 2형 폐포세포 surfactant 결핍. 모체 당뇨·제왕절개·미숙아."},{"id":"rs06","steps":["1"],"system":"Respiratory","discipline":"Pharmacology","topic":"Aspirin-exacerbated respiratory disease","stem":"A 38-year-old woman with asthma and recurrent nasal polyps comes to the emergency department because of severe wheezing and nasal congestion that began 1 hour after she took aspirin for a headache.\n\nWhich of the following drugs most directly targets the mechanism of her reaction?","options":["Theophylline","Tiotropium","Cromolyn","Omalizumab","Montelukast"],"answer":4,"explanation":"In aspirin-exacerbated respiratory disease (asthma, nasal polyps, and NSAID sensitivity), blocking cyclooxygenase shunts arachidonic acid toward the lipoxygenase pathway, increasing cysteinyl leukotrienes (LTC4, LTD4, LTE4) that cause bronchoconstriction. Montelukast and zafirlukast block the cysteinyl leukotriene receptor, and zileuton inhibits 5-lipoxygenase. The reaction is not IgE-mediated, so omalizumab and cromolyn are not targeted to it.","ko":"아스피린 유발 천식: COX 차단 → 류코트리엔↑ → montelukast/zileuton."},{"id":"rs07","steps":["1"],"system":"Respiratory","discipline":"Pharmacology","topic":"Theophylline interaction","stem":"A 72-year-old man with COPD has taken theophylline for years. Five days after starting ciprofloxacin for a urinary tract infection, he has nausea, tremor, and a generalized seizure. ECG shows multifocal atrial tachycardia.\n\nWhich of the following best explains his condition?","options":["Displacement of theophylline from plasma proteins","Ciprofloxacin-induced lowering of the seizure threshold alone","Induction of hepatic CYP3A4 increasing a toxic metabolite","Decreased renal excretion of theophylline","Inhibition of hepatic CYP1A2 decreasing theophylline metabolism"],"answer":4,"explanation":"Theophylline is a methylxanthine that inhibits phosphodiesterase and blocks adenosine receptors. It has a narrow therapeutic index and is metabolized mainly by CYP1A2. Inhibitors such as ciprofloxacin and cimetidine raise its levels, causing GI upset, tremor, tachyarrhythmias, and seizures. Fluoroquinolones can lower the seizure threshold on their own, but the arrhythmia and other features point to theophylline toxicity.","ko":"Theophylline: 치료역 좁음, CYP1A2 대사 → ciprofloxacin 병용 시 독성(경련·부정맥)."},{"id":"rs08","steps":["1"],"system":"Respiratory","discipline":"Pathology","topic":"Alpha-1 antitrypsin deficiency","stem":"A 38-year-old man who has never smoked comes to the physician because of progressive dyspnea. Chest CT shows panacinar emphysema most prominent in the lower lobes. He also has mildly elevated aminotransferases, and a liver biopsy shows PAS-positive, diastase-resistant globules in periportal hepatocytes.\n\nWhich of the following is the most likely underlying cause?","options":["Mutation in fibrillin-1","Smoking-related protease imbalance","Defective chloride channel in airway epithelium","Misfolded protease inhibitor retained in hepatocytes","Immotile cilia due to a dynein arm defect"],"answer":3,"explanation":"Alpha-1 antitrypsin deficiency (most severe with the PiZZ genotype) produces a misfolded protein that accumulates in the endoplasmic reticulum of hepatocytes (PAS-positive globules), causing cirrhosis. Low circulating levels leave neutrophil elastase unopposed in the lung, causing panacinar emphysema that is worst in the lower lobes. Smoking-related emphysema is centriacinar and upper-lobe predominant.","ko":"A1AT 결핍: 하엽 panacinar 폐기종 + 간 PAS(+) 봉입체 → 간경변."},{"id":"rs09","steps":["1"],"system":"Respiratory","discipline":"Biochemistry","topic":"Cystic fibrosis mutation","stem":"A 2-year-old boy has recurrent pneumonia, greasy foul-smelling stools, and poor weight gain. Sweat chloride concentration is 92 mEq/L. Genetic testing shows homozygous deletion of phenylalanine at position 508 of the affected gene.\n\nThis mutation causes disease mainly through which of the following mechanisms?","options":["Protein misfolding with retention and degradation in the endoplasmic reticulum","Increased degradation of the protein at the cell surface only","Absent transcription of the gene","Normal membrane protein that fails to open (gating defect)","Premature stop codon producing a truncated protein"],"answer":0,"explanation":"Cystic fibrosis is an autosomal recessive disorder of the CFTR chloride channel on chromosome 7. The most common mutation, ΔF508, causes misfolding; the protein is retained in the ER and degraded by proteasomes, so little reaches the apical membrane. In the airways and pancreas, reduced chloride secretion and increased sodium absorption dehydrate secretions; in sweat glands, chloride cannot be reabsorbed, so sweat chloride is high. CFTR modulators such as elexacaftor-tezacaftor-ivacaftor help the protein fold and open.","ko":"CF ΔF508 = 단백 접힘 이상 → ER에서 분해 (막까지 못 감)."},{"id":"rs10","steps":["1"],"system":"Respiratory","discipline":"Pathology","topic":"Sarcoidosis hypercalcemia","stem":"A 34-year-old Black woman comes to the physician because of dry cough, fatigue, and painful red nodules on her shins. Chest x-ray shows bilateral hilar lymphadenopathy. Serum calcium is 11.6 mg/dL and PTH is low. Transbronchial biopsy shows noncaseating granulomas.\n\nWhich of the following best explains her hypercalcemia?","options":["Osteolytic bone lesions","Excess dietary vitamin D intake","Secretion of PTH-related peptide by granulomas","Increased 1α-hydroxylase activity in activated macrophages","Increased renal calcium reabsorption caused by PTH"],"answer":3,"explanation":"Sarcoidosis is a granulomatous disease with noncaseating granulomas, bilateral hilar adenopathy, erythema nodosum, uveitis, and elevated ACE. Activated macrophages in granulomas express 1α-hydroxylase and convert 25-hydroxyvitamin D into calcitriol independently of PTH, increasing intestinal calcium absorption. PTH is appropriately suppressed. The same mechanism causes hypercalcemia in tuberculosis and some lymphomas.","ko":"사르코이드증 고칼슘혈증 = 대식세포 1α-hydroxylase → 칼시트리올↑ (PTH↓)."},{"id":"rs11","steps":["1"],"system":"Respiratory","discipline":"Pathology","topic":"Squamous cell lung carcinoma","stem":"A 67-year-old man with a 60-pack-year smoking history comes to the physician because of a cough, weight loss, and constipation. Serum calcium is 13.2 mg/dL and PTH is low. Chest CT shows a 4-cm cavitating mass near the right main bronchus. Biopsy shows keratin pearls and intercellular bridges.\n\nWhich of the following is the most likely diagnosis?","options":["Small cell carcinoma","Large cell carcinoma","Bronchial carcinoid tumor","Squamous cell carcinoma","Adenocarcinoma"],"answer":3,"explanation":"Squamous cell carcinoma of the lung is a centrally located, smoking-associated tumor that often cavitates. It shows keratin pearls and intercellular bridges and can secrete PTH-related peptide, causing hypercalcemia with suppressed PTH. Small cell carcinoma is also central but is associated with SIADH, ACTH secretion, and Lambert-Eaton syndrome. Adenocarcinoma is usually peripheral.","ko":"폐 편평세포암: 중심성·공동·PTHrP 고칼슘혈증·keratin pearl."},{"id":"rs12","steps":["1"],"system":"Respiratory","discipline":"Immunology","topic":"Lambert-Eaton syndrome","stem":"A 62-year-old woman who smokes has had progressive weakness of her thighs and shoulders for 3 months, making it hard to climb stairs. Her grip strength improves after repeated effort. She has a dry mouth, and deep tendon reflexes are reduced. Chest CT shows a central lung mass.\n\nAntibodies against which of the following are most likely responsible for her weakness?","options":["Voltage-gated potassium channels","Presynaptic voltage-gated calcium channels","Postsynaptic nicotinic acetylcholine receptors","Muscle-specific kinase","Aquaporin-4"],"answer":1,"explanation":"Lambert-Eaton myasthenic syndrome is a paraneoplastic disorder, most often with small cell lung carcinoma, caused by antibodies to presynaptic voltage-gated calcium channels, which reduce acetylcholine release. Proximal weakness improves with repeated use as calcium builds up in the nerve terminal. Autonomic symptoms such as dry mouth and reduced reflexes are common. Myasthenia gravis, caused by anti-AChR antibodies, worsens with use and often involves the eyes.","ko":"Lambert-Eaton = 시냅스전 VGCC 항체, 반복 시 호전, 소세포폐암."},{"id":"rs13","steps":["1"],"system":"Respiratory","discipline":"Pathology","topic":"Lung adenocarcinoma","stem":"A 52-year-old woman who has never smoked comes to the physician because of a persistent cough. Chest CT shows a 3-cm spiculated mass in the periphery of the left upper lobe. Biopsy shows malignant glands that produce mucin. Molecular testing shows an activating EGFR mutation.\n\nWhich of the following is the most likely diagnosis?","options":["Malignant mesothelioma","Squamous cell carcinoma","Bronchial carcinoid tumor","Small cell carcinoma","Adenocarcinoma"],"answer":4,"explanation":"Adenocarcinoma is the most common lung cancer overall and the most common in people who have never smoked, especially women. It is typically peripheral and forms mucin-producing glands. Activating mutations in EGFR, ALK, ROS1, or KRAS are common and guide targeted therapy; EGFR-mutant tumors respond to tyrosine kinase inhibitors such as osimertinib. Squamous and small cell carcinomas are central and strongly linked to smoking.","ko":"비흡연 여성 말초 폐암 = 선암, EGFR
