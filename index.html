ng independently of erythropoietin, so EPO is low. Increased red cell mass causes hyperviscosity, thrombosis (including Budd-Chiari syndrome), and aquagenic pruritus from basophil histamine release. Treatment is phlebotomy, aspirin, and hydroxyurea. Secondary polycythemia from hypoxia or tumors has high EPO.","ko":"진성 적혈구증가증: JAK2 V617F, EPO↓, 온수 후 소양증, 혈전 → 사혈·아스피린·hydroxyurea."},{"id":"hm35","steps":["1"],"system":"Hematology & Oncology","discipline":"Pathology","topic":"Primary myelofibrosis","stem":"A 66-year-old man has fatigue, early satiety, and weight loss. He has massive splenomegaly. Hemoglobin is 8.5 g/dL. The peripheral smear shows teardrop-shaped red cells and nucleated red cells with immature myeloid cells. Bone marrow aspiration yields no material, and biopsy shows extensive fibrosis.\n\nWhich of the following best explains the splenomegaly?","options":["Red cell sequestration due to spherocytosis","Extramedullary hematopoiesis as the fibrotic marrow fails","Portal hypertension from cirrhosis","Infiltration by hairy B cells","Storage of glucocerebroside in macrophages"],"answer":1,"explanation":"Primary myelofibrosis is a myeloproliferative neoplasm (often with JAK2, CALR, or MPL mutations) in which abnormal megakaryocytes release fibrogenic factors, replacing marrow with fibrosis. Hematopoiesis moves to the spleen and liver (extramedullary hematopoiesis), causing massive splenomegaly. Red cells squeezed through fibrotic marrow become teardrop-shaped (dacrocytes), and immature cells appear in the blood (leukoerythroblastic picture). A dry tap is common.","ko":"원발성 골수섬유증: 골수 섬유화 → 비장 골수외조혈(거대 비장), 눈물방울 적혈구, 백적아구성 혈액상."},{"id":"hm36","steps":["1"],"system":"Hematology & Oncology","discipline":"Pathology","topic":"Mantle cell lymphoma","stem":"A 64-year-old man has generalized lymphadenopathy, splenomegaly, and multiple polyps throughout his GI tract. Lymph node biopsy shows small to medium lymphocytes with irregular nuclei. The cells are CD5-positive, CD23-negative, and strongly express cyclin D1.\n\nWhich translocation is most likely present?","options":["t(8;14)","t(11;14)","t(15;17)","t(14;18)","t(9;22)"],"answer":1,"explanation":"Mantle cell lymphoma is a B-cell lymphoma of older men that is CD5-positive and CD23-negative. t(11;14) places cyclin D1 next to the immunoglobulin heavy chain locus, driving the G1-to-S transition. It is aggressive and often widespread at diagnosis, sometimes with multiple lymphomatous polyps in the GI tract. CLL is also CD5-positive but CD23-positive.","ko":"외투세포 림프종: t(11;14) 사이클린 D1, CD5+/CD23−, 고령 남성, 위장관 다발 용종."},{"id":"hm37","steps":["1"],"system":"Hematology & Oncology","discipline":"Pathology","topic":"Adult T-cell leukemia/lymphoma","stem":"A 55-year-old man from southern Japan has a generalized skin rash, lymphadenopathy, hepatosplenomegaly, and confusion. Serum calcium is 14.1 mg/dL, and x-rays show lytic bone lesions. The smear shows lymphocytes with lobulated, flower-shaped nuclei that are CD4-positive.\n\nWhich of the following is the cause of this malignancy?","options":["Human T-lymphotropic virus type 1","Hepatitis C virus","HIV directly transforming T cells","Epstein-Barr virus","Human herpesvirus 8"],"answer":0,"explanation":"Adult T-cell leukemia/lymphoma is a CD4+ T-cell neoplasm caused by HTLV-1, a retrovirus endemic in Japan, the Caribbean, and parts of Africa. It causes skin lesions, lymphadenopathy, hepatosplenomegaly, lytic bone lesions, and hypercalcemia, with flower cells on the smear. HTLV-1 also causes tropical spastic paraparesis. HHV-8 causes Kaposi sarcoma and primary effusion lymphoma.","ko":"성인 T세포 백혈병: HTLV-1(일본·카리브), CD4+ 꽃 모양 핵, 고칼슘·용해성 골병변."},{"id":"hm38","steps":["1"],"system":"Hematology & Oncology","discipline":"Pathology","topic":"Mycosis fungoides","stem":"A 60-year-old man has had itchy, scaly red patches on his trunk and buttocks for years that did not respond to eczema treatment. They have become thicker plaques. Biopsy shows atypical CD4+ T cells with folded, cerebriform nuclei in the epidermis, forming small clusters. Later, similar cells are found in his blood.\n\nWhich of the following is the most likely diagnosis?","options":["Chronic lymphocytic leukemia with skin involvement","Adult T-cell leukemia","Langerhans cell histiocytosis","Psoriasis","Mycosis fungoides progressing to Sézary syndrome"],"answer":4,"explanation":"Mycosis fungoides is a cutaneous T-cell lymphoma of CD4+ cells that progresses from patches to plaques to tumors. Atypical T cells with cerebriform nuclei invade the epidermis and form Pautrier microabscesses. When the cells spread to the blood with generalized erythroderma, it is Sézary syndrome. It is often initially mistaken for eczema or psoriasis.","ko":"균상식육종: 피부 CD4+ T세포 림프종, 뇌회 모양 핵, Pautrier 미세농양 → 혈액 침범 시 Sézary 증후군."},{"id":"hm39","steps":["1"],"system":"Hematology & Oncology","discipline":"Pathology","topic":"Waldenström macroglobulinemia","stem":"A 70-year-old man has fatigue, blurred vision, nosebleeds, and headaches. Retinal veins are dilated and tortuous with hemorrhages. Serum protein electrophoresis shows a monoclonal IgM spike, and serum viscosity is high. Bone marrow shows lymphoplasmacytic cells. X-rays show no lytic bone lesions.\n\nWhich of the following is the most appropriate immediate treatment for his visual and bleeding symptoms?","options":["Radiation therapy to the bone marrow","Bisphosphonates","Splenectomy","Allopurinol","Plasmapheresis"],"answer":4,"explanation":"Waldenström macroglobulinemia is a lymphoplasmacytic lymphoma producing monoclonal IgM, often with MYD88 L265P mutations. Large IgM pentamers raise blood viscosity, causing headache, visual changes, bleeding (impaired platelet function), and neurologic symptoms. Unlike multiple myeloma, it does not cause lytic bone lesions or hypercalcemia. Hyperviscosity is treated urgently with plasmapheresis, followed by therapy such as rituximab-based regimens or BTK inhibitors.","ko":"Waldenström: 단클론 IgM → 과점도(시력·출혈), 용해성 골병변 없음 → 혈장교환."},{"id":"hm40","steps":["1"],"system":"Hematology & Oncology","discipline":"Immunology","topic":"TRALI","stem":"A 60-year-old woman receives a unit of fresh frozen plasma before surgery. Within 2 hours she develops acute dyspnea, fever, and hypotension, with bilateral pulmonary infiltrates. Her jugular venous pressure is normal, and BNP is not elevated. Investigation shows the plasma donor was a woman with several prior pregnancies.\n\nWhich of the following is the most likely mechanism?","options":["Recipient anti-A antibodies lysing donor red cells","Bacterial contamination of the plasma","IgE antibodies against donor plasma proteins","Volume overload from rapid transfusion","Donor anti-HLA or anti-neutrophil antibodies activating recipient neutrophils in the lung"],"answer":4,"explanation":"Transfusion-related acute lung injury occurs within 6 hours of transfusion, usually of plasma-rich products. Donor antibodies against recipient HLA or neutrophil antigens, often from multiparous women, bind recipient neutrophils, which become sequestered and activated in the pulmonary capillaries, causing noncardiogenic pulmonary edema. Transfusion-associated circulatory overload has signs of volume overload (high JVP, elevated BNP, hypertension). Treatment of TRALI is supportive.","ko":"TRALI: 수혈 6시간 내 비심인성 폐부종, 공여자(다산 여성) 항HLA 항체. TACO는 용적 과부하."},{"id":"hm41","steps":["1"],"system":"Hematology & Oncology","discipline":"Pathology","topic":"Bernard-Soulier syndrome","stem":"A 14-year-old boy has frequent nosebleeds and prolonged bleeding after a tooth extraction. Platelet count is 90,000/mm³, and the platelets are unusually large on the smear. Platelets do not aggregate with ristocetin, and adding normal plasma does not correct this.\n\nA deficiency of which of the following is most likely?","options":["Glycoprotein IIb/IIIa on platelets","Glycoprotein Ib-IX-V on platelets","ADAMTS13","Von Willebrand factor in plasma","Factor VIII"],"answer":1,"explanation":"Bernard-Soulier syndrome is an autosomal recessive deficiency of the GpIb-IX-V complex, the platelet receptor for von Willebrand factor, which impairs adhesion. It causes mucocutaneous bleeding, mild thrombocytopenia with giant platelets, and absent ristocetin aggregation that does not correct with normal plasma (unlike von Willebrand disease). Glanzmann thrombasthenia is a deficiency of GpIIb/IIIa, which impairs aggregation, with normal platelet count and size and normal ristocetin response.","ko":"Bernard-Soulier: GpIb 결핍(부착 장애), 거대 혈소판, 리스토세틴 무응집(혈장 추가로 교정 안 됨). Glanzmann = GpIIb/IIIa."},{"id":"hm42","steps":["1"],"system":"Hematology & Oncology","discipline":"Pharmacology","topic":"Clopidogrel and CYP2C19","stem":"A 58-year-old man has a drug-eluting coronary stent placed and is started on aspirin and clopidogrel. Three months later he has stent thrombosis despite taking both drugs as prescribed. Genetic testing shows that he is a CYP2C19 poor metabolizer.\n\nWhich of the following best explains the treatment failure?","options":["Clopidogrel requires CYP2C19 for absorption from the gut","Clopidogrel is a prodrug that requires CYP2C19 for activation","CYP2C19 poor metabolizers have more P2Y12 receptors","Clopidogrel is metabolized too quickly in poor metabolizers","CYP2C19 is needed to metabolize aspirin to its active form"],"answer":1,"explanation":"Clopidogrel is a prodrug activated mainly by CYP2C19; the active metabolite irreversibly blocks the P2Y12 ADP receptor on platelets, preventing activation of GpIIb/IIIa. Poor metabolizers form little active drug and have higher rates of stent thrombosis. Some PPIs such as omeprazole also inhibit CYP2C19. Prasugrel and ticagrelor do not depend on CYP2C19 and are alternatives.","ko":"Clopidogrel = CYP2C19 활성화 필요 전구약물(P2Y12 차단). 저대사자 → 효과↓ → ticagrelor·prasugrel."},{"id":"hm43","steps":["1"],"system":"Hematology & Oncology","discipline":"Pharmacology","topic":"Alteplase reversal","stem":"A 66-year-old woman receives IV alteplase for an acute ischemic stroke. An hour later she has sudden headache and worsening confusion, and CT shows an intracerebral hemorrhage. The infusion is stopped.\n\nWhich of the following drugs directly counteracts the mechanism of alteplase?","options":["Aminocaproic acid","Protamine sulfate","Vitamin K","Idarucizumab","Desmopressin"],"answer":0,"explanation":"Alteplase (tPA) converts plasminogen to plasmin, which breaks down fibrin clots; it is used for ischemic stroke, STEMI when PCI is unavailable, and massive pulmonary embolism. Bleeding, especially intracranial hemorrhage, is the main risk. Antifibrinolytics such as aminocaproic acid and tranexamic acid inhibit plasminogen activation. Cryoprecipitate replaces fibrinogen. Protamine reverses heparin, vitamin K reverses warfarin, and idarucizumab reverses dabigatran.","ko":"tPA(alteplase) 출혈 → aminocaproic acid·tranexamic acid(플라스미노겐 활성 억제) + cryoprecipitate."},{"id":"hm44","steps":["1"],"system":"Hematology & Oncology","discipline":"Immunology","topic":"Antiphospholipid syndrome","stem":"A 31-year-old woman has had three miscarriages in the second trimester and a deep vein thrombosis. Platelet count is 110,000/mm³. Her PTT is prolonged and does not correct when mixed with normal plasma. Anticardiolipin and anti-β2-glycoprotein I antibodies are positive.\n\nWhich of the following best explains the prolonged PTT in this patient who has thrombosis rather than bleeding?","options":["Antibodies interfere with phospholipid in the test tube, while promoting clotting in the body","Heparin contamination of the sample","The antibodies inhibit platelet aggregation","She has vitamin K deficiency","She has a coexisting factor VIII deficiency"],"answer":0,"explanation":"Antiphospholipid syndrome causes arterial and venous thrombosis and pregnancy loss, with antibodies against phospholipid-binding proteins such as β2-glycoprotein I. The lupus anticoagulant binds phospholipids used in the PTT reagent, prolonging the test in vitro, while in the body the antibodies activate endothelium, platelets, and complement and promote clotting. Mixing does not correct it, indicating an inhibitor. It can be primary or associated with SLE, and it can cause false-positive VDRL tests. Treatment is anticoagulation, usually with warfarin (heparin in pregnancy).","ko":"항인지질 증후군: 혈전 + 반복 유산, PTT 연장(시험관 내 효과) + 혼합 교정 안 됨, VDRL 위양성."},{"id":"hm45","steps":["1"],"system":"Hematology & Oncology","discipline":"Pharmacology","topic":"Methotrexate toxicity rescue","stem":"A 16-year-old with osteosarcoma receives high-dose methotrexate. Twenty-four hours later, he is given a drug that bypasses the enzyme blocked by methotrexate to protect his normal cells.\n\nWhich drug is given, and why does it work?","options":["Leucovorin, a reduced folate that does not need dihydrofolate reductase","Allopurinol, which blocks xanthine oxidase","Mesna, which binds acrolein","Dexrazoxane, which chelates iron","Vitamin B12, which regenerates methionine"],"answer":0,"explanation":"Methotrexate inhibits dihydrofolate reductase, depleting tetrahydrofolate needed for thymidine and purine synthesis and arresting cells in S phase. Leucovorin (folinic acid) is already reduced and bypasses the block, rescuing normal cells. Methotrexate toxicities include myelosuppression, mucositis, hepatotoxicity, pulmonary fibrosis, nephrotoxicity, and teratogenicity. In contrast, leucovorin enhances the effect of 5-fluorouracil, which inhibits thymidylate synthase.","ko":"Methotrexate = DHFR 억제 → leucovorin(환원형 엽산)으로 정상세포 구제. 5-FU에서는 leucovorin이 효과 강화."},{"id":"hm46","steps":["1"],"system":"Hematology & Oncology","discipline":"Pharmacology","topic":"Cisplatin toxicity","stem":"A 30-year-old man with metastatic testicular cancer receives cisplatin-based chemotherapy. During treatment, his creatinine rises, his magnesium falls, and he notices high-pitched ringing in his ears with difficulty hearing.\n\nCisplatin acts by which of the following mechanisms?","options":["Inhibiting topoisomerase II","Cross-linking DNA strands","Stabilizing microtubules","Inhibiting thymidylate synthase","Inhibiting ribonucleotide reductase"],"answer":1,"explanation":"Cisplatin and carboplatin are platinum compounds that form DNA cross-links. Cisplatin causes nephrotoxicity (acute tubular necrosis with magnesium wasting), ototoxicity, peripheral neuropathy, and severe nausea. Nephrotoxicity is reduced by vigorous saline hydration and amifostine. Etoposide inhibits topoisomerase II, taxanes stabilize microtubules, 5-FU inhibits thymidylate synthase, and hydroxyurea inhibits ribonucleotide reductase.","ko":"Cisplatin: DNA 교차결합, 신독성(저Mg)·이독성·신경병증 → 수액·amifostine."},{"id":"hm47","steps":["1"],"system":"Hematology & Oncology","discipline":"Pharmacology","topic":"Rituximab risks","stem":"A 62-year-old man with follicular lymphoma and a history of resolved hepatitis B (HBsAg negative, anti-HBc positive) is to start rituximab.\n\nWhich of the following precautions is most important before starting therapy?","options":["Pulmonary function testing for fibrosis","Audiometry for ototoxicity","Ophthalmologic examination for retinopathy","Baseline echocardiography for cardiotoxicity","Antiviral prophylaxis or monitoring for hepatitis B reactivation"],"answer":4,"explanation":"Rituximab is a monoclonal antibody against CD20 on B cells, used for B-cell lymphomas, CLL, rheumatoid arthritis, and other autoimmune diseases. Depleting B cells can cause reactivation of hepatitis B, even in people with only anti-HBc, so patients are screened and given antiviral prophylaxis or monitored. It can also reactivate JC virus, causing progressive multifocal leukoencephalopathy, and causes infusion reactions.","ko":"Rituximab(항CD20): B형간염 재활성화(anti-HBc+도) → 항바이러스 예방, PML(JC 바이러스)."},{"id":"hm48","steps":["1"],"system":"Hematology & Oncology","discipline":"Biochemistry","topic":"KRAS mutation","stem":"A tumor carries a point mutation in codon 12 of KRAS. Signaling through the MAP kinase pathway is constantly active even without growth factor stimulation.\n\nWhich of the following best explains why this mutation activates signaling?","options":["It impairs the GTPase activity of RAS, keeping it bound to GTP","It increases the number of receptor tyrosine kinases on the cell surface","It prevents RAS from binding GTP","It increases transcription of RAS by gene amplification","It inactivates a tumor suppressor that degrades β-catenin"],"answer":0,"explanation":"RAS is a small G protein that is active when bound to GTP and inactive after hydrolyzing GTP to GDP, helped by GTPase-activating proteins such as neurofibromin. Activating point mutations, commonly at codons 12, 13, or 61, impair GTP hydrolysis, so RAS stays active and continuously signals through RAF, MEK, and ERK to drive proliferation. KRAS mutations are common in pancreatic, colorectal, and lung adenocarcinomas and predict resistance to anti-EGFR antibodies in colorectal cancer.","ko":"KRAS 활성화 변이 = GTPase 활성 저하 → GTP 결합 상태 유지 → MAPK 지속 신호. 췌장·대장·폐 선암."},{"id":"im01","steps":["1"],"system":"Immunology","discipline":"Immunology","topic":"Anaphylaxis mechanism","stem":"A 9-year-old boy eats a cookie containing peanuts at a party. Within 10 minutes he has hives, swelling of his lips, wheezing, and a blood pressure of 70/40 mm Hg.\n\nWhich of the following best describes the immediate mechanism of this reaction?","options":["Antibody binding to cell surface antigens causing lysis","Activation of CD8+ T cells by peanut proteins","Activation of complement by IgM immune complexes","Cross-linking of IgE on mast cells by antigen, causing degranulation","Deposition of IgG-antigen complexes in small vessels"],"answer":3,"explanation":"Anaphylaxis is a type I hypersensitivity reaction. On first exposure, Th2 cells drive B cells to make IgE, which binds Fc-epsilon receptors on mast cells and basophils. On re-exposure, antigen cross-links the bound IgE, triggering release of histamine and tryptase and synthesis of leukotrienes and prostaglandins, which cause vasodilation, increased permeability, and bronchoconstriction within minutes. Intramuscular epinephrine is the first-line treatment.","ko":"아나필락시스 = 1형 과민반응, 비만세포 IgE 교차결합 → 탈과립. 근주 에피네프린."},{"id":"im02","steps":["1"],"system":"Immunology","discipline":"Immunology","topic":"ABO transfusion reaction","stem":"A 60-year-old woman with blood type O begins receiving a unit of packed red cells. Within minutes she has fever, chills, flank pain, and hypotension, and her urine turns red. The unit was mislabeled and was type A.\n\nWhich of the following is the mechanism of this reaction?","options":["Preformed IgM antibodies binding donor red cells and activating complement","IgE antibodies against plasma proteins","Bacterial contamination of the blood unit","Donor lymphocytes attacking recipient tissue","Antibodies against donor leukocyte HLA antigens"],"answer":0,"explanation":"Acute hemolytic transfusion reaction is a type II hypersensitivity reaction. A type O recipient has preformed IgM anti-A and anti-B antibodies, which bind donor type A red cells and activate complement, causing intravascular hemolysis with fever, flank pain, hemoglobinuria, hypotension, and DIC. The direct Coombs test is positive. Febrile nonhemolytic reactions are caused by cytokines from donor leukocytes, and anaphylactic reactions occur in IgA-deficient recipients.","ko":"급성 용혈성 수혈반응 = 2형, 기존 IgM 항-A/B → 보체 → 혈관내 용혈."},{"id":"im03","steps":["1"],"system":"Immunology","discipline":"Immunology","topic":"Serum sickness","stem":"A 40-year-old man receives antivenom made from horse serum after a snakebite. Ten days later he has fever, a pruritic rash, joint pain, and proteinuria. Serum C3 and C4 levels are low.\n\nWhich of the following is the most likely mechanism?","options":["Mast cell degranulation through IgE","Antibodies binding fixed tissue antigens","Deposition of antigen-antibody complexes with complement activation","T cell-mediated injury of skin and joints","Direct toxic effect of the venom"],"answer":2,"explanation":"Serum sickness is a type III hypersensitivity reaction to foreign proteins such as nonhuman antisera, chimeric monoclonal antibodies, or drugs. About 1 to 2 weeks after exposure, antibodies form and combine with the remaining antigen, creating immune complexes that deposit in vessels, joints, and kidneys, activating complement (low C3 and C4) and attracting neutrophils. The Arthus reaction is a local type III reaction at an injection site.","ko":"혈청병 = 3형 면역복합체, 노출 1~2주 후 발열·발진·관절통, 보체↓."},{"id":"im04","steps":["1"],"system":"Immunology","discipline":"Immunology","topic":"Contact dermatitis","stem":"A 34-year-old woman develops an itchy, red, vesicular rash on her wrist exactly where her new nickel-containing watch band touches her skin. The rash appeared 2 days after she first wore the watch for a full day.\n\nWhich of the following cell types primarily mediates this reaction?","options":["Neutrophils with immune complexes","Plasma cells","Eosinophils","T lymphocytes","Mast cells"],"answer":3,"explanation":"Allergic contact dermatitis (from nickel, poison ivy, or latex) is a type IV delayed-type hypersensitivity reaction mediated by T cells. Haptens bind skin proteins and are presented by Langerhans cells to T cells. On re-exposure, sensitized CD4+ and CD8+ T cells release cytokines and kill cells, producing a rash 24 to 72 hours later. Type IV reactions also include the tuberculin skin test, transplant rejection, and multiple sclerosis. They do not involve antibodies.","ko":"접촉피부염 = 4형 지연형 과민반응(T세포), 24~72시간 후."},{"id":"im05","steps":["1"],"system":"Immunology","discipline":"Immunology","topic":"Hyperacute rejection","stem":"During a kidney transplant, the surgeon completes the vascular anastomoses and releases the clamps. Within minutes, the kidney becomes mottled and cyanotic and produces no urine.\n\nWhich of the following is the most likely cause?","options":["Recipient antibodies formed after transplantation","Recipient CD8+ T cells recognizing donor MHC class I","Donor T cells attacking recipient tissues","Preformed recipient antibodies against donor antigens","Chronic vascular injury from immunosuppressive drugs"],"answer":3,"explanation":"Hyperacute rejection occurs within minutes because the recipient already has antibodies against donor antigens (ABO or HLA), which bind graft endothelium, activate complement, and cause widespread thrombosis and ischemia. Crossmatching before transplant prevents it. Acute rejection develops over weeks and is mediated by T cells and new antibodies; chronic rejection develops over months to years with vascular fibrosis. Graft-versus-host disease is caused by donor T cells.","ko":"초급성 거부반응: 수분 내, 기존 항체(ABO/HLA) → 보체·혈전. 교차시험으로 예방."},{"id":"im06","steps":["1"],"system":"Immunology","discipline":"Pharmacology","topic":"Calcineurin inhibitors","stem":"A 45-year-old man has a kidney transplant and is maintained on tacrolimus. Over several months, his serum creatinine rises, and he develops tremor, hypertension, and new hyperglycemia.\n\nTacrolimus prevents rejection by which of the following mechanisms?","options":["Binding FKBP and inhibiting calcineurin, reducing IL-2 transcription","Inhibiting inosine monophosphate dehydrogenase","Depleting CD20+ B cells","Binding FKBP and inhibiting mTOR","Blocking the IL-2 receptor"],"answer":0,"explanation":"Tacrolimus binds FK-binding protein, and cyclosporine binds cyclophilin; both complexes inhibit calcineurin, preventing activation of NFAT and transcription of IL-2, which T cells need to proliferate. Both are nephrotoxic, and tacrolimus is also neurotoxic and diabetogenic. Sirolimus binds FKBP but inhibits mTOR and is not nephrotoxic. Mycophenolate inhibits IMP dehydrogenase, and basiliximab blocks the IL-2 receptor.","ko":"Tacrolimus(FKBP)·cyclosporine(cyclophilin) = 칼시뉴린 억제 → IL-2↓. 신독성."},{"id":"im07","steps":["1"],"system":"Immunology","discipline":"Immunology","topic":"Chronic granulomatous disease","stem":"A 4-year-old boy has had recurrent abscesses of the skin and liver caused by Staphylococcus aureus and an episode of pneumonia caused by Aspergillus. His brother had similar infections. A dihydrorhodamine flow cytometry test shows no fluorescence of his neutrophils after stimulation.\n\nWhich of the following is the most likely defect?","options":["Bruton tyrosine kinase","LFA-1 integrin (CD18)","NADPH oxidase","Myeloperoxidase","Lysosomal trafficking regulator protein"],"answer":2,"explanation":"Chronic granulomatous disease, usually X-linked, is a defect in NADPH oxidase, so phagocytes cannot generate the respiratory burst. Infections occur with catalase-positive organisms (S. aureus, Aspergillus, Serratia, Burkholderia cepacia, and Nocardia), which break down the hydrogen peroxide that the phagocyte could otherwise use. Granulomas form throughout the body. The dihydrorhodamine test (or older nitroblue tetrazolium test) is abnormal. Prophylaxis includes TMP-SMX and itraconazole.","ko":"만성 육아종병: NADPH oxidase 결함, 카탈라아제 양성균 감염, DHR 검사 음성."},{"id":"im08","steps":["1"],"system":"Immunology","discipline":"Immunology","topic":"Leukocyte adhesion deficiency","stem":"A 3-week-old boy still has his umbilical cord attached. He has a red, indurated skin infection on his leg with no pus formation. Leukocyte count is 42,000/mm³ with predominantly neutrophils, even when he is well.\n\nA defect in which of the following is most likely?","options":["Myeloperoxidase","Complement C3","CD40 ligand","CD18 subunit of β2 integrins","NADPH oxidase"],"answer":3,"explanation":"Leukocyte adhesion deficiency type 1 is an autosomal recessive defect in CD18, the β2 subunit of LFA-1 and Mac-1 integrins. Neutrophils cannot adhere firmly to endothelium or migrate into tissues, so infections form no pus, and neutrophil counts in the blood stay very high. Delayed separation of the umbilical cord (more than 30 days) and severe periodontitis are characteristic.","ko":"LAD-1: CD18 결함, 제대 탈락 지연, 고름 없는 감염, 혈중 호중구↑."},{"id":"im09","steps":["1"],"system":"Immunology","discipline":"Immunology","topic":"Chédiak-Higashi syndrome","stem":"A 2-year-old boy has recurrent pyogenic infections, very light skin and silvery hair, and photophobia. He has a peripheral neuropathy and easy bruising. His neutrophils contain giant cytoplasmic granules.\n\nWhich of the following is the most likely defect?","options":["Adenosine deaminase","Lysosomal trafficking regulator gene","CD18 integrin","WAS protein","NADPH oxidase"],"answer":1,"explanation":"Chédiak-Higashi syndrome is an autosomal recessive defect in the lysosomal trafficking regulator (LYST) gene, which impairs fusion of phagosomes with lysosomes and causes giant granules in neutrophils and other cells. Features include recurrent pyogenic infections, partial albinism, peripheral neuropathy, a bleeding tendency from defective platelet granules, and progressive neurologic decline. It can progress to a fatal lymphohistiocytic accelerated phase.","ko":"Chédiak-Higashi: LYST 결함, 거대 과립, 부분 백색증, 신경병증, 반복 감염."},{"id":"im10","steps":["1"],"system":"Immunology","discipline":"Immunology","topic":"DiGeorge syndrome","stem":"A 3-day-old boy has a seizure. Serum calcium is 6.2 mg/dL. He has a small jaw, low-set ears, and wide-set eyes, and echocardiography shows truncus arteriosus. Chest x-ray shows no thymic shadow.\n\nWhich of the following is the most likely cause?","options":["Trisomy 21","Deletion at chromosome 22q11 affecting the third and fourth pharyngeal pouches","Deficiency of adenosine deaminase","Defective NADPH oxidase","Mutation in Bruton tyrosine kinase"],"answer":1,"explanation":"DiGeorge syndrome is caused by a 22q11.2 deletion that impairs development of the third and fourth pharyngeal pouches. Absence of the parathyroid glands causes hypocalcemia and tetany, absence of the thymus causes T-cell deficiency with viral and fungal infections, and abnormal neural crest migration causes conotruncal heart defects (truncus arteriosus, tetralogy of Fallot) and facial anomalies. Mnemonic: CATCH-22.","ko":"DiGeorge(22q11): 3·4 인두낭 결함 → 흉선·부갑상선 무형성(저Ca), 원추동맥간 기형."},{"id":"im11","steps":["1"],"system":"Immunology","discipline":"Immunology","topic":"Wiskott-Aldrich syndrome","stem":"A 2-year-old boy has severe eczema, recurrent otitis media, and bloody diarrhea. Platelet count is 35,000/mm³, and the platelets are unusually small. Serum IgM is low, while IgA and IgE are elevated.\n\nWhich of the following is the inheritance pattern of this condition?","options":["X-linked recessive","Mitochondrial","Autosomal dominant","Sporadic chromosomal deletion","Autosomal recessive"],"answer":0,"explanation":"Wiskott-Aldrich syndrome is an X-linked recessive mutation of the WAS gene, which regulates the actin cytoskeleton in leukocytes and platelets. It causes the triad of thrombocytopenia with small platelets, eczema, and recurrent infections (especially encapsulated bacteria). Patients have low IgM, high IgA and IgE, and an increased risk of autoimmune disease and lymphoma. Hematopoietic stem cell transplant is curative.","ko":"Wiskott-Aldrich(X연관): 작은 혈소판 감소 + 습진 + 반복 감염. IgM↓, IgA·IgE↑."},{"id":"im12","steps":["1"],"system":"Immunology","discipline":"Immunology","topic":"Terminal complement deficiency","stem":"A 22-year-old woman is hospitalized for the second time in 3 years with meningococcal meningitis. She has no other history of unusual infections.\n\nDeficiency of which of the following is most likely?","options":["Complement C3","Myeloperoxidase","C1 esterase inhibitor","Complement components C5 through C9","Immunoglobulin A"],"answer":3,"explanation":"Terminal complement components C5 through C9 form the membrane attack complex, which is especially important for killing Neisseria species. Deficiency causes recurrent Neisseria meningitidis and N. gonorrhoeae infections. Patients receiving eculizumab, which blocks C5, have the same risk and are vaccinated against meningococcus. C3 deficiency causes severe recurrent pyogenic infections and immune complex disease. Early complement deficiencies (C1, C2, C4) are associated with SLE.","ko":"C5~C9(MAC) 결핍 → 반복 Neisseria 감염. Eculizumab도 동일 위험."},{"id":"im13","steps":["1"],"system":"Immunology","discipline":"Immunology","topic":"Hereditary angioedema","stem":"A 19-year-old woman has had recurrent episodes of swelling of her face and hands and severe abdominal pain since childhood, often after dental procedures. The swelling is not itchy and does not respond to antihistamines or epinephrine. Her mother has similar episodes.\n\nWhich of the following laboratory findings is most likely during an attack?","options":["Positive antinuclear antibodies","Elevated tryptase","Low C4 level","Elevated serum IgE","Low C3 with normal C4"],"answer":2,"explanation":"Hereditary angioedema is an autosomal dominant deficiency of C1 esterase inhibitor. Unchecked activation of the classical complement pathway consumes C4 and C2, and unregulated kallikrein increases bradykinin, which causes nonpitting, nonpruritic swelling of the skin, gut, and airway. C4 is low, especially during attacks. Treatment includes C1 inhibitor concentrate, icatibant (a bradykinin receptor antagonist), and ecallantide. ACE inhibitors are contraindicated.","ko":"유전성 혈관부종: C1-INH 결핍, C4↓, bradykinin 매개, 항히스타민 무효. ACEi 금기."},{"id":"im14","steps":["1"],"system":"Immunology","discipline":"Immunology","topic":"Hyper-IgM syndrome","stem":"A 2-year-old boy has recurrent sinusitis and pneumonia and now has Pneumocystis jirovecii pneumonia. Serum IgM is markedly elevated, while IgG, IgA, and IgE are very low. B-cell counts are normal, and his lymph nodes have no germinal centers.\n\nWhich of the following is the most likely defect?","options":["Bruton tyrosine kinase","NADPH oxidase","Adenosine deaminase","CD40 ligand on CD4+ T cells","Common γ chain of cytokine receptors"],"answer":3,"explanation":"Hyper-IgM syndrome is most often an X-linked defect in CD40 ligand on activated CD4+ T cells. Without CD40L binding CD40 on B cells, B cells cannot class-switch from IgM to other isotypes or form germinal centers. Patients have high IgM, very low IgG, IgA, and IgE, and infections with pyogenic bacteria and opportunists such as Pneumocystis, Cryptosporidium, and CMV, because CD40L is also needed to activate macrophages.","ko":"고IgM 증후군: CD40L 결함 → class switching 불가, IgM↑ 나머지↓, PCP."},{"id":"im15","steps":["1"],"system":"Immunology","discipline":"Immunology","topic":"Selective IgA deficiency","stem":"A 30-year-old man has recurrent sinus infections and chronic diarrhea caused by Giardia. During surgery, he develops anaphylaxis within minutes of starting a transfusion of packed red cells.\n\nWhich of the following best explains his transfusion reaction?","options":["Bacterial contamination of the blood","Anti-IgA antibodies reacting with IgA in the donor plasma","Antibodies against donor leukocyte HLA antigens","Donor antibodies against recipient neutrophils","ABO incompatibility"],"answer":1,"explanation":"Selective IgA deficiency is the most common primary immunodeficiency. Most people are asymptomatic, but some have recurrent sinopulmonary and GI infections (Giardia), autoimmune disease, and atopy. Some patients form anti-IgA antibodies and develop anaphylaxis when transfused with blood products containing IgA, so they need washed cells or IgA-deficient products. IgA deficiency can also cause false-negative IgA-based celiac tests.","ko":"선택적 IgA 결핍: 가장 흔한 면역결핍, Giardia, 수혈 시 아나필락시스(항-IgA)."},{"id":"im16","steps":["1"],"system":"Immunology","discipline":"Immunology","topic":"IL-5 and eosinophils","stem":"A 30-year-old man has diarrhea and abdominal discomfort 2 months after traveling. His eosinophil count is markedly elevated, and stool examination shows Strongyloides larvae.\n\nWhich cytokine is most responsible for the production and activation of eosinophils in this infection?","options":["IFN-γ","IL-5","IL-12","IL-10","IL-2"],"answer":1,"explanation":"Helminth infections drive a Th2 response. Th2 cells secrete IL-4 (IgE class switching), IL-5 (eosinophil growth and activation, and IgA class switching), and IL-13. Eosinophils kill helminths through antibody-dependent cellular cytotoxicity, releasing major basic protein. IL-2 drives T-cell growth, IL-12 and IFN-γ drive the Th1 response, and IL-10 suppresses inflammation. Mepolizumab, an anti-IL-5 antibody, treats eosinophilic asthma.","ko":"IL-5 = 호산구 생성·활성(기생충, Th2). IL-4 = IgE class switch."},{"id":"im17","steps":["1"],"system":"Immunology","discipline":"Immunology","topic":"MHC I and NK cells","stem":"A virus infects host cells and causes them to downregulate MHC class I molecules on their surface, which helps the virus avoid detection by cytotoxic T cells.\n\nWhich of the following cells is most likely to recognize and kill these infected cells?","options":["Mast cells","CD4+ helper T cells","Plasma cells","Regulatory T cells","Natural killer cells"],"answer":4,"explanation":"MHC class I is expressed on all nucleated cells and presents endogenous (including viral) peptides to CD8+ T cells; it contains β2-microglobulin. Some viruses reduce MHC class I to escape CD8+ T cells. Natural killer cells are inhibited by MHC class I, so cells that lose it are killed by NK cells through perforin and granzymes. NK cells are activated by IL-2, IL-12, IFN-α, and IFN-β. MHC class II presents exogenous peptides to CD4+ T cells.","ko":"MHC I 소실 세포 → NK 세포가 제거 (missing self). MHC I은 CD8, II는 CD4."},{"id":"im18","steps":["1"],"system":"Immunology","discipline":"Immunology","topic":"Toxoid vaccine","stem":"A 25-year-old man steps on a rusty nail. His last tetanus vaccination was 12 years ago, and he receives a booster dose.\n\nThis vaccine protects against tetanus by inducing which of the following?","options":["Cytotoxic T cells that kill infected cells","Antibodies against bacterial pili","Antibodies against the bacterial capsule","Antibodies that neutralize the bacterial exotoxin","Innate immune memory in macrophages"],"answer":3,"explanation":"Tetanus and diphtheria vaccines are toxoids: exotoxins inactivated by formaldehyde so they are no longer toxic but remain immunogenic. They induce IgG antibodies that neutralize the toxin before it binds nerve terminals. Because tetanus infection itself does not reliably produce immunity, people need boosters every 10 years and with contaminated wounds when the last dose was more than 5 years ago. Unvaccinated patients with dirty wounds also receive tetanus immune globulin.","ko":"파상풍 = 톡소이드 백신 → 독소 중화 IgG. 오염 상처 + 5년 경과 시 추가 접종."},{"id":"im19","steps":["1"],"system":"Immunology","discipline":"Immunology","topic":"AIRE deficiency","stem":"A 12-year-old girl has had chronic oral thrush and nail candidiasis since early childhood. She developed hypocalcemic tetany at age 8 and now has fatigue, hyperpigmentation, and hyponatremia. PTH is low, and morning cortisol is low with high ACTH.\n\nA defect in which of the following is most likely?","options":["CD40 ligand on T cells","22q11 deletion affecting thymic development","Autoimmune regulator (AIRE) needed for negative selection in the thymus","FOXP3 in regulatory T cells","Bruton tyrosine kinase"],"answer":2,"explanation":"Autoimmune polyendocrine syndrome type 1 (APECED) is caused by mutations in AIRE, which allows medullary thymic epithelial cells to express tissue-specific antigens so self-reactive T cells can be deleted (negative selection). Without it, autoreactive T cells escape, causing hypoparathyroidism, primary adrenal insufficiency, and chronic mucocutaneous candidiasis (from autoantibodies against IL-17 and IL-22). FOXP3 defects cause IPEX syndrome (enteropathy, diabetes, eczema).","ko":"AIRE 결함(흉선 음성선택 실패) → APECED: 부갑상선저하 + 부신부전 + 만성 피부점막 칸디다증."},{"id":"im20","steps":["1"],"system":"Immunology","discipline":"Immunology","topic":"Maternal IgG protection","stem":"A 2-month-old infant does not develop measles after exposure to an infected sibling, although she has not been vaccinated. Her mother had measles as a child.\n\nWhich of the following explains the infant's protection?","options":["Maternal IgM transported across the placenta","Maternal IgG transported across the placenta","Infant's own T-cell memory","Maternal IgE in breast milk","Infant's own IgA from mucosal immunity"],"answer":1,"explanation":"IgG is the only immunoglobulin that crosses the placenta, through the neonatal Fc receptor, giving infants passive immunity for several months, which also explains why the MMR vaccine is delayed until 12 months (maternal antibody can neutralize it). Breast milk provides secretory IgA for mucosal protection. IgM is the first antibody made in a primary response and is a pentamer that cannot cross the placenta, so IgM in a newborn indicates congenital infection.","ko":"태반 통과 = IgG만(FcRn) → 생후 수개월 수동면역. 신생아 IgM↑ = 선천 감염."},{"id":"im21","steps":["1"],"system":"Immunology","discipline":"Immunology","topic":"Complement functions","stem":"Encapsulated bacteria enter the bloodstream of a 30-year-old man. Complement is activated, and the bacteria are efficiently coated for phagocytosis by neutrophils and macrophages.\n\nWhich complement component is the main opsonin?","options":["C5a","C3a","C5b-9","C1q","C3b"],"answer":4,"explanation":"C3b is the main complement opsonin (with IgG), binding bacteria and promoting phagocytosis through complement receptors; it also helps clear immune complexes. C3a and C5a are anaphylatoxins that cause mast cell degranulation, and C5a is also a powerful neutrophil chemoattractant. C5b-9 forms the membrane attack complex. C1q starts the classical pathway by binding antibody. DAF (CD55) and C1 esterase inhibitor regulate complement.","ko":"C3b = 주요 옵소닌. C3a·C5a = 아나필라톡신(C5a 호중구 화학주성). C5b-9 = MAC."},{"id":"im22","steps":["1"],"system":"Immunology","discipline":"Immunology","topic":"Hyper-IgE syndrome","stem":"A 6-year-old boy has severe eczema, recurrent staphylococcal skin abscesses that are not warm or red, and two episodes of pneumonia with lung cysts. He has a broad nose and prominent forehead, and he has not lost any baby teeth. Serum IgE is markedly elevated, with eosinophilia.\n\nA defect in which of the following is most likely?","options":["STAT3, impairing Th17 differentiation","IL-2 receptor γ chain","CD18","NADPH oxidase","WAS protein"],"answer":0,"explanation":"Autosomal dominant hyper-IgE syndrome (Job syndrome) is caused by STAT3 mutations that impair Th17 differentiation and IL-17 production, so neutrophils are not recruited effectively. Features include cold staphylococcal abscesses, retained primary teeth, very high IgE, eczema, coarse facial features, recurrent pneumonia with pneumatoceles, and bone fractures (FATED: Facial, Abscesses, retained Teeth, high IgE, Dermatologic).","ko":"고IgE 증후군(Job): STAT3 → Th17↓, 차가운 포도알균 농양·유치 잔존·IgE↑·습진."},{"id":"im23","steps":["1"],"system":"Immunology","discipline":"Immunology","topic":"X-linked SCID","stem":"A 5-month-old boy has persistent oral thrush, chronic diarrhea, failure to thrive, and Pneumocystis pneumonia. Chest x-ray shows no thymic shadow. Lymphocyte counts are very low, with absent T cells and NK cells but normal B cells that do not make antibodies.\n\nA defect in which of the following is most likely?","options":["Bruton tyrosine kinase","Common γ chain shared by several interleukin receptors","CD40 ligand","MHC class II transcription","Adenosine deaminase"],"answer":1,"explanation":"Severe combined immunodeficiency causes severe infections in infancy with bacteria, viruses, fungi, and opportunists. The most common form is X-linked, caused by mutations in the common γ chain (IL-2Rγ) shared by receptors for IL-2, IL-4, IL-7, IL-9, IL-15, and IL-21; loss of IL-7 and IL-15 signaling prevents T- and NK-cell development. B cells are present but cannot function without T-cell help. ADA deficiency is autosomal recessive and lacks T, B, and NK cells. Treatment is stem cell transplant, and live vaccines must be avoided.","ko":"X연관 SCID: 공통 γ사슬(IL-2Rγ) → T·NK 세포 없음, B세포 있으나 기능 없음. 생백신 금기."},{"id":"im24","steps":["1"],"system":"Immunology","discipline":"Immunology","topic":"IL-12/IFN-γ axis defect","stem":"A 3-year-old girl develops disseminated infection after BCG vaccination and later has disseminated nontuberculous mycobacterial and Salmonella infections. Her HIV test is negative, and her T- and B-cell counts are normal.\n\nA defect in which of the following pathways is most likely?","options":["Neutrophil NADPH oxidase","Complement C5-C9","IgA class switching","IL-12 receptor and IFN-γ signaling","IL-5 production"],"answer":3,"explanation":"Macrophages infected with intracellular organisms secrete IL-12, which stimulates Th1 and NK cells to produce IFN-γ, which in turn activates macrophages to kill mycobacteria and Salmonella. Mendelian susceptibility to mycobacterial disease results from defects in the IL-12 receptor, IFN-γ receptor, or downstream signaling. Patients have disseminated infections with weakly virulent mycobacteria (including BCG) and Salmonella. Treatment may include IFN-γ for some defects.","ko":"IL-12/IFN-γ 축 결함 → 파종성 비결핵 항산균·BCG·Salmonella 감염."},{"id":"im25","steps":["1"],"system":"Immunology","discipline":"Pharmacology","topic":"Natalizumab and PML","stem":"A 34-year-old woman with relapsing multiple sclerosis has been treated for 3 years with a monoclonal antibody that blocks lymphocyte entry into the CNS. She develops progressive weakness of her left arm, visual field loss, and confusion over several weeks. MRI shows multiple white matter lesions without enhancement or mass effect.\n\nWhich of the following drug targets explains her increased risk?","options":["IL-6 receptor","α4-integrin","CD20","TNF-α","CTLA-4"],"answer":1,"explanation":"Natalizumab is a monoclonal antibody against α4-integrin that prevents leukocytes from crossing the endothelium into the CNS and gut; it treats multiple sclerosis and Crohn disease. By reducing immune surveillance of the brain, it allows reactivation of JC virus, causing progressive multifocal leukoencephalopathy, a demyelinating infection of oligodendrocytes. Risk is assessed with anti-JC virus antibody testing. Rituximab (anti-CD20) also increases PML risk.","ko":"Natalizumab(α4-integrin 차단) → 뇌 면역감시↓ → JC 바이러스 PML. 투여 전 JC 항체 검사."},{"id":"im26","steps":["1"],"system":"Immunology","discipline":"Pharmacology","topic":"Abatacept","stem":"A 50-year-old woman with rheumatoid arthritis has an inadequate response to methotrexate and a TNF inhibitor. She is started on a fusion protein that prevents full activation of T cells by antigen-presenting cells.\n\nWhich interaction does this drug block?","options":["CD40 ligand binding CD40","LFA-1 binding ICAM-1","T-cell receptor binding MHC class II","IL-2 binding its receptor","CD28 on T cells binding B7 (CD80/86) on antigen-presenting cells"],"answer":4,"explanation":"T-cell activation requires two signals: the T-cell receptor binding peptide on MHC (signal 1) and costimulation by CD28 binding B7 (CD80/86) on antigen-presenting cells (signal 2). Without signal 2, T cells become anergic. Abatacept is a CTLA-4-Ig fusion protein that binds B7 and blocks CD28 costimulation. Belatacept is similar and used in kidney transplantation. CTLA-4 inhibitors such as ipilimumab do the opposite, enhancing T-cell activity against tumors.","ko":"T세포 활성화: 신호1(TCR-MHC) + 신호2(CD28-B7). Abatacept(CTLA-4-Ig) = B7 차단."},{"id":"im27","steps":["1"],"system":"Immunology","discipline":"Immunology","topic":"Graft-versus-host disease","stem":"A 30-year-old man receives an allogeneic bone marrow transplant for AML. Four weeks later he develops a maculopapular rash on his palms and soles, profuse watery diarrhea, and elevated bilirubin.\n\nWhich of the following cells mediate this complication?","options":["Recipient preformed antibodies","Donor T cells reacting against recipient tissues","Recipient NK cells","Recipient T cells attacking the graft","Donor B cells producing autoantibodies"],"answer":1,"explanation":"Graft-versus-host disease occurs when immunocompetent donor T cells recognize the recipient's tissues as foreign. It most often follows allogeneic hematopoietic stem cell transplantation and can also follow transfusion of nonirradiated blood to immunocompromised patients. Acute GVHD targets the skin, liver (cholestasis), and gut (diarrhea). Prevention includes HLA matching, immunosuppression, and irradiation of blood products. Donor T cells also provide a beneficial graft-versus-tumor effect.","ko":"GVHD = 공여자 T세포가 수혜자 조직 공격: 피부·간·장. 수혈 시 방사선 조사로 예방."},{"id":"im28","steps":["1"],"system":"Immunology","discipline":"Immunology","topic":"HBV-exposed newborn","stem":"A woman with chronic hepatitis B who is HBsAg- and HBeAg-positive gives birth to a healthy term infant.\n\nWhich of the following is the most appropriate management for the newborn within 12 hours of birth?","options":["Avoid breastfeeding and give no prophylaxis","Hepatitis B vaccine and hepatitis B immune globulin","Hepatitis B immune globulin only","Hepatitis B vaccine only, at 2 months","Tenofovir for the infant"],"answer":1,"explanation":"Infants born to HBsAg-positive mothers have a high risk of chronic infection, especially when the mother is HBeAg-positive. They receive both hepatitis B immune globulin (passive immunity, immediate protection) and the first dose of hepatitis B vaccine (active immunity) within 12 hours of birth, at different sites. Breastfeeding is allowed. Mothers with high viral loads may also receive tenofovir in the third trimester. Combined passive and active immunization is also used after rabies and tetanus exposures.","ko":"HBsAg(+) 산모 신생아: 12시간 내 HBIG(수동) + B형간염 백신(능동). 모유수유 가능."},{"id":"im29","steps":["1"],"system":"Immunology","discipline":"Immunology","topic":"Conjugate vaccines","stem":"Pure polysaccharide vaccines against encapsulated bacteria produce poor responses in infants under 2 years old. Linking the polysaccharide to a protein carrier produces strong, long-lasting responses in infants.\n\nWhich of the following explains the improved response?","options":["The protein increases polysaccharide binding to TLR4","The protein carrier recruits helper T cells, enabling class switching and memory B cells","The protein carrier directly activates complement","The protein makes the vaccine a live vaccine","The protein allows the polysaccharide to be presented on MHC class I"],"answer":1,"explanation":"Polysaccharide antigens are T cell-independent: they activate B cells to make mostly IgM without memory, and infants respond poorly. Conjugating the polysaccharide to a protein allows B cells that recognize the polysaccharide to present protein peptides on MHC class II to helper T cells, producing class-switched IgG, affinity maturation, and memory. Conjugate vaccines are used against Haemophilus influenzae type b, pneumococcus, and meningococcus.","ko":"결합 백신: 다당류 + 단백질 → T세포 의존성 반응 → IgG class switch·기억 B세포(영아 효과)."},{"id":"im30","steps":["1"],"system":"Immunology","discipline":"Immunology","topic":"Autoimmune hepatitis","stem":"A 30-year-old woman with Hashimoto thyroiditis has fatigue and jaundice. AST is 650 U/L and ALT is 720 U/L. Viral hepatitis tests are negative. Serum IgG is elevated, and anti-smooth muscle antibodies are positive. Liver biopsy shows interface hepatitis with many plasma cells.\n\nWhich of the following is the most appropriate treatment?","options":["Tenofovir","Phlebotomy","Ursodeoxycholic acid","Penicillamine","Prednisone with azathioprine"],"answer":4,"explanation":"Autoimmune hepatitis typically affects young women and can present acutely or as chronic hepatitis leading to cirrhosis. Type 1 is associated with anti-smooth muscle and antinuclear antibodies, and type 2 (in children) with anti-liver/kidney microsomal antibodies. Elevated IgG and interface hepatitis with plasma cells support the diagnosis. Treatment is corticosteroids with azathioprine. Ursodiol treats PBC, phlebotomy hemochromatosis, and penicillamine Wilson disease.","ko":"자가면역 간염: 젊은 여성, 항평활근 항체·IgG↑, 형질세포 interface hepatitis → 스테로이드 + azathioprine."},{"id":"mb01","steps":["1"],"system":"Microbiology","discipline":"Microbiology","topic":"Lysogenic conversion","stem":"A nontoxigenic strain of Corynebacterium diphtheriae is grown in culture with a bacteriophage. Afterward, some of the bacteria produce diphtheria toxin, and they pass this ability on to their progeny.\n\nWhich of the following processes explains this change?","options":["Transposition of a jumping gene within the chromosome","Conjugation through a sex pilus","Transformation by uptake of free DNA","Point mutation in the bacterial chromosome","Transduction by a temperate phage (lysogenic conversion)"],"answer":4,"explanation":"In lysogenic conversion, a temperate phage integrates its genome into the bacterial chromosome as a prophage and adds new genes, such as toxin genes. Phage-encoded toxins include diphtheria toxin, cholera toxin, botulinum toxin, Shiga-like toxin, streptococcal erythrogenic toxin, and some staphylococcal toxins. Transformation is uptake of naked DNA, conjugation transfers plasmids through a pilus, and transposons move DNA between sites.","ko":"용원성 전환(형질도입): 파지가 독소 유전자 전달 — 디프테리아·콜레라·보툴리눔·Shiga-like."},{"id":"mb02","steps":["1"],"system":"Microbiology","discipline":"Microbiology","topic":"Cholera toxin","stem":"A 30-year-old aid worker in a refugee camp develops profuse, painless, watery diarrhea that looks like rice water, producing several liters per day. Stool culture grows comma-shaped, oxidase-positive gram-negative rods.\n\nThe toxin of this organism causes diarrhea by which of the following mechanisms?","options":["ADP-ribosylation of Gs, permanently activating adenylyl cyclase","Inactivation of the 60S ribosomal subunit","ADP-ribosylation of elongation factor 2","ADP-ribosylation of Gi, inhibiting its function","Cleavage of SNARE proteins"],"answer":0,"explanation":"Cholera toxin ADP-ribosylates the α subunit of Gs, locking it in the active state. Adenylyl cyclase stays on, cAMP rises, and CFTR secretes chloride and water into the gut lumen, causing massive watery diarrhea without inflammation. Treatment is oral rehydration. Heat-labile toxin of enterotoxigenic E. coli works the same way. Pertussis toxin ADP-ribosylates Gi, and Shiga toxin inactivates the 60S ribosomal subunit.","ko":"콜레라 독소: Gs ADP-ribosylation → cAMP↑ → 쌀뜨물 설사. 경구 수액."},{"id":"mb03","steps":["1"],"system":"Microbiology","discipline":"Microbiology","topic":"Diphtheria toxin","stem":"An unvaccinated 6-year-old girl who recently immigrated has fever, sore throat, and a gray membrane covering her tonsils and pharynx that bleeds when scraped. She has marked neck swelling. Two weeks later she develops heart block.\n\nThe toxin responsible acts by which of the following mechanisms?","options":["Acting as a superantigen","Increasing cAMP in intestinal cells","ADP-ribosylation of elongation factor 2, inhibiting protein synthesis","Forming pores in host cell membranes","Blocking release of glycine from inhibitory interneurons"],"answer":2,"explanation":"Corynebacterium diphtheriae is a gram-positive rod whose phage-encoded exotoxin ADP-ribosylates elongation factor 2, stopping protein synthesis and killing cells. It forms a pseudomembrane in the pharynx with cervical lymphadenopathy (bull neck) and can cause myocarditis with arrhythmias and neuropathy. It grows on tellurite agar. Treatment is antitoxin plus penicillin or erythromycin, and vaccination uses toxoid. Pseudomonas exotoxin A also inactivates EF-2.","ko":"디프테리아 독소: EF-2 ADP-ribosylation → 단백합성 중단, 위막·심근염."},{"id":"mb04","steps":["1"],"system":"Microbiology","discipline":"Microbiology","topic":"Endotoxin and septic shock","stem":"A 66-year-old woman with pyelonephritis caused by Escherichia coli becomes hypotensive with a temperature of 39.8°C (103.6°F). Despite IV fluids, her blood pressure remains low, and she develops DIC.\n\nWhich bacterial component and host receptor most directly trigger these systemic effects?","options":["Teichoic acid binding complement receptor 1","Flagellin binding TLR5","Capsular polysaccharide binding IgM","Peptidoglycan binding TLR2","Lipid A of lipopolysaccharide binding TLR4 on macrophages"],"answer":4,"explanation":"Lipopolysaccharide in the outer membrane of gram-negative bacteria contains lipid A, the toxic part of endotoxin. Lipid A binds the CD14/TLR4 complex on macrophages and endothelial cells, triggering release of IL-1, IL-6, and TNF-α, activation of complement and coagulation (DIC), and nitric oxide production, causing fever, hypotension, and septic shock. Gram-positive components such as lipoteichoic acid signal through TLR2.","ko":"내독소 = LPS의 lipid A → TLR4 → IL-1·IL-6·TNF-α → 패혈성 쇼크·DIC."},{"id":"mb05","steps":["1"],"system":"Microbiology","discipline":"Pharmacology","topic":"Aminoglycosides","stem":"A 70-year-old man is treated with IV gentamicin for Pseudomonas sepsis. After 10 days, his creatinine has risen and he reports ringing in his ears and imbalance.\n\nGentamicin works by which of the following mechanisms?","options":["Inhibiting dihydropteroate synthase","Binding the 30S ribosomal subunit and causing misreading of mRNA","Inhibiting DNA gyrase","Binding the 50S subunit and blocking peptidyl transferase","Inhibiting cell wall synthesis"],"answer":1,"explanation":"Aminoglycosides (gentamicin, tobramycin, amikacin) bind the 30S subunit, inhibit formation of the initiation complex, and cause misreading of mRNA; they are bactericidal. They need oxygen-dependent uptake, so they do not work against anaerobes. Toxicities are nephrotoxicity (acute tubular necrosis), ototoxicity (especially with loop diuretics), neuromuscular blockade, and teratogenicity. Levels are monitored.","ko":"아미노글리코사이드: 30S, mRNA 오독, 혐기균 무효. 신독성·이독성."},{"id":"mb06","steps":["1"],"system":"Microbiology","discipline":"Pharmacology","topic":"Vancomycin","stem":"A 50-year-old man with MRSA bacteremia receives a rapid IV infusion of vancomycin and develops flushing and redness of his face, neck, and upper chest with itching. The reaction resolves when the infusion is slowed.\n\nVancomycin inhibits cell wall synthesis by which of the following mechanisms?","options":["Inhibiting mycolic acid synthesis","Inhibiting dihydrofolate reductase","Binding penicillin-binding proteins","Binding D-alanyl-D-alanine terminals of cell wall precursors","Inhibiting the 30S ribosomal subunit"],"answer":3,"explanation":"Vancomycin binds the D-Ala-D-Ala terminal of peptidoglycan precursors, blocking transglycosylation and transpeptidation. It is effective against gram-positive organisms including MRSA and, orally, C. difficile. Resistance, as in vancomycin-resistant enterococci, comes from changing the terminal to D-Ala-D-Lac. Rapid infusion causes vancomycin infusion reaction (red man syndrome) from direct, non-IgE mast cell histamine release, prevented by slowing the rate and antihistamines. It is also nephrotoxic and ototoxic.","ko":"Vancomycin: D-Ala-D-Ala 결합. 내성 = D-Ala-D-Lac. 빠른 주입 → red man(비IgE 히스타민)."},{"id":"mb07","steps":["1"],"system":"Microbiology","discipline":"Pharmacology","topic":"Fluoroquinolone adverse effect","stem":"A 72-year-old man taking prednisone for COPD is treated with levofloxacin for pneumonia. On day 6, he feels a pop in his left heel while walking and cannot push off with that foot.\n\nWhich of the following best describes the mechanism of the antibiotic?","options":["Inhibition of DNA gyrase and topoisomerase IV","Inhibition of RNA polymerase","Disruption of the cell membrane","Inhibition of cell wall transpeptidation","Inhibition of the 50S ribosomal subunit"],"answer":0,"explanation":"Fluoroquinolones (ciprofloxacin, levofloxacin, moxifloxacin) inhibit DNA gyrase (topoisomerase II) and topoisomerase IV, blocking DNA replication. Adverse effects include tendinopathy and tendon rupture (especially the Achilles tendon, in older adults and with corticosteroids), QT prolongation, GI upset, CNS effects, and cartilage damage in children. Divalent cations reduce absorption.","ko":"플루오로퀴놀론: DNA gyrase·topo IV 억제. 아킬레스건 파열(노인+스테로이드), QT 연장."},{"id":"mb08","steps":["1"],"system":"Microbiology","discipline":"Microbiology","topic":"Influenza antigenic shift","stem":"A new influenza A strain causes a worldwide pandemic. Genetic analysis shows that it contains a hemagglutinin gene from an avian influenza virus and other genes from a human influenza virus. Most people have no immunity to it.\n\nWhich of the following processes produced this strain?","options":["Complementation by a helper virus","Recombination between two DNA viruses","Phenotypic mixing without genetic change","Reassortment of genome segments between two viruses infecting the same cell","Accumulation of point mutations in the hemagglutinin gene"],"answer":3,"explanation":"Influenza viruses have segmented RNA genomes. When two strains infect the same cell (often in pigs or birds), segments can be exchanged (reassortment), producing a virus with a new hemagglutinin or neuraminidase. This antigenic shift can cause pandemics. Antigenic drift is the gradual accumulation of point mutations in hemagglutinin and neuraminidase that causes seasonal epidemics and requires yearly vaccine updates.","ko":"항원 대변이(shift) = 분절 유전체 재편성 → 대유행. 소변이(drift) = 점돌연변이 → 계절 유행."},{"id":"mb09","steps":["1"],"system":"Microbiology","discipline":"Pharmacology","topic":"Acyclovir resistance","stem":"A 40-year-old man with advanced HIV has chronic genital herpes lesions that have not healed despite high doses of acyclovir. Viral testing shows a mutation in the gene that normally activates the drug.\n\nWhich of the following drugs is most appropriate?","options":["Valacyclovir","Famciclovir","Foscarnet","Ganciclovir","Oseltamivir"],"answer":2,"explanation":"Acyclovir is a guanosine analog that must be phosphorylated first by viral thymidine kinase, then by host kinases, and then inhibits viral DNA polymerase. Resistance usually comes from loss or mutation of viral thymidine kinase, which also makes the virus resistant to valacyclovir, famciclovir, and ganciclovir. Foscarnet inhibits viral DNA polymerase directly without activation; it is nephrotoxic and lowers calcium and magnesium.","ko":"Acyclovir는 바이러스 thymidine kinase로 활성화. TK 변이 내성 → foscarnet."},{"id":"mb10","steps":["1"],"system":"Microbiology","discipline":"Microbiology","topic":"Giardiasis","stem":"A 28-year-old woman develops bloating, foul-smelling greasy diarrhea, and flatulence 2 weeks after drinking water from a mountain stream during a camping trip. Stool microscopy shows pear-shaped, binucleate, flagellated trophozoites.\n\nWhich of the following is the most appropriate treatment?","options":["Praziquantel","Ivermectin","Albendazole","Metronidazole","Nitazoxanide only after failure of all other drugs"],"answer":3,"explanation":"Giardia lamblia is transmitted through cysts in contaminated water. It attaches to the small bowel mucosa and causes fat malabsorption, with bloating, flatulence, and foul-smelling fatty diarrhea, without blood. Trophozoites are teardrop-shaped with two nuclei (they look like faces). Diagnosis is by stool antigen or microscopy, and treatment is metronidazole, tinidazole, or nitazoxanide. People with IgA deficiency or other antibody deficiencies are more susceptible.","ko":"Giardia: 계곡물, 지방변·가스, 서양배 모양 2핵 영양체 → metronidazole."},{"id":"mb11","steps":["1"],"system":"Microbiology","discipline":"Pharmacology","topic":"Primaquine for P. vivax","stem":"A 30-year-old man returns from India with cyclic fevers every 48 hours. Blood smear shows enlarged red cells containing amoeboid trophozoites and Schüffner dots. He is treated with chloroquine, and a second drug is planned to prevent relapse.\n\nBefore the second drug is given, which test is required?","options":["Liver biopsy","G6PD activity","Hemoglobin electrophoresis","Serum creatinine","HIV antibody test"],"answer":1,"explanation":"Plasmodium vivax and P. ovale form dormant hypnozoites in the liver that can reactivate months later, so after treatment of the blood stage, primaquine (or tafenoquine) is given to kill hypnozoites. These drugs can cause severe hemolysis in people with G6PD deficiency, so G6PD activity must be checked first. P. falciparum does not form hypnozoites but causes severe malaria with cerebral involvement and banana-shaped gametocytes.","ko":"P. vivax/ovale 간 휴면체 → primaquine. 투여 전 G6PD 검사 필수."},{"id":"mb12","steps":["1"],"system":"Microbiology","discipline":"Microbiology","topic":"Syphilis treatment reaction","stem":"A 24-year-old man has a painless, clean-based genital ulcer with firm, painless inguinal lymph nodes. Darkfield microscopy shows spiral organisms. He receives intramuscular benzathine penicillin G. Four hours later he has fever, chills, muscle aches, and headache.\n\nWhich of the following best explains this reaction?","options":["Progression to secondary syphilis","IgE-mediated penicillin allergy","Release of bacterial components from dying spirochetes","Serum sickness from penicillin","Superinfection with a resistant organism"],"answer":2,"explanation":"Primary syphilis causes a painless chancre with painless lymphadenopathy, and Treponema pallidum can be seen on darkfield microscopy. Benzathine penicillin G is the treatment. The Jarisch-Herxheimer reaction is a flu-like reaction within 24 hours of treatment, caused by release of endotoxin-like components and cytokines from dying spirochetes. It is self-limited and treated with antipyretics. It also occurs with treatment of Lyme disease and leptospirosis.","ko":"Jarisch-Herxheimer: 매독 치료 후 수 시간 내 발열·오한 — 죽은 스피로헤타 성분, 알레르기 아님."},{"id":"mb13","steps":["1"],"system":"Microbiology","discipline":"Microbiology","topic":"Chlamydia life cycle","stem":"A 21-year-old woman has mucopurulent cervicitis. Nucleic acid amplification testing is positive for an obligate intracellular bacterium that cannot be grown on routine media. Cytology shows inclusion bodies in epithelial cells.\n\nWhich form of this organism is infectious and enters host cells?","options":["Reticulate body","Cyst","Elementary body","Trophozoite","Spore"],"answer":2,"explanation":"Chlamydia trachomatis is an obligate intracellular bacterium because it cannot make its own ATP. The small, metabolically inactive elementary body is the infectious form that enters cells by endocytosis; inside, it becomes a reticulate body that replicates by binary fission and forms inclusions, then reorganizes into elementary bodies released on cell lysis. Its cell wall lacks muramic acid. It causes urethritis, cervicitis, PID, conjunctivitis, and reactive arthritis, and is treated with azithromycin or doxycycline.","ko":"Chlamydia: 기본소체(감염형, Enter) → 망상소체(복제형, Replicate)."},{"id":"mb14","steps":["1"],"system":"Microbiology","discipline":"Microbiology","topic":"Infant botulism","stem":"A 4-month-old girl is brought to the physician because of constipation for 5 days and poor feeding. Her cry is weak, she has drooping eyelids, sluggish pupils, and decreased muscle tone. Her parents have been adding honey to her pacifier.\n\nThe toxin responsible acts by which of the following mechanisms?","options":["Blocking postsynaptic nicotinic acetylcholine receptors","Inhibiting voltage-gated sodium channels","Blocking release of GABA and glycine from Renshaw cells","Inhibiting acetylcholinesterase","Cleaving SNARE proteins needed for acetylcholine release"],"answer":4,"explanation":"Clostridium botulinum produces a toxin that cleaves SNARE proteins, preventing release of acetylcholine at neuromuscular junctions and autonomic synapses. This causes descending flaccid paralysis starting with cranial nerves, along with constipation and dilated pupils. In infants, spores from honey germinate in the gut and produce toxin; treatment is botulism immune globulin. In adults, preformed toxin in canned food causes the disease. Tetanus toxin cleaves SNAREs in inhibitory interneurons instead.","ko":"영아 보툴리누스: 꿀 속 포자, SNARE 절단 → ACh 유리 차단 → 이완성 마비·변비."},{"id":"mb15","steps":["1"],"system":"Microbiology","discipline":"Microbiology","topic":"Tetanus toxin","stem":"A 45-year-old unvaccinated farmer has jaw stiffness and difficulty swallowing 10 days after a deep puncture wound from a pitchfork. He then develops painful generalized muscle spasms with arching of his back triggered by noise.\n\nThe toxin responsible acts by which of the following mechanisms?","options":["Blocking release of acetylcholine at the neuromuscular junction","Destroying anterior horn motor neurons","Binding postsynaptic glutamate receptors","Activating adenylyl cyclase in neurons","Blocking release of GABA and glycine from inhibitory interneurons"],"answer":4,"explanation":"Clostridium tetani spores germinate in anaerobic wounds and produce tetanospasmin, which travels retrograde along axons to the spinal cord. There it cleaves synaptobrevin in Renshaw cells and other inhibitory interneurons, blocking release of GABA and glycine. Unopposed motor activity causes trismus (lockjaw), risus sardonicus, opisthotonos, and spasms. Treatment includes tetanus immune globulin, wound debridement, metronidazole, benzodiazepines, and vaccination.","ko":"파상풍 독소: Renshaw 세포의 GABA·glycine 유리 차단 → 강직·개구장애."},{"id":"mb16","steps":["1"],"system":"Microbiology","discipline":"Microbiology","topic":"Staphylococcus saprophyticus","stem":"A 19-year-old sexually active woman has dysuria and urinary frequency. Urine culture grows gram-positive cocci in clusters that are catalase-positive, coagulase-negative, and resistant to novobiocin.\n\nWhich of the following is the most likely organism?","options":["Streptococcus agalactiae","Enterococcus faecalis","Staphylococcus aureus","Staphylococcus saprophyticus","Staphylococcus epidermidis"],"answer":3,"explanation":"Staphylococci are catalase-positive gram-positive cocci in clusters. S. aureus is coagulase-positive. Among coagulase-negative species, S. saprophyticus is novobiocin-resistant and is the second most common cause of uncomplicated UTI in young sexually active women after E. coli. S. epidermidis is novobiocin-sensitive and infects prosthetic devices and catheters through biofilms. Streptococci and enterococci are catalase-negative.","ko":"카탈라아제+, 코아귤라아제−, novobiocin 내성 = S. saprophyticus (젊은 여성 UTI)."},{"id":"mb17","steps":["1"],"system":"Microbiology","discipline":"Microbiology","topic":"Group B streptococcus","stem":"A 2-day-old boy born at 36 weeks becomes lethargic, has a temperature of 38.6°C (101.5°F), and grunts with breathing. His mother had prolonged rupture of membranes and did not receive antibiotics during labor. Blood culture grows gram-positive cocci in chains that are β-hemolytic, bacitracin-resistant, and CAMP-test positive.\n\nWhich of the following is the most likely organism?","options":["Streptococcus pyogenes","Streptococcus agalactiae","Escherichia coli","Streptococcus pneumoniae","Listeria monocytogenes"],"answer":1,"explanation":"Group B streptococcus (Streptococcus agalactiae) colonizes the vagina and is a leading cause of neonatal sepsis, pneumonia, and meningitis. It is β-hemolytic, bacitracin-resistant, hippurate-positive, and CAMP-test positive. Pregnant women are screened by rectovaginal culture at 36 to 37 weeks, and colonized women receive intrapartum penicillin. Group A strep (S. pyogenes) is bacitracin-sensitive.","ko":"GBS(S. agalactiae): 신생아 패혈증·수막염, bacitracin 내성, CAMP(+). 분만 중 페니실린."},{"id":"mb18","steps":["1"],"system":"Microbiology","discipline":"Microbiology","topic":"Listeria","stem":"A 30-year-old woman at 28 weeks' gestation has fever, muscle aches, and diarrhea after eating soft unpasteurized cheese and deli meats. Blood culture grows small gram-positive rods that show tumbling motility at room temperature and grow at refrigerator temperature.\n\nWhich of the following is the most appropriate antibiotic?","options":["Ampicillin","Clindamycin","Ciprofloxacin","Vancomycin","Ceftriaxone"],"answer":0,"explanation":"Listeria monocytogenes is a facultative intracellular gram-positive rod that grows in the cold and is transmitted through unpasteurized dairy products and deli meats. It spreads from cell to cell using actin rockets. It causes infection in pregnant women (with risk of miscarriage, stillbirth, and neonatal sepsis or meningitis), neonates, older adults, and immunocompromised people. Cephalosporins are ineffective, so ampicillin is the treatment, which is why ampicillin is added to empiric meningitis therapy in these groups.","ko":"Listeria: 비살균 치즈·델리육, 저온 증식, actin rocket, 임신부·신생아 → ampicillin (세팔로스포린 무효)."},{"id":"mb19","steps":["1"],"system":"Microbiology","discipline":"Microbiology","topic":"EHEC and HUS","stem":"A 5-year-old girl has bloody diarrhea for 3 days after eating an undercooked hamburger at a barbecue. A week later she becomes pale, her urine output drops, and she has petechiae. Laboratory studies show anemia with schistocytes, thrombocytopenia, and an elevated creatinine.\n\nThe organism most likely responsible has which of the following characteristics?","options":["It is a comma-shaped organism that grows at 42°C","It does not ferment sorbitol and produces Shiga-like toxin","It is lactose-negative and produces hydrogen sulfide","It invades the colonic mucosa and causes fever with dysentery in small inocula","It produces heat-labile toxin causing travelers' diarrhea"],"answer":1,"explanation":"Enterohemorrhagic E. coli O157:H7 is transmitted through undercooked beef and causes bloody diarrhea without much fever. Unlike most E. coli, it does not ferment sorbitol. Its Shiga-like toxin inactivates the 60S ribosomal subunit and damages endothelium, especially in the kidney, causing hemolytic uremic syndrome: microangiopathic hemolytic anemia, thrombocytopenia, and acute kidney injury. Antibiotics may increase the risk of HUS and are generally avoided. Shigella invades mucosa, and Salmonella produces H2S.","ko":"EHEC O157:H7: 덜 익힌 햄버거, sorbitol 비발효, Shiga-like 독소 → HUS. 항생제 피함."},{"id":"mb20","steps":["1"],"system":"Microbiology","discipline":"Microbiology","topic":"Pseudomonas in burns","stem":"A 34-year-old man with second- and third-degree burns over 40% of his body develops fever and green-blue discoloration of the burn dressings with a sweet, grapelike odor. Culture grows an oxidase-positive, non-lactose-fermenting gram-negative rod.\n\nWhich of the following is the most likely organism?","options":["Serratia marcescens","Escherichia coli","Pseudomonas aeruginosa","Klebsiella pneumoniae","Proteus mirabilis"],"answer":2,"explanation":"Pseudomonas aeruginosa is an aerobic, oxidase-positive, non-lactose-fermenting gram-negative rod that produces blue-green pigments (pyocyanin and pyoverdine) and a grapelike odor. It infects burns, causes pneumonia in cystic fibrosis and ventilated patients, otitis externa, hot tub folliculitis, osteomyelitis after puncture wounds through sneakers, and ecthyma gangrenosum in neutropenic patients. Treatment uses antipseudomonal β-lactams such as piperacillin-tazobactam, cefepime, or carbapenems, sometimes with an aminoglycoside.","ko":"Pseudomonas: 화상·CF, 청록색 색소, 포도향, oxidase(+) 비유당발효."},{"id":"mb21","steps":["1"],"system":"Microbiology","discipline":"Microbiology","topic":"HIV entry and CCR5","stem":"A man has had many exposures to HIV but has never become infected. Genetic testing shows that he is homozygous for a 32-base pair deletion in a host gene.\n\nThis deletion affects which of the following proteins required for viral entry?","options":["Reverse transcriptase","CCR5 coreceptor on macrophages and T cells","Integrase","CD4 molecule on helper T cells","gp41 viral fusion protein"],"answer":1,"explanation":"HIV gp120 binds CD4 and then a coreceptor, CCR5 (on macrophages and T cells, used early in infection) or CXCR4 (on T cells, used later). gp41 then mediates fusion with the cell membrane. People homozygous for the CCR5 Δ32 deletion are highly resistant to infection with CCR5-tropic HIV. Maraviroc blocks CCR5, and enfuvirtide blocks gp41 fusion.","ko":"HIV 진입: gp120 → CD4 + CCR5/CXCR4, gp41 융합. CCR5 Δ32 동형접합 = 저항성. Maraviroc."},{"id":"mb22","steps":["1"],"system":"Microbiology","discipline":"Microbiology","topic":"Clostridium perfringens","stem":"A 28-year-old man sustains a deep crush injury to his thigh in a motorcycle crash. Two days later, the wound is extremely painful, swollen, and draining thin brown fluid, and there is crackling under the skin when it is pressed. Gram stain shows large gram-positive rods with no spores and few white cells.\n\nThe main toxin of this organism damages tissue by which of the following mechanisms?","options":["Cleavage of SNARE proteins","Superantigen activation of T cells","Inhibition of elongation factor 2","Phospholipase (lecithinase) activity that destroys cell membranes","ADP-ribosylation of Gs"],"answer":3,"explanation":"Clostridium perfringens is an anaerobic gram-positive rod that causes gas gangrene (clostridial myonecrosis) in contaminated deep wounds. Its α-toxin is a phospholipase (lecithinase) that destroys cell membranes, causing myonecrosis, hemolysis, and few inflammatory cells at the site. Gas in tissue causes crepitus. Treatment is urgent surgical debridement with penicillin and clindamycin. C. perfringens also causes a mild, self-limited food poisoning from reheated meat.","ko":"C. perfringens 가스괴저: α독소 = 레시티나아제(인지질분해효소), 염발음, 응급 절제."},{"id":"mb23","steps":["1"],"system":"Microbiology","discipline":"Microbiology","topic":"HSV encephalitis","stem":"A 34-year-old man is brought to the emergency department because of 3 days of fever, headache, and strange behavior. He reports smelling burning rubber that no one else notices, then has a seizure. MRI shows hyperintensity of the right medial temporal lobe. CSF shows 180 lymphocytes/mm³, many red blood cells, elevated protein, and normal glucose.\n\nThe causative agent is best described by which of the following?","options":["Polyomavirus that destroys oligodendrocytes","Enveloped double-stranded DNA virus that establishes latency in sensory ganglia","Single-stranded RNA flavivirus transmitted by mosquitoes","Negative-sense RNA virus that travels retrograde from a bite wound","Misfolded protein that converts normal proteins"],"answer":1,"explanation":"Herpes simplex virus type 1 is the most common cause of sporadic fatal viral encephalitis. It targets the temporal lobes, causing fever, altered behavior, olfactory hallucinations, and seizures, with hemorrhagic necrosis that puts red cells in the CSF. HSV is an enveloped dsDNA virus that becomes latent in the trigeminal ganglion. CSF PCR confirms the diagnosis, and IV acyclovir is started immediately on suspicion.","ko":"측두엽 뇌염 + 후각 환각 + CSF 적혈구 → HSV-1, 즉시 acyclovir."},{"id":"mb24","steps":["1"],"system":"Microbiology","discipline":"Pharmacology","topic":"Ganciclovir toxicity","stem":"A 41-year-old man with AIDS and a CD4+ count of 28/mm³ has floaters and blurred vision in his right eye. Funduscopy shows fluffy yellow-white retinal lesions with hemorrhages along the vessels. He is treated with IV ganciclovir.\n\nWhich adverse effect is most important to monitor with this drug?","options":["Peripheral neuropathy","Hemorrhagic cystitis","Nephrotoxicity with hypomagnesemia","Optic neuritis","Neutropenia and thrombocytopenia"],"answer":4,"explanation":"CMV retinitis occurs when the CD4+ count falls below 50/mm³ and causes hemorrhagic, necrotic retinal lesions (pizza pie appearance). Ganciclovir is phosphorylated first by the CMV kinase UL97 and then inhibits viral DNA polymerase. Its main toxicity is bone marrow suppression (neutropenia, thrombocytopenia, anemia). Foscarnet and cidofovir are nephrotoxic alternatives for resistant CMV, and foscarnet also lowers calcium and magnesium.","ko":"CMV 망막염(CD4 \u003c50) → ganciclovir(UL97 인산화), 골수억제. Foscarnet·cidofovir는 신독성."},{"id":"mb25","steps":["1"],"system":"Microbiology","discipline":"Immunology","topic":"Infectious mononucleosis","stem":"A 17-year-old girl has had fever, severe sore throat, and fatigue for 10 days. She has exudative tonsillitis, posterior cervical lymphadenopathy, and a palpable spleen. A heterophile antibody test is positive. The blood smear shows many large lymphocytes with abundant cytoplasm that indents around adjacent red cells.\n\nThese atypical lymphocytes are mainly which of the following?","options":["B cells infected by the virus","CD8+ T cells responding to infected B cells","Plasma cells producing heterophile antibodies","Natural killer cells","Monocytes infected by the virus"],"answer":1,"explanation":"Epstein-Barr virus infects B cells through CD21. The atypical lymphocytes in mononucleosis are reactive CD8+ cytotoxic T cells responding to infected B cells. Heterophile (Monospot) antibodies are IgM that agglutinate sheep or horse red cells. Patients should avoid contact sports because of the risk of splenic rupture, and aminopenicillins often cause a rash. EBV is associated with Burkitt lymphoma, Hodgkin lymphoma, nasopharyngeal carcinoma, and lymphomas in transplant recipients.","ko":"EBV: B세포(CD21) 감염, 비정형 림프구 = 반응성 CD8 T세포. 접촉 스포츠 금지."},{"id":"mb26","steps":["1"],"system":"Microbiology","discipline":"Microbiology","topic":"Hepatitis D","stem":"A 30-year-old man with chronic hepatitis B who injects drugs develops a sudden severe flare of hepatitis with jaundice and coagulopathy. Testing shows antibodies to a defective RNA virus.\n\nThis virus can replicate only in the presence of which of the following?","options":["Hepatitis B surface antigen","Hepatitis A capsid","Hepatitis C core protein","Host DNA polymerase II","Hepatitis B reverse transcr
