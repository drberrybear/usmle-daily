gradation of sphingolipids","Protein glycosylation in the Golgi apparatus"],"answer":1,"explanation":"X-linked adrenoleukodystrophy is caused by mutations in ABCD1, a transporter that brings very-long-chain fatty acids into peroxisomes for β-oxidation. VLCFAs accumulate in the adrenal cortex, testes, and white matter, causing adrenal insufficiency and progressive demyelination in boys. Peroxisomes also make plasmalogens; Zellweger syndrome is a defect in peroxisome biogenesis. Hematopoietic stem cell transplantation can help early cerebral disease.","ko":"X연관 부신백질이영양증: ABCD1 → 퍼옥시좀 VLCFA β산화 장애 → 부신부전 + 탈수초."},{"id":"cb18","steps":["1"],"system":"General Principles","discipline":"Pharmacology","topic":"Gq-coupled receptors","stem":"A patient with hypotension during anesthesia receives an IV drug that raises his blood pressure by constricting vascular smooth muscle. Its receptor activates phospholipase C.\n\nWhich of the following receptors uses the same signaling pathway?","options":["V2 vasopressin receptor","H1 histamine receptor","β1-adrenergic receptor","α2-adrenergic receptor","D1 dopamine receptor"],"answer":1,"explanation":"Phenylephrine acts on α1 receptors, which are coupled to Gq. Gq activates phospholipase C, producing IP3 (which releases calcium from the sarcoplasmic reticulum) and DAG (which activates protein kinase C). Other Gq receptors include H1, V1, M1, and M3 (mnemonic: HAVe 1 M&M). Gs receptors (β1, β2, D1, H2, V2) increase cAMP, and Gi receptors (α2, M2, D2) decrease it.","ko":"Gq(IP3/DAG/Ca): α1, H1, V1, M1, M3. Gs(cAMP↑): β, D1, H2, V2. Gi: α2, M2, D2."},{"id":"cb19","steps":["1"],"system":"General Principles","discipline":"Biochemistry","topic":"Competitive enzyme inhibition","stem":"An enzyme is studied in the presence of an inhibitor that resembles its substrate and binds the active site reversibly. Adding more substrate overcomes the inhibition.\n\nWhich of the following describes the effects on Km and Vmax?","options":["Km is unchanged; Vmax decreases","Both Km and Vmax are unchanged","Both Km and Vmax decrease","Km decreases; Vmax increases","Km increases; Vmax is unchanged"],"answer":4,"explanation":"A competitive inhibitor competes with substrate for the active site, so more substrate is needed to reach half-maximal velocity (Km increases, lower apparent affinity), but at high substrate the maximal velocity is unchanged. On a Lineweaver-Burk plot, the lines intersect on the y-axis. A noncompetitive inhibitor binds elsewhere, decreases Vmax, and leaves Km unchanged, with lines intersecting on the x-axis. Methotrexate competitively inhibits dihydrofolate reductase.","ko":"경쟁적 억제: Km↑, Vmax 동일 (y축에서 교차). 비경쟁적: Vmax↓, Km 동일."},{"id":"cb20","steps":["1"],"system":"General Principles","discipline":"Biochemistry","topic":"Ethanol hypoglycemia","stem":"A 40-year-old man is brought to the emergency department confused and sweaty after 3 days of heavy drinking with little food. Blood glucose is 38 mg/dL, and serum lactate is mildly elevated.\n\nWhich of the following best explains his hypoglycemia?","options":["Ethanol inhibits glycogen phosphorylase","Ethanol increases glucose uptake by skeletal muscle","Acetaldehyde inhibits glucose-6-phosphatase","A high NADH/NAD+ ratio diverts pyruvate and oxaloacetate away from gluconeogenesis","Ethanol directly stimulates insulin secretion"],"answer":3,"explanation":"Ethanol is metabolized by alcohol dehydrogenase and aldehyde dehydrogenase, both of which convert NAD+ to NADH. The high NADH/NAD+ ratio shifts pyruvate to lactate and oxaloacetate to malate, depriving gluconeogenesis of substrates. When glycogen stores are depleted by fasting, hypoglycemia results. The same ratio shift favors fatty acid synthesis (fatty liver) and lactic acidosis.","ko":"알코올 저혈당: NADH/NAD+↑ → 피루브산→젖산, OAA→말산 → 포도당신생 차단(글리코겐 고갈 시)."},{"id":"cb21","steps":["1"],"system":"General Principles","discipline":"Biochemistry","topic":"MCAD deficiency","stem":"A 14-month-old girl is found lethargic and difficult to arouse after being unable to eat for a day because of a stomach virus. Blood glucose is 32 mg/dL, and urine ketones are negative. Plasma shows elevated medium-chain acylcarnitines, and urine shows dicarboxylic acids.\n\nWhich of the following best explains the absence of ketones?","options":["Ketones are rapidly excreted in the urine","Insulin levels are inappropriately high","Fatty acids cannot be oxidized to acetyl-CoA for ketone synthesis","The liver lacks the enzymes for ketone synthesis","The brain consumes all ketones produced"],"answer":2,"explanation":"Medium-chain acyl-CoA dehydrogenase deficiency is the most common fatty acid oxidation disorder and is autosomal recessive. During fasting, the body cannot break down fatty acids to acetyl-CoA, so the liver cannot produce ketones, and gluconeogenesis is impaired from lack of acetyl-CoA (activator of pyruvate carboxylase) and ATP, causing hypoketotic hypoglycemia. It can cause sudden death. Treatment is avoiding fasting and giving frequent carbohydrate-rich meals.","ko":"MCAD 결핍: 금식 시 저케톤성 저혈당, 중쇄 아실카르니틴↑. 금식 피하기."},{"id":"cb22","steps":["1"],"system":"General Principles","discipline":"Biochemistry","topic":"Ketone body use","stem":"After 5 days of fasting, the brain obtains much of its energy from ketone bodies made in the liver.\n\nWhich of the following tissues cannot use ketone bodies for energy?","options":["Red blood cells","Cardiac muscle","Brain","Skeletal muscle","Renal cortex"],"answer":0,"explanation":"Ketone bodies (acetoacetate and β-hydroxybutyrate) are made in liver mitochondria from acetyl-CoA during prolonged fasting, uncontrolled type 1 diabetes, and alcoholism. Extrahepatic tissues with mitochondria convert them back to acetyl-CoA using succinyl-CoA:acetoacetate CoA transferase, which the liver lacks. Red blood cells have no mitochondria and rely entirely on glycolysis. Urine dipsticks detect acetoacetate but not β-hydroxybutyrate.","ko":"케톤체: 간에서 생성(간은 사용 못 함), 적혈구도 사용 못 함(미토콘드리아 없음)."},{"id":"cb23","steps":["1"],"system":"General Principles","discipline":"Genetics","topic":"Familial hypercholesterolemia","stem":"A 12-year-old boy has yellow nodules on his Achilles tendons and knuckles. His LDL cholesterol is 520 mg/dL, and triglycerides are normal. His father had a myocardial infarction at age 32.\n\nThe primary defect most likely involves which of the following?","options":["Lipoprotein lipase","Apolipoprotein E","LDL receptor","Microsomal triglyceride transfer protein","Apolipoprotein C-II"],"answer":2,"explanation":"Familial hypercholesterolemia is an autosomal dominant defect in the LDL receptor (or apoB-100 or PCSK9 gain-of-function), impairing LDL clearance. Heterozygotes have LDL around 200 to 400 mg/dL; homozygotes have LDL above 500 and may have MIs in childhood. Findings include tendon xanthomas and corneal arcus. Lipoprotein lipase and apoC-II deficiency cause type I hyperchylomicronemia, apoE defects cause dysbetalipoproteinemia, and MTP defects cause abetalipoproteinemia.","ko":"가족성 고콜레스테롤혈증: LDL 수용체(AD), 힘줄 황색종, 조기 MI."},{"id":"cb24","steps":["1"],"system":"General Principles","discipline":"Genetics","topic":"Lipoprotein lipase deficiency","stem":"A 7-year-old boy has recurrent episodes of acute pancreatitis. He has crops of small yellow papules on his buttocks, and his retinal vessels appear pale. Blood drawn after an overnight fast forms a creamy layer on top after refrigeration. Serum triglycerides are 3,200 mg/dL.\n\nDeficiency of which of the following is most likely?","options":["HMG-CoA reductase","Lipoprotein lipase","Apolipoprotein B-100","LDL receptor","Lecithin-cholesterol acyltransferase"],"answer":1,"explanation":"Familial chylomicronemia syndrome (type I hyperlipoproteinemia) is an autosomal recessive deficiency of lipoprotein lipase or its cofactor apoC-II. Chylomicrons cannot be broken down, causing very high triglycerides, pancreatitis, eruptive xanthomas, lipemia retinalis, and hepatosplenomegaly, but no increased risk of atherosclerosis. Treatment is a very low-fat diet.","ko":"1형 고지단백혈증: LPL·apoC-II 결핍, 킬로미크론↑, 췌장염·발진성 황색종."},{"id":"cb25","steps":["1"],"system":"General Principles","discipline":"Biochemistry","topic":"Lesch-Nyhan syndrome","stem":"A 3-year-old boy has developmental delay, involuntary writhing movements, and aggressive behavior, and he bites his lips and fingers. His diapers have orange sand-like crystals. Serum uric acid is elevated.\n\nDeficiency of which enzyme is most likely?","options":["Orotate phosphoribosyltransferase","Adenosine deaminase","Hypoxanthine-guanine phosphoribosyltransferase","Xanthine oxidase","PRPP synthetase overactivity"],"answer":2,"explanation":"Lesch-Nyhan syndrome is an X-linked recessive deficiency of HGPRT in the purine salvage pathway. Hypoxanthine and guanine are not recycled, so purine synthesis increases and uric acid rises, causing gout, kidney stones, intellectual disability, dystonia, and self-mutilation. Allopurinol lowers uric acid but does not improve the neurologic problems. ADA deficiency causes SCID.","ko":"Lesch-Nyhan: HGPRT 결핍(X연관), 고요산혈증 + 자해 행동 + 근긴장이상."},{"id":"cb26","steps":["1"],"system":"General Principles","discipline":"Biochemistry","topic":"Hereditary orotic aciduria","stem":"A 1-year-old boy has poor growth and megaloblastic anemia that does not improve with vitamin B12 or folic acid. Urine orotic acid is markedly elevated, and plasma ammonia is normal.\n\nWhich of the following is the most appropriate treatment?","options":["Low-protein diet","Folic acid","Arginine supplementation","Uridine","Vitamin B12"],"answer":3,"explanation":"Hereditary orotic aciduria is an autosomal recessive deficiency of UMP synthase in de novo pyrimidine synthesis. Orotic acid accumulates, and lack of pyrimidines impairs DNA synthesis, causing megaloblastic anemia unresponsive to B12 and folate, and failure to thrive. Uridine supplementation bypasses the block. Ornithine transcarbamylase deficiency also increases orotic acid but causes hyperammonemia without megaloblastic anemia.","ko":"유전성 오로트산뇨증: UMP synthase 결핍, B12·엽산 무반응 거대적아구빈혈, 암모니아 정상 → uridine."},{"id":"cb27","steps":["1"],"system":"General Principles","discipline":"Biochemistry","topic":"Biotin deficiency","stem":"A 30-year-old bodybuilder who drinks a dozen raw egg whites daily develops hair loss, a scaly red rash around his eyes and mouth, and fatigue. Laboratory studies show lactic acidosis.\n\nDeficiency of a cofactor for which type of enzyme is most likely?","options":["Carboxylases","Methyltransferases","Oxidative decarboxylases","Transaminases","Hydroxylases that convert proline"],"answer":0,"explanation":"Raw egg whites contain avidin, which binds biotin and prevents its absorption. Biotin is the cofactor for carboxylases that add one-carbon groups: pyruvate carboxylase (pyruvate to oxaloacetate), acetyl-CoA carboxylase, and propionyl-CoA carboxylase. Deficiency causes dermatitis, alopecia, and lactic acidosis. Transaminases require vitamin B6, oxidative decarboxylases such as pyruvate dehydrogenase require thiamine, and prolyl hydroxylase requires vitamin C.","ko":"생달걀 흰자(avidin) → 비오틴 결핍. 비오틴 = 카르복실화효소 보조인자."},{"id":"cb28","steps":["1"],"system":"General Principles","discipline":"Biochemistry","topic":"Zinc deficiency","stem":"A 3-month-old boy who was weaned early from breast milk to a homemade formula has a crusted, red rash around his mouth, eyes, and anus and on his hands and feet, along with diarrhea, hair loss, and irritability. A wound from a heel stick has healed slowly.\n\nDeficiency of which of the following is most likely?","options":["Zinc","Niacin","Vitamin A","Copper","Selenium"],"answer":0,"explanation":"Zinc deficiency (inherited as acrodermatitis enteropathica, or acquired from poor intake or malabsorption) causes a periorificial and acral rash, alopecia, diarrhea, delayed wound healing, hypogonadism, and impaired taste and smell. Zinc is needed for many enzymes, including matrix metalloproteinases in wound healing. Copper deficiency causes anemia, neutropenia, and myeloneuropathy, and niacin deficiency causes pellagra with photosensitive dermatitis.","ko":"아연 결핍: 구강·항문 주위 + 사지말단 피부염, 탈모, 설사, 상처 치유 지연."},{"id":"cb29","steps":["1"],"system":"General Principles","discipline":"Pathology","topic":"Squamous metaplasia","stem":"A bronchial biopsy from a 55-year-old man who has smoked two packs a day for 30 years shows that the normal ciliated pseudostratified columnar epithelium has been replaced by stratified squamous epithelium without atypia.\n\nWhich of the following best describes this change?","options":["Reversible metaplasia in response to chronic irritation","Carcinoma in situ","Dysplasia that is irreversible","Atrophy of the epithelium","Hyperplasia of goblet cells"],"answer":0,"explanation":"Metaplasia is replacement of one differentiated cell type by another better able to tolerate stress. In smokers, the respiratory epithelium becomes squamous, which is more resistant but loses mucociliary clearance. It is reversible if the stimulus is removed but can progress to dysplasia and squamous cell carcinoma if it persists. Other examples include Barrett esophagus and squamous metaplasia of the cervix and bladder.","ko":"화생 = 한 분화세포가 다른 분화세포로 대체(가역적). 흡연 기관지 편평상피화생 → 이형성 → 암."},{"id":"cb30","steps":["1"],"system":"General Principles","discipline":"Biochemistry","topic":"Glycolysis regulation","stem":"During fasting, glucagon acts on hepatocytes to reduce glycolysis and increase gluconeogenesis. It does this partly by changing the level of a key allosteric regulator.\n\nWhich of the following changes occurs in hepatocytes in response to glucagon?","options":["Increased activity of phosphofructokinase-1","Decreased activity of fructose-1,6-bisphosphatase","Increased fructose-2,6-bisphosphate","Increased activity of pyruvate kinase","Decreased fructose-2,6-bisphosphate"],"answer":4,"explanation":"Fructose-2,6-bisphosphate activates phosphofructokinase-1 (the rate-limiting step of glycolysis) and inhibits fructose-1,6-bisphosphatase (gluconeogenesis). Glucagon raises cAMP and activates protein kinase A, which phosphorylates the bifunctional enzyme to favor its phosphatase activity, lowering fructose-2,6-bisphosphate. As a result, glycolysis slows and gluconeogenesis increases. PKA also inactivates hepatic pyruvate kinase. Insulin has the opposite effects.","ko":"Glucagon → PKA → F2,6BP↓ → PFK-1↓(해당과정↓), F1,6BPase↑(포도당신생↑)."},{"id":"cv01","steps":["1"],"system":"Cardiovascular","discipline":"Pathology","topic":"Calcific aortic stenosis","stem":"A 79-year-old man comes to the physician because of two episodes of lightheadedness while climbing stairs and chest tightness with exertion over the past 3 months. Examination shows a harsh crescendo-decrescendo systolic murmur at the right upper sternal border that radiates to the carotid arteries, with a soft, single S2 and delayed carotid upstrokes.\n\nWhich of the following is the most likely underlying cause of this patient's murmur?","options":["Age-related calcification of a trileaflet aortic valve","Myxomatous degeneration of the aortic valve","Healed infective endocarditis","Congenital bicuspid aortic valve","Chronic rheumatic heart disease"],"answer":0,"explanation":"Exertional syncope, angina, and a crescendo-decrescendo murmur radiating to the carotids with pulsus parvus et tardus indicate aortic stenosis. In patients older than 70, the most common cause is dystrophic calcification of a normal trileaflet valve. A bicuspid valve causes stenosis earlier, typically in the 50s to 60s. Rheumatic aortic stenosis almost always occurs together with mitral valve disease.","ko":"고령 AS = 정상 3엽 판막의 노인성 석회화. 이엽판막은 더 젊은 나이(50~60대)."},{"id":"cv02","steps":["1"],"system":"Cardiovascular","discipline":"Pharmacology","topic":"Nitrate mechanism","stem":"A 62-year-old man has chest pressure when he walks uphill that resolves with rest. He is prescribed a sublingual medication to take at the onset of pain, and he is warned that combining it with sildenafil can cause dangerous hypotension.\n\nWhich of the following best describes the mechanism of action of the prescribed drug?","options":["Blocks β1-adrenergic receptors in the myocardium","Increases cGMP in vascular smooth muscle through nitric oxide release","Blocks L-type calcium channels in vascular smooth muscle","Inhibits the late inward sodium current in cardiac myocytes","Inhibits phosphodiesterase-3 in cardiac myocytes"],"answer":1,"explanation":"Nitroglycerin releases nitric oxide, which activates guanylyl cyclase and raises cGMP, leading to dephosphorylation of myosin light chains and smooth muscle relaxation. Nitrates dilate veins more than arteries, so the main antianginal effect is reduced preload, which lowers left ventricular wall stress and oxygen demand. PDE-5 inhibitors block cGMP breakdown and potentiate this effect, causing severe hypotension. Ranolazine inhibits the late sodium current.","ko":"질산염: NO → cGMP↑ → 정맥 확장 → preload↓. PDE5 억제제와 병용 금기."},{"id":"cv03","steps":["1"],"system":"Cardiovascular","discipline":"Pathology","topic":"MI histology timeline","stem":"A 66-year-old man dies 2 days after an acute anterior myocardial infarction. At autopsy, a section of the anterior left ventricular wall is examined microscopically.\n\nWhich of the following findings is most likely?","options":["Coagulative necrosis with an extensive neutrophilic infiltrate","Lymphocytes surrounding intact myocytes","Normal-appearing myocardium","Dense collagenous scar","Macrophages phagocytosing necrotic myocytes and early granulation tissue"],"answer":0,"explanation":"After an MI, the first 4 hours show no light-microscopic change; at 4 to 24 hours, coagulative necrosis, wavy fibers, and contraction bands (with reperfusion) appear; at 1 to 3 days, neutrophils infiltrate; from 3 to 14 days, macrophages remove debris and granulation tissue forms, a period when the wall is weakest and rupture is most likely; after 2 weeks to 2 months, a collagen scar forms.","ko":"MI 1~3일: 응고괴사 + 호중구. 3~14일: 대식세포·육아조직(파열 위험)."},{"id":"cv04","steps":["1"],"system":"Cardiovascular","discipline":"Pathology","topic":"Post-MI free wall rupture","stem":"A 71-year-old woman is hospitalized for an acute lateral myocardial infarction that was not reperfused. On hospital day 5, she suddenly becomes unresponsive. Blood pressure is 60/40 mm Hg, jugular veins are distended, and heart sounds are muffled. The ECG monitor shows sinus rhythm, but no pulse can be felt.\n\nWhich of the following is the most likely cause?","options":["Rupture of the left ventricular free wall","Reinfarction of the same territory","Autoimmune pericarditis","Left ventricular aneurysm","Rupture of the posteromedial papillary muscle"],"answer":0,"explanation":"Sudden hypotension with distended neck veins, muffled heart sounds, and pulseless electrical activity 3 to 14 days after an MI indicates free wall rupture with cardiac tamponade. This is when macrophages have degraded necrotic tissue but little collagen has been laid down. Papillary muscle rupture (often days 2 to 7) causes acute mitral regurgitation with a new holosystolic murmur and pulmonary edema. Ventricular aneurysm and Dressler syndrome occur weeks to months later.","ko":"MI 3~14일 후 급성 탐포나데·PEA → 자유벽 파열."},{"id":"cv05","steps":["1"],"system":"Cardiovascular","discipline":"Physiology","topic":"Atrial septal defect","stem":"A 26-year-old woman is evaluated for mild exertional dyspnea. Examination shows a grade 2/6 systolic ejection murmur at the left upper sternal border. The second heart sound is widely split, and the split does not change with respiration.\n\nWhich of the following is the most likely diagnosis?","options":["Membranous ventricular septal defect","Ostium secundum atrial septal defect","Tetralogy of Fallot","Patent ductus arteriosus","Coarctation of the aorta"],"answer":1,"explanation":"Fixed splitting of S2 is the hallmark of an atrial septal defect. The left-to-right shunt increases right ventricular volume and delays pulmonic valve closure, and because the shunt balances respiratory changes in venous return, the split does not vary with respiration. The murmur is a flow murmur across the pulmonic valve, not across the defect itself. ASDs allow paradoxical emboli and can progress to Eisenmenger syndrome.","ko":"고정 분열 S2 = ASD. 잡음은 폐동맥판을 지나는 유량 증가 때문."},{"id":"cv06","steps":["1"],"system":"Cardiovascular","discipline":"Pharmacology","topic":"Digoxin toxicity","stem":"A 78-year-old woman with heart failure and atrial fibrillation comes to the emergency department because of nausea, vomiting, and seeing yellow halos around lights for 3 days. Her furosemide dose was recently increased. Serum potassium is 2.9 mEq/L and creatinine is 1.9 mg/dL. ECG shows frequent premature ventricular contractions and scooped ST segments.\n\nInhibition of which of the following is the primary mechanism of the drug causing her symptoms?","options":["Delayed rectifier potassium channels","Phosphodiesterase-3","Na+/K+-ATPase","β1-adrenergic receptors","Funny (If) sodium channels"],"answer":2,"explanation":"Digoxin inhibits the Na+/K+-ATPase; the higher intracellular sodium reduces calcium extrusion by the Na+/Ca2+ exchanger, increasing contractility. It also increases vagal tone and slows AV conduction. Toxicity causes GI symptoms, yellow vision, and arrhythmias. Hypokalemia worsens toxicity because potassium competes with digoxin for the pump, and renal failure reduces its clearance. Treatment is digoxin immune Fab.","ko":"Digoxin = Na/K-ATPase 억제. 저칼륨·신부전에서 독성↑, 황시증, 해독제 Fab."},{"id":"cv07","steps":["1"],"system":"Cardiovascular","discipline":"Pharmacology","topic":"Statin myopathy","stem":"A 63-year-old man with coronary artery disease takes atorvastatin. His physician adds gemfibrozil for hypertriglyceridemia. Six weeks later, he has diffuse muscle aches and weakness. Serum creatine kinase is 12 times the upper limit of normal.\n\nAtorvastatin inhibits which of the following enzymes?","options":["Cholesterol 7α-hydroxylase","Proprotein convertase subtilisin/kexin type 9","Acetyl-CoA carboxylase","HMG-CoA reductase","Lipoprotein lipase"],"answer":3,"explanation":"Statins inhibit HMG-CoA reductase, the rate-limiting step of cholesterol synthesis (HMG-CoA to mevalonate). Lower hepatocyte cholesterol upregulates LDL receptors and lowers serum LDL. Myopathy and rhabdomyolysis are more likely when statins are combined with fibrates (especially gemfibrozil), niacin, or CYP3A4 inhibitors. Fibrates activate PPAR-α and increase lipoprotein lipase activity; PCSK9 is the target of evolocumab and alirocumab.","ko":"Statin = HMG-CoA reductase 억제. 피브레이트(특히 gemfibrozil) 병용 시 근병증↑."},{"id":"cv08","steps":["1"],"system":"Cardiovascular","discipline":"Pathology","topic":"Fatty streak","stem":"At autopsy of a 21-year-old man who died in a motor vehicle collision, the intimal surface of the abdominal aorta shows flat, yellow, slightly raised streaks that do not obstruct flow.\n\nThese lesions are composed mainly of which of the following?","options":["Granulomatous inflammation with giant cells","Homogeneous pink hyaline material in the vessel wall","Lipid-laden macrophages in the intima","Proliferating smooth muscle cells with a fibrous cap over a necrotic core","Calcium deposits in the tunica media"],"answer":2,"explanation":"Fatty streaks are the earliest lesion of atherosclerosis and can appear in childhood. They consist of foam cells, which are macrophages (and some smooth muscle cells) that have taken up oxidized LDL in the intima. Over time, smooth muscle cells migrate from the media, proliferate, and produce extracellular matrix, forming a fibrous cap over a necrotic lipid core. Medial calcification without luminal narrowing describes Mönckeberg sclerosis.","ko":"가장 초기 죽상경화 병변 = fatty streak (산화 LDL을 먹은 foam cell)."},{"id":"cv09","steps":["1"],"system":"Cardiovascular","discipline":"Pathology","topic":"Hypertensive emergency vessels","stem":"A 44-year-old man is brought to the emergency department because of a severe headache and blurred vision. Blood pressure is 238/142 mm Hg. Funduscopy shows papilledema and flame hemorrhages. Serum creatinine is 3.4 mg/dL, up from 1.0 mg/dL 6 months ago.\n\nA kidney biopsy specimen is most likely to show which of the following in the arterioles?","options":["Homogeneous, glassy pink thickening of the wall","Concentric, laminated thickening of the wall with luminal narrowing","Calcification of the internal elastic lamina without luminal narrowing","Linear IgG deposits along the basement membrane","Transmural granulomatous inflammation"],"answer":1,"explanation":"Severe (malignant) hypertension produces hyperplastic arteriolosclerosis: concentric, onion-skin layers of smooth muscle cells and reduplicated basement membrane that narrow the lumen, often with fibrinoid necrosis. This causes ischemic kidney injury. Hyaline arteriolosclerosis, with glassy pink thickening, is seen in chronic benign hypertension and diabetes. Calcification of the media without narrowing is Mönckeberg sclerosis.","ko":"악성 고혈압 = hyperplastic arteriolosclerosis (onion-skin). 당뇨·만성 HTN은 hyaline."},{"id":"cv10","steps":["1"],"system":"Cardiovascular","discipline":"Pathology","topic":"Kawasaki disease","stem":"A 3-year-old boy is brought to the physician because of fever for 6 days. Examination shows bilateral nonexudative conjunctival injection, red cracked lips, a strawberry tongue, a polymorphous truncal rash, a 2-cm unilateral cervical lymph node, and swelling of the hands and feet.\n\nWhich of the following is the most appropriate treatment to reduce the risk of this patient's most serious complication?","options":["IV immune globulin and aspirin","Acetaminophen and observation","Methotrexate","Oral prednisone","Intramuscular penicillin G"],"answer":0,"explanation":"Fever for at least 5 days with conjunctivitis, mucosal changes, rash, cervical lymphadenopathy, and extremity changes indicates Kawasaki disease, a medium-vessel vasculitis of young children. The most serious complication is coronary artery aneurysm, which can cause thrombosis, MI, or rupture. Treatment with IV immune globulin and aspirin lowers this risk; Kawasaki disease is one of the few indications for aspirin in children despite the risk of Reye syndrome. Echocardiography evaluates the coronary arteries.","ko":"가와사키 = 중형혈관염, 관상동맥류 예방 위해 IVIG + 아스피린."},{"id":"cv11","steps":["1"],"system":"Cardiovascular","discipline":"Pathology","topic":"Giant cell arteritis","stem":"A 72-year-old woman comes to the physician because of a new right-sided headache, scalp tenderness when brushing her hair, and pain in her jaw when chewing for 2 weeks. She also has morning stiffness of her shoulders and hips. ESR is 98 mm/h.\n\nWithout prompt treatment, this patient is at greatest risk for which of the following?","options":["Intestinal infarction","Rupture of a cerebral berry aneurysm","Acute renal failure","Pulmonary hemorrhage","Permanent vision loss"],"answer":4,"explanation":"Headache, scalp tenderness, jaw claudication, polymyalgia rheumatica, and a very high ESR in an older adult indicate giant cell (temporal) arteritis, a granulomatous large-vessel vasculitis of branches of the carotid artery. Involvement of the ophthalmic artery can cause sudden irreversible blindness, so high-dose corticosteroids are started immediately, before the temporal artery biopsy, which shows segmental granulomatous inflammation of the media with giant cells. Long-term risk includes thoracic aortic aneurysm.","ko":"측두동맥염: 실명 위험 → 생검 전 즉시 고용량 스테로이드."},{"id":"cv12","steps":["1"],"system":"Cardiovascular","discipline":"Immunology","topic":"Rheumatic fever","stem":"A 10-year-old girl is brought to the physician because of fever and pain that moved from her right knee to her left ankle and then her right wrist over the past week. Three weeks ago she had a sore throat that was not treated. Examination shows a new apical holosystolic murmur and painless subcutaneous nodules over the extensor surfaces of her elbows.\n\nWhich of the following best explains the mechanism of her cardiac involvement?","options":["Deposition of circulating immune complexes in the endocardium","Bacterial toxin causing myocyte necrosis","Direct bacterial invasion of the valve leaflets","Antibodies against streptococcal M protein cross-reacting with cardiac antigens","Superantigen-mediated T-cell activation"],"answer":3,"explanation":"Acute rheumatic fever follows group A streptococcal pharyngitis (not skin infection) and is caused by molecular mimicry: antibodies against streptococcal M protein cross-react with antigens in heart, joints, skin, and brain (type II hypersensitivity). Carditis causes Aschoff bodies and Anitschkow cells; acute disease causes mitral regurgitation, and chronic disease causes mitral stenosis. The Jones criteria include migratory polyarthritis, carditis, subcutaneous nodules, erythema marginatum, and Sydenham chorea.","ko":"류마티스열 = M protein 분자모방 (2형 과민반응). 급성 MR, 만성 MS."},{"id":"cv13","steps":["1"],"system":"Cardiovascular","discipline":"Microbiology","topic":"Endocarditis in injection drug use","stem":"A 31-year-old man who injects heroin comes to the emergency department because of fever and chills for 5 days. Temperature is 39.4°C (102.9°F). He has track marks on both arms and a holosystolic murmur at the left lower sternal border that increases with inspiration. Chest x-ray shows multiple bilateral nodular opacities, some with cavitation.\n\nWhich of the following is the most likely causative organism?","options":["Viridans group streptococci","Enterococcus faecalis","Staphylococcus aureus","Staphylococcus epidermidis","Streptococcus gallolyticus"],"answer":2,"explanation":"Injection drug use predisposes to right-sided endocarditis, most often of the tricuspid valve, caused by Staphylococcus aureus. A tricuspid regurgitation murmur increases with inspiration, and septic emboli to the lungs cause cavitating nodules. S. aureus causes acute endocarditis on normal valves. Viridans streptococci cause subacute disease on previously damaged valves, often after dental work. S. gallolyticus (bovis) endocarditis is associated with colorectal cancer, and S. epidermidis infects prosthetic valves.","ko":"IVDU 심내막염 = 삼첨판, S. aureus, 폐 패혈성 색전."},{"id":"cv14","steps":["1"],"system":"Cardiovascular","discipline":"Pharmacology","topic":"Doxorubicin cardiotoxicity","stem":"A 34-year-old woman comes to the physician because of progressive shortness of breath and leg swelling for 2 months. Five years ago she was treated for Hodgkin lymphoma with chemotherapy. Echocardiography shows four-chamber dilation and a left ventricular ejection fraction of 30%.\n\nWhich of the following drugs most likely caused her current condition?","options":["Dacarbazine","Cisplatin","Bleomycin","Doxorubicin","Vinblastine"],"answer":3,"explanation":"Anthracyclines such as doxorubicin cause dose-dependent dilated cardiomyopathy, partly through generation of free radicals in cardiac myocytes; dexrazoxane, an iron chelator, reduces this risk. ABVD for Hodgkin lymphoma includes doxorubicin, bleomycin, vinblastine, and dacarbazine. Bleomycin causes pulmonary fibrosis, vinblastine causes myelosuppression, and cisplatin causes nephrotoxicity and ototoxicity.","ko":"Doxorubicin = 확장성 심근병증 (자유라디칼), 예방 dexrazoxane."},{"id":"cv15","steps":["1"],"system":"Cardiovascular","discipline":"Pharmacology","topic":"Amiodarone adverse effects","stem":"A 70-year-old man with atrial fibrillation has taken an antiarrhythmic drug for 2 years. He now has a dry cough and dyspnea. Examination shows a slate-gray discoloration of sun-exposed skin. Chest CT shows bilateral reticular opacities. Serum TSH is 9.8 μU/mL, and aminotransferases are mildly elevated.\n\nWhich drug is the most likely cause?","options":["Sotalol","Digoxin","Diltiazem","Amiodarone","Flecainide"],"answer":3,"explanation":"Amiodarone is a class III antiarrhythmic that also has class I, II, and IV effects. Its adverse effects include pulmonary fibrosis, hypothyroidism or hyperthyroidism (it is iodine-rich and resembles thyroid hormone), hepatotoxicity, blue-gray skin discoloration, photosensitivity, and corneal deposits. Patients need baseline and periodic pulmonary function, thyroid, and liver tests. It is also a CYP inhibitor that raises digoxin and warfarin levels.","ko":"Amiodarone: 폐섬유화·갑상선 이상·간독성·청회색 피부 → PFT/TFT/LFT 추적."},{"id":"cv16","steps":["1"],"system":"Cardiovascular","discipline":"Physiology","topic":"Carotid sinus reflex","stem":"A 28-year-old woman comes to the emergency department with palpitations. Her heart rate is 186/min, and ECG shows a narrow-complex regular tachycardia. The physician massages the right carotid sinus, and the rhythm converts to sinus rhythm.\n\nThe afferent limb of this reflex is carried by which of the following nerves?","options":["Phrenic nerve","Glossopharyngeal nerve","Cervical sympathetic chain","Vagus nerve","Hypoglossal nerve"],"answer":1,"explanation":"Carotid sinus baroreceptors send afferent signals through the glossopharyngeal nerve (CN IX) to the nucleus tractus solitarius. Massage mimics high blood pressure, increasing parasympathetic outflow through the vagus nerve (CN X, the efferent limb) and slowing AV nodal conduction, which can terminate AV nodal reentrant tachycardia. Aortic arch baroreceptors send afferents through the vagus nerve.","ko":"경동맥동 구심 = CN IX, 원심 = CN X. 대동맥궁 구심 = CN X."},{"id":"cv17","steps":["1"],"system":"Cardiovascular","discipline":"Physiology","topic":"Hypovolemic shock hemodynamics","stem":"A 24-year-old man is brought to the emergency department after a motorcycle collision. He has abdominal tenderness, a pulse of 132/min, and blood pressure of 78/44 mm Hg. CT shows a splenic laceration with a large hemoperitoneum. A pulmonary artery catheter is placed.\n\nWhich of the following sets of findings is most likely?","options":["Cardiac output ↓, PCWP ↑, systemic vascular resistance ↑","Cardiac output normal, PCWP ↑, systemic vascular resistance normal","Cardiac output ↑, PCWP ↓, systemic vascular resistance ↓","Cardiac output ↓, PCWP ↓, systemic vascular resistance ↑","Cardiac output ↓, PCWP ↓, systemic vascular resistance ↓"],"answer":3,"explanation":"In hemorrhagic (hypovolemic) shock, loss of volume lowers preload (low PCWP) and cardiac output, and the baroreceptor reflex increases sympathetic tone, raising systemic vascular resistance. Cardiogenic shock also has low output and high SVR but a high PCWP. Early septic (distributive) shock has high output and low SVR. Neurogenic shock has low SVR with low output because sympathetic tone is lost.","ko":"저혈량 쇼크: CO↓ PCWP↓ SVR↑. 심인성은 PCWP↑, 패혈성은 SVR↓."},{"id":"cv18","steps":["1"],"system":"Cardiovascular","discipline":"Physiology","topic":"Tetralogy of Fallot squatting","stem":"A 3-year-old boy is brought to the physician because he becomes blue and breathless while playing and then squats down, after which he improves. Examination shows a harsh systolic ejection murmur at the left upper sternal border. Chest x-ray shows a boot-shaped heart.\n\nSquatting improves his symptoms by which of the following mechanisms?","options":["Reopening of the ductus arteriosus","Increased systemic vascular resistance, decreasing right-to-left shunting","Decreased venous return to the right heart","Decreased heart rate, prolonging diastolic filling","Decreased pulmonary vascular resistance"],"answer":1,"explanation":"Tetralogy of Fallot results from anterosuperior displacement of the infundibular septum, producing pulmonary stenosis, right ventricular hypertrophy, an overriding aorta, and a VSD. Right ventricular outflow obstruction drives deoxygenated blood across the VSD into the aorta. Squatting kinks the femoral arteries and raises systemic vascular resistance, which reduces right-to-left shunting and increases pulmonary blood flow.","ko":"TOF 쪼그려 앉기 → SVR↑ → 우→좌 단락 감소."},{"id":"cv19","steps":["1"],"system":"Cardiovascular","discipline":"Anatomy","topic":"Transposition of the great arteries","stem":"A newborn boy becomes deeply cyanotic within hours of birth. His mother had poorly controlled type 1 diabetes mellitus during pregnancy. Supplemental oxygen does not improve his saturation. Chest x-ray shows a narrow mediastinum with an egg-shaped cardiac silhouette.\n\nWhich of the following embryologic errors most likely caused this condition?","options":["Failure of the truncus arteriosus to divide","Anterosuperior displacement of the infundibular septum","Failure of the aorticopulmonary septum to spiral","Failure of the foramen ovale to close","Failure of fusion of the endocardial cushions"],"answer":2,"explanation":"Transposition of the great arteries results from failure of the aorticopulmonary septum to spiral (a neural crest migration defect), so the aorta arises from the right ventricle and the pulmonary artery from the left. The pulmonary and systemic circulations run in parallel, which is incompatible with life unless mixing occurs through a PDA, ASD, or VSD. Prostaglandin E1 keeps the ductus open until surgery. Maternal diabetes is a major risk factor.","ko":"대혈관 전위 = 대동맥폐동맥 중격 나선 실패, 모체 당뇨, PGE1로 PDA 유지."},{"id":"cv20","steps":["1"],"system":"Cardiovascular","discipline":"Anatomy","topic":"Coarctation rib notching","stem":"A 15-year-old girl with short stature and a webbed neck is evaluated for hypertension. Blood pressure in the right arm is 162/94 mm Hg; femoral pulses are weak and delayed. Chest x-ray shows notching of the inferior margins of several posterior ribs.\n\nWhich of the following best explains the radiographic finding?","options":["Erosion by enlarged intercostal arteries carrying collateral flow","Pressure from dilated pulmonary arteries","Bone resorption caused by excess parathyroid hormone","Erosion by a thoracic aortic aneurysm","Congenital malformation of the ribs"],"answer":0,"explanation":"Coarctation of the aorta, which is associated with Turner syndrome and bicuspid aortic valve, causes hypertension in the upper extremities and weak, delayed femoral pulses. Blood bypasses the narrowing through collaterals from the subclavian and internal thoracic arteries into the intercostal arteries, which enlarge and erode the inferior rib margins. Complications include heart failure, aortic dissection, and cerebral hemorrhage from berry aneurysms.","ko":"대동맥 축착: 늑골 notching = 확장된 늑간동맥 측부순환. Turner·이엽판막 연관."},{"id":"cv21","steps":["1"],"system":"Cardiovascular","discipline":"Pharmacology","topic":"Clonidine withdrawal","stem":"A 54-year-old man is brought to the emergency department because of a severe headache, palpitations, sweating, and anxiety. Two days ago he ran out of an antihypertensive medication that he had taken twice daily for years. Blood pressure is 218/120 mm Hg and pulse is 118/min.\n\nWhich of the following drugs did he most likely stop taking?","options":["Lisinopril","Losartan","Clonidine","Amlodipine","Hydrochlorothiazide"],"answer":2,"explanation":"Clonidine is a central α2-adrenergic agonist that lowers sympathetic outflow. Stopping it abruptly causes rebound hypertension with a catecholamine surge, so it must be tapered. Clonidine and other α2 agonists are also used for ADHD, Tourette syndrome, and the symptoms of opioid withdrawal. Stopping a β-blocker abruptly can also cause rebound tachycardia, but ACE inhibitors, ARBs, calcium channel blockers, and thiazides do not cause a sympathetic surge.","ko":"Clonidine(중추 α2 작용제) 급중단 → 반동성 고혈압. 서서히 감량."},{"id":"cv22","steps":["1"],"system":"Cardiovascular","discipline":"Pharmacology","topic":"Dihydropyridine edema","stem":"A 61-year-old woman with hypertension is started on a new medication. Two months later she has bilateral ankle swelling that is worse in the evening. She has no dyspnea, her jugular venous pressure is normal, and her weight is unchanged. Her pulse is 88/min, slightly higher than before.\n\nWhich of the following drugs was most likely started?","options":["Lisinopril","Metoprolol","Verapamil","Spironolactone","Amlodipine"],"answer":4,"explanation":"Dihydropyridine calcium channel blockers such as amlodipine and nifedipine act mainly on vascular smooth muscle. Precapillary arteriolar dilation raises capillary hydrostatic pressure and causes peripheral edema that does not respond well to diuretics; adding an ACE inhibitor helps by dilating venules. Vasodilation can also cause reflex tachycardia, flushing, and headache. Non-dihydropyridines such as verapamil act more on the heart, causing bradycardia, AV block, and constipation.","ko":"Dihydropyridine CCB: 말초부종(세동맥 확장)·반사성 빈맥. Verapamil은 서맥·변비."},{"id":"cv23","steps":["1"],"system":"Cardiovascular","discipline":"Pathology","topic":"Marfan aortic dissection","stem":"A 27-year-old man who is 198 cm (6 ft 6 in) tall with long fingers and upward subluxation of both lenses develops sudden, tearing chest pain that radiates to his back. Blood pressure is 172/90 mm Hg in the right arm and 128/70 mm Hg in the left arm.\n\nHistologic examination of his aortic wall would most likely show which of the following?","options":["Lipid-rich plaque with a fibrous cap in the intima","Granulomatous inflammation of the aortic arch","Fragmentation of elastic fibers with mucoid material in the media","Fibrinoid necrosis of the adventitia","Obliterative endarteritis of the vasa vasorum"],"answer":2,"explanation":"Marfan syndrome is an autosomal dominant mutation of fibrillin-1 (FBN1, chromosome 15) that weakens elastic fibers and increases TGF-β signaling. The aorta shows cystic medial degeneration, with fragmented elastic fibers and mucoid material, which predisposes to aortic root dilation and dissection. Hypertension is the most common risk factor for dissection overall. Obliterative endarteritis of the vasa vasorum is tertiary syphilis (tree-bark aorta), and granulomatous aortitis in a young woman suggests Takayasu arteritis.","ko":"Marfan(FBN1): 낭성 중막 변성 → 대동맥 박리. 수정체 위쪽 탈구."},{"id":"cv24","steps":["1"],"system":"Cardiovascular","discipline":"Pathology","topic":"Atrial myxoma","stem":"A 41-year-old woman comes to the physician because of episodes of dyspnea and lightheadedness that occur when she stands up and resolve when she lies down. Examination shows a low-pitched early diastolic sound after S2 that changes with position. Echocardiography shows a pedunculated mass attached to the interatrial septum near the fossa ovalis that prolapses into the mitral valve orifice.\n\nWhich of the following is the most likely diagnosis?","options":["Rhabdomyoma","Angiosarcoma","Lipoma","Papillary fibroelastoma","Myxoma"],"answer":4,"explanation":"Myxoma is the most common primary cardiac tumor in adults, and about 90% arise in the left atrium attached to the fossa ovalis. The mobile tumor can obstruct the mitral valve like a ball valve, causing positional syncope and dyspnea and a diastolic tumor plop. Myxomas can embolize and cause constitutional symptoms through IL-6. Rhabdomyoma is the most common cardiac tumor in children and is associated with tuberous sclerosis. Metastases are the most common cardiac tumors overall.","ko":"성인 1차 심장종양 1위 = 좌심방 점액종 (난원와, 자세 의존 증상, tumor plop)."},{"id":"cv25","steps":["1"],"system":"Cardiovascular","discipline":"Physiology","topic":"Ejection fraction calculation","stem":"A 66-year-old man with ischemic cardiomyopathy undergoes cardiac MRI. Left ventricular end-diastolic volume is 150 mL and end-systolic volume is 90 mL. His heart rate is 80/min.\n\nWhich of the following is closest to his left ventricular ejection fraction?","options":["25%","40%","60%","67%","90%"],"answer":1,"explanation":"Stroke volume equals end-diastolic volume minus end-systolic volume: 150 − 90 = 60 mL. Ejection fraction equals stroke volume divided by end-diastolic volume: 60 / 150 = 40%. Cardiac output equals stroke volume times heart rate: 60 mL × 80/min = 4.8 L/min. An ejection fraction of 40% or less defines heart failure with reduced ejection fraction; normal is about 55% or more.","ko":"SV = EDV − ESV, EF = SV/EDV, CO = SV × HR."},{"id":"cv26","steps":["1"],"system":"Cardiovascular","discipline":"Immunology","topic":"Dressler syndrome","stem":"A 64-year-old man comes to the physician because of sharp chest pain and low-grade fever 3 weeks after an anterior myocardial infarction. The pain worsens when he lies supine and improves when he leans forward. A friction rub is heard. ECG shows diffuse ST-segment elevation with PR depression.\n\nWhich of the following is the most likely mechanism?","options":["Autoimmune reaction to myocardial antigens exposed by the infarct","Extension of the infarct into the pericardium","Bacterial infection of the pericardium","Formation of a left ventricular aneurysm","Uremic toxins in the pericardial fluid"],"answer":0,"explanation":"Dressler syndrome is an autoimmune pericarditis that develops weeks to months after an MI or cardiac surgery, when myocardial injury exposes antigens that provoke an antibody response. It presents with fever, positional pleuritic chest pain, a friction rub, and diffuse ST elevation with PR depression. Peri-infarction fibrinous pericarditis, in contrast, occurs within days of a transmural infarct. Treatment is NSAIDs or colchicine.","ko":"MI 수주 후 심낭염 = Dressler (자가면역). 수일 내는 섬유소성 심낭염."},{"id":"cv27","steps":["1"],"system":"Cardiovascular","discipline":"Physiology","topic":"Chronic aortic regurgitation","stem":"A 35-year-old man with Marfan syndrome has a blowing, high-pitched, early diastolic decrescendo murmur at the left sternal border. His blood pressure is 160/45 mm Hg, and his head bobs with each heartbeat. Pulses are bounding.\n\nWhich adaptation of the left ventricle is most likely?","options":["Eccentric hypertrophy with sarcomeres added in series","Myocyte atrophy with decreased chamber size","Fibrofatty replacement of the ventricular wall","Concentric hypertrophy with sarcomeres added in parallel","No change in ventricular geometry"],"answer":0,"explanation":"Chronic aortic regurgitation is a volume overload: regurgitant blood increases end-diastolic volume and stroke volume, causing a wide pulse pressure and hyperdynamic signs. The ventricle adapts by eccentric hypertrophy, adding sarcomeres in series, which dilates the chamber. Pressure overload (aortic stenosis, hypertension) causes concentric hypertrophy, with sarcomeres added in parallel and a thick wall with a small chamber.","ko":"용적 과부하(AR·MR) → 편심성 비대(직렬). 압력 과부하(AS·HTN) → 동심성 비대(병렬)."},{"id":"cv28","steps":["1"],"system":"Cardiovascular","discipline":"Physiology","topic":"HCM murmur maneuvers","stem":"A 17-year-old soccer player has a harsh systolic murmur at the left lower sternal border. The murmur gets louder when he stands up from a squat and during the strain phase of a Valsalva maneuver, and it gets softer with sustained handgrip.\n\nWhy does standing make the murmur louder?","options":["Decreased preload reduces left ventricular size, worsening outflow obstruction","Increased afterload increases the regurgitant flow","Increased heart rate shortens diastole","Increased venous return increases right-sided flow","Increased preload increases flow across a stenotic valve"],"answer":0,"explanation":"In hypertrophic cardiomyopathy with outflow obstruction, the thickened septum and systolic anterior motion of the mitral valve narrow the outflow tract. Anything that reduces left ventricular volume (standing, Valsalva, nitroglycerin) worsens the obstruction and the murmur, while maneuvers that increase volume or afterload (squatting, handgrip, leg raise) decrease it. Most other murmurs, such as aortic stenosis, get softer with decreased preload. Mitral valve prolapse also changes with preload: the click occurs earlier when LV volume is smaller.","ko":"HCM 잡음: 전부하↓(기립·Valsalva)에 커지고, 쪼그려 앉기·handgrip에 작아짐."},{"id":"cv29","steps":["1"],"system":"Cardiovascular","discipline":"Pharmacology","topic":"Wolff-Parkinson-White with AF","stem":"A 24-year-old man has palpitations. ECG shows an irregularly irregular, wide-complex tachycardia at 230/min with varying QRS morphology. A previous ECG in sinus rhythm showed a short PR interval with a slurred upstroke of the QRS complex.\n\nWhich of the following treatments should be avoided because it can worsen this rhythm?","options":["Catheter ablation of the accessory pathway","Synchronized cardioversion","Procainamide","Ibutilide","Verapamil"],"answer":4,"explanation":"Wolff-Parkinson-White syndrome has an accessory pathway (bundle of Kent) that bypasses the AV node, causing a short PR interval and delta wave. In atrial fibrillation, drugs that block the AV node (calcium channel blockers, β-blockers, adenosine, digoxin) send more impulses down the accessory pathway, which can cause ventricular fibrillation. Stable patients receive procainamide or ibutilide, and unstable patients receive synchronized cardioversion. Definitive treatment is ablation of the pathway.","ko":"WPW(delta파) + 심방세동 → AV결절 차단제(verapamil·β차단·adenosine·digoxin) 금기 → procainamide."},{"id":"cv30","steps":["1"],"system":"Cardiovascular","discipline":"Pharmacology","topic":"Torsades de pointes","stem":"A 58-year-old woman taking methadone is started on ondansetron and azithromycin. Two days later she has a syncopal episode. Telemetry shows a polymorphic ventricular tachycardia in which the QRS complexes twist around the baseline. Her baseline QTc was 520 ms.\n\nWhich of the following is the most appropriate immediate treatment?","options":["Oral metoprolol","IV procainamide","IV amiodarone","IV magnesium sulfate","IV adenosine"],"answer":3,"explanation":"Torsades de pointes is a polymorphic ventricular tachycardia caused by prolonged QT, which can be congenital (potassium or sodium channel mutations; Jervell and Lange-Nielsen includes deafness) or acquired from drugs (class IA and III antiarrhythmics, macrolides, fluoroquinolones, methadone, antipsychotics, ondansetron, TCAs) and low potassium or magnesium. IV magnesium sulfate is first-line, even with normal magnesium. Drugs that further prolong QT, such as amiodarone and procainamide, are avoided.","ko":"Torsades(QT 연장) → IV MgSO4. QT 연장 약물: 메타돈·마크로라이드·FQ·항정신병약·ondansetron."},{"id":"cv31","steps":["1"],"system":"Cardiovascular","discipline":"Physiology","topic":"Pacemaker action potential","stem":"A researcher records action potentials from sinoatrial node cells. The upstroke of these cells is slower and has a lower amplitude than that of ventricular myocytes.\n\nWhich current is responsible for the upstroke (phase 0) of the SA node action potential?","options":["Outward chloride current","Inward calcium current through L-type channels","Inward funny current through HCN channels","Outward potassium current through delayed rectifier channels","Inward sodium current through fast voltage-gated channels"],"answer":1,"explanation":"In pacemaker cells, phase 0 depolarization is caused by calcium entering through L-type channels, which is slower than the fast sodium current in myocytes. Phase 4 slow depolarization is driven by the funny current (If, through HCN channels) and T-type calcium channels; its slope sets heart rate. Sympathetic stimulation steepens phase 4, and vagal stimulation flattens it. Ivabradine blocks If. Phase 3 repolarization is caused by potassium efflux.","ko":"결절세포 phase 0 = L형 Ca 유입. Phase 4 = funny current(If, ivabradine 차단)."},{"id":"cv32","steps":["1"],"system":"Cardiovascular","discipline":"Pharmacology","topic":"Adenosine and theophylline","stem":"A 34-year-old woman has palpitations and a regular narrow-complex tachycardia at 190/min. Vagal maneuvers fail. A rapid IV dose of adenosine has no effect. She drinks about eight cups of strong coffee a day and takes theophylline for asthma.\n\nWhich of the following explains the lack of response?","options":["Adenosine is inactivated by the liver too quickly in coffee drinkers","Methylxanthines block adenosine receptors","Theophylline increases AV nodal calcium current","Caffeine increases adenosine breakdown by adenosine deaminase","Coffee increases vagal tone"],"answer":1,"explanation":"Adenosine activates A1 receptors in the AV node, increasing potassium efflux and hyperpolarizing cells, causing a brief AV block that terminates AV nodal reentrant tachycardia. It has a half-life of seconds. Caffeine and theophylline are adenosine receptor antagonists, so higher doses may be needed. Dipyridamole and carbamazepine enhance its effect. Adenosine commonly causes flushing, chest discomfort, and a sense of impending doom, and can provoke bronchospasm.","ko":"Adenosine: AV결절 일시 차단, 반감기 수초. 카페인·테오필린이 수용체 차단 → 효과↓."},{"id":"cv33","steps":["1"],"system":"Cardiovascular","discipline":"Pathology","topic":"Libman-Sacks endocarditis","stem":"A 30-year-old woman with systemic lupus erythematosus has a stroke. Echocardiography shows small, warty vegetations on both surfaces of the mitral valve leaflets. Blood cultures are sterile. Antiphospholipid antibodies are positive.\n\nWhich of the following best describes these vegetations?","options":["Bacterial vegetations from Staphylococcus aureus","Calcified nodules from rheumatic fever","Sterile vegetations of fibrin and immune complexes","Tumor emboli from a cardiac myxoma","Myxomatous degeneration"],"answer":2,"explanation":"Libman-Sacks endocarditis occurs in SLE, especially with antiphospholipid syndrome, and consists of small sterile vegetations made of fibrin, immune complexes, and inflammatory cells on both sides of the valve, most often the mitral. They can cause regurgitation and embolize. Nonbacterial thrombotic (marantic) endocarditis is similar but occurs with malignancy, especially mucinous adenocarcinomas, and hypercoagulable states.","ko":"Libman-Sacks: SLE(항인지질), 판막 양면의 무균성 사마귀 모양 증식."},{"id":"cv34","steps":["1"],"system":"Cardiovascular","discipline":"Physiology","topic":"Pulsus paradoxus","stem":"A 54-year-old woman with metastatic breast cancer has dyspnea and hypotension. Jugular veins are distended, heart sounds are distant, and her systolic blood pressure falls by 18 mm Hg during inspiration. ECG shows low voltage with alternating QRS amplitude.\n\nWhich mechanism explains the fall in blood pressure during inspiration?","options":["The pericardial fluid is pushed out during inspiration","Inspiration decreases heart rate","Inspiration increases left ventricular afterload","Increased right ventricular filling pushes the septum into the left ventricle, reducing its filling","Inspiration decreases venous return to the right heart"],"answer":3,"explanation":"In cardiac tamponade, the stiff, fluid-filled pericardium fixes total cardiac volume. During inspiration, venous return to the right ventricle increases, and because the heart cannot expand, the interventricular septum bulges into the left ventricle, reducing left ventricular filling and stroke volume. Systolic pressure falls by more than 10 mm Hg (pulsus paradoxus). Other findings include Beck triad (hypotension, JVD, muffled heart sounds) and electrical alternans. Treatment is pericardiocentesis.","ko":"탐포나데 맥박역설: 흡기 시 RV 충만↑ → 중격이 LV 쪽으로 밀림 → LV 충만↓."},{"id":"cv35","steps":["1"],"system":"Cardiovascular","discipline":"Pathology","topic":"Constrictive pericarditis","stem":"A 60-year-old man who received mediastinal radiation for lymphoma 20 years ago has progressive leg edema, ascites, and fatigue. His jugular venous pressure rises during inspiration. An early diastolic sound is heard after S2. Chest x-ray shows pericardial calcification.\n\nWhich of the following is the most likely diagnosis?","options":["Cardiac tamponade","Tricuspid stenosis","Dilated cardiomyopathy","Restrictive cardiomyopathy from amyloidosis","Constrictive pericarditis"],"answer":4,"explanation":"Constrictive pericarditis is a thick, fibrotic, sometimes calcified pericardium that limits diastolic filling. Causes include tuberculosis (worldwide), prior radiation, cardiac surgery, and viral pericarditis. It causes right-sided heart failure, Kussmaul sign (JVP rises with inspiration), and a pericardial knock from sudden halting of ventricular filling. Restrictive cardiomyopathy has similar physiology but a normal pericardium. Treatment is pericardiectomy.","ko":"교착성 심낭염: 방사선·결핵, Kussmaul 징후, pericardial knock, 심낭 석회화."},{"id":"cv36","steps":["1"],"system":"Cardiovascular","discipline":"Pathology","topic":"Abdominal aortic aneurysm","stem":"A 72-year-old man who has smoked for 50 years has a pulsatile mass above his umbilicus. Ultrasonography shows a 6-cm infrarenal aortic aneurysm.\n\nWhich of the following best describes the pathogenesis of this aneurysm?","options":["Trauma causing a tear of the intima","Obliterative endarteritis of the vasa vasorum from syphilis","Granulomatous inflammation of the aorta in a young woman","Cystic medial degeneration from a fibrillin defect","Atherosclerosis with inflammation and matrix metalloproteinase destruction of the media"],"answer":4,"explanation":"Abdominal aortic aneurysms usually occur below the renal arteries in older men who smoke and are associated with atherosclerosis. Chronic transmural inflammation and macrophage matrix metalloproteinases degrade elastin and collagen in the media, weakening the wall. Rupture risk rises sharply above about 5.5 cm. Men aged 65 to 75 who have ever smoked are screened once by ultrasound. Thoracic aneurysms are associated with hypertension, Marfan syndrome, and syphilis.","ko":"복부대동맥류: 흡연 고령 남성, 죽상경화 + MMP 중막 파괴, 5.5 cm↑ 파열 위험."},{"id":"cv37","steps":["1"],"system":"Cardiovascular","discipline":"Pathology","topic":"Takayasu arteritis","stem":"A 28-year-old woman from Japan has fatigue, fever, arthralgia, and pain in her left arm when she uses it. The left radial pulse is weak, and blood pressure in the left arm is 30 mm Hg lower than in the right. A bruit is heard over the left subclavian artery. ESR is elevated.\n\nWhich of the following best describes the underlying disease?","options":["Immune complex small-vessel vasculitis with IgA","Segmental thrombosing vasculitis of the extremities","Granulomatous large-vessel vasculitis of the aortic arch and its branches","Atherosclerosis of the subclavian artery","Necrotizing medium-vessel vasculitis sparing the lungs"],"answer":2,"explanation":"Takayasu arteritis is a granulomatous large-vessel vasculitis that thickens the aortic arch and its branches, causing weak upper extremity pulses (pulseless disease), blood pressure differences between arms, arm claudication, and constitutional symptoms. It typically affects Asian women under 40. Treatment is corticosteroids. Giant cell arteritis has similar histology but occurs in people over 50.","ko":"Takayasu: 40세 미만 아시아 여성, 대동맥궁 육아종성 혈관염, 맥박 소실·양팔 혈압 차."},{"id":"cv38","steps":["1"],"system":"Cardiovascular","discipline":"Pathology","topic":"Polyarteritis nodosa","stem":"A 48-year-old man with chronic hepatitis B has fever, weight loss, abdominal pain after meals, a painful foot drop, and new hypertension. Angiography shows multiple microaneurysms and areas of narrowing in the renal and mesenteric arteries. Chest x-ray is normal, and ANCA is negative.\n\nWhich of the following is the most likely diagnosis?","options":["Eosinophilic granulomatosis with polyangiitis","Polyarteritis nodosa","Microscopic polyangiitis","Granulomatosis with polyangiitis","Kawasaki disease"],"answer":1,"explanation":"Polyarteritis nodosa is a necrotizing vasculitis of medium-sized arteries with transmural fibrinoid necrosis at different stages, producing a string-of-beads pattern of microaneurysms. It involves the kidneys (renin-mediated hypertension), gut (mesenteric ischemia), nerves (mononeuritis multiplex), and skin, and characteristically spares the lungs. It is associated with hepatitis B. ANCA is negative. Treatment is corticosteroids and cyclophosphamide, plus antivirals for HBV.","ko":"PAN: B형간염, 중형동맥 미세동맥류, 폐 침범 없음, ANCA 음성, 다발성 단신경염."},{"id":"cv39","steps":["1"],"system":"Cardiovascular","discipline":"Immunology","topic":"Granulomatosis with polyangiitis","stem":"A 50-year-old man has chronic sinusitis with bloody nasal discharge, a saddle nose deformity, hemoptysis, and hematuria with red cell casts. Chest CT shows multiple cavitating nodules. Serum PR3-ANCA (c-ANCA) is strongly positive.\n\nBiopsy of a lung nodule would most likely show which of the following?","options":["Linear IgG deposition along alveolar basement membranes","Necrotizing granulomatous inflammation with vasculitis","Eosinophilic infiltrates with asthma history","Noncaseating granulomas without vasculitis","Caseating granulomas with acid-fast bacilli"],"answer":1,"explanation":"Granulomatosis with polyangiitis (Wegener) is a necrotizing granulomatous vasculitis of small and medium vessels involving the upper respiratory tract (sinusitis, nasal septal perforation, saddle nose), lungs (cavitating nodules, hemoptysis), and kidneys (pauci-immune crescentic glomerulonephritis). It is associated with PR3-ANCA. Microscopic polyangiitis lacks granulomas and is associated with MPO-ANCA. Eosinophilic granulomatosis with polyangiitis has asthma and eosinophilia. Treatment is corticosteroids with cyclophosphamide or rituximab.","ko":"GPA: 상기도 + 폐 공동 결절 + 사구체신염, PR3-ANCA(c-ANCA), 괴사성 육아종."},{"id":"cv40","steps":["1"],"system":"Cardiovascular","discipline":"Pathology","topic":"Thromboangiitis obliterans","stem":"A 33-year-old man who smokes two packs of cigarettes a day has pain in his fingers at rest, color changes in cold weather, and a painful ulcer on his right index fingertip. He also had tender red cords along superficial veins of his leg last year. He has no diabetes or hyperlipidemia.\n\nWhich of the following is the most important treatment?","options":["Complete smoking cessation","Cyclophosphamide","High-dose corticosteroids","Long-term anticoagulation","Statin therapy"],"answer":0,"explanation":"Thromboangiitis obliterans (Buerger disease) is a segmental, inflammatory, thrombosing vasculitis of small and medium arteries and veins in the extremities, almost exclusively in young heavy smokers. It causes claudication, Raynaud phenomenon, digital ulcers and gangrene, and migratory superficial thrombophlebitis. Complete smoking cessation is the only effective treatment; continued smoking often leads to amputation.","ko":"Buerger병: 젊은 중증 흡연자, 손발가락 허혈·궤양, 표재성 혈전정맥염 → 금연이 유일한 치료."},{"id":"cv41","steps":["1"],"system":"Cardiovascular","discipline":"Pharmacology","topic":"Niacin flushing","stem":"A 52-year-old man with low HDL and high triglycerides is started on niacin. Within 30 minutes of each dose, he has warmth, redness, and itching of his face and upper body.\n\nTaking which of the following 30 minutes before each dose would reduce this effect?","options":["Ondansetron","Prednisone","Diphenhydramine","Propranolol","Aspirin"],"answer":4,"explanation":"Niacin lowers LDL and triglycerides and raises HDL by inhibiting lipolysis in adipose tissue and reducing hepatic VLDL synthesis. It causes flushing mediated by prostaglandins (PGD2 and PGE2), which is reduced by taking aspirin or another NSAID beforehand. Other adverse effects are hyperglycemia, hyperuricemia (gout), and hepatotoxicity. Niacin has not been shown to reduce cardiovascular events when added to statins.","ko":"Niacin 홍조 = 프로스타글란딘 매개 → 투약 전 아스피린. 부작용: 고혈당·고요산."},{"id":"cv42","steps":["1"],"system":"Cardiovascular","discipline":"Pharmacology","topic":"Ezetimibe","stem":"A 60-year-old woman with coronary artery disease remains above her LDL goal despite the maximum tolerated statin dose. A drug is added that lowers LDL by about 20% by acting in the brush border of the small intestine.\n\nWhich of the following is this drug's mechanism?","options":["Blocking the NPC1L1 cholesterol transporter","Inhibiting PCSK9","Inhibiting HMG-CoA reductase","Binding bile acids in the intestinal lumen","Activating PPAR-α"],"answer":0,"explanation":"Ezetimibe blocks the Niemann-Pick C1-like 1 transporter in the brush border of enterocytes, reducing intestinal cholesterol absorption. Lower hepatic cholesterol increases LDL receptor expression and lowers serum LDL. Bile acid sequestrants (cholestyramine) bind bile acids and can raise triglycerides; PCSK9 inhibitors are monoclonal antibodies that prevent LDL receptor degradation; and fibrates activate PPAR-α.","ko":"Ezetimibe = NPC1L1 차단(소장 콜레스테롤 흡수↓). PCSK9 억제제 = LDL 수용체 분해 방지."},{"id":"cv43","steps":["1"],"system":"Cardiovascular","discipline":"Pharmacology","topic":"Pulmonary arterial hypertension","stem":"A 32-year-old woman has progressive exertional dyspnea and a loud P2. Right heart catheterization shows a mean pulmonary artery pressure of 48 mm Hg with a normal wedge pressure. Her mother died of the same condition. Genetic testing shows a mutation in BMPR2.\n\nWhich drug used for this condition blocks a potent vasoconstrictor peptide?","options":["Epoprostenol","Furosemide","Bosentan","Sildenafil","Nifedipine"],"answer":2,"explanation":"Pulmonary arterial hypertension (group 1), including heritable forms from inactivating BMPR2 mutations, causes smooth muscle and endothelial proliferation in pulmonary arterioles, increased vascular resistance, and right heart failure. Treatment targets three pathways: endothelin receptor antagonists (bosentan, ambrisentan; hepatotoxic and teratogenic), PDE5 inhibitors (sildenafil) that increase cGMP, and prostacyclin analogs (epoprostenol). Calcium channel blockers help only patients who respond to vasodilator testing.","ko":"PAH: BMPR2 변이. 치료 = bosentan(엔도텔린 길항), sildenafil(PDE5), epoprostenol(프로스타사이클린)."},{"id":"cv44","steps":["1"],"system":"Cardiovascular","discipline":"Pharmacology","topic":"Sacubitril","stem":"A 64-year-old man with heart failure and an ejection fraction of 30% is switched from lisinopril to a combination of valsartan and another drug. The physician waits 36 hours after the last ACE inhibitor dose before starting it.\n\nWhy is this waiting period necessary?","options":["The other drug causes severe hypotension with any antihypertensive","The other drug is metabolized by ACE","The other drug causes hyperkalemia only when combined with ACE inhibitors","The other drug requires the ACE inhibitor to be cleared to be absorbed","The other drug inhibits neprilysin, and combining it with an ACE inhibitor greatly increases angioedema risk"],"answer":4,"explanation":"Sacubitril inhibits neprilysin, the enzyme that degrades natriuretic peptides, bradykinin, and other vasoactive peptides. Higher natriuretic peptide levels promote vasodilation and natriuresis, and sacubitril-valsartan reduces mortality in HFrEF. Because both neprilysin and ACE break down bradykinin, combining sacubitril with an ACE inhibitor greatly increases the risk of angioedema, so a 36-hour washout is required. It is paired with an ARB rather than an ACE inhibitor.","ko":"Sacubitril = neprilysin 억제(BNP·bradykinin↑). ACEi와 병용 금기(혈관부종) → 36시간 휴약."},{"id":"cv45","steps":["1"],"system":"Cardiovascular","discipline":"Physiology","topic":"Natriuretic peptides","stem":"In a patient with acute volume overload from heart failure, stretched atrial and ventricular myocytes release peptide hormones that promote sodium excretion.\n\nWhich of the following effects of these hormones contributes to natriuresis?","options":["Stimulation of renin secretion","Dilation of the afferent arteriole and constriction of the efferent arteriole, increasing GFR","Stimulation of aldosterone secretion","Increased ADH release","Increased sodium reabsorption in the collecting duct"],"answer":1,"explanation":"Atrial and B-type natriuretic peptides act through guanylyl cyclase receptors to increase cGMP. They dilate the afferent arteriole and constrict the efferent arteriole, raising GFR; decrease sodium reabsorption in the collecting duct; and inhibit renin and aldosterone. They also cause vasodilation. BNP is used as a marker of heart failure, and its level falls with obesity and rises with kidney disease.","ko":"ANP/BNP: cGMP↑, 수입세동맥 확장·수출세동맥 수축(GFR↑), 레닌·알도스테론 억제."},{"id":"cv46","steps":["1"],"system":"Cardiovascular","discipline":"Physiology","topic":"Splitting of S2","stem":"A 70-year-old man has a crescendo-decrescendo systolic murmur. On careful auscultation, the second heart sound splits during expiration and becomes single during inspiration.\n\nWhich of the following conditions most likely explains this finding?","options":["Severe aortic stenosis","Pulmonic stenosis","Right bundle branch block","Normal physiology","Atrial septal defect"],"answer":0,"explanation":"Normally, inspiration increases venous return to the right heart, delaying pulmonic valve closure (P2) and widening the split. In paradoxical splitting, aortic valve closure (A2) is delayed until after P2, so the split is heard in expiration and narrows or disappears in inspiration. Causes include severe aortic stenosis and left bundle branch block. Wide splitting occurs with RBBB and pulmonic stenosis, and fixed splitting occurs with ASD.","ko":"역분열(호기 시 분열) = A2 지연: 중증 AS, LBBB. 넓은 분열 = RBBB·PS. 고정 분열 = ASD."},{"id":"en01","steps":["1"],"system":"Endocrine","discipline":"Diagnosis","topic":"Cushing disease localization","stem":"A 38-year-old woman has weight gain in her face and trunk, purple abdominal striae, easy bruising, and hypertension. Late-night salivary cortisol and 24-hour urinary free cortisol are elevated. Plasma ACTH is elevated. Cortisol is suppressed by high-dose dexamethasone but not by low-dose dexamethasone.\n\nWhich of the following is the most likely cause?","options":["Ectopic ACTH secretion by small cell lung carcinoma","Exogenous glucocorticoid use","Adrenocortical carcinoma","ACTH-secreting pituitary adenoma","Cortisol-secreting adrenal adenoma"],"answer":3,"explanation":"In ACTH-dependent Cushing syndrome, ACTH is high. A pituitary adenoma (Cushing disease) still responds partly to negative feedback, so high-dose dexamethasone suppresses cortisol. Ectopic ACTH from tumors such as small cell lung carcinoma does not suppress. Adrenal tumors and exogenous glucocorticoids suppress ACTH. Cushing disease is the most common endogenous cause of Cushing syndrome.","ko":"ACTH↑ + 고용량 덱사 억제 → 뇌하수체 선종. 억제 안 되면 이소성 ACTH."},{"id":"en02","steps":["1"],"system":"Endocrine","discipline":"Physiology","topic":"Addison hyperpigmentation","stem":"A 34-year-old woman has fatigue, weight loss, salt craving, and lightheadedness on standing. Her skin is diffusely darkened, especially in the palmar creases and on the gums. Serum sodium is 128 mEq/L and potassium is 5.8 mEq/L. Morning cortisol is low, and ACTH is markedly elevated.\n\nWhich of the following best explains her skin finding?","options":["Increased cleavage of pro-opiomelanocortin producing melanocyte-stimulating hormone","Increased melanocyte number caused by aldosterone","Deposition of iron in the dermis","Decreased hepatic clearance of bilirubin","Increased production of adrenal androgens"],"answer":0,"explanation":"In primary adrenal insufficiency (Addison disease), usually autoimmune in developed countries, low cortisol removes feedback on the pituitary. The pituitary increases production of pro-opiomelanocortin (POMC), which is cleaved into ACTH and melanocyte-stimulating hormone, darkening skin and mucosa. Loss of aldosterone causes hyponatremia, hyperkalemia, and hypotension. Secondary adrenal insufficiency (low ACTH) causes no hyperpigmentation and no hyperkalemia because aldosterone is regulated by the renin-angiotensin system.","ko":"Addison: POMC↑ → MSH → 과색소침착. 2차성은 색소침착·고칼륨 없음."},{"id":"en03","steps":["1"],"system":"Endocrine","discipline":"Physiology","topic":"Primary hyperaldosteronism","stem":"A 42-year-old man has hypertension that remains uncontrolled on three drugs. He also has muscle weakness. Serum potassium is 2.9 mEq/L and bicarbonate is 31 mEq/L. CT shows a 1.5-cm mass in the left adrenal gland.\n\nWhich of the following sets of laboratory findings is most likely?","options":["Aldosterone ↑, renin ↓","Aldosterone ↓, renin ↓","Aldosterone ↑, renin ↑","Aldosterone normal, renin normal","Aldosterone ↓, renin ↑"],"answer":0,"explanation":"Primary hyperaldosteronism (Conn syndrome, from an adrenal adenoma or bilateral hyperplasia) causes hypertension, hypokalemia, and metabolic alkalosis. Autonomous aldosterone production expands volume and suppresses renin, so the aldosterone-to-renin ratio is high. Edema is uncommon because of aldosterone escape. Secondary hyperaldosteronism, as in renal artery stenosis, has high aldosterone and high renin. Treatment is adrenalectomy for an adenoma or spironolactone or eplerenone.","ko":"Conn: 알도스테론↑, 레닌↓, 저칼륨·대사성 알칼리증. 2차성은 레닌↑."},{"id":"en04","steps":["1"],"system":"Endocrine","discipline":"Pharmacology","topic":"Pheochromocytoma preoperative","stem":"A 36-year-old woman has episodes of pounding headache, sweating, and palpitations. During an episode her blood pressure is 220/124 mm Hg. Plasma free metanephrines are markedly elevated, and CT shows a 4-cm right adrenal mass. Surgery is planned.\n\nWhich of the following drugs should be started first?","options":["Hydrochlorothiazide","Lisinopril","Propranolol","Phenoxybenzamine","Clonidine"],"answer":3,"explanation":"Pheochromocytoma is a catecholamine-secreting tumor of chromaffin cells in the adrenal medulla. Before surgery, α-blockade with phenoxybenzamine (an irreversible α antagonist) controls blood pressure. A β-blocker may be added later for tachycardia, but never first: blocking β2-mediated vasodilation leaves α-mediated vasoconstriction unopposed and can cause a hypertensive crisis. Pheochromocytoma is associated with MEN2A and 2B, VHL, and NF1.","ko":"갈색세포종: α차단(phenoxybenzamine) 먼저, β차단은 나중."},{"id":"en05","steps":["1"],"system":"Endocrine","discipline":"Biochemistry","topic":"MEN 2A","stem":"A 30-year-old man has a firm thyroid nodule. Fine-needle aspiration shows spindle-shaped cells in an amyloid stroma, and serum calcitonin is markedly elevated. His father had an adrenal tumor that caused severe hypertension, and his aunt had hypercalcemia from parathyroid hyperplasia.\n\nA mutation in which of the following genes is most likely?","options":["NF1","VHL","MEN1","RET","BRAF"],"answer":3,"explanation":"Multiple endocrine neoplasia type 2A (medullary thyroid carcinoma, pheochromocytoma, and parathyroid hyperplasia) and type 2B (medullary thyroid carcinoma, pheochromocytoma, mucosal neuromas, and a marfanoid habitus) are caused by activating mutations of the RET proto-oncogene, which encodes a receptor tyrosine kinase. Medullary thyroid carcinoma arises from calcitonin-producing parafollicular C cells, so carriers undergo prophylactic thyroidectomy. MEN1 (parathyroid, pituitary, and pancreas) is caused by mutations in menin.","ko":"MEN2A/2B = RET. 수질성 갑상선암(칼시토닌·아밀로이드) + 갈색세포종."},{"id":"en06","steps":["1"],"system":"Endocrine","discipline":"Physiology","topic":"Primary hyperparathyroidism","stem":"A 58-year-old woman has kidney stones, constipation, and fatigue. Bone densitometry shows osteoporosis, most marked in the distal radius.\n\nWhich of the following sets of serum findings is most likely?","options":["Calcium ↑, phosphate ↑, PTH ↓","Calcium ↓, phosphate ↓, PTH ↑","Calcium ↓, phosphate ↑, PTH ↑","Calcium ↑, phosphate normal, PTH ↓","Calcium ↑, phosphate ↓, PTH ↑"],"answer":4,"explanation":"Primary hyperparathyroidism, usually from a single parathyroid adenoma, causes hypercalcemia with inappropriately high PTH. PTH increases bone resorption and renal calcium reabsorption, decreases phosphate reabsorption (causing hypophosphatemia and phosphaturia), and increases calcitriol. It causes stones, bone disease (cortical bone loss, osteitis fibrosa cystica), abdominal symptoms, and psychiatric symptoms. Hypercalcemia from malignancy or vitamin D excess suppresses PTH.","ko":"1차 부갑상선항진증: Ca↑, P↓, PTH↑. 결석·뼈·복통·정신증상."},{"id":"en07","steps":["1"],"system":"Endocrine","discipline":"Physiology","topic":"Secondary hyperparathyroidism of CKD","stem":"A 64-year-old man with stage 5 chronic kidney disease has bone pain and itching. He is not yet on dialysis.\n\nWhich of the following sets of serum findings is most likely?","options":["Calcium ↓, phosphate ↑, PTH ↑","Calcium ↓, phosphate ↓, PTH ↓","Calcium ↑, phosphate ↑, PTH ↓","Calcium normal, phosphate ↓, PTH normal","Calcium ↑, phosphate ↓, PTH ↑"],"answer":0,"explanation":"In chronic kidney disease, the kidneys cannot excrete phosphate or make calcitriol (1α-hydroxylation). High phosphate and low calcitriol lower serum calcium, and all three stimulate PTH secretion, causing secondary hyperparathyroidism and renal osteodystrophy. FGF23 also rises. Long-standing stimulation can lead to autonomous PTH secretion with hypercalcemia (tertiary hyperparathyroidism). Treatment includes phosphate binders, calcitriol analogs, and cinacalcet.","ko":"CKD 2차 부갑상선항진증: P↑, Ca↓, 칼시트리올↓, PTH↑."},{"id":"en08","steps":["1"],"system":"Endocrine","discipline":"Anatomy","topic":"Post-thyroidectomy hypocalcemia","stem":"A 45-year-old woman undergoes total thyroidectomy for papillary thyroid carcinoma. On the second postoperative day she has tingling around her mouth and in her fingers. Tapping anterior to the ear causes twitching of the facial muscles, and inflating a blood pressure cuff causes carpal spasm.\n\nWhich of the following is the most likely cause?","options":["Thyroid storm","Excess calcitonin from thyroid manipulation","Inadvertent removal or devascularization of the parathyroid glands","Injury to the recurrent laryngeal nerve","Hypomagnesemia from blood loss"],"answer":2,"explanation":"Hypocalcemia after thyroidectomy is usually caused by removal of or injury to the parathyroid glands, which lie on the posterior surface of the thyroid. Low ionized calcium increases neuromuscular excitability, causing perioral and acral paresthesias, Chvostek sign (facial twitching), Trousseau sign (carpal spasm with cuff inflation), tetany, seizures, and QT prolongation. Recurrent laryngeal nerve injury causes hoarseness.","ko":"갑상선절제 후 저칼슘 = 부갑상선 손상. Chvostek·Trousseau 징후."},{"id":"en09","steps":["1"],"system":"Endocrine","discipline":"Pathology","topic":"Papillary thyroid carcinoma","stem":"A 32-year-old woman who had radiation to her neck as a child for acne has a painless thyroid nodule and an enlarged cervical lymph node. Fine-needle aspiration shows cells with large, overlapping nuclei with clear, ground-glass chromatin, nuclear grooves, and scattered laminated calcifications.\n\nWhich of the following is the most likely diagnosis?","options":["Papillary carcinoma","Primary thyroid lymphoma","Medullary carcinoma","Anaplastic carcinoma","Follicular carcinoma"],"answer":0,"explanation":"Papillary carcinoma is the most common thyroid cancer and has an excellent prognosis. Its features include empty-appearing (Orphan Annie eye) nuclei, nuclear grooves, and psammoma bodies, and it spreads through lymphatics to cervical nodes. Risk factors include childhood radiation, and BRAF mutations and RET/PTC rearrangements are common. Follicular carcinoma is diagnosed by capsular or vascular invasion and spreads hematogenously.","ko":"유두암: Orphan Annie 핵·핵 고랑·psammoma body, 림프 전이, 소아기 방사선."},{"id":"en10","steps":["1"],"system":"Endocrine","discipline":"Immunology","topic":"Hashimoto thyroiditis","stem":"A 50-year-old woman has fatigue, weight gain, constipation, and cold intolerance. She has a firm, nontender, diffusely enlarged thyroid. TSH is elevated and free T4 is low. Anti-thyroid peroxidase antibodies are positive.\n\nThis patient is at increased risk of which of the following thyroid malignancies?","options":["Follicular carcinoma","Primary B-cell lymphoma of the thyroid","Anaplastic carcinoma","Medullary carcinoma","Metastatic breast carcinoma"
