],"answer":1,"explanation":"Hashimoto thyroiditis is the most common cause of hypothyroidism in iodine-sufficient regions. It is autoimmune, with anti-TPO and anti-thyroglobulin antibodies, and histology shows lymphocytic infiltration with germinal centers and Hürthle cells. Chronic lymphoid stimulation increases the risk of primary thyroid lymphoma, usually a marginal zone (MALT) or diffuse large B-cell lymphoma, which presents as a rapidly enlarging goiter. Early disease may cause transient hyperthyroidism (hashitoxicosis).","ko":"하시모토: anti-TPO, 배중심 림프구 침윤, 갑상선 B세포 림프종 위험."},{"id":"en11","steps":["1"],"system":"Endocrine","discipline":"Pharmacology","topic":"Hyperthyroidism in pregnancy","stem":"A 27-year-old woman with Graves disease learns that she is 7 weeks pregnant. Her free T4 is elevated and she has palpitations and tremor.\n\nWhich of the following is the most appropriate treatment at this stage of pregnancy?","options":["Methimazole","Total thyroidectomy now","Radioactive iodine","Propylthiouracil","Levothyroxine"],"answer":3,"explanation":"Thionamides inhibit thyroid peroxidase. Methimazole is teratogenic in the first trimester (aplasia cutis and embryopathy), so propylthiouracil is preferred until the end of the first trimester, after which patients switch to methimazole because PTU can cause severe hepatotoxicity. PTU also inhibits peripheral conversion of T4 to T3 by 5'-deiodinase, which is useful in thyroid storm. Both can cause agranulocytosis. Radioactive iodine is contraindicated in pregnancy.","ko":"임신 1삼분기 갑상선항진증 = PTU. 이후 methimazole(PTU 간독성). 둘 다 무과립구증."},{"id":"en12","steps":["1"],"system":"Endocrine","discipline":"Immunology","topic":"Type 1 diabetes pathogenesis","stem":"An 11-year-old boy has polyuria, polydipsia, and a 4-kg weight loss over 3 weeks. Blood glucose is 412 mg/dL with ketonuria. Antibodies to glutamic acid decarboxylase are positive.\n\nWhich of the following is the primary mechanism of his disease?","options":["Mutation in glucokinase","Peripheral insulin resistance with β-cell exhaustion","T cell-mediated destruction of pancreatic β cells","Antibodies blocking the insulin receptor","Amyloid deposition in the pancreatic islets"],"answer":2,"explanation":"Type 1 diabetes mellitus results from autoimmune, T cell-mediated destruction of β cells, with autoantibodies to GAD65, insulin, and islet antigens serving as markers. It is associated with HLA-DR3 and DR4. Islets show lymphocytic infiltration (insulitis). Patients have absolute insulin deficiency and are prone to DKA. Islet amyloid deposition and insulin resistance are features of type 2 diabetes. Glucokinase mutations cause a form of maturity-onset diabetes of the young.","ko":"1형 당뇨: T세포 매개 β세포 파괴, GAD65 항체, HLA-DR3/DR4."},{"id":"en13","steps":["1"],"system":"Endocrine","discipline":"Physiology","topic":"GLUT4 insulin dependence","stem":"A researcher measures glucose uptake in several isolated human tissues before and after adding insulin to the culture medium.\n\nGlucose uptake in which of the following tissues would increase the most with insulin?","options":["Skeletal muscle","Brain","Pancreatic β cells","Red blood cells","Hepatocytes"],"answer":0,"explanation":"GLUT4 is the insulin-responsive glucose transporter in skeletal muscle and adipose tissue; insulin causes GLUT4 vesicles to fuse with the cell membrane. Exercise also increases GLUT4 translocation in muscle. The brain (GLUT1 and GLUT3), red blood cells (GLUT1), and hepatocytes and β cells (GLUT2) take up glucose independently of insulin. GLUT2 lets β cells sense blood glucose.","ko":"인슐린 의존 포도당 흡수 = GLUT4 (근육·지방). 뇌·적혈구·간·β세포는 비의존."},{"id":"en14","steps":["1"],"system":"Endocrine","discipline":"Diagnosis","topic":"Factitious hypoglycemia","stem":"A 32-year-old nurse is brought to the emergency department after being found confused at work. Blood glucose is 32 mg/dL. Serum insulin is markedly elevated, and C-peptide is undetectable. A sulfonylurea screen is negative.\n\nWhich of the following is the most likely cause?","options":["Non-islet cell tumor secreting IGF-2","Sulfonylurea ingestion","Self-administration of exogenous insulin","Insulinoma","Adrenal insufficiency"],"answer":2,"explanation":"Proinsulin is cleaved into insulin and C-peptide in equal amounts, so endogenous insulin secretion raises both. High insulin with low C-peptide indicates exogenous insulin. An insulinoma or sulfonylurea use raises both insulin and C-peptide; a sulfonylurea screen distinguishes them. Insulin and C-peptide are suppressed in hypoglycemia from adrenal insufficiency or IGF-2-secreting tumors.","ko":"인슐린↑ + C-peptide↓ = 외인성 인슐린. 둘 다↑ = 인슐린종 또는 설포닐우레아."},{"id":"en15","steps":["1"],"system":"Endocrine","discipline":"Pharmacology","topic":"Sulfonylurea mechanism","stem":"A 64-year-old man with type 2 diabetes mellitus and normal kidney function is started on glipizide. Two months later he has an episode of sweating, tremor, and confusion after skipping lunch.\n\nGlipizide lowers glucose by which of the following mechanisms?","options":["Activating AMP-activated protein kinase in hepatocytes","Closing ATP-sensitive potassium channels in β cells","Inhibiting SGLT2 in the proximal tubule","Inhibiting dipeptidyl peptidase-4","Activating PPAR-γ in adipose tissue"],"answer":1,"explanation":"Sulfonylureas close ATP-sensitive potassium channels in β cells, depolarizing the membrane, opening voltage-gated calcium channels, and triggering insulin release. Because they release insulin regardless of glucose level, they cause hypoglycemia and weight gain. Metformin activates AMPK, thiazolidinediones activate PPAR-γ, gliptins inhibit DPP-4, and gliflozins inhibit SGLT2.","ko":"설포닐우레아 = β세포 K-ATP 채널 폐쇄 → 인슐린 분비. 저혈당·체중↑."},{"id":"en16","steps":["1"],"system":"Endocrine","discipline":"Pharmacology","topic":"Metformin","stem":"A 56-year-old woman with newly diagnosed type 2 diabetes mellitus and a BMI of 34 kg/m² is started on first-line oral therapy. She is told to stop it before a planned CT scan with IV contrast and to report muscle pain or rapid breathing.\n\nWhich of the following is the main mechanism of action of this drug?","options":["Increased urinary glucose excretion","Decreased hepatic gluconeogenesis","Delayed intestinal carbohydrate absorption","Increased insulin secretion from β cells","Increased GLP-1 receptor activation"],"answer":1,"explanation":"Metformin, the first-line drug for type 2 diabetes, mainly decreases hepatic gluconeogenesis and increases insulin sensitivity, partly through AMPK activation. It does not cause hypoglycemia or weight gain. Its most serious adverse effect is lactic acidosis, which is more likely with kidney failure, hypoperfusion, or IV contrast. It commonly causes GI upset and can cause vitamin B12 deficiency.","ko":"Metformin: 간 포도당신생↓, 저혈당 없음, 유산산증 주의(신부전·조영제), B12↓."},{"id":"en17","steps":["1"],"system":"Endocrine","discipline":"Pharmacology","topic":"Prolactinoma treatment","stem":"A 29-year-old woman has had amenorrhea and milky nipple discharge for 6 months. Pregnancy test is negative. Serum prolactin is 210 ng/mL. MRI shows a 7-mm pituitary adenoma.\n\nThe drug of choice for this condition acts by which of the following mechanisms?","options":["Blockade of estrogen receptors","Blockade of D2 dopamine receptors","Inhibition of GnRH release","Stimulation of D2 dopamine receptors on lactotrophs","Inhibition of somatostatin receptors"],"answer":3,"explanation":"Prolactinoma is the most common functional pituitary adenoma. Dopamine from the hypothalamus tonically inhibits prolactin secretion. Excess prolactin suppresses GnRH, causing amenorrhea, infertility, and low libido, along with galactorrhea. Dopamine agonists such as cabergoline and bromocriptine stimulate D2 receptors, lowering prolactin and shrinking the tumor. D2 antagonists such as antipsychotics and metoclopramide cause hyperprolactinemia.","ko":"프로락틴종 → D2 작용제(cabergoline). 고프로락틴 → GnRH 억제 → 무월경."},{"id":"en18","steps":["1"],"system":"Endocrine","discipline":"Diagnosis","topic":"Acromegaly","stem":"A 46-year-old man has noticed that his rings and shoes no longer fit. He has coarse facial features, a protruding jaw with widened spacing between his teeth, and large hands. He also has hypertension and impaired glucose tolerance.\n\nWhich of the following serum tests is the best initial test to screen for his condition?","options":["Random growth hormone","Insulin-like growth factor 1","TSH","Prolactin","ACTH"],"answer":1,"explanation":"Acromegaly is caused by excess growth hormone, usually from a pituitary adenoma, after the growth plates close. Because GH is released in pulses, a random GH level is unreliable. IGF-1, produced by the liver in response to GH, has a long half-life and is the best screening test. Failure of GH to suppress during an oral glucose tolerance test confirms the diagnosis. Cardiac disease (hypertrophy and heart failure) is the most common cause of death.","ko":"말단비대증 선별 = IGF-1. 확진: 경구 당부하 후 GH 억제 실패."},{"id":"en19","steps":["1"],"system":"Endocrine","discipline":"Pathology","topic":"Osmotic demyelination","stem":"A 62-year-old woman with small cell lung cancer is admitted with confusion. Serum sodium is 112 mEq/L. She receives hypertonic saline, and her sodium rises to 128 mEq/L within 24 hours. Three days later she develops dysarthria, difficulty swallowing, and weakness of all four limbs.\n\nWhich of the following is the most likely cause of her new symptoms?","options":["Osmotic demyelination of the pons","Brain metastasis","Ischemic stroke of the internal capsule","Cerebral edema","Paraneoplastic cerebellar degeneration"],"answer":0,"explanation":"Small cell lung cancer causes SIADH and chronic hyponatremia. Brain cells adapt to chronic hyponatremia by losing osmolytes; if sodium is corrected too quickly, water leaves the cells and causes osmotic demyelination, classically in the central pons, leading to quadriparesis, dysarthria, dysphagia, and locked-in syndrome. Correction should generally not exceed about 8 to 10 mEq/L in 24 hours. Correcting hypernatremia too quickly causes cerebral edema instead.","ko":"저나트륨 급속 교정 → 삼투성 탈수초(교뇌). 하루 8~10 mEq/L 이내로."},{"id":"en20","steps":["1"],"system":"Endocrine","discipline":"Biochemistry","topic":"21-hydroxylase deficiency","stem":"A newborn has ambiguous genitalia with clitoromegaly and fused labioscrotal folds. Karyotype is 46,XX, and a uterus and ovaries are present on ultrasonography. At 10 days of age, she has vomiting, poor feeding, hyponatremia, and hyperkalemia. Serum 17-hydroxyprogesterone is markedly elevated.\n\nDeficiency of which of the following enzymes is most likely?","options":["11β-Hydroxylase","17α-Hydroxylase","3β-Hydroxysteroid dehydrogenase","21-Hydroxylase","Aromatase"],"answer":3,"explanation":"21-Hydroxylase deficiency is the most common form of congenital adrenal hyperplasia. Cortisol and aldosterone cannot be made, so ACTH rises and precursors are shunted into adrenal androgens. Girls are virilized at birth, and the salt-wasting form causes hyponatremia, hyperkalemia, and shock in the first weeks of life. 17-hydroxyprogesterone is elevated. 11β-hydroxylase deficiency also virilizes but causes hypertension from excess 11-deoxycorticosterone. 17α-hydroxylase deficiency causes hypertension and undervirilization.","ko":"21-hydroxylase 결핍: 여아 남성화 + 염분소실(저Na·고K), 17-OHP↑."},{"id":"en21","steps":["1"],"system":"Endocrine","discipline":"Biochemistry","topic":"11β-hydroxylase deficiency","stem":"A 6-year-old boy has rapid growth, pubic hair, and penile enlargement. His blood pressure is 142/94 mm Hg. Serum potassium is 3.2 mEq/L, and plasma renin activity is suppressed. 11-Deoxycorticosterone and 11-deoxycortisol are elevated.\n\nDeficiency of which of the following enzymes is most likely?","options":["11β-Hydroxylase","21-Hydroxylase","17α-Hydroxylase","5α-Reductase","Aldosterone synthase"],"answer":0,"explanation":"In 11β-hydroxylase deficiency, cortisol and corticosterone cannot be made, so ACTH rises and precursors accumulate. 11-Deoxycorticosterone is a mineralocorticoid, so it causes hypertension, hypokalemia, and suppressed renin, while excess adrenal androgens cause virilization. 21-Hydroxylase deficiency causes virilization with salt wasting and hypotension. 17α-Hydroxylase deficiency causes hypertension with absent sex steroids.","ko":"11β-hydroxylase 결핍: 남성화 + 고혈압(11-DOC↑), 레닌↓."},{"id":"en22","steps":["1"],"system":"Endocrine","discipline":"Pathology","topic":"Sheehan syndrome","stem":"A 30-year-old woman had a vaginal delivery complicated by severe postpartum hemorrhage requiring transfusion of 6 units of blood. Six weeks later, she has been unable to breastfeed and feels fatigued and cold. Her menstrual periods have not returned.\n\nWhich of the following is the most likely cause?","options":["Prolactin-secreting adenoma","Ischemic necrosis of the anterior pituitary","Postpartum thyroiditis","Autoimmune destruction of the adrenal glands","Lymphocytic infiltration of the pituitary"],"answer":1,"explanation":"In Sheehan syndrome, the anterior pituitary, which enlarges during pregnancy but keeps the same blood supply, undergoes ischemic necrosis after severe postpartum hemorrhage and hypotension. Failure to lactate (loss of prolactin) is often the first sign, followed by amenorrhea and hypothyroidism and adrenal insufficiency from secondary causes. The posterior pituitary is usually spared because it has a separate arterial supply. Lymphocytic hypophysitis also occurs around pregnancy but is not linked to hemorrhage.","ko":"Sheehan = 산후 출혈 → 전뇌하수체 허혈 괴사. 첫 증상: 수유 불가."},{"id":"en23","steps":["1"],"system":"Endocrine","discipline":"Pathology","topic":"Craniopharyngioma","stem":"A 9-year-old boy has headaches and has been bumping into objects on both sides. His growth has slowed, and he urinates frequently at night. Visual field testing shows bitemporal hemianopia. CT shows a calcified cystic mass above the sella turcica.\n\nThis tumor most likely arises from remnants of which of the following?","options":["Rathke pouch","Ependymal cells","Neurohypophysis","Neural crest cells","Notochord"],"answer":0,"explanation":"Craniopharyngioma is a benign suprasellar tumor of childhood that arises from remnants of Rathke pouch, the ectodermal outgrowth of the oral cavity that forms the anterior pituitary. It is often cystic and calcified and contains motor-oil-like fluid. Compression of the optic chiasm causes bitemporal hemianopia, and compression of the pituitary and hypothalamus causes growth failure and diabetes insipidus. Chordomas arise from notochord remnants.","ko":"두개인두종 = Rathke낭 잔재, 소아, 석회화·낭성, 양이측 반맹."},{"id":"en24","steps":["1"],"system":"Endocrine","discipline":"Pharmacology","topic":"Thyroid hormone synthesis inhibitors","stem":"A 40-year-old woman with Graves disease begins treatment with methimazole. Within weeks, synthesis of new thyroid hormone decreases.\n\nMethimazole inhibits which of the following steps in thyroid hormone synthesis?","options":["Binding of TSH to its receptor","Oxidation and organification of iodide by thyroid peroxidase","Peripheral conversion of T4 to T3","Proteolysis of thyroglobulin to release T4","Uptake of iodide by the sodium-iodide symporter"],"answer":1,"explanation":"Thyroid peroxidase oxidizes iodide, adds it to tyrosine residues on thyroglobulin (organification), and couples iodotyrosines to form T3 and T4. Thionamides (methimazole and PTU) inhibit thyroid peroxidase, blocking new hormone synthesis, but stored hormone is still released, so the effect takes weeks. PTU also blocks peripheral 5'-deiodinase. Perchlorate and pertechnetate block the sodium-iodide symporter, and high-dose iodide acutely blocks hormone release.","ko":"Methimazole/PTU = TPO 억제(산화·유기화·결합). PTU는 말초 탈요오드화도 억제."},{"id":"en25","steps":["1"],"system":"Endocrine","discipline":"Pharmacology","topic":"Thyroid storm sequencing","stem":"A 34-year-old woman with untreated Graves disease is brought in after an emergency appendectomy with a temperature of 40.5°C (104.9°F), pulse of 160/min, agitation, and vomiting. Treatment includes propranolol, hydrocortisone, and propylthiouracil. Potassium iodide is given only 1 hour after the PTU.\n\nWhy is iodide given after the thionamide rather than before?","options":["To prevent the iodide from being used as substrate for new thyroid hormone synthesis","Because iodide inactivates PTU in the stomach","To allow the β-blocker to take effect first","Because iodide causes hypothyroidism if given first","To prevent iodide-induced agranulocytosis"],"answer":0,"explanation":"Thyroid storm is a life-threatening exacerbation of hyperthyroidism triggered by surgery, infection, or iodine load. Treatment includes a β-blocker for adrenergic symptoms, a thionamide to block new hormone synthesis (PTU also blocks peripheral T4-to-T3 conversion), high-dose iodide to block release of stored hormone (Wolff-Chaikoff effect), and glucocorticoids to reduce T4-to-T3 conversion. Iodide is given at least an hour after the thionamide so that it is not used to make more hormone.","ko":"갑상선 폭풍: β차단 + PTU 먼저 → 1시간 후 요오드(새 호르몬 원료 방지) + 스테로이드."},{"id":"en26","steps":["1"],"system":"Endocrine","discipline":"Pathology","topic":"Subacute granulomatous thyroiditis","stem":"A 40-year-old woman has a tender, painful thyroid with pain radiating to her jaw, fever, palpitations, and fatigue 2 weeks after an upper respiratory infection. Free T4 is elevated, TSH is suppressed, and ESR is 90 mm/h. Radioactive iodine uptake is very low.\n\nWhich of the following is the most likely diagnosis?","options":["Subacute granulomatous (de Quervain) thyroiditis","Graves disease","Toxic multinodular goiter","Hashimoto thyroiditis","Riedel thyroiditis"],"answer":0,"explanation":"Subacute granulomatous thyroiditis follows a viral infection and causes a painful, tender thyroid, high ESR, and transient hyperthyroidism from release of stored hormone, followed by hypothyroidism and recovery. Because the gland is not making new hormone, radioactive iodine uptake is low, unlike in Graves disease and toxic nodules, where uptake is high. Histology shows granulomatous inflammation with giant cells. Treatment is NSAIDs and β-blockers.","ko":"아급성 육아종성 갑상선염: 바이러스 후, 통증성 갑상선, ESR↑, 일시적 항진, 요오드 섭취율↓."},{"id":"en27","steps":["1"],"system":"Endocrine","discipline":"Physiology","topic":"Estrogen and thyroid-binding globulin","stem":"A 28-year-old woman who is 20 weeks pregnant has routine thyroid tests. Total T4 is elevated, but free T4 and TSH are normal. She has no symptoms of thyroid disease.\n\nWhich of the following best explains these results?","options":["Increased renal clearance of free T4","hCG stimulates the TSH receptor","Fetal thyroid hormone crosses into the maternal circulation","Estrogen increases hepatic production of thyroid-binding globulin","Placental deiodinase converts T4 to reverse T3"],"answer":3,"explanation":"Estrogen (in pregnancy and oral contraceptive use) increases liver production of thyroxine-binding globulin, so more T4 is bound and total T4 rises, while free T4, the active hormone, stays normal with normal TSH. Conditions that decrease TBG, such as nephrotic syndrome, liver failure, and androgen use, lower total T4. In early pregnancy, high hCG can mildly stimulate the TSH receptor and lower TSH.","ko":"임신·에스트로겐 → TBG↑ → 총 T4↑, 유리 T4·TSH 정상."},{"id":"en28","steps":["1"],"system":"Endocrine","discipline":"Physiology","topic":"Rickets labs","stem":"An 18-month-old breastfed boy with dark skin who rarely goes outside has bowed legs, delayed walking, and widened wrists. X-rays show cupped and frayed metaphyses.\n\nWhich of the following sets of laboratory findings is most likely?","options":["Calcium ↑, phosphate ↓, PTH ↑, alkaline phosphatase normal","Calcium ↓, phosphate ↑, PTH ↓, alkaline phosphatase normal","Calcium ↑, phosphate ↑, PTH ↓, alkaline phosphatase ↓","Calcium ↓ or normal, phosphate ↓, PTH ↑, alkaline phosphatase ↑","Calcium normal, phosphate normal, PTH normal, alkaline phosphatase normal"],"answer":3,"explanation":"Vitamin D deficiency reduces intestinal absorption of calcium and phosphate. Low calcium stimulates PTH, which keeps calcium near normal by mobilizing bone but increases phosphate excretion, so phosphate is low. Defective mineralization of osteoid at growth plates causes rickets in children (bowed legs, rachitic rosary, widened wrists, craniotabes) and osteomalacia in adults, with high alkaline phosphatase from osteoblast activity. Exclusively breastfed infants need vitamin D supplements.","ko":"구루병(비타민 D 결핍): Ca↓/정상, P↓, PTH↑, ALP↑."},{"id":"en29","steps":["1"],"system":"Endocrine","discipline":"Genetics","topic":"Pseudohypoparathyroidism","stem":"A 10-year-old girl has short stature, a round face, obesity, and short fourth and fifth metacarpals. She has had muscle cramps and a seizure. Serum calcium is low, phosphate is high, and PTH is markedly elevated. Injected PTH does not increase urinary cAMP.\n\nWhich of the following is the underlying defect?","options":["Inactivating mutation of the Gs α subunit (GNAS) in the kidney and bone","22q11 deletion","Vitamin D receptor defect","Mutation of the calcium-sensing receptor","Destruction of the parathyroid glands"],"answer":0,"explanation":"Pseudohypoparathyroidism type 1A is end-organ resistance to PTH caused by an inactivating mutation of GNAS (the Gs α subunit) inherited from the mother; the kidney expresses only the maternal allele because of imprinting. It causes hypocalcemia and hyperphosphatemia with high PTH. Albright hereditary osteodystrophy (short stature, round face, short fourth and fifth metacarpals, obesity) accompanies it. Pseudopseudohypoparathyroidism has the physical features with normal labs when the mutation comes from the father.","ko":"가성부갑상선기능저하증 1A: GNAS(모계) → PTH 저항, Ca↓·P↑·PTH↑ + Albright 골이영양증."},{"id":"en30","steps":["1"],"system":"Endocrine","discipline":"Physiology","topic":"Familial hypocalciuric hypercalcemia","stem":"A 35-year-old woman has a serum calcium of 10.9 mg/dL found on routine testing. She has no symptoms. PTH is mildly elevated, and 24-hour urinary calcium excretion is very low (calcium-to-creatinine clearance ratio below 0.01). Her mother and brother have similar laboratory findings.\n\nWhich of the following is the most appropriate management?","options":["No treatment; reassurance","High-dose loop diuretic","Cinacalcet in all cases","Bisphosphonate therapy","Parathyroidectomy"],"answer":0,"explanation":"Familial hypocalciuric hypercalcemia is an autosomal dominant loss-of-function mutation of the calcium-sensing receptor on parathyroid and renal cells. A higher calcium level is needed to suppress PTH, and the kidney reabsorbs more calcium, causing mild hypercalcemia, normal or mildly high PTH, and low urinary calcium. It is benign and does not require parathyroidectomy, which would not correct it. Distinguishing it from primary hyperparathyroidism (high urinary calcium) avoids unnecessary surgery.","ko":"FHH: CaSR 결함(AD), 경미한 고칼슘 + 저칼슘뇨, 양성 → 수술 불필요."},{"id":"en31","steps":["1"],"system":"Endocrine","discipline":"Biochemistry","topic":"Polyol pathway in diabetes","stem":"A 60-year-old man with poorly controlled type 2 diabetes has bilateral cataracts and a stocking-glove sensory neuropathy.\n\nWhich enzyme converts glucose into an osmotically active compound that accumulates in the lens and Schwann cells?","options":["Glycogen synthase","Aldose reductase","Sorbitol dehydrogenase","Hexokinase","Glucose-6-phosphate dehydrogenase"],"answer":1,"explanation":"Aldose reductase converts glucose to sorbitol using NADPH. Sorbitol dehydrogenase converts sorbitol to fructose in the liver, ovaries, and seminal vesicles, but the lens, Schwann cells, retina, and kidneys have little of it. In chronic hyperglycemia, sorbitol accumulates in these tissues and draws in water, contributing to cataracts, neuropathy, and retinopathy. Nonenzymatic glycation of proteins also contributes to diabetic complications.","ko":"Aldose reductase: 포도당 → 소르비톨 → 수정체·슈반세포 축적(삼투) → 백내장·신경병증."},{"id":"en32","steps":["1"],"system":"Endocrine","discipline":"Physiology","topic":"HHS versus DKA","stem":"A 72-year-old woman with type 2 diabetes is brought in confused after a week of increased thirst and urination during a urinary tract infection. Glucose is 1,150 mg/dL, serum osmolality is 385 mOsm/kg, pH is 7.36, bicarbonate is 23 mEq/L, and serum ketones are minimal.\n\nWhich of the following best explains the absence of significant ketoacidosis?","options":["Ketones are rapidly excreted by the kidneys","The liver lacks HMG-CoA synthase in type 2 diabetes","Enough insulin is present to suppress lipolysis and ketogenesis","Glucagon is completely suppressed","Severe hyperglycemia inhibits ketone production directly"],"answer":2,"explanation":"Hyperosmolar hyperglycemic state occurs mainly in type 2 diabetes, often triggered by infection or poor fluid intake. Residual insulin is enough to suppress lipolysis and hepatic ketogenesis but not enough to control glucose, so extreme hyperglycemia, severe dehydration, and hyperosmolality develop without significant acidosis. Altered mental status correlates with osmolality. Treatment is aggressive IV fluids, insulin, and potassium replacement.","ko":"HHS: 남은 인슐린이 지방분해·케톤 생성은 억제 → 극심한 고혈당·고삼투, 산증 없음."},{"id":"en33","steps":["1"],"system":"Endocrine","discipline":"Pharmacology","topic":"GLP-1 receptor agonists","stem":"A 52-year-old woman with type 2 diabetes and obesity is started on weekly injections of semaglutide. She loses 9 kg over 6 months and has some nausea.\n\nWhich of the following is a contraindication to this drug class?","options":["Recurrent urinary tract infections","Personal or family history of medullary thyroid carcinoma","History of kidney stones","Heart failure with reduced ejection fraction","History of hypothyroidism"],"answer":1,"explanation":"GLP-1 receptor agonists (semaglutide, liraglutide, dulaglutide) increase glucose-dependent insulin secretion, decrease glucagon, slow gastric emptying, and increase satiety, causing weight loss and low risk of hypoglycemia. Some reduce cardiovascular events. Adverse effects include nausea and vomiting, and they are associated with pancreatitis. Because of C-cell tumors in rodents, they are contraindicated in patients with a personal or family history of medullary thyroid carcinoma or MEN2.","ko":"GLP-1 작용제: 포도당 의존 인슐린↑, 위배출 지연, 체중↓. 수질성 갑상선암·MEN2 병력 금기."},{"id":"en34","steps":["1"],"system":"Endocrine","discipline":"Pharmacology","topic":"Thiazolidinediones","stem":"A 66-year-old man with type 2 diabetes is started on a drug that improves insulin sensitivity by acting on a nuclear receptor in adipose tissue. Three months later he has gained 4 kg and has leg edema and worsening dyspnea.\n\nWhich drug was most likely started?","options":["Empagliflozin","Pioglitazone","Glipizide","Sitagliptin","Metformin"],"answer":1,"explanation":"Thiazolidinediones (pioglitazone) activate PPAR-γ, a nuclear receptor that regulates genes for fat cell differentiation and glucose uptake, increasing insulin sensitivity and adiponectin. Adverse effects include weight gain, fluid retention that can worsen heart failure (contraindicated in symptomatic HF), fractures, and possibly bladder cancer. They do not cause hypoglycemia on their own.","ko":"Pioglitazone = PPAR-γ 작용, 인슐린 감수성↑. 체중↑·부종·심부전 악화·골절."},{"id":"en35","steps":["1"],"system":"Endocrine","discipline":"Pathology","topic":"Steroid withdrawal adrenal crisis","stem":"A 58-year-old woman who has taken prednisone 20 mg daily for 2 years for polymyalgia rheumatica stops it abruptly before a trip. A week later she is brought in with vomiting, abdominal pain, and a blood pressure of 78/40 mm Hg. Serum sodium is 129 mEq/L, potassium is 4.4 mEq/L, and ACTH is low.\n\nWhich zone of the adrenal cortex is relatively preserved in this condition?","options":["Zona fasciculata","Adrenal medulla only","Zona reticularis","Zona glomerulosa","No zone is preserved"],"answer":3,"explanation":"Long-term exogenous glucocorticoids suppress CRH and ACTH, causing atrophy of the ACTH-dependent zona fasciculata and reticularis. Abrupt withdrawal causes secondary adrenal insufficiency with cortisol deficiency. The zona glomerulosa is regulated mainly by the renin-angiotensin system and potassium, so aldosterone is preserved and hyperkalemia is uncommon, unlike primary adrenal insufficiency. Glucocorticoids should be tapered, and stress doses are given during illness or surgery.","ko":"장기 스테로이드 중단 → 2차 부신부전(속상대·망상대 위축), 사구대(알도스테론) 보존 → 고칼륨 드묾."},{"id":"en36","steps":["1"],"system":"Endocrine","discipline":"Genetics","topic":"MEN1","stem":"A 40-year-old man has recurrent calcium oxalate kidney stones, multiple duodenal ulcers, and decreased libido with mild galactorrhea. His serum calcium, PTH, gastrin, and prolactin are all elevated. His sister had a pancreatic tumor removed.\n\nA mutation in which gene is most likely?","options":["RET","VHL","TSC2","NF1","MEN1 (menin)"],"answer":4,"explanation":"Multiple endocrine neoplasia type 1 is an autosomal dominant mutation in MEN1, which encodes the tumor suppressor menin. It causes the three Ps: parathyroid hyperplasia or adenomas (hypercalcemia, the most common feature), pituitary tumors (often prolactinoma), and pancreatic and duodenal neuroendocrine tumors (gastrinoma causing Zollinger-Ellison syndrome, insulinoma). MEN2A and 2B are caused by RET mutations.","ko":"MEN1(menin): 부갑상선 + 뇌하수체(프로락틴종) + 췌장(가스트린종) — 3P."},{"id":"en37","steps":["1"],"system":"Endocrine","discipline":"Pathology","topic":"Glucagonoma","stem":"A 58-year-old woman has weight loss, new-onset diabetes, and a painful, migratory, red, blistering rash with crusting on her groin, buttocks, and legs. She had a deep vein thrombosis 2 months ago. CT shows a mass in the tail of the pancreas.\n\nWhich of the following is the most likely diagnosis?","options":["Somatostatinoma","Gastrinoma","VIPoma","Insulinoma","Glucagonoma"],"answer":4,"explanation":"Glucagonoma is an α-cell tumor of the pancreas that causes the 4 Ds: dermatitis (necrolytic migratory erythema), diabetes, deep vein thrombosis, and depression, along with weight loss from catabolism. VIPoma causes watery diarrhea, hypokalemia, and achlorhydria (WDHA). Somatostatinoma causes diabetes, gallstones, and steatorrhea. Octreotide treats symptoms of several of these tumors.","ko":"Glucagonoma: 괴사성 이동홍반 + 당뇨 + DVT + 우울(4D)."},{"id":"en38","steps":["1"],"system":"Endocrine","discipline":"Pathology","topic":"VIPoma","stem":"A 50-year-old man has profuse watery diarrhea of 4 L per day that continues during fasting. He has severe hypokalemia and low gastric acid secretion. Stool osmotic gap is low. CT shows a pancreatic mass.\n\nWhich hormone is most likely secreted by the tumor?","options":["Glucagon","Serotonin","Somatostatin","Vasoactive intestinal peptide","Gastrin"],"answer":3,"explanation":"VIPoma is a pancreatic neuroendocrine tumor that secretes vasoactive intestinal peptide, which stimulates intestinal chloride and water secretion and inhibits gastric acid. It causes WDHA syndrome: watery diarrhea, hypokalemia, and achlorhydria. The diarrhea is secretory (low stool osmotic gap, persists with fasting). Octreotide reduces secretion, and surgery is curative when possible.","ko":"VIPoma: WDHA(수양성 설사·저칼륨·무산증), 금식에도 지속되는 분비성 설사."},{"id":"en39","steps":["1"],"system":"Endocrine","discipline":"Anatomy","topic":"Hypothalamic nuclei","stem":"A 30-year-old woman has severe polyuria and polydipsia after neurosurgery for a lesion above the sella. A water deprivation test confirms central diabetes insipidus.\n\nIn which hypothalamic nucleus are most of the cell bodies that produce the deficient hormone located?","options":["Suprachiasmatic nucleus","Arcuate nucleus","Ventromedial nucleus","Supraoptic nucleus","Paraventricular nucleus"],"answer":3,"explanation":"ADH is made mainly in the supraoptic nucleus and oxytocin mainly in the paraventricular nucleus, and both are transported down axons to the posterior pituitary for release. The arcuate nucleus makes dopamine and GHRH, the suprachiasmatic nucleus controls circadian rhythm, the ventromedial nucleus mediates satiety (lesions cause hyperphagia), and the lateral nucleus mediates hunger (lesions cause anorexia).","ko":"ADH = 시상상핵(supraoptic), 옥시토신 = 실방핵(paraventricular)."},{"id":"en40","steps":["1"],"system":"Endocrine","discipline":"Physiology","topic":"Thyroid hormone actions","stem":"A 30-year-old woman with Graves disease has tachycardia, heat intolerance, and weight loss. Her physician explains that thyroid hormone increases her basal metabolic rate and makes her heart more sensitive to catecholamines.\n\nWhich of the following describes how T3 produces these effects?","options":["It binds nuclear receptors and increases transcription of genes such as Na+/K+-ATPase and β1 receptors","It binds a Gs-coupled membrane receptor and raises cAMP","It opens ligand-gated ion channels","It acts through the JAK-STAT pathway","It activates receptor tyrosine kinases"],"answer":0,"explanation":"Thyroid hormone (mainly T3, formed from T4 by peripheral deiodinases) enters cells and binds nuclear receptors that act as transcription factors. It increases Na+/K+-ATPase activity (raising oxygen use and heat production), increases β1 receptor expression (heightening sensitivity to catecholamines), and promotes growth, CNS maturation, glycogenolysis, gluconeogenesis, and lipolysis. Steroid hormones also act through intracellular receptors.","ko":"T3 = 핵 수용체 → Na/K-ATPase↑(기초대사↑), β1 수용체↑. β차단제로 증상 조절."},{"id":"gi01","steps":["1"],"system":"Gastrointestinal","discipline":"Pathology","topic":"Celiac disease complications","stem":"A 34-year-old woman has had chronic diarrhea, bloating, and fatigue for 2 years. She has iron deficiency anemia and an intensely itchy vesicular rash on her elbows and knees. Serum IgA anti-tissue transglutaminase antibodies are elevated. Duodenal biopsy shows villous atrophy, crypt hyperplasia, and intraepithelial lymphocytes.\n\nIf untreated, this patient is at increased risk of which of the following malignancies?","options":["Hepatocellular carcinoma","MALT lymphoma of the stomach","Enteropathy-associated T-cell lymphoma","Pancreatic adenocarcinoma","Gastric adenocarcinoma"],"answer":2,"explanation":"Celiac disease is an autoimmune reaction to gliadin in genetically susceptible people (HLA-DQ2 and DQ8). Tissue transglutaminase deamidates gliadin, which is then presented to T cells. It mainly affects the distal duodenum and proximal jejunum, causing iron, folate, and fat malabsorption. Dermatitis herpetiformis is its skin manifestation. Long-term risks include enteropathy-associated T-cell lymphoma and small bowel adenocarcinoma, which a gluten-free diet reduces.","ko":"셀리악: HLA-DQ2/8, anti-tTG, 포진상 피부염, 장관 T세포 림프종 위험."},{"id":"gi02","steps":["1"],"system":"Gastrointestinal","discipline":"Pathology","topic":"Crohn disease oxalate stones","stem":"A 27-year-old man has Crohn disease involving the terminal ileum. He has chronic diarrhea with fatty stools and now has colicky flank pain. CT shows a kidney stone, and urinalysis shows envelope-shaped crystals.\n\nWhich of the following best explains the formation of his kidney stone?","options":["Unabsorbed fatty acids bind calcium, leaving free oxalate to be absorbed in the colon","Vitamin D deficiency increases calcium excretion","Low urine volume concentrates cystine","Bacterial urease alkalinizes the urine","Loss of bicarbonate in stool increases uric acid excretion"],"answer":0,"explanation":"Crohn disease of the terminal ileum causes bile acid malabsorption and fat malabsorption. Unabsorbed fatty acids bind calcium in the gut, so dietary oxalate that is normally bound to calcium stays free and is absorbed in the colon (enteric hyperoxaluria), causing calcium oxalate stones. Crohn disease is transmural with skip lesions, noncaseating granulomas, fistulas, strictures, and creeping fat; ileal disease also causes vitamin B12 deficiency and gallstones.","ko":"크론(회장) → 지방흡수장애 → Ca가 지방산과 결합 → 옥살산 흡수↑ → 수산칼슘 결석."},{"id":"gi03","steps":["1"],"system":"Gastrointestinal","discipline":"Pathology","topic":"Primary sclerosing cholangitis","stem":"A 35-year-old man with a 10-year history of ulcerative colitis has fatigue and pruritus. Serum alkaline phosphatase is 520 U/L, with mildly elevated bilirubin. MRCP shows multifocal strictures and dilations of the intrahepatic and extrahepatic bile ducts.\n\nThis patient's liver disease most increases his risk of which of the following?","options":["Hepatitis C infection","Wilson disease","Budd-Chiari syndrome","Cholangiocarcinoma","Hepatic adenoma"],"answer":3,"explanation":"Primary sclerosing cholangitis causes concentric onion-skin fibrosis of intrahepatic and extrahepatic bile ducts, with a beaded appearance on cholangiography. It is strongly associated with ulcerative colitis, is more common in men, and is associated with p-ANCA. It can progress to biliary cirrhosis and greatly increases the risk of cholangiocarcinoma and gallbladder cancer. Primary biliary cholangitis, in contrast, affects small intrahepatic ducts in middle-aged women with anti-mitochondrial antibodies.","ko":"PSC: 궤양성 대장염 연관, 담관 염주 모양, 담관암 위험. PBC는 중년 여성·AMA."},{"id":"gi04","steps":["1"],"system":"Gastrointestinal","discipline":"Microbiology","topic":"H. pylori urease","stem":"A 45-year-old man has burning epigastric pain that improves after meals and wakes him at night. Endoscopy shows a duodenal ulcer. A breath test after he ingests 13C-labeled urea is positive.\n\nWhich of the following features of the causative organism allows it to survive in the stomach?","options":["Formation of a polysaccharide capsule","Production of urease generating ammonia","Secretion of a heat-stable enterotoxin","Production of an IgA protease","Formation of spores"],"answer":1,"explanation":"Helicobacter pylori is a curved, flagellated, gram-negative rod that produces urease, converting urea into ammonia, which neutralizes acid around the organism. This is also the basis of the urea breath test and stool antigen test. H. pylori causes chronic antral gastritis, duodenal and gastric ulcers, gastric adenocarcinoma, and MALT lymphoma. Treatment combines a PPI with antibiotics such as clarithromycin and amoxicillin, or bismuth quadruple therapy.","ko":"H. pylori: urease → 암모니아 → 산 중화. 십이지장궤양·위암·MALT 림프종."},{"id":"gi05","steps":["1"],"system":"Gastrointestinal","discipline":"Pathology","topic":"Zollinger-Ellison syndrome","stem":"A 46-year-old woman has recurrent peptic ulcers despite PPI therapy, along with chronic watery diarrhea. Endoscopy shows multiple ulcers in the distal duodenum and proximal jejunum. Fasting serum gastrin is markedly elevated and rises further after IV secretin. Her brother has had kidney stones from hyperparathyroidism.\n\nWhich of the following is the most likely diagnosis?","options":["Medullary thyroid carcinoma as part of MEN 2A","Gastric outlet obstruction","Helicobacter pylori infection","Chronic atrophic gastritis","Gastrinoma as part of multiple endocrine neoplasia type 1"],"answer":4,"explanation":"Zollinger-Ellison syndrome is caused by a gastrin-secreting tumor (gastrinoma), usually in the duodenum or pancreas. Excess acid causes refractory, multiple, or distally located ulcers and diarrhea, because acid inactivates pancreatic enzymes. Secretin normally suppresses gastrin, but it paradoxically increases gastrin from a gastrinoma. About 25% are associated with MEN1 (parathyroid, pituitary, and pancreatic tumors). In atrophic gastritis, gastrin is high because acid is low.","ko":"가스트린종: 다발성·원위부 궤양, secretin 자극 시 gastrin↑, MEN1 연관."},{"id":"gi06","steps":["1"],"system":"Gastrointestinal","discipline":"Pathology","topic":"Achalasia","stem":"A 38-year-old woman has progressive difficulty swallowing both solids and liquids for a year, with regurgitation of undigested food. Barium swallow shows a dilated esophagus with a smooth, tapered narrowing at the gastroesophageal junction. Manometry shows absent peristalsis and failure of the lower esophageal sphincter to relax.\n\nWhich of the following is the most likely underlying cause?","options":["Squamous cell carcinoma of the distal esophagus","Loss of inhibitory neurons in the myenteric plexus","Chronic acid reflux causing a peptic stricture","Eosinophilic infiltration of the esophageal mucosa","Fibrosis of the esophageal smooth muscle"],"answer":1,"explanation":"Achalasia results from loss of inhibitory neurons in the myenteric (Auerbach) plexus that release nitric oxide and VIP. Without them, the lower esophageal sphincter cannot relax and peristalsis is lost, causing dysphagia to both solids and liquids from the start and a bird's beak appearance. Secondary achalasia occurs in Chagas disease (Trypanosoma cruzi). Mechanical obstruction such as cancer causes dysphagia to solids first. Achalasia increases the risk of esophageal squamous cell carcinoma.","ko":"아칼라지아 = 근층신경총 억제성 뉴런(NO/VIP) 소실, 고체+액체 연하곤란, bird's beak."},{"id":"gi07","steps":["1"],"system":"Gastrointestinal","discipline":"Anatomy","topic":"Hirschsprung disease","stem":"A 2-day-old boy with Down syndrome has not passed meconium. He has abdominal distension and bilious vomiting. Digital rectal examination is followed by an explosive release of stool and gas. A suction rectal biopsy is performed.\n\nWhich of the following findings is most likely?","options":["Transmural granulomatous inflammation","Absence of ganglion cells in the submucosal and myenteric plexuses","Inspissated meconium due to abnormal chloride transport","Duplication of the bowel wall","Telescoping of one bowel segment into another"],"answer":1,"explanation":"Hirschsprung disease results from failed migration of neural crest cells to the distal colon, leaving an aganglionic segment that always includes the rectum and cannot relax. It presents with delayed passage of meconium, distension, and an explosive stool after rectal examination (squirt sign). It is associated with Down syndrome and RET mutations. Diagnosis is by rectal biopsy, and treatment is resection of the aganglionic segment. Meconium ileus is associated with cystic fibrosis.","ko":"Hirschsprung = 신경능선 이동 실패 → 직장 무신경절. Down·RET 연관."},{"id":"gi08","steps":["1"],"system":"Gastrointestinal","discipline":"Physiology","topic":"Pyloric stenosis","stem":"A 4-week-old boy has projectile nonbilious vomiting after every feeding for 5 days and appears hungry afterward. He received erythromycin in the first week of life. An olive-shaped mass is palpable in the epigastrium.\n\nWhich of the following sets of laboratory findings is most likely?","options":["Hyponatremia with metabolic acidosis","Respiratory acidosis with hyperkalemia","Hypochloremic, hypokalemic metabolic alkalosis","Anion gap metabolic acidosis with hypokalemia","Hyperchloremic, hyperkalemic metabolic acidosis"],"answer":2,"explanation":"Hypertrophic pyloric stenosis presents at 2 to 6 weeks with projectile, nonbilious vomiting and a palpable olive-shaped mass. It is more common in firstborn boys and after early macrolide exposure. Loss of gastric HCl causes hypochloremic metabolic alkalosis, and volume depletion activates aldosterone, causing hypokalemia. Fluids and electrolytes are corrected before pyloromyotomy.","ko":"유문협착: 2~6주 분출성 비담즙 구토, 올리브 종괴, 저Cl·저K 대사성 알칼리증."},{"id":"gi09","steps":["1"],"system":"Gastrointestinal","discipline":"Anatomy","topic":"Duodenal atresia","stem":"A newborn girl with upslanting palpebral fissures and a single palmar crease has bilious vomiting within hours of her first feeding. Prenatal ultrasonography showed polyhydramnios. Abdominal x-ray shows two large gas-filled bubbles in the upper abdomen and no gas distally.\n\nWhich of the following is the most likely embryologic cause?","options":["Vascular accident in the fetal small bowel","Failure of recanalization of the duodenum","Failure of neural crest cell migration","Persistence of the vitelline duct","Failure of the midgut to rotate"],"answer":1,"explanation":"Duodenal atresia results from failure of the duodenum to recanalize after its solid epithelial stage. It causes bilious vomiting (when the obstruction is distal to the ampulla), polyhydramnios because the fetus cannot absorb swallowed amniotic fluid, and a double bubble sign. It is strongly associated with Down syndrome. Jejunal and ileal atresias result from vascular accidents in utero.","ko":"십이지장 폐쇄 = 재관강화 실패, double bubble, Down 증후군."},{"id":"gi10","steps":["1"],"system":"Gastrointestinal","discipline":"Anatomy","topic":"Meckel diverticulum","stem":"A 2-year-old boy is brought to the emergency department because of painless passage of a large amount of maroon blood per rectum. He is otherwise healthy. A technetium-99m pertechnetate scan shows a focus of uptake in the right lower quadrant.\n\nThis condition results from failure of which of the following?","options":["Rotation of the midgut","Migration of neural crest cells","Obliteration of the vitelline duct","Fusion of the ventral and dorsal pancreatic buds","Closure of the urachus"],"answer":2,"explanation":"Meckel diverticulum is a true diverticulum from persistence of the vitelline (omphalomesenteric) duct. It may contain ectopic gastric mucosa, which secretes acid and ulcerates adjacent ileal mucosa, causing painless bleeding; the pertechnetate scan detects the gastric mucosa. The rule of 2s: about 2% of the population, 2 feet from the ileocecal valve, 2 inches long, and usually symptomatic before age 2. It can also cause intussusception or volvulus.","ko":"Meckel = 난황관 잔존, 이소성 위점막 → 무통성 출혈, Tc-99m 스캔."},{"id":"gi11","steps":["1"],"system":"Gastrointestinal","discipline":"Microbiology","topic":"Hepatitis B serology - vaccination","stem":"A 24-year-old nursing student has hepatitis B serologic testing before starting clinical rotations. Results are:\nHBsAg: negative\nAnti-HBs: positive\nAnti-HBc (total): negative\n\nWhich of the following best explains these results?","options":["Window period of acute infection","Immunity from a resolved past infection","Immunity from vaccination","Chronic hepatitis B infection","Early acute infection"],"answer":2,"explanation":"Hepatitis B vaccine contains only HBsAg, so a vaccinated person has anti-HBs but no anti-HBc. Anti-HBc appears only after natural infection, because the core antigen is expressed only during viral replication. A resolved infection shows both anti-HBs and anti-HBc IgG. Chronic infection shows persistent HBsAg for more than 6 months with anti-HBc IgG.","ko":"Anti-HBs(+) 단독, anti-HBc(−) = 백신 접종. 과거 감염은 anti-HBc(+)도 있음."},{"id":"gi12","steps":["1"],"system":"Gastrointestinal","discipline":"Microbiology","topic":"Hepatitis B window period","stem":"A 30-year-old man had acute hepatitis with jaundice 3 months ago after unprotected sex with a new partner. His symptoms have resolved. Results of serologic testing are:\nHBsAg: negative\nAnti-HBs: negative\nIgM anti-HBc: positive\nHBeAg: negative\n\nWhich of the following best explains these results?","options":["False-positive test","Window period of hepatitis B infection","Chronic active hepatitis B","Resolved infection with lasting immunity","Immunity from vaccination"],"answer":1,"explanation":"In the window period of hepatitis B, HBsAg has cleared but anti-HBs is not yet detectable. IgM anti-HBc is the only marker of recent infection during this time. Anti-HBs appears later and indicates recovery and immunity. HBeAg indicates active replication and high infectivity.","ko":"Window period: HBsAg(−), anti-HBs(−), IgM anti-HBc(+)만 양성."},{"id":"gi13","steps":["1"],"system":"Gastrointestinal","discipline":"Pathology","topic":"Acetaminophen hepatotoxicity","stem":"A 19-year-old woman is brought to the emergency department 20 hours after intentionally ingesting a large number of acetaminophen tablets. She has nausea and right upper quadrant pain. AST is 6200 U/L and ALT is 5800 U/L.\n\nWhich region of the liver lobule is most likely damaged?","options":["Midzonal area (zone 2)","Sinusoidal endothelium of the portal tract","Interlobular bile ducts","Periportal area around the portal triad (zone 1)","Centrilobular area around the central vein (zone 3)"],"answer":4,"explanation":"Acetaminophen is mostly glucuronidated and sulfated, but a fraction is converted by CYP2E1 to the toxic metabolite NAPQI, which is normally neutralized by glutathione. In overdose, glutathione is depleted and NAPQI damages hepatocytes. Zone 3 (centrilobular) hepatocytes have the most CYP450 activity and the lowest oxygen tension, so they are injured first. N-acetylcysteine replenishes glutathione. Zone 1 is affected by viral hepatitis and ingested toxins such as cocaine.","ko":"아세트아미노펜 = NAPQI, zone 3(중심소엽) 괴사, 해독제 NAC."},{"id":"gi14","steps":["1"],"system":"Gastrointestinal","discipline":"Pathology","topic":"Hereditary hemochromatosis","stem":"A 52-year-old man has fatigue, joint pain in his second and third MCP joints, and new-onset diabetes mellitus. His skin is bronze. Serum ferritin is 2400 ng/mL and transferrin saturation is 85%. Genetic testing shows homozygous C282Y mutations in HFE.\n\nWhich of the following best explains the iron overload?","options":["Inappropriately low hepcidin allowing increased ferroportin-mediated iron absorption","Increased hepcidin trapping iron in macrophages","Increased red cell destruction releasing iron","Defective iron incorporation into heme","Excess dietary iron intake"],"answer":0,"explanation":"Hereditary hemochromatosis is an autosomal recessive disease, usually from HFE C282Y mutations, that inappropriately lowers hepcidin. Hepcidin normally degrades ferroportin, so its deficiency increases iron absorption in the duodenum and release from macrophages. Iron deposits in the liver (cirrhosis and hepatocellular carcinoma), pancreas (diabetes), skin, heart (cardiomyopathy), joints, and pituitary. Treatment is phlebotomy.","ko":"혈색소증(HFE): hepcidin↓ → ferroportin↑ → 철 흡수↑. 청동색 당뇨, 사혈 치료."},{"id":"gi15","steps":["1"],"system":"Gastrointestinal","discipline":"Biochemistry","topic":"Wilson disease","stem":"A 17-year-old boy has a new tremor, slurred speech, and declining school performance. His aminotransferases are elevated. Slit-lamp examination shows golden-brown rings at the periphery of the corneas. Serum ceruloplasmin is low, and 24-hour urinary copper is elevated.\n\nWhich of the following is the most likely underlying defect?","options":["Deficiency of hepcidin","Increased intestinal copper absorption","Defective lysosomal enzyme for copper storage","Defective hepatocyte copper transport into bile and ceruloplasmin","Defective copper absorption from the intestine"],"answer":3,"explanation":"Wilson disease is an autosomal recessive mutation of ATP7B on chromosome 13, a copper-transporting ATPase in hepatocytes. Copper cannot be excreted into bile or incorporated into ceruloplasmin, so it accumulates in the liver, brain (especially the putamen), and cornea (Kayser-Fleischer rings). It causes hepatitis or cirrhosis, movement disorders, psychiatric symptoms, and hemolytic anemia. Treatment includes chelators such as penicillamine or trientine and zinc. Menkes disease is a defect in intestinal copper absorption.","ko":"Wilson(ATP7B): 세룰로플라스민↓, K-F ring, 기저핵(피각) 침범. 치료 penicillamine."},{"id":"gi16","steps":["1"],"system":"Gastrointestinal","discipline":"Biochemistry","topic":"Gilbert syndrome","stem":"A 21-year-old man notices that the whites of his eyes turned slightly yellow during a 3-day fast for a religious holiday. He feels well. Total bilirubin is 3.1 mg/dL with a direct fraction of 0.3 mg/dL. Hemoglobin, reticulocyte count, and aminotransferases are normal.\n\nWhich of the following is the most likely diagnosis?","options":["Rotor syndrome","Dubin-Johnson syndrome","Gilbert syndrome","Crigler-Najjar syndrome type I","Hereditary spherocytosis"],"answer":2,"explanation":"Gilbert syndrome is a common, benign condition with mildly decreased UDP-glucuronosyltransferase activity, causing mild unconjugated hyperbilirubinemia during fasting, illness, or stress. No treatment is needed. Crigler-Najjar type I has absent enzyme activity and causes severe neonatal jaundice and kernicterus. Dubin-Johnson (black liver) and Rotor syndromes cause conjugated hyperbilirubinemia. Hemolysis is excluded by the normal hemoglobin and reticulocyte count.","ko":"Gilbert: UGT 활성 약간↓, 금식·스트레스 시 간접 빌리루빈↑, 양성."},{"id":"gi17","steps":["1"],"system":"Gastrointestinal","discipline":"Pathology","topic":"Pancreatic pseudocyst","stem":"A 48-year-old man had acute alcoholic pancreatitis 5 weeks ago. He now has early satiety and a vague epigastric mass. CT shows a 7-cm round fluid collection adjacent to the pancreas with a well-defined wall. Analysis of the fluid shows a very high amylase level.\n\nThe wall of this lesion is most likely composed of which of the following?","options":["Cuboidal epithelium with glycogen-rich cells","Ductal epithelium with dysplasia","Mucin-producing columnar epithelium","Squamous epithelium","Granulation tissue and fibrous tissue without an epithelial lining"],"answer":4,"explanation":"A pancreatic pseudocyst forms 4 or more weeks after acute pancreatitis when enzyme-rich fluid is walled off by granulation and fibrous tissue. It has no epithelial lining, which distinguishes it from true cystic neoplasms such as mucinous cystic neoplasms. Complications include infection, rupture, hemorrhage, and compression of adjacent structures.","ko":"가성낭종: 췌장염 4주 후, 상피 없는 육아·섬유조직 벽, 아밀라아제 풍부."},{"id":"gi18","steps":["1"],"system":"Gastrointestinal","discipline":"Pathology","topic":"Pancreatic adenocarcinoma","stem":"A 68-year-old man who smokes has had painless jaundice, weight loss, and pale stools for 6 weeks. He has also had several episodes of tender superficial venous thrombosis in different locations on his arms and legs. A nontender, palpable gallbladder is present.\n\nWhich of the following serum markers is most likely to be elevated?","options":["CA-125","β-hCG","Prostate-specific antigen","CA 19-9","α-Fetoprotein"],"answer":3,"explanation":"Painless obstructive jaundice with a palpable, nontender gallbladder (Courvoisier sign) and migratory thrombophlebitis (Trousseau syndrome) suggest adenocarcinoma of the head of the pancreas. Risk factors include smoking, chronic pancreatitis, diabetes, and age; KRAS mutations are common. CA 19-9 is the associated tumor marker. α-Fetoprotein is associated with hepatocellular carcinoma and yolk sac tumors, and CA-125 with ovarian cancer.","ko":"췌두부암: 무통성 황달 + Courvoisier + Trousseau, CA 19-9, KRAS."},{"id":"gi19","steps":["1"],"system":"Gastrointestinal","discipline":"Pathology","topic":"Familial adenomatous polyposis","stem":"A 24-year-old man has rectal bleeding. Colonoscopy shows more than 500 adenomatous polyps throughout the colon. His father died of colon cancer at age 38.\n\nThis patient most likely inherited a mutation in which of the following genes?","options":["SMAD4","BRCA1","MLH1","KRAS","APC"],"answer":4,"explanation":"Familial adenomatous polyposis is an autosomal dominant mutation of the APC tumor suppressor gene on chromosome 5q. APC normally promotes degradation of β-catenin; loss of APC activates Wnt signaling. Patients develop hundreds to thousands of colonic adenomas and essentially all develop colorectal cancer, so prophylactic colectomy is recommended. Gardner syndrome adds osteomas and soft tissue tumors, and Turcot syndrome adds brain tumors. SMAD4 mutations cause juvenile polyposis.","ko":"FAP = APC(5q), β-catenin 분해 실패, 수백 개 용종 → 예방적 대장절제."},{"id":"gi20","steps":["1"],"system":"Gastrointestinal","discipline":"Biochemistry","topic":"Lynch syndrome","stem":"A 43-year-old woman is diagnosed with adenocarcinoma of the ascending colon. Her mother had endometrial cancer at age 49, and her maternal uncle had colon cancer at age 45. Tumor testing shows high microsatellite instability.\n\nThis patient's cancer most likely resulted from a defect in which of the following DNA repair pathways?","options":["Nonhomologous end joining","Base excision repair","Nucleotide excision repair","Mismatch repair","Homologous recombination"],"answer":3,"explanation":"Lynch syndrome (hereditary nonpolyposis colorectal cancer) is an autosomal dominant defect in mismatch repair genes (MLH1, MSH2, MSH6, PMS2). Uncorrected replication errors accumulate, especially in repetitive sequences, causing microsatellite instability. It causes right-sided colon cancer at a young age, often without many polyps, and endometrial, ovarian, and other cancers. Nucleotide excision repair is defective in xeroderma pigmentosum, and homologous recombination in BRCA1/2 mutations.","ko":"Lynch = 불일치 복구(MLH1, MSH2) 결함, MSI, 우측 대장암 + 자궁내막암."},{"id":"gi21","steps":["1"],"system":"Gastrointestinal","discipline":"Pathology","topic":"Carcinoid syndrome","stem":"A 58-year-old man has had episodes of facial flushing, watery diarrhea, and wheezing for 6 months. Examination shows a holosystolic murmur at the left lower sternal border that increases with inspiration. CT shows multiple liver masses and a small ileal mass.\n\nWhich of the following is most likely elevated in a 24-hour urine collection?","options":["Vanillylmandelic acid","Metanephrines","Free cortisol","5-Hydroxyindoleacetic acid","Homovanillic acid"],"answer":3,"explanation":"Carcinoid tumors (well-differentiated neuroendocrine tumors) of the small bowel secrete serotonin, which is metabolized by the liver. Carcinoid syndrome develops when liver metastases release serotonin directly into the systemic circulation. It causes flushing, diarrhea, bronchospasm, and right-sided valve fibrosis (tricuspid regurgitation, pulmonic stenosis); the lungs inactivate serotonin, sparing the left side. Urinary 5-HIAA is elevated, and tryptophan diversion can cause niacin deficiency. Octreotide treats symptoms.","ko":"카르시노이드 증후군 = 간전이 후, 홍조·설사·우측 판막, 소변 5-HIAA↑."},{"id":"gi22","steps":["1"],"system":"Gastrointestinal","discipline":"Anatomy","topic":"Indirect inguinal hernia","stem":"A 4-month-old boy has a swelling in his right groin that extends into the scrotum and enlarges when he cries. It reduces easily. At surgery, the hernia sac is found to pass through the deep inguinal ring lateral to the inferior epigastric vessels.\n\nWhich of the following is the embryologic cause of this condition?","options":["Weakness of the transversalis fascia in Hesselbach triangle","Failure of the processus vaginalis to obliterate","Incomplete closure of the umbilical ring","Failure of the gubernaculum to form","Failure of the urachus to close"],"answer":1,"explanation":"Indirect inguinal hernias pass through the deep inguinal ring lateral to the inferior epigastric vessels, follow the spermatic cord, and can enter the scrotum. They are caused by a patent processus vaginalis and are the most common hernia in infants and in both sexes. Direct hernias protrude through Hesselbach triangle medial to the inferior epigastric vessels because of weak transversalis fascia, usually in older men.","ko":"간접 서혜부 탈장 = 초상돌기 개존, 하복벽혈관 외측. 직접은 내측(Hesselbach)."},{"id":"gi23","steps":["1"],"system":"Gastrointestinal","discipline":"Anatomy","topic":"Watershed ischemic colitis","stem":"A 76-year-old woman has crampy left-sided abdominal pain and bloody diarrhea 1 day after a prolonged episode of hypotension during cardiac surgery. Colonoscopy shows patchy mucosal ulceration and edema.\n\nWhich segment of the colon is most likely affected?","options":["Cecum","Hepatic flexure","Rectum","Splenic flexure","Ascending colon"],"answer":3,"explanation":"Ischemic colitis most often affects watershed areas that lie at the border of two arterial supplies and are vulnerable to low flow. The splenic flexure lies between the superior and inferior mesenteric arteries, and the rectosigmoid junction lies between the inferior mesenteric artery and the hypogastric arteries. The rectum is rarely affected because it has a dual blood supply.","ko":"허혈성 대장염 호발부 = watershed: 비장굴곡(SMA/IMA), 직장S상결장 경계."},{"id":"gi24","steps":["1"],"system":"Gastrointestinal","discipline":"Pharmacology","topic":"Proton pump inhibitor","stem":"A 62-year-old woman has taken omeprazole daily for 8 years for reflux. She now has muscle cramps and a tremor. Serum magnesium is 0.9 mg/dL. She also had a hip fracture last year after a minor fall.\n\nOmeprazole acts by which of the following mechanisms?","options":["Neutralization of gastric acid in the lumen","Competitive blockade of H2 receptors on parietal cells","Stimulation of prostaglandin E1 receptors","Irreversible inhibition of the H+/K+-ATPase in parietal cells","Formation of a protective coating over ulcers"],"answer":3,"explanation":"Proton pump inhibitors are prodrugs activated in the acid of parietal cell canaliculi, where they irreversibly inhibit the H+/K+-ATPase, the final step of acid secretion. Long-term use is associated with hypomagnesemia, osteoporosis and fractures (reduced calcium absorption), Clostridioides difficile infection, pneumonia, and vitamin B12 deficiency. H2 blockers such as famotidine are reversible receptor antagonists, misoprostol is a PGE1 analog, and sucralfate coats ulcers.","ko":"PPI = 벽세포 H/K-ATPase 비가역 억제. 장기: 저Mg·골절·C. diff·B12 결핍."},{"id":"gi25","steps":["1"],"system":"Gastrointestinal","discipline":"Pharmacology","topic":"Ondansetron","stem":"A 55-year-old woman receives cisplatin-based chemotherapy. Before each infusion she is given a medication that prevents nausea. She later reports constipation and headache, and an ECG shows a prolonged QT interval.\n\nThis antiemetic most likely acts by which of the following mechanisms?","options":["Blockade of H1 receptors","Blockade of D2 receptors","Blockade of NK1 receptors","Blockade of 5-HT3 receptors","Activation of cannabinoid receptors"],"answer":3,"explanation":"Ondansetron and other setrons block 5-HT3 receptors in the chemoreceptor trigger zone and on vagal afferents in the gut. They are first-line for chemotherapy-induced nausea. Adverse effects include headache, constipation, and QT prolongation. Metoclopramide blocks D2 receptors and can cause extrapyramidal symptoms. Aprepitant blocks NK1 (substance P) receptors and is added for highly emetogenic chemotherapy.","ko":"Ondansetron = 5-HT3 길항제. 두통·변비·QT 연장."},{"id":"gi26","steps":["1"],"system":"Gastrointestinal","discipline":"Physiology","topic":"Terminal ileum resection","stem":"A 30-year-old man had 100 cm of terminal ileum resected for Crohn disease 4 years ago. He now has fatigue, numbness in his feet, and fatty diarrhea. Hemoglobin is 9.2 g/dL with an MCV of 112 fL.\n\nWhich of the following best explains his anemia?","options":["Loss of the site of absorption of the vitamin B12-intrinsic factor complex","Loss of parietal cells producing intrinsic factor","Bacterial overgrowth consuming iron","Chronic blood loss from the anastomosis","Impaired folate absorption in the duodenum"],"answer":0,"explanation":"The vitamin B12-intrinsic factor complex is absorbed only in the terminal ileum, so ileal resection or disease causes B12 deficiency with megaloblastic anemia and neurologic findings. The terminal ileum also reabsorbs bile acids. Losing more than about 100 cm depletes the bile acid pool and causes fat malabsorption and steatorrhea; smaller resections cause bile acid diarrhea. Parietal cell loss causes B12 deficiency in pernicious anemia, and folate is absorbed in the jejunum.","ko":"회장 말단 절제 → B12-IF 흡수 불가 + 담즙산 재흡수 장애(지방변)."},{"id":"gi27","steps":["1"],"system":"Gastrointestinal","discipline":"Pathology","topic":"Barrett esophagus","stem":"A 58-year-old man with heartburn for 20 years undergoes upper endoscopy, which shows salmon-colored mucosa extending 4 cm above the gastroesophageal junction. Biopsy of this area is performed.\n\nWhich of the following findings confirms the diagnosis, and which cancer is he at increased risk for?","options":["Stratified squamous epithelium with basal hyperplasia; squamous cell carcinoma","Columnar epithelium with goblet cells; squamous cell carcinoma","Columnar epithelium with goblet cells; adenocarcinoma","Keratinized squamous epithelium; adenocarcinoma","Eosinophils within squamous epithelium; adenocarcinoma"],"answer":2,"explanation":"Barrett esophagus is intestinal metaplasia, in which nonciliated columnar epithelium with goblet cells replaces the normal stratified squamous epithelium of the distal esophagus in response to chronic acid reflux. It can progress through dysplasia to esophageal adenocarcinoma in the lower third. Esophageal squamous cell carcinoma usually arises in the upper and middle thirds and is linked to smoking, alcohol, achalasia, and hot liquids.","ko":"Barrett = 원주상피 + goblet cell(장상피화생) → 하부 식도 선암."},{"id":"gi28","steps":["1"],"system":"Gastrointestinal","discipline":"Anatomy","topic":"Esophageal varices","stem":"A 55-year-old man with alcoholic cirrhosis vomits a large amount of bright red blood. Endoscopy shows bleeding varices in the distal esophagus.\n\nThese varices form at an anastomosis between the portal system and which systemic vein?","options":["Superior epigastric vein","Inferior vena cava directly","Esophageal branches of the azygos vein","Renal vein","Inferior rectal vein"],"answer":2,"explanation":"In portal hypertension, blood is diverted through portosystemic anastomoses. Esophageal varices form between the left gastric vein (portal) and esophageal veins draining into the azygos system (systemic). Caput medusae forms between paraumbilical veins and superficial epigastric veins, and rectal varices between the superior rectal vein and the middle and inferior rectal veins. TIPS creates a shunt between the portal and hepatic veins.","ko":"식도정맥류 = 좌위정맥(문맥) ↔ 기정맥계 식도정맥. 메두사 머리 = 제방정맥 ↔ 상복벽정맥."},{"id":"gi29","steps":["1"],"system":"Gastrointestinal","discipline":"Pharmacology","topic":"Lactulose for hepatic encephalopathy","stem":"A 60-year-old woman with cirrhosis becomes confused and drowsy after a GI bleed. She has a flapping tremor of her outstretched hands. Serum ammonia is elevated.\n\nWhich of the following best explains how lactulose improves her condition?","options":["Colonic bacteria convert it to acids that trap ammonia as ammonium","It blocks ammonia absorption by binding it in the stomach","It increases hepatic urea synthesis","It inhibits glutamine synthetase in the brain","It kills ammonia-producing bacteria in the small intestine"],"answer":0,"explanation":"Hepatic encephalopathy results from ammonia and other toxins that bypass the failing liver. Triggers include GI bleeding (protein load), infection, constipation, hypokalemia, diuretics, and sedatives. Lactulose is fermented by colonic bacteria into lactic and acetic acids, which acidify the colon and convert ammonia (NH3) to ammonium (NH4+), which is trapped and excreted; it also acts as a laxative. Rifaximin reduces ammonia-producing gut bacteria.","ko":"Lactulose: 대장 산성화 → NH3를 NH4+로 포획·배설. Rifaximin은 암모니아 생성균 감소."},{"id":"gi30","steps":["1"],"system":"Gastrointestinal","discipline":"Pathology","topic":"Budd-Chiari syndrome","stem":"A 35-year-old woman with polycythemia vera has abdominal pain, rapidly increasing ascites, and tender hepatomegaly. Doppler ultrasonography shows absent flow in the hepatic veins. A liver biopsy shows congestion around central veins with a mottled appearance.\n\nWhich of the following is the most likely diagnosis?","options":["Budd-Chiari syndrome","Primary biliary cholangitis","Right-sided heart failure","Veno-occlusive disease after chemotherapy","Portal vein thrombosis"],"answer":0,"explanation":"Budd-Chiari syndrome is thrombosis or obstruction of the hepatic veins, associated with hypercoagulable states such as polycythemia vera (JAK2), paroxysmal nocturnal hemoglobinuria, pregnancy, and malignancy. It causes painful hepatomegaly, ascites, and centrilobular congestion and necrosis (nutmeg liver), without the JVD seen in heart failure. Portal vein thrombosis causes portal hypertension without hepatomegaly.","ko":"Budd-Chiari: 간정맥 혈전(진성 적혈구증가증·PNH), 통증성 간비대·복수, 육두구 간, JVD 없음."},{"id":"gi31","steps":["1"],"system":"Gastrointestinal","discipline":"Pathology","topic":"Aflatoxin and HCC","stem":"A 50-year-old man from rural China has right upper quadrant pain and weight loss. CT shows a large liver mass, and serum α-fetoprotein is markedly elevated. He has chronic hepatitis B, and his diet includes peanuts and grains stored in damp conditions.\n\nThe fungal toxin in his diet contributes to this tumor by causing which of the following?","options":["A specific mutation in TP53","Mutation in VHL","Amplification of HER2","Loss of APC","Activation of BCR-ABL"],"answer":0,"explanation":"Hepatocellular carcinoma is associated with chronic hepatitis B (which can cause HCC even without cirrhosis), hepatitis C, alcohol, NASH, hemochromatosis, Wilson disease, and α1-antitrypsin deficiency. Aflatoxin, produced by Aspergillus flavus on stored grains and nuts, causes a characteristic G:C to T:A mutation in TP53. HCC spreads hematogenously, can invade the hepatic or portal veins, and raises AFP.","ko":"아플라톡신(Aspergillus) → TP53 특이 변이 → 간세포암. HBV는 간경변 없이도 HCC 유발."},{"id":"gi32","steps":["1"],"system":"Gastrointestinal","discipline":"Immunology","topic":"Primary biliary cholangitis","stem":"A 52-year-old woman has fatigue and itching that is worse at night. She has dry eyes and dry mouth. Alkaline phosphatase is 480 U/L, bilirubin is mildly elevated, and anti-mitochondrial antibodies are positive. Ultrasonography shows no bile duct dilation.\n\nWhich of the following is the first-line treatment?","options":["Cholestyramine as definitive treatment","Endoscopic stent placement","Ursodeoxycholic acid","Interferon-α","Prednisone"],"answer":2,"explanation":"Primary biliary cholangitis is autoimmune lymphocytic destruction of small intrahepatic bile ducts, mainly in middle-aged women, causing cholestasis with pruritus, fatigue, high ALP, xanthomas, fat-soluble vitamin deficiencies, and eventually cirrhosis. Anti-mitochondrial antibodies are characteristic, and it is associated with other autoimmune diseases such as Sjögren syndrome and Hashimoto thyroiditis. Ursodiol slows progression; obeticholic acid is an alternative. Cholestyramine relieves itching.","ko":"PBC: 중년 여성, 소엽간 담관 파괴, 항미토콘드리아 항체, 가려움 → ursodiol."},{"id":"gi33","steps":["1"],"system":"Gastrointestinal","discipline":"Pathology","topic":"Pigment gallstones","stem":"A 14-year-old boy with hereditary spherocytosis has episodes of colicky right upper quadrant pain after meals. Ultrasonography shows multiple small gallstones.\n\nWhich type of gallstone is most likely?","options":["Calcium oxalate stones","Cholesterol stones","Brown pigment stones from biliary infection","Black pigment stones of calcium bilirubinate","Struvite stones"],"answer":3,"explanation":"Black pigment stones are made of calcium bilirubinate and form with increased unconjugated bilirubin, as in chronic hemolysis (hereditary spherocytosis, sickle cell disease) and cirrhosis. They are often radiopaque. Brown pigment stones form in infected bile ducts (E. coli, Ascaris, Clonorchis). Cholesterol stones, the most common type, are associated with female sex, obesity, pregnancy, oral contraceptives, rapid weight loss, Crohn disease, and fibrates.","ko":"흑색 색소결석 = 만성 용혈(유전성 구형적혈구증·겸상적혈구). 갈색 = 담도 감염."},{"id":"gi34","steps":["1"],"system":"Gastrointestinal","discipline":"Pathology","topic":"Gallstone ileus","stem":"An 80-year-old woman with a long history of gallstones has crampy abdominal pain, distension, and vomiting. Abdominal x-ray shows dilated small bowel loops, air in the biliary tree, and a rounded opacity in the right lower quadrant.\n\nWhich of the following best explains these findings?","options":["A fistula between the gallbladder and duodenum allowing a stone to obstruct the ileum","A stone obstructing the common bile duct","Volvulus of the cecum","Gas-producing bacterial infection of the gallbladder only","Perforation of the gallbladder into the peritoneal cavity"],"answer":0,"explanation":"In gallstone ileus, chronic inflammation creates a cholecystoenteric fistula through which a large gallstone enters the bowel and lodges at the narrowest point, usually the ileocecal valve, causing small bowel obstruction. Air enters the biliary tree through the fistula (pneumobilia). Treatment is surgical removal of the stone. Emphysematous cholecystitis also causes gas but in the gallbladder wall, typically in diabetics.","ko":"담석 장폐색: 담낭-십이지장 누공 → 결석이 회맹판 폐쇄, 담도 내 공기."},{"id":"gi35","steps":["1"],"system":"Gastrointestinal","discipline":"Pathology","topic":"Causes of acute pancreatitis","stem":"A 38-year-old man with poorly controlled diabetes and a history of eruptive xanthomas has severe epigastric pain radiating to his back. Serum lipase is 12 times the upper limit of normal. He drinks no alcohol, and ultrasonography shows no gallstones. His blood sample is visibly milky.\n\nWhich of the following is the most likely cause of his pancreatitis?","options":["Hyperkalemia","Hypercalcemia","Hepatitis B infection","Hypocalcemia","Hypertriglyceridemia"],"answer":4,"explanation":"The most common causes of acute pancreatitis are gallstones and alcohol. Other causes include hypertriglyceridemia (usually above 1,000 mg/dL), hypercalcemia, post-ERCP injury, drugs (azathioprine, valproate, didanosine, GLP-1 agonists, sulfonamides), trauma, mumps, and scorpion stings. Premature activation of trypsin inside the pancreas causes autodigestion. Lipase is more specific than amylase.","ko":"급성 췌장염 원인: 담석·알코올 > 고중성지방(>1000)·고칼슘·약물·ERCP·볼거리."},{"id":"gi36","steps":["1"],"system":"Gastrointestinal","discipline":"Physiology","topic":"Chronic pancreatitis malabsorption","stem":"A 50-year-old man with chronic alcoholic pancreatitis has foul-smelling, greasy stools and weight loss. CT shows pancreatic calcifications. Laboratory studies show a prolonged PT, and he also has night blindness.\n\nWhich of the following best explains these findings?","options":["Liver failure reducing synthesis of clotting factors","Autoimmune destruction of enterocytes","Loss of pancreatic lipase causing malabsorption of fat-soluble vitamins","Loss of intrinsic factor causing B12 deficiency","Bacterial overgrowth consuming vitamin K"],"answer":2,"explanation":"Chronic pancreatitis causes irreversible fibrosis and calcification with exocrine and endocrine insufficiency. Lipase deficiency causes steatorrhea and malabsorption of fat-soluble vitamins A, D, E, and K: night blindness (A), prolonged PT (K), osteomalacia (D), and neuropathy (E). Loss of islets causes diabetes. Treatment includes pancreatic enzyme replacement and vitamin supplementation.","ko":"만성 췌장염: 리파아제 부족 → 지방변 + 지용성 비타민(A·D·E·K) 결핍, 당뇨."},{"id":"gi37","steps":["1"],"system":"Gastrointestinal","discipline":"Pathology","topic":"Boerhaave syndrome","stem":"A 50-year-old man with alcohol use disorder has sudden severe chest pain after repeated forceful vomiting. He has subcutaneous crepitus in his neck, and a crunching sound is heard with each heartbeat. Chest x-ray shows air in the mediastinum and a left pleural effusion.\n\nWhich of the following is the most likely diagnosis?","options":["Esophageal spasm","Esophageal varices","Transmural esophageal rupture","Mallory-Weiss tear","Acute myocardial infarction"],"answer":2,"explanation":"Boerhaave syndrome is a transmural rupture of the distal esophagus from violent retching, causing pneumomediastinum, subcutaneous emphysema, Hamman sign (mediastinal crunch), and pleural effusion. It is a surgical emergency diagnosed with water-soluble contrast esophagography or CT. A Mallory-Weiss tear is a mucosal laceration at the gastroesophageal junction that causes hematemesis but not perforation.","ko":"Boerhaave = 구토 후 식도 전층 파열, 종격동 기종·Hamman 징후. Mallory-Weiss는 점막 열상(토혈)."},{"id":"gi38","steps":["1"],"system":"Gastrointestinal","discipline":"Pathology","topic":"Diffuse gastric cancer","stem":"A 45-year-old woman has early satiety, weight loss, and vomiting. Endoscopy shows a thickened, rigid stomach wall that does not distend. Biopsy shows scattered cells with mucin that pushes the nucleus to the side, infiltrating the wall. Examination shows a hard left supraclavicular lymph node.\n\nWhich feature distinguishes this tumor from the intestinal type of gastric cancer?","options":["Origin in Barrett esophagus","Loss of E-cadherin and no strong link to H. pylori","Formation of glands with an ulcerated mass on the lesser curvature","Association with blood type O","Strong association with H. pylori and nitrosamines"],"answer":1,"explanation":"Diffuse gastric adenocarcinoma consists of signet ring cells that infiltrate the wall, causing a leather-bottle stomach (linitis plastica). It is associated with loss of E-cadherin (CDH1) and is not strongly related to H. pylori. The intestinal type forms glands and ulcerated masses, often on the lesser curvature, and is associated with H. pylori, chronic gastritis, nitrosamines, smoked foods, and blood type A. Gastric cancer can spread to the left supraclavicular node (Virchow), umbilicus (Sister Mary Joseph), and ovaries (Krukenberg).","ko":"미만형 위암: 반지세포, 가죽병 위, E-cadherin 소실, H. pylori 연관 약함. 장형은 H. pylori."},{"id":"gi39","steps":["1"],"system":"Gastrointestinal","discipline":"Pathology","topic":"Gastric MALT lymphoma","stem":"A 60-year-old man has dyspepsia. Endoscopy shows thickened gastric folds. Biopsy shows dense infiltration of the mucosa by small B lymphocytes that invade and destroy gastric glands. H. pylori organisms are seen.\n\nWhich of the following is the most appropriate initial treatment?","options":["Eradication of H. pylori","Total gastrectomy","Imatinib","CHOP chemotherapy","Radiation therapy"],"answer":0,"explanation":"Gastric MALT lymphoma (extranodal marginal zone B-cell lymphoma) arises from chronic B-cell stimulation by H. pylori infection. Lymphoepithelial lesions, in which tumor cells invade glands, are characteristic. Early lesions often regress completely after H. pylori eradication, as long as they lack the t(11;18) translocation. Other MALT lymphomas arise in the salivary glands in Sjögren syndrome and the thyroid in Hashimoto thyroiditis.","ko":"위 MALT 림프종: H. pylori 만성 자극 → 제균만으로 퇴행 가능(t(11;18) 없을 때)."},{"id":"gi40","steps":["1"],"system":"Gastrointestinal","discipline":"Microbiology","topic":"Whipple disease","stem":"A 55-year-old white man has chronic diarrhea, weight loss, migratory joint pain, and recent memory problems. Small bowel biopsy shows the lamina propria filled with foamy macrophages containing PAS-positive material. The villi are widened.\n\nWhich of the following is the most likely cause?","options":["Clostridioides difficile","Giardia lamblia","Tropheryma whipplei","Mycobacterium avium complex","Gluten sensitivity"],"answer":2,"explanation":"Whipple disease is caused by Tropheryma whipplei, a gram-positive actinomycete. It usually affects older white men and causes malabsorption, arthralgia, lymphadenopathy, cardiac involvement (endocarditis), and neurologic symptoms. Foamy macrophages full of PAS-positive organisms fill the lamina propria and block lymphatic drainage. Treatment is ceftriaxone followed by long-term TMP-SMX. Mycobacterium avium complex in AIDS can look similar but is acid-fast.","ko":"Whipple병: T. whipplei, 고령 백인 남성, 흡수장애 + 관절통 + 신경증상, PAS(+) 거품 대식세포."},{"id":"gi41","steps":["1"],"system":"Gastrointestinal","discipline":"Physiology","topic":"Lactose intolerance","stem":"A 24-year-old man of East Asian descent has bloating, cramping, flatulence, and watery diarrhea af
