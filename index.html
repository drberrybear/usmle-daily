kin","discipline":"Pharmacology","topic":"Hydroxychloroquine","stem":"A 34-year-old woman with SLE has joint pain and a photosensitive rash. She is started on a drug that is the foundation of lupus treatment and reduces flares. She is told she will need regular eye examinations.\n\nWhich adverse effect requires these examinations?","options":["Retinal toxicity","Acute angle-closure glaucoma","Optic neuritis","Cataracts","Corneal ulcers"],"answer":0,"explanation":"Hydroxychloroquine is recommended for nearly all patients with SLE; it reduces flares, organ damage, and thrombosis and improves survival. It accumulates in the retina and can cause irreversible retinopathy (bull's-eye maculopathy) with long-term use, so annual screening is recommended after 5 years or sooner with risk factors. Other adverse effects include GI upset and, rarely, QT prolongation and cardiomyopathy. Corticosteroids cause cataracts and glaucoma.","ko":"Hydroxychloroquine: SLE 기본 치료, 망막 독성(bull's-eye) → 정기 안과 검사."},{"id":"mk39","steps":["1"],"system":"MSK & Skin","discipline":"Pharmacology","topic":"Aspirin mechanism","stem":"A 60-year-old man takes low-dose aspirin daily after a myocardial infarction. His platelet function remains inhibited for about a week after he stops it, even though aspirin's half-life is only minutes.\n\nWhich of the following explains the prolonged effect?","options":["Aspirin depletes vitamin K-dependent factors","Aspirin irreversibly acetylates cyclooxygenase, and platelets cannot make new enzyme","Aspirin is stored in platelets and released slowly","Aspirin irreversibly inhibits thrombin","Aspirin permanently blocks the P2Y12 receptor"],"answer":1,"explanation":"Aspirin irreversibly acetylates COX-1 and COX-2. Platelets have no nucleus and cannot synthesize new COX, so thromboxane A2 production is blocked for the life of the platelet (about 7 to 10 days). Other NSAIDs inhibit COX reversibly. Aspirin's adverse effects include GI ulcers and bleeding, tinnitus, aspirin-exacerbated respiratory disease, and Reye syndrome in children with viral infections.","ko":"아스피린 = COX 비가역적 아세틸화 → 무핵 혈소판은 재합성 불가 → 혈소판 수명(7~10일) 동안 TXA2 억제."},{"id":"mk40","steps":["1"],"system":"MSK & Skin","discipline":"Pathology","topic":"Erythema multiforme","stem":"A 24-year-old woman develops many round, red skin lesions on her palms, hands, and forearms, each with a dark center, a pale ring, and a red outer ring. She had cold sores on her lip a week ago. Her oral mucosa has a few small erosions.\n\nWhich of the following is the most common trigger of this condition?","options":["Systemic lupus erythematosus","Contact allergy","Herpes simplex virus infection","Lyme disease","Sulfonamide antibiotics"],"answer":2,"explanation":"Erythema multiforme is a hypersensitivity reaction with targetoid lesions (three zones), often on the extremities, palms, and soles, with limited mucosal involvement. The most common trigger is HSV infection; Mycoplasma pneumoniae is another. Stevens-Johnson syndrome and toxic epidermal necrolysis are different, more severe disorders with extensive mucosal involvement and epidermal necrosis, usually caused by drugs such as sulfonamides, anticonvulsants, allopurinol, and NSAIDs.","ko":"다형홍반: 과녁 모양 병변(손·발바닥), 가장 흔한 원인 HSV. SJS/TEN은 약물·점막 광범위."},{"id":"mk41","steps":["1"],"system":"MSK & Skin","discipline":"Biochemistry","topic":"Albinism vs vitiligo","stem":"A 10-year-old boy has very light skin and hair, light blue eyes, nystagmus, and poor vision. Skin biopsy shows a normal number of melanocytes.\n\nDeficiency of which of the following is the most likely cause?","options":["Homogentisate oxidase activity","Tyrosinase activity","Neural crest migration","Melanocyte number from autoimmune destruction","Phenylalanine hydroxylase activity"],"answer":1,"explanation":"Oculocutaneous albinism is caused by defective melanin production, most often from tyrosinase deficiency, with normal melanocyte numbers. It increases the risk of skin cancer and causes visual problems. Vitiligo is autoimmune destruction of melanocytes, producing depigmented patches with absent melanocytes. Albinism can also result from failed neural crest migration in some syndromes. PKU causes lighter pigmentation through low tyrosine.","ko":"백색증: 티로시나아제 결핍, 멜라닌세포 수 정상. 백반증: 멜라닌세포 자가면역 파괴(수 감소)."},{"id":"mk42","steps":["1"],"system":"MSK & Skin","discipline":"Pharmacology","topic":"BRAF in melanoma","stem":"A 52-year-old man with metastatic melanoma has a tumor that carries a BRAF V600E mutation. He is treated with a targeted drug and shows a dramatic response.\n\nWhich of the following drugs targets this mutation?","options":["Erlotinib","Trastuzumab","Bevacizumab","Imatinib","Vemurafenib"],"answer":4,"explanation":"About half of cutaneous melanomas have activating BRAF V600E mutations that drive the MAP kinase pathway. Vemurafenib and dabrafenib inhibit mutant BRAF and are combined with MEK inhibitors (trametinib) to delay resistance. BRAF inhibitors can cause cutaneous squamous cell carcinomas through paradoxical activation of the pathway in wild-type cells. Checkpoint inhibitors (anti-PD-1, anti-CTLA-4) are also used for melanoma.","ko":"흑색종 BRAF V600E → vemurafenib/dabrafenib + MEK 억제제. 면역관문억제제도 사용."},{"id":"mk43","steps":["1"],"system":"MSK & Skin","discipline":"Pathology","topic":"Acanthosis nigricans","stem":"A 16-year-old girl with obesity and irregular periods has dark, velvety, thickened skin on the back of her neck and in her armpits. Fasting insulin is markedly elevated.\n\nWhich of the following best explains these skin changes?","options":["Deposition of iron in the dermis","Autoimmune destruction of melanocytes","Fungal infection of skin folds","High insulin stimulates keratinocyte and fibroblast growth through IGF-1 receptors","Melanocyte proliferation caused by ACTH"],"answer":3,"explanation":"Acanthosis nigricans causes hyperpigmented, velvety thickening of skin folds. It is most often associated with insulin resistance (obesity, type 2 diabetes, PCOS), where high insulin activates IGF-1 receptors on keratinocytes and fibroblasts. The darker color comes from thickened epidermis rather than increased melanin. Rapidly spreading acanthosis nigricans in a thin older adult suggests a visceral malignancy, especially gastric adenocarcinoma.","ko":"흑색극세포증: 인슐린 저항성(IGF-1 수용체 자극). 고령·급속 진행 시 위암 의심."},{"id":"mk44","steps":["1"],"system":"MSK & Skin","discipline":"Microbiology","topic":"Staphylococcal scalded skin syndrome","stem":"A 3-year-old boy has fever and widespread tender red skin. Within a day, large flaccid blisters form and the skin peels off in sheets with gentle pressure. His lips and mouth are not involved. A few days earlier he had a crusted lesion on his nose. Skin biopsy shows a split in the granular layer of the epidermis.\n\nThe toxin responsible targets which protein?","options":["BP180","Type VII collagen","Desmoglein 3","Keratin 14","Desmoglein 1"],"answer":4,"explanation":"Staphylococcal scalded skin syndrome is caused by exfoliative toxins from Staphylococcus aureus that cleave desmoglein 1, which is found in the superficial epidermis but not in mucosa. The split is high in the epidermis (granular layer), Nikolsky sign is positive, and mucous membranes are spared. It occurs in young children and adults with kidney failure, who cannot clear the toxin. Healing is without scarring. Toxic epidermal necrolysis splits at the dermal-epidermal junction and involves mucosa.","ko":"SSSS: 황색포도알균 표피박리 독소 → desmoglein 1 절단, 점막 침범 없음, Nikolsky(+)."},{"id":"mk45","steps":["1"],"system":"MSK & Skin","discipline":"Physiology","topic":"Excitation-contraction coupling","stem":"In skeletal muscle, depolarization of the T-tubule leads to calcium release from the sarcoplasmic reticulum, which allows actin and myosin to interact.\n\nWhich protein does calcium bind to start contraction in skeletal muscle?","options":["Myosin light-chain kinase","Calmodulin","Tropomyosin","Titin","Troponin C"],"answer":4,"explanation":"In skeletal muscle, depolarization of the T-tubule activates dihydropyridine receptors (voltage-gated L-type calcium channels) that are mechanically coupled to ryanodine receptors on the sarcoplasmic reticulum, releasing calcium. Calcium binds troponin C, moving tropomyosin off myosin-binding sites on actin so cross-bridges can form. In smooth muscle, calcium binds calmodulin, which activates myosin light-chain kinase. In cardiac muscle, calcium entry through L-type channels triggers calcium release from the SR.","ko":"골격근: Ca → 트로포닌 C → 트로포미오신 이동. 평활근: Ca → 칼모듈린 → MLCK."},{"id":"mk46","steps":["1"],"system":"MSK & Skin","discipline":"Physiology","topic":"Muscle fiber types","stem":"Biopsy of the soleus muscle of a marathon runner shows a high proportion of fibers that are red, rich in mitochondria and myoglobin, and resistant to fatigue.\n\nWhich of the following describes these fibers?","options":["Type I slow-twitch oxidative fibers","Type II fast-twitch glycolytic fibers","Fibers that rely mainly on anaerobic glycolysis","Fibers increased mainly by weight training","Fibers with few mitochondria and much glycogen"],"answer":0,"explanation":"Type I (slow-twitch) fibers are red because they are rich in myoglobin and mitochondria, use oxidative phosphorylation, and resist fatigue; they predominate in postural muscles and increase with endurance training. Type II (fast-twitch) fibers are white, rely on anaerobic glycolysis, contract quickly and powerfully, fatigue quickly, and enlarge with weight training. (Mnemonic: one slow red ox.)","ko":"1형(느린) = 적색·미토콘드리아·산화·지구력. 2형(빠른) = 백색·해당·근력 운동."},{"id":"ns01","steps":["1"],"system":"Nervous System","discipline":"Anatomy","topic":"Brown-Séquard syndrome","stem":"A 25-year-old man is stabbed in the back and has a hemisection of the spinal cord on the right side at the T10 level.\n\nWhich of the following sets of deficits below the level of the lesion is most likely?","options":["Bilateral loss of pain and temperature in a band at T10 only","Bilateral weakness with preserved sensation","Left-sided weakness and loss of vibration sense; right-sided loss of pain and temperature","Right-sided weakness and loss of vibration sense; left-sided loss of pain and temperature","Right-sided loss of all sensory modalities only"],"answer":3,"explanation":"In Brown-Séquard syndrome, the lateral corticospinal tract and dorsal columns cross in the medulla, so motor loss and loss of vibration and proprioception are ipsilateral below the lesion. The spinothalamic tract crosses within 1 to 2 segments of entry through the anterior white commissure, so pain and temperature are lost contralaterally, starting 1 to 2 levels below the lesion. There is also ipsilateral lower motor neuron weakness at the level of the lesion.","ko":"Brown-Séquard: 동측 운동·진동각 소실, 반대측 통각·온도각 소실."},{"id":"ns02","steps":["1"],"system":"Nervous System","discipline":"Anatomy","topic":"Syringomyelia","stem":"A 30-year-old woman burned her hands while cooking without feeling it. Examination shows loss of pain and temperature sensation over both shoulders and upper arms in a cape-like distribution, with preserved light touch and proprioception. MRI shows a fluid-filled cavity in the cervical spinal cord and downward displacement of the cerebellar tonsils.\n\nDamage to which of the following structures explains her sensory loss?","options":["Dorsal columns","Anterior horn cells","Lateral corticospinal tracts","Dorsal root ganglia","Anterior white commissure"],"answer":4,"explanation":"Syringomyelia is a cystic expansion of the central canal, often associated with Chiari I malformation. The expanding syrinx first damages crossing spinothalamic fibers in the anterior white commissure, causing bilateral loss of pain and temperature in a cape-like distribution while light touch and proprioception are preserved. As it enlarges, it can damage the anterior horns (lower motor neuron signs in the hands) and the lateral corticospinal tracts.","ko":"척수공동증: 전백색교련 손상 → 망토형 양측 통각·온도각 소실. Chiari I."},{"id":"ns03","steps":["1"],"system":"Nervous System","discipline":"Pathology","topic":"Subacute combined degeneration","stem":"A 64-year-old woman with a history of autoimmune gastritis has numbness and tingling in her feet and an unsteady gait that is worse in the dark. Examination shows decreased vibration and position sense in the legs, a positive Romberg sign, spasticity, and extensor plantar responses. Her MCV is 114 fL.\n\nWhich spinal cord tracts are most likely affected?","options":["Anterior horns only","Spinothalamic tracts only","Dorsal columns, lateral corticospinal tracts, and spinocerebellar tracts","Anterior spinal artery territory","Dorsal roots and dorsal columns only"],"answer":2,"explanation":"Vitamin B12 deficiency causes subacute combined degeneration, a demyelination of the dorsal columns (loss of vibration and proprioception, positive Romberg), lateral corticospinal tracts (spasticity, upper motor neuron signs), and spinocerebellar tracts (ataxia). B12 is needed for methylmalonyl-CoA mutase, and elevated methylmalonic acid may impair myelin synthesis. Pernicious anemia is a common cause. Tabes dorsalis affects only the dorsal columns and dorsal roots.","ko":"B12 결핍 = 아급성 연합변성 (후삭 + 외측 피질척수로 + 척수소뇌로)."},{"id":"ns04","steps":["1"],"system":"Nervous System","discipline":"Pharmacology","topic":"ALS and riluzole","stem":"A 56-year-old man has progressive weakness of his right hand and left leg over 8 months. Examination shows atrophy and fasciculations of the hand muscles together with hyperreflexia and extensor plantar responses. Sensation is normal. He is started on a medication that modestly prolongs survival.\n\nWhich of the following is the mechanism of this medication?","options":["Inhibition of acetylcholinesterase","Increased GABA-A receptor activity","Blockade of NMDA receptors on postsynaptic neurons","Dopamine receptor agonism","Decreased presynaptic release of glutamate"],"answer":4,"explanation":"Amyotrophic lateral sclerosis destroys both upper motor neurons (spasticity, hyperreflexia, Babinski sign) and lower motor neurons (atrophy, fasciculations), with sensation, bowel and bladder function, and eye movements spared. Some familial cases involve SOD1 mutations. Riluzole decreases presynaptic glutamate release, limiting excitotoxicity, and modestly prolongs survival. Memantine, an NMDA antagonist, is used in Alzheimer disease.","ko":"ALS: 상·하위 운동신경원 동시 손상, 감각 정상. Riluzole = 글루탐산 유리↓."},{"id":"ns05","steps":["1"],"system":"Nervous System","discipline":"Microbiology","topic":"Tabes dorsalis","stem":"A 58-year-old man has had shooting pains in his legs and difficulty walking in the dark for a year. He walks with a wide-based gait and slaps his feet down. Romberg sign is positive, vibration and position sense are absent in the feet, and the ankle reflexes are absent. Both pupils constrict when he focuses on a near object but do not react to light.\n\nWhich of the following is the most likely cause?","options":["Friedreich ataxia","Diabetic neuropathy","Vitamin B12 deficiency","Multiple sclerosis","Treponema pallidum infection"],"answer":4,"explanation":"Tabes dorsalis is a form of tertiary syphilis that degenerates the dorsal columns and dorsal roots, causing sensory ataxia, positive Romberg, lightning pains, absent reflexes, and Charcot joints. The Argyll Robertson pupil (accommodates but does not react to light, the prostitute's pupil) is characteristic. CSF VDRL is specific, and treatment is IV penicillin G.","ko":"척수로 = 3기 매독, 후삭·후근, Argyll Robertson 동공(조절 O, 대광반사 X)."},{"id":"ns06","steps":["1"],"system":"Nervous System","discipline":"Anatomy","topic":"Facial nerve palsy","stem":"A 34-year-old man wakes up unable to close his right eye or raise his right eyebrow. The right side of his mouth droops, and he has increased sensitivity to loud sounds in his right ear. Taste is reduced on the right anterior tongue.\n\nWhere is the lesion most likely located?","options":["Left facial motor nucleus","Right internal capsule","Right trigeminal nerve","Right facial nerve within the facial canal","Left precentral gyrus"],"answer":3,"explanation":"A lower motor neuron facial nerve lesion paralyzes the entire ipsilateral face, including the forehead. Hyperacusis (nerve to the stapedius) and loss of taste in the anterior two-thirds of the tongue (chorda tympani) place the lesion in the facial canal proximal to these branches, as in Bell palsy. An upper motor neuron lesion (cortex or internal capsule) causes contralateral lower facial weakness that spares the forehead, because the upper face receives input from both hemispheres.","ko":"말초 안면신경 마비 = 이마 포함 동측 전체. 중추성은 반대측 하부만(이마 보존)."},{"id":"ns07","steps":["1"],"system":"Nervous System","discipline":"Anatomy","topic":"Compressive oculomotor palsy","stem":"A 52-year-old woman has a sudden severe headache. Her left upper eyelid droops, and her left eye is deviated down and out. The left pupil is dilated and does not react to light.\n\nWhich of the following is the most likely cause?","options":["Compression of the trochlear nerve","Microvascular ischemia of the nerve from diabetes","Lesion of the medial longitudinal fasciculus","Aneurysm of the posterior communicating artery","Lesion of the sympathetic chain"],"answer":3,"explanation":"Oculomotor nerve palsy causes ptosis and a down-and-out eye. The parasympathetic fibers that constrict the pupil run on the outside of the nerve, so compression (classically by a posterior communicating artery aneurysm or uncal herniation) causes early pupil dilation. Diabetic microvascular ischemia damages the center of the nerve and usually spares the pupil. Horner syndrome causes mild ptosis with a small pupil.","ko":"CN III 마비 + 동공 산대 = 압박(후교통동맥류). 당뇨성은 동공 보존."},{"id":"ns08","steps":["1"],"system":"Nervous System","discipline":"Anatomy","topic":"Horner syndrome","stem":"A 60-year-old man who smokes has severe pain in his right shoulder that radiates down the inner arm, with weakness of the hand muscles. Examination shows mild right ptosis, a small right pupil, and absent sweating on the right side of his face. Chest x-ray shows a mass at the apex of the right lung.\n\nWhich of the following structures is compressed to cause his eye findings?","options":["Oculomotor nerve","Facial nerve","Edinger-Westphal nucleus","Cervical sympathetic chain","Optic nerve"],"answer":3,"explanation":"A Pancoast tumor at the lung apex can invade the cervical sympathetic chain (causing Horner syndrome: ptosis, miosis, and anhidrosis) and the lower brachial plexus (C8 to T1), causing shoulder and arm pain and weakness of the hand. The ptosis of Horner syndrome is mild because only the superior tarsal muscle is affected. Other causes include carotid dissection and lateral medullary infarction.","ko":"Horner(안검하수·축동·무한증) + 팔 통증 = Pancoast 종양 → 경부 교감신경."},{"id":"ns09","steps":["1"],"system":"Nervous System","discipline":"Anatomy","topic":"Lateral medullary syndrome","stem":"A 67-year-old man suddenly develops vertigo, nausea, hoarseness, and difficulty swallowing. Examination shows loss of pain and temperature on the left side of his face and the right side of his body, left-sided ataxia, and a left Horner syndrome. Strength is normal.\n\nOcclusion of which of the following arteries is most likely?","options":["Left anterior spinal artery","Left posterior inferior cerebellar artery","Left anterior inferior cerebellar artery","Right posterior cerebral artery","Basilar artery"],"answer":1,"explanation":"Lateral medullary (Wallenberg) syndrome is caused by occlusion of the posterior inferior cerebellar artery or vertebral artery. It damages the nucleus ambiguus (dysphagia and hoarseness, the most specific finding), the spinal trigeminal nucleus (ipsilateral facial pain and temperature loss), the spinothalamic tract (contralateral body pain and temperature loss), descending sympathetics (Horner), vestibular nuclei, and the inferior cerebellar peduncle. Motor tracts are medial and spared. Medial medullary syndrome (anterior spinal artery) causes contralateral weakness and tongue deviation.","ko":"Wallenberg(PICA): 연하곤란·쉰목소리(의문핵), 동측 얼굴·반대측 몸 통각 소실, Horner."},{"id":"ns10","steps":["1"],"system":"Nervous System","discipline":"Anatomy","topic":"Conduction aphasia","stem":"A 70-year-old man has a stroke. His speech is fluent, and he understands spoken and written language well. However, he cannot repeat the phrase 'no ifs, ands, or buts' and makes many sound substitutions when he tries.\n\nDamage to which of the following structures is most likely?","options":["Watershed areas surrounding the language areas","Arcuate fasciculus","Angular gyrus","Inferior frontal gyrus","Superior temporal gyrus"],"answer":1,"explanation":"Conduction aphasia results from damage to the arcuate fasciculus, which connects Wernicke area (comprehension) to Broca area (speech production). Speech is fluent and comprehension is intact, but repetition is poor. Broca aphasia (inferior frontal gyrus) causes nonfluent speech with good comprehension, and Wernicke aphasia (superior temporal gyrus) causes fluent but meaningless speech with poor comprehension. Transcortical aphasias spare repetition.","ko":"전도성 실어증 = 궁상다발 손상: 유창·이해 정상, 따라말하기만 장애."},{"id":"ns11","steps":["1"],"system":"Nervous System","discipline":"Pathology","topic":"Epidural hematoma","stem":"A 19-year-old man is hit in the side of the head with a baseball. He loses consciousness briefly, then wakes up and talks normally. Two hours later he becomes drowsy and his right pupil dilates. CT shows a biconvex, lens-shaped hyperdense collection over the right temporal lobe that does not cross suture lines.\n\nWhich of the following vessels is the most likely source of bleeding?","options":["Lenticulostriate arteries","Berry aneurysm of the circle of Willis","Superior sagittal sinus","Middle meningeal artery","Bridging veins"],"answer":3,"explanation":"Epidural hematoma usually results from a fracture of the temporal bone at the pterion that tears the middle meningeal artery, a branch of the maxillary artery. Arterial blood strips the dura from the skull, forming a biconvex collection limited by sutures. Patients often have a lucid interval before rapid deterioration and transtentorial herniation with CN III palsy. Subdural hematomas come from torn bridging veins and form crescent-shaped collections that cross sutures.","ko":"경막외 혈종: 중경막동맥, 렌즈형(봉합선 넘지 않음), lucid interval."},{"id":"ns12","steps":["1"],"system":"Nervous System","discipline":"Pathology","topic":"Subdural hematoma","stem":"An 82-year-old man with alcohol use disorder who takes warfarin is brought in because of 3 weeks of increasing confusion and headache. His family recalls that he fell several times last month. CT shows a crescent-shaped collection along the left cerebral convexity that crosses suture lines.\n\nWhich of the following is the most likely source of the bleeding?","options":["Arteriovenous malformation","Lenticulostriate arteries","Bridging veins between the cortex and dural sinuses","Middle meningeal artery","Ruptured berry aneurysm"],"answer":2,"explanation":"Subdural hematoma results from tearing of bridging veins that cross the subdural space. Brain atrophy in older adults and people with alcohol use disorder stretches these veins, and anticoagulation increases the risk. Bleeding is venous and slow, so symptoms such as confusion and headache can develop over days to weeks. The collection is crescent-shaped and crosses sutures but not the midline falx.","ko":"경막하 혈종: 교정맥 파열, 초승달 모양(봉합선 넘음), 노인·알코올·항응고제."},{"id":"ns13","steps":["1"],"system":"Nervous System","discipline":"Pharmacology","topic":"Nimodipine in subarachnoid hemorrhage","stem":"A 46-year-old woman develops the worst headache of her life while lifting a heavy box, followed by vomiting and neck stiffness. CT shows blood in the basal cisterns. Angiography shows an aneurysm of the anterior communicating artery, which is coiled.\n\nWhich of the following drugs is given to reduce the risk of delayed ischemic deficits from vasospasm?","options":["Tissue plasminogen activator","Nimodipine","Nitroprusside","Mannitol","Phenytoin"],"answer":1,"explanation":"Subarachnoid hemorrhage is most often caused by a ruptured saccular (berry) aneurysm, most commonly at the anterior communicating artery. Vasospasm typically occurs 3 to 10 days later and can cause delayed cerebral ischemia. Nimodipine, a dihydropyridine calcium channel blocker, improves neurologic outcomes. Other complications include rebleeding, hydrocephalus, and hyponatremia. Berry aneurysms are associated with ADPKD, Ehlers-Danlos syndrome, and Marfan syndrome.","ko":"지주막하출혈: 전교통동맥류, 3~10일 혈관연축 → nimodipine."},{"id":"ns14","steps":["1"],"system":"Nervous System","discipline":"Pharmacology","topic":"Carbidopa-levodopa","stem":"A 66-year-old man has a resting tremor of the right hand that disappears with movement, slow movements, cogwheel rigidity, and a shuffling gait. He is started on levodopa combined with carbidopa.\n\nWhich of the following is the purpose of carbidopa?","options":["It directly stimulates dopamine receptors","It inhibits monoamine oxidase B in the brain","It inhibits catechol-O-methyltransferase in the brain","It blocks muscarinic receptors to reduce tremor","It inhibits peripheral DOPA decarboxylase, increasing levodopa delivery to the brain"],"answer":4,"explanation":"Parkinson disease results from loss of dopaminergic neurons in the substantia nigra pars compacta, with Lewy bodies made of α-synuclein. Levodopa crosses the blood-brain barrier and is converted to dopamine. Carbidopa inhibits DOPA decarboxylase but does not cross the blood-brain barrier, so it prevents peripheral conversion of levodopa, increasing brain levels and reducing nausea and hypotension. Selegiline inhibits MAO-B, and entacapone inhibits COMT.","ko":"Carbidopa = 말초 DOPA decarboxylase 억제(BBB 통과 X) → 뇌 내 levodopa↑, 부작용↓."},{"id":"ns15","steps":["1"],"system":"Nervous System","discipline":"Pathology","topic":"Huntington disease","stem":"A 42-year-old man has irritability, depression, and involuntary jerky movements of his face and limbs that began a year ago. His father had similar symptoms beginning in his 50s, and his grandfather died in a psychiatric hospital. MRI shows atrophy of the caudate nuclei with enlarged frontal horns of the lateral ventricles.\n\nWhich of the following best explains the earlier onset in this patient compared with his father?","options":["Expansion of a CAG trinucleotide repeat during paternal transmission","A new point mutation in the patient","Incomplete penetrance","Genomic imprinting of the maternal allele","Mitochondrial heteroplasmy"],"answer":0,"explanation":"Huntington disease is an autosomal dominant expansion of CAG repeats in the huntingtin gene on chromosome 4. The repeats tend to expand when passed through the father's sperm, so the disease begins earlier and is more severe in later generations (anticipation). The caudate degenerates with loss of GABAergic neurons, causing chorea, behavioral changes, and dementia. Neurotransmitter changes are low GABA and ACh and relatively high dopamine; tetrabenazine reduces chorea.","ko":"헌팅턴: CAG 반복(4번), 부계 전달 시 anticipation, 미상핵 위축."},{"id":"ns16","steps":["1"],"system":"Nervous System","discipline":"Pharmacology","topic":"Alzheimer disease treatment","stem":"A 76-year-old woman has 2 years of progressive memory loss. She now repeats questions, gets lost in her neighborhood, and has trouble managing money. MRI shows diffuse cortical atrophy, most marked in the hippocampi. She is started on donepezil.\n\nWhich of the following best describes the rationale for this drug?","options":["It increases dopamine release in the striatum","It removes amyloid plaques from the brain","It inhibits tau phosphorylation","It blocks NMDA receptors to reduce excitotoxicity","It inhibits acetylcholinesterase to compensate for loss of cholinergic neurons"],"answer":4,"explanation":"Alzheimer disease features extracellular β-amyloid plaques and intracellular neurofibrillary tangles of hyperphosphorylated tau, with loss of cholinergic neurons in the nucleus basalis of Meynert. Acetylcholinesterase inhibitors (donepezil, rivastigmine, galantamine) increase acetylcholine. Memantine is an NMDA receptor antagonist. Risk factors include APOE ε4 and Down syndrome (APP on chromosome 21). Anti-amyloid monoclonal antibodies such as lecanemab are used in early disease.","ko":"알츠하이머: Meynert 기저핵 ACh 뉴런 소실 → donepezil(AChE 억제). Memantine = NMDA 길항."},{"id":"ns17","steps":["1"],"system":"Nervous System","discipline":"Biochemistry","topic":"Wernicke encephalopathy","stem":"A 50-year-old man with alcohol use disorder is brought to the emergency department confused and unable to walk steadily. Examination shows horizontal nystagmus and bilateral lateral rectus weakness. Glucose is 64 mg/dL. The physician gives IV thiamine before giving IV dextrose.\n\nThiamine is a cofactor for which of the following enzymes?","options":["Glucose-6-phosphate dehydrogenase","Glycogen phosphorylase","Methylmalonyl-CoA mutase","Pyruvate carboxylase","Pyruvate dehydrogenase"],"answer":4,"explanation":"Thiamine pyrophosphate is a cofactor for pyruvate dehydrogenase, α-ketoglutarate dehydrogenase, branched-chain α-ketoacid dehydrogenase, and transketolase. Without it, glucose cannot be used efficiently for energy, and giving glucose first can precipitate or worsen Wernicke encephalopathy (confusion, ophthalmoplegia, and ataxia), which damages the mammillary bodies and periaqueductal gray. Untreated, it can progress to Korsakoff syndrome with permanent amnesia and confabulation. Pyruvate carboxylase requires biotin, and methylmalonyl-CoA mutase requires B12.","ko":"티아민: PDH·α-KGDH·BCKDH·transketolase 보조인자. 포도당 전에 투여."},{"id":"ns18","steps":["1"],"system":"Nervous System","discipline":"Anatomy","topic":"Internuclear ophthalmoplegia","stem":"A 28-year-old woman has double vision. When she looks to the right, her left eye does not move past midline and her right eye has horizontal nystagmus. Convergence is normal. Two years ago she had an episode of painful vision loss in one eye that resolved. MRI shows periventricular white matter lesions.\n\nWhich structure is most likely affected to cause her eye findings?","options":["Right medial longitudinal fasciculus","Left paramedian pontine reticular formation","Left medial longitudinal fasciculus","Left abducens nucleus","Right oculomotor nerve"],"answer":2,"explanation":"Internuclear ophthalmoplegia is caused by a lesion of the medial longitudinal fasciculus, which connects the abducens nucleus on one side to the oculomotor nucleus on the other side for conjugate horizontal gaze. A left MLF lesion prevents the left eye from adducting on right gaze, while the right eye abducts with nystagmus; convergence is preserved because it does not use the MLF. Bilateral INO in a young adult strongly suggests multiple sclerosis, as do optic neuritis and periventricular lesions.","ko":"INO = 내측세로다발 손상: 동측 눈 내전 불가 + 반대 눈 안진. 젊은 성인이면 MS."},{"id":"ns19","steps":["1"],"system":"Nervous System","discipline":"Immunology","topic":"Guillain-Barré syndrome","stem":"A 33-year-old man has tingling in his feet followed by weakness that ascends to his thighs and arms over 5 days. Three weeks ago he had diarrhea after eating undercooked chicken. Deep tendon reflexes are absent.\n\nWhich of the following cerebrospinal fluid findings is most likely?","options":["Xanthochromia with many red cells","Elevated protein with a normal cell count","Elevated neutrophils with low glucose","Oligoclonal bands with mildly elevated lymphocytes","Elevated lymphocytes with normal protein"],"answer":1,"explanation":"Guillain-Barré syndrome (acute inflammatory demyelinating polyneuropathy) is an autoimmune attack on peripheral nerve myelin, often after Campylobacter jejuni infection, through molecular mimicry. It causes ascending symmetric weakness with areflexia and can involve respiratory muscles and autonomic nerves. CSF shows albuminocytologic dissociation: high protein with a normal cell count. Treatment is IV immune globulin or plasmapheresis, with monitoring of vital capacity.","ko":"GBS: Campylobacter 후 상행성 마비, 반사 소실, CSF 단백↑·세포수 정상."},{"id":"ns20","steps":["1"],"system":"Nervous System","discipline":"Pharmacology","topic":"Myasthenia gravis treatment","stem":"A 34-year-old woman has drooping eyelids and double vision that worsen in the evening, along with difficulty chewing at the end of meals. Serum antibodies against the acetylcholine receptor are positive. Chest CT shows an anterior mediastinal mass.\n\nThe first-line symptomatic drug for her condition works by which of the following mechanisms?","options":["Blocking muscarinic receptors","Directly stimulating nicotinic receptors","Suppressing B-cell production of antibodies","Inhibiting acetylcholinesterase","Increasing presynaptic acetylcholine release"],"answer":3,"explanation":"Myasthenia gravis is caused by autoantibodies against postsynaptic nicotinic acetylcholine receptors (type II hypersensitivity). Weakness worsens with use and often affects ocular and bulbar muscles. It is associated with thymoma and thymic hyperplasia. Pyridostigmine, an acetylcholinesterase inhibitor, increases acetylcholine at the junction. Immunosuppressants and thymectomy treat the underlying disease. Lambert-Eaton syndrome, in contrast, improves with use.","ko":"중증근무력증: 시냅스후 AChR 항체, 사용 시 악화, 흉선종. 치료 pyridostigmine."},{"id":"ns21","steps":["1"],"system":"Nervous System","discipline":"Microbiology","topic":"Meningococcal meningitis","stem":"An 18-year-old college freshman living in a dormitory develops fever, headache, neck stiffness, and a rapidly spreading purpuric rash on his legs. CSF shows 2,500 white cells/mm³ (90% neutrophils), glucose 20 mg/dL, and protein 220 mg/dL. Gram stain shows gram-negative diplococci.\n\nWhich of the following is the most appropriate prophylaxis for his roommate?","options":["No prophylaxis is needed","Isoniazid for 9 months","Pneumococcal vaccine","Oral vancomycin","Rifampin, ciprofloxacin, or ceftriaxone"],"answer":4,"explanation":"Neisseria meningitidis is a gram-negative diplococcus that ferments maltose and has a polysaccharide capsule. It spreads by respiratory droplets in crowded settings and causes meningitis and meningococcemia with petechial or purpuric rash, DIC, and adrenal hemorrhage (Waterhouse-Friderichsen syndrome). Bacterial meningitis CSF shows neutrophils, low glucose, and high protein. Close contacts receive rifampin, ciprofloxacin, or ceftriaxone. People with terminal complement deficiencies are prone to recurrent Neisseria infections.","ko":"수막구균: 그람음성 쌍구균, 자반, 밀접접촉자 예방 rifampin/cipro/ceftriaxone."},{"id":"ns22","steps":["1"],"system":"Nervous System","discipline":"Pathology","topic":"Glioblastoma","stem":"A 62-year-old man has headaches, personality change, and a seizure. MRI shows a large, ring-enhancing mass in the right frontal lobe that crosses the corpus callosum into the left hemisphere. Biopsy shows highly pleomorphic astrocytes that are GFAP-positive, with areas of necrosis surrounded by palisading tumor cells and prominent vascular proliferation.\n\nWhich of the following is the most likely diagnosis?","options":["Metastatic carcinoma","Primary CNS lymphoma","Oligodendroglioma","Glioblastoma","Meningioma"],"answer":3,"explanation":"Glioblastoma is the most common primary malignant brain tumor in adults and has a very poor prognosis. It is an astrocytic tumor (GFAP-positive) that often crosses the corpus callosum (butterfly glioma), with pseudopalisading necrosis and endothelial proliferation. Meningiomas are extra-axial, dural-based tumors with psammoma bodies, and oligodendrogliomas have fried-egg cells and calcifications. Metastases are the most common brain tumors overall, typically at the gray-white junction.","ko":"교모세포종: 뇌량 침범(나비 모양), 가성울타리 괴사, GFAP(+)."},{"id":"ns23","steps":["1"],"system":"Nervous System","discipline":"Pathology","topic":"Pilocytic astrocytoma","stem":"An 8-year-old boy has morning headaches, vomiting, and clumsiness. MRI shows a well-circumscribed cystic mass in the right cerebellar hemisphere with an enhancing mural nodule. Histology shows GFAP-positive spindle cells with hairlike processes and eosinophilic corkscrew-shaped fibers.\n\nWhich of the following is the most likely diagnosis?","options":["Ependymoma","Medulloblastoma","Craniopharyngioma","Hemangioblastoma","Pilocytic astrocytoma"],"answer":4,"explanation":"Pilocytic astrocytoma is the most common primary brain tumor in children. It is a low-grade, well-circumscribed, cystic tumor, usually in the posterior fossa, with a good prognosis after resection. Rosenthal fibers (eosinophilic corkscrew fibers) are characteristic. Medulloblastoma is a malignant small round blue cell tumor of the cerebellar vermis with Homer Wright rosettes, and ependymoma usually arises in the fourth ventricle with perivascular pseudorosettes.","ko":"소아 소뇌 낭성 종양 + 벽결절 + Rosenthal fiber = 모양세포성 성상세포종."},{"id":"ns24","steps":["1"],"system":"Nervous System","discipline":"Anatomy","topic":"Neurotransmitter sources","stem":"A researcher studies the brain nuclei that produce various neurotransmitters. She identifies a group of midline nuclei in the brainstem that are the main source of a neurotransmitter targeted by fluoxetine.\n\nWhich of the following nuclei is she studying?","options":["Raphe nuclei","Ventral tegmental area","Nucleus basalis of Meynert","Nucleus accumbens","Locus ceruleus"],"answer":0,"explanation":"Serotonin is made mainly in the raphe nuclei of the brainstem; SSRIs such as fluoxetine increase serotonin. Norepinephrine is made in the locus ceruleus (pons), which is involved in anxiety and arousal. Acetylcholine comes from the nucleus basalis of Meynert, and dopamine from the ventral tegmental area and substantia nigra. GABA is made by the nucleus accumbens. In depression, serotonin, norepinephrine, and dopamine are decreased.","ko":"세로토닌 = 봉선핵, NE = 청반, ACh = Meynert 기저핵, DA = VTA·흑질."},{"id":"ns25","steps":["1"],"system":"Nervous System","discipline":"Pathology","topic":"Normal pressure hydrocephalus","stem":"A 74-year-old man has had worsening forgetfulness and urinary incontinence over 6 months. He walks with a slow, wide-based gait, and his feet seem stuck to the floor. CT shows enlarged ventricles out of proportion to sulcal widening. Lumbar puncture shows a normal opening pressure, and his gait improves the next day.\n\nWhich of the following is the most likely diagnosis?","options":["Alzheimer disease","Creutzfeldt-Jakob disease","Normal pressure hydrocephalus","Parkinson disease","Vascular dementia"],"answer":2,"explanation":"Normal pressure hydrocephalus is a communicating hydrocephalus thought to result from decreased CSF absorption. Ventricular enlargement stretches the corona radiata fibers near the ventricles, causing the triad of urinary incontinence, magnetic gait, and dementia (wet, wobbly, and wacky). It is one of the reversible causes of dementia: improvement after removal of CSF predicts a good response to a ventriculoperitoneal shunt.","ko":"NPH: 요실금·자석 보행·치매, 뇌실 확장, 요추천자 후 호전 → VP 션트."},{"id":"ns26","steps":["1"],"system":"Nervous System","discipline":"Pharmacology","topic":"Acute angle-closure glaucoma","stem":"A 65-year-old woman receives eye drops to dilate her pupils for a retinal examination. That evening she has severe pain in her right eye, headache, nausea, and blurred vision with halos around lights. The eye is red, the cornea is cloudy, and the pupil is fixed in mid-dilation. The eye feels rock-hard on palpation.\n\nWhich of the following best explains why the eye drops caused this condition?","options":["The drops caused contraction of the ciliary muscle","The drops increased aqueous humor production by the ciliary body","Pupil dilation pushed the iris against the trabecular meshwork, blocking aqueous outflow","The drops caused bleeding into the anterior chamber","The drops constricted the episcleral veins"],"answer":2,"explanation":"In eyes with a shallow anterior chamber, mydriatics (anticholinergics such as tropicamide, or α-agonists) dilate the pupil, so the peripheral iris folds against the trabecular meshwork and blocks the drainage of aqueous humor. Intraocular pressure rises sharply, causing a painful red eye, a cloudy cornea, and a mid-dilated nonreactive pupil. This is an emergency treated with drugs that lower pressure and constrict the pupil (such as pilocarpine), followed by laser iridotomy.","ko":"급성 폐쇄각 녹내장: 산동 → 홍채가 섬유주 막음. 응급, pilocarpine·홍채절개."},{"id":"ns27","steps":["1"],"system":"Nervous System","discipline":"Physiology","topic":"Weber and Rinne tests","stem":"A 40-year-old woman has decreased hearing in her left ear. With the Weber test, the sound is louder in her left ear. With the Rinne test on the left, bone conduction is heard longer than air conduction; on the right, air conduction is heard longer than bone conduction.\n\nWhich of the following is the most likely type of hearing loss?","options":["Conductive hearing loss in the left ear","Normal hearing","Sensorineural hearing loss in the left ear","Conductive hearing loss in the right ear","Sensorineural hearing loss in the right ear"],"answer":0,"explanation":"In conductive hearing loss, bone conduction is better than air conduction (abnormal Rinne) on the affected side, and the Weber test lateralizes to the affected ear because ambient noise is masked there. In sensorineural hearing loss, air conduction remains better than bone conduction (normal Rinne), and the Weber test lateralizes to the unaffected ear. Causes of conductive loss include cerumen, otitis media, and otosclerosis.","ko":"전음성 난청: Rinne 골전도>기전도, Weber는 환측으로. 감각신경성은 건측으로."},{"id":"ns28","steps":["1"],"system":"Nervous System","discipline":"Pharmacology","topic":"Local anesthetics in infected tissue","stem":"A 30-year-old man needs drainage of a large abscess on his thigh. The surgeon injects lidocaine into the area, but the anesthesia is poor, and more drug is needed than usual.\n\nWhich of the following best explains the reduced effect of lidocaine?","options":["The abscess contains more sodium channels in the open state","Lidocaine is inactivated by bacterial β-lactamases","The acidic tissue increases the ionized form of the drug, which cannot cross nerve membranes","Inflammation increases blood flow, which has no effect on drug action","Bacteria degrade lidocaine with esterases"],"answer":2,"explanation":"Local anesthetics are weak bases that must cross the nerve membrane in their uncharged form, then bind sodium channels from inside the cell in their charged form. In acidic infected tissue, more of the drug is ionized, so less reaches the inside of the nerve, and more drug is needed. Epinephrine is added in many settings to cause vasoconstriction and prolong the effect. Small myelinated fibers are blocked first, and pain is lost before touch and pressure.","ko":"국소마취제: 산성(감염) 조직에서 이온화↑ → 막 통과↓ → 효과↓."},{"id":"ns29","steps":["1"],"system":"Nervous System","discipline":"Pharmacology","topic":"Malignant hyperthermia","stem":"A 22-year-old man undergoes an appendectomy under general anesthesia with sevoflurane and succinylcholine. Thirty minutes later, his end-tidal CO2 rises sharply, his muscles become rigid, his temperature reaches 41°C (105.8°F), and he develops tachycardia and hyperkalemia. His uncle died during surgery years ago.\n\nWhich of the following drugs should be given immediately?","options":["Dantrolene","Naloxone","Bromocriptine","Neostigmine","Cyproheptadine"],"answer":0,"explanation":"Malignant hyperthermia is an inherited (autosomal dominant) disorder, usually from mutations in the ryanodine receptor (RYR1), in which inhaled anesthetics or succinylcholine trigger uncontrolled calcium release from the sarcoplasmic reticulum. Sustained muscle contraction causes hypercarbia, rigidity, hyperthermia, rhabdomyolysis, and hyperkalemia. Dantrolene blocks the ryanodine receptor and stops calcium release. Bromocriptine is used for neuroleptic malignant syndrome and cyproheptadine for serotonin syndrome.","ko":"악성 고열 = RYR1, 흡입마취제·succinylcholine 유발 → dantrolene."},{"id":"ns30","steps":["1"],"system":"Nervous System","discipline":"Pharmacology","topic":"Phenytoin adverse effects","stem":"A 30-year-old woman with a seizure disorder has gum overgrowth that covers part of her teeth, increased facial hair, and a lack of coordination. Examination shows horizontal nystagmus. Her antiepileptic dose was recently increased, and the drug level rose disproportionately.\n\nWhich of the following is the mechanism of action of the drug she is most likely taking?","options":["Increasing the frequency of GABA-A chloride channel opening","Blocking voltage-gated sodium channels in the inactivated state","Blocking T-type calcium channels in the thalamus","Inhibiting GABA transaminase","Binding synaptic vesicle protein SV2A"],"answer":1,"explanation":"Phenytoin blocks voltage-gated sodium channels by stabilizing their inactivated state, limiting high-frequency firing. It has zero-order kinetics at therapeutic levels, so small dose increases can raise levels sharply, causing nystagmus, diplopia, and ataxia. Chronic effects include gingival hyperplasia, hirsutism, megaloblastic anemia, and osteomalacia. It is a teratogen (fetal hydantoin syndrome), a CYP inducer, and can cause Stevens-Johnson syndrome. Ethosuximide blocks T-type calcium channels, and levetiracetam binds SV2A.","ko":"Phenytoin: Na 채널 불활성 상태 안정화, 0차 동역학, 치은증식·다모증·안진."},{"id":"ns31","steps":["1"],"system":"Nervous System","discipline":"Pharmacology","topic":"Absence seizures","stem":"A 7-year-old girl has episodes several times a day in which she stares blankly for about 10 seconds, with eyelid fluttering, then resumes what she was doing without any confusion. Hyperventilation in the office triggers an episode. EEG shows generalized 3-Hz spike-and-wave discharges.\n\nThe first-line drug for this condition acts mainly by blocking which of the following?","options":["Carbonic anhydrase","Voltage-gated sodium channels","NMDA glutamate receptors","GABA reuptake transporters","T-type calcium channels in thalamic neurons"],"answer":4,"explanation":"Absence seizures are generalized seizures in children with brief staring spells, no postictal state, and 3-Hz spike-and-wave discharges triggered by hyperventilation. Ethosuximide blocks T-type calcium channels in thalamic neurons that drive the thalamocortical rhythm and is first-line for absence seizures alone. Valproate is also effective and covers generalized tonic-clonic seizures, but it is teratogenic (neural tube defects) and hepatotoxic. Carbamazepine can worsen absence seizures.","ko":"소발작(3Hz 극서파) → ethosuximide (시상 T형 Ca 채널 차단)."},{"id":"ns32","steps":["1"],"system":"Nervous System","discipline":"Anatomy","topic":"Neural tube defect screening","stem":"A 26-year-old woman at 16 weeks' gestation has maternal serum α-fetoprotein that is 3.5 times the median. Amniocentesis shows elevated α-fetoprotein and acetylcholinesterase in the amniotic fluid. She did not take any vitamins before or during early pregnancy.\n\nWhich of the following is the most likely fetal abnormality?","options":["Down syndrome","Turner syndrome","Trisomy 18","Spina bifida occulta","Open neural tube defect"],"answer":4,"explanation":"Open neural tube defects (myelomeningocele, anencephaly) result from failure of the neural tube to close by week 4. Fetal AFP and acetylcholinesterase leak into the amniotic fluid and maternal serum. Spina bifida occulta is covered by skin and does not raise AFP. Folic acid before conception and in early pregnancy reduces the risk, and valproate and carbamazepine increase it. Down syndrome lowers AFP.","ko":"모체 AFP↑ + 양수 AChE↑ = 개방성 신경관 결손. 엽산으로 예방."},{"id":"ns33","steps":["1"],"system":"Nervous System","discipline":"Anatomy","topic":"Anterior spinal artery syndrome","stem":"A 68-year-old man undergoes repair of a thoracoabdominal aortic aneurysm. When he wakes, he cannot move his legs, and he has lost pain and temperature sensation below the umbilicus. Vibration and position sense in his legs are normal. He has urinary retention.\n\nOcclusion of which artery is most likely?","options":["Posterior inferior cerebellar artery","Anterior spinal artery","Posterior spinal arteries","Anterior cerebral artery","Middle cerebral artery"],"answer":1,"explanation":"The anterior spinal artery supplies the anterior two-thirds of the spinal cord, including the corticospinal tracts, spinothalamic tracts, and anterior horns. Infarction causes bilateral paralysis and loss of pain and temperature below the lesion, with preserved dorsal column functions (vibration and proprioception). It is a complication of aortic surgery or dissection affecting the artery of Adamkiewicz, which supplies the lower thoracic and lumbar cord.","ko":"전척수동맥 경색: 양측 마비 + 통각·온도각 소실, 후삭(진동·위치감각) 보존. 대동맥 수술."},{"id":"ns34","steps":["1"],"system":"Nervous System","discipline":"Anatomy","topic":"Cerebellar lesions","stem":"A 60-year-old man with alcohol use disorder walks with a wide-based, unsteady gait and sways when he sits without support. Finger-to-nose and heel-to-shin tests are nearly normal.\n\nWhich part of the cerebellum is most likely affected?","options":["Dentate nucleus","Left cerebellar hemisphere","Flocculonodular lobe only","Vermis","Right cerebellar hemisphere"],"answer":3,"explanation":"The cerebellar vermis controls axial and proximal muscles, so lesions cause truncal ataxia and a wide-based gait; chronic alcohol use classically causes degeneration of the anterior vermis. Lesions of a cerebellar hemisphere cause ipsilateral limb ataxia, dysmetria, intention tremor, and dysdiadochokinesia, because cerebellar output crosses twice. Flocculonodular lesions cause nystagmus and vestibular imbalance.","ko":"충부(vermis) 병변 → 몸통 실조·넓은 보폭(알코올). 반구 병변 → 동측 사지 실조."},{"id":"ns35","steps":["1"],"system":"Nervous System","discipline":"Anatomy","topic":"Hemiballismus","stem":"A 70-year-old woman with hypertension and diabetes suddenly develops violent, flinging movements of her left arm and leg that she cannot control. MRI shows a small lacunar infarct.\n\nWhere is the infarct most likely located?","options":["Right subthalamic nucleus","Left subthalamic nucleus","Right substantia nigra","Right caudate nucleus","Left putamen"],"answer":0,"explanation":"Hemiballismus is a sudden, wild, flinging movement of one side of the body caused by a lesion of the contralateral subthalamic nucleus, often a lacunar stroke. The subthalamic nucleus is part of the indirect pathway; its loss reduces inhibition of the thalamus and increases movement. Caudate degeneration causes chorea (Huntington disease), and substantia nigra loss causes parkinsonism.","ko":"편측무도증(hemiballismus) = 반대측 시상하핵 병변(열공성 경색)."},{"id":"ns36","steps":["1"],"system":"Nervous System","discipline":"Anatomy","topic":"Thalamic pain syndrome","stem":"A 66-year-old woman had a small stroke 3 months ago that caused numbness of the entire left side of her body and face. She now has severe burning pain on the same side, triggered by light touch from clothing.\n\nWhere was the stroke most likely located?","options":["Right pons","Right postcentral gyrus","Right ventral posterior nuclei of the thalamus","Left lateral medulla","Right internal capsule, posterior limb"],"answer":2,"explanation":"The ventral posterolateral nucleus relays sensation from the body, and the ventral posteromedial nucleus relays sensation from the face. A lacunar infarct here causes contralateral hemisensory loss of all modalities. Weeks to months later, some patients develop thalamic pain syndrome (Dejerine-Roussy), with severe burning pain and allodynia on the affected side. Other thalamic nuclei include the LGN (vision), MGN (hearing), and VL (motor).","ko":"시상 VPL/VPM 경색 → 반대측 전체 감각 소실 → 이후 Dejerine-Roussy 시상 통증."},{"id":"ns37","steps":["1"],"system":"Nervous System","discipline":"Anatomy","topic":"Meyer loop lesion","stem":"A 45-year-old man has seizures and an MRI that shows a mass in the left temporal lobe. Visual field testing shows loss of the upper right quadrant in both eyes.\n\nWhich structure is affected?","options":["Left optic nerve","Optic chiasm","Left occipital cortex above the calcarine fissure","Right parietal optic radiation","Left Meyer loop of the optic radiation"],"answer":4,"explanation":"Fibers carrying information from the inferior retina (upper visual field) loop through the temporal lobe (Meyer loop), so a temporal lesion causes a contralateral superior quadrantanopia (pie in the sky). Parietal optic radiation fibers carry the lower field, so parietal lesions cause contralateral inferior quadrantanopia (pie on the floor). Chiasm lesions cause bitemporal hemianopia, and occipital strokes cause contralateral homonymous hemianopia with macular sparing (PCA).","ko":"측두엽 Meyer loop → 반대측 상사분맹(pie in the sky). 두정엽 → 하사분맹."},{"id":"ns38","steps":["1"],"system":"Nervous System","discipline":"Anatomy","topic":"Uncal herniation","stem":"A 30-year-old man with an expanding right epidural hematoma becomes stuporous. His right pupil is dilated and unreactive. He has weakness on the right side of his body, the same side as the hematoma.\n\nWhich of the following explains the right-sided weakness?","options":["Compression of the left cerebral peduncle against the tentorium","Compression of the right cerebral peduncle by the uncus","Infarction of the right posterior cerebral artery territory","Compression of the medulla","Damage to the right motor cortex by the hematoma"],"answer":0,"explanation":"In uncal (transtentorial) herniation, the medial temporal lobe is pushed under the tentorium, compressing the ipsilateral CN III (dilated pupil, then ptosis and down-and-out eye) and the contralateral cerebral peduncle against the tentorial edge (Kernohan notch), which causes weakness on the same side as the lesion, a false localizing sign. It can also compress the posterior cerebral artery. Tonsillar herniation compresses the medulla and causes respiratory arrest.","ko":"구상회 탈출: 동측 CN III(산동) + 반대측 대뇌각 압박(Kernohan notch) → 동측 편마비."},{"id":"ns39","steps":["1"],"system":"Nervous System","discipline":"Anatomy","topic":"Aqueductal stenosis","stem":"A 2-month-old boy has a rapidly enlarging head, a bulging anterior fontanelle, and downward deviation of his eyes. MRI shows markedly dilated lateral and third ventricles with a normal-sized fourth ventricle.\n\nWhere is the obstruction most likely located?","options":["Choroid plexus overproduction","Arachnoid granulations","Foramen of Monro on one side","Cerebral aqueduct","Foramina of Luschka and Magendie"],"answer":3,"explanation":"CSF flows from the lateral ventricles through the foramina of Monro to the third ventricle, then through the cerebral aqueduct to the fourth ventricle, and out through the foramina of Luschka and Magendie to the subarachnoid space, where it is absorbed by arachnoid granulations. Dilation of the lateral and third ventricles with a normal fourth ventricle means a blockage at the aqueduct, a noncommunicating hydrocephalus. Downward gaze (sunset eyes) results from pressure on the tectum.","ko":"측뇌실·3뇌실 확장 + 4뇌실 정상 = 중뇌수도 협착(비교통성 수두증)."},{"id":"ns40","steps":["1"],"system":"Nervous System","discipline":"Pharmacology","topic":"Triptans","stem":"A 34-year-old woman has recurrent unilateral throbbing headaches with nausea and light sensitivity that last a day. She takes sumatriptan at the onset of each attack. Her physician asks about any history of chest pain.\n\nWhy is this history important?","options":["Triptans cause bradycardia through vagal stimulation","Triptans cause QT prolongation","Triptans cause hyperkalemia","Triptans increase LDL cholesterol","Triptans cause coronary vasoconstriction through 5-HT1B receptors"],"answer":4,"explanation":"Triptans are 5-HT1B and 5-HT1D agonists that constrict cranial vessels and inhibit release of vasoactive peptides such as CGRP from trigeminal nerves, aborting migraine attacks. They can cause coronary vasospasm, so they are contraindicated in coronary artery disease, Prinzmetal angina, and uncontrolled hypertension. Combining them with SSRIs can rarely cause serotonin syndrome. Gepants and lasmiditan are alternatives for patients with vascular disease.","ko":"Triptan = 5-HT1B/1D 작용제, 관상동맥 수축 → CAD·Prinzmetal 협심증 금기."},{"id":"ns41","steps":["1"],"system":"Nervous System","discipline":"Pathology","topic":"Cluster headache","stem":"A 35-year-old man who smokes has attacks of excruciating pain behind his left eye that last 45 minutes and occur at the same time each night for several weeks. During attacks, his left eye tears and turns red, his left nostril runs, and he has left ptosis and miosis. He paces the room during attacks.\n\nWhich of the following is the most effective acute treatment?","options":["Oral acetaminophen","Propranolol","Amitriptyline","Carbamazepine","High-flow 100% oxygen"],"answer":4,"explanation":"Cluster headache causes severe, unilateral periorbital pain lasting 15 minutes to 3 hours, in clusters of daily attacks often at the same time, with ipsilateral autonomic features (lacrimation, rhinorrhea, conjunctival injection, and Horner syndrome). It is more common in men, and patients are restless. Acute treatment is 100% oxygen or subcutaneous sumatriptan, and verapamil is used for prevention.","ko":"군발두통: 남성, 편측 안와 통증 15분~3시간, 동측 자율신경 증상·Horner → 100% 산소·triptan, 예방 verapamil."},{"id":"ns42","steps":["1"],"system":"Nervous System","discipline":"Pharmacology","topic":"Carbamazepine for trigeminal neuralgia","stem":"A 62-year-old woman has brief, electric shock-like pains in her right cheek and jaw triggered by chewing or touching her face. Neurologic examination is normal.\n\nThe first-line drug for this condition requires which of the following before treatment in patients of Asian ancestry?","options":["HLA-B*15:02 testing","HLA-B27 testing","HLA-B*57:01 testing","G6PD testing","TPMT activity testing"],"answer":0,"explanation":"Trigeminal neuralgia causes paroxysms of severe stabbing pain in V2 or V3 distributions, often from compression of the trigeminal root by a blood vessel. Carbamazepine, a sodium channel blocker, is first-line. People with HLA-B*15:02, common in some Asian populations, have a high risk of Stevens-Johnson syndrome and toxic epidermal necrolysis, so they are tested first. Carbamazepine also causes agranulocytosis and aplastic anemia, SIADH, CYP induction, and teratogenicity.","ko":"삼차신경통 → carbamazepine. 아시아인 HLA-B*15:02 검사(SJS). 무과립구증·SIADH·CYP 유도."},{"id":"ns43","steps":["1"],"system":"Nervous System","discipline":"Pharmacology","topic":"Buprenorphine precipitated withdrawal","stem":"A 30-year-old man with opioid use disorder last used heroin 4 hours ago. He is given his first dose of sublingual buprenorphine. Within 30 minutes he has severe yawning, sweating, abdominal cramps, diarrhea, and dilated pupils.\n\nWhich property of buprenorphine explains this reaction?","options":["It is a pure μ antagonist","It is a κ receptor agonist that causes dysphoria","It is a high-affinity partial agonist that displaces full agonists from μ receptors","It is a full μ agonist with a short half-life","It is an NMDA receptor antagonist"],"answer":2,"explanation":"Buprenorphine is a partial μ-opioid agonist with very high receptor affinity. When given while a full agonist such as heroin is still bound, it displaces the full agonist but produces less effect, precipitating withdrawal. Treatment is therefore started once mild withdrawal has begun. Its ceiling effect on respiratory depression makes it safer than methadone, a full agonist that can prolong QT. Naltrexone is a long-acting antagonist used after detoxification.","ko":"Buprenorphine = 고친화도 부분 작용제 → 완전 작용제 대체 시 금단 유발. 경미한 금단 후 시작."},{"id":"ns44","steps":["1"],"system":"Nervous System","discipline":"Pharmacology","topic":"Inhaled anesthetic solubility","stem":"Two inhaled anesthetics have different blood/gas partition coefficients. Drug A has a coefficient of 0.47, and drug B has a coefficient of 2.4.\n\nWhich statement is correct?","options":["Drug B has faster induction because it dissolves more in blood","Drug B has a lower minimum alveolar concentration","Both drugs have the same rate of induction","Drug A has faster induction and recovery than drug B","Drug A is more potent because of its low solubility"],"answer":3,"explanation":"Inhaled anesthetics with low blood solubility (low blood/gas partition coefficient), such as nitrous oxide and desflurane, quickly saturate the blood, so partial pressure in the brain rises fast, giving rapid induction and recovery. Highly soluble agents take longer. Potency is related to lipid solubility (oil/gas coefficient) and is inversely related to the minimum alveolar concentration (MAC), not to blood solubility.","ko":"혈액/기체 분배계수 낮을수록 유도·회복 빠름(N2O). 역가 ∝ 지용성 ∝ 1/MAC."},{"id":"ns45","steps":["1"],"system":"Nervous System","discipline":"Pharmacology","topic":"Ketamine","stem":"A 25-year-old man with severe burns needs dressing changes. He is given an IV anesthetic that keeps his blood pressure stable, preserves his breathing, and provides strong pain relief. During recovery he has vivid, frightening dreams and hallucinations.\n\nWhich receptor does this anesthetic mainly block?","options":["D2 dopamine receptors","Nicotinic acetylcholine receptors","μ-Opioid receptors","NMDA glutamate receptors","GABA-A receptors"],"answer":3,"explanation":"Ketamine is an NMDA receptor antagonist that produces dissociative anesthesia with strong analgesia. It increases sympathetic output, maintaining or raising blood pressure and heart rate, preserves airway reflexes and breathing, and causes bronchodilation, which makes it useful in trauma and asthma. Emergence reactions with hallucinations are common, especially in adults. It is also used for treatment-resistant depression. Propofol acts on GABA-A receptors and lowers blood pressure.","ko":"Ketamine = NMDA 길항, 해리성 마취·강한 진통, 혈압 유지, 각성 시 환각."},{"id":"ns46","steps":["1"],"system":"Nervous System","discipline":"Pharmacology","topic":"Valproate in women","stem":"A 24-year-old woman with juvenile myoclonic epilepsy wants to become pregnant within the year. She currently has well-controlled seizures on valproate.\n\nWhy should her medication be changed before conception if possible?","options":["Valproate causes fetal hypothyroidism","Valproate causes neural tube defects and lowers IQ in exposed children","Valproate causes Ebstein anomaly","Valproate is ineffective during pregnancy","Valproate causes cleft lip only when combined with folate"],"answer":1,"explanation":"Valproate is highly teratogenic, causing neural tube defects (spina bifida), heart defects, and lower IQ and higher risk of autism in children exposed in utero. It inhibits folate metabolism, and high-dose folic acid is recommended for women of childbearing age on antiepileptics. Other adverse effects include hepatotoxicity, pancreatitis, weight gain, tremor, and hair loss. Lamotrigine and levetiracetam are safer alternatives in pregnancy.","ko":"Valproate: 신경관 결손·IQ 저하 → 가임기 여성 회피. 간독성·췌장염. 대안 lamotrigine·levetiracetam."},{"id":"ns47","steps":["1"],"system":"Nervous System","discipline":"Genetics","topic":"Spinal muscular atrophy","stem":"A 4-month-old girl is floppy and cannot hold up her head. She has weak cry and difficulty feeding, with a bell-shaped chest. Her tongue shows fasciculations, and deep tendon reflexes are absent. She smiles and tracks faces normally.\n\nDegeneration of which cells causes her weakness?","options":["Upper motor neurons in the cortex","Muscle fibers through dystrophin loss","Dorsal root ganglion neurons","Anterior horn motor neurons","Schwann cells"],"answer":3,"explanation":"Spinal muscular atrophy is an autosomal recessive disease caused by deletion of SMN1, which reduces survival motor neuron protein and causes degeneration of anterior horn cells and brainstem motor nuclei. It causes symmetric proximal weakness, hypotonia (floppy baby), areflexia, and tongue fasciculations with normal cognition. Severe forms cause respiratory failure in infancy. Treatments include nusinersen (an antisense oligonucleotide that changes SMN2 splicing) and gene therapy.","ko":"척수성 근위축증: SMN1 결실, 전각세포 소실, 혀 섬유속연축, 인지 정상 → nusinersen·유전자치료."},{"id":"ns48","steps":["1"],"system":"Nervous System","discipline":"Genetics","topic":"Friedreich ataxia","stem":"A 13-year-old boy has progressive clumsiness, frequent falls, and slurred speech. Examination shows absent ankle reflexes, loss of vibration and position sense, extensor plantar responses, high-arched feet, and scoliosis. ECG shows left ventricular hypertrophy.\n\nWhich of the following is the most likely genetic mechanism?","options":["SMN1 deletion","CGG repeat expansion in FMR1","CAG repeat expansion in huntingtin","GAA repeat expansion in the frataxin gene","Point mutation in SOD1"],"answer":3,"explanation":"Friedreich ataxia is an autosomal recessive GAA trinucleotide repeat expansion in the frataxin gene (FXN), which impairs iron handling in mitochondria. It causes degeneration of the spinocerebellar tracts, dorsal columns, and corticospinal tracts, producing gait ataxia, loss of position sense, areflexia with Babinski signs, and dysarthria. Hypertrophic cardiomyopathy is the most common cause of death. Pes cavus, scoliosis, and diabetes are associated.","ko":"Friedreich 실조: GAA 반복(frataxin, AR), 실조·반사 소실·Babinski, 비대성 심근병증이 사인."},{"id":"ns49","steps":["1"],"system":"Nervous System","discipline":"Genetics","topic":"Neurofibromatosis type 1","stem":"A 9-year-old girl has more than 10 light brown, flat skin lesions larger than 5 mm, freckling in her armpits, and several soft skin nodules. Slit-lamp examination shows pigmented nodules on the iris. Her father has similar skin findings.\n\nThe protein encoded by the mutated gene normally does which of the following?","options":["Promotes degradation of β-catenin","Inhibits mTOR signaling","Inactivates RAS by stimulating its GTPase activity","Binds E2F to block the cell cycle","Targets HIF for degradation"],"answer":2,"explanation":"Neurofibromatosis type 1 is an autosomal dominant mutation of NF1 on chromosome 17, encoding neurofibromin, a RAS GTPase-activating protein that turns RAS off. Features include café-au-lait macules, axillary freckling, cutaneous and plexiform neurofibromas, Lisch nodules (iris hamartomas), optic gliomas, and bone lesions, with increased risk of pheochromocytoma and malignant peripheral nerve sheath tumors. NF2 (merlin, chromosome 22) causes bilateral vestibular schwannomas.","ko":"NF1: 뉴로피브로민(RAS GAP, 17번), 카페오레반점·액와 주근깨·Lisch 결절·신경섬유종."},{"id":"ns50","steps":["1"],"system":"Nervous System","discipline":"Genetics","topic":"Tuberous sclerosis","stem":"A 6-year-old boy has seizures and intellectual disability. He has hypopigmented leaf-shaped patches on his trunk, red papules across his nose and cheeks, and a leathery patch of skin on his lower back. Echocardiography shows a cardiac mass, and MRI shows cortical tubers.\n\nWhich of the following drugs targets the pathway that is overactive in this disease?","options":["Vemurafenib","Imatinib","Rituximab","Everolimus","Trastuzumab"],"answer":3,"explanation":"Tuberous sclerosis complex is an autosomal dominant mutation in TSC1 (hamartin) or TSC2 (tuberin), which normally inhibit mTOR. It causes hamartomas in many organs: cortical tubers and subependymal giant cell astrocytomas (seizures, intellectual disability), ash-leaf spots, angiofibromas, shagreen patches, cardiac rhabdomyomas, and renal angiomyolipomas. mTOR inhibitors such as everolimus shrink the tumors.","ko":"결절성 경화증: TSC1/2 → mTOR 과활성, 엽상백반·혈관섬유종·심장 횡문근종·신장 혈관근지방종 → everolimus."},{"id":"ns51","steps":["1"],"system":"Nervous System","discipline":"Pathology","topic":"Sturge-Weber syndrome","stem":"A 2-year-old girl has had seizures since infancy and weakness of her right arm. She has had a flat, dark red birthmark over her left forehead and upper eyelid since birth. Intraocular pressure in her left eye is elevated. Skull imaging shows tram-track calcifications in the left occipital and parietal cortex.\n\nWhich of the following is the most likely cause?","options":["Trinucleotide repeat expansion","Germline mutation of TSC2","Germline mutation of VHL","Somatic activating mutation of GNAQ","Germline mutation of NF1"],"answer":3,"explanation":"Sturge-Weber syndrome is a sporadic, somatic (mosaic) activating mutation of GNAQ that affects small vessels derived from neural crest. It causes a port-wine stain in the V1 distribution, ipsilateral leptomeningeal angiomas with tram-track calcifications, seizures, hemiparesis, intellectual disability, and glaucoma. It is not inherited.","ko":"Sturge-Weber: GNAQ 체세포 변이, V1 포도주색 반점 + 연수막 혈관종(tram-track 석회화) + 녹내장."},{"id":"ns52","steps":["1"],"system":"Nervous System","discipline":"Pathology","topic":"Vestibular schwannoma","stem":"A 50-year-old woman has gradual hearing loss and ringing in her right ear, unsteadiness, and recently numbness of her right cheek. MRI shows an enhancing mass at the right cerebellopontine angle extending into the internal auditory canal.\n\nThis tumor arises from which cell type?","options":["Arachnoid cap cells","Ependymal cells","Neurons of the spiral ganglion","Schwann cells of the vestibular portion of CN VIII","Astrocytes"],"answer":3,"explanation":"Vestibular schwannoma (acoustic neuroma) is a benign tumor of Schwann cells, usually from the vestibular portion of CN VIII at the cerebellopontine angle. It causes unilateral sensorineural hearing loss, tinnitus, and imbalance, and larger tumors compress CN V and VII. Histology shows Antoni A areas with Verocay bodies and Antoni B areas, and the cells are S-100-positive. Bilateral vestibular schwannomas are diagnostic of NF2.","ko":"전정신경초종: 소뇌교각, 편측 감각신경성 난청·이명, S-100(+), 양측이면 NF2."},{"id":"ns53","steps":["1"],"system":"Nervous System","discipline":"Pathology","topic":"Meningioma","stem":"A 58-year-old woman has headaches and a seizure. MRI shows a well-circumscribed, extra-axial, dural-based mass over the left frontal convexity with a tail of dural enhancement. Histology shows whorled clusters of cells and laminated calcifications.\n\nWhich of the following is the most likely diagnosis?","options":["Ependymoma","Metastatic carcinoma","Oligodendroglioma","Meningioma","Glioblastoma"],"answer":3,"explanation":"Meningioma is the most common primary brain tumor overall and is more common in women; it can express progesterone receptors. It arises from arachnoid cap cells, is extra-axial and dural-based with a dural tail, and compresses rather than invades the brain. Histology shows whorls and psammoma bodies. Most are benign and treated with resection. Risk factors include prior radiation and NF2.","ko":"수막종: 여성, 경막 기반 + dural tail, 소용돌이 배열·psammoma body, 거미막 모자세포 기원."},{"id":"ns54","steps":["1"],"system":"Nervous System","discipline":"Pathology","topic":"Amaurosis fugax","stem":"A 70-year-old man had an episode of painless loss of vision in his right eye that was like a shade being pulled down and lasted 5 minutes. A bruit is heard over the right side of his neck.\n\nWhich of the following is the most likely source of this episode?","options":["Retinal detachment","Right occipital lobe infarct","Optic neuritis","Left atrial thrombus from atrial fibrillation","Atherosclerotic plaque in the right internal carotid artery"],"answer":4,"explanation":"Amaurosis fugax is transient monocular vision loss caused by emboli to the ophthalmic or retinal arteries, usually from atherosclerotic plaque at the bifurcation of the ipsilateral internal carotid artery. It is a form of TIA and signals a high risk of stroke. Funduscopy may show cholesterol emboli (Hollenhorst plaques). Carotid imaging is needed, and endarterectomy is considered for significant symptomatic stenosis.","ko":"일과성 흑암시 = 동측 내경동맥 죽상판 색전(Hollenhorst plaque), TIA → 경동맥 영상."},{"id":"ns55","steps":["1"],"system":"Nervous System","discipline":"Anatomy","topic":"Relative afferent pupillary defect","stem":"A 26-year-old woman has painful blurring of vision in her left eye that worsens with eye movement. When a light is swung from her right eye to her left eye, both pupils dilate. When the light is shined in the right eye, both pupils constrict.\n\nWhich of the following is the most likely location of the lesion?","options":["Left Edinger-Westphal nucleus","Right optic nerve","Left optic nerve","Left oculomotor nerve","Optic chiasm"],"answer":2,"explanation":"In a relative afferent pupillary defect (Marcus Gunn pupil), light in the affected eye produces a weaker pupillary response in both eyes because of damage to the afferent limb (optic nerve), so both pupils dilate when the light is swung to that eye. The efferent limb (CN III parasympathetics) is intact. Optic neuritis, with painful vision loss and red desaturation, is often the first sign of multiple sclerosis.","ko":"상대적 구심성 동공결손(Marcus Gunn) = 시신경 병변, 시신경염 → MS 첫 증상일 수 있음."},{"id":"ns56","steps":["1"],"system":"Nervous System","discipline":"Pathology","topic":"Ménière disease","stem":"A 45-year-old woman has recurrent episodes of severe vertigo lasting several hours, with nausea, a sensation of fullness and roaring in her left ear, and fluctuating hearing loss. Between episodes she is well, but her low-frequency hearing in the left ear has gradually worsened.\n\nWhich of the following best explains her condition?","options":["Displaced otoliths in the posterior semicircular canal","A tumor of Schwann cells on CN VIII","Increased volume of endolymph in the inner ear","Inflammation of the vestibular nerve after a virus","Ischemia of the labyrinthine artery"],"answer":2,"explanation":"Ménière disease is caused by endolymphatic hydrops, an increase in endolymph volume. It causes the triad of episodic vertigo lasting hours, fluctuating sensorineural hearing loss (low frequencies first), and tinnitus or aural fullness. Benign paroxysmal positional vertigo is brief vertigo triggered by head movement from displaced otoliths, diagnosed with the Dix-Hallpike test. Vestibular neuritis causes days of continuous vertigo without hearing loss.","ko":"Ménière: 내림프 수종, 수시간 현훈 + 변동성 저음 난청 + 이명·이충만감. BPPV는 수초~1분."},{"id":"ns57","steps":["1"],"system":"Nervous System","discipline":"Pathology","topic":"Dementia with Lewy bodies","stem":"A 72-year-old man has fluctuating attention and alertness, vivid visual hallucinations of children in his house, and mild parkinsonism that began around the same time as his cognitive decline. He acts out his dreams at night. After a dose of haloperidol for agitation, he becomes severely rigid and confused.\n\nWhich of the following is the most likely diagnosis?","options":["Alzheimer disease","Parkinson disease without dementia","Vascular dementia","Frontotemporal dementia","Dementia with Lewy bodies"],"answer":4,"explanation":"Dementia with Lewy bodies features fluctuating cognition, recurrent visual hallucinations, REM sleep behavior disorder, and parkinsonism that begins within a year of the dementia (if dementia develops more than a year after parkinsonism, it is Parkinson disease dementia). Patients are very sensitive to antipsychotics, which can cause severe rigidity or neuroleptic malignant syndrome. Cortical Lewy bodies contain α-synuclein. Cholinesterase inhibitors help.","ko":"루이소체 치매: 인지 변동 + 환시 + REM 수면행동장애 + 파킨슨증(1년 이내), 항정신병약 과민."},{"id":"ns58","steps":["1"],"system":"Nervous System","discipline":"Pathology","topic":"Frontotemporal dementia","stem":"A 56-year-old man has become socially inappropriate over 2 years, making crude comments to strangers, overeating sweets, and neglecting his family, while his memory remains relatively intact. MRI shows marked atrophy of the frontal and anterior temporal lobes.\n\nWhich of the following inclusions might be found in the neurons of affected cortex?","options":["Negri bodies","Round silver-staining tau inclusions (Pick bodies)","Lewy bodies made of α-synuclein","Hirano bodies only in the cerebellum","Neurofibrillary tangles with amyloid plaques throughout the hippocampus"],"answer":1,"explanation":"Frontotemporal dementia typically begins before 65 with prominent personality and behavior changes (disinhibition, apathy, hyperorality, compulsive behaviors) or language problems, with relatively spared memory early. It causes frontal and temporal atrophy. Inclusions may contain tau (Pick bodies) or TDP-43. Alzheimer disease, in contrast, starts with memory loss and has amyloid plaques and tangles.","ko":"전두측두엽 치매: 이른 나이 성격·행동 변화(탈억제), 기억 비교적 보존, Pick body(tau)·TDP-43."},{"id":"ph01","steps":["1"],"system":"General Principles","discipline":"Pharmacology","topic":"Phenylephrine reflex bradycardia","stem":"A 30-year-old healthy volunteer receives an IV infusion of phenylephrine. Mean arterial pressure rises from 90 to 115 mm Hg.\n\nWhich change in heart rate is expected, and why?","options":["Decreased, because of direct M2 receptor stimulation","Decreased, because of a baroreceptor-mediated increase in vagal tone","Increased, because of reflex sympathetic activation","Unchanged, because phenylephrine does not affect the heart","Increased, because of direct β1 stimulation"],"answer":1,"explanation":"Phenylephrine is a selective α1 agonist that constricts arterioles and raises blood pressure without direct cardiac effects. The higher pressure stretches the carotid and aortic baroreceptors, increasing vagal outflow and lowering heart rate (reflex bradycardia). Norepinephrine also causes reflex bradycardia because its α1 effect dominates. Isoproterenol, a β agonist, causes tachycardia and lowers diastolic pressure.","ko":"Phenylephrine(α1) → 혈압↑ → 압수용체 반사 → 심박수↓."},{"id":"ph02","steps":["1"],"system":"General Principles","discipline":"Pharmacology","topic":"Isoproterenol hemodynamics","stem":"An IV drug given to a healthy volunteer raises heart rate from 70 to 115/min. Systolic pressure rises slightly, diastolic pressure falls, and mean arterial pressure falls slightly.\n\nWhich drug was most likely given?","options":["Clonidine","Isoproterenol","Norepinephrine","Phenylephrine","Epinephrine at high dose"],"answer":1,"explanation":"Isoproterenol stimulates β1 and β2 receptors equally. β1 stimulation increases heart rate and contractility, raising systolic pressure, while β2 stimulation dilates skeletal muscle arterioles, lowering diastolic and mean pressure and widening pulse pressure. Norepinephrine and high-dose epinephrine raise mean pressure through α1 vasoconstriction. Clonidine lowers heart rate and blood pressure.","ko":"Isoproterenol(β1+β2): 심박수↑, 이완기압↓, 맥압↑."},{"id":"ph03","steps":["1"],"system":"General Principles","discipline":"Pharmacology","topic":"Dobutamine","stem":"A 66-year-old man with a large anterior myocardial infarction has cool extremities, a blood pressure of 88/60 mm Hg, a cardiac index of 1.6 L/min/m², and a PCWP of 28 mm Hg. An infusion is started to increase myocardial contractility.\n\nWhich receptor does the most appropriate drug mainly stimulate?","options":["β1-adrenergic","β2-adrenergic","α1-adrenergic","D1 dopamine","V1 vasopressin"],"answer":0,"explanation":"Dobutamine is a β1-selective agonist that increases contractility more than heart rate and is used in cardiogenic shock and acute decompensated heart failure with low output. Milrinone, a PDE3 inhibitor, has similar inotropic and vasodilating effects. Norepinephrine is added when hypotension is severe. Pure α1 agonists raise afterload and can worsen output in a
