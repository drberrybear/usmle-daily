failing ventricle.","ko":"Dobutamine = β1 작용제, 심인성 쇼크 수축력↑. Milrinone = PDE3 억제."},{"id":"ph04","steps":["1"],"system":"General Principles","discipline":"Pharmacology","topic":"Bethanechol","stem":"A 64-year-old woman cannot void 12 hours after hip surgery. Bladder scan shows 800 mL of urine. There is no mechanical obstruction. A drug is given that stimulates detrusor contraction and is resistant to acetylcholinesterase.\n\nWhich drug was given?","options":["Oxybutynin","Neostigmine","Atropine","Bethanechol","Tamsulosin"],"answer":3,"explanation":"Bethanechol is a muscarinic agonist that is not degraded by acetylcholinesterase. It stimulates M3 receptors in the detrusor and gut, treating postoperative and neurogenic urinary retention and ileus. Oxybutynin is an M3 antagonist used for overactive bladder. Neostigmine is an acetylcholinesterase inhibitor that also treats retention but acts indirectly.","ko":"Bethanechol = AChE 저항성 무스카린 작용제 → 수술 후 요저류·장마비."},{"id":"ph05","steps":["1"],"system":"General Principles","discipline":"Pharmacology","topic":"Overactive bladder","stem":"A 72-year-old woman has a sudden, intense urge to urinate many times a day and sometimes leaks before reaching the bathroom. Urinalysis is normal. She is concerned about medications that may worsen her memory.\n\nWhich drug relaxes the detrusor without anticholinergic effects?","options":["Bethanechol","Mirabegron","Desmopressin","Oxybutynin","Tolterodine"],"answer":1,"explanation":"Urge incontinence is caused by detrusor overactivity. Antimuscarinics such as oxybutynin and tolterodine block M3 receptors but cause dry mouth, constipation, and confusion, which is a particular concern in older adults. Mirabegron is a β3 agonist that relaxes the detrusor and avoids anticholinergic effects but can raise blood pressure. Bethanechol would worsen urgency.","ko":"절박성 요실금: 항무스카린(oxybutynin) 또는 β3 작용제 mirabegron(노인 인지 부작용 없음)."},{"id":"ph06","steps":["1"],"system":"General Principles","discipline":"Pharmacology","topic":"Neostigmine with glycopyrrolate","stem":"At the end of surgery, a patient who received rocuronium is given neostigmine to reverse residual neuromuscular blockade. Glycopyrrolate is given at the same time.\n\nWhat is the purpose of glycopyrrolate?","options":["To prevent malignant hyperthermia","To block muscarinic effects such as bradycardia and secretions caused by neostigmine","To stimulate respiratory drive","To increase acetylcholine release at the neuromuscular junction","To directly reverse the binding of rocuronium"],"answer":1,"explanation":"Neostigmine inhibits acetylcholinesterase, increasing acetylcholine at the neuromuscular junction to compete with nondepolarizing blockers. It also increases acetylcholine at muscarinic receptors, causing bradycardia, bronchospasm, and secretions, so an antimuscarinic (glycopyrrolate or atropine) is given with it. Sugammadex reverses rocuronium and vecuronium directly by encapsulating them.","ko":"Neostigmine로 비탈분극 근이완 역전 시 glycopyrrolate 병용(무스카린 부작용 차단). Sugammadex = 직접 포획."},{"id":"ph07","steps":["1"],"system":"General Principles","discipline":"Pharmacology","topic":"Succinylcholine hyperkalemia","stem":"A 30-year-old man with 40% body surface area burns from 10 days ago needs emergency intubation. The resident plans rapid-sequence intubation with succinylcholine, but the attending chooses rocuronium instead.\n\nWhat is the main reason to avoid succinylcholine in this patient?","options":["Risk of malignant hyperthermia, which burns increase","Risk of histamine release and bronchospasm","Risk of severe hyperkalemia from upregulated extrajunctional acetylcholine receptors","Risk of prolonged apnea from pseudocholinesterase deficiency","Inability to reverse succinylcholine with neostigmine"],"answer":2,"explanation":"Succinylcholine is a depolarizing neuromuscular blocker that binds nicotinic receptors and causes sustained depolarization (phase I, with fasciculations). After burns, crush injuries, denervation, or prolonged immobilization, extrajunctional acetylcholine receptors proliferate, and succinylcholine can release enough potassium to cause cardiac arrest. Pseudocholinesterase deficiency prolongs its effect. It can also trigger malignant hyperthermia in susceptible people.","ko":"화상·압궤·탈신경 후 succinylcholine 금기 → 접합부 외 AChR 증가로 치명적 고칼륨."},{"id":"ph08","steps":["1"],"system":"General Principles","discipline":"Pharmacology","topic":"β-blocker and hypoglycemia awareness","stem":"A 58-year-old man with type 1 diabetes mellitus is started on propranolol for performance anxiety. A month later he is found confused with a blood glucose of 35 mg/dL. He says that before, he always felt shaky and his heart pounded when his sugar was low, but this time he only noticed sweating.\n\nWhy was sweating preserved?","options":["Sweat glands are activated by β2 receptors that propranolol does not block","Propranolol stimulates sweat glands directly","Hypoglycemia stimulates sweat glands through glucagon","Sweat glands are activated by sympathetic cholinergic fibers acting on muscarinic receptors","Sweating is caused by histamine release"],"answer":3,"explanation":"Nonselective β-blockers blunt adrenergic warning signs of hypoglycemia (tremor and palpitations) and can delay recovery by inhibiting glycogenolysis. Sweating is preserved because eccrine sweat glands are innervated by sympathetic fibers that release acetylcholine onto muscarinic receptors. Nonselective β-blockers are also avoided in asthma. Selective β1-blockers have less effect on hypoglycemia awareness.","ko":"β차단제 → 저혈당 경고 증상(떨림·두근거림) 은폐. 땀은 교감 콜린성(무스카린)이라 남음."},{"id":"ph09","steps":["1"],"system":"General Principles","discipline":"Pharmacology","topic":"Prazosin","stem":"A 34-year-old veteran with PTSD has recurrent nightmares that wake him. He is started on a medication at bedtime and is warned that he may feel lightheaded or faint when standing up, especially after the first dose.\n\nWhich of the following is the mechanism of this drug?","options":["Selective α1-adrenergic antagonism","β1-adrenergic antagonism","Serotonin reuptake inhibition","α2-adrenergic agonism","Histamine H1 antagonism"],"answer":0,"explanation":"Prazosin is a selective α1 antagonist used for nightmares in PTSD, hypertension, and urinary symptoms of BPH. Its main adverse effect is first-dose orthostatic hypotension and syncope, so it is started at a low dose at bedtime. Tamsulosin is selective for α1A receptors in the prostate and causes less hypotension.","ko":"Prazosin(α1 차단): PTSD 악몽, 첫 투여 기립성 저혈압·실신."},{"id":"ph10","steps":["1"],"system":"General Principles","discipline":"Pharmacology","topic":"Glaucoma drugs","stem":"A 62-year-old man with open-angle glaucoma is prescribed eye drops. After several months, the iris of his treated eye has become darker brown, and his eyelashes are longer.\n\nWhich of the following drugs is he using, and how does it lower intraocular pressure?","options":["Acetazolamide; decreases aqueous humor production","Brimonidine; decreases aqueous humor production","Latanoprost; increases uveoscleral outflow of aqueous humor","Pilocarpine; contracts the ciliary muscle to open the trabecular meshwork","Timolol; decreases aqueous humor production"],"answer":2,"explanation":"Latanoprost is a prostaglandin F2α analog that increases uveoscleral outflow and is first-line for open-angle glaucoma; it darkens the iris and lengthens eyelashes. β-Blockers (timolol), α2 agonists (brimonidine), and carbonic anhydrase inhibitors decrease aqueous production. Cholinomimetics such as pilocarpine increase trabecular outflow and constrict the pupil, which is useful in acute angle-closure glaucoma.","ko":"Latanoprost(PGF2α) = 포도막공막 유출↑, 홍채 갈색화·속눈썹 증가. Timolol = 방수 생성↓."},{"id":"ph11","steps":["1"],"system":"General Principles","discipline":"Pharmacology","topic":"Amphetamine mechanism","stem":"A 20-year-old college student takes a stimulant that is not prescribed to him before exams. He becomes anxious and tachycardic with dilated pupils.\n\nAmphetamine increases synaptic norepinephrine and dopamine mainly by which of the following mechanisms?","options":["Blocking presynaptic α2 receptors","Directly stimulating postsynaptic adrenergic receptors","Reversing monoamine transporters and displacing transmitters from vesicles","Inhibiting monoamine oxidase only","Blocking monoamine reuptake without causing release"],"answer":2,"explanation":"Amphetamines enter neurons through monoamine transporters, displace norepinephrine and dopamine from vesicles through VMAT, and reverse the transporters to release transmitters into the synapse. Cocaine and methylphenidate mainly block reuptake. Reserpine does the opposite of amphetamine, depleting vesicular stores by blocking VMAT. Amphetamines are used for ADHD and narcolepsy.","ko":"Amphetamine = 수송체 역전 → NE·DA 방출. Cocaine = 재흡수 차단. Reserpine = VMAT 차단 고갈."},{"id":"ph12","steps":["1"],"system":"General Principles","discipline":"Pharmacology","topic":"Methanol poisoning","stem":"A 45-year-old man is brought to the emergency department 18 hours after drinking homemade liquor. He reports blurry vision, like being in a snowstorm. Arterial pH is 7.08 with an anion gap of 30 and an elevated serum osmolal gap.\n\nWhich of the following is the mechanism of the antidote of choice?","options":["Inhibition of alcohol dehydrogenase","Replenishment of glutathione","Reactivation of acetylcholinesterase","Inhibition of aldehyde dehydrogenase","Chelation of the toxin"],"answer":0,"explanation":"Methanol is converted by alcohol dehydrogenase to formaldehyde and then to formic acid, which causes anion gap metabolic acidosis and damages the optic nerve and retina. Ethylene glycol is metabolized to glycolic and oxalic acids, causing AKI with calcium oxalate crystals. For both, fomepizole inhibits alcohol dehydrogenase to stop formation of toxic metabolites; hemodialysis is used in severe cases. Disulfiram inhibits aldehyde dehydrogenase.","ko":"메탄올(시력 손상)·에틸렌글리콜(옥살산 결정·AKI) → fomepizole(알코올 탈수소효소 억제)."},{"id":"ph13","steps":["1"],"system":"General Principles","discipline":"Pharmacology","topic":"Iron overdose","stem":"A 2-year-old girl is brought to the emergency department 2 hours after swallowing many of her mother's prenatal vitamins. She has vomiting, bloody diarrhea, and abdominal pain. Abdominal x-ray shows radiopaque pills in the stomach.\n\nWhich of the following is the most appropriate antidote?","options":["Dimercaprol","Deferoxamine","Activated charcoal","Penicillamine","N-acetylcysteine"],"answer":1,"explanation":"Iron poisoning is a leading cause of fatal poisoning in young children. Free iron causes oxidative injury and cell death, first with hemorrhagic GI injury, then a latent phase, then shock, metabolic acidosis, and hepatic failure, and later gastric outlet scarring. Iron tablets are radiopaque. Deferoxamine chelates iron and is given IV for severe toxicity. Activated charcoal does not bind iron.","ko":"철 중독: 혈성 위장관 증상, 방사선 불투과 알약 → deferoxamine (활성탄 무효)."},{"id":"ph14","steps":["1"],"system":"General Principles","discipline":"Pharmacology","topic":"Cyanide poisoning","stem":"A 40-year-old man is rescued from a house fire. He is confused and hypotensive, with a respiratory rate of 30/min. Arterial PaO2 is normal, but the venous blood appears bright red, and lactate is 14 mmol/L.\n\nThe toxin most likely responsible inhibits which of the following?","options":["NADH dehydrogenase (complex I)","Pyruvate dehydrogenase","Hemoglobin oxygen binding","Cytochrome c oxidase (complex IV)","ATP synthase (complex V)"],"answer":3,"explanation":"Cyanide from burning plastics, or from nitroprusside infusions, inhibits cytochrome c oxidase in complex IV, so cells cannot use oxygen. Aerobic metabolism stops, causing severe lactic acidosis, and venous blood stays oxygenated (bright red, with a small arteriovenous oxygen difference). Treatment is hydroxocobalamin, which binds cyanide to form cyanocobalamin. Carbon monoxide also inhibits complex IV but mainly reduces oxygen carrying capacity.","ko":"시안화물: complex IV(cytochrome c oxidase) 억제, 정맥혈 선홍색, 젖산↑ → hydroxocobalamin."},{"id":"ph15","steps":["1"],"system":"General Principles","discipline":"Pharmacology","topic":"Methemoglobinemia","stem":"A 25-year-old woman develops headache, shortness of breath, and cyanosis shortly after a dental procedure using benzocaine spray. Pulse oximetry reads 85% and does not improve with supplemental oxygen, although arterial PaO2 is 210 mm Hg. Her blood looks chocolate-brown.\n\nWhich of the following is the most appropriate treatment?","options":["Fomepizole","Hydroxocobalamin","Sodium bicarbonate","Methylene blue","Hyperbaric oxygen"],"answer":3,"explanation":"Methemoglobinemia occurs when oxidant drugs such as benzocaine, lidocaine, dapsone, nitrites, and primaquine oxidize hemoglobin iron from Fe2+ to Fe3+, which cannot carry oxygen and shifts the curve left. Pulse oximetry reads about 85% regardless of the true saturation, PaO2 is normal, and blood is chocolate-colored. Methylene blue reduces methemoglobin back to hemoglobin through NADPH-methemoglobin reductase; it is ineffective and can cause hemolysis in G6PD deficiency, in which case ascorbic acid is used.","ko":"메트헤모글로빈혈증: 벤조카인·답손·질산염, 초콜릿색 혈액, SpO2 85% 고정 → methylene blue."},{"id":"ph16","steps":["1"],"system":"General Principles","discipline":"Pharmacology","topic":"Salicylate toxicity","stem":"A 30-year-old woman ingests a large amount of aspirin. She has tinnitus, vomiting, and rapid breathing. Arterial blood gas shows pH 7.42, PaCO2 22 mm Hg, and HCO3− 14 mEq/L, with an anion gap of 22.\n\nWhich of the following treatments increases elimination of the drug?","options":["IV ammonium chloride to acidify the urine","IV sodium bicarbonate to alkalinize the urine","N-acetylcysteine","Flumazenil","Naloxone"],"answer":1,"explanation":"Salicylates stimulate the respiratory center, causing early respiratory alkalosis, and uncouple oxidative phosphorylation, causing an anion gap metabolic acidosis; the mixed disorder can produce a near-normal pH. Tinnitus is an early sign. Salicylate is a weak acid, so alkalinizing the urine with sodium bicarbonate traps it in its ionized form in the tubule and increases excretion (ion trapping); it also reduces entry into the brain. Hemodialysis is used for severe toxicity.","ko":"아스피린 중독: 호흡성 알칼리증 + AG 대사성 산증, 이명 → 중탄산나트륨(소변 알칼리화, 이온 포획)."},{"id":"ph17","steps":["1"],"system":"General Principles","discipline":"Pharmacology","topic":"Drug interaction with grapefruit/CYP3A4","stem":"A 62-year-old man taking simvastatin is prescribed clarithromycin for pneumonia. Five days later he has diffuse muscle pain and dark urine, and creatine kinase is 25,000 U/L.\n\nWhich of the following best explains this reaction?","options":["Clarithromycin induces CYP3A4, producing a toxic simvastatin metabolite","Clarithromycin displaces simvastatin from albumin","Clarithromycin decreases renal excretion of simvastatin","Clarithromycin directly damages skeletal muscle","Clarithromycin inhibits CYP3A4, increasing simvastatin levels"],"answer":4,"explanation":"Simvastatin, lovastatin, and atorvastatin are metabolized by CYP3A4. Strong CYP3A4 inhibitors such as clarithromycin, erythromycin, azole antifungals, HIV protease inhibitors, and grapefruit juice raise statin levels and can cause rhabdomyolysis. Azithromycin does not inhibit CYP3A4 significantly. Rosuvastatin and pravastatin are less dependent on CYP3A4.","ko":"Clarithromycin·azole·PI·자몽 = CYP3A4 억제 → simvastatin↑ → 횡문근융해. Azithromycin은 안전."},{"id":"ph18","steps":["1"],"system":"General Principles","discipline":"Pharmacology","topic":"Therapeutic index","stem":"A new drug has an ED50 of 10 mg/kg and an LD50 of 30 mg/kg in animal studies. Another drug has an ED50 of 5 mg/kg and an LD50 of 500 mg/kg.\n\nWhich statement is correct?","options":["Both drugs have the same safety margin","The second drug has a narrower therapeutic index","The first drug has a narrower therapeutic index and requires closer monitoring","The therapeutic index cannot be calculated from these values","The first drug is more potent"],"answer":2,"explanation":"The therapeutic index is TD50 (or LD50) divided by ED50. The first drug has an index of 30/10 = 3, and the second has 500/5 = 100, so the first has a much narrower safety margin. Drugs with a low therapeutic index, such as warfarin, digoxin, lithium, theophylline, and aminoglycosides, require monitoring of drug levels. The second drug is more potent because it has a lower ED50.","ko":"치료지수 = TD50/ED50. 낮을수록 위험(와파린·디곡신·리튬·테오필린). ED50 낮을수록 역가↑."},{"id":"ph19","steps":["1"],"system":"General Principles","discipline":"Pharmacology","topic":"Volume of distribution and loading dose","stem":"A patient needs a target plasma concentration of 2 mg/L of a drug with a volume of distribution of 40 L and complete bioavailability.\n\nWhat loading dose is required?","options":["20 mg","40 mg","80 mg","160 mg","200 mg"],"answer":2,"explanation":"Loading dose = target plasma concentration × volume of distribution / bioavailability = 2 mg/L × 40 L / 1 = 80 mg. Maintenance dose = target concentration × clearance × dosing interval / bioavailability. A large Vd means the drug is distributed into tissues, while a small Vd means it stays in plasma. In kidney or liver disease, the maintenance dose usually decreases, while the loading dose is generally unchanged.","ko":"부하용량 = Cp × Vd / F. 유지용량 = Cp × CL × τ / F. 신부전 시 유지용량↓."},{"id":"py01","steps":["1"],"system":"Psychiatry","discipline":"Pharmacology","topic":"Serotonin syndrome","stem":"A 34-year-old woman taking sertraline for depression is prescribed tramadol for back pain. Two days later she is agitated and diaphoretic, with a temperature of 39.2°C (102.6°F), pulse of 124/min, diarrhea, dilated pupils, hyperreflexia, and inducible clonus in both ankles.\n\nWhich of the following drugs is most appropriate after stopping the offending agents and giving supportive care?","options":["Bromocriptine","Dantrolene","Haloperidol","Physostigmine","Cyproheptadine"],"answer":4,"explanation":"Serotonin syndrome results from excess serotonergic activity when drugs such as SSRIs, SNRIs, MAOIs, tramadol, linezolid, triptans, ondansetron, or MDMA are combined. It causes altered mental status, autonomic instability, hyperthermia, diarrhea, and neuromuscular hyperactivity with clonus and hyperreflexia, developing within hours. Treatment is stopping the drugs, benzodiazepines, and cyproheptadine, a 5-HT2A antagonist. Neuroleptic malignant syndrome instead causes lead-pipe rigidity and slower onset.","ko":"세로토닌 증후군: 클로누스·과반사·설사, 급성 발생 → cyproheptadine."},{"id":"py02","steps":["1"],"system":"Psychiatry","discipline":"Pharmacology","topic":"Neuroleptic malignant syndrome","stem":"A 26-year-old man with schizophrenia is started on haloperidol. Four days later he is confused, with a temperature of 40.1°C (104.2°F), fluctuating blood pressure, and severe generalized lead-pipe rigidity. Serum creatine kinase is 18,000 U/L.\n\nWhich of the following mechanisms underlies this condition?","options":["Blockade of dopamine D2 receptors","Excess norepinephrine release","Inherited mutation of the ryanodine receptor","Blockade of muscarinic receptors","Excess serotonin at 5-HT2A receptors"],"answer":0,"explanation":"Neuroleptic malignant syndrome is a rare reaction to dopamine D2 antagonists (or abrupt withdrawal of dopaminergic drugs). It causes fever, encephalopathy, autonomic instability, severe lead-pipe rigidity, and elevated CK with myoglobinuria, typically over days. Treatment is stopping the drug, supportive care, dantrolene (a ryanodine receptor antagonist), and bromocriptine (a D2 agonist).","ko":"NMS = D2 차단, 납관 강직·고열·CK↑, 수일에 걸쳐 → dantrolene·bromocriptine."},{"id":"py03","steps":["1"],"system":"Psychiatry","discipline":"Pharmacology","topic":"Clozapine monitoring","stem":"A 30-year-old man with schizophrenia has persistent hallucinations despite adequate trials of risperidone and olanzapine. He is started on an antipsychotic that requires enrollment in a monitoring program with regular blood tests.\n\nWhich adverse effect is this monitoring designed to detect?","options":["QT prolongation","Agranulocytosis","Hypothyroidism","Hyperprolactinemia","Hepatotoxicity"],"answer":1,"explanation":"Clozapine is the most effective antipsychotic for treatment-resistant schizophrenia and lowers suicide risk. It can cause severe neutropenia (agranulocytosis), so absolute neutrophil count is monitored regularly. Other adverse effects include seizures, myocarditis, weight gain and metabolic syndrome, sedation, and hypersalivation. Unlike first-generation antipsychotics, it rarely causes extrapyramidal symptoms.","ko":"Clozapine: 치료저항성 조현병, 무과립구증 → ANC 정기 측정. 경련·심근염."},{"id":"py04","steps":["1"],"system":"Psychiatry","discipline":"Pharmacology","topic":"Lithium in pregnancy","stem":"A 27-year-old woman with bipolar I disorder has been stable on lithium and learns that she is 6 weeks pregnant.\n\nContinuing this drug during the first trimester is most associated with which of the following fetal abnormalities?","options":["Neural tube defect","Downward displacement of the tricuspid valve","Aplasia cutis","Discolored teeth","Craniofacial anomalies with limb defects"],"answer":1,"explanation":"First-trimester lithium exposure is associated with Ebstein anomaly, in which the tricuspid valve leaflets are displaced downward into the right ventricle (atrialization of the right ventricle). The absolute risk is small, and the decision to continue is weighed against the risk of relapse. Valproate and carbamazepine cause neural tube defects, methimazole causes aplasia cutis, and tetracyclines discolor teeth. Lithium also causes nephrogenic diabetes insipidus and hypothyroidism.","ko":"Lithium 임신 1삼분기 → Ebstein 기형(삼첨판 하방 전위)."},{"id":"py05","steps":["1"],"system":"Psychiatry","discipline":"Pharmacology","topic":"Benzodiazepine mechanism","stem":"A 24-year-old woman takes lorazepam before a flight because of a fear of flying. Alprazolam and phenobarbital are both drugs that act on the same receptor complex but in different ways.\n\nWhich of the following describes how lorazepam affects the GABA-A receptor?","options":["It increases the frequency of chloride channel opening","It blocks GABA reuptake into neurons","It inhibits GABA transaminase","It directly opens the chloride channel without GABA","It increases the duration of chloride channel opening"],"answer":0,"explanation":"Benzodiazepines bind between the α and γ subunits of the GABA-A receptor and increase the frequency of chloride channel opening when GABA is present. Barbiturates increase the duration of opening and can open the channel directly at high doses, so they are more dangerous in overdose. Flumazenil reverses benzodiazepines but can precipitate seizures in dependent patients. Tiagabine blocks GABA reuptake, and vigabatrin inhibits GABA transaminase.","ko":"벤조디아제핀 = Cl 채널 개방 빈도↑. 바르비투르산 = 개방 시간↑."},{"id":"py06","steps":["1"],"system":"Psychiatry","discipline":"Management","topic":"Delirium tremens","stem":"A 52-year-old man is admitted for a hip fracture. On the third hospital day, he becomes agitated and disoriented and sees insects crawling on the walls. Temperature is 38.4°C (101.1°F), pulse is 128/min, and blood pressure is 172/104 mm Hg. He is tremulous and diaphoretic. His wife says he drinks a fifth of vodka every day.\n\nWhich of the following is the most appropriate treatment?","options":["Physical restraints and observation only","Disulfiram","Benzodiazepine such as lorazepam","Naltrexone","Haloperidol alone"],"answer":2,"explanation":"Alcohol withdrawal follows a typical timeline: tremor, anxiety, and insomnia within hours; withdrawal seizures and alcoholic hallucinosis (with normal vital signs) within 12 to 48 hours; and delirium tremens, with confusion, hallucinations, and autonomic hyperactivity, at 48 to 96 hours. Delirium tremens can be fatal. Benzodiazepines are the treatment of choice because they act on the GABA receptors that alcohol affects; thiamine is also given. Naltrexone and disulfiram are for maintaining abstinence.","ko":"진전섬망: 금주 48~96시간, 자율신경 항진 → 벤조디아제핀. 사망 가능."},{"id":"py07","steps":["1"],"system":"Psychiatry","discipline":"Pharmacology","topic":"Opioid intoxication","stem":"A 23-year-old man is found unresponsive in a public restroom with a syringe nearby. Respirations are 5/min and shallow, and his pupils are pinpoint. Pulse oximetry is 82% on room air.\n\nWhich of the following is the most appropriate pharmacologic treatment?","options":["N-acetylcysteine","Atropine","Naloxone","Flumazenil","Physostigmine"],"answer":2,"explanation":"Opioid overdose causes the triad of depressed consciousness, respiratory depression, and miosis. Naloxone, a competitive μ-opioid receptor antagonist, rapidly reverses it; because its effect is shorter than many opioids, repeat doses may be needed. Naloxone can precipitate withdrawal in dependent patients, which causes mydriasis, yawning, lacrimation, rhinorrhea, piloerection, diarrhea, and cramps but is rarely life-threatening.","ko":"아편 중독: 축동 + 호흡억제 + 의식저하 → naloxone. 금단은 산동·하품·설사."},{"id":"py08","steps":["1"],"system":"Psychiatry","discipline":"Pharmacology","topic":"Cocaine","stem":"A 28-year-old man comes to the emergency department with chest pain, agitation, and sweating after a night out. Pulse is 132/min, blood pressure is 182/110 mm Hg, and his pupils are dilated. ECG shows ST elevation in the anterior leads.\n\nThe substance he most likely used acts by which of the following mechanisms?","options":["Stimulating cannabinoid CB1 receptors","Blocking NMDA receptors","Stimulating μ-opioid receptors","Blocking reuptake of norepinephrine, dopamine, and serotonin","Increasing GABA-A receptor activity"],"answer":3,"explanation":"Cocaine blocks reuptake of norepinephrine, dopamine, and serotonin, causing sympathetic stimulation, euphoria, mydriasis, hypertension, and coronary vasospasm that can cause myocardial infarction. It also blocks sodium channels (local anesthetic effect). Benzodiazepines are first-line for agitation and hypertension. β-Blockers alone are traditionally avoided because unopposed α stimulation can worsen vasoconstriction. Phencyclidine blocks NMDA receptors and causes nystagmus and violent behavior.","ko":"코카인 = NE·DA·5-HT 재흡수 차단, 관상동맥 연축 → 벤조디아제핀(β차단 단독 회피)."},{"id":"py09","steps":["1"],"system":"Psychiatry","discipline":"Behavioral Science","topic":"Displacement","stem":"A 40-year-old man is criticized harshly by his boss in a meeting but says nothing. That evening he yells at his teenage son for leaving shoes in the hallway.\n\nWhich of the following defense mechanisms is he using?","options":["Projection","Rationalization","Sublimation","Displacement","Reaction formation"],"answer":3,"explanation":"Displacement redirects feelings from their real source to a safer target. Projection attributes one's own unacceptable feelings to someone else. Reaction formation replaces an unacceptable impulse with its opposite. Sublimation channels an unacceptable impulse into a socially valued activity and is a mature defense. Rationalization offers a logical-sounding excuse for behavior driven by other reasons.","ko":"전치(displacement): 감정을 안전한 대상에게 돌림 (상사 → 아들)."},{"id":"py10","steps":["1"],"system":"Psychiatry","discipline":"Behavioral Science","topic":"Borderline personality disorder","stem":"A 24-year-old woman is admitted after cutting her wrists following a breakup. She has a history of intense, unstable relationships, chronic feelings of emptiness, and impulsive spending. On the ward, she describes one nurse as perfect and another as cruel and useless, and her views reverse within a day.\n\nWhich of the following treatments has the strongest evidence for this condition?","options":["Psychoanalysis without skills training","Electroconvulsive therapy","Long-term benzodiazepine therapy","Dialectical behavior therapy","Exposure and response prevention"],"answer":3,"explanation":"Borderline personality disorder involves unstable relationships, self-image, and mood, with impulsivity, recurrent self-harm or suicidal behavior, chronic emptiness, fear of abandonment, and splitting (seeing people as all good or all bad). It is more often diagnosed in women. Dialectical behavior therapy, which teaches emotion regulation and distress tolerance, has the strongest evidence. Benzodiazepines can worsen disinhibition. Exposure and response prevention is used for OCD.","ko":"경계성 인격장애: 분리(splitting)·자해·버림받음 공포 → 변증법적 행동치료(DBT)."},{"id":"py11","steps":["1"],"system":"Psychiatry","discipline":"Behavioral Science","topic":"Negative reinforcement","stem":"A 10-year-old boy cleans his room every Saturday morning because his mother stops nagging him once the room is clean.\n\nWhich of the following best describes the process that increases his room-cleaning?","options":["Positive punishment","Extinction","Positive reinforcement","Negative reinforcement","Negative punishment"],"answer":3,"explanation":"In operant conditioning, reinforcement increases a behavior and punishment decreases it. Positive means adding a stimulus and negative means removing one. Here, cleaning removes an unpleasant stimulus (nagging), so the behavior increases: negative reinforcement. Positive punishment adds an unpleasant stimulus to decrease a behavior, negative punishment removes something pleasant, and extinction is the fading of a behavior when reinforcement stops.","ko":"부적 강화 = 불쾌한 자극 제거로 행동 증가. 처벌은 행동 감소."},{"id":"py12","steps":["1"],"system":"Psychiatry","discipline":"Physiology","topic":"Narcolepsy","stem":"A 19-year-old college student falls asleep in class and while driving despite sleeping 8 hours a night. When she laughs, her knees buckle and she sometimes falls, while remaining fully conscious. She also has vivid dreams while falling asleep. A sleep study shows that she enters REM sleep within 10 minutes of falling asleep.\n\nDeficiency of which of the following neuropeptides is most likely?","options":["Neuropeptide Y","Melatonin","Substance P","Oxytocin","Orexin (hypocretin)"],"answer":4,"explanation":"Narcolepsy type 1 is caused by loss of orexin (hypocretin)-producing neurons in the lateral hypothalamus, which normally stabilize wakefulness. Features include excessive daytime sleepiness, cataplexy (sudden loss of muscle tone triggered by emotion), hypnagogic and hypnopompic hallucinations, sleep paralysis, and short REM latency. Treatment includes scheduled naps, modafinil or stimulants, and sodium oxybate for cataplexy.","ko":"기면증 = 오렉신(하이포크레틴) 결핍, 탈력발작, REM 잠복기 짧음."},{"id":"py13","steps":["1"],"system":"Psychiatry","discipline":"Biochemistry","topic":"Refeeding syndrome","stem":"A 19-year-old woman with anorexia nervosa weighing 38 kg (BMI 14 kg/m²) is admitted for nutritional rehabilitation. On the third day of feeding, she develops weakness, confusion, and heart failure.\n\nWhich of the following electrolyte abnormalities is most characteristic of this complication?","options":["Hypercalcemia","Hypophosphatemia","Hyponatremia only","Hypermagnesemia","Hyperkalemia"],"answer":1,"explanation":"In refeeding syndrome, carbohydrate intake after prolonged starvation triggers insulin release, which moves phosphate, potassium, and magnesium into cells for glycolysis and ATP production. Total body phosphate is already depleted, so serum phosphate falls sharply, causing muscle weakness, rhabdomyolysis, respiratory failure, arrhythmias, and heart failure. Thiamine deficiency can also be unmasked. Feeding is started slowly with close electrolyte monitoring.","ko":"재급식 증후군: 인슐린 → 인산·K·Mg 세포 내 이동 → 저인산혈증 → 심부전·근약화."},{"id":"py14","steps":["1"],"system":"Psychiatry","discipline":"Pharmacology","topic":"Bupropion contraindication","stem":"A 22-year-old woman with major depressive disorder wants an antidepressant that will not cause weight gain or sexual side effects and may help her quit smoking. She also reports episodes of binge eating followed by self-induced vomiting several times a week.\n\nWhy is bupropion contraindicated in this patient?","options":["It causes severe hypertensive crisis with tyramine","It causes agranulocytosis","It prolongs the QT interval in patients with bulimia","It causes priapism","It increases the risk of seizures in patients with eating disorders"],"answer":4,"explanation":"Bupropion inhibits reuptake of norepinephrine and dopamine. It does not cause sexual dysfunction or weight gain and is used for smoking cessation. It lowers the seizure threshold, and seizure risk is highest in patients with bulimia or anorexia (electrolyte disturbances) and in those with seizure disorders. MAOIs cause hypertensive crisis with tyramine, and trazodone causes priapism.","ko":"Bupropion: 성기능·체중 부작용 없음, 금연 보조, 섭식장애·경련질환에서 금기(경련)."},{"id":"py15","steps":["1"],"system":"Psychiatry","discipline":"Pharmacology","topic":"TCA overdose","stem":"A 35-year-old woman is brought to the emergency department after ingesting a large quantity of amitriptyline. She is confused and has dry, flushed skin, dilated pupils, and urinary retention. Pulse is 128/min and blood pressure is 84/50 mm Hg. ECG shows a QRS duration of 140 ms.\n\nWhich of the following is the most appropriate treatment for her ECG finding?","options":["IV sodium bicarbonate","IV amiodarone","IV flumazenil","IV calcium gluconate","IV physostigmine"],"answer":0,"explanation":"Tricyclic antidepressant overdose causes anticholinergic effects, α1 blockade (hypotension), seizures, and cardiotoxicity from blockade of cardiac fast sodium channels, which widens the QRS and can cause ventricular arrhythmias. Sodium bicarbonate provides sodium to overcome the blockade and alkalinizes the serum, reducing drug binding to sodium channels. Physostigmine can precipitate asystole in TCA overdose and is avoided.","ko":"TCA 과다복용: 3C(Convulsion, Coma, Cardiotoxicity) + 항콜린, QRS 확장 → 중탄산나트륨."},{"id":"py16","steps":["1"],"system":"Psychiatry","discipline":"Behavioral Science","topic":"Conversion disorder","stem":"A 22-year-old woman suddenly cannot move her right arm the day after she saw her boyfriend with another woman. She is calm about her paralysis. Reflexes and tone are normal, and when her right arm is dropped over her face, it falls to the side instead of hitting her. MRI of the brain and spine is normal.\n\nWhich of the following is the most likely diagnosis?","options":["Factitious disorder","Functional neurological symptom (conversion) disorder","Malingering","Illness anxiety disorder","Somatic symptom disorder"],"answer":1,"explanation":"Functional neurological symptom disorder (conversion disorder) causes motor or sensory symptoms that are incompatible with neurologic disease, often after psychological stress, with findings such as an arm that avoids the face when dropped. Symptoms are not intentionally produced, and patients may show indifference. In factitious disorder, symptoms are intentionally produced to assume the sick role, and in malingering, they are intentionally produced for external gain. Somatic symptom disorder involves excessive distress about real symptoms.","ko":"전환장애: 스트레스 후 신경학적 증상, 비의도적, 무관심(la belle indifférence)."},{"id":"py17","steps":["1"],"system":"Psychiatry","discipline":"Pharmacology","topic":"MAOI hypertensive crisis","stem":"A 50-year-old man with treatment-resistant depression takes phenelzine. After eating aged cheese and salami with red wine at a party, he develops a severe occipital headache, palpitations, and a blood pressure of 230/130 mm Hg.\n\nWhich of the following explains this reaction?","options":["Dietary tyramine is not broken down and releases stored norepinephrine","Phenelzine directly stimulates α1 receptors","Cheese contains serotonin that causes vasoconstriction","Alcohol inhibits phenelzine metabolism","Phenelzine blocks norepinephrine reuptake"],"answer":0,"explanation":"Monoamine oxidase inhibitors (phenelzine, tranylcypromine, isocarboxazid, selegiline) block breakdown of monoamines. Tyramine in aged cheese, cured meats, wine, and fermented foods is normally degraded by intestinal and hepatic MAO-A. With MAO inhibited, tyramine enters the circulation and displaces norepinephrine from nerve terminals, causing a hypertensive crisis treated with phentolamine. MAOIs also cause serotonin syndrome when combined with SSRIs, meperidine, or dextromethorphan; a 2-week washout is required.","ko":"MAOI + 티라민(숙성 치즈·와인) → NE 방출 → 고혈압 위기 → phentolamine. SSRI 병용 금기."},{"id":"py18","steps":["1"],"system":"Psychiatry","discipline":"Pharmacology","topic":"Acute dystonia","stem":"An 18-year-old man is given IM haloperidol for acute agitation. Six hours later his neck twists painfully to the side, his eyes are fixed in an upward gaze, and his tongue protrudes.\n\nWhich of the following is the most appropriate treatment?","options":["Increase the haloperidol dose","Propranolol","Valbenazine","Benztropine or diphenhydramine","Dantrolene"],"answer":3,"explanation":"Extrapyramidal symptoms follow a typical timeline with D2-blocking antipsychotics, especially high-potency first-generation drugs such as haloperidol: acute dystonia within hours to days, akathisia within days to weeks, parkinsonism within weeks, and tardive dyskinesia after months to years. D2 blockade in the nigrostriatal pathway leaves relative cholinergic excess, so acute dystonia is treated with anticholinergics (benztropine) or diphenhydramine. Akathisia is treated with propranolol or benzodiazepines, and tardive dyskinesia with VMAT2 inhibitors such as valbenazine.","ko":"급성 근긴장이상(수시간~수일) → benztropine/diphenhydramine. 좌불안석 → propranolol. 지연성 운동장애 → valbenazine."},{"id":"py19","steps":["1"],"system":"Psychiatry","discipline":"Pharmacology","topic":"Second-generation antipsychotic effects","stem":"A 24-year-old man with schizophrenia gains 14 kg and develops type 2 diabetes and hypertriglyceridemia during his first year of treatment with an antipsychotic.\n\nWhich of the following drugs is most likely responsible?","options":["Olanzapine","Ziprasidone","Aripiprazole","Haloperidol","Lurasidone"],"answer":0,"explanation":"Second-generation antipsychotics block D2 and 5-HT2A receptors and vary in side effects. Olanzapine and clozapine cause the most weight gain, diabetes, and dyslipidemia, so weight, glucose, and lipids are monitored. Ziprasidone prolongs QT the most among atypicals. Risperidone causes hyperprolactinemia. Aripiprazole is a partial D2 agonist with less metabolic risk and can cause akathisia. Quetiapine is sedating.","ko":"대사 부작용 최대: olanzapine·clozapine. QT: ziprasidone. 고프로락틴: risperidone. 부분작용제: aripiprazole."},{"id":"py20","steps":["1"],"system":"Psychiatry","discipline":"Behavioral Science","topic":"Schizophreniform disorder","stem":"A 22-year-old college student has had auditory hallucinations, the belief that his professors are implanting thoughts in his head, and disorganized speech for 3 months. His functioning has declined. There is no substance use or medical cause, and he has no prominent mood symptoms.\n\nWhich of the following is the most likely diagnosis?","options":["Brief psychotic disorder","Schizophrenia","Schizoaffective disorder","Schizophreniform disorder","Delusional disorder"],"answer":3,"explanation":"Psychotic disorders are distinguished by duration and features. Brief psychotic disorder lasts less than 1 month, schizophreniform disorder 1 to 6 months, and schizophrenia more than 6 months (including prodromal and residual phases). Schizoaffective disorder includes mood episodes plus at least 2 weeks of psychosis without mood symptoms. Delusional disorder involves only nonbizarre delusions for at least 1 month with otherwise intact functioning.","ko":"정신병 기간: \u003c1개월 단기, 1~6개월 조현양상장애, >6개월 조현병."},{"id":"py21","steps":["1"],"system":"Psychiatry","discipline":"Behavioral Science","topic":"Delirium","stem":"An 82-year-old woman is hospitalized for pneumonia. On the second night she becomes agitated, pulls at her IV, and believes the nurses are trying to poison her. The next morning she is drowsy and cannot keep track of a conversation. Her symptoms fluctuate through the day. Her family says she was mentally sharp before admission.\n\nWhich of the following is the most likely diagnosis?","options":["Alzheimer disease","Late-onset schizophrenia","Dementia with Lewy bodies","Delirium","Major depressive disorder with psychotic features"],"answer":3,"explanation":"Delirium is an acute, fluctuating disturbance of attention and awareness caused by a medical condition, medication, or substance. It is common in hospitalized older adults, especially with infection, anticholinergic or sedative drugs, sleep deprivation, and dementia. EEG shows diffuse slowing. Treatment addresses the cause, with reorientation and sleep hygiene; low-dose antipsychotics are used only for severe agitation. Dementia develops gradually with intact attention early on.","ko":"섬망: 급성·변동성 주의력 장애, 의학적 원인(감염·약물), 원인 교정이 치료. 치매는 서서히."},{"id":"py22","steps":["1"],"system":"Psychiatry","discipline":"Pharmacology","topic":"OCD treatment","stem":"A 25-year-old woman spends 3 hours a day washing her hands because she fears contamination, although she knows the fear is excessive. The rituals interfere with her work.\n\nWhich of the following is the most appropriate initial treatment?","options":["A benzodiazepine as needed","Electroconvulsive therapy","Lithium","Cognitive behavioral therapy with exposure and response prevention, and an SSRI","An antipsychotic alone"],"answer":3,"explanation":"Obsessive-compulsive disorder involves recurrent intrusive thoughts (obsessions) and repetitive behaviors done to relieve anxiety (compulsions), usually with insight. First-line treatment is CBT with exposure and response prevention and SSRIs, often at higher doses than for depression; clomipramine is an alternative. OCD is associated with tic disorders, and in children it can follow streptococcal infection (PANDAS). Obsessive-compulsive personality disorder, in contrast, is ego-syntonic perfectionism.","ko":"강박장애: 노출 및 반응방지(ERP) + SSRI(고용량), clomipramine. 강박성 인격장애는 자아동조적."},{"id":"py23","steps":["1"],"system":"Psychiatry","discipline":"Behavioral Science","topic":"PTSD vs acute stress disorder","stem":"A 30-year-old woman was assaulted 10 days ago. Since then, she has nightmares and flashbacks, avoids the street where it happened, startles easily, and feels detached from her surroundings.\n\nWhich of the following is the most likely diagnosis?","options":["Panic disorder","Acute stress disorder","Posttraumatic stress disorder","Generalized anxiety disorder","Adjustment disorder"],"answer":1,"explanation":"Acute stress disorder and PTSD share the same symptoms after trauma: intrusive memories, avoidance, negative mood and cognition, dissociation, and hyperarousal. Acute stress disorder lasts from 3 days to 1 month after the trauma, while PTSD lasts more than 1 month. Trauma-focused CBT is first-line for both; SSRIs and SNRIs are used for PTSD, and prazosin for nightmares. Adjustment disorder follows a stressor that is not life-threatening.","ko":"외상 후 증상: 3일~1개월 = 급성 스트레스장애, >1개월 = PTSD."},{"id":"py24","steps":["1"],"system":"Psychiatry","discipline":"Pharmacology","topic":"Panic disorder treatment","stem":"A 28-year-old man has recurrent unexpected episodes of pounding heart, chest tightness, shortness of breath, trembling, and fear of dying that peak within 10 minutes. He now avoids driving and crowded places because he worries about having another attack. Cardiac evaluation is normal.\n\nWhich of the following is the best long-term pharmacologic treatment?","options":["Long-term daily alprazolam","Haloperidol","An SSRI such as sertraline","Buspirone as needed","Propranolol alone"],"answer":2,"explanation":"Panic disorder involves recurrent unexpected panic attacks with at least a month of worry about future attacks or behavior change, often with agoraphobia. First-line long-term treatment is CBT and SSRIs or SNRIs. Benzodiazepines act quickly and can be used briefly while an SSRI takes effect, but long-term use carries risks of dependence and withdrawal. Propranolol helps performance anxiety, and buspirone treats generalized anxiety disorder but not panic attacks.","ko":"공황장애: 장기 치료 SSRI/SNRI + CBT. 벤조디아제핀은 단기 가교로만."},{"id":"py25","steps":["1"],"system":"Psychiatry","discipline":"Pharmacology","topic":"ADHD stimulants","stem":"An 8-year-old boy has trouble sitting still, interrupts others, loses his belongings, and cannot finish tasks both at school and at home since age 5. He is started on methylphenidate.\n\nWhich of the following is the main mechanism of this drug?","options":["Blocking reuptake of dopamine and norepinephrine","Blocking 5-HT2A receptors","Stimulating α2 receptors","Inhibiting monoamine oxidase","Blocking NMDA receptors"],"answer":0,"explanation":"ADHD involves inattention and/or hyperactivity-impulsivity present before age 12 in at least two settings. Methylphenidate blocks dopamine and norepinephrine reuptake, and amphetamines also release them, improving attention through effects on prefrontal circuits. Adverse effects include decreased appetite, insomnia, growth slowing, tachycardia, and tics. Atomoxetine (a norepinephrine reuptake inhibitor) and α2 agonists (guanfacine, clonidine) are nonstimulant options.","ko":"ADHD: methylphenidate(DA·NE 재흡수 차단). 비자극제: atomoxetine, guanfacine·clonidine."},{"id":"py26","steps":["1"],"system":"Psychiatry","discipline":"Behavioral Science","topic":"Reaction formation","stem":"A 35-year-old man who has unacknowledged sexual feelings toward men becomes a vocal activist campaigning against same-sex marriage.\n\nWhich defense mechanism is he most likely using?","options":["Displacement","Reaction formation","Sublimation","Projection","Denial"],"answer":1,"explanation":"Reaction formation is replacing an unacceptable impulse with an exaggerated expression of its opposite. Projection attributes one's own unacceptable feelings to others. Displacement redirects feelings to a safer target. Sublimation channels an unacceptable impulse into a socially valued activity and is mature. Denial is refusing to accept an obvious reality.","ko":"반동형성 = 받아들일 수 없는 충동을 정반대로 과장 표현."},{"id":"py27","steps":["1"],"system":"Psychiatry","discipline":"Physiology","topic":"Sleep stages","stem":"A 7-year-old boy sometimes sits up screaming during the first few hours of sleep, appears terrified and inconsolable, and has no memory of the episode in the morning.\n\nIn which stage of sleep do these episodes most likely occur?","options":["N1","REM sleep","N2","Wakefulness","N3 (slow-wave sleep)"],"answer":4,"explanation":"Night terrors and sleepwalking occur during N3 (slow-wave, delta wave) sleep, which predominates in the first third of the night; children do not remember them. Nightmares occur in REM sleep, later in the night, and are remembered. REM sleep features dreaming, muscle atonia, rapid eye movements, and penile tumescence, and is reduced by benzodiazepines, alcohol, and antidepressants. N2 has sleep spindles and K-complexes. Benzodiazepines reduce N3.","ko":"야경증·몽유병 = N3(서파수면, 밤 초반, 기억 없음). 악몽 = REM(밤 후반, 기억함)."},{"id":"py28","steps":["1"],"system":"Psychiatry","discipline":"Pharmacology","topic":"Alcohol use disorder drugs","stem":"A 45-year-old man with alcohol use disorder completes detoxification and wants to stay sober. He has cirrhosis with elevated aminotransferases. His physician wants a drug that reduces cravings and is excreted by the kidneys.\n\nWhich drug is most appropriate?","options":["Acamprosate","Chlordiazepoxide","Disulfiram","Naltrexone","Varenicline"],"answer":0,"explanation":"Drugs for maintaining abstinence from alcohol include naltrexone (an opioid antagonist that reduces cravings and reward; hepatotoxic and contraindicated with opioid use), acamprosate (modulates glutamate and GABA; renally cleared, so preferred in liver disease), and disulfiram (inhibits aldehyde dehydrogenase, causing flushing, nausea, and palpitations if alcohol is consumed). Benzodiazepines such as chlordiazepoxide treat withdrawal.","ko":"알코올 유지 치료: naltrexone(간독성), acamprosate(신배설 — 간질환 선호), disulfiram(알데히드 탈수소효소 억제)."},{"id":"py29","steps":["1"],"system":"Psychiatry","discipline":"Pharmacology","topic":"Varenicline","stem":"A 50-year-old woman who smokes a pack a day wants to quit. She is prescribed a drug that reduces both cravings and the pleasure of smoking.\n\nWhich of the following is the mechanism of varenicline?","options":["Norepinephrine and dopamine reuptake inhibitor","Opioid receptor antagonist","Partial agonist at α4β2 nicotinic acetylcholine receptors","GABA-B receptor agonist","Full agonist at nicotinic receptors"],"answer":2,"explanation":"Varenicline is a partial agonist at the α4β2 nicotinic receptor. Its partial agonism relieves cravings and withdrawal, and by occupying the receptor it blocks nicotine from producing a full rewarding effect. It is the most effective single drug for smoking cessation. Adverse effects include nausea and vivid dreams. Bupropion is another option, as is nicotine replacement.","ko":"Varenicline = α4β2 니코틴 수용체 부분 작용제(갈망↓ + 니코틴 보상 차단). 가장 효과적 금연약."},{"id":"rn01","steps":["1"],"system":"Renal","discipline":"Pharmacology","topic":"Loop diuretic site","stem":"A 74-year-old man with acute decompensated heart failure is treated with a high dose of an IV diuretic. Over the next 3 days, he has a large diuresis but develops hypokalemia, hypocalcemia, and new difficulty hearing.\n\nThis drug most likely inhibits which of the following transporters?","options":["Na+/K+/2Cl− cotransporter in the thick ascending limb","Carbonic anhydrase in the proximal tubule","Aquaporin-2 in the collecting duct","Na+/Cl− cotransporter in the distal convoluted tubule","Epithelial sodium channel in the collecting duct"],"answer":0,"explanation":"Loop diuretics such as furosemide inhibit the Na+/K+/2Cl− cotransporter (NKCC2) in the thick ascending limb. This abolishes the lumen-positive potential that drives paracellular reabsorption of calcium and magnesium, so calcium excretion rises. Increased sodium delivery to the collecting duct enhances potassium and H+ secretion, causing hypokalemia and metabolic alkalosis. Ototoxicity occurs because a similar cotransporter is present in the inner ear.","ko":"Loop 이뇨제 = NKCC2 억제 → 저칼륨·저칼슘(소변 Ca↑)·이독성."},{"id":"rn02","steps":["1"],"system":"Renal","discipline":"Pharmacology","topic":"Thiazide for calcium stones","stem":"A 45-year-old man has had three episodes of calcium oxalate kidney stones. A 24-hour urine collection shows hypercalciuria with normal serum calcium and PTH.\n\nWhich of the following drugs would be most effective in reducing his urinary calcium excretion?","options":["Mannitol","Acetazolamide","Hydrochlorothiazide","Spironolactone","Furosemide"],"answer":2,"explanation":"Thiazides inhibit the Na+/Cl− cotransporter in the distal convoluted tubule. They increase calcium reabsorption in the distal tubule, lowering urinary calcium, which is why they are used for idiopathic hypercalciuria with calcium stones. Their adverse effects include hypercalcemia, hyponatremia, hypokalemia, hyperglycemia, hyperlipidemia, and hyperuricemia. Loop diuretics have the opposite effect on calcium, and acetazolamide alkalinizes the urine and promotes calcium phosphate stones.","ko":"Thiazide = 소변 Ca↓ (칼슘결석 예방). 부작용: 고Ca·고혈당·고요산·저Na."},{"id":"rn03","steps":["1"],"system":"Renal","discipline":"Pharmacology","topic":"Spironolactone gynecomastia","stem":"A 58-year-old man with alcoholic cirrhosis and ascites is started on a diuretic. Three months later, he has tender bilateral breast enlargement. Serum potassium is 5.4 mEq/L.\n\nWhich of the following drugs is most likely responsible?","options":["Spironolactone","Eplerenone","Hydrochlorothiazide","Amiloride","Furosemide"],"answer":0,"explanation":"Spironolactone is a competitive antagonist of the mineralocorticoid receptor in the collecting duct, which makes it potassium-sparing. It is preferred for ascites in cirrhosis because secondary hyperaldosteronism drives sodium retention. It also blocks androgen receptors and inhibits steroid synthesis, causing gynecomastia, decreased libido, and menstrual irregularities. Eplerenone is more selective for the mineralocorticoid receptor and rarely causes gynecomastia.","ko":"Spironolactone: K 보존 + 항안드로겐 → 여성형 유방. Eplerenone은 선택적."},{"id":"rn04","steps":["1"],"system":"Renal","discipline":"Physiology","topic":"ACE inhibitor and renal artery stenosis","stem":"A 72-year-old man with diffuse atherosclerosis and resistant hypertension is started on lisinopril. Two weeks later his serum creatinine has risen from 1.1 to 2.6 mg/dL. Imaging shows severe stenosis of both renal arteries.\n\nWhich of the following best explains the rise in creatinine?","options":["Increased tubular secretion of creatinine","Direct toxic injury to tubular epithelial cells","Allergic interstitial nephritis","Constriction of the afferent arterioles","Dilation of the efferent arterioles lowering glomerular capillary pressure"],"answer":4,"explanation":"When renal perfusion is low, as with bilateral renal artery stenosis, angiotensin II constricts the efferent arteriole to maintain glomerular capillary pressure and GFR. ACE inhibitors and ARBs remove this constriction, so GFR falls and creatinine rises. NSAIDs reduce GFR differently, by blocking prostaglandins that dilate the afferent arteriole. The combination of NSAIDs, ACE inhibitors, and diuretics is especially risky.","ko":"ACEi/ARB → 수출세동맥 확장 → GFR↓. 양측 신동맥 협착에서 금기. NSAID는 수입세동맥 수축."},{"id":"rn05","steps":["1"],"system":"Renal","discipline":"Physiology","topic":"Inulin clearance","stem":"In a research study, inulin is infused in a healthy volunteer to reach a steady plasma concentration of 1 mg/mL. Urine inulin concentration is 100 mg/mL, and urine flow rate is 1.2 mL/min.\n\nWhich of the following is closest to this person's glomerular filtration rate?","options":["1.2 mL/min","12 mL/min","83 mL/min","120 mL/min","1200 mL/min"],"answer":3,"explanation":"Clearance equals (urine concentration × urine flow rate) divided by plasma concentration: (100 mg/mL × 1.2 mL/min) / 1 mg/mL = 120 mL/min. Inulin is freely filtered and neither reabsorbed nor secreted, so its clearance equals GFR. Creatinine slightly overestimates GFR because it is also secreted a little. PAH clearance estimates effective renal plasma flow because PAH is filtered and almost completely secreted.","ko":"Clearance = U×V/P. Inulin clearance = GFR, PAH clearance = 신혈장류량."},{"id":"rn06","steps":["1"],"system":"Renal","discipline":"Physiology","topic":"Vomiting metabolic alkalosis","stem":"A 17-year-old girl is evaluated for fatigue and weakness. She is thin and has bilateral parotid enlargement and calluses on the backs of her fingers. Laboratory studies show:\nNa+ 137 mEq/L\nK+ 2.8 mEq/L\nCl− 86 mEq/L\nHCO3− 36 mEq/L\nArterial pH 7.51\nPaCO2 47 mm Hg\nUrine chloride 8 mEq/L (low)\n\nWhich of the following is the most likely cause of these findings?","options":["Renal tubular acidosis","Self-induced vomiting","Surreptitious diuretic use","Laxative abuse","Primary hyperaldosteronism"],"answer":1,"explanation":"She has hypochloremic, hypokalemic metabolic alkalosis with appropriate respiratory compensation. Vomiting removes HCl, and volume contraction activates aldosterone, which promotes renal potassium and H+ loss and sustains the alkalosis. A low urine chloride indicates chloride depletion from vomiting (saline-responsive). Diuretic use causes a similar picture with a high urine chloride. Laxative abuse and diarrhea cause metabolic acidosis, and primary hyperaldosteronism causes hypertension.","ko":"구토 대사성 알칼리증: 저Cl·저K, 소변 Cl 낮음. 이뇨제는 소변 Cl 높음."},{"id":"rn07","steps":["1"],"system":"Renal","discipline":"Physiology","topic":"Distal renal tubular acidosis","stem":"A 42-year-old woman with Sjögren syndrome has recurrent kidney stones. Laboratory studies show a non-anion gap metabolic acidosis with a serum potassium of 3.1 mEq/L. Urine pH is 6.5 despite the systemic acidosis. Imaging shows nephrocalcinosis.\n\nWhich of the following best describes the underlying defect?","options":["Impaired H+ secretion by α-intercalated cells","Accumulation of unmeasured organic acids","Aldosterone deficiency or resistance","Impaired bicarbonate reabsorption in the proximal tubule","Gastrointestinal bicarbonate loss"],"answer":0,"explanation":"Type 1 (distal) renal tubular acidosis results from failure of α-intercalated cells to secrete H+, so urine cannot be acidified below pH 5.5. It causes hypokalemia and calcium phosphate stones, because alkaline urine and acidosis-driven bone buffering increase urinary calcium phosphate. Causes include Sjögren syndrome, amphotericin B, and lithium. Type 2 (proximal) RTA involves bicarbonate wasting (e.g., Fanconi syndrome), and type 4 RTA involves hypoaldosteronism with hyperkalemia.","ko":"1형(원위) RTA: H+ 분비 장애, 소변 pH >5.5, 저칼륨, Ca 인산 결석. 4형은 고칼륨."},{"id":"rn08","steps":["1"],"system":"Renal","discipline":"Pharmacology","topic":"Calcium gluconate in hyperkalemia","stem":"A 66-year-old man with end-stage kidney disease misses two dialysis sessions. Serum potassium is 7.4 mEq/L, and ECG shows peaked T waves and a widened QRS complex. The first medication given is IV calcium gluconate.\n\nWhich of the following best describes the effect of this medication?","options":["It stabilizes the cardiac myocyte membrane without lowering serum potassium","It binds potassium in the gastrointestinal tract","It shifts potassium into cells","It removes potassium from the blood by exchange for calcium","It increases renal potassium excretion"],"answer":0,"explanation":"In hyperkalemia with ECG changes, IV calcium is given first because it raises the threshold potential and restores the gap between resting and threshold potentials, protecting against arrhythmias within minutes. It does not lower serum potassium. Insulin with glucose and β2 agonists shift potassium into cells; potassium binders, diuretics, and dialysis remove it from the body.","ko":"고칼륨 + ECG 변화: 먼저 Ca gluconate(막 안정화, K 수치 변화 없음) → 인슐린·포도당."},{"id":"rn09","steps":["1"],"system":"Renal","discipline":"Immunology","topic":"Poststreptococcal glomerulonephritis","stem":"An 8-year-old boy is brought to the physician because of cola-colored urine and puffy eyelids for 2 days. Three weeks ago he had impetigo on his legs. Blood pressure is 138/90 mm Hg. Urinalysis shows red blood cell casts and mild proteinuria. Serum C3 is low.\n\nWhich of the following is the primary mechanism of this patient's kidney disease?","options":["Podocyte injury by circulating T-cell cytokines","Deposition of immune complexes in the glomeruli","Antibodies directed against type IV collagen","Complement activation by IgA in the mesangium","Direct bacterial infection of the glomeruli"],"answer":1,"explanation":"Poststreptococcal glomerulonephritis is a type III hypersensitivity reaction in which immune complexes containing streptococcal antigens deposit in the glomeruli and activate complement, lowering C3. It follows pharyngitis or skin infection by 1 to 3 weeks and causes nephritic syndrome. Immunofluorescence shows granular (lumpy-bumpy) IgG and C3, and electron microscopy shows subepithelial humps. Most children recover fully.","ko":"PSGN: 감염 1~3주 후, 3형 과민반응, C3↓, subepithelial hump."},{"id":"rn10","steps":["1"],"system":"Renal","discipline":"Immunology","topic":"Anti-GBM disease","stem":"A 24-year-old man comes to the emergency department because of coughing up blood and dark urine for 3 days. Serum creatinine is 4.2 mg/dL, and urinalysis shows red blood cell casts. Kidney biopsy shows crescents in most glomeruli, and immunofluorescence shows linear deposition of IgG along the glomerular basement membrane.\n\nThe antibodies in this disease are directed against which of the following?","options":["Proteinase 3","Phospholipase A2 receptor","Streptococcal antigens","The α3 chain of type IV collagen","Double-stranded DNA"],"answer":3,"explanation":"Anti-glomerular basement membrane disease (Goodpasture syndrome when the lungs are involved) is a type II hypersensitivity reaction against the noncollagenous domain of the α3 chain of type IV collagen in glomerular and alveolar basement membranes. It causes rapidly progressive crescentic glomerulonephritis with linear IgG deposits and pulmonary hemorrhage. Treatment is plasmapheresis plus immunosuppression. Proteinase 3 antibodies (c-ANCA) suggest granulomatosis with polyangiitis, which has pauci-immune staining.","ko":"Goodpasture = 4형 콜라겐 α3 항체, 선형 IgG, 객혈 + 신염."},{"id":"rn11","steps":["1"],"system":"Renal","discipline":"Pathology","topic":"IgA nephropathy","stem":"A 22-year-old man notices red urine 2 days after the onset of an upper respiratory infection. He had a similar episode a year ago. Blood pressure and serum creatinine are normal, and serum complement levels are normal.\n\nA kidney biopsy specimen would most likely show which of the following?","options":["Mesangial IgA deposits","Subepithelial immune complex humps","Effacement of foot processes only","Linear IgG along the basement membrane","Splitting of the basement membrane"],"answer":0,"explanation":"IgA nephropathy (Berger disease) is the most common glomerulonephritis worldwide. It typically causes episodes of gross hematuria within 1 to 2 days of a mucosal infection, when IgA production increases. Abnormally glycosylated IgA forms immune complexes that deposit in the mesangium. Complement is normal. Poststreptococcal GN, in contrast, follows infection by 1 to 3 weeks and has low C3. IgA vasculitis (Henoch-Schönlein purpura) is the systemic form.","ko":"IgA 신병증: 상기도감염 1~2일 내 혈뇨, 메산지움 IgA, 보체 정상."},{"id":"rn12","steps":["1"],"system":"Renal","discipline":"Pathology","topic":"Membranous nephropathy","stem":"A 57-year-old man comes to the physician because of leg swelling and foamy urine for 2 months. Urine protein excretion is 7 g/24 h. Serum albumin is 2.1 g/dL and cholesterol is elevated. Serum antibodies to the phospholipase A2 receptor are positive.\n\nThis patient is at greatest risk for which of the following complications?","options":["Malignant hypertension","Pulmonary hemorrhage","Renal vein thrombosis","Hyperkalemic renal tubular acidosis","Rapidly progressive crescentic glomerulonephritis"],"answer":2,"explanation":"Membranous nephropathy is a common cause of nephrotic syndrome in adults. Primary disease is caused by antibodies to the phospholipase A2 receptor on podocytes; secondary causes include hepatitis B, solid tumors, SLE, and drugs such as NSAIDs. Electron microscopy shows subepithelial deposits with a spike-and-dome appearance. Nephrotic syndrome causes a hypercoagulable state from urinary loss of antithrombin III, and renal vein thrombosis is particularly associated with membranous nephropathy.","ko":"막성 신병증: 성인 신증후군, anti-PLA2R, spike-and-dome, 신정맥 혈전 위험."},{"id":"rn13","steps":["1"],"system":"Renal","discipline":"Pathology","topic":"Diabetic nephropathy","stem":"A 61-year-old woman has had type 2 diabetes mellitus for 18 years. Urine albumin excretion has gradually increased to the nephrotic range, and her creatinine is rising. A kidney biopsy is performed.\n\nWhich of the following findings is most characteristic of her kidney disease?","options":["Mesangial IgA deposits","Nodular, PAS-positive mesangial sclerosis","Subepithelial humps","Crescent formation in Bowman space","Wire-loop lesions with subendothelial deposits"],"answer":1,"explanation":"Diabetic nephropathy results from nonenzymatic glycation of the basement membrane and hyperfiltration caused by efferent arteriolar constriction. Findings include thickened basement membranes, diffuse mesangial expansion, and nodular glomerulosclerosis (Kimmelstiel-Wilson nodules), along with hyaline arteriolosclerosis of both afferent and efferent arterioles. ACE inhibitors, ARBs, and SGLT2 inhibitors slow progression. Wire-loop lesions indicate diffuse proliferative lupus nephritis.","ko":"당뇨병성 신증 = Kimmelstiel-Wilson 결절. ACEi/ARB·SGLT2i로 진행 억제."},{"id":"rn14","steps":["1"],"system":"Renal","discipline":"Pathology","topic":"FSGS in HIV","stem":"A 36-year-old Black man with untreated HIV infection comes to the physician because of severe leg edema. Urine protein excretion is 9 g/24 h, and serum creatinine is 2.8 mg/dL. Ultrasonography shows enlarged, echogenic kidneys.\n\nWhich of the following is the most likely diagnosis?","options":["Minimal change disease","IgA nephropathy","Collapsing focal segmental glomerulosclerosis","Rapidly progressive glomerulonephritis","Membranoproliferative glomerulonephritis"],"answer":2,"explanation":"Focal segmental glomerulosclerosis is a common cause of nephrotic syndrome in adults and is more frequent in Black patients, partly because of APOL1 risk variants. Secondary causes include HIV, heroin use, obesity, sickle cell disease, and reduced nephron mass. HIV-associated nephropathy causes the collapsing variant, which progresses rapidly to kidney failure. Light microscopy shows segmental sclerosis of some glomeruli, and electron microscopy shows foot process effacement.","ko":"HIV·헤로인·APOL1 신증후군 = FSGS (HIV는 collapsing 변이)."},{"id":"rn15","steps":["1"],"system":"Renal","discipline":"Microbiology","topic":"Struvite stones","stem":"A 54-year-old woman with recurrent urinary tract infections has right flank pain. CT shows a large branching calculus filling the right renal pelvis and calyces. Urine pH is 8.0, and urine culture grows a highly motile gram-negative rod that swarms on agar.\n\nWhich bacterial enzyme is most responsible for formation of this stone?","options":["Catalase","Hyaluronidase","Coagulase","Urease","β-Lactamase"],"answer":3,"explanation":"Proteus mirabilis (and other urease producers such as Klebsiella) splits urea into ammonia and CO2, alkalinizing the urine and causing precipitation of magnesium ammonium phosphate (struvite). Struvite stones can grow into large staghorn calculi that serve as a reservoir for infection. They must be removed surgically and the infection eradicated. Proteus swarms on agar plates.","ko":"Struvite(staghorn) 결석 = urease 생성균(Proteus), 알칼리 소변."},{"id":"rn16","steps":["1"],"system":"Renal","discipline":"Biochemistry","topic":"Cystinuria","stem":"A 16-year-old boy has had several kidney stones since age 12. Urinalysis shows flat, hexagonal crystals, and the urinary sodium cyanide-nitroprusside test is positive. His sister also has kidney stones.\n\nWhich of the following best describes the underlying defect?","options":["Deficiency of an enzyme in the urea cycle","Overproduction of oxalate by the liver","Defective excretion of uric acid","Increased intestinal absorption of calcium","Defective proximal tubule reabsorption of dibasic amino acids"],"answer":4,"explanation":"Cystinuria is an autosomal recessive defect of the proximal tubule transporter for cystine, ornithine, lysine, and arginine (COLA). Cystine is poorly soluble and forms hexagonal crystals and radiolucent stones, often from childhood. Treatment includes high fluid intake, urine alkalinization, and chelating agents such as penicillamine or tiopronin. Cystinosis, a different disorder, is a lysosomal storage disease.","ko":"Cystinuria: 근위세뇨관 COLA 재흡수 결함, 육각형 결정, nitroprusside(+)."},{"id":"rn17","steps":["1"],"system":"Renal","discipline":"Pathology","topic":"Acute tubular necrosis","stem":"A 68-year-old man undergoes repair of a ruptured abdominal aortic aneurysm and has a prolonged period of hypotension during surgery. Over the next 2 days, his urine output falls and his creatinine rises from 1.0 to 3.8 mg/dL. Urine sediment shows many muddy brown granular casts. Fractional excretion of sodium is 3.5%.\n\nWhich of the following is the most likely diagnosis?","options":["Ischemic acute tubular necrosis","Renal papillary necrosis","Acute interstitial nephritis","Postrenal obstruction","Prerenal azotemia"],"answer":0,"explanation":"Acute tubular necrosis is the most common cause of intrinsic acute kidney injury and can be ischemic (hypotension) or nephrotoxic (aminoglycosides, contrast, myoglobin). The straight segment of the proximal tubule and the thick ascending limb are most vulnerable to ischemia. Necrotic cells slough into the lumen, forming muddy brown granular casts, and damaged tubules cannot reabsorb sodium, so FENa is above 2%. In prerenal azotemia, the tubules work, FENa is below 1%, and the BUN-to-creatinine ratio is above 20.","ko":"ATN: muddy brown cast, FENa >2%. 신전성은 FENa \u003c1%, BUN/Cr >20."},{"id":"rn18","steps":["1"],"system":"Renal","discipline":"Immunology","topic":"Acute interstitial nephritis","stem":"A 45-year-old woman is treated with nafcillin for cellulitis. Ten days later she develops fever and a diffuse maculopapular rash, and her serum creatinine rises from 0.8 to 2.4 mg/dL. Urinalysis shows white blood cell casts, and urine eosinophils are present. Urine culture is negative.\n\nWhich of the following is the most likely diagnosis?","options":["Renal artery thrombosis","Acute pyelonephritis","Poststreptococcal glomerulonephritis","Acute tubular necrosis","Acute interstitial nephritis"],"answer":4,"explanation":"Acute interstitial nephritis is a drug-induced hypersensitivity reaction, often type IV, that causes interstitial inflammation with lymphocytes and eosinophils. Common causes include penicillins, cephalosporins, NSAIDs, PPIs, sulfonamides, diuretics, and rifampin. It presents 1 to 2 weeks after starting the drug with fever, rash, eosinophilia, white cell casts, and sterile pyuria. Treatment is stopping the drug, sometimes with corticosteroids.","ko":"약물 후 발열·발진·호산구뇨 + WBC cast(무균) → 급성 간질성 신염."},{"id":"rn19","steps":["1"],"system":"Renal","discipline":"Pathology","topic":"ADPKD associations","stem":"A 41-year-old man has intermittent flank pain and hematuria. His blood pressure is 158/96 mm Hg. Ultrasonography shows bilaterally enlarged kidneys with numerous cysts. His father had kidney failure and died of a sudden severe headache at age 52.\n\nWhich of the following conditions is most strongly associated with this patient's disease?","options":["Saccular aneurysm of the circle of Willis","Coarctation of the aorta","Congenital hepatic fibrosis","Pulmonary hypoplasia","Retinal hemangioblastoma"],"answer":0,"explanation":"Autosomal dominant polycystic kidney disease, usually caused by PKD1 mutations on chromosome 16 (polycystin-1), causes bilateral kidney enlargement, hypertension, hematuria, and progressive kidney failure in adulthood. Extrarenal features include berry aneurysms that can cause subarachnoid hemorrhage, hepatic cysts, mitral valve prolapse, and colonic diverticula. Autosomal recessive PKD presents in infancy with congenital hepatic fibrosis and, if severe, Potter sequence with pulmonary hypoplasia.","ko":"ADPKD(PKD1, 16번): 베리 동맥류(지주막하출혈)·간낭종·MVP."},{"id":"rn20","steps":["1"],"system":"Renal","discipline":"Pathology","topic":"Renal cell carcinoma","stem":"A 63-year-old man who smokes has flank pain and visible hematuria. Examination shows a palpable left flank mass and a left-sided scrotal varicocele that does not decompress when he lies down. Hemoglobin is 18.6 g/dL. CT shows a solid mass in the left kidney extending into the left renal vein.\n\nLoss of which of the following tumor suppressor genes is most often involved in this tumor?","options":["WT1 on chromosome 11p","VHL on chromosome 3p","TP53 on chromosome 17p","RB1 on chromosome 13q","APC on chromosome 5q"],"answer":1,"explanation":"Clear cell renal cell carcinoma, the most common type, originates from proximal tubule cells and is associated with loss of the VHL gene on chromosome 3p, which increases HIF and drives VEGF and erythropoietin production. It presents with hematuria, flank pain, and a mass, and causes paraneoplastic syndromes such as polycythemia (EPO), hypercalcemia (PTHrP), and hypertension (renin). Invasion of the left renal vein blocks the left gonadal vein, causing a left varicocele.","ko":"RCC: VHL(3p), 다혈구증(EPO), 신정맥 침범 → 좌측 정계정맥류."},{"id":"rn21","steps":["1"],"system":"Renal","discipline":"Pathology","topic":"Wilms tumor","stem":"A 3-year-old boy is brought to the physician because his mother felt a firm mass in his abdomen while bathing him. He has no irises in either eye and has hypospadias. CT shows a large, solid mass arising from the left kidney.\n\nDeletion of which of the following chromosomal regions is most likely?","options":["22q11","11p13","13q14","17q11","3p25"],"answer":1,"explanation":"Wilms tumor (nephroblastoma) is the most common renal malignancy of early childhood and presents as a large, palpable flank mass that does not cross the midline. It is associated with loss of the WT1 gene on chromosome 11p13. WAGR syndrome (Wilms tumor, aniridia, genitourinary anomalies, and intellectual disability) results from a contiguous deletion that includes WT1 and PAX6. Beckwith-Wiedemann syndrome (11p15) and Denys-Drash syndrome also increase the risk.","ko":"Wilms: WT1(11p13), WAGR (무홍채·비뇨생식기 이상)."},{"id":"rn22","steps":["1"],"system":"Renal","discipline":"Physiology","topic":"Central diabetes insipidus","stem":"A 30-year-old man has had polyuria and intense thirst since a skull base fracture 3 weeks ago. Serum sodium is 149 mEq/L and urine osmolality is 110 mOsm/kg. After 6 hours of water deprivation, urine osmolality remains 120 mOsm/kg. After administration of desmopressin, urine osmolality rises to 480 mOsm/kg.\n\nWhich of the following is the most likely diagnosis?","options":["Central diabetes insipidus","Osmotic diuresis","Syndrome of inappropriate antidiuretic hormone secretion","Primary polydipsia","Nephrogenic diabetes insipidus"],"answer":0,"explanation":"In central diabetes insipidus, the posterior pituitary or hypothalamus fails to release ADH after trauma, surgery, or tumors. Urine stays dilute during water deprivation but concentrates substantially after desmopressin because the collecting duct responds normally. In nephrogenic DI, desmopressin has little effect. In primary polydipsia, serum sodium is low-normal and urine concentrates with water deprivation.","ko":"중추성 DI: 수분 제한에도 소변 묽음 → desmopressin 후 농축(>50%)."},{"id":"rn23","steps":["1"],"system":"Renal","discipline":"Pharmacology","topic":"Lithium nephrogenic DI","stem":"A 47-year-old woman with bipolar disorder has taken lithium for 10 years. She now urinates large volumes day and night. Urine osmolality is low and does not increase after desmopressin. Her psychiatrist wants to continue lithium.\n\nWhich of the following drugs is most appropriate to reduce her urine output?","options":["Demeclocycline","Amiloride","Desmopressin","Furosemide","Tolvaptan"],"answer":1,"explanation":"Lithium causes nephrogenic diabetes insipidus by entering collecting duct principal cells through the epithelial sodium channel (ENaC) and impairing aquaporin-2 expression. Amiloride blocks ENaC, reducing lithium entry into these cells, and is preferred for lithium-induced nephrogenic DI. Thiazides and NSAIDs are also used for nephrogenic DI. Demeclocycline and vasopressin receptor antagonists such as tolvaptan cause nephrogenic DI and are used to treat SIADH.","ko":"Lithium 신성 DI → amiloride (ENaC 통한 리튬 유입 차단)."},{"id":"rn24","steps":["1"],"system":"Renal","discipline":"Anatomy","topic":"Potter sequence","stem":"A male infant is born at 36 weeks' gestation and dies shortly after birth despite resuscitation. Prenatal ultrasonography had shown severe oligohydramnios. He has a flattened nose, low-set ears, a receding chin, and clubbed feet. Autopsy shows that neither kidney is present.\n\nWhich of the following was the most likely direct cause of death?","options":["Acute kidney failure with hyperkalemia","Intracranial hemorrhage","Pulmonary hypoplasia","Congenital heart disease","Sepsis"],"answer":2,"explanation":"Bilateral renal agenesis, from failure of the ureteric bud to interact with the metanephric mesenchyme, means the fetus makes no urine, causing oligohydramnios. Low amniotic fluid compresses the fetus (flat face, limb deformities) and prevents normal lung development. Pulmonary hypoplasia is the cause of death in Potter sequence. Other causes include ARPKD and posterior urethral valves.","ko":"Potter sequence: 양측 신장 무형성 → 양수과소 → 폐 형성부전(사인)."},{"id":"rn25","steps":["1"],"system":"Renal","discipline":"Anatomy","topic":"Horseshoe kidney","stem":"A 14-year-old girl with short stature, a webbed neck, and primary amenorrhea undergoes abdominal imaging, which shows that the lower poles of her two kidneys are fused across the midline.\n\nDuring development, ascent of this structure was most likely stopped by which of the following?","options":["Left renal vein","Inferior mesenteric artery","Celiac trunk","Superior mesenteric artery","Aortic bifurcation"],"answer":1,"explanation":"In horseshoe kidney, the inferior poles fuse during development and the joined kidney becomes trapped beneath the inferior mesenteric artery as it ascends from the pelvis. It is associated with Turner syndrome and trisomies 13, 18, and 21. It is usually asymptomatic but increases the risk of ureteropelvic junction obstruction, hydronephrosis, stones, infection, and some kidney tumors.","ko":"말굽신 = 하극 융합, IMA에 걸려 상승 실패. Turner 연관."},{"id":"rn26","steps":["1"],"system":"Renal","discipline":"Physiology","topic":"Fanconi syndrome","stem":"A 45-year-old man with HIV has taken a tenofovir disoproxil-containing regimen for 5 years. He now has bone pain and weakness. Laboratory studies show a non-anion gap metabolic acidosis, hypophosphatemia, and hypokalemia. Urinalysis shows glucose and amino acids, while his blood glucose is normal.\n\nWhich part of the nephron is primarily dysfunctional?","options":["Glomerulus","Distal convoluted tubule","Cortical collecting duct","Proximal convoluted tubule","Thick ascending limb"],"answer":3,"explanation":"Fanconi syndrome is generalized dysfunction of the proximal tubule, which normally reabsorbs most filtered glucose, amino acids, phosphate, bicarbonate, and uric acid. Losses cause glucosuria with normal blood glucose, aminoaciduria, phosphaturia (osteomalacia and rickets), and type 2 RTA. Causes include tenofovir, ifosfamide, expired tetracyclines, cisplatin, multiple myeloma (light chains), Wilson disease, and cystinosis.","ko":"Fanconi 증후군 = 근위세뇨관 전반 장애: 요당(혈당 정상)·아미노산뇨·인산뇨·2형 RTA. Tenofovir·ifosfamide."},{"id":"rn27","steps":["1"],"system":"Renal","discipline":"Physiology","topic":"Gitelman syndrome","stem":"A 22-year-old woman has muscle cramps and fatigue. Blood pressure is normal. Laboratory studies show hypokalemia, metabolic alkalosis, hypomagnesemia, and low urinary calcium. Plasma renin and aldosterone are elevated. She denies using diuretics or vomiting.\n\nThis condition resembles the chronic use of which of the following drugs?","options":["Hydrochlorothiazide","Amiloride","Furosemide","Acetazolamide","Spironolactone"],"answer":0,"explanation":"Gitelman syndrome is an autosomal recessive defect of the Na+/Cl− cotransporter in the distal convoluted tubule, mimicking a thiazide diuretic: hypokalemia, metabolic alkalosis, hypomagnesemia, hypocalciuria, and normal blood pressure. Bartter syndrome affects the thick ascending limb (NKCC2 and related channels), mimics a loop diuretic, presents earlier, and causes hypercalciuria. Liddle syndrome causes hypertension with low renin and aldosterone.","ko":"Gitelman = DCT NCC 결함(thiazide 유사), 저Mg·저칼슘뇨. Bartter = TAL(loop 유사), 고칼슘뇨."},{"id":"rn28","steps":["1"],"system":"Renal","discipline":"Physiology","topic":"Liddle syndrome","stem":"A 19-year-old man has severe hypertensi
