let samplePromise=null;
function getSample(){
  if(!window.claude||!window.claude.use)return Promise.resolve(null);
  if(!samplePromise)samplePromise=claude.use("sample").catch(()=>null);
  return samplePromise;
}
const SAMPLE_COPY={not_granted:"Claude 사용이 허용되지 않았어요. 아티팩트의 권한 메뉴에서 허용할 수 있어요.",sampling_disabled:"이 계정에서는 Claude 호출을 쓸 수 없어요.",rate_limited:"사용량 한도에 걸렸어요. 잠시 후 다시 눌러 주세요.",invalid_json:"응답 형식이 맞지 않았어요. 다시 시도해 주세요.",session_expired:"다시 로그인해 주세요.",refused:"이 요청은 처리되지 않았어요. 다른 계통으로 시도해 보세요."};
function sampleMsg(e){return SAMPLE_COPY[e&&e.code]||"연결 문제로 실패했어요. 다시 시도해 주세요."}

function cleanAI(x,step){
  if(!x||typeof x.stem!=="string"||!Array.isArray(x.options)||x.options.length!==5)return null;
  const ans=Number(x.answer);if(!(ans>=0&&ans<=4))return null;
  const opts=x.options.map(o=>String(o).replace(/^\s*[A-E][\.\):]\s+/,""));
  const order=shuffle([0,1,2,3,4]);
  return{
    id:"ai"+Date.now().toString(36)+Math.random().toString(36).slice(2,7),
    ai:true,steps:[step],
    system:SYSTEMS.includes(x.system)?x.system:"General Principles",
    discipline:DISCIPLINES.includes(x.discipline)?x.discipline:"Pathology",
    topic:String(x.topic||"").slice(0,80),
    stem:x.stem.slice(0,3000),
    options:order.map(i=>opts[i].slice(0,300)),
    answer:order.indexOf(ans),
    explanation:String(x.explanation||"").slice(0,3000),
    ko:String(x.ko||"").slice(0,300),
    created:today()
  };
}
async function generate(){
  if(S.gen.busy)return;
  const sample=await getSample();
  if(!sample){S.gen.msg="이 화면에서는 AI 문제 생성을 쓸 수 없어요. claude.ai에서 열어 주세요.";render();return}
  const step=P.settings.step;
  const sys=S.gen.sys==="auto"?weakest():S.gen.sys;
  const avoid=allQ().filter(q=>q.system===sys).map(q=>q.topic).filter(Boolean).join("; ");
  const prompt=`You write ORIGINAL USMLE ${STEP_LABEL[step]}-style single-best-answer questions for a physician restudying after years away.

Write 5 new questions. Organ system / area: ${sys}. Vary the disciplines and the topics.
Do not repeat these topics already in the learner's bank: ${avoid}

Rules:
- English clinical vignette in NBME style: age/sex, presentation, relevant history, vitals with units, exam, and labs or imaging when useful (one lab per line). End with a one-sentence lead-in question.
- ${step==="1"?"Test mechanisms, pathophysiology, pharmacology, microbiology and basic science applied to the case. Prefer two-step reasoning (identify the disease, then ask about its mechanism, cause, or associated finding).":"Test diagnosis, next best step in management, and current guideline-based care."}
- Exactly 5 options, one best answer, plausible distractors from the same category. No "all of the above".
- "explanation": 3-5 English sentences: why the answer is right and why the strongest distractors are wrong.
- "ko": one short Korean high-yield takeaway line.
- Medically accurate and current. Write everything yourself; do not reproduce items from UWorld, NBME, AMBOSS, First Aid or any commercial source.

Reply with only a JSON array of 5 objects:
[{"system":"${sys}","discipline":one of ${JSON.stringify(DISCIPLINES)},"topic":"short topic name","stem":"vignette and lead-in","options":["...","...","...","...","..."],"answer":0-4 index,"explanation":"...","ko":"..."}]`;
  S.gen.busy=true;S.gen.msg=(SYS_KO[sys]||sys)+" 문제를 만드는 중이에요. 30초~1분 정도 걸려요.";render();
  try{
    const out=await sample.json(prompt,{cache:false});
    const list=(Array.isArray(out)?out:[]).map(x=>cleanAI(x,step)).filter(Boolean);
    if(!list.length)throw{code:"invalid_json"};
    await saveAIQ(list);QMAP.clear();
    S.gen.msg=list.length+"문제를 추가했어요 ("+(SYS_KO[sys]||sys)+"). 새 문제로 바로 나와요.";
  }catch(e){S.gen.msg=sampleMsg(e)}
  S.gen.busy=false;render();
}
async function askClaude(q){
  const sample=await getSample();
  const a=S.asks[q.id]={text:"",busy:true,err:""};
  if(!sample){a.busy=false;a.err="이 화면에서는 Claude 질문을 쓸 수 없어요.";render();return}
  render();
  const L="ABCDE";const mine=S.picked[q.id];
  const mineTxt=mine==null?"no answer":L[mine];
  const prompt=`A physician studying for the USMLE answered this question.

${q.stem}

${q.options.map((o,i)=>L[i]+". "+o).join("\n")}

Correct answer: ${L[q.answer]}. Their answer: ${mineTxt}.
Reference explanation: ${q.explanation}

In Korean (medical terms may stay in English), explain in at most 180 words: the key reasoning step to reach ${L[q.answer]}, ${mine===q.answer?"the trap in the most tempting distractor":mine==null?"what clue they should have used":"why "+L[mine]+" is wrong"}, and one related high-yield fact. Plain text, no markdown headings.`;
  try{
    await sample(prompt,{onText:({text})=>{a.text=text;const el=document.getElementById("ask-"+q.id);if(el)el.textContent=text}});
  }catch(e){a.err=sampleMsg(e);if(e&&e.text)a.text=e.text}
  a.busy=false;render();
}

  const inProgress=(()=>{const s=savedSession();return s&&s.chal===c.id})();
  return h("div",{class:"stack"},
    h("div",{},h("div",{class:"label"},"Challenge · "+fmtDate(c.created)),h("h1",{},c.n+"문제 도전 · "+pname(c.by))),
    h("div",{class:"panel stack"},
      h("h2",{},"순위"),
      rs.length?h("div",{class:"lb"},rs.map((r,i)=>h("div",{class:"r"+(i===0?" top":"")+(r.pid===PID?" me":"")},
        h("span",{class:"rk"},i+1),
        h("div",{style:"min-width:0"},h("div",{class:"nm"},pname(r.pid)+(r.pid===PID?" (나)":"")),h("div",{class:"sub num"},"시간 "+fmtTime(r.time)+" · "+fmtDate(r.at))),
        h("span",{class:"val"},r.score+"/"+r.n+" ("+Math.round(r.score/r.n*100)+"%)")))):
        h("p",{class:"small muted",style:"margin:0"},"아직 아무도 풀지 않았어요."),
      !mine?h("button",{class:"btn primary big",id:"take-chal",onclick:()=>startChallenge(c)},inProgress?"이어서 풀기":"도전하기 · "+fmtTime(c.n*SEC_PER_Q)):null),
    mine?h("div",{class:"panel stack"},
      h("div",{class:"row between"},h("h2",{},"문항별 비교"),h("span",{class:"small muted"},"눌러서 해설")),
      h("div",{class:"rlist"},c.ids.map((id,k)=>{const q=qById(id);if(!q)return null;
        return h("button",{id:"cq-"+k,onclick:()=>reviewChallenge(c,k)},
          h("span",{class:"mk num"},k+1),
          h("span",{style:"min-width:0"},h("b",{},q.topic||SYS_KO[q.system]),
            h("div",{class:"marks"},rs.map(r=>{const p=r.picks?r.picks[k]:-1;const ok=p===q.answer;
              return h("span",{class:ok?"ok":"bad"},pname(r.pid).slice(0,6)+(ok?" ✓":" ✗"))}))),
          h("span",{}))}))):
      h("p",{class:"small muted"},"직접 풀고 나면 문항별 비교와 해설을 볼 수 있어요."),
    back
  );
}
function friendsTeaser(){
  if(!DB||S.players.length<2)return null;
  const rows=boardRows().sort((a,b)=>b.wn-a.wn);
  const myRank=rows.findIndex(r=>r.id===PID)+1;
  const open=S.chals.filter(c=>c.by!==PID&&!myResult(c.id)).length;
  return h("button",{class:"banner",id:"teaser",style:"border:0;text-align:left;cursor:pointer;width:100%",onclick:()=>{S.view="friends";render();window.scrollTo(0,0)}},
    h("div",{},h("b",{},"이번 주 "+(myRank||"–")+"위 / "+rows.length+"명"),h("div",{class:"small muted"},"1위 "+pname(rows[0].id)+" · "+rows[0].wn+"문제")),
    open?h("span",{class:"badge"},"새 도전장 "+open):h("span",{class:"small muted"},"친구 탭 →"));
}
function viewStats(){
  const recs=Object.entries(P.rec).filter(([id])=>qById(id));
  const n=recs.reduce((s,[,r])=>s+r.n,0),c=recs.reduce((s,[,r])=>s+r.c,0);
  const sys=bySystem(),disc=byDiscipline();
  const totals={};for(const q of allQ())totals[q.system]=(totals[q.system]||0)+1;
  const tomorrow=addDays(today(),1);
  const dueTom=recs.filter(([,r])=>r.due<=tomorrow).length;
  const mastered=recs.filter(([,r])=>r.b>=3).length;
  const missed=recs.filter(([,r])=>r.lastOk===false).length;
  return h("div",{class:"stack"},
    h("h1",{},"통계"),
    h("div",{class:"kpis"},
      h("div",{class:"kpi"},h("span",{class:"label"},"누적 풀이"),h("b",{},n)),
      h("div",{class:"kpi"},h("span",{class:"label"},"정답률"),h("b",{},n?Math.round(c/n*100)+"%":"–")),
      h("div",{class:"kpi"},h("span",{class:"label"},"진도"),h("b",{},Math.round(recs.length/allQ().length*100)+"%"))),
    h("div",{class:"panel stack"},h("div",{class:"row between"},h("h2",{},"계통별 정답률"),h("span",{class:"small muted"},"정답률 · 푼 문제/전체")),
      SYSTEMS.map(s=>sys[s]?sysRow(SYS_KO[s],sys[s],totals[s]):h("div",{class:"sysrow"},h("span",{class:"muted"},SYS_KO[s]),h("div",{class:"meter"}),h("span",{class:"num small muted",style:"text-align:right"},"0/"+(totals[s]||0))))),
    Object.keys(disc).length?h("div",{class:"panel stack"},h("h2",{},"과목별 정답률"),
      DISCIPLINES.filter(d=>disc[d]).map(d=>sysRow(d,disc[d]))):null,
    h("div",{class:"panel stack"},h("h2",{},"복습 현황"),
      h("div",{class:"small"},"문제은행 "+allQ().length+"개 (기본 "+BANK.length+" · AI "+AIQ.length+") · 푼 문제 "+recs.length+"개"),
      h("div",{class:"small"},"마지막에 틀린 문제 "+missed+"개 · 표시한 문제 "+Object.keys(P.flags).length+"개"),
      h("div",{class:"small"},"내일까지 복습할 문제 "+dueTom+"개 · 3회 이상 연속 정답 "+mastered+"개"),
      h("div",{class:"small muted"},"틀린 문제는 다음 날, 맞힌 문제는 2·4·8·16·32일 간격으로 다시 나와요."))
  );
}
function viewSettings(){
  const st=P.settings;
  const set=(k,v)=>{st[k]=v;persist();render()};
  return h("div",{class:"stack"},
    h("h1",{},"설정"),
    h("div",{class:"panel stack"},
      h("label",{class:"field"},h("span",{class:"label"},"준비하는 시험"),
        h("select",{id:"set-step",onchange:e=>set("step",e.target.value)},Object.entries(STEP_LABEL).map(([k,v])=>h("option",{value:k,selected:st.step===k},v)))),
      h("label",{class:"field"},h("span",{class:"label"},"하루 목표 문제 수"),
        h("select",{id:"set-goal",onchange:e=>set("goal",Number(e.target.value))},[10,20,40,80].map(n=>h("option",{value:n,selected:Number(st.goal)===n},n+"문제")))),
      h("label",{class:"field"},h("span",{class:"label"},"시험일 (D-day 표시)"),
        h("input",{type:"date",id:"set-exam",value:st.exam||"",onchange:e=>set("exam",e.target.value)}))),
    h("div",{class:"panel stack"},
      h("h2",{},"저장"),
      window.__auth?
        (window.__auth.user?
          h("div",{class:"row between"},h("span",{class:"small"},"Google 계정("+(window.__auth.user.name||"로그인됨")+")에 저장돼요. 폰과 PC에서 이어서 풀 수 있어요."),
            h("button",{class:"btn",id:"signout",onclick:()=>window.__auth.signOut()},"로그아웃")):
          h("div",{class:"row between"},h("span",{class:"small"},"지금은 이 브라우저에만 저장돼요. 로그인하면 계정에 저장돼요."),
            h("button",{class:"btn primary",id:"signin2",onclick:()=>window.__auth.signIn()},"Google 로그인"))):
        h("div",{class:"small"},SYNC==="cloud"?"claude.ai 계정에 저장돼요. 폰과 PC에서 같은 기록을 이어서 볼 수 있어요.":"이 브라우저에만 저장돼요. claude.ai에 로그인해서 열면 계정에 저장돼요."),
      S.confirmReset?h("div",{class:"row"},
        h("span",{class:"small"},"풀이 기록과 표시를 모두 지울까요? AI 문제는 남아요."),
        h("button",{class:"btn danger",id:"reset-yes",onclick:()=>{P=norm({settings:P.settings});S.confirmReset=false;clearSession();persist();render()}},"기록 삭제"),
        h("button",{class:"btn",id:"reset-no",onclick:()=>{S.confirmReset=false;render()}},"취소")):
        h("button",{class:"btn danger",id:"reset",onclick:()=>{S.confirmReset=true;render()}},"풀이 기록 초기화"))
  );
}

function render(){
  const app=document.getElementById("app");
  const v=S.view;
  app.replaceChildren(v==="quiz"?viewQuiz():v==="done"?viewDone():v==="block"?viewBlock():v==="friends"?viewFriends():v==="chal"?viewChal():v==="stats"?viewStats():v==="settings"?viewSettings():viewHome());
  const tabs=document.getElementById("tabs");
  tabs.hidden=v==="quiz";
  for(const b of tabs.querySelectorAll("button"))b.setAttribute("aria-current",String(b.dataset.v===v||(v==="done"&&b.dataset.v==="home")||(v==="chal"&&b.dataset.v==="friends")));
}
document.getElementById("tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;S.view=b.dataset.v;S.confirmReset=false;render();window.scrollTo(0,0)});

render();
initCloud();
</script>
